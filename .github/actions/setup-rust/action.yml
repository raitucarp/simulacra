name: Set up Rust
description: >
  Installs the toolchain pinned in rust-toolchain.toml (plus an extra target when asked), the
  system libraries gpui and the native file dialog link against on Linux, and, when a cache key is
  given, restores and saves the compiled dependencies.

inputs:
  target:
    description: Extra compilation target to install, for example aarch64-apple-darwin.
    required: false
    default: ""
  cache-key:
    description: Shared cache key; leave empty to build without the Actions cache.
    required: false
    default: ""
  save-cache:
    description: Whether this job may save the cache ("true" or "false").
    required: false
    default: "false"
  linux-libraries:
    description: Install the Linux system libraries needed to compile ("false" for metadata-only jobs).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # rustup reads rust-toolchain.toml; no third-party toolchain action is needed.
    - name: Install the pinned toolchain
      shell: bash
      env:
        EXTRA_TARGET: ${{ inputs.target }}
      run: |
        rustup toolchain install --no-self-update
        if [ -n "$EXTRA_TARGET" ]; then rustup target add "$EXTRA_TARGET"; fi
        rustc --version

    # X11, Wayland, Vulkan and fonts for gpui; GTK 3 for the native file dialog.
    - name: Install Linux system libraries
      if: runner.os == 'Linux' && inputs.linux-libraries == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config clang \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
          libvulkan-dev libfontconfig1-dev libfreetype-dev libgtk-3-dev libasound2-dev \
          libssl-dev libzstd-dev

    # Caches only the dependencies (Simulacra itself always recompiles). The key includes the
    # rustc version, Cargo.lock and the CARGO_* settings, so a toolchain bump starts fresh.
    - name: Cache compiled dependencies
      if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-on-failure: true
