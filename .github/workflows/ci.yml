name: CI

# Every pull request and push to main: cargo check (warnings fail) and the full test suite on
# Linux, Windows and macOS. On main, once the tests pass, the installers are built too (as
# workflow artifacts), which also warms the release cache for the next tag. The Release workflow
# calls this workflow first, so nothing is published from a commit whose tests fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Check and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh
      # Pull requests restore main's cache but never save their own, so the 10 GB repo budget
      # holds the caches that every run can use.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Warnings fail the build. RUSTFLAGS is not used for this, because it would replace the
      # Windows stack-size flag set in .cargo/config.toml.
      - name: Check (no warnings allowed)
        shell: bash
        run: |
          cargo check --locked --all-targets 2>&1 | tee check.log
          if grep -E "^warning" check.log; then echo "::error::cargo check reported warnings"; exit 1; fi
      - name: Test
        run: cargo test --locked --no-fail-fast

  package:
    name: Installers
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
