name: CI

# Pull requests and pushes to main. Order:
#   1. changes: works out whether anything but documentation changed, and whether the docs site did.
#   2. Fast gates, in parallel: dependency policy (cargo-deny, plus dependency review on pull
#      requests) and the workflow security audit (zizmor).
#   3. Once both pass and code changed: clippy on Linux, and the test suite on Linux and Windows
#      (pull requests) or Linux, Windows and macOS (main, whose macOS minutes cost more).
#      Pull requests that touch the docs site (docs/) check and build it; docs.yml deploys it.
#   4. CI passed: one status for branch protection, green only when every job above succeeded
#      or was skipped on purpose.
# Installers are built only by the Release workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did anything but documentation change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          # The docs site (docs/) is built by the docs job below; its changes need no Rust build.
          if echo "$changed" | grep -qE '^docs/|^\.github/workflows/(ci|docs)\.yml$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qvE '(\.md$|^LICENSE|^docs/|^\.github/workflows/docs\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; the build and tests are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          linux-libraries: "false"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      # Vulnerabilities, licences, banned crates and allowed sources (deny.toml).
      - name: cargo deny check
        run: cargo deny --all-features check
      # What this pull request adds: new dependencies with known vulnerabilities fail it.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned actions, least-privilege tokens, no template injection, no cache poisoning.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  clippy:
    name: Clippy
    needs: [changes, dependencies, workflows]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          cache-key: clippy-Linux
          save-cache: "true"
      # The lint policy lives in Cargo.toml ([lints.clippy]); any remaining warning fails.
      - name: Clippy (no warnings allowed)
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    needs: [changes, dependencies, workflows]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Linux","os":"ubuntu-24.04"},{"name":"Windows","os":"windows-latest"}]' || '[{"name":"Linux","os":"ubuntu-24.04"},{"name":"Windows","os":"windows-latest"},{"name":"macOS","os":"macos-latest"}]') }}
    uses: $/.github/workflows/test.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}

  docs:
    name: Docs site
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      # MDX and links, then the static export that docs.yml deploys (next build type-checks).
      - name: Check pages and screenshots
        run: npm run check
      - name: Build
        run: npm run build

  passed:
    name: CI passed
    needs: [changes, dependencies, workflows, clippy, test, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped on purpose
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled."
          exit 1
      - run: echo "CI passed."
