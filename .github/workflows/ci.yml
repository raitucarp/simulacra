name: CI

# Every pull request and push to main: build every target (warnings fail) and run the full test
# suite. Pull requests test on Linux and Windows; main and releases add macOS, whose runner minutes
# cost ten times as much on a private repository. Installers are built only by the Release
# workflow, which calls this workflow first (unless CI already passed on the tagged commit), so
# nothing is published from a commit whose tests fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Check and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Linux","os":"ubuntu-24.04"},{"name":"Windows","os":"windows-latest"}]' || '[{"name":"Linux","os":"ubuntu-24.04"},{"name":"Windows","os":"windows-latest"},{"name":"macOS","os":"macos-latest"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Simulacra's own code is compiled without optimisation here: that compile is five to six
    # times faster than at the opt-level 1 of local test runs, and the suite still runs in seconds.
    # Dependencies keep opt-level 3 (Cargo.toml), so their cached builds are unaffected.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh
      # Compiled dependencies are cached per OS. A pull request restores its own cache or main's
      # and saves its own, so the next push to the same pull request starts warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ runner.os }}
          cache-on-failure: true
      # One compile covers every target (lib, binary, tests) and runs the tests; a
      # separate `cargo check` would compile the crate a second time. Warnings fail the job.
      # RUSTFLAGS is not used for that, because it would replace the Windows stack-size flag
      # set in .cargo/config.toml.
      - name: Build and test (no warnings allowed)
        shell: bash
        run: |
          cargo test --locked --no-fail-fast --all-targets 2>&1 | tee test.log
          if grep -E "^warning" test.log; then echo "::error::the build reported warnings"; exit 1; fi
