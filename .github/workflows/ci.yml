name: CI

# Every pull request and push to main: build every target (warnings fail) and run the full test
# suite on Linux, Windows and macOS. On main, once the tests pass, the installers are built too (as
# workflow artifacts), which also warms the release cache for the next tag. The Release workflow
# calls this workflow first, so nothing is published from a commit whose tests fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Check and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh
      # Compiled dependencies are cached per OS. A pull request restores its own cache or main's
      # and saves its own, so the next push to the same pull request starts warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ runner.os }}
          cache-on-failure: true
      # One compile covers every target (lib, binary, tests, examples) and runs the tests; a
      # separate `cargo check` would compile the crate a second time. Warnings fail the job.
      # RUSTFLAGS is not used for that, because it would replace the Windows stack-size flag
      # set in .cargo/config.toml.
      - name: Build and test (no warnings allowed)
        shell: bash
        run: |
          cargo test --locked --no-fail-fast --all-targets 2>&1 | tee test.log
          if grep -E "^warning" test.log; then echo "::error::the build reported warnings"; exit 1; fi

  package:
    name: Installers
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
