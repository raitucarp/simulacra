name: Package check

# Builds every platform's installers from any branch, tag or commit without publishing anything,
# to check that a change still packages before it reaches a release (a new native dependency,
# say, on the macOS cross build). The files are kept as workflow artifacts for 14 days.
# Start it from the Actions tab, or: gh workflow run package-check.yml -f ref=<branch>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to package
        required: true

permissions:
  contents: read

cache-mode: none

jobs:
  linux:
    name: Linux
    uses: $/.github/workflows/package.yml
    with:
      name: Linux x64
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      formats: deb,appimage
      slug: linux-x64
      ref: ${{ inputs.ref }}

  windows:
    name: Windows
    uses: $/.github/workflows/package.yml
    with:
      name: Windows x64
      os: windows-latest
      target: x86_64-pc-windows-msvc
      formats: nsis
      slug: windows-x64
      ref: ${{ inputs.ref }}

  macos-arm64:
    name: macOS Apple silicon
    uses: $/.github/workflows/package.yml
    with:
      name: macOS Apple silicon
      os: macos-latest
      target: aarch64-apple-darwin
      formats: dmg
      slug: macos-arm64
      ref: ${{ inputs.ref }}

  macos-x64:
    name: macOS Intel
    uses: $/.github/workflows/package.yml
    with:
      name: macOS Intel
      os: macos-latest
      target: x86_64-apple-darwin
      formats: dmg
      slug: macos-x64
      ref: ${{ inputs.ref }}
