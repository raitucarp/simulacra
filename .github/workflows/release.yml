name: Release

# Publishes Simulacra on the Releases page: installers for Windows, macOS (Apple silicon and
# Intel) and Linux, plain archives, SHA-256 checksums and signed build provenance. Push a tag such
# as `v0.1.1` that matches the version in Cargo.toml, or start it by hand for an existing tag.
#
# Each platform's chain runs on its own, so a slow platform never holds up the others:
#   tag check + dependency policy
#     -> tests on Linux   -> Linux installers
#     -> tests on Windows -> Windows installer
#     -> tests on macOS   -> macOS installers (Apple silicon, Intel)
#   all installers -> verify the expected files -> attest -> publish
# The tests are skipped when CI already passed on the tagged commit on main. Nothing here reads
# or writes the Actions cache, so a release is built from the tagged source alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.1)
        required: true

permissions:
  contents: read

cache-mode: none

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.ci.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: The tag must match Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version"; exit 1
          fi
      # CI on main already tested every platform for most tags; running it again repeats work.
      # Pull-request runs do not count: they skip macOS.
      - name: Has CI already passed on this commit on main?
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')
          if [ "$passed" -gt 0 ]; then
            echo "CI already passed on $sha; the tests are not run again."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing CI run on $sha on main; every platform is tested first."
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  # Advisories appear every day, so the dependency policy is checked again at release time.
  dependencies:
    name: Dependencies
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
        with:
          linux-libraries: "false"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --all-features check

  test-linux:
    name: Linux
    needs: tag
    if: needs.tag.outputs.tested != 'true'
    uses: $/.github/workflows/test.yml
    with: { name: Linux, os: ubuntu-24.04, cache: false, ref: "${{ inputs.tag || github.ref_name }}" }

  test-windows:
    name: Windows
    needs: tag
    if: needs.tag.outputs.tested != 'true'
    uses: $/.github/workflows/test.yml
    with: { name: Windows, os: windows-latest, cache: false, ref: "${{ inputs.tag || github.ref_name }}" }

  test-macos:
    name: macOS
    needs: tag
    if: needs.tag.outputs.tested != 'true'
    uses: $/.github/workflows/test.yml
    with: { name: macOS, os: macos-latest, cache: false, ref: "${{ inputs.tag || github.ref_name }}" }

  # Each platform's installers wait for that platform's tests (or their skip) and the policy.
  package-linux:
    name: Linux
    needs: [tag, dependencies, test-linux]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.dependencies.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.test-linux.result) }}
    uses: $/.github/workflows/package.yml
    with:
      name: Linux x64
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      formats: deb,appimage
      slug: linux-x64
      ref: ${{ inputs.tag || github.ref_name }}

  package-windows:
    name: Windows
    needs: [tag, dependencies, test-windows]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.dependencies.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.test-windows.result) }}
    uses: $/.github/workflows/package.yml
    with:
      name: Windows x64
      os: windows-latest
      target: x86_64-pc-windows-msvc
      formats: nsis
      slug: windows-x64
      ref: ${{ inputs.tag || github.ref_name }}

  package-macos-arm64:
    name: macOS Apple silicon
    needs: [tag, dependencies, test-macos]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.dependencies.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.test-macos.result) }}
    uses: $/.github/workflows/package.yml
    with:
      name: macOS Apple silicon
      os: macos-latest
      target: aarch64-apple-darwin
      formats: dmg
      slug: macos-arm64
      ref: ${{ inputs.tag || github.ref_name }}

  package-macos-x64:
    name: macOS Intel
    needs: [tag, dependencies, test-macos]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.dependencies.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.test-macos.result) }}
    uses: $/.github/workflows/package.yml
    with:
      name: macOS Intel
      os: macos-latest
      target: x86_64-apple-darwin
      formats: dmg
      slug: macos-x64
      ref: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish the release
    needs: [tag, package-linux, package-windows, package-macos-arm64, package-macos-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Never publish a partial release: every platform's files must be there.
      - name: Check every expected file is present
        run: |
          version="${RELEASE_TAG#v}"
          expected="simulacra_${version}_x64-setup.exe simulacra-${version}-windows-x64.zip
            Simulacra_${version}_aarch64.dmg simulacra-${version}-macos-arm64.tar.gz
            Simulacra_${version}_x64.dmg simulacra-${version}-macos-x64.tar.gz
            simulacra_${version}_amd64.deb simulacra_${version}_x86_64.AppImage simulacra-${version}-linux-x64.tar.gz"
          missing=0
          for file in $expected; do
            if [ -f "dist/$file" ]; then echo "found   $file"; else echo "::error::missing $file"; missing=1; fi
          done
          exit "$missing"

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed SLSA build provenance: `gh attestation verify <file> --repo <owner>/<repo>`
      # proves a download was built by this workflow from this repository's source.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The GitHub CLI on the runner publishes the release; no third-party action is needed.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Downloads
          | Platform | Installer | Without installer |
          |---|---|---|
          | Windows 10/11 (x64) | `simulacra_*_x64-setup.exe` | `simulacra-*-windows-x64.zip` |
          | macOS 11+ (Apple silicon) | `Simulacra_*_aarch64.dmg` | `simulacra-*-macos-arm64.tar.gz` |
          | macOS 11+ (Intel) | `Simulacra_*_x64.dmg` | `simulacra-*-macos-x64.tar.gz` |
          | Linux (x64) | `.deb` or `.AppImage` | `simulacra-*-linux-x64.tar.gz` |

          Every asset the app uses (illustrations, themes, palettes, seed data, translations) is built into the executable.
          Verify downloads against `SHA256SUMS.txt`, or check where a file was built with
          `gh attestation verify <file> --repo raitucarp/simulacra`.

          The installers are not code-signed yet. On Windows, SmartScreen may ask you to confirm ("More info" → "Run anyway").
          On macOS, right-click the app and choose Open the first time.
          NOTES
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Simulacra $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
