[package]
name = "simulacra"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.8.1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
rust-i18n = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nano-vectordb-rs = { git = "https://github.com/VectorInstitute/nano-vectordb-rs" }
rfd = "0.15"
base64 = "0.22"
# Already in the graph via gpui-kit-assets; embeds `assets/illustrations` (read from disk in debug builds).
rust-embed = { version = "8.7", features = ["include-exclude"] }
# Import pipeline: EPUB/DOCX/ODT containers (deflate through the flate2 already in the graph),
# the PDF text layer, file checksums and legacy MOBI code pages (markup is read by our own
# tolerant tokenizer, which XHTML, MOBI HTML, OPF, NCX, DOCX and ODT all share).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
lopdf = { version = "0.47", default-features = false }
sha2 = "0.11"
encoding_rs = "0.8"
# Post media (sb C3): link-preview URLs and off-thread image decoding / thumbnails (both
# already in the graph through reqwest and gpui, with the same features).
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Encrypted snapshots (sb F2): Argon2id key derivation and XChaCha20-Poly1305 sealing from
# RustCrypto (released versions, pinned), and zeroize (already in the graph) for the
# passphrase and derived key; rusqlite's online backup restores a verified snapshot.
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
zeroize = "1.8"

[dev-dependencies]
resvg = "0.45.1"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
