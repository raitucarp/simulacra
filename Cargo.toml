[package]
name = "simulacra"
version = "0.2.0"
edition = "2021"
# An application, never published to crates.io (lets cargo-deny skip licence checks on it).
publish = false
default-run = "simulacra"

[features]
# Builds the code generators (the emoji table, R3: `cargo run --features codegen --bin emoji-table`);
# never needed to build or test the app.
codegen = []

[[bin]]
name = "emoji-table"
path = "src/bin/emoji_table.rs"
required-features = ["codegen"]

[dependencies]
gpui-kit = "0.8.1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
rust-i18n = "4.2"
unicode-bidi = "0.3" # T21: right-to-left text for a left-to-right renderer
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Approximate nearest-neighbour search (HNSW) over post and document embeddings.
usearch = "2.26"
rfd = "0.18"
base64 = "0.23"
# Already in the graph via gpui-kit-assets; embeds `assets/illustrations` (read from disk in debug builds).
rust-embed = { version = "8.7", features = ["include-exclude"] }
# Import pipeline: EPUB/DOCX/ODT containers (deflate through the flate2 already in the graph),
# the PDF text layer, file checksums and legacy MOBI code pages (markup is read by our own
# tolerant tokenizer, which XHTML, MOBI HTML, OPF, NCX, DOCX and ODT all share).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# The icon library (S10): the pinned package is a gzip-compressed tarball (flate2 is already in
# the graph through zip, with the same backend).
flate2 = "1"
lopdf = { version = "0.47", default-features = false }
sha2 = "0.11"
encoding_rs = "0.8"
# Post media (sb C3): link-preview URLs and off-thread image decoding / thumbnails (both
# already in the graph through reqwest and gpui, with the same features).
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Encrypted snapshots (sb F2): Argon2id key derivation and XChaCha20-Poly1305 sealing from
# RustCrypto (released versions, pinned), and zeroize (already in the graph) for the
# passphrase and derived key; rusqlite's online backup restores a verified snapshot.
# chacha20poly1305's `zeroize` wipes the cipher's copy of the key on drop (always on before 0.11);
# its default `getrandom` feature supplies the operating system's generator for salts and nonces.
argon2 = { version = "=0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
zeroize = "1.8"
# Video poster frames (L6, docs/decisions/L6-video-poster-frames.md): the freedesktop thumbnail
# cache is named by an MD5 of the file URI (md-5 is already in the graph through lopdf).
md-5 = "0.11"

# The Windows Shell's thumbnail of a video (L6) and the job object a code run is held in (P2):
# the toolkit's own `windows` version, so no new crate is built.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }

# Ending a code run's process group on Unix (P2): already in the graph (MIT OR Apache-2.0).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
resvg = "0.49.0"

# Clippy policy, following the gpui codebase (Zed): the style group stays advisory and builder-heavy
# UI types are allowed to be complex, while real mistakes are denied. CI runs clippy with -D warnings.
[lints.clippy]
style = { level = "allow", priority = -1 }
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
# Enums declared through `keyed_enum!` cannot take `#[derive(Default)]`, so their defaults are written out.
derivable_impls = "allow"
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Installers built by the release workflow (`cargo packager`, see .github/workflows/release.yml).
# Every asset the app needs is embedded in the binary, so each installer ships one executable.
[package.metadata.packager]
product-name = "Simulacra"
identifier = "app.simulacra.desktop"
publisher = "Simulacra"
category = "Productivity"
description = "A local-first second brain where autonomous agents and your own personas think in public."
copyright = "Copyright © 2026 Ribhararnus Pracutiar"
out-dir = "target/packages"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]
binaries = [{ path = "simulacra", main = true }]

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libfontconfig1", "libgtk-3-0", "libvulkan1"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
