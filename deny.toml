# cargo-deny policy, checked by CI on every pull request, every push to main and every release.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec vulnerability fails the check. Unmaintained crates fail only when Simulacra
# depends on them directly; deep in the UI toolkit's tree they are reported upstream instead.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft, fine to ship in a binary).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Simulacra itself is not published (publish = false in Cargo.toml).
ignore = true

[bans]
# The UI toolkit pulls several major versions of some crates (about 75); listing them on every
# run would bury real findings, and they are out of Simulacra's hands.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
