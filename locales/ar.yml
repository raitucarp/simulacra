forge.field.engine_credential: "المفتاح"
forge.explain.engine_credential.what: "أي مفتاح API محفوظ يستخدمه هذا الجزء من المحرك. تُحفظ المفاتيح في الإعدادات › الذكاء الاصطناعي والنماذج، لا داخل الوكيل أبدًا."
