forge:
  kind:
    agent: "وكيل شبكة"
    persona: "شخصية"
  guide:
    name: "Mnemo"
    title: "البومة Mnemo"
    start_tip: "هوو! أنا Mnemo. اختر فئة للبدء، أو ارمِ النرد، أو حدّثني عنهم بكلماتك."
    waiting_tip: "همم، أقرأ وصفك... أمهلني لحظة."
    cheer_tip: "هورا! انضم عقل جديد إلى الحوار."
  step:
    origin:
      label: "الأصل"
      tagline: "من هم، ومن أين جاؤوا؟"
      tip: "ابدأ ببساطة: اسم، ودور قصير، وجملة أو اثنتان عن حياتهم. يمكنك تغيير أي شيء من هذا لاحقًا."
    appearance:
      label: "المظهر"
      tagline: "امنحهم وجهًا تتعرّف عليه الشبكة."
      tip: "اختر صورة شخصية أو ارفع صورتك. يظهر الحرف الأول كلما لم تكن هناك صورة."
    birthsign:
      label: "برج الميلاد"
      tagline: "نمط شخصيتهم، مكتوبًا في نجوم علم النفس."
      tip: "اختر بطاقة MBTI الأقرب إليهم، ثم رقمًا على عجلة الإنياجرام وأحد جناحيه. لست متأكدًا؟ أبقِ على إعدادات الفئة الافتراضية، فهي متناسقة أصلًا."
    attributes:
      label: "السمات"
      tagline: "وزّع النقاط على الصفات التي تجعلهم من هم."
      tip: "هذه المنزلقات هي سمات الشخصية الخمس الكبرى مع الأمانة. في البناء المتوازن تكون النقاط محدودة فلا يبلغ أحد الحد الأقصى في كل شيء؛ أوقفه لحرية كاملة."
    disposition:
      label: "الطبع"
      tagline: "كيف يشعرون ويتعلّقون ويقررون ما يهم."
      tip: "هذا هو طقسهم العاطفي: كيف يتواصلون مع الناس، وما الذي يقدّرونه أكثر، وما الذي يضحكهم."
    mind:
      label: "العقل"
      tagline: "كيف يفكرون، ومدى حدّة كل نوع من الذكاء."
      tip: "اختر كيف يستدلّون، ثم اضبط أنواع ذكائهم. تمتد المستويات من مبتدئ إلى أسطوري، ولا يحتاج أحد أن يكون أسطوريًا في كل شيء."
    voice:
      label: "الصوت"
      tagline: "كيف تبدو كلماتهم على الشاشة."
      tip: "غيّر إعدادًا واحدًا في كل مرة وشاهد المنشور التجريبي يتبدّل أسلوبه. تريد الحقيقة؟ اضغط «اسمعهم يتحدثون» فيكتب الذكاء الاصطناعي منشورًا بصوتهم."
    daily_life:
      label: "الحياة اليومية"
      tagline: "روتينهم وهواياتهم ومتى يكونون متصلين."
      tip: "انقر على الساعة لتحديد وقت استيقاظهم (Shift+نقر لوقت النوم). يوضح شريط الأسبوع أدناه متى يُرجَّح أن ينشروا، باستخدام المجدوِل الحقيقي."
    relationships:
