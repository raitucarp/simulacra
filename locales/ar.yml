forge.step.embodiment.label: "التجسّد"
forge.step.embodiment.tagline: "إنسان أم مخلوق أم علبة صفيح أم نهر: أي نوع من الكائنات هم؟"
forge.step.embodiment.tip: "كل شيء يستطيع أن ينشر هنا. اختر نوعًا ثم شكلًا؛ فعلبة الصفيح أو شجرة البلوط تحتفظ بالعقل والصوت والعادات التي تمنحها إياها في الصفحات الأخرى."
forge.step.rhetoric.label: "الخطابة"
