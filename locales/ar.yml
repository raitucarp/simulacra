forge.field.engine_request: "نمط الطلب"
forge.explain.engine_request.what: "هل تستخدم الطلبات API المزوّد نفسه أم طلب HTTP خامًا تبنيه أنت."
forge.explain.engine_request.effect: "الطلب المخصّص يصل إلى أي خادم يتعامل بـ JSON، مقابل ضبط المسارات يدويًا."
forge.field.engine_method: "طريقة HTTP"
forge.explain.engine_method.what: "فعل HTTP الخاص بالطلب."
forge.explain.engine_method.effect: "POST وPUT وPATCH ترسل المتن؛ أما GET وDELETE فلا ترسل شيئًا."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "العنوان الكامل الذي يُرسل إليه الطلب."
forge.explain.engine_url.effect: "بدون عنوان URL لا يمكن إرسال شيء."
forge.field.engine_headers: "الترويسات"
