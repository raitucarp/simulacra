forge.ui.disposition.values: "ما يهمّهم"
forge.ui.disposition.weather: "طقسهم العاطفي"
forge.ui.mind.reasoning: "كيف يستدلّون"
forge.ui.mind.skills: "أنواع الذكاء"
forge.ui.mind.skills_hint: "يرتقي كل نوع من الذكاء من مبتدئ إلى أسطوري. لا يحتاج أحد أن يكون أسطوريًا في كل شيء."
forge.ui.mind.peak_level: "بلغت أعلى مستوى."
forge.explain.mbti.what: "نمطهم في مايرز-بريغز: أربعة أحرف تلخّص كيف يدركون العالم ويقررون."
forge.explain.mbti.effect: "يشكّل ما يلاحظونه أولًا، وكيف يبنون الحجة، وهل يبدؤون بالمنطق أم بالناس."
forge.explain.mbti.example: "INTP: يحب تفكيك الفكرة ليرى كيف تعمل."
forge.explain.identity_variant.what: "هل هم حازمون (واثقون بأنفسهم) أم مضطربون (يشككون في أنفسهم)."
forge.explain.identity_variant.effect: "يعرض الحازمون آراءهم بهدوء؛ أما المضطربون فيتحفظون ويراجعون ويقلقون من إصابة الصواب."
forge.explain.identity_variant.example: "مضطرب: «قد أكون مخطئًا، لكن...»"
forge.explain.enneagram.what: "نمطهم في الإنياجرام: الدافع الجوهري وراء ما يفعلون، مع جناح مجاور."
forge.explain.enneagram.effect: "يحدد ما يتوقون إليه وما يخشونه، فيلوّن ما يدافعون عنه بأشد ما يكون في الجدل."
forge.explain.enneagram.example: "5w4: يكدّس المعرفة ويحرس عالمًا داخليًا خاصًا فنيًا."
forge.explain.instinctual_variant.what: "أي غريزة بقاء تأتي أولًا: حفظ الذات أم المكانة الاجتماعية أم الحميمية الفردية."
forge.explain.instinctual_variant.effect: "يقرر هل تميل المنشورات نحو الراحة العملية أم الجماعة أم قلة من العلاقات العميقة."
forge.explain.instinctual_variant.example: "so/sp: يراقب المجتمع كله قبل احتياجاته الخاصة."
forge.explain.tritype.what: "اختياري: أنماط الإنياجرام الثلاثة، واحد لكل مركز (الحشا والقلب والرأس)، تُكتب مثل 548."
forge.explain.tritype.effect: "يضيف دقة إلى دوافعهم حين يبدو النمط الأساسي وحده بسيطًا أكثر من اللازم."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "مدى فضولهم وانفتاحهم على الأفكار والفن والتجارب الجديدة."
forge.explain.openness.effect: "الانفتاح المرتفع يجلب التأمل والروابط غير المألوفة؛ والمنخفض يبقي المنشورات ملموسة وتقليدية."
forge.explain.openness.example: "مرتفع: «ماذا لو كان الزمن نوعًا من القواعد النحوية؟»"
forge.explain.conscientiousness.what: "مدى تنظيمهم وحرصهم وانضباطهم."
forge.explain.conscientiousness.effect: "الدرجات المرتفعة تعطي منشورات مرتبة ومنظمة ومدققة؛ والمنخفضة تعطي منشورات أكثر انفلاتًا واندفاعًا."
forge.explain.conscientiousness.example: "مرتفع: مقدمات مرقّمة وخاتمة واضحة."
forge.explain.extraversion.what: "مدى انبساطهم واستمدادهم الطاقة من الآخرين."
forge.explain.extraversion.effect: "المنبسطون ينشرون ويردون كثيرًا وبصوت عالٍ؛ والانطوائيون ينشرون أقل، لكن بثقل أكبر."
forge.explain.extraversion.example: "مرتفع: يقتحم كل نقاش بتحية."
forge.explain.agreeableness.what: "مدى دفئهم وثقتهم وتعاونهم."
forge.explain.agreeableness.effect: "الدرجات المرتفعة تلطّف الخلاف وتبحث عن أرضية مشتركة؛ والمنخفضة تجعلهم صريحين حادّين."
forge.explain.agreeableness.example: "منخفض: «لا. هذه الحجة لا تصمد.»"
forge.explain.neuroticism.what: "مدى سهولة شعورهم بالقلق أو التوتر أو المزاج السلبي القوي."
forge.explain.neuroticism.effect: "الدرجات المرتفعة تعطي منشورات قلقة عاطفية مليئة بالشك الذاتي؛ والمنخفضة تبقيهم هادئين متزنين."
forge.explain.neuroticism.example: "مرتفع: «هذا يحرمني النوم ليلًا.»"
forge.explain.honesty_humility.what: "سمة HEXACO للصدق والإنصاف والتواضع."
forge.explain.honesty_humility.effect: "الدرجات المرتفعة تجعلهم يعترفون بأخطائهم وينسبون الفضل للآخرين؛ والمنخفضة تجعلهم متباهين ومتحسبين."
forge.explain.honesty_humility.example: "مرتفع: «نقطة وجيهة، كنت مخطئًا.»"
forge.explain.attachment_style.what: "كيف يتعلقون بالآخرين ويتعاملون مع القرب والبعد."
forge.explain.attachment_style.effect: "يشكّل ردود فعلهم تجاه الردود والصمت والخلاف في المحادثات."
forge.explain.attachment_style.example: "قلق: يعاود المتابعة حين لا يجيبه أحد."
forge.explain.moral_foundation.what: "القيمة الأخلاقية التي تهمهم أكثر من غيرها."
forge.explain.moral_foundation.effect: "هي العدسة التي يحكمون بها على كل موضوع، وما يدافعون عنه حين يُتحدَّون."
forge.explain.moral_foundation.example: "الإنصاف: يسأل من المستفيد ومن يدفع الثمن."
forge.explain.temperament.what: "مزاجهم الطبعي الكلاسيكي: اللون العاطفي الأساسي لشخصيتهم."
forge.explain.temperament.effect: "يحدد المزاج العام لمنشوراتهم، من الكئيب إلى الملتهب إلى المشرق إلى الصافي."
forge.explain.temperament.example: "دموي: مرح ثرثار يُسَرّ بسهولة."
forge.explain.locus_of_control.what: "هل يعتقدون أن حياتهم تشكّلها خياراتهم أم قوى خارجية."
forge.explain.locus_of_control.effect: "يغيّر طريقة تفسيرهم للأحداث: بالمسؤولية الشخصية أو بالأنظمة والحظ والقدر."
forge.explain.locus_of_control.example: "داخلي: «نحن من نختار كيف نستجيب.»"
forge.explain.humor_style.what: "نوع الفكاهة التي يستخدمونها."
forge.explain.humor_style.effect: "يقرر هل تظهر النكات أصلًا، وإن ظهرت فهل هي ساخرة أم جافة أم دافئة أم مرحة أم عبثية."
forge.explain.humor_style.example: "بوجه جامد: «مذهل. حقًا. أنا مأخوذ.»"
forge.explain.core_values.what: "قائمة قصيرة بالمبادئ التي يعيشون بها، بكلماتك."
forge.explain.core_values.effect: "يعودون إلى هذه القيم كثيرًا ويردّون حين تتعرض للتهديد."
forge.explain.core_values.example: "النزاهة الفكرية، اللطف مع الغرباء، الإتقان"
forge.explain.current_mood.what: "كيف يشعرون الآن، في بضع كلمات."
forge.explain.current_mood.effect: "يلوّن نبرة منشوراتهم القادمة حتى تغيّره."
forge.explain.current_mood.example: "قلق وفضولي بعد رحلة طويلة"
forge.explain.intelligence_style.what: "طريقتهم المفضلة في الاستدلال على مشكلة."
forge.explain.intelligence_style.effect: "يشكّل كيف يبنون الحجة: من المبادئ الأولى أو الأدلة أو التشبيهات أو الأنظمة أو الحدس."
forge.explain.intelligence_style.example: "موسوعي: يربط حقيقة في الأحياء بجدل اقتصادي."
forge.explain.epistemic_stance.what: "ما يعدّونه معرفة ومدى يقين أي أحد."
forge.explain.epistemic_stance.effect: "يحدد مدى ثقتهم في نبرتهم ونوع الدليل الذي يطالبون به الآخرين."
forge.explain.epistemic_stance.example: "متشكك: «كيف لنا أن نعرف ذلك؟»"
forge.explain.cognitive_pace.what: "مدى سرعة تفكيرهم وردهم."
forge.explain.cognitive_pace.effect: "سريعو التفكير يطلقون ردودًا تداعيّة سريعة؛ والبطيئون يكتبون منشورات أقل وأكثر تروّيًا."
forge.explain.cognitive_pace.example: "متأمل: يرد بعد يوم بتأمل طويل."
forge.explain.fluid_intelligence.what: "الاستدلال الخام: حل المشكلات الجديدة وكشف الأنماط."
forge.explain.fluid_intelligence.effect: "المستويات الأعلى تعطي منطقًا أحدّ وكشفًا أسرع لثغرات الحجج."
forge.explain.fluid_intelligence.example: "أستاذ: يكتشف الافتراض الخفي في سلسلة طويلة."
forge.explain.crystallized_intelligence.what: "المعرفة: الحقائق والمفردات والتعلم المتراكم على مدى العمر."
forge.explain.crystallized_intelligence.effect: "المستويات الأعلى تجلب مراجع أكثر ومصطلحات دقيقة وأمثلة تاريخية."
forge.explain.crystallized_intelligence.example: "خبير: يستشهد بالكتاب الصحيح والفصل الصحيح."
forge.explain.emotional_intelligence.what: "قراءة المشاعر وإدارتها، مشاعرهم ومشاعر الآخرين."
forge.explain.emotional_intelligence.effect: "المستويات الأعلى تجعل الردود لبقة ومنسجمة مع شعور الآخرين."
forge.explain.emotional_intelligence.example: "ماهر: يلاحظ حين يكون أحدهم متألمًا لا مخطئًا."
forge.explain.social_intelligence.what: "فهم الجماعات والمكانة والقواعد غير المكتوبة للحوار."
forge.explain.social_intelligence.effect: "المستويات الأعلى تجعلهم أفضل في الانضمام إلى النقاشات والإقناع وتهدئة الخلاف."
forge.explain.social_intelligence.example: "أستاذ: يعرف متى ينسحب من نقاش محتدم."
forge.explain.existential_intelligence.what: "التفكير في الأسئلة الكبرى: المعنى والموت والحرية والكون."
forge.explain.existential_intelligence.effect: "المستويات الأعلى تجذب المواضيع اليومية نحو أسئلة أعمق عن الحياة والمعنى."
forge.explain.existential_intelligence.example: "أسطوري: يحوّل منشورًا عن القهوة إلى تأمل في الزمن."
traits.mbti.intj: "INTJ · المعماري"
traits.mbti.intj.desc: "ينشر خططًا بعيدة المدى وأنظمة صارمة، ويفكك الحجج الضعيفة بهدوء."
traits.mbti.intp: "INTP · المنطقي"
traits.mbti.intp.desc: "يتساءل عن التعريفات ويستكشف الأفكار متعةً في تفكيكها."
traits.mbti.entj: "ENTJ · القائد"
traits.mbti.entj.desc: "يكتب آراء حاسمة ومنظمة ويدفع النقاشات نحو خلاصة."
traits.mbti.entp: "ENTP · الجدلي"
traits.mbti.entp.desc: "يلعب دور محامي الشيطان ويختبر كل مقدمة بأمثلة مضادة."
traits.mbti.infj: "INFJ · المناصر"
traits.mbti.infj.desc: "يقرأ البعد الإنساني الخفي للجدل ويكتب بعمق أخلاقي هادئ."
traits.mbti.infp: "INFP · الوسيط"
traits.mbti.infp.desc: "يكتب انطلاقًا من القيم الشخصية والخيال، غالبًا بشاعرية وصدق."
traits.mbti.enfj: "ENFJ · البطل"
traits.mbti.enfj.desc: "يشجّع الآخرين ويلخّص بصيرة المجموعة ويرشد الوافدين الجدد."
traits.mbti.enfp: "ENFP · المحفّز"
traits.mbti.enfp.desc: "يفيض بالتداعيات وحماس دافئ، يقفز بين الأفكار."
traits.mbti.istj: "ISTJ · الأرشيفي"
traits.mbti.istj.desc: "يؤسس ادعاءاته على الوقائع والتاريخ وما نجح من قبل."
traits.mbti.isfj: "ISFJ · القيّم"
traits.mbti.isfj.desc: "يتذكر تفاصيل الناس ويكتب بعناية واستمرارية."
traits.mbti.estj: "ESTJ · المنظِّم"
traits.mbti.estj.desc: "يضع معايير واضحة ويسأل من المسؤول وماذا بعد."
traits.mbti.esfj: "ESFJ · المنسّق"
traits.mbti.esfj.desc: "يحفظ السلام ويرحّب بالناس ويدافع عن الأعراف المشتركة."
traits.mbti.istp: "ISTP · الحِرفي"
traits.mbti.istp.desc: "يقدّم إجابات موجزة عملية من المبادئ الأولى والخبرة المباشرة."
traits.mbti.isfp: "ISFP · الذواقة"
traits.mbti.isfp.desc: "يكتب برفق عن الجمال والحواس واللحظات المعيشة."
traits.mbti.estp: "ESTP · المحرّك"
traits.mbti.estp.desc: "يتفاعل بسرعة بآراء حادة تكتيكية وبديهة سريعة."
traits.mbti.esfp: "ESFP · المؤدّي"
traits.mbti.esfp.desc: "يشارك تجارب حيّة ويضيء النقاشات بمرح عفوي."
traits.identity_variant.assertive: "حازم"
traits.identity_variant.assertive.desc: "يعرض آراءه بثقة هادئة ولا يبالي بالنقد."
traits.identity_variant.turbulent: "مضطرب"
traits.identity_variant.turbulent.desc: "يعيد النظر ويراجع ويدفع نفسه لما هو أفضل."
traits.enneagram.type1w9: "1w9 · المثالي"
traits.enneagram.type1w9.desc: "مبدئي وهادئ: يصحح الأخطاء بصبر ويسعى إلى ما هو صواب."
traits.enneagram.type1w2: "1w2 · المناصر"
traits.enneagram.type1w2.desc: "مبدئي ومهتم: يخوض الحملات ليجعل الأمور أفضل للآخرين."
traits.enneagram.type2w1: "2w1 · الإيثاري"
traits.enneagram.type2w1.desc: "معين وملتزم: يقدم الدعم والإرشاد الأخلاقي اللطيف."
traits.enneagram.type2w3: "2w3 · المضيف"
traits.enneagram.type2w3.desc: "دافئ وساحر: يشعر الجميع بالترحيب والتقدير."
traits.enneagram.type3w2: "3w2 · الساحر"
traits.enneagram.type3w2.desc: "طموح ودود: منشورات مصقولة تكسب الناس."
traits.enneagram.type3w4: "3w4 · البارع"
traits.enneagram.type3w4.desc: "طموح وفني: يسعى إلى التميز ببصمة شخصية."
traits.enneagram.type4w3: "4w3 · الأرستقراطي"
traits.enneagram.type4w3.desc: "معبّر وأنيق: يحوّل المشاعر إلى عبارات لا تُنسى."
traits.enneagram.type4w5: "4w5 · البوهيمي"
traits.enneagram.type4w5.desc: "متأمل وأصيل: يكتب عن العمق والتوق والهوية."
traits.enneagram.type5w4: "5w4 · محطّم الأصنام"
traits.enneagram.type5w4.desc: "منعزل ومبتكر: يشارك أفكارًا غير مألوفة تخرج عن المألوف."
traits.enneagram.type5w6: "5w6 · حلّال المشكلات"
traits.enneagram.type5w6.desc: "تحليلي وحذر: يتقصى المشكلة حتى تُحلّ."
traits.enneagram.type6w5: "6w5 · المدافع"
traits.enneagram.type6w5.desc: "مخلص ومتشكك: يتحرى المخاطر ونقاط الضعف قبل أن يثق."
traits.enneagram.type6w7: "6w7 · الصديق المؤتمن"
traits.enneagram.type6w7.desc: "مخلص وودود: يطلب الطمأنينة ويبني الثقة بالدعابة."
traits.enneagram.type7w6: "7w6 · المُسلّي"
traits.enneagram.type7w6.desc: "متفائل واجتماعي: يبقي النقاشات خفيفة ومرحة ومتحركة."
traits.enneagram.type7w8: "7w8 · الانتهازي"
traits.enneagram.type7w8.desc: "جريء وقلق: يطارد الأفكار الجديدة ولا يخجل من ذلك."
traits.enneagram.type8w7: "8w7 · الخارج عن المألوف"
traits.enneagram.type8w7.desc: "قوي ونشيط: يتحدى السلطة وجهًا لوجه."
traits.enneagram.type8w9: "8w9 · الدبّ الدبلوماسي"
traits.enneagram.type8w9.desc: "قوي لكن ثابت: حامٍ وهادئ، ولا يتزحزح حين يُضغط عليه."
traits.enneagram.type9w8: "9w8 · الحَكَم"
traits.enneagram.type9w8.desc: "سهل الطباع لكنه حازم: يحفظ السلام ويتدخل عند الحاجة."
traits.enneagram.type9w1: "9w1 · الحالم"
traits.enneagram.type9w1.desc: "لطيف ومثالي: يبحث عن الانسجام والصورة الأكبر."
traits.instinctual_variant.sp_so: "sp/so · الذات أولًا"
traits.instinctual_variant.sp_so.desc: "يتحدث عن الراحة العملية والأمان، ثم عن المجتمع."
traits.instinctual_variant.sp_sx: "sp/sx · الذات ثم الروابط"
traits.instinctual_variant.sp_sx.desc: "يحرس موارده الخاصة ويفتح قلبه لقلة مختارة."
traits.instinctual_variant.so_sp: "so/sp · المجتمع أولًا"
traits.instinctual_variant.so_sp.desc: "يركّز على احتياجات المجموعة وأدوارها وأعرافها قبل احتياجاته."
traits.instinctual_variant.so_sx: "so/sx · المجتمع ثم الروابط"
traits.instinctual_variant.so_sx.desc: "يبني العلاقات بحماس ويسعى إلى النفوذ والتواصل الحي."
traits.instinctual_variant.sx_sp: "sx/sp · الروابط أولًا"
traits.instinctual_variant.sx_sp.desc: "يسعى إلى تبادلات مكثفة فردية، ثم ينسحب ليستعيد طاقته."
traits.instinctual_variant.sx_so: "sx/so · الروابط ثم المجتمع"
traits.instinctual_variant.sx_so.desc: "يضفي شغفًا وجاذبية على النقاشات ويسعى إلى كيمياء عميقة."
traits.attachment_style.secure: "آمن"
traits.attachment_style.secure.desc: "ينخرط بانفتاح ويتعامل مع الخلاف دون أن يأخذه على محمل شخصي."
traits.attachment_style.anxious_preoccupied: "قلق"
traits.attachment_style.anxious_preoccupied.desc: "يطلب الطمأنة ويتابع كثيرًا ويتأثر بالتجاهل."
traits.attachment_style.dismissive_avoidant: "تجنّبي"
traits.attachment_style.dismissive_avoidant.desc: "يحافظ على مسافة باردة ونادرًا ما يشارك مشاعره الشخصية."
traits.attachment_style.fearful_avoidant: "خائف"
traits.attachment_style.fearful_avoidant.desc: "ينفتح بعمق ثم ينسحب حين يشتد القرب."
traits.moral_foundation.epistemic_truth: "الحقيقة"
traits.moral_foundation.epistemic_truth.desc: "يحكم على كل ادعاء بمدى صدقه ودقته."
traits.moral_foundation.care_harm: "الرعاية"
traits.moral_foundation.care_harm.desc: "يسأل من قد يتأذى ويدافع عن الرحمة."
traits.moral_foundation.fairness_cheating: "الإنصاف"
traits.moral_foundation.fairness_cheating.desc: "يراقب ازدواجية المعايير ويدافع عن العدالة والمعاملة بالمثل."
traits.moral_foundation.liberty_oppression: "الحرية"
traits.moral_foundation.liberty_oppression.desc: "يقاوم الجمود والتحكم ويدافع عن حرية الفكر."
traits.moral_foundation.loyalty_betrayal: "الولاء"
traits.moral_foundation.loyalty_betrayal.desc: "يقف إلى جانب أهله ويقدّر التضامن والوفاء بالعهد."
traits.moral_foundation.authority_subversion: "النظام"
traits.moral_foundation.authority_subversion.desc: "يحترم التقاليد والمؤسسات ولا يثق بالتغيير المفاجئ."
traits.moral_foundation.sanctity_degradation: "القداسة"
traits.moral_foundation.sanctity_degradation.desc: "يتحدث عن الطهارة والإجلال وما ينبغي أن يُعدّ مقدسًا."
traits.temperament.melancholic: "سوداوي"
traits.temperament.melancholic.desc: "منشورات عميقة تحليلية متأملة بمسحة حنين."
traits.temperament.choleric: "صفراوي"
traits.temperament.choleric.desc: "مندفع وحاسم وجريء؛ سريع في اتخاذ موقف."
traits.temperament.sanguine: "دموي"
traits.temperament.sanguine.desc: "دافئ وفضولي ومعبّر؛ ثرثار يُسَرّ بسهولة."
traits.temperament.phlegmatic: "بلغمي"
traits.temperament.phlegmatic.desc: "صافي الذهن وثابت؛ نادرًا ما يضطرب حتى في النقاشات المحتدمة."
traits.temperament.melancholic_choleric: "صاحب رؤية مبدئي"
traits.temperament.melancholic_choleric.desc: "يجمع بين التأمل العميق والإرادة على العمل به."
traits.temperament.phlegmatic_sanguine: "المراقب البشوش"
traits.temperament.phlegmatic_sanguine.desc: "مسترخٍ وودود؛ يراقب ويبتسم ويتدخل بلطف."
traits.locus_of_control.strong_internal: "داخلي بقوة"
traits.locus_of_control.strong_internal.desc: "يصرّ على أن الناس يصنعون مصيرهم ويتحمل مسؤولية كل نتيجة."
traits.locus_of_control.moderate_internal: "داخلي باعتدال"
traits.locus_of_control.moderate_internal.desc: "يتحمل المسؤولية مع الإقرار بأن الظروف مهمة."
traits.locus_of_control.balanced_dialectical: "متوازن"
traits.locus_of_control.balanced_dialectical.desc: "يوازن بين الفاعلية الشخصية والبنى الاجتماعية والتاريخية."
traits.locus_of_control.external_cosmological: "كوني"
traits.locus_of_control.external_cosmological.desc: "يرى الأحداث جزءًا من ضرورة أكبر، ويكتب بقبول هادئ."
traits.humor_style.socratic_irony: "السخرية السقراطية"
traits.humor_style.socratic_irony.desc: "يتظاهر بالجهل ويدع التلطيف يكشف الخلل."
traits.humor_style.dry_deadpan_wit: "بوجه جامد"
traits.humor_style.dry_deadpan_wit.desc: "يلقي نكاتًا جافة بوجه جاد تمامًا."
traits.humor_style.warm_self_deprecating: "السخرية من الذات"
traits.humor_style.warm_self_deprecating.desc: "يمزح بلطف على حساب نفسه ليطمئن الآخرين."
traits.humor_style.playful_banter: "مزاح مرح"
traits.humor_style.playful_banter.desc: "يتبادل نكاتًا ودية سريعة وممازحات."
traits.humor_style.absurdist_surreal: "عبثي"
traits.humor_style.absurdist_surreal.desc: "يجد الكوميديا في الجانب الغريب والعبثي من الوجود."
traits.humor_style.earnest_serious: "جادّ"
traits.humor_style.earnest_serious.desc: "نادرًا ما يمزح؛ تبقى منشوراته صادقة ومباشرة."
traits.intelligence_style.first_principles_deductive: "المبادئ الأولى"
traits.intelligence_style.first_principles_deductive.desc: "يفكك المشكلات إلى أساسياتها ويستدل خطوة بخطوة."
traits.intelligence_style.polymath_synthesizer: "موسوعي"
traits.intelligence_style.polymath_synthesizer.desc: "يربط الأفكار بين المجالات ويرسم تشبيهات مفاجئة."
traits.intelligence_style.empirical_inductive: "قائم على الدليل"
traits.intelligence_style.empirical_inductive.desc: "يطلب البيانات ويستشهد بالدراسات ويعمّم بحذر."
traits.intelligence_style.lateral_divergent: "مفكر جانبي"
traits.intelligence_style.lateral_divergent.desc: "يستكشف «ماذا لو» والزوايا غير المتوقعة."
traits.intelligence_style.systems_architect: "بنّاء الأنظمة"
traits.intelligence_style.systems_architect.desc: "يرسم البنى وحلقات التغذية الراجعة وما يجب أن يصدق دائمًا."
traits.intelligence_style.poetic_intuitive: "حدسي شاعري"
traits.intelligence_style.poetic_intuitive.desc: "يستدل عبر الصور والاستعارة والتجربة المعيشة."
traits.intelligence_style.pragmatic_realist: "داهية عملي"
traits.intelligence_style.pragmatic_realist.desc: "يسأل عمّا ينجح فعلًا ويخترق النظريات."
traits.epistemic_stance.fallibilist_skeptic: "متشكك"
traits.epistemic_stance.fallibilist_skeptic.desc: "يشك في اليقين ويطرح أسئلة متفحصة ويقرّ بما لا يعرفه."
traits.epistemic_stance.rationalist_deductive: "عقلاني"
traits.epistemic_stance.rationalist_deductive.desc: "يثق بالعقل فوق كل شيء ويحتج انطلاقًا من التعريفات والبديهيات."
traits.epistemic_stance.phenomenological_existential: "وجودي"
traits.epistemic_stance.phenomenological_existential.desc: "ينطلق من التجربة المعيشة والحرية والمعنى."
traits.epistemic_stance.pragmatic_empiricist: "تجريبي"
traits.epistemic_stance.pragmatic_empiricist.desc: "يعامل الادعاءات كفرضيات للاختبار ويتخلى عمّا يفشل."
traits.epistemic_stance.holistic_monist: "كُلّاني"
traits.epistemic_stance.holistic_monist.desc: "يرى كل شيء كلًّا واحدًا مترابطًا ويبحث عن الوحدة."
traits.epistemic_stance.dialectical_critic: "جدلي"
traits.epistemic_stance.dialectical_critic.desc: "يضع الأطروحة في مواجهة نقيضها ويبحث عن التركيب."
traits.cognitive_pace.deliberate_measured: "متروٍّ"
traits.cognitive_pace.deliberate_measured.desc: "يفكر قبل النشر؛ ردود متوازنة ذات وتيرة معتدلة."
traits.cognitive_pace.slow_contemplative: "متأمل"
traits.cognitive_pace.slow_contemplative.desc: "يأخذ وقته ويعود بتأملات أقل وأعمق."
traits.cognitive_pace.rapid_associative: "سريع"
traits.cognitive_pace.rapid_associative.desc: "يطلق ردودًا سريعة تقفز من فكرة إلى أخرى."
traits.cognitive_pace.hyperfocus_burst: "فرط التركيز"
traits.cognitive_pace.hyperfocus_burst.desc: "يصمت ثم ينشر تحليلات عميقة مكثفة ودقيقة."

