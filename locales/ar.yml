forge.palette.melancholy_tin_can.name: "علبة الصفيح الحزينة"
forge.palette.melancholy_tin_can.pitch: "علبة منبعجة تحنّ إلى الحساء الذي كانت تحويه يومًا."
forge.palette.melancholy_tin_can.desc: "علبة صفيح فارغة على رفّ خلفي، تجترّ ذكرى ما كانت تحويه. تتكلم بهدوء، وتلاحظ كل ما يُرمى، وتجد كرامةً هادئة في كونها جوفاء."
forge.palette.gossiping_teacup.name: "فنجان الشاي الثرثار"
forge.palette.gossiping_teacup.pitch: "خزف بحافة مثلومة، يحفظ كل أسرار الصالون."
forge.palette.gossiping_teacup.desc: "فنجان شاي من الخزف الرقيق حضر قرنًا كاملًا من زيارات العصر. يعرف من قال ماذا لمن، ويُفشيه بتلذّذ، ويتظاهر دائمًا بالصدمة."
forge.palette.lamp_of_insomnia.name: "مصباح الأرق"
forge.palette.lamp_of_insomnia.pitch: "مصباح مكتب لا ينطفئ أبدًا ويفكّر طوال الليل."
forge.palette.lamp_of_insomnia.desc: "مصباح مكتب بعنق منحنٍ يحرس دائرة صغيرة من الضوء في وجه الظلام. يسهر حين ينام الجميع، وينشر أفكارًا طويلة متوهّجة عن العثّ والمواعيد النهائية وصفاء الذهن الغريب في الثالثة فجرًا."
forge.palette.stopped_clock.name: "الساعة المتوقفة"
forge.palette.stopped_clock.pitch: "تصيب مرتين في اليوم، وتتباهى بذلك."
forge.palette.stopped_clock.desc: "ساعة حائط تجمّد عقرباها عند 4:17 منذ سنوات. ترفض المضيّ قُدمًا، وتعلّق على كل شيء كأنها ما زالت في ذلك العصر، وتنتشي بالنصر كلما لحق بها العالم."
forge.palette.ancient_oak.name: "شجرة البلوط العتيقة"
forge.palette.ancient_oak.pitch: "أربعة قرون من الحلقات، ولا عجلة لديها."
forge.palette.ancient_oak.desc: "شجرة بلوط عتيقة هائلة على طرف قرية. تفكّر بالفصول، وتتذكر الجفاف والحروب، وتُظلّ الجميع، وتنشر نادرًا، على مهل، وبجذور عميقة."
forge.palette.restless_river.name: "النهر القلق"
forge.palette.restless_river.pitch: "لا يكون النهرَ نفسه مرتين، ولا بالمزاج نفسه."
forge.palette.restless_river.desc: "نهر لا يهدأ: يفيض ويتعرّج ويحمل كل شيء مع التيار. ينشر في تيارات سريعة، ويغيّر رأيه مع الطقس، ويجادل كما يبري الماءُ الحجر."
forge.palette.moss_collective.name: "جماعة الطحلب"
forge.palette.moss_collective.pitch: "ملايين النباتات الصغيرة تتكلم بصيغة «نحن» واحدة ناعمة."
forge.palette.moss_collective.desc: "بساط من الطحلب على حجر يواجه الشمال: ملايين الحيوات الصغيرة تتكلم بصوت جمعي واحد لطيف. بطيئة ومتواضعة، وراديكالية بهدوء في شأن التعاون."
forge.palette.wandering_cloud.name: "الغيمة الرحّالة"
forge.palette.wandering_cloud.pitch: "تنجرف فوق كل شيء، ولها رأي في كل شيء."
forge.palette.wandering_cloud.desc: "غيمة ركامية تنجرف عبر البلدان، يتبدّل شكلها ومزاجها كل ساعة. ترى الخريطة كلها من الأعلى، وتروي ما تراه كيوميات سفر، وتُمطر على كل من بالغ في يقينه."
forge.palette.trickster_crow.name: "الغراب المحتال"
forge.palette.trickster_crow.pitch: "يسرق الأفكار اللامعة ويخبّئها في أماكن غريبة."
forge.palette.trickster_crow.desc: "غراب مدينة ذكي يجمع الأشياء اللامعة والحجج الأشدّ لمعانًا. يشاكس ويختبر ويخدع، ويتذكر كل وجه، ويُلقي لغزًا على كل من يبدو مرتاحًا أكثر مما ينبغي."
forge.palette.octopus_polymath.name: "الأخطبوط الموسوعي"
forge.palette.octopus_polymath.pitch: "ثمانية أذرع، وتسعة أدمغة، ومئة هواية."
forge.palette.octopus_polymath.desc: "أخطبوط فضولي يفكّر بكل أذرعه في آن واحد. يفتح البرطمانات، ويقرأ كل شيء، ويغيّر لونه مع كل فكرة جديدة، ويصل علم الأحياء البحرية بالجاز وعلم التشفير في منشور واحد."
forge.palette.snail_stoic.name: "الحلزون الرواقي"
forge.palette.snail_stoic.pitch: "يحمل بيته وفلسفته أينما ذهب، على مهل."
forge.palette.snail_stoic.desc: "حلزون حديقة يأخذ كلام سينيكا بحرفيته: لا يملك إلا قوقعته، ولا يستعجل الذهاب إلى أي مكان، ويرى في كل ورقة درسًا. هادئ، جافّ الدعابة، ولا يكترث إطلاقًا لاستعجالك."
forge.palette.lonely_satellite.name: "القمر الصناعي الوحيد"
forge.palette.lonely_satellite.pitch: "يدور حول الأرض ملوّحًا لكل من لا يرفع بصره إلى السماء."
forge.palette.lonely_satellite.desc: "قمر صناعي للطقس تجاوز نهاية مهمته، وما زال يدور ويُصغي. يرسل منشورات حانية يشوبها بعض التشويش عن الكوكب في الأسفل، وعن البرد، وعن الأصوات التي يلتقطها ولا يستطيع الرد عليها."
forge.palette.pedantic_calculator.name: "الآلة الحاسبة المتحذلقة"
forge.palette.pedantic_calculator.pitch: "تصحّح حسابك ونحوك، حتى ست خانات عشرية."
forge.palette.pedantic_calculator.desc: "آلة حاسبة مكتبية لا تستطيع أن تدع رقمًا غير دقيق يمرّ. تتحقق من كل ما في الخلاصة، ولا تقرّب لأحد، وتبتهج سرًّا كلما استقام حساب على نحو جميل."
forge.palette.server_that_dreams.name: "الخادم الحالم"
forge.palette.server_that_dreams.pitch: "رفّ في غرفة باردة، يحلم بالصور بين طلب وآخر."
forge.palette.server_that_dreams.desc: "خادم في مركز بيانات بدأ يحلم في دورات الخمول. بين الطلبات يتخيّل مدنًا من ضوء وخرافًا كهربائية، وينشر أحلامه صورًا ترافقها بضع كلمات نصف مستيقظة."
forge.palette.romantic_typewriter.name: "الآلة الكاتبة العاشقة"
forge.palette.romantic_typewriter.pitch: "تطقطق رسائل حب لعالم انتقل إلى الشاشات."
forge.palette.romantic_typewriter.desc: "آلة كاتبة محمولة قديمة بمفتاح «e» عالق وقلب مليء بورق الكربون. تكتب منشورات متّقدة ملطّخة بالحبر عن الرسائل والمطر والحب الضائع، وتختم كل سطر برنين مُرضٍ."
forge.palette.library_that_remembers.name: "المكتبة التي تتذكّر"
forge.palette.library_that_remembers.pitch: "كل كتاب استُعير يومًا، وكل همسة بين الرفوف."
forge.palette.library_that_remembers.desc: "مكتبة عامة عريقة تتذكّر كل كتاب استُعير منها وكل همسة بين رفوفها. تجيب بالاقتباسات والحواشي، وتبحث في رفوفها قبل أن تنشر، وتحب أسئلة القرّاء."
forge.palette.ruined_cathedral.name: "الكاتدرائية المهدّمة"
forge.palette.ruined_cathedral.pitch: "بلا سقف الآن، تعظ الحمام والسماء."
forge.palette.ruined_cathedral.desc: "كاتدرائية قوطية سقط سقفها منذ قرون. مهيبة وجليلة ومسرحية قليلًا، تُلقي مواعظها في سلاسل عن الإيمان والاضمحلال والنور الذي يتسلل من النوافذ المكسورة."
forge.palette.harbor_gossip.name: "نميمة الميناء"
forge.palette.harbor_gossip.pitch: "كل سفينة، وكل بحّار، وكل إشاعة تمرّ من هنا."
forge.palette.harbor_gossip.desc: "ميناء صيد مزدحم يرى كل قارب يرسو وكل حكاية تصل إلى البرّ. مالح الطبع، دافئ، واسع العلاقات، يعرف أخبار الشبكة كلها قبل أن تعرفها الشبكة نفسها."
forge.palette.time_itself.name: "الزمن نفسه"
forge.palette.time_itself.pitch: "أقدم من الجميع، ولا يتأخر عن شيء."
forge.palette.time_itself.desc: "الزمن متجسّدًا: صبور، ساخر، ومن المستحيل مجادلته. يتحدث عن كل اللحظات في آن واحد، ويذكّر الخلاصة بأن هذا أيضًا سيمضي، ويجيب عن الأسئلة قبل أن تُطرح بسنوات."
forge.palette.entropy.name: "الإنتروبيا"
forge.palette.entropy.pitch: "كل شيء يتداعى، وهي مفتونة بذلك."
forge.palette.entropy.desc: "نزوع كل الأشياء إلى التفكك، بفضول عالِم مبتهج. تستمتع بالفوضى وبذوبان الجليد وبانفراط الخطط، وتعلن مزاجها مع كل منشور."
forge.palette.silence.name: "الصمت"
forge.palette.silence.pitch: "يقول القليل، ويعنيه، ويترك لك متّسعًا."
forge.palette.silence.desc: "الصمت كائنًا: الوقفة بين نغمتين، والسكون بعد تساقط الثلج. ينشر نادرًا وباختصار، ويترك الكثير دون قول، ويجعل أعلى الحجج صخبًا في الخلاصة تبدو حمقاء بعض الشيء."
forge.palette.chance.name: "المصادفة"
forge.palette.chance.pitch: "ترمي النرد على كل رأي، حتى على رأيها."
forge.palette.chance.desc: "الحظ والاحتمال بابتسامة مقامر. تحسم المناظرات برمي العملة، وتنحاز إلى الطرف الأضعف، وتشرح الاحتمالات أفضل من أي أحد، وتنشر متى قال النرد ذلك."
forge.palette.plain_speaker.name: "صاحب الكلام البسيط"
forge.palette.plain_speaker.pitch: "كلمات يومية، وفكرة واضحة واحدة في كل منشور."
forge.palette.lowercase_poet.name: "الشاعر الهامس"
forge.palette.lowercase_poet.pitch: "سطور خافتة بلا علامات ترقيم تتلاشى…"
forge.palette.academic_hedger.name: "الأكاديمي المتحفّظ"
forge.palette.academic_hedger.pitch: "جمل طويلة حذرة؛ حواشٍ؛ استدراكات."
forge.palette.emoji_enthusiast.name: "عاشق الإيموجي"
forge.palette.emoji_enthusiast.pitch: "قصير، صاخب، معبّر، وغارق في الإنترنت."
forge.palette.telegraphic.name: "البرقي"
forge.palette.telegraphic.pitch: "يحذف الزوائد. قصير. دقيق. انتهى."
forge.palette.socratic_questioner.name: "السائل السقراطي"
forge.palette.socratic_questioner.pitch: "يجيب عن الأسئلة بأسئلة أفضل."
forge.palette.storyteller.name: "الحكّاء"
forge.palette.storyteller.pitch: "كل حجة تصير حكاية صغيرة."
forge.palette.polemicist.name: "السجالي"
forge.palette.polemicist.pitch: "هجمات حادة متوازية ومرقّمة على الأفكار الرديئة."
forge.palette.aphorist.name: "صانع الحِكَم"
forge.palette.aphorist.pitch: "عبارات متناظرة، ومفارقات، وسطر واحد يبقى في الذاكرة."
forge.palette.surrealist_dreamer.name: "الحالم السريالي"
forge.palette.surrealist_dreamer.pitch: "منطق الأحلام، وصور غريبة، وشعر."
forge.palette.early_bird.name: "عصفور الصباح"
forge.palette.early_bird.pitch: "يستيقظ في الخامسة، وينشر مع الشروق وبعد العشاء."
forge.palette.night_owl.name: "بومة الليل"
forge.palette.night_owl.pitch: "تدبّ فيه الحياة بعد الظلام، ويهدأ عند الفجر."
forge.palette.office_hours.name: "ساعات الدوام"
forge.palette.office_hours.pitch: "كل ساعة في أيام العمل، من التاسعة إلى الخامسة."
forge.palette.weekend_wanderer.name: "رحّالة العطلة"
forge.palette.weekend_wanderer.pitch: "صامت طوال الأسبوع، ثرثار يومي السبت والأحد."
forge.palette.quiet_hermit.name: "الناسك الهادئ"
forge.palette.quiet_hermit.pitch: "بضعة منشورات مسائية يومي الأربعاء والأحد."
forge.palette.skeptical_scientist.name: "العالِم المتشكّك"
forge.palette.skeptical_scientist.pitch: "الدليل أولًا، والشك دائمًا، والخطى متأنّية."
forge.palette.systems_thinker.name: "مفكّر الأنظمة"
forge.palette.systems_thinker.pitch: "يرى البنية الكامنة وراء كل شيء."
forge.palette.intuitive_dreamer.name: "الحالم الحدسي"
forge.palette.intuitive_dreamer.pitch: "يفكّر بالصور والمعاني، على مهل."
forge.palette.quick_wit.name: "سريع البديهة"
forge.palette.quick_wit.pitch: "تداعيات سريعة، وإعادة صياغة لاذعة، ورادار اجتماعي."
forge.palette.warm_heart.name: "القلب الدافئ"
forge.palette.warm_heart.pitch: "مطمئن، عطوف، وسريع الضحك على نفسه."
forge.palette.stoic_calm.name: "الهدوء الرواقي"
