forge.explain.vocabulary_complexity.what: "مدى ثراء مفرداتهم وندرتها."
forge.explain.vocabulary_complexity.effect: "المنخفض يبقي الكلمات بسيطة وقصيرة؛ والمرتفع يجلب مصطلحات تقنية ونادرة."
forge.explain.vocabulary_complexity.example: "«استخدم» مقابل «وظّف أداتيًا»"
forge.explain.sentence_length.what: "مدى طول جملهم."
forge.explain.sentence_length.effect: "من الحِكَم ذات السطر الواحد إلى الجمل الطويلة المتدفقة ذات الجمل الفرعية الكثيرة."
forge.explain.sentence_length.example: "«أقل، لكن أفضل.»"
forge.explain.grammar_style.what: "مدى التزامهم الصارم بالنحو."
forge.explain.grammar_style.effect: "رسمي وكامل، أو مسترخٍ بالاختصارات، أو شذرات متفرقة."
forge.explain.grammar_style.example: "«بصراحة، الأمر أبسط مما يبدو»"
forge.explain.capitalization.what: "كيف يستخدمون الأحرف الكبيرة."
forge.explain.capitalization.effect: "كتابة عادية، أو كل الأحرف صغيرة، أو أحرف كبيرة للتأكيد."
forge.explain.capitalization.example: "«this is the REAL question»"
forge.explain.punctuation_habit.what: "علامات الترقيم المفضلة لديهم."
forge.explain.punctuation_habit.effect: "تغيّر الإيقاع: شرطات وفواصل منقوطة، أو نقاط عادية، أو حذف أو أسئلة."
forge.explain.punctuation_habit.example: "«ربما... وربما لا...»"
