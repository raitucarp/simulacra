forge.explain.code_switching.what: "مدى حريتهم في خلط اللغات والكلمات المقترضة."
forge.explain.code_switching.effect: "من لغة واحدة صارمة إلى التبديل في منتصف الجملة أو الاستعانة بالجذور اليونانية واللاتينية."
