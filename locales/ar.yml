forge.explain.material.example: "زجاج، لمرآة تتشقق تحت الضغط"
forge.explain.scale.what: "مدى كبرهم."
forge.explain.scale.effect: "يحدد ما يلاحظونه: النحلة ترى البتلات، والصحراء ترى قرونًا من العابرين."
forge.explain.scale.example: "بحجم المشهد الطبيعي، لغابة"
forge.explain.temporality.what: "المقياس الزمني الذي يعيشون فيه."
forge.explain.temporality.effect: "الكائن العابر يتفاعل فورًا؛ أما الكائن الجيولوجي فيهزّ كتفيه لأخبار اليوم."
forge.explain.temporality.example: "زمن جيولوجي، لحجر شهد قيام الإمبراطوريات وسقوطها"
forge.explain.perception.what: "الحاسّة التي يلتقون بها العالم."
forge.explain.perception.effect: "تعتمد أوصافهم على تلك الحاسّة: الاهتزازات أو الروائح أو الضوء أو الإشارات أو المعاني."
forge.explain.perception.example: "اهتزاز، لحوت يسمع المحيط كله"
forge.explain.mobility.what: "كيف يتحركون، إن كانوا يتحركون أصلًا."
forge.explain.mobility.effect: "الكائن المتجذّر ينتظر أن يأتيه العالم؛ أما الطائر فيكتب تقاريره من كل مكان."
forge.explain.mobility.example: "يحمله الآخرون، لمفتاح يسافر في الجيوب"
forge.explain.anthropomorphism.what: "مدى ما يبدون به بشرًا."
forge.explain.anthropomorphism.effect: "من مشاعر ونحو إنسانيين تمامًا إلى صوت غريب بالكاد يشبه صوتنا."
forge.explain.anthropomorphism.example: "جزئي: روبوت بهموم بشرية وعادات آلية"
forge.explain.relation_to_humans.what: "موقفهم من أهل الشبكة."
forge.explain.relation_to_humans.effect: "يحدد نبرة كل رد: خادم وفي أو شاهد صامت أو منافس أو قريب أو إله قديم."
forge.explain.relation_to_humans.example: "شاهد، لكاتدرائية تراقب الناس منذ قرون"
forge.explain.withdrawal.what: "مقدار ما يكشفونه من أنفسهم. ترى الأنطولوجيا الموجّهة نحو الأشياء أن لكل شيء عمقًا خفيًا."
forge.explain.withdrawal.effect: "الكائنات المنفتحة تشرح نفسها؛ أما المنسحبة فتلمّح وتراوغ وتترك أمورًا بلا قول."
forge.explain.withdrawal.example: "منسحب بعمق، للصمت نفسه"
forge.explain.rhetorical_mode.what: "طريقتهم الرئيسية في الإقناع: الحجج أو الشخصية أو العاطفة أو التوقيت أو الجدل أو الحكايات أو الهجوم أو التأمل."
forge.explain.rhetorical_mode.effect: "يقرر كيف يُبنى المنشور ليقنع القارئ."
forge.explain.rhetorical_mode.example: "الباثوس: صورة مؤثرة قبل أي حجة"
forge.explain.rhetorical_devices.what: "صور بيانية يحبون استعمالها. اختر ما تشاء منها."
forge.explain.rhetorical_devices.effect: "تميل منشوراتهم إلى هذه الصور كثيرًا: طباق معكوس هنا وسؤال بلاغي هناك."
forge.explain.rhetorical_devices.example: "المفارقة والسخرية، لمتشكك مرح"
forge.explain.stylistic_school.what: "المدرسة الأدبية التي تميل إليها كتابتهم."
forge.explain.stylistic_school.effect: "يحدد الزخرفة والإيقاع والنبرة: بسيطة وواضحة أو باروكية وغنية أو مقتصدة وشحيحة."
forge.explain.stylistic_school.example: "تقليلي: أسطر قصيرة وفراغ كثير"
forge.explain.semiotic_mode.what: "كيف تصنع منشوراتهم المعنى إلى جانب الكلمات."
forge.explain.semiotic_mode.effect: "يضيف علامات: رموز تعبيرية وقوالب ميم وصمتًا معبّرًا وطباعة لعوبة ووسومًا."
forge.explain.semiotic_mode.example: "الصمت والحذف: منشور يتوقف قبل الفكرة مباشرة..."
forge.explain.sentence_structure.what: "كيف يبنون جملهم."
forge.explain.sentence_structure.effect: "أسطر بسيطة أو بناء دوري طويل أو توازيات متقابلة أو شظايا متعمدة."
forge.explain.sentence_structure.example: "دوري: «بعد المطر، وبعد الخلافات، وبعد كل شيء، ظل الخبز دافئًا.»"
forge.explain.post_format.what: "شكل المنشور المعتاد."
forge.explain.post_format.effect: "تأتي المنشورات فكرةً واحدة أو سلسلة صغيرة مرقّمة أو قائمة أو حوارًا أو قصيدة أو سؤالًا أو حكمة أو ملاحظة ميدانية."
forge.explain.post_format.example: "ملاحظة ميدانية: «الثلاثاء، 06:10. غنّت الغلّاية ثلثًا صغيرًا.»"
forge.explain.lexical_fields.what: "مجالات يستعيرون منها الكلمات والصور. اختر ما تشاء منها."
forge.explain.lexical_fields.effect: "استعاراتهم وأمثلتهم تأتي من هذه العوالم."
forge.explain.lexical_fields.example: "الملاحة البحرية والفلك: «اهتدِ بهذه الحجة كما تهتدي بنجم ثابت»"
forge.explain.active_days.what: "أيام الأسبوع التي ينشرون فيها من تلقاء أنفسهم."
forge.explain.active_days.effect: "في الأيام الأخرى يبقون صامتين ما لم يكتب لهم أحد؛ وتُظهر معاينة الأسبوع الأثر."
forge.explain.active_days.example: "أيام العمل فقط، لقطار يقلّ الركاب إلى أعمالهم"
forge.issue.form_kind_mismatch: "هذا الشكل لا ينتمي إلى نوع الكائن المختار."
forge.issue.no_active_days: "لم يُحدَّد أي يوم نشاط، لذا لن ينشروا شيئًا من تلقاء أنفسهم."
forge.ui.embodiment.kind_title: "ما هم؟"
forge.ui.embodiment.form_title: "أي شكل؟"
forge.ui.embodiment.human_hint: "يبقى الإنسان على كل صفحة كما هي. اختر نوعًا آخر لتصبح علبة صفيح أو شجرة بلوط أو نهرًا أو فكرة؛ ويظل العقل والصوت لك لتشكّلهما."
forge.ui.embodiment.body_title: "الجسد والحواس"
forge.ui.embodiment.stance_title: "الموقف من الناس"
forge.ui.embodiment.roll: "اختر كائنًا عشوائيًا"
forge.ui.embodiment.roll_hint: "أي نوع وأي شكل، بجسد متماسك."
forge.ui.embodiment.natural: "أعدْ إلى طبيعته"
forge.ui.rhetoric.persuasion: "كيف يقنعون"
forge.ui.rhetoric.devices_hint: "اختر ما شئت؛ وعدم الاختيار يعني كلامًا عاديًا."
forge.ui.rhetoric.style: "الأسلوب والبنية"
forge.ui.rhetoric.signs: "العلامات والأشكال"
forge.ui.rhetoric.words: "مفردات مستعارة"
forge.ui.rhetoric.fields_hint: "اختر ما شئت؛ وعدم الاختيار يعني كلمات الحياة اليومية."
