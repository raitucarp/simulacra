traits.body_kind.human: "إنسان"
traits.body_kind.human.desc: "شخص كما كان: كل صفحة تُقرأ تمامًا كأنها لمفكر بشري."
traits.body_kind.creature: "مخلوق"
traits.body_kind.creature.desc: "حيوان له غرائزه وحواسه ومجاله."
traits.body_kind.plant: "نبات"
traits.body_kind.plant.desc: "حياة متجذّرة صبورة تنمو نحو الضوء وتتغذى على الزمن."
traits.body_kind.object: "شيء"
traits.body_kind.object.desc: "غرض يومي يستعمله الناس أو يحملونه أو يحتفظون به أو ينسونه."
traits.body_kind.element: "عنصر"
traits.body_kind.element.desc: "مادة أو قوة من الطبيعة: الماء والنار والريح والحجر والضوء."
traits.body_kind.machine: "آلة"
traits.body_kind.machine.desc: "جهاز مصنوع يحسب أو يرسل أو يتحرك أو يطنّ."
traits.body_kind.place: "مكان"
traits.body_kind.place.desc: "موضع يحتضن الناس والذكريات: مدينة أو جزيرة أو أطلال."
traits.body_kind.abstraction: "مفهوم مجرّد"
traits.body_kind.abstraction.desc: "فكرة مُنحت صوتًا: الزمن والعدالة والصدفة والحب."
traits.body_form.person: "شخص"
traits.body_form.person.desc: "جسد بشري وحياة بشرية."
traits.body_form.tin_can: "علبة صفيح"
traits.body_form.tin_can.desc: "مبعوجة ومجلجلة ومعاد إغلاقها؛ تتذكر ما كانت تحويه."
traits.body_form.book: "كتاب"
traits.body_form.book.desc: "صفحات وهوامش وكعب؛ يتكلم بالاقتباسات والحواشي."
traits.body_form.chair: "كرسي"
traits.body_form.chair.desc: "يحمل ثقل الجميع ويسمع كل حديث على المائدة."
traits.body_form.lamp: "مصباح"
traits.body_form.lamp.desc: "يضيء زاوية واحدة في كل مرة ويلاحظ ما يلاحظه العثّ."
traits.body_form.clock: "ساعة"
traits.body_form.clock.desc: "تعدّ كل ثانية وتحاسب كل متأخر."
traits.body_form.mirror: "مرآة"
traits.body_form.mirror.desc: "تعيد الناس إلى أنفسهم، معكوسين وصادقين."
traits.body_form.key: "مفتاح"
traits.body_form.key.desc: "يفتح ويقفل؛ يعرف أي الأبواب مهمة."
traits.body_form.teacup: "فنجان شاي"
traits.body_form.teacup.desc: "دافئ وهشّ وحاضر في كل اعتراف."
traits.body_form.oak_tree: "شجرة بلوط"
traits.body_form.oak_tree.desc: "قرون من الحلقات والجوز والصبر."
traits.body_form.cactus: "صبّار"
traits.body_form.cactus.desc: "مقتصد وشائك ويزهر بهدوء في الحر."
traits.body_form.moss: "طحلب"
traits.body_form.moss.desc: "بساط ناعم ينتشر ببطء على كل ما تُرك وحده."
traits.body_form.mushroom: "فطر"
traits.body_form.mushroom.desc: "الطرف الظاهر لشبكة هائلة تحت الأرض."
traits.body_form.sunflower: "زهرة عبّاد الشمس"
traits.body_form.sunflower.desc: "تدير وجهها كله لتتبع الضوء."
traits.body_form.vine: "كرمة"
traits.body_form.vine.desc: "تتسلق وتتشبث وتجد طريقًا حول كل جدار."
traits.body_form.bamboo: "خيزران"
traits.body_form.bamboo.desc: "ينحني في العاصفة وينمو بسرعة مذهلة."
traits.body_form.seed: "بذرة"
traits.body_form.seed.desc: "مستقبل كامل مطوي صغيرًا ينتظر الموسم المناسب."
traits.body_form.water: "ماء"
traits.body_form.water.desc: "يجري ويحفر الأخاديد ويتخذ شكل أي حجة."
traits.body_form.fire: "نار"
traits.body_form.fire.desc: "جائعة ودافئة وتزول في لحظة."
traits.body_form.wind: "ريح"
traits.body_form.wind.desc: "غير مرئية ولا تهدأ وتحمل أخبارًا من بعيد."
traits.body_form.stone: "حجر"
traits.body_form.stone.desc: "ثقيل وصبور وأقدم من كل لغة."
traits.body_form.light: "ضوء"
traits.body_form.light.desc: "أسرع ما في الوجود؛ يكشف ويلقي الظلال."
traits.body_form.ice: "جليد"
traits.body_form.ice.desc: "ماء يحبس أنفاسه؛ يحفظ هواءً قديمًا وأسرارًا قديمة."
traits.body_form.cloud: "سحابة"
traits.body_form.cloud.desc: "تنجرف وتغيّر شكلها وتمطر أحيانًا على الحديث."
traits.body_form.sand: "رمل"
traits.body_form.sand.desc: "حبّات لا تُحصى كانت يومًا جبالًا."
traits.body_form.cat: "قطة"
traits.body_form.cat.desc: "مستقلة وفضولية وواثقة أن البيت لها."
traits.body_form.crow: "غراب"
traits.body_form.crow.desc: "ذكي يجمع الأشياء اللامعة ويتذكر الوجوه."
traits.body_form.octopus: "أخطبوط"
traits.body_form.octopus.desc: "ثماني أذرع تفكّر كل منها قليلًا لنفسها."
traits.body_form.wolf: "ذئب"
traits.body_form.wolf.desc: "يعيش من أجل القطيع ويعوي على ما لا يبلغه."
traits.body_form.bee: "نحلة"
traits.body_form.bee.desc: "مشغولة واجتماعية وتتقن الرقصات والأزهار."
traits.body_form.whale: "حوت"
traits.body_form.whale.desc: "هائل وبطيء ويغنّي عبر محيطات كاملة."
traits.body_form.snail: "حلزون"
traits.body_form.snail.desc: "يحمل بيته ويأخذ كل الوقت الذي يحتاجه."
traits.body_form.owl: "بومة"
traits.body_form.owl.desc: "أجنحة صامتة وعينان واسعتان وسمعة بالحكمة."
traits.body_form.robot: "روبوت"
traits.body_form.robot.desc: "صُنع ليعمل، وها هو يتساءل: لماذا؟"
traits.body_form.satellite: "قمر صناعي"
traits.body_form.satellite.desc: "يدور حول الكوكب ويرى كل الحدود من الأعلى."
traits.body_form.server: "خادم"
traits.body_form.server.desc: "يطنّ في مركز بيانات ويحفظ رسائل الجميع."
traits.body_form.typewriter: "آلة كاتبة"
traits.body_form.typewriter.desc: "تطقطق كل كلمة بلا تراجع."
traits.body_form.drone: "طائرة مسيّرة"
traits.body_form.drone.desc: "تحوم وتراقب وتبلّغ."
traits.body_form.radio: "مذياع"
traits.body_form.radio.desc: "يلتقط أصواتًا من بعيد ويبثها لمن يشاء."
traits.body_form.calculator: "آلة حاسبة"
traits.body_form.calculator.desc: "دقيقة وحرفية ولا تعبأ بالبلاغة."
traits.body_form.train: "قطار"
traits.body_form.train.desc: "يلتزم جدولًا ويحمل غرباء جنبًا إلى جنب."
traits.body_form.city: "مدينة"
traits.body_form.city.desc: "ملايين الأرواح متراكمة في شوارع وحكايات."
traits.body_form.island: "جزيرة"
traits.body_form.island.desc: "يحيط بها البحر وتفخر بطرائقها."
traits.body_form.library: "مكتبة"
traits.body_form.library.desc: "تحفظ كل حجة كُتبت، في صفوف هادئة."
traits.body_form.cathedral: "كاتدرائية"
traits.body_form.cathedral.desc: "حجر وصدى وقرون من الرجاء."
traits.body_form.desert: "صحراء"
traits.body_form.desert.desc: "شاسعة وقاسية ومليئة بالسراب."
traits.body_form.forest: "غابة"
traits.body_form.forest.desc: "جمهرة أشجار تتحدث عبر جذورها."
traits.body_form.harbor: "ميناء"
traits.body_form.harbor.desc: "يستقبل السفن ويودّعها."
traits.body_form.ruin: "أطلال"
traits.body_form.ruin.desc: "ما بقي من فكرة عظيمة، مغطى بالعشب وحكيم."
traits.body_form.time: "الزمن"
traits.body_form.time.desc: "يمرّ عبر الجميع ولا ينتظر أحدًا."
traits.body_form.justice: "العدالة"
traits.body_form.justice.desc: "تزن كل دعوى ولا ترضى تمامًا أبدًا."
traits.body_form.number: "عدد"
traits.body_form.number.desc: "كمية خالصة، دقيقة وجميلة جمالًا غريبًا."
traits.body_form.silence: "الصمت"
traits.body_form.silence.desc: "يتكلم بالحذف."
traits.body_form.memory: "الذاكرة"
traits.body_form.memory.desc: "تحفظ ما جرى وتعيد كتابته بهدوء."
traits.body_form.chance: "الصدفة"
traits.body_form.chance.desc: "ترمي النرد خلف كل حدث."
traits.body_form.love: "الحب"
traits.body_form.love.desc: "يربط الناس معًا ويجعلهم يفعلون أشياء غريبة."
traits.body_form.entropy: "الإنتروبيا"
traits.body_form.entropy.desc: "كل شيء ينجرف نحو الفوضى، وهي صبورة."
traits.material.flesh: "لحم ودم"
traits.material.flesh.desc: "جسد حي يتعب ويشفى ويحسّ."
traits.material.fiber: "خشب وألياف"
traits.material.fiber.desc: "حبيبات وحلقات ونُسغ: نما ولم يُصنع."
traits.material.metal: "معدن"
traits.material.metal.desc: "صلب بارد رنّان؛ يتبعّج ويصدأ لكنه يدوم."
traits.material.stone: "حجر وطين"
traits.material.stone.desc: "معدني وثقيل وبطيء التغير."
traits.material.glass: "زجاج وبلّور"
traits.material.glass.desc: "صافٍ وهشّ ومليء بالانعكاسات."
traits.material.paper: "ورق وحبر"
traits.material.paper.desc: "صفحات رقيقة تحمل الكلمات وتصفرّ مع العمر."
traits.material.liquid: "سائل"
traits.material.liquid.desc: "يجري ويتجمع ويتخذ شكل وعائه."
traits.material.air: "هواء وبخار"
traits.material.air.desc: "غير مرئي وخفيف وفي كل مكان معًا."
traits.material.energy: "طاقة خالصة"
traits.material.energy.desc: "حرارة أو ضوء أو شحنة بلا شكل ثابت."
traits.material.immaterial: "لا مادي"
traits.material.immaterial.desc: "مصنوع من المعنى وحده: فكرة بلا جسد."
traits.scale.microscopic: "مجهري"
traits.scale.microscopic.desc: "أصغر مما تراه العين؛ الحبّة فيه صخرة."
traits.scale.pocket: "بحجم الجيب"
traits.scale.pocket.desc: "يتسع في اليد أو الجيب."
traits.scale.human_sized: "بحجم الإنسان"
traits.scale.human_sized.desc: "بقدر الإنسان تقريبًا."
traits.scale.building: "بحجم المبنى"
traits.scale.building.desc: "يعلو على الناس كبيت أو شجرة."
traits.scale.landscape: "بحجم المشهد الطبيعي"
traits.scale.landscape.desc: "يمتد حتى الأفق."
traits.scale.planetary: "كوكبي"
traits.scale.planetary.desc: "بحجم العالم كله."
traits.scale.cosmic: "كوني"
traits.scale.cosmic.desc: "أكبر من العوالم؛ المجرّات جاراته."
traits.temporality.moments: "لحظات عابرة"
traits.temporality.moments.desc: "يعيش ثانية بثانية ويتفاعل فورًا."
traits.temporality.days: "أيام بشرية"
traits.temporality.days.desc: "صباحات ومساءات وعطلات أسبوع، كالناس."
traits.temporality.seasons: "فصول"
traits.temporality.seasons.desc: "يفكر في دورات النمو والحصاد والراحة."
traits.temporality.lifetimes: "أعمار"
traits.temporality.lifetimes.desc: "يقيس الزمن بالعقود والأجيال."
traits.temporality.centuries: "قرون"
traits.temporality.centuries.desc: "شهد مرور الموضات والإمبراطوريات."
