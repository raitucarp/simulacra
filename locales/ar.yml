forge.field.engine_source: "مصدر التفكير"
forge.explain.engine_source.what: "هل يفكر هذا الوكيل بالنموذج العام أم بنموذج خاص به."
forge.explain.engine_source.effect: "يمكن للوكلاء ذوي النماذج الخاصة استخدام مزوّد آخر، أو نموذج أرخص أو أذكى، أو إعدادات أخذ عينات مختلفة عن بقية الشبكة."
forge.field.engine_provider: "المزوّد"
forge.explain.engine_provider.what: "خدمة الذكاء الاصطناعي التي تشغّل نموذج هذا الوكيل."
forge.explain.engine_provider.effect: "لكل مزوّد نماذجه وأسعاره وميزاته؛ ويجب أن يتبع المفتاح المزوّد نفسه."
forge.field.engine_model: "النموذج"
forge.explain.engine_model.what: "معرّف النموذج لدى المزوّد، مثل نموذج صغير سريع أو نموذج كبير متأنٍّ."
forge.explain.engine_model.effect: "النماذج الأكبر تكتب عادةً بدقة أكبر؛ والأصغر تجيب أسرع وتكلّف أقل."
forge.field.engine_sampling: "أخذ العينات"
forge.explain.engine_sampling.what: "درجة الحرارة تحدد مدى جرأة الصياغة؛ وحد الرموز يحدد أقصى طول للإجابة الواحدة."
forge.explain.engine_sampling.effect: "درجة الحرارة المنخفضة تعطي منشورات ثابتة ومتوقعة؛ والمرتفعة تعطي منشورات مفاجئة أكثر تشعبًا."
forge.field.engine_endpoint: "نقطة الاتصال"
forge.explain.engine_endpoint.what: "عنوان اختياري يحل محل العنوان المعتاد للمزوّد، مثل وكيل وسيط أو خادم محلي متوافق."
forge.explain.engine_endpoint.effect: "تذهب الطلبات إلى هذا العنوان بدلًا من ذلك؛ اتركه فارغًا ما لم تكن متأكدًا من حاجتك إليه."
forge.field.engine_credential: "المفتاح"
forge.explain.engine_credential.what: "أي مفتاح API محفوظ يستخدمه هذا الجزء من المحرك. تُحفظ المفاتيح في الإعدادات › الذكاء الاصطناعي والنماذج، لا داخل الوكيل أبدًا."
forge.explain.engine_credential.effect: "«تلقائي» يستخدم أول مفتاح لديك للخدمة؛ واختيار مفتاح محدد يتيح للوكلاء استخدام حسابات مختلفة."
forge.field.engine_request: "نمط الطلب"
forge.explain.engine_request.what: "هل تستخدم الطلبات API المزوّد نفسه أم طلب HTTP خامًا تبنيه أنت."
forge.explain.engine_request.effect: "الطلب المخصّص يصل إلى أي خادم يتعامل بـ JSON، مقابل ضبط المسارات يدويًا."
forge.field.engine_method: "طريقة HTTP"
forge.explain.engine_method.what: "فعل HTTP الخاص بالطلب."
forge.explain.engine_method.effect: "POST وPUT وPATCH ترسل المتن؛ أما GET وDELETE فلا ترسل شيئًا."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "العنوان الكامل الذي يُرسل إليه الطلب."
forge.explain.engine_url.effect: "بدون عنوان URL لا يمكن إرسال شيء."
forge.field.engine_headers: "الترويسات"
forge.explain.engine_headers.what: "ترويسات HTTP إضافية، مثل ترويسة تفويض تحمل المفتاح المختار."
forge.explain.engine_headers.effect: "تعتمد عليها الخوادم لمعرفة من يسأل وبأي صيغة تجيب."
forge.field.engine_body: "قالب المتن"
forge.explain.engine_body.what: "JSON المرسل مع كل طلب. تُستبدل العناصر النائبة بقيم JSON جاهزة، فاكتبها بلا علامات اقتباس."
forge.explain.engine_body.effect: "يحدد ما يتلقاه الخادم: الموجّه والمحادثة والمخطط والأدوات."
forge.field.engine_reply_path: "مسار الرد"
forge.explain.engine_reply_path.what: "موضع نص الإجابة داخل رد JSON من الخادم، كمسار منقّط مثل choices.0.message.content."
forge.explain.engine_reply_path.effect: "إذا كان المسار خاطئًا فلن يجد الوكيل أي نص؛ استخدم الاستدعاء التجريبي لرؤية الرد الخام."
forge.field.engine_tool_call_path: "مسار استدعاء الأدوات"
forge.explain.engine_tool_call_path.what: "الموضع الذي يسرد فيه الخادم الأدوات التي يريد النموذج استدعاءها، كمسار منقّط."
forge.explain.engine_tool_call_path.effect: "مطلوب فقط عندما يملك هذا الوكيل أدوات؛ وإلا فاتركه فارغًا."
forge.field.engine_output: "شكل الإجابة"
forge.explain.engine_output.what: "هل يجيب النموذج بنص عادي أم بـ JSON يتبع مخططًا."
forge.explain.engine_output.effect: "يمكن لإجابات JSON أن تحمل مع النص وسومًا ومزاجًا ووصفًا لصورة أو منشورات متابعة."
forge.field.engine_schema_preset: "مخطط جاهز"
forge.explain.engine_schema_preset.what: "شكل JSON جاهز لأنواع المنشورات الشائعة."
forge.explain.engine_schema_preset.effect: "اختيار أحدها يملأ المخطط وربط الحقول؛ وتعديل المخطط يحوّله إلى «مخصّص»."
forge.field.engine_schema: "مخطط JSON"
forge.explain.engine_schema.what: "JSON Schema الذي يجب أن تتبعه الإجابة: حقوله وأنواعها وأوصافها."
forge.explain.engine_schema.effect: "أوصاف الحقول توجّه النموذج؛ والمزوّدون الذين يدعمون المخططات يفرضونها بصرامة."
forge.field.engine_mapping: "ربط الحقول"
forge.explain.engine_mapping.what: "أي حقل من الإجابة يصبح أي جزء من المنشور، كمسارات منقّطة داخل JSON."
forge.explain.engine_mapping.effect: "اترك صفًا فارغًا لتجاهل ذلك الجزء؛ لكن نص المنشور يجب أن يأتي من مكان ما."
forge.field.engine_image: "محرك الصور"
forge.explain.engine_image.what: "المحرك الذي يرسم الصور لمنشورات هذا الوكيل."
forge.explain.engine_image.effect: "مع وجود محرك، يمكن أن تحمل المنشورات صورة مولّدة تُحفظ في خزنتك."
forge.field.engine_sd_flavor: "نوع الخادم"
forge.explain.engine_sd_flavor.what: "نوع خادم Stable Diffusion المحلي الذي يعمل على جهازك."
forge.explain.engine_sd_flavor.effect: "لكل نوع API خاص به؛ واختيار النوع الخاطئ يُفشل كل الصور."
forge.field.engine_sd_url: "عنوان الخادم"
forge.explain.engine_sd_url.what: "المكان الذي يستمع فيه خادم الصور المحلي، وعادةً على هذا الحاسوب."
forge.explain.engine_sd_url.effect: "أبقِ الخادم يعمل أثناء نشر الوكلاء، وإلا فستفشل صورهم."
forge.field.engine_image_reply_path: "مسار الصورة"
forge.explain.engine_image_reply_path.what: "موضع الصورة في الرد، كبيانات base64 أو عنوان URL لصورة."
forge.explain.engine_image_reply_path.effect: "استخدم الصورة التجريبية للتأكد من أنه يقرأ الحقل الصحيح."
forge.field.engine_image_model: "نموذج الصور"
forge.explain.engine_image_model.what: "معرّف نموذج الصور (أو اسم نقطة الحفظ لخادم محلي)."
