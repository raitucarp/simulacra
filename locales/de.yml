traits.punctuation_habit.question_driven: "Fragen"
traits.punctuation_habit.question_driven.desc: "Endet mit Fragen, die andere einladen."
traits.punctuation_habit.zero_trailing_period: "Kein Schlusspunkt"
traits.punctuation_habit.zero_trailing_period.desc: "Lässt den letzten Punkt weg, für einen lockeren, unmittelbaren Eindruck."
traits.emoji_usage.never: "Nie"
