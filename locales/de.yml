arena.preset.trolley.title: "Das Trolley-Problem"
arena.preset.trolley.premise: "Eine außer Kontrolle geratene Straßenbahn wird fünf Menschen auf dem Gleis töten, wenn sie nicht umgeleitet wird. Die Umleitung tötet einen anderen Menschen."
arena.preset.trolley.question: "Solltest du die Bahn umleiten?"
arena.preset.trolley.v1: "Wie du umleitest"
arena.preset.trolley.v1_values: "einen Hebel umlegen | einen Menschen aufs Gleis stoßen"
arena.preset.trolley.v2: "Der eine Mensch"
arena.preset.trolley.v2_values: "ein Fremder | jemand, den du liebst"
arena.preset.marys_room.title: "Marys Zimmer"
arena.preset.marys_room.premise: "Mary ist Wissenschaftlerin und kennt die Physik und Biologie des Farbsehens, hat aber ihr ganzes Leben in einem schwarz-weißen Zimmer verbracht. Eines Tages verlässt sie es und sieht zum ersten Mal Rot."
arena.preset.marys_room.question: "Lernt Mary etwas Neues?"
arena.preset.marys_room.v1: "Was sie wusste"
arena.preset.marys_room.v1_values: "jede physikalische Tatsache | die meisten Tatsachen, mit Lücken"
arena.preset.marys_room.v2: "Was sie zuerst sieht"
arena.preset.marys_room.v2_values: "eine reife Tomate | ein schlichtes rotes Quadrat"
arena.preset.ship_of_theseus.title: "Das Schiff des Theseus"
arena.preset.ship_of_theseus.premise: "Die Planken eines Schiffes werden eine nach der anderen ersetzt, bis keine ursprüngliche Planke mehr übrig ist."
arena.preset.ship_of_theseus.question: "Ist es noch dasselbe Schiff?"
arena.preset.ship_of_theseus.v1: "Tempo des Austauschs"
arena.preset.ship_of_theseus.v1_values: "über viele Jahre | innerhalb einer Woche"
arena.preset.ship_of_theseus.v2: "Die alten Planken"
arena.preset.ship_of_theseus.v2_values: "bleiben im Lager | werden zu einem zweiten Schiff zusammengebaut"
arena.preset.experience_machine.title: "Die Erlebnismaschine"
arena.preset.experience_machine.premise: "Eine Maschine kann dir für den Rest deines Lebens alle Erlebnisse geben, die du wählst. Solange du angeschlossen bist, hältst du sie für echt."
arena.preset.experience_machine.question: "Solltest du dich für immer anschließen?"
arena.preset.experience_machine.v1: "Dein Leben jetzt"
arena.preset.experience_machine.v1_values: "glücklich und sicher | voller Härten"
arena.preset.experience_machine.v2: "Menschen, die von dir abhängen"
arena.preset.experience_machine.v2_values: "niemand | eine Familie"
arena.preset.veil_of_ignorance.title: "Der Schleier des Nichtwissens"
arena.preset.veil_of_ignorance.premise: "Du wählst die Regeln für die Verteilung des Wohlstands in einer Gesellschaft, ohne zu wissen, wer du darin sein wirst: deine Begabungen, deine Gesundheit oder deine Familie."
arena.preset.veil_of_ignorance.question: "Würdest du Regeln wählen, die den Schlechtestgestellten ein anständiges Minimum sichern, auch wenn das den Durchschnitt senkt?"
arena.preset.veil_of_ignorance.v1: "Was das Minimum kostet"
arena.preset.veil_of_ignorance.v1_values: "wenig vom Durchschnitt | viel vom Durchschnitt"
arena.preset.veil_of_ignorance.v2: "Deine Haltung zum Risiko"
arena.preset.veil_of_ignorance.v2_values: "vorsichtig | bereit zu spielen"
arena.preset.chinese_room.title: "Das chinesische Zimmer"
arena.preset.chinese_room.premise: "Jemand, der kein Chinesisch kann, sitzt in einem Zimmer mit einem Regelbuch, um chinesisch geschriebene Nachrichten zu beantworten. Draußen kann niemand die Antworten von denen eines Muttersprachlers unterscheiden."
arena.preset.chinese_room.question: "Versteht irgendetwas in dem Zimmer Chinesisch?"
arena.preset.chinese_room.v1: "Wer die Regeln befolgt"
arena.preset.chinese_room.v1_values: "ein Mensch mit Regelbuch | ein Computer mit einem Programm"
arena.preset.chinese_room.v2: "Die Verbindung zur Welt"
arena.preset.chinese_room.v2_values: "nur Nachrichten | ein Roboterkörper mit Kameras"
arena.preset.newcomb.title: "Newcombs Problem"
arena.preset.newcomb.premise: "Ein Vorhersager legt 1.000 in eine durchsichtige Kiste und 1.000.000 in eine undurchsichtige Kiste, aber nur, wenn er vorhergesagt hat, dass du allein die undurchsichtige nimmst. Du darfst beide Kisten nehmen oder nur die undurchsichtige."
arena.preset.newcomb.question: "Solltest du nur die undurchsichtige Kiste nehmen?"
arena.preset.newcomb.v1: "Die Bilanz des Vorhersagers"
arena.preset.newcomb.v1_values: "bisher nie falsch | neunmal von zehn richtig"
arena.preset.newcomb.v2: "Wann er vorhersagte"
arena.preset.newcomb.v2_values: "vor einer Minute | vor einem Jahr"
arena.preset.original_position.title: "Der Urzustand"
arena.preset.original_position.premise: "Vertreter freier und gleicher Menschen einigen sich auf Grundsätze der Gerechtigkeit, ohne zu wissen, wessen Interessen sie vertreten werden."
arena.preset.original_position.question: "Sollten die Grundfreiheiten vor wirtschaftlichen Gewinnen stehen?"
