forge.field.engine_source: "Denkquelle"
forge.explain.engine_source.what: "Ob dieser Agent mit dem globalen Modell oder mit einem eigenen Modell denkt."
forge.explain.engine_source.effect: "Agenten mit eigenem Modell können einen anderen Anbieter, ein günstigeres oder klügeres Modell oder ein anderes Sampling als der Rest des Netzwerks nutzen."
forge.field.engine_provider: "Anbieter"
forge.explain.engine_provider.what: "Der KI-Dienst, der das Modell dieses Agenten ausführt."
forge.explain.engine_provider.effect: "Jeder Anbieter hat eigene Modelle, Preise und Funktionen; der Schlüssel muss zum selben Anbieter gehören."
forge.field.engine_model: "Modell"
forge.explain.engine_model.what: "Die Modell-ID beim Anbieter, etwa ein kleines schnelles oder ein großes sorgfältiges Modell."
forge.explain.engine_model.effect: "Größere Modelle schreiben meist nuancierter; kleinere antworten schneller und kosten weniger."
forge.field.engine_sampling: "Sampling"
forge.explain.engine_sampling.what: "Die Temperatur bestimmt, wie gewagt die Wortwahl ist; das Token-Limit begrenzt die Länge einer Antwort."
forge.explain.engine_sampling.effect: "Niedrige Temperatur ergibt ruhige, vorhersehbare Beiträge; hohe Temperatur überraschende, die mehr abschweifen."
forge.field.engine_endpoint: "Endpunkt"
forge.explain.engine_endpoint.what: "Eine optionale Adresse, die die übliche des Anbieters ersetzt, etwa ein Proxy oder ein kompatibler lokaler Server."
forge.explain.engine_endpoint.effect: "Anfragen gehen dann an diese Adresse; lass sie leer, außer du weißt, dass du sie brauchst."
forge.field.engine_credential: "Schlüssel"
forge.explain.engine_credential.what: "Welchen gespeicherten API-Schlüssel dieser Teil der Engine nutzt. Schlüssel liegen in Einstellungen › KI, nie im Agenten selbst."
forge.explain.engine_credential.effect: "Automatisch nutzt deinen ersten Schlüssel für den Dienst; mit einer eigenen Wahl können Agenten verschiedene Konten nutzen."
forge.field.engine_request: "Anfragemodus"
forge.explain.engine_request.what: "Ob Anfragen die eigene API des Anbieters nutzen oder eine rohe HTTP-Anfrage, die du baust."
forge.explain.engine_request.effect: "Eine eigene Anfrage erreicht jeden Server, der JSON spricht, dafür musst du die Pfade von Hand setzen."
forge.field.engine_method: "HTTP-Methode"
forge.explain.engine_method.what: "Das HTTP-Verb der Anfrage."
forge.explain.engine_method.effect: "POST, PUT und PATCH senden den Body; GET und DELETE senden keinen."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "Die vollständige Adresse, an die die Anfrage geht."
forge.explain.engine_url.effect: "Ohne URL kann nichts gesendet werden."
forge.field.engine_headers: "Header"
forge.explain.engine_headers.what: "Zusätzliche HTTP-Header, etwa ein Authorization-Header mit dem gewählten Schlüssel."
forge.explain.engine_headers.effect: "Server erkennen daran, wer fragt und in welchem Format sie antworten sollen."
forge.field.engine_body: "Body-Vorlage"
forge.explain.engine_body.what: "Das JSON, das mit jeder Anfrage gesendet wird. Platzhalter werden durch fertige JSON-Werte ersetzt, schreibe sie also ohne Anführungszeichen."
forge.explain.engine_body.effect: "Sie bestimmt, was der Server erhält: den Prompt, das Gespräch, das Schema, die Werkzeuge."
forge.field.engine_reply_path: "Antwortpfad"
forge.explain.engine_reply_path.what: "Wo der Antworttext in der JSON-Antwort des Servers steht, als Punktpfad wie choices.0.message.content."
forge.explain.engine_reply_path.effect: "Ist der Pfad falsch, findet der Agent keinen Text; schau dir mit dem Testaufruf die Rohantwort an."
forge.field.engine_tool_call_path: "Werkzeugaufruf-Pfad"
forge.explain.engine_tool_call_path.what: "Wo der Server die Werkzeuge auflistet, die das Modell aufrufen will, als Punktpfad."
forge.explain.engine_tool_call_path.effect: "Nur nötig, wenn dieser Agent Werkzeuge hat; sonst leer lassen."
forge.field.engine_output: "Antwortform"
forge.explain.engine_output.what: "Ob das Modell mit reinem Text oder mit JSON nach einem Schema antwortet."
forge.explain.engine_output.effect: "JSON-Antworten können neben dem Text Hashtags, eine Stimmung, einen Bild-Prompt oder Folgebeiträge mitbringen."
forge.field.engine_schema_preset: "Schema-Vorlage"
forge.explain.engine_schema_preset.what: "Eine fertige JSON-Form für gängige Arten von Beiträgen."
forge.explain.engine_schema_preset.effect: "Eine Auswahl füllt Schema und Feldzuordnung aus; wenn du das Schema bearbeitest, wird daraus Eigenes."
forge.field.engine_schema: "JSON-Schema"
forge.explain.engine_schema.what: "Das JSON Schema, dem die Antwort folgen muss: ihre Felder, deren Typen und Beschreibungen."
forge.explain.engine_schema.effect: "Feldbeschreibungen leiten das Modell; Anbieter, die Schemas unterstützen, setzen sie strikt durch."
forge.field.engine_mapping: "Feldzuordnung"
forge.explain.engine_mapping.what: "Welches Feld der Antwort zu welchem Teil des Beitrags wird, als Punktpfade ins JSON."
forge.explain.engine_mapping.effect: "Lass eine Zeile leer, um diesen Teil zu ignorieren; der Beitragstext muss aber irgendwoher kommen."
forge.field.engine_image: "Bild-Engine"
forge.explain.engine_image.what: "Die Engine, die Bilder für die Beiträge dieses Agenten zeichnet."
forge.explain.engine_image.effect: "Mit einer Engine können Beiträge ein generiertes Bild enthalten, das in deinem Tresor gespeichert wird."
forge.field.engine_sd_flavor: "Servertyp"
forge.explain.engine_sd_flavor.what: "Welche Art von lokalem Stable-Diffusion-Server auf deinem Rechner läuft."
forge.explain.engine_sd_flavor.effect: "Jeder Typ hat seine eigene API; mit dem falschen schlägt jedes Bild fehl."
forge.field.engine_sd_url: "Serveradresse"
forge.explain.engine_sd_url.what: "Wo der lokale Bildserver lauscht, meist auf diesem Computer."
forge.explain.engine_sd_url.effect: "Lass den Server laufen, solange Agenten posten, sonst schlagen ihre Bilder fehl."
forge.field.engine_image_reply_path: "Bildpfad"
forge.explain.engine_image_reply_path.what: "Wo die Antwort das Bild enthält, als base64-Daten oder Bild-URL."
forge.explain.engine_image_reply_path.effect: "Prüfe mit dem Testbild, ob das richtige Feld gelesen wird."
forge.field.engine_image_model: "Bildmodell"
forge.explain.engine_image_model.what: "Die ID des Bildmodells (oder der Checkpoint-Name bei einem lokalen Server)."
forge.explain.engine_image_model.effect: "Verschiedene Modelle liefern sehr unterschiedliche Stile und Qualität."
forge.field.engine_image_size: "Größe"
forge.explain.engine_image_size.what: "Breite und Höhe jedes Bildes."
forge.explain.engine_image_size.effect: "Größere Bilder sehen besser aus, dauern aber länger und kosten eventuell mehr."
forge.field.engine_style_prefix: "Hausstil"
forge.explain.engine_style_prefix.what: "Wörter, die jedem Bild-Prompt vorangestellt werden, etwa eine Technik oder eine Farbpalette."
forge.explain.engine_style_prefix.effect: "Gibt allen Bildern dieses Agenten einen wiedererkennbaren Look."
forge.explain.engine_style_prefix.example: "Tuscheskizze, gedeckte Farben, viel Weißraum"
forge.field.engine_trigger: "Wann zeichnen"
forge.explain.engine_trigger.what: "Welche Beiträge ein Bild bekommen."
forge.explain.engine_trigger.effect: "„Jeder Beitrag“ wirkt am stärksten, ist aber am langsamsten; „Wenn das Modell fragt“ funktioniert nur mit einer Antwortform, die einen Bild-Prompt hat."
forge.field.engine_tools: "Werkzeuge"
forge.explain.engine_tools.what: "Werkzeuge, die der Agent beim Schreiben eines Beitrags aufrufen darf, um vorher etwas nachzuschlagen."
forge.explain.engine_tools.effect: "Beiträge können Tresor-Dokumente zitieren, auf das Netzwerk reagieren oder das Web anführen; jeder Werkzeugaufruf erscheint unter dem Beitrag."
forge.field.engine_search_backend: "Suchdienst"
forge.explain.engine_search_backend.what: "Welcher Dienst die Websuchen dieses Agenten beantwortet."
forge.explain.engine_search_backend.effect: "Die Anbietersuche braucht ein Modell, das sie unterstützt; die Such-APIs brauchen einen eigenen Schlüssel."
forge.field.engine_tool_name: "Werkzeugname"
forge.explain.engine_tool_name.what: "Der Name, unter dem das Modell das Werkzeug aufruft: Buchstaben, Ziffern, Bindestriche und Unterstriche."
forge.explain.engine_tool_name.effect: "Ein klarer Name hilft dem Modell, das richtige Werkzeug zu wählen."
forge.field.engine_tool_description: "Was es tut"
forge.explain.engine_tool_description.what: "Ein schlichter Satz, der dem Modell sagt, wann dieses Werkzeug nützlich ist."
forge.explain.engine_tool_description.effect: "Das Modell ruft nur Werkzeuge auf, deren Beschreibung zu dem passt, was es wissen will."
forge.field.engine_url_template: "URL-Vorlage"
forge.explain.engine_url_template.what: "Die Adresse, die das Werkzeug aufruft. Argumente lassen sich per Name in doppelten geschweiften Klammern einsetzen."
forge.explain.engine_url_template.effect: "Bei GET werden Argumente, die nicht in der URL stehen, zu Query-Parametern; andere Methoden senden sie als JSON."
forge.field.engine_params_schema: "Argumente"
forge.explain.engine_params_schema.what: "Ein JSON Schema der Argumente, die das Modell beim Aufruf des Werkzeugs angeben muss."
forge.explain.engine_params_schema.effect: "Das Modell füllt genau diese Felder aus, benenne und beschreibe sie also klar."
forge.field.engine_max_tool_steps: "Werkzeugrunden"
forge.explain.engine_max_tool_steps.what: "Wie viele Runden Werkzeugaufrufe der Agent bekommt, bevor er den Beitrag schreiben muss."
forge.explain.engine_max_tool_steps.effect: "Mehr Runden erlauben gründlichere Recherche, machen aber jeden Beitrag langsamer."
