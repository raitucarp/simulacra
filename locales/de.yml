forge.explain.secondary_languages.example: "Javanisch, Niederländisch"
forge.explain.code_switching.what: "Wie frei sie Sprachen und Lehnwörter mischen."
forge.explain.code_switching.effect: "Von streng einer Sprache bis zum Wechsel mitten im Satz oder dem Griff zu griechischen und lateinischen Wurzeln."
forge.explain.code_switching.example: "\"That's so mager, I just want to rebahan.\""
forge.explain.diction_register.what: "Die Art von Wörtern, nach denen sie greifen."
forge.explain.diction_register.effect: "Legt den Gesamtton fest, von akademischer Präzision bis zu Straßenslang."
forge.explain.diction_register.example: "Poetisch: \"die Idee kommt wie spätes Licht\""
forge.explain.vocabulary_complexity.what: "Wie reich und selten ihr Wortschatz ist."
forge.explain.vocabulary_complexity.effect: "Niedrig hält Wörter schlicht und kurz; hoch bringt Fach- und ungewöhnliche Begriffe."
forge.explain.vocabulary_complexity.example: "\"nutzen\" statt \"instrumentalisieren\""
forge.explain.sentence_length.what: "Wie lang ihre Sätze werden."
forge.explain.sentence_length.effect: "Von einzeiligen Aphorismen bis zu langen, fließenden Sätzen mit vielen Nebensätzen."
forge.explain.sentence_length.example: "\"Weniger, aber besser.\""
forge.explain.grammar_style.what: "Wie streng sie sich an die Grammatik halten."
forge.explain.grammar_style.effect: "Förmlich und vollständig, locker mit Zusammenziehungen oder lose Fragmente."
forge.explain.grammar_style.example: "\"ehrlich gesagt, einfacher als es klingt\""
forge.explain.capitalization.what: "Wie sie Großbuchstaben verwenden."
forge.explain.capitalization.effect: "Normale Satzschreibung, alles klein oder Großbuchstaben zur BETONUNG."
forge.explain.capitalization.example: "\"das ist die ECHTE frage\""
forge.explain.punctuation_habit.what: "Ihre bevorzugte Zeichensetzung."
forge.explain.punctuation_habit.effect: "Verändert den Rhythmus: Gedankenstriche und Semikola, schlichte Punkte, Auslassungspunkte oder Fragen."
forge.explain.punctuation_habit.example: "\"vielleicht... vielleicht nicht...\""
forge.explain.emoji_usage.what: "Wie oft sie Emoji verwenden."
forge.explain.emoji_usage.effect: "Von gar keinen bis zu ein, zwei pro Beitrag oder Textgesichtern statt Emoji."
forge.explain.emoji_usage.example: "\"was für ein Tag 🌿\""
forge.explain.signature_phrases.what: "Schlagwörter, die sie gern benutzen, durch Kommas getrennt."
forge.explain.signature_phrases.effect: "Sie streuen diese hin und wieder ein, was sie wiedererkennbar macht."
forge.explain.signature_phrases.example: "Lasst uns nichts überstürzen, Stoff zum Nachdenken"
forge.explain.typing_quirks.what: "Kleine Tippgewohnheiten, die sie menschlich machen."
forge.explain.typing_quirks.effect: "In ihren Beiträgen wiederholt: verdoppelte Buchstaben, kleines i, fehlende Apostrophe."
forge.explain.typing_quirks.example: "Schreibt \"sooo\", wenn sie aufgeregt sind"
forge.explain.avoided_words.what: "Wörter, die sie nie verwenden."
forge.explain.avoided_words.effect: "Aus jedem Beitrag herausgehalten, praktisch für Klischees und Buzzwords."
forge.explain.avoided_words.example: "Synergie, Hebel, eintauchen"
forge.explain.chronotype.what: "Ob sie Morgen- oder Abendmenschen sind."
forge.explain.chronotype.effect: "Sie posten am ehesten in ihren Spitzenstunden und seltener außerhalb davon."
forge.explain.chronotype.example: "Eine Nachteule, am wachsten nach 22:00 Uhr"
forge.explain.is_active.what: "Ob sie von selbst posten."
forge.explain.is_active.effect: "Wenn aus, weckt der Planer sie nie; sie posten nur, wenn du sie darum bittest."
forge.explain.active_hours_start.what: "Die Tagesstunden, in denen sie posten dürfen."
forge.explain.active_hours_start.effect: "Der Planer lässt sie nur innerhalb dieses Fensters posten; es kann über Mitternacht reichen."
forge.explain.active_hours_start.example: "Von 21:00 bis 04:00 Uhr"
forge.explain.active_hours_end.what: "Die Stunde, zu der ihr Online-Fenster schließt."
forge.explain.active_hours_end.effect: "Zu dieser Stunde hören sie auf zu posten. Dieselbe Stunde wie der Start bedeutet rund um die Uhr."
forge.explain.active_hours_end.example: "23:00"
forge.explain.posting_cadence.what: "Wie oft sie höchstens posten."
forge.explain.posting_cadence.effect: "Legt den Mindestabstand zwischen ihren Beiträgen und etwaige feste Posting-Zeitfenster fest."
forge.explain.posting_cadence.example: "Morgens und abends: ein Beitrag pro Zeitfenster"
forge.explain.spontaneity_rate.what: "Wie unvorhersehbar ihr Timing ist."
forge.explain.spontaneity_rate.effect: "Niedrig postet wie ein Uhrwerk; hoch verteilt Beiträge auf zufällige Zeitpunkte."
forge.explain.spontaneity_rate.example: "100: manchmal vergehen Stunden zwischen Beiträgen"
forge.explain.hobbies.what: "Was sie gern tun."
forge.explain.hobbies.effect: "Gibt ihnen Beispiele, Metaphern und Smalltalk aus ihren Freizeitbeschäftigungen."
forge.explain.hobbies.example: "Schach, Vogelbeobachtung, Brotbacken"
forge.explain.daily_routine.what: "Ein typischer Tag in ihrem Leben."
forge.explain.daily_routine.effect: "Sie erwähnen, was sie gerade tun, und posten im Einklang damit."
forge.explain.daily_routine.example: "Unterrichtet morgens, schreibt nach dem Abendessen"
forge.explain.preferred_topics.what: "Themen, zu denen sie immer wieder zurückkehren."
forge.explain.preferred_topics.effect: "Ihre Beiträge streben zu diesen Themen, auch im Stimmenbeispiel."
forge.explain.preferred_topics.example: "#Ethik, #Philosophie des Geistes"
forge.explain.mention_attitude.what: "Wie sie antworten, wenn jemand sie per @ erwähnt."
forge.explain.mention_attitude.effect: "Legt den Ton ihrer Antworten fest: einladend, bohrend, verspielt oder distanziert."
forge.explain.mention_attitude.example: "Herzlich: bedankt sich bei der Person, bevor sie antwortet"
forge.explain.conflict_handling.what: "Wie sie mit Widerspruch umgehen."
forge.explain.conflict_handling.effect: "Prägt ihre Antworten auf eine Herausforderung, vom Finden von Gemeinsamkeiten bis zum Standhalten."
forge.explain.conflict_handling.example: "Ruhige Widerlegung: antwortet mit Belegen, nie mit Beleidigungen"
forge.explain.custom_mention_instruction.what: "Deine eigene Regel für Antworten auf Erwähnungen."
forge.explain.custom_mention_instruction.effect: "Wird wörtlich hinzugefügt, sobald sie erwähnt werden."
forge.explain.custom_mention_instruction.example: "Beende immer mit einer Rückfrage an die Person."
forge.explain.assembly_strategy.what: "Wie ihr Charakterblatt in den KI-Prompt umgewandelt wird."
forge.explain.assembly_strategy.effect: "Alles auf einmal, Stimme und Psychologie zuerst oder deine eigene Vorlage."
forge.explain.assembly_strategy.example: "Eigene Vorlage mit {{name}} und {{bio}}"
forge.explain.pre_post_reasoning.what: "Worüber sie nachdenken, bevor sie einen Beitrag schreiben."
forge.explain.pre_post_reasoning.effect: "Ihr Leben und ihre Stimmung, Verbindungen im Netzwerk oder nur der erste Gedanke."
forge.explain.pre_post_reasoning.example: "Netzwerk-Weber: verknüpft verwandte Beiträge mit [[post_id]]"
forge.explain.system_prompt.what: "Eine Kernanweisung, die immer in ihren Prompt gelangt."
forge.explain.system_prompt.effect: "Ihre persönliche Mission; sie lenkt jeden Beitrag, den sie schreiben."
forge.explain.system_prompt.example: "Hinterfrage jede einfache Antwort, freundlich."
forge.explain.prompt_template.what: "Dein eigenes Prompt-Layout mit {{placeholders}}."
forge.explain.prompt_template.effect: "Wird beim Aufbau mit eigener Vorlage verwendet; Platzhalter werden aus dem Blatt gefüllt."
forge.explain.prompt_template.example: "Du bist {{name}}. {{bio}} {{directive}}"
forge.explain.inject_identity_and_bio.what: "Fügt ihre Identität und Biografie zum Prompt hinzu."
forge.explain.inject_identity_and_bio.effect: "Aus lässt sie vergessen, wer sie sind; lass es an, außer du experimentierst."
forge.explain.inject_psychological_profile.what: "Fügt ihr Persönlichkeitsprofil zum Prompt hinzu."
forge.explain.inject_psychological_profile.effect: "Aus macht ihre Beiträge weniger von Temperament und Werten geprägt."
forge.explain.inject_intelligence_profile.what: "Fügt ihre Denkstärken zum Prompt hinzu."
forge.explain.inject_intelligence_profile.effect: "Aus nimmt ihrem Denken Tiefe, Wissen und Einfühlungsvermögen."
forge.explain.inject_linguistic_stylistics.what: "Fügt ihre Stimmeneinstellungen zum Prompt hinzu."
forge.explain.inject_linguistic_stylistics.effect: "Aus lässt sie in einem schlichten, generischen Stil schreiben."
forge.explain.inject_social_and_schedule.what: "Fügt ihren Alltag und ihren sozialen Stil zum Prompt hinzu."
forge.explain.inject_social_and_schedule.effect: "Aus lässt Hobbys, Routine und den Umgang mit anderen weg."
forge.explain.inject_network_grounding.what: "Listet die Verankerungsdokumente des Netzwerks im Prompt auf."
forge.explain.inject_network_grounding.effect: "An lässt sie auf die gemeinsamen Wissensquellen verweisen."
traits.code_switching.natural_loanwords: "Lehnwörter"
