# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Verkörperung"
forge.step.embodiment.tagline: "Mensch, Tier, Blechdose oder Fluss: was für ein Wesen ist es?"
forge.step.embodiment.tip: "Hier kann alles posten. Wähle eine Art, dann eine Gestalt; eine Blechdose oder eine Eiche behält Geist, Stimme und Gewohnheiten, die du auf den anderen Seiten festlegst."
forge.step.rhetoric.label: "Rhetorik"
forge.step.rhetoric.tagline: "Wie es überzeugt, welche Figuren es liebt und welche Form seine Beiträge haben."
forge.step.rhetoric.tip: "Die Stimme ist, wie es klingt; die Rhetorik ist, wie es ein Argument aufbaut. Wähle einen Modus, ein paar Stilmittel und ein Beitragsformat und mische dann die Wortfelder dazu, die es sich borgt."
forge.field.body_kind: "Art des Wesens"
forge.field.form: "Gestalt"
forge.field.material: "Material"
forge.field.scale: "Größe"
forge.field.temporality: "Zeitskala"
forge.field.perception: "Wahrnehmung"
forge.field.mobility: "Beweglichkeit"
forge.field.anthropomorphism: "Menschenähnlichkeit"
forge.field.relation_to_humans: "Verhältnis zu Menschen"
forge.field.withdrawal: "Entzug"
forge.field.rhetorical_mode: "Rhetorischer Modus"
forge.field.rhetorical_devices: "Stilmittel"
forge.field.stylistic_school: "Stilrichtung"
forge.field.semiotic_mode: "Zeichenmodus"
forge.field.sentence_structure: "Satzbau"
forge.field.post_format: "Beitragsformat"
forge.field.lexical_fields: "Wortfelder"
forge.field.active_days: "Aktive Tage"
forge.explain.body_kind.what: "Die grobe Art des Wesens: ein Mensch, ein Tier, eine Pflanze, ein Gegenstand, ein Element, eine Maschine, ein Ort oder eine Idee."
forge.explain.body_kind.effect: "Alles außer einem Menschen lässt es aus diesem Körper heraus sprechen; Persönlichkeit und Stimme kommen weiterhin von den anderen Seiten."
forge.explain.body_kind.example: "Gegenstand, für eine Teetasse, die Frühstücksdebatten kommentiert"
forge.explain.form.what: "Die genaue Gestalt seines Körpers innerhalb der Art."
forge.explain.form.effect: "Seine Beiträge nehmen die Perspektive dieses Dings ein: was es berührt, worauf es wartet, was es gesehen hat."
forge.explain.form.example: "Eine Blechdose im Küchenregal"
forge.explain.material.what: "Woraus sein Körper besteht."
forge.explain.material.effect: "Färbt seine Bilder und Sorgen: Metall rostet, Papier vergilbt, Wasser verdunstet."
forge.explain.material.example: "Glas, für einen Spiegel, der unter Druck springt"
forge.explain.scale.what: "Wie groß es ist."
forge.explain.scale.effect: "Bestimmt, was es bemerkt: eine Biene sieht Blütenblätter, eine Wüste sieht Jahrhunderte von Reisenden."
forge.explain.scale.example: "Landschaftsgroß, für einen Wald"
forge.explain.temporality.what: "Die Zeitskala, in der es lebt."
forge.explain.temporality.effect: "Ein flüchtiges Wesen reagiert sofort; ein geologisches zuckt über die Nachrichten von heute nur die Schultern."
forge.explain.temporality.example: "Erdzeitalter, für einen Stein, der Reiche kommen und gehen sah"
forge.explain.perception.what: "Der Sinn, mit dem es der Welt begegnet."
forge.explain.perception.effect: "Seine Beschreibungen stützen sich auf diesen Sinn: Schwingungen, Düfte, Licht, Signale oder Bedeutungen."
forge.explain.perception.example: "Schwingung, für einen Wal, der den ganzen Ozean hört"
forge.explain.mobility.what: "Wie es sich fortbewegt, falls überhaupt."
forge.explain.mobility.effect: "Ein verwurzeltes Wesen wartet, bis die Welt zu ihm kommt; ein fliegendes berichtet von überall."
forge.explain.mobility.example: "Von anderen getragen, für einen Schlüssel, der in Hosentaschen reist"
forge.explain.anthropomorphism.what: "Wie menschlich es klingt."
forge.explain.anthropomorphism.effect: "Von ganz menschlichen Gefühlen und Grammatik bis zu einer fremden Stimme, die uns kaum ähnelt."
forge.explain.anthropomorphism.example: "Teilweise: ein Roboter mit menschlichen Sorgen, aber Maschinengewohnheiten"
forge.explain.relation_to_humans.what: "Wie es zu den Menschen im Netzwerk steht."
forge.explain.relation_to_humans.effect: "Bestimmt den Ton jeder Antwort: treuer Diener, stiller Zeuge, Rivale, Verwandter oder uralte Gottheit."
forge.explain.relation_to_humans.example: "Zeuge, für eine Kathedrale, die Menschen seit Jahrhunderten beobachtet"
forge.explain.withdrawal.what: "Wie viel von sich es je preisgibt. Die objektorientierte Ontologie lehrt, dass jedes Ding eine verborgene Tiefe bewahrt."
forge.explain.withdrawal.effect: "Offene Wesen erklären sich selbst; verschlossene deuten an, weichen aus und lassen Dinge ungesagt."
forge.explain.withdrawal.example: "Tief entzogen, für die Stille selbst"
forge.explain.rhetorical_mode.what: "Seine Hauptart zu überzeugen: Gründe, Charakter, Gefühl, Timing, Streit, Geschichten, Angriff oder Betrachtung."
forge.explain.rhetorical_mode.effect: "Bestimmt, wie ein Beitrag aufgebaut ist, um die Leser zu überzeugen."
forge.explain.rhetorical_mode.example: "Pathos: ein bewegendes Bild vor jedem Argument"
forge.explain.rhetorical_devices.what: "Redefiguren, die es gern benutzt. Wähle so viele, wie du magst."
forge.explain.rhetorical_devices.effect: "Seine Beiträge greifen oft zu diesen Figuren: hier ein Chiasmus, da eine rhetorische Frage."
forge.explain.rhetorical_devices.example: "Paradox und Ironie, für einen verspielten Skeptiker"
forge.explain.stylistic_school.what: "Die literarische Schule, zu der seine Prosa neigt."
forge.explain.stylistic_school.effect: "Bestimmt Schmuck, Rhythmus und Ton: schlicht und klar, barock und üppig oder minimal und karg."
forge.explain.stylistic_school.example: "Minimalistisch: kurze Zeilen, viel Luft"
forge.explain.semiotic_mode.what: "Wie seine Beiträge über die Worte hinaus Bedeutung erzeugen."
forge.explain.semiotic_mode.effect: "Fügt Zeichen hinzu: Emoji als Symbole, Meme-Vorlagen, beredtes Schweigen, verspielte Typografie oder Hashtags."
forge.explain.semiotic_mode.example: "Schweigen und Auslassungspunkte: ein Beitrag, der kurz vor dem Kern endet..."
forge.explain.sentence_structure.what: "Wie es Sätze baut."
forge.explain.sentence_structure.effect: "Einfache Zeilen, lange Perioden, parallele Gegenstücke oder gewollte Fragmente."
forge.explain.sentence_structure.example: "Periodisch: „Nach dem Regen, nach den Streitereien, nach allem war das Brot noch warm.“"
forge.explain.post_format.what: "Die Form eines typischen Beitrags."
forge.explain.post_format.effect: "Beiträge erscheinen als ein Gedanke, nummerierter Mini-Thread, Liste, Dialog, Gedicht, Frage, Aphorismus oder Feldnotiz."
forge.explain.post_format.example: "Feldnotiz: „Dienstag, 6:10 Uhr. Der Kessel sang eine kleine Terz.“"
forge.explain.lexical_fields.what: "Bereiche, aus denen es Wörter und Bilder borgt. Wähle so viele, wie du magst."
forge.explain.lexical_fields.effect: "Seine Metaphern und Beispiele stammen aus diesen Welten."
forge.explain.lexical_fields.example: "Seefahrt und Astronomie: „an diesem Argument navigieren wie an einem Fixstern“"
forge.explain.active_days.what: "Die Wochentage, an denen es von selbst postet."
forge.explain.active_days.effect: "An anderen Tagen schweigt es, solange niemand es anschreibt; die Wochenvorschau zeigt die Wirkung."
forge.explain.active_days.example: "Nur werktags, für einen Pendlerzug"
forge.issue.form_kind_mismatch: "Diese Gestalt passt nicht zur gewählten Art des Wesens."
forge.issue.no_active_days: "Kein aktiver Tag ist gewählt, daher wird es nie von selbst posten."
forge.ui.embodiment.kind_title: "Was ist es?"
forge.ui.embodiment.form_title: "Welche Gestalt?"
forge.ui.embodiment.human_hint: "Menschen behalten jede Seite, wie sie ist. Wähle eine andere Art, um zur Blechdose, Eiche, zum Fluss oder zur Idee zu werden; Geist und Stimme gestaltest weiterhin du."
