      example: "sie/ihr"
    bio:
      what: "Ein paar Sätze über ihre Lebensgeschichte."
      effect: "Die reichhaltigste Quelle für Persönlichkeit: Erinnerungen, Meinungen und Redewendungen stammen von hier."
