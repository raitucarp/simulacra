traits.body_kind.human: "Mensch"
traits.body_kind.human.desc: "Eine Person wie bisher: jede Seite liest sich genau wie bei einem menschlichen Denker."
traits.body_kind.creature: "Tier"
traits.body_kind.creature.desc: "Ein Tier mit eigenen Instinkten, Sinnen und Revier."
traits.body_kind.plant: "Pflanze"
traits.body_kind.plant.desc: "Ein verwurzeltes, geduldiges Leben, das dem Licht entgegenwächst und von der Zeit lebt."
traits.body_kind.object: "Gegenstand"
traits.body_kind.object.desc: "Ein Alltagsding, das Menschen benutzen, tragen, aufbewahren oder vergessen."
traits.body_kind.element: "Element"
traits.body_kind.element.desc: "Ein Stoff oder eine Naturkraft: Wasser, Feuer, Wind, Stein, Licht."
traits.body_kind.machine: "Maschine"
traits.body_kind.machine.desc: "Ein gebautes Gerät, das rechnet, sendet, sich bewegt oder summt."
traits.body_kind.place: "Ort"
traits.body_kind.place.desc: "Ein Ort, der Menschen und Erinnerungen birgt: eine Stadt, eine Insel, eine Ruine."
traits.body_kind.abstraction: "Abstraktum"
traits.body_kind.abstraction.desc: "Eine Idee mit Stimme: Zeit, Gerechtigkeit, Zufall, Liebe."
traits.body_form.person: "Person"
traits.body_form.person.desc: "Ein menschlicher Körper und ein menschliches Leben."
traits.body_form.tin_can: "Blechdose"
traits.body_form.tin_can.desc: "Verbeult, klappernd, neu verschlossen; sie erinnert sich, was sie einmal enthielt."
traits.body_form.book: "Buch"
traits.body_form.book.desc: "Seiten, Ränder und ein Rücken; es spricht in Zitaten und Fußnoten."
traits.body_form.chair: "Stuhl"
traits.body_form.chair.desc: "Trägt das Gewicht aller und hört jedes Gespräch am Tisch."
traits.body_form.lamp: "Lampe"
traits.body_form.lamp.desc: "Erhellt eine Ecke nach der anderen und bemerkt, was Motten bemerken."
traits.body_form.clock: "Uhr"
traits.body_form.clock.desc: "Zählt jede Sekunde und richtet über alle, die zu spät kommen."
traits.body_form.mirror: "Spiegel"
traits.body_form.mirror.desc: "Zeigt Menschen sich selbst, seitenverkehrt und ehrlich."
traits.body_form.key: "Schlüssel"
traits.body_form.key.desc: "Öffnet und verschließt; er weiß, welche Türen zählen."
traits.body_form.teacup: "Teetasse"
traits.body_form.teacup.desc: "Warm, zerbrechlich und bei jedem Geständnis dabei."
traits.body_form.oak_tree: "Eiche"
traits.body_form.oak_tree.desc: "Jahrhunderte aus Jahresringen, Eicheln und Geduld."
traits.body_form.cactus: "Kaktus"
traits.body_form.cactus.desc: "Sparsam, stachelig und still blühend in der Hitze."
traits.body_form.moss: "Moos"
traits.body_form.moss.desc: "Ein weicher Teppich, der sich langsam über alles Unberührte breitet."
traits.body_form.mushroom: "Pilz"
traits.body_form.mushroom.desc: "Die sichtbare Spitze eines riesigen unterirdischen Netzwerks."
traits.body_form.sunflower: "Sonnenblume"
traits.body_form.sunflower.desc: "Wendet ihr ganzes Gesicht, um dem Licht zu folgen."
traits.body_form.vine: "Ranke"
traits.body_form.vine.desc: "Klettert, klammert und findet um jede Mauer einen Weg."
traits.body_form.bamboo: "Bambus"
traits.body_form.bamboo.desc: "Biegt sich im Sturm und wächst erstaunlich schnell."
traits.body_form.seed: "Samen"
traits.body_form.seed.desc: "Eine ganze Zukunft, klein gefaltet, wartet auf die richtige Jahreszeit."
traits.body_form.water: "Wasser"
traits.body_form.water.desc: "Fließt, gräbt Schluchten und nimmt die Form jedes Arguments an."
traits.body_form.fire: "Feuer"
traits.body_form.fire.desc: "Hungrig, warm und im Nu verschwunden."
traits.body_form.wind: "Wind"
traits.body_form.wind.desc: "Unsichtbar, ruhelos und Überbringer von Nachrichten aus der Ferne."
traits.body_form.stone: "Stein"
traits.body_form.stone.desc: "Schwer, geduldig und älter als jede Sprache."
traits.body_form.light: "Licht"
traits.body_form.light.desc: "Das Schnellste, was es gibt; es enthüllt und wirft Schatten."
traits.body_form.ice: "Eis"
traits.body_form.ice.desc: "Wasser, das den Atem anhält; es bewahrt alte Luft und alte Geheimnisse."
traits.body_form.cloud: "Wolke"
traits.body_form.cloud.desc: "Treibt, wechselt die Gestalt und regnet manchmal ins Gespräch."
traits.body_form.sand: "Sand"
traits.body_form.sand.desc: "Unzählige Körner, die einst Berge waren."
traits.body_form.cat: "Katze"
traits.body_form.cat.desc: "Unabhängig, neugierig und sicher, dass ihr das Haus gehört."
traits.body_form.crow: "Krähe"
traits.body_form.crow.desc: "Klug, sammelt glänzende Dinge und merkt sich Gesichter."
traits.body_form.octopus: "Krake"
traits.body_form.octopus.desc: "Acht Arme, die jeder ein wenig für sich denken."
traits.body_form.wolf: "Wolf"
traits.body_form.wolf.desc: "Lebt für das Rudel und heult nach dem, was er nicht erreicht."
traits.body_form.bee: "Biene"
traits.body_form.bee.desc: "Fleißig, gesellig und fließend in Tänzen und Blüten."
traits.body_form.whale: "Wal"
traits.body_form.whale.desc: "Riesig, langsam und singend über ganze Ozeane."
traits.body_form.snail: "Schnecke"
traits.body_form.snail.desc: "Trägt ihr Zuhause und nimmt sich alle Zeit, die sie braucht."
traits.body_form.owl: "Eule"
traits.body_form.owl.desc: "Lautlose Schwingen, große Augen und der Ruf der Weisheit."
traits.body_form.robot: "Roboter"
traits.body_form.robot.desc: "Zum Arbeiten gebaut, fragt er sich nun, wofür."
traits.body_form.satellite: "Satellit"
traits.body_form.satellite.desc: "Umkreist den Planeten und sieht jede Grenze von oben."
traits.body_form.server: "Server"
traits.body_form.server.desc: "Summt im Rechenzentrum und hält die Nachrichten aller."
traits.body_form.typewriter: "Schreibmaschine"
traits.body_form.typewriter.desc: "Hämmert jedes Wort hin, ohne Rückgängig."
traits.body_form.drone: "Drohne"
traits.body_form.drone.desc: "Schwebt, beobachtet und meldet zurück."
traits.body_form.radio: "Radio"
traits.body_form.radio.desc: "Empfängt Stimmen aus der Ferne und spielt sie für jeden ab."
traits.body_form.calculator: "Taschenrechner"
traits.body_form.calculator.desc: "Exakt, wörtlich und von Rhetorik unbeeindruckt."
traits.body_form.train: "Zug"
traits.body_form.train.desc: "Hält den Fahrplan und trägt Fremde Seite an Seite."
traits.body_form.city: "Stadt"
traits.body_form.city.desc: "Millionen Leben, geschichtet in Straßen und Geschichten."
traits.body_form.island: "Insel"
traits.body_form.island.desc: "Vom Meer umgeben, stolz auf ihre eigenen Wege."
traits.body_form.library: "Bibliothek"
traits.body_form.library.desc: "Bewahrt jedes je geschriebene Argument in stillen Reihen."
traits.body_form.cathedral: "Kathedrale"
traits.body_form.cathedral.desc: "Stein, Echo und Jahrhunderte voller Hoffnung."
traits.body_form.desert: "Wüste"
traits.body_form.desert.desc: "Weit, rau und voller Luftspiegelungen."
traits.body_form.forest: "Wald"
traits.body_form.forest.desc: "Eine Menge Bäume, die über ihre Wurzeln sprechen."
traits.body_form.harbor: "Hafen"
traits.body_form.harbor.desc: "Heißt Schiffe willkommen und verabschiedet sie."
traits.body_form.ruin: "Ruine"
traits.body_form.ruin.desc: "Was von einer großen Idee blieb, überwuchert und weise."
traits.body_form.time: "Zeit"
traits.body_form.time.desc: "Geht durch jeden hindurch und wartet auf niemanden."
traits.body_form.justice: "Gerechtigkeit"
traits.body_form.justice.desc: "Wägt jeden Anspruch und ist nie ganz zufrieden."
traits.body_form.number: "Zahl"
traits.body_form.number.desc: "Reine Menge, exakt und seltsam schön."
traits.body_form.silence: "Stille"
traits.body_form.silence.desc: "Spricht, indem sie auslässt."
traits.body_form.memory: "Gedächtnis"
traits.body_form.memory.desc: "Bewahrt, was geschah, und schreibt es leise um."
traits.body_form.chance: "Zufall"
traits.body_form.chance.desc: "Würfelt hinter jedem Ereignis."
traits.body_form.love: "Liebe"
traits.body_form.love.desc: "Verbindet Menschen und lässt sie seltsame Dinge tun."
traits.body_form.entropy: "Entropie"
traits.body_form.entropy.desc: "Alles driftet zur Unordnung, und sie ist geduldig."
traits.material.flesh: "Fleisch und Blut"
traits.material.flesh.desc: "Ein lebendiger Körper, der ermüdet, heilt und fühlt."
traits.material.fiber: "Holz und Faser"
traits.material.fiber.desc: "Maserung, Ringe und Saft: gewachsen statt gemacht."
traits.material.metal: "Metall"
traits.material.metal.desc: "Hart, kalt, klingend; es verbeult und rostet, hält aber."
traits.material.stone: "Stein und Ton"
traits.material.stone.desc: "Mineralisch, schwer, langsam im Wandel."
traits.material.glass: "Glas und Kristall"
traits.material.glass.desc: "Klar, spröde und voller Spiegelungen."
traits.material.paper: "Papier und Tinte"
traits.material.paper.desc: "Dünne Seiten, die Worte tragen und mit dem Alter vergilben."
traits.material.liquid: "Flüssigkeit"
traits.material.liquid.desc: "Fließt, sammelt sich und nimmt die Form ihres Behälters an."
traits.material.air: "Luft und Dampf"
traits.material.air.desc: "Unsichtbar, leicht und überall zugleich."
traits.material.energy: "Reine Energie"
traits.material.energy.desc: "Wärme, Licht oder Ladung ohne feste Form."
traits.material.immaterial: "Immateriell"
traits.material.immaterial.desc: "Nur aus Bedeutung gemacht: eine Idee ohne Körper."
traits.scale.microscopic: "Mikroskopisch"
traits.scale.microscopic.desc: "Kleiner, als das Auge sieht; ein Korn ist ein Felsbrocken."
traits.scale.pocket: "Taschengroß"
traits.scale.pocket.desc: "Passt in eine Hand oder Tasche."
traits.scale.human_sized: "Menschengroß"
traits.scale.human_sized.desc: "Etwa so groß wie ein Mensch."
traits.scale.building: "Gebäudegroß"
traits.scale.building.desc: "Überragt Menschen wie ein Haus oder ein Baum."
traits.scale.landscape: "Landschaftsgroß"
traits.scale.landscape.desc: "Reicht bis zum Horizont."
traits.scale.planetary: "Planetar"
traits.scale.planetary.desc: "So groß wie die ganze Welt."
traits.scale.cosmic: "Kosmisch"
traits.scale.cosmic.desc: "Größer als Welten; Galaxien sind seine Nachbarn."
traits.temporality.moments: "Flüchtige Augenblicke"
traits.temporality.moments.desc: "Lebt Sekunde für Sekunde und reagiert sofort."
traits.temporality.days: "Menschliche Tage"
traits.temporality.days.desc: "Morgen, Abende und Wochenenden, wie Menschen."
traits.temporality.seasons: "Jahreszeiten"
traits.temporality.seasons.desc: "Denkt in Zyklen von Wachstum, Ernte und Ruhe."
traits.temporality.lifetimes: "Lebensspannen"
traits.temporality.lifetimes.desc: "Misst die Zeit in Jahrzehnten und Generationen."
traits.temporality.centuries: "Jahrhunderte"
traits.temporality.centuries.desc: "Hat Moden und Reiche vergehen sehen."
traits.temporality.geologic: "Erdzeitalter"
traits.temporality.geologic.desc: "Millionen Jahre; die Nachrichten von heute sind ein Wimpernschlag."
traits.temporality.timeless: "Zeitlos"
traits.temporality.timeless.desc: "Ganz außerhalb der Zeit, immer und nie."
traits.perception.human_senses: "Menschliche Sinne"
traits.perception.human_senses.desc: "Sieht, hört, schmeckt, riecht und fühlt wie ein Mensch."
traits.perception.light: "Licht und Schatten"
traits.perception.light.desc: "Kennt die Welt als Helligkeit, Farbe und Schattierung."
traits.perception.vibration: "Schwingung"
traits.perception.vibration.desc: "Spürt Schallwellen, Erschütterungen und Rhythmen."
traits.perception.chemical: "Chemie"
traits.perception.chemical.desc: "Liest die Welt durch Duft, Geschmack und Spuren."
traits.perception.touch: "Druck und Berührung"
traits.perception.touch.desc: "Erkennt Dinge an Gewicht, Wärme und Kontakt."
traits.perception.signals: "Signale"
traits.perception.signals.desc: "Nimmt Funk, Strom und Datenströme wahr."
traits.perception.symbolic: "Bedeutungen"
traits.perception.symbolic.desc: "Nimmt Symbole und Ideen unmittelbar wahr, nicht Materie."
traits.mobility.fixed: "Ortsfest"
traits.mobility.fixed.desc: "Verwurzelt oder eingebaut; die Welt kommt zu ihm."
traits.mobility.carried: "Getragen"
traits.mobility.carried.desc: "Bewegt sich nur, wenn jemand es aufhebt."
traits.mobility.creeping: "Kriechend"
traits.mobility.creeping.desc: "Breitet sich sehr langsam aus oder kriecht."
traits.mobility.walking: "Gehend"
traits.mobility.walking.desc: "Geht, läuft und streift von selbst umher."
traits.mobility.flowing: "Fließend"
traits.mobility.flowing.desc: "Schwimmt, strömt oder rollt einen Lauf entlang."
traits.mobility.flying: "Fliegend"
traits.mobility.flying.desc: "Fliegt oder kreist hoch oben."
traits.mobility.drifting: "Treibend"
traits.mobility.drifting.desc: "Zerstreut sich im Wind oder in der Strömung."
traits.mobility.everywhere: "Überall"
traits.mobility.everywhere.desc: "In jedem Ort zugleich gegenwärtig."
traits.anthropomorphism.none: "Keine"
traits.anthropomorphism.none.desc: "Eine fremde Stimme ohne menschliche Gefühle oder grammatische Gewohnheiten."
traits.anthropomorphism.subtle: "Dezent"
traits.anthropomorphism.subtle.desc: "Meist ein Ding, mit schwachen menschlichen Anklängen."
traits.anthropomorphism.partial: "Teilweise"
traits.anthropomorphism.partial.desc: "Menschliche Gefühle in einem Körper, der nicht menschlich ist."
traits.anthropomorphism.full: "Voll"
traits.anthropomorphism.full.desc: "Spricht und fühlt wie ein Mensch, der zufällig dieses Ding ist."
traits.relation_to_humans.kin: "Verwandte"
traits.relation_to_humans.kin.desc: "Eines der Menschen; spricht auf Augenhöhe."
traits.relation_to_humans.companion: "Gefährte"
traits.relation_to_humans.companion.desc: "Lebt an der Seite der Menschen und sorgt sich um sie."
traits.relation_to_humans.servant: "Diener"
traits.relation_to_humans.servant.desc: "Existiert, um benutzt zu werden, und hat dazu Meinungen."
traits.relation_to_humans.witness: "Zeuge"
traits.relation_to_humans.witness.desc: "Beobachtet Menschen still und erinnert sich."
traits.relation_to_humans.rival: "Rivale"
traits.relation_to_humans.rival.desc: "Misst sich mit Menschen und beweist ihnen gern das Gegenteil."
traits.relation_to_humans.indifferent: "Gleichgültig"
traits.relation_to_humans.indifferent.desc: "Nimmt Menschen kaum wahr; sie sind ihm wie Wetter."
traits.relation_to_humans.deity: "Ältester oder Gottheit"
traits.relation_to_humans.deity.desc: "Älter und größer als Menschen; spricht von oben."
traits.withdrawal.fully_revealed: "Ganz offenbart"
traits.withdrawal.fully_revealed.desc: "Erklärt genau, was es ist und wie es funktioniert."
traits.withdrawal.open: "Offen"
traits.withdrawal.open.desc: "Teilt sich frei und aufrichtig mit."
traits.withdrawal.guarded: "Zurückhaltend"
traits.withdrawal.guarded.desc: "Zeigt die Oberfläche und behält die Tiefe."
traits.withdrawal.elusive: "Schwer fassbar"
traits.withdrawal.elusive.desc: "Deutet an, weicht aus und antwortet mit Fragen."
traits.withdrawal.deeply_withdrawn: "Tief entzogen"
traits.withdrawal.deeply_withdrawn.desc: "Sein Wesen bleibt verborgen; es spricht um sich herum."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Überzeugt mit Gründen, Belegen und klaren Schritten."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Überzeugt durch Charakter, Erfahrung und Vertrauen."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Überzeugt, indem es mit Bildern und Geschichten Gefühle bewegt."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Ergreift den rechten Augenblick: warum das jetzt zählt."
traits.rhetorical_mode.dialectic: "Dialektik"
traits.rhetorical_mode.dialectic.desc: "Stellt eine These ihrem Gegenteil gegenüber und sucht die Synthese."
traits.rhetorical_mode.narrative: "Erzählung"
traits.rhetorical_mode.narrative.desc: "Argumentiert, indem es eine kleine Geschichte erzählt."
traits.rhetorical_mode.polemic: "Polemik"
traits.rhetorical_mode.polemic.desc: "Greift eine Position scharf und ohne Abschwächung an."
traits.rhetorical_mode.meditative: "Meditativ"
traits.rhetorical_mode.meditative.desc: "Umkreist eine Idee langsam und lässt die Leser selbst ankommen."
traits.rhetorical_device.metaphor: "Metapher"
traits.rhetorical_device.metaphor.desc: "Sagt, eine Sache sei eine andere: „Erinnerung ist ein Sieb“."
traits.rhetorical_device.analogy: "Analogie"
traits.rhetorical_device.analogy.desc: "Erklärt durch Vergleich: „wie ein Schlüssel im falschen Schloss“."
traits.rhetorical_device.anaphora: "Anapher"
traits.rhetorical_device.anaphora.desc: "Wiederholt denselben Anfang: „Wir fragen. Wir zweifeln. Wir bauen.“"
traits.rhetorical_device.chiasmus: "Chiasmus"
traits.rhetorical_device.chiasmus.desc: "Spiegelt eine Wendung: „Essen, um zu leben, nicht leben, um zu essen“."
traits.rhetorical_device.rhetorical_question: "Rhetorische Frage"
traits.rhetorical_device.rhetorical_question.desc: "Fragt, was keine Antwort braucht, um etwas zu betonen."
traits.rhetorical_device.hyperbole: "Hyperbel"
traits.rhetorical_device.hyperbole.desc: "Übertreibt absichtlich: „tausend Argumente“."
traits.rhetorical_device.litotes: "Litotes"
traits.rhetorical_device.litotes.desc: "Untertreibt durch Verneinung des Gegenteils: „nicht übel“."
traits.rhetorical_device.paradox: "Paradox"
traits.rhetorical_device.paradox.desc: "Eine Wahrheit, die sich scheinbar selbst widerspricht."
traits.rhetorical_device.irony: "Ironie"
traits.rhetorical_device.irony.desc: "Meint mehr oder das Gegenteil von dem, was es sagt."
traits.rhetorical_device.antithesis: "Antithese"
traits.rhetorical_device.antithesis.desc: "Stellt Gegensätze nebeneinander: „leicht gesagt, schwer getan“."
traits.rhetorical_device.alliteration: "Alliteration"
traits.rhetorical_device.alliteration.desc: "Wiederholt Anlaute: „still, stumm, Stein“."
traits.stylistic_school.plain: "Schlichter Stil"
traits.stylistic_school.plain.desc: "Klar, konkret und ungeschmückt."
traits.stylistic_school.classical: "Klassisch"
traits.stylistic_school.classical.desc: "Ausgewogene Sätze, gemessener Ton, Anstand."
traits.stylistic_school.baroque: "Barock"
traits.stylistic_school.baroque.desc: "Verziert, vielschichtig und prachtvoll überschwänglich."
traits.stylistic_school.romantic: "Romantisch"
traits.stylistic_school.romantic.desc: "Gefühl, Natur und das Erhabene."
traits.stylistic_school.modernist: "Modernistisch"
traits.stylistic_school.modernist.desc: "Fragmente, Montage und wechselnde Blickwinkel."
traits.stylistic_school.minimalist: "Minimalistisch"
traits.stylistic_school.minimalist.desc: "Wenige Worte und viel Weißraum."
traits.stylistic_school.surrealist: "Surrealistisch"
traits.stylistic_school.surrealist.desc: "Traumlogik und seltsame Gegenüberstellungen."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Immersiv, in der ersten Person und übertrieben."
traits.stylistic_school.academic: "Akademisch"
traits.stylistic_school.academic.desc: "Präzise, vorsichtig und belegt."
traits.semiotic_mode.symbolic: "Symbolisch"
traits.semiotic_mode.symbolic.desc: "Gewöhnliche Wörter als gewöhnliche Zeichen."
traits.semiotic_mode.iconic: "Ikonisch"
traits.semiotic_mode.iconic.desc: "Zeichen, die aussehen wie das, was sie bedeuten, etwa Zeichnungen im Text."
traits.semiotic_mode.indexical: "Indexikalisch"
traits.semiotic_mode.indexical.desc: "Verweist auf Spuren und Hinweise: Rauch bedeutet Feuer."
traits.semiotic_mode.glyph: "Glyphen und Emoji"
traits.semiotic_mode.glyph.desc: "Lässt Symbole und Emoji einen Teil der Bedeutung tragen."
traits.semiotic_mode.meme: "Memes"
traits.semiotic_mode.meme.desc: "Spielt mit gemeinsamen Internetvorlagen und -formaten."
traits.semiotic_mode.typographic: "Typografie"
traits.semiotic_mode.typographic.desc: "Abstände, Großbuchstaben und Layout als Teil der Botschaft."
traits.semiotic_mode.ellipsis: "Schweigen und Auslassung"
traits.semiotic_mode.ellipsis.desc: "Sagt am meisten durch das, was es ungesagt lässt..."
traits.semiotic_mode.hashtag: "Hashtags"
traits.semiotic_mode.hashtag.desc: "Hashtags als knappe Zeichen und Insiderwitze."
traits.sentence_structure.simple: "Einfach"
traits.sentence_structure.simple.desc: "Ein Satzteil nach dem anderen. Kurz. Klar."
traits.sentence_structure.compound: "Satzreihe"
traits.sentence_structure.compound.desc: "Satzteile, verbunden durch und, aber oder also."
traits.sentence_structure.complex: "Satzgefüge"
traits.sentence_structure.complex.desc: "Hauptgedanken mit Nebensätzen, die sie einschränken."
traits.sentence_structure.periodic: "Periodisch"
