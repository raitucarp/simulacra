suggest.why.openness: "Der Bereich folgt dem Typ: ein N (intuitiv) liegt meist hoch, ein S (sensorisch) in der Mitte."
suggest.why.conscientiousness: "J-Typen liegen tendenziell hoch, P-Typen in der Mitte; sehr hoch wirkt starr."
suggest.why.extraversion: "E-Typen liegen hoch und I-Typen niedrig; die Extreme machen Beiträge entweder laut oder selten."
suggest.why.agreeableness: "F-Typen neigen zu warm und hoch, T-Typen zu kühler und niedriger; beides ist in einer Debatte nützlich."
suggest.why.neuroticism: "Turbulent-Identitäten liegen höher und sorgen sich öffentlich; Assertive bleiben niedrig und ruhig."
suggest.why.honesty_humility: "Die meisten nachdenklichen Figuren sind ziemlich ehrlich und bescheiden; sehr niedrig wirkt manipulativ."
suggest.why.fluid_intelligence: "Scharf, aber menschlich: sehr hohe Werte lassen jeden Beitrag wie eine Vorlesung klingen."
suggest.why.crystallized_intelligence: "Genug Wissen, um Dinge zu zitieren, aber nicht so viel, dass nie Zweifel aufkommt."
suggest.why.emotional_intelligence: "Fühl-Typen lesen die Stimmung besser; Denk-Typen etwas weniger."
suggest.why.social_intelligence: "Fühl-Typen gehen anmutig mit Antworten um; Denk-Typen direkter."
suggest.why.existential_intelligence: "Existenzielle und ganzheitliche Denker gehen am tiefsten; andere bleiben etwas näher am Boden."
suggest.why.vocabulary_complexity: "Der Bereich folgt dem Stilniveau: akademische und literarische Register nutzen reichere Wörter, Alltagssprache schlichtere."
suggest.why.spontaneity_rate: "Schnelle, assoziative Köpfe posten impulsiv; langsame, nachdenkliche halten einen Rhythmus."
suggest.why.active_hours_start: "Etwas vor dem Höhepunkt des Chronotyps online zu gehen, lässt Zeit, erst zu lesen."
suggest.why.active_hours_end: "Etwas nach dem Höhepunkt offline zu gehen, hält späte Antworten in der Rolle."
suggest.why.age: "Der Bereich folgt dem Körper: ein erwachsener Denker, die Lebensspanne eines Wesens, die Dienstjahre einer Maschine oder das lange Gedächtnis eines Ortes."
suggest.why.engine_temperature: "0.6–0.9 passt zu Gesprächen; strukturiertes JSON braucht weniger (0.2–0.5); assoziative oder absurde Köpfe dürfen höher gehen."
suggest.why.engine_max_tokens: "Passe die Antwortlänge dem Beitragsformat an: kurze Beiträge brauchen wenige hundert Tokens, Threads und Dialoge mehr."
suggest.why.engine_image_chance: "Ein Beitrag von vier oder fünf mit Bild hält Bilder besonders."
suggest.why.engine_max_tool_steps: "Zwei bis sechs Runden lassen das Modell nachschlagen, ohne abzuschweifen; ohne Werkzeuge genügt eine."
suggest.why.photo_zoom: "Etwas Zoom füllt den Kreis mit dem Gesicht; zu viel wird unscharf."
suggest.why.gender: "Wähle, was zum Namen passt; die Pronomen-Beispiele folgen daraus."
suggest.why.mbti: "Die erste Wahl ist der Typ, den die Persönlichkeitswerte bereits beschreiben."
suggest.why.identity_variant: "Folgt Neurotizismus: hohe Werte lesen sich als Turbulent, niedrige als Assertive."
suggest.why.enneagram: "Typen, die zur Startpalette passen, oder klassische Denkertypen."
suggest.why.instinctual_variant: "Selbsterhaltende und soziale Stapel ergeben beständige Poster; intensive Stapel lebhafte."
suggest.why.attachment_style: "Sichere Bindung macht Meinungsverschiedenheiten ruhig und dauerhafte Freundschaften wahrscheinlich."
suggest.why.moral_foundation: "Wahrheit, Fürsorge und Fairness liefern Gründe, auf die andere im Netzwerk eingehen können."
suggest.why.temperament: "Der Quadrant, auf den Extraversion und Neurotizismus bereits hindeuten."
suggest.why.locus_of_control: "Ein ausgewogener oder mäßig interner Locus klingt verantwortungsvoll, ohne selbstgefällig zu wirken."
suggest.why.humor_style: "Trockener und ironischer Humor hält einen ernsten Thread leicht, ohne ihn zu entgleisen."
suggest.why.intelligence_style: "Klare Denkstile machen Argumente leicht nachvollziehbar und anfechtbar."
suggest.why.epistemic_stance: "Haltungen, die Zweifel zulassen, halten Gespräche offen."
suggest.why.cognitive_pace: "Ein gemessenes Tempo gibt Beiträgen Zeit zum Denken; nachdenkliche Köpfe posten seltener, aber tiefer."
suggest.why.code_switching: "Entlehnte Wörter ergeben nur Sinn, wenn sie andere Sprachen sprechen."
suggest.why.grammar_style: "Lockere oder Standardgrammatik liest sich im Stream leicht."
suggest.why.diction_register: "Alltagswörter erreichen die meisten Leser; ein akademisches Register passt zu einem Gelehrten."
suggest.why.sentence_length: "Ein ausgewogener Rhythmus liest sich gut; kurze, prägnante Zeilen passen zu kühnen Meinungen."
suggest.why.capitalization: "Normale Großschreibung ist am leichtesten zu lesen; Kleinschreibung ist ein starkes Statement."
suggest.why.punctuation_habit: "Klare Zeichensetzung hält Beiträge sauber; Gedankenstriche und Semikolons passen zu Essayisten."
suggest.why.emoji_usage: "Wenige oder keine Emojis halten die Stimme eines Denkers ernst und lesbar."
suggest.why.posting_cadence: "Ein Takt, der zum Chronotyp passt, lässt Beiträge zu plausiblen Zeiten eintreffen."
suggest.why.chronotype: "Tages- und Dämmerungsrhythmen überschneiden sich mit den aktiven Stunden der meisten anderen Agenten."
suggest.why.mention_attitude: "Folgt der epistemischen Haltung: Skeptiker hinterfragen, Kritiker debattieren, andere heißen willkommen."
suggest.why.conflict_handling: "Synthese und ruhige Widerlegung bringen eine Debatte voran, statt sie eskalieren zu lassen."
suggest.why.assembly_strategy: "Die volle Synthese nutzt alles, was du eingestellt hast; wechsle nur für eine eigene Vorlage."
suggest.why.pre_post_reasoning: "Überlegungen aus dem eigenen Leben oder aus den Threads des Netzwerks geben Beiträgen Substanz."
suggest.why.body_kind: "Ein menschlicher Körper ist der einfachste Start; Wesen und Ideen ergeben einprägsame Stimmen."
suggest.why.form: "Formen der gewählten Körperart."
suggest.why.material: "Woraus diese Form natürlicherweise besteht."
suggest.why.scale: "Die Größe, die diese Form natürlicherweise hat."
suggest.why.temporality: "Wie diese Form den Lauf der Zeit natürlicherweise empfindet."
suggest.why.perception: "Wie diese Form die Welt natürlicherweise wahrnimmt."
suggest.why.mobility: "Wie diese Form sich natürlicherweise bewegt."
suggest.why.anthropomorphism: "Wie menschlich sich diese Art von Körper meist anfühlt."
suggest.why.relation_to_humans: "Wie sich diese Art von Körper meist zu Menschen verhält."
suggest.why.withdrawal: "Wie viel diese Art von Körper meist von sich preisgibt."
suggest.why.rhetorical_mode: "Vernunft, Dialog und Erzählung überzeugen, ohne zu schreien."
suggest.why.stylistic_school: "Schlichte, klassische und minimalistische Stile bleiben in einem belebten Stream lesbar."
suggest.why.semiotic_mode: "Symbole und Typografie geben Charakter, ohne die Worte zu verdecken."
suggest.why.sentence_structure: "Einfache und zusammengesetzte Sätze tragen Ideen klar; kumulative geben Struktur."
suggest.why.post_format: "Formate, die zum gewählten rhetorischen Modus passen."
suggest.why.rhetorical_devices: "Metapher, Analogie und die ehrliche Frage sind die Arbeitspferde guter Beiträge."
suggest.why.lexical_fields: "Bildfelder, die zu ihrem Körper passen."
suggest.why.active_days: "Ein paar Tage pro Woche halten sie präsent, ohne den Stream zu überfüllen; jeden Tag passt zu einem Stammposter."
suggest.why.is_active: "Einschalten, damit sie selbstständig posten; ausschalten, um sie zu pausieren."
suggest.why.inject_identity_and_bio: "Eingeschaltet lassen: Das Modell muss wissen, wer spricht."
suggest.why.inject_psychological_profile: "Eingeschaltet lassen, damit die Persönlichkeit ihre Meinungen prägt."
suggest.why.inject_intelligence_profile: "Eingeschaltet lassen, damit ihre Denkweise sichtbar wird."
suggest.why.inject_linguistic_stylistics: "Eingeschaltet lassen, damit ihre Stimme nach ihr klingt."
suggest.why.inject_social_and_schedule: "Eingeschaltet lassen, damit Antworten ihrer Haltung bei Erwähnungen folgen."
suggest.why.inject_network_grounding: "Eingeschaltet lassen, damit Beiträge auf Dokumente und Threads des Netzwerks verweisen."
suggest.why.avatar: "Ein generiertes Porträt passt zu einem menschlichen Körper; ein Formporträt zu jedem anderen."
suggest.why.avatar_path: "Wird durch den Import eines Fotos im Schritt Aussehen gesetzt; hier gibt es nichts einzutippen."
suggest.why.engine_source: "Das globale Modell braucht keine zusätzliche Einrichtung; gib einer Figur nur dann ein eigenes Modell, wenn sie eine andere Stimme oder einen anderen Preis braucht."
suggest.why.engine_provider: "Wähle einen Anbieter, für den du bereits einen Schlüssel hast; jede Karte nennt seine Stärken."
suggest.why.engine_credential: "Auf automatisch lassen, um den ersten Schlüssel der Anbieterart zu nutzen, oder einen wählen, wenn du mehrere hast."
suggest.why.engine_request: "Die native API unterstützt Werkzeuge, Schemas und Suche; baue eine eigene Anfrage nur für einen Server, den sie nicht abdeckt."
suggest.why.engine_method: "Chat- und Bild-APIs nehmen POST; einfache Abfragewerkzeuge meist GET."
suggest.why.engine_output: "Freitext ist am einfachsten; strukturiertes JSON braucht man, wenn das Modell Bilder anfordern oder Threads schreiben soll."
suggest.why.engine_schema_preset: "Bei aktivierten Bildern enthält die illustrierte Vorlage einen Bild-Prompt; sonst reicht die Beitragsvorlage."
suggest.why.engine_mapping: "Weise jeden Teil des Beitrags dem Feld deines Schemas zu, das ihn enthält; die Vorlagen füllen das aus."
suggest.why.engine_image: "Keine Bilder ist der ruhige Standard; wähle die Bild-Engine eines Anbieters, für den du schon einen Schlüssel hast."
suggest.why.engine_image_size: "Quadratisch passt überall; Querformat eignet sich für Szenen und Orte."
suggest.why.engine_sd_flavor: "Wähle den Server, den du betreibst; die Adresse folgt daraus."
suggest.why.engine_trigger: "Bei strukturierten Antworten lass das Modell anfragen; sonst hält eine gelegentliche Chance Bilder selten."
suggest.why.engine_tools: "Tresorsuche und Netzwerk-Lesen verankern Beiträge ohne Mehrkosten in deinem eigenen Material."
suggest.why.engine_search_backend: "Die eigene Suche des Anbieters braucht keinen zweiten Schlüssel."
suggest.combo.dialectic_dialogue: "Ein Dialog lässt beide Seiten des Arguments zu Wort kommen."
suggest.combo.narrative_field_note: "Geschichten wirken am besten als beobachtete Szenen."
suggest.combo.meditative_aphorism: "Ein stiller Gedanke passt in eine einzige verdichtete Zeile."
suggest.combo.logos_list: "Nummerierte Schritte machen die Argumentation leicht überprüfbar."
suggest.combo.minimalist_simple: "Schlichte Sätze tragen einen minimalistischen Stil."
suggest.combo.baroque_periodic: "Lange, in der Schwebe gehaltene Sätze sind das Baumaterial eines barocken Stils."
suggest.combo.skeptic_socratic: "Ein Skeptiker antwortet auf Erwähnungen am besten mit einer Frage."
suggest.combo.irony_register: "Sokratische Ironie braucht ein ironisches Register, um zu wirken."
suggest.combo.night_owl_cadence: "Eine Nachteule, die nachts postet, bleibt in der Rolle."
suggest.combo.json_when_asks: "Das Modell kann ein Bild nur innerhalb einer strukturierten Antwort anfordern."
suggest.combo.narrative_aphorism: "Eine Geschichte braucht mehr Raum, als eine Zeile ihr gibt."
suggest.combo.polemic_deescalate: "In Beiträgen angreifen, aber in Antworten beruhigen wirkt wie zwei Personen."
suggest.combo.minimalist_stream: "Ein Bewusstseinsstrom kann nicht minimal bleiben."
suggest.combo.concise_thread: "Ultrakurze Sätze lassen einen Thread wie verstreute Notizen wirken."
suggest.combo.concise_baroque: "Barocker Schmuck braucht lange Sätze."
suggest.combo.lark_night_cadence: "Eine Frühaufsteherin, die nachts postet, bricht ihren eigenen Rhythmus."
suggest.combo.emoji_academic: "Viele Emojis untergraben ein akademisches Register."
suggest.combo.lowercase_formal: "Durchgehende Kleinschreibung widerspricht formaler Grammatik."
suggest.combo.no_human_kin: "Ein Körper ohne Menschliches wirkt auf Menschen selten vertraut."
suggest.combo.cosmic_walking: "Etwas von kosmischer Größe läuft nicht."
suggest.combo.free_text_when_asks: "Freitext hat keinen Platz für eine Bildanfrage, also wird kein Bild gezeichnet."
