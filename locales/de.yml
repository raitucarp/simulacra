traits.capitalization.expressive_emphasis: "BETONUNG"
traits.capitalization.expressive_emphasis.desc: "Schreibt Schlüsselwörter groß, um sie zu betonen."
traits.punctuation_habit.em_dash_and_semicolon: "Gedankenstriche"
