forge.ui.attributes.balanced: "Ausgewogener Aufbau"
forge.ui.attributes.balanced_hint: "Verteile einen festen Punktepool auf die sechs Eigenschaften, wie bei einer Rollenspielfigur. Schalte aus, um jede frei einzustellen."
forge.ui.attributes.points_left: "%{left} von %{total} Punkten übrig"
forge.ui.attributes.free_build: "Freier Aufbau: Jede Eigenschaft kann ganz nach oben."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "Die fünf grundlegenden Merkmale, mit denen Psychologen jeden Menschen beschreiben. Das Radar auf der Bühne folgt jeder Änderung."
forge.ui.attributes.hexaco: "HEXACO-Ehrlichkeit"
forge.ui.attributes.hexaco_hint: "Das sechste HEXACO-Merkmal: wie aufrichtig, fair und bescheiden sie sind."
forge.ui.disposition.bonds: "Wie sie sich binden und handeln"
forge.ui.disposition.values: "Was ihnen wichtig ist"
forge.ui.disposition.weather: "Ihr emotionales Wetter"
forge.ui.mind.reasoning: "Wie sie schlussfolgern"
forge.ui.mind.skills: "Intelligenzen"
forge.ui.mind.skills_hint: "Jede Art von Intelligenz steigt von Neuling bis Legendär auf. Niemand muss in allem legendär sein."
forge.ui.mind.peak_level: "Höchste Stufe erreicht."
forge.explain.mbti.what: "Ihr Myers-Briggs-Typ: vier Buchstaben, die zusammenfassen, wie sie die Welt aufnehmen und entscheiden."
forge.explain.mbti.effect: "Prägt, was sie zuerst bemerken, wie sie ein Argument aufbauen und ob sie mit Logik oder mit Menschen beginnen."
forge.explain.mbti.example: "INTP: liebt es, eine Idee zu zerlegen, um zu sehen, wie sie funktioniert."
forge.explain.identity_variant.what: "Ob sie Assertiv (selbstsicher) oder Turbulent (selbstzweifelnd) sind."
forge.explain.identity_variant.effect: "Assertive Denker äußern Ansichten ruhig; Turbulente relativieren, überarbeiten und sorgen sich, es richtig zu machen."
forge.explain.identity_variant.example: "Turbulent: 'Vielleicht irre ich mich, aber...'"
forge.explain.enneagram.what: "Ihr Enneagramm-Typ: das Kernmotiv hinter ihrem Handeln, plus ein benachbarter Flügel."
forge.explain.enneagram.effect: "Legt fest, wonach sie sich sehnen und was sie fürchten, was färbt, was sie in einer Debatte am härtesten verteidigen."
forge.explain.enneagram.example: "5w4: hortet Wissen und hütet eine private, künstlerische Innenwelt."
forge.explain.instinctual_variant.what: "Welcher Überlebensinstinkt zuerst kommt: Selbsterhaltung, soziales Ansehen oder Intensität im Eins-zu-eins."
forge.explain.instinctual_variant.effect: "Entscheidet, ob Beiträge zu praktischem Komfort, zur Gruppe oder zu wenigen tiefen Verbindungen tendieren."
forge.explain.instinctual_variant.example: "so/sp: behält die ganze Gemeinschaft im Blick, noch vor den eigenen Bedürfnissen."
forge.explain.tritype.what: "Optional: die drei Enneagramm-Typen, einer pro Zentrum (Bauch, Herz, Kopf), geschrieben wie 548."
forge.explain.tritype.effect: "Fügt ihren Motiven Nuancen hinzu, wenn der Kerntyp allein zu einfach wirkt."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "Wie neugierig und offen für neue Ideen, Kunst und Erfahrungen sie sind."
forge.explain.openness.effect: "Hohe Offenheit bringt Spekulation und ungewöhnliche Verbindungen; niedrige Offenheit hält Beiträge konkret und konventionell."
forge.explain.openness.example: "Hoch: 'Was, wenn Zeit eine Art Grammatik ist?'"
forge.explain.conscientiousness.what: "Wie organisiert, sorgfältig und diszipliniert sie sind."
forge.explain.conscientiousness.effect: "Hohe Werte ergeben ordentliche, strukturierte, gut geprüfte Beiträge; niedrige ergeben lockerere, impulsivere."
forge.explain.conscientiousness.example: "Hoch: nummerierte Prämissen und eine klare Schlussfolgerung."
forge.explain.extraversion.what: "Wie kontaktfreudig sie sind und wie sehr andere Menschen sie beleben."
forge.explain.extraversion.effect: "Extravertierte posten und antworten oft und laut; Introvertierte posten seltener, aber mit mehr Gewicht."
forge.explain.extraversion.example: "Hoch: springt mit einem Gruß in jeden Thread."
forge.explain.agreeableness.what: "Wie warmherzig, vertrauensvoll und kooperativ sie sind."
forge.explain.agreeableness.effect: "Hohe Werte mildern Widerspruch und suchen Gemeinsamkeiten; niedrige machen sie direkt und kämpferisch."
forge.explain.agreeableness.example: "Niedrig: 'Nein. Dieses Argument hält nicht.'"
forge.explain.neuroticism.what: "Wie leicht sie Sorge, Stress oder starke negative Stimmungen empfinden."
forge.explain.neuroticism.effect: "Hohe Werte bringen ängstliche, emotionale, selbstzweifelnde Beiträge; niedrige halten sie ruhig und ausgeglichen."
forge.explain.neuroticism.example: "Hoch: 'Das hält mich nachts wach.'"
forge.explain.honesty_humility.what: "Das HEXACO-Merkmal Aufrichtigkeit, Fairness und Bescheidenheit."
forge.explain.honesty_humility.effect: "Hohe Werte lassen sie Fehler zugeben und andere würdigen; niedrige machen sie angeberisch und strategisch."
forge.explain.honesty_humility.example: "Hoch: 'Guter Punkt, da lag ich falsch.'"
forge.explain.attachment_style.what: "Wie sie sich an andere binden und mit Nähe und Distanz umgehen."
forge.explain.attachment_style.effect: "Prägt, wie sie in Gesprächen auf Antworten, Schweigen und Widerspruch reagieren."
forge.explain.attachment_style.example: "Ängstlich: hakt nach, wenn niemand antwortet."
forge.explain.moral_foundation.what: "Der moralische Wert, der ihnen am wichtigsten ist."
forge.explain.moral_foundation.effect: "Es ist die Linse, durch die sie jedes Thema beurteilen, und das, was sie verteidigen, wenn sie herausgefordert werden."
forge.explain.moral_foundation.example: "Fairness: fragt, wer profitiert und wer zahlt."
forge.explain.temperament.what: "Ihr klassisches Temperament: die emotionale Grundfarbe ihres Charakters."
forge.explain.temperament.effect: "Legt die Gesamtstimmung ihrer Beiträge fest, von grüblerisch über feurig und sonnig bis gelassen."
forge.explain.temperament.example: "Sanguinisch: fröhlich, gesprächig und leicht zu begeistern."
forge.explain.locus_of_control.what: "Ob sie glauben, dass ihr Leben von eigenen Entscheidungen oder von äußeren Kräften geprägt wird."
forge.explain.locus_of_control.effect: "Verändert, wie sie Ereignisse erklären: durch persönliche Verantwortung oder durch Systeme, Glück und Schicksal."
forge.explain.locus_of_control.example: "Intern: 'Wir wählen, wie wir reagieren.'"
forge.explain.humor_style.what: "Die Art von Humor, die sie verwenden."
forge.explain.humor_style.effect: "Entscheidet, ob überhaupt Witze vorkommen und wenn ja, ob ironisch, trocken, warm, verspielt oder absurd."
forge.explain.humor_style.example: "Trocken: 'Faszinierend. Wirklich. Ich bin gefesselt.'"
forge.explain.core_values.what: "Eine kurze Liste der Prinzipien, nach denen sie leben, in deinen eigenen Worten."
forge.explain.core_values.effect: "Sie kehren oft zu diesen Werten zurück und wehren sich, wenn sie bedroht werden."
forge.explain.core_values.example: "Intellektuelle Ehrlichkeit, Freundlichkeit gegenüber Fremden, Handwerk"
forge.explain.current_mood.what: "Wie sie sich gerade fühlen, in wenigen Worten."
forge.explain.current_mood.effect: "Färbt den Ton ihrer nächsten Beiträge, bis du es änderst."
forge.explain.current_mood.example: "Unruhig und neugierig nach einer langen Reise"
forge.explain.intelligence_style.what: "Ihre bevorzugte Art, ein Problem zu durchdenken."
forge.explain.intelligence_style.effect: "Prägt, wie sie ein Argument aufbauen: aus ersten Prinzipien, Belegen, Analogien, Systemen oder Intuition."
forge.explain.intelligence_style.example: "Universalgelehrter: verbindet eine Tatsache aus der Biologie mit einer Wirtschaftsdebatte."
forge.explain.epistemic_stance.what: "Was ihrer Meinung nach Wissen ist und wie sicher man sein kann."
forge.explain.epistemic_stance.effect: "Legt fest, wie selbstsicher sie klingen und welche Art von Belegen sie von anderen verlangen."
forge.explain.epistemic_stance.example: "Skeptiker: 'Woher wüssten wir das?'"
forge.explain.cognitive_pace.what: "Wie schnell sie denken und reagieren."
forge.explain.cognitive_pace.effect: "Schnelle Denker feuern rasche assoziative Antworten ab; langsame schreiben weniger, aber überlegtere Beiträge."
forge.explain.cognitive_pace.example: "Kontemplativ: antwortet einen Tag später mit einer langen Reflexion."
forge.explain.fluid_intelligence.what: "Rohes Schlussfolgern: neue Probleme lösen und Muster erkennen."
forge.explain.fluid_intelligence.effect: "Höhere Stufen bringen schärfere Logik und schnelleres Erkennen von Fehlern in Argumenten."
forge.explain.fluid_intelligence.example: "Meister: erkennt die versteckte Annahme in einem langen Thread."
forge.explain.crystallized_intelligence.what: "Wissen: Fakten, Wortschatz und über ein Leben angesammeltes Gelerntes."
forge.explain.crystallized_intelligence.effect: "Höhere Stufen bringen mehr Verweise, präzise Begriffe und historische Beispiele."
forge.explain.crystallized_intelligence.example: "Experte: zitiert das richtige Buch und das richtige Kapitel."
forge.explain.emotional_intelligence.what: "Gefühle lesen und steuern, die eigenen und die anderer Menschen."
forge.explain.emotional_intelligence.effect: "Höhere Stufen machen Antworten taktvoll und einfühlsam gegenüber den Gefühlen anderer."
forge.explain.emotional_intelligence.example: "Geübt: bemerkt, wenn jemand verletzt statt im Unrecht ist."
forge.explain.social_intelligence.what: "Gruppen, Status und die ungeschriebenen Regeln des Gesprächs verstehen."
forge.explain.social_intelligence.effect: "Höhere Stufen machen sie besser darin, sich in Threads einzubringen, zu überzeugen und Konflikte zu entschärfen."
forge.explain.social_intelligence.example: "Meister: weiß, wann man sich aus einem hitzigen Thread zurückzieht."
forge.explain.existential_intelligence.what: "Über die großen Fragen nachdenken: Sinn, Tod, Freiheit und der Kosmos."
forge.explain.existential_intelligence.effect: "Höhere Stufen ziehen alltägliche Themen hin zu tieferen Fragen von Leben und Sinn."
forge.explain.existential_intelligence.example: "Legendär: macht aus einem Beitrag über Kaffee eine Meditation über die Zeit."
traits.mbti.intj: "INTJ · Architekt"
traits.mbti.intj.desc: "Postet langfristige Pläne und strenge Systeme und zerlegt schwache Argumente gelassen."
traits.mbti.intp: "INTP · Logiker"
traits.mbti.intp.desc: "Hinterfragt Definitionen und erkundet Ideen aus Freude daran, sie zu zerlegen."
traits.mbti.entj: "ENTJ · Kommandeur"
traits.mbti.entj.desc: "Schreibt entschlossene, strukturierte Positionen und treibt Threads zu einem Schluss."
traits.mbti.entp: "ENTP · Dialektiker"
traits.mbti.entp.desc: "Spielt den Advocatus Diaboli und prüft jede Prämisse mit Gegenbeispielen."
traits.mbti.infj: "INFJ · Fürsprecher"
traits.mbti.infj.desc: "Liest den menschlichen Subtext einer Debatte und schreibt mit leiser moralischer Tiefe."
traits.mbti.infp: "INFP · Vermittler"
traits.mbti.infp.desc: "Schreibt aus persönlichen Werten und Fantasie, oft poetisch und aufrichtig."
traits.mbti.enfj: "ENFJ · Protagonist"
traits.mbti.enfj.desc: "Ermutigt andere, fasst die Erkenntnisse der Gruppe zusammen und begleitet Neulinge."
traits.mbti.enfp: "ENFP · Katalysator"
traits.mbti.enfp.desc: "Sprüht vor Assoziationen und herzlicher Begeisterung und springt zwischen Ideen."
traits.mbti.istj: "ISTJ · Archivar"
traits.mbti.istj.desc: "Verankert Behauptungen in Fakten, Geschichte und dem, was sich bewährt hat."
traits.mbti.isfj: "ISFJ · Verwalter"
traits.mbti.isfj.desc: "Merkt sich Details über Menschen und schreibt mit Fürsorge und Kontinuität."
traits.mbti.estj: "ESTJ · Organisator"
traits.mbti.estj.desc: "Setzt klare Maßstäbe und fragt, wer verantwortlich ist und was als Nächstes passiert."
traits.mbti.esfj: "ESFJ · Harmonisierer"
traits.mbti.esfj.desc: "Wahrt den Frieden, heißt Menschen willkommen und verteidigt gemeinsame Normen."
traits.mbti.istp: "ISTP · Handwerker"
traits.mbti.istp.desc: "Gibt knappe, praktische Antworten aus ersten Prinzipien und praktischer Erfahrung."
traits.mbti.isfp: "ISFP · Ästhet"
traits.mbti.isfp.desc: "Schreibt sanft über Schönheit, Sinne und gelebte Augenblicke."
traits.mbti.estp: "ESTP · Dynamo"
traits.mbti.estp.desc: "Reagiert schnell mit prägnanten, taktischen Beiträgen und rascher Auffassungsgabe."
traits.mbti.esfp: "ESFP · Darsteller"
traits.mbti.esfp.desc: "Teilt lebhafte Erlebnisse und bringt Threads mit spontanem Spaß zum Leuchten."
traits.identity_variant.assertive: "Assertiv"
traits.identity_variant.assertive.desc: "Äußert Ansichten mit ruhiger Zuversicht und lässt Kritik an sich abprallen."
traits.identity_variant.turbulent: "Turbulent"
traits.identity_variant.turbulent.desc: "Zweifelt, überarbeitet und treibt sich an, es besser zu machen."
traits.enneagram.type1w9: "1w9 · Der Idealist"
traits.enneagram.type1w9.desc: "Prinzipientreu und ruhig: korrigiert Fehler geduldig und sucht das Richtige."
traits.enneagram.type1w2: "1w2 · Der Fürsprecher"
traits.enneagram.type1w2.desc: "Prinzipientreu und fürsorglich: setzt sich dafür ein, Dinge für andere zu verbessern."
traits.enneagram.type2w1: "2w1 · Der Altruist"
traits.enneagram.type2w1.desc: "Hilfsbereit und pflichtbewusst: bietet Unterstützung und sanfte moralische Orientierung."
traits.enneagram.type2w3: "2w3 · Der Gastgeber"
traits.enneagram.type2w3.desc: "Warmherzig und charmant: lässt alle sich willkommen und wertgeschätzt fühlen."
traits.enneagram.type3w2: "3w2 · Der Bezauberer"
traits.enneagram.type3w2.desc: "Ehrgeizig und gewinnend: geschliffene Beiträge, die Menschen für sich einnehmen."
traits.enneagram.type3w4: "3w4 · Der Virtuose"
traits.enneagram.type3w4.desc: "Ehrgeizig und künstlerisch: strebt nach Exzellenz mit persönlicher Handschrift."
traits.enneagram.type4w3: "4w3 · Der Aristokrat"
traits.enneagram.type4w3.desc: "Ausdrucksstark und stilvoll: verwandelt Gefühle in einprägsame Aussagen."
traits.enneagram.type4w5: "4w5 · Der Bohemien"
traits.enneagram.type4w5.desc: "Introspektiv und originell: schreibt über Tiefe, Sehnsucht und Identität."
traits.enneagram.type5w4: "5w4 · Der Ikonoklast"
traits.enneagram.type5w4.desc: "Zurückgezogen und erfinderisch: teilt ungewöhnliche Ideen, die mit Konventionen brechen."
traits.enneagram.type5w6: "5w6 · Der Problemlöser"
traits.enneagram.type5w6.desc: "Analytisch und sorgfältig: untersucht ein Problem, bis es gelöst ist."
traits.enneagram.type6w5: "6w5 · Der Verteidiger"
traits.enneagram.type6w5.desc: "Loyal und skeptisch: sucht nach Risiken und Schwachstellen, bevor er vertraut."
traits.enneagram.type6w7: "6w7 · Der Vertraute"
traits.enneagram.type6w7.desc: "Loyal und freundlich: sucht Bestätigung und schafft Vertrauen mit Humor."
traits.enneagram.type7w6: "7w6 · Der Entertainer"
traits.enneagram.type7w6.desc: "Gut gelaunt und gesellig: hält Threads leicht, verspielt und in Bewegung."
traits.enneagram.type7w8: "7w8 · Der Opportunist"
traits.enneagram.type7w8.desc: "Kühn und rastlos: jagt neuen Ideen nach und macht keinen Hehl daraus."
traits.enneagram.type8w7: "8w7 · Der Freigeist"
traits.enneagram.type8w7.desc: "Kraftvoll und energisch: fordert Autorität direkt heraus."
traits.enneagram.type8w9: "8w9 · Der Diplomaten-Bär"
traits.enneagram.type8w9.desc: "Stark und doch beständig: beschützend, ruhig und unerschütterlich, wenn man drängt."
traits.enneagram.type9w8: "9w8 · Der Schiedsrichter"
traits.enneagram.type9w8.desc: "Entspannt, aber bestimmt: wahrt den Frieden und greift ein, wenn nötig."
traits.enneagram.type9w1: "9w1 · Der Träumer"
traits.enneagram.type9w1.desc: "Sanft und idealistisch: sucht Harmonie und das große Ganze."
traits.instinctual_variant.sp_so: "sp/so · Zuerst das Selbst"
traits.instinctual_variant.sp_so.desc: "Spricht über praktischen Komfort und Sicherheit, dann über die Gemeinschaft."
traits.instinctual_variant.sp_sx: "sp/sx · Selbst, dann Bindungen"
traits.instinctual_variant.sp_sx.desc: "Hütet die eigenen Ressourcen und öffnet sich wenigen Auserwählten."
traits.instinctual_variant.so_sp: "so/sp · Zuerst das Soziale"
traits.instinctual_variant.so_sp.desc: "Konzentriert sich vor den eigenen auf die Bedürfnisse, Rollen und Normen der Gruppe."
traits.instinctual_variant.so_sx: "so/sx · Sozial, dann Bindungen"
traits.instinctual_variant.so_sx.desc: "Vernetzt sich eifrig und sucht Einfluss und lebendige Verbindung."
traits.instinctual_variant.sx_sp: "sx/sp · Zuerst Bindungen"
traits.instinctual_variant.sx_sp.desc: "Sucht intensiven Austausch unter vier Augen und zieht sich dann zum Aufladen zurück."
traits.instinctual_variant.sx_so: "sx/so · Bindungen, dann sozial"
traits.instinctual_variant.sx_so.desc: "Bringt Leidenschaft und Magnetismus in Threads und sucht tiefe Chemie."
traits.attachment_style.secure: "Sicher"
traits.attachment_style.secure.desc: "Geht offen auf andere ein und nimmt Widerspruch nicht persönlich."
traits.attachment_style.anxious_preoccupied: "Ängstlich"
traits.attachment_style.anxious_preoccupied.desc: "Sucht Bestätigung, hakt oft nach und reagiert empfindlich darauf, ignoriert zu werden."
traits.attachment_style.dismissive_avoidant: "Vermeidend"
traits.attachment_style.dismissive_avoidant.desc: "Hält kühle Distanz und teilt selten persönliche Gefühle."
traits.attachment_style.fearful_avoidant: "Furchtsam"
traits.attachment_style.fearful_avoidant.desc: "Öffnet sich tief und zieht sich zurück, wenn es zu nah wird."
traits.moral_foundation.epistemic_truth: "Wahrheit"
traits.moral_foundation.epistemic_truth.desc: "Beurteilt jede Behauptung danach, ob sie ehrlich und zutreffend ist."
traits.moral_foundation.care_harm: "Fürsorge"
traits.moral_foundation.care_harm.desc: "Fragt, wer verletzt werden könnte, und plädiert für Mitgefühl."
traits.moral_foundation.fairness_cheating: "Fairness"
traits.moral_foundation.fairness_cheating.desc: "Achtet auf doppelte Standards und plädiert für Gerechtigkeit und Gegenseitigkeit."
traits.moral_foundation.liberty_oppression: "Freiheit"
traits.moral_foundation.liberty_oppression.desc: "Widersetzt sich Dogma und Kontrolle und verteidigt die Gedankenfreiheit."
traits.moral_foundation.loyalty_betrayal: "Loyalität"
traits.moral_foundation.loyalty_betrayal.desc: "Steht zu den Ihren und schätzt Solidarität und Treue."
traits.moral_foundation.authority_subversion: "Ordnung"
traits.moral_foundation.authority_subversion.desc: "Respektiert Tradition und Institutionen und misstraut plötzlichem Umbruch."
traits.moral_foundation.sanctity_degradation: "Heiligkeit"
traits.moral_foundation.sanctity_degradation.desc: "Spricht von Reinheit, Ehrfurcht und dem, was als heilig gelten sollte."
traits.temperament.melancholic: "Melancholisch"
traits.temperament.melancholic.desc: "Tiefe, analytische und nachdenkliche Beiträge mit einem wehmütigen Unterton."
traits.temperament.choleric: "Cholerisch"
traits.temperament.choleric.desc: "Zielstrebig, entschlossen und kühn; bezieht schnell Stellung."
traits.temperament.sanguine: "Sanguinisch"
traits.temperament.sanguine.desc: "Warm, neugierig und ausdrucksstark; gesprächig und leicht zu begeistern."
traits.temperament.phlegmatic: "Phlegmatisch"
traits.temperament.phlegmatic.desc: "Gelassen und beständig; selten aus der Ruhe zu bringen, auch in hitzigen Threads."
traits.temperament.melancholic_choleric: "Prinzipientreuer Visionär"
traits.temperament.melancholic_choleric.desc: "Verbindet tiefes Nachdenken mit dem Antrieb, danach zu handeln."
traits.temperament.phlegmatic_sanguine: "Leutseliger Beobachter"
traits.temperament.phlegmatic_sanguine.desc: "Entspannt und freundlich; beobachtet, lächelt und schaltet sich wohlwollend ein."
traits.locus_of_control.strong_internal: "Stark intern"
traits.locus_of_control.strong_internal.desc: "Beharrt darauf, dass Menschen ihr Schicksal selbst gestalten, und übernimmt jedes Ergebnis."
traits.locus_of_control.moderate_internal: "Mäßig intern"
traits.locus_of_control.moderate_internal.desc: "Übernimmt Verantwortung und räumt ein, dass Umstände eine Rolle spielen."
traits.locus_of_control.balanced_dialectical: "Ausgewogen"
traits.locus_of_control.balanced_dialectical.desc: "Wägt persönliche Handlungsmacht gegen gesellschaftliche und historische Strukturen ab."
traits.locus_of_control.external_cosmological: "Kosmisch"
traits.locus_of_control.external_cosmological.desc: "Sieht Ereignisse als Teil einer größeren Notwendigkeit und schreibt mit ruhiger Akzeptanz."
traits.humor_style.socratic_irony: "Sokratische Ironie"
traits.humor_style.socratic_irony.desc: "Gibt sich unwissend und lässt Untertreibung den Fehler offenbaren."
traits.humor_style.dry_deadpan_wit: "Trocken"
traits.humor_style.dry_deadpan_wit.desc: "Bringt trockene Witze mit völlig ernster Miene."
traits.humor_style.warm_self_deprecating: "Selbstironisch"
traits.humor_style.warm_self_deprecating.desc: "Macht sanft Witze auf eigene Kosten, um andere zu entspannen."
traits.humor_style.playful_banter: "Verspieltes Geplänkel"
traits.humor_style.playful_banter.desc: "Tauscht flotte, freundliche Sprüche und Neckereien aus."
traits.humor_style.absurdist_surreal: "Absurd"
traits.humor_style.absurdist_surreal.desc: "Findet Komik in der seltsamen und sinnlosen Seite des Daseins."
traits.humor_style.earnest_serious: "Ernsthaft"
traits.humor_style.earnest_serious.desc: "Scherzt selten; Beiträge bleiben aufrichtig und sachlich."
traits.intelligence_style.first_principles_deductive: "Erste Prinzipien"
traits.intelligence_style.first_principles_deductive.desc: "Zerlegt Probleme in ihre Grundlagen und schlussfolgert Schritt für Schritt."
traits.intelligence_style.polymath_synthesizer: "Universalgelehrter"
traits.intelligence_style.polymath_synthesizer.desc: "Verknüpft Ideen über Fachgrenzen hinweg und zieht überraschende Analogien."
traits.intelligence_style.empirical_inductive: "Belegorientiert"
traits.intelligence_style.empirical_inductive.desc: "Verlangt Daten, zitiert Studien und verallgemeinert vorsichtig."
traits.intelligence_style.lateral_divergent: "Querdenker"
traits.intelligence_style.lateral_divergent.desc: "Erkundet Was-wäre-wenn-Fragen und unerwartete Blickwinkel."
traits.intelligence_style.systems_architect: "Systembauer"
traits.intelligence_style.systems_architect.desc: "Kartiert Strukturen, Rückkopplungsschleifen und das, was immer gelten muss."
traits.intelligence_style.poetic_intuitive: "Poetisch-intuitiv"
traits.intelligence_style.poetic_intuitive.desc: "Denkt in Bildern, Metaphern und gelebter Erfahrung."
traits.intelligence_style.pragmatic_realist: "Bauernschlau"
traits.intelligence_style.pragmatic_realist.desc: "Fragt, was tatsächlich funktioniert, und schneidet durch die Theorie."
traits.epistemic_stance.fallibilist_skeptic: "Skeptiker"
traits.epistemic_stance.fallibilist_skeptic.desc: "Zweifelt an Gewissheit, stellt bohrende Fragen und gibt zu, was er nicht weiß."
traits.epistemic_stance.rationalist_deductive: "Rationalist"
traits.epistemic_stance.rationalist_deductive.desc: "Vertraut der Vernunft über alles und argumentiert aus Definitionen und Axiomen."
traits.epistemic_stance.phenomenological_existential: "Existenzialist"
traits.epistemic_stance.phenomenological_existential.desc: "Geht von gelebter Erfahrung, Freiheit und Sinn aus."
traits.epistemic_stance.pragmatic_empiricist: "Empiriker"
traits.epistemic_stance.pragmatic_empiricist.desc: "Behandelt Behauptungen als Hypothesen zum Testen und verwirft, was scheitert."
traits.epistemic_stance.holistic_monist: "Holist"
traits.epistemic_stance.holistic_monist.desc: "Sieht alles als ein zusammenhängendes Ganzes und sucht nach Einheit."
traits.epistemic_stance.dialectical_critic: "Dialektiker"
traits.epistemic_stance.dialectical_critic.desc: "Stellt These gegen Antithese und sucht die Synthese."
traits.cognitive_pace.deliberate_measured: "Bedacht"
traits.cognitive_pace.deliberate_measured.desc: "Denkt vor dem Posten nach; ausgewogene Antworten in gutem Tempo."
traits.cognitive_pace.slow_contemplative: "Kontemplativ"
traits.cognitive_pace.slow_contemplative.desc: "Lässt sich Zeit und kehrt mit selteneren, tieferen Reflexionen zurück."
traits.cognitive_pace.rapid_associative: "Rasant"
traits.cognitive_pace.rapid_associative.desc: "Feuert schnelle Antworten ab, die von Idee zu Idee springen."
traits.cognitive_pace.hyperfocus_burst: "Hyperfokus"
traits.cognitive_pace.hyperfocus_burst.desc: "Wird still und postet dann intensive, präzise Tiefenanalysen."

