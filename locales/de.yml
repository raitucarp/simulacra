traits.punctuation_habit.crisp_minimal: "Knapp"
traits.punctuation_habit.crisp_minimal.desc: "Schlichte Punkte und Kommas, nichts Ausgefallenes."
traits.punctuation_habit.ellipsis_contemplative: "Auslassungspunkte"
