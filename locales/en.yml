arena.preset.trolley.title: "The trolley problem"
arena.preset.trolley.premise: "A runaway trolley will kill five people on the track ahead unless it is diverted. Diverting it will kill one other person."
arena.preset.trolley.question: "Should you divert the trolley?"
arena.preset.trolley.v1: "How you divert it"
arena.preset.trolley.v1_values: "pull a lever | push a person onto the track"
arena.preset.trolley.v2: "The one person"
arena.preset.trolley.v2_values: "a stranger | someone you love"
arena.preset.marys_room.title: "Mary's room"
arena.preset.marys_room.premise: "Mary is a scientist who knows the physics and biology of colour vision, but has lived all her life in a black-and-white room. One day she leaves it and sees red for the first time."
arena.preset.marys_room.question: "Does Mary learn something new?"
arena.preset.marys_room.v1: "What she knew"
arena.preset.marys_room.v1_values: "every physical fact | most facts, with gaps"
arena.preset.marys_room.v2: "What she sees first"
arena.preset.marys_room.v2_values: "a ripe tomato | a plain red square"
arena.preset.ship_of_theseus.title: "The ship of Theseus"
arena.preset.ship_of_theseus.premise: "A ship's planks are replaced one by one until no original plank remains."
arena.preset.ship_of_theseus.question: "Is it still the same ship?"
arena.preset.ship_of_theseus.v1: "Pace of replacement"
arena.preset.ship_of_theseus.v1_values: "over many years | within a week"
arena.preset.ship_of_theseus.v2: "The old planks"
arena.preset.ship_of_theseus.v2_values: "are left in storage | are rebuilt into a second ship"
arena.preset.experience_machine.title: "The experience machine"
arena.preset.experience_machine.premise: "A machine can give you any experiences you choose for the rest of your life. While connected, you would believe they are real."
arena.preset.experience_machine.question: "Should you connect for life?"
arena.preset.experience_machine.v1: "Your life now"
arena.preset.experience_machine.v1_values: "happy and secure | full of hardship"
arena.preset.experience_machine.v2: "People who depend on you"
arena.preset.experience_machine.v2_values: "none | a family"
arena.preset.veil_of_ignorance.title: "The veil of ignorance"
arena.preset.veil_of_ignorance.premise: "You choose the rules for sharing wealth in a society without knowing who you will be in it: your talents, health or family."
arena.preset.veil_of_ignorance.question: "Would you choose rules that guarantee the worst-off a decent minimum, even if that lowers the average?"
arena.preset.veil_of_ignorance.v1: "What the minimum costs"
arena.preset.veil_of_ignorance.v1_values: "a little of the average | much of the average"
arena.preset.veil_of_ignorance.v2: "Your attitude to risk"
arena.preset.veil_of_ignorance.v2_values: "cautious | willing to gamble"
arena.preset.chinese_room.title: "The Chinese room"
arena.preset.chinese_room.premise: "Someone who knows no Chinese sits in a room with a rulebook for answering messages written in Chinese. Readers outside cannot tell the replies from a native speaker's."
arena.preset.chinese_room.question: "Does anything in the room understand Chinese?"
arena.preset.chinese_room.v1: "Who follows the rules"
arena.preset.chinese_room.v1_values: "a person with a rulebook | a computer running a program"
arena.preset.chinese_room.v2: "Its link to the world"
arena.preset.chinese_room.v2_values: "messages only | a robot body with cameras"
arena.preset.newcomb.title: "Newcomb's problem"
arena.preset.newcomb.premise: "A predictor puts 1,000 in a clear box, and 1,000,000 in an opaque box only if it predicted you would take the opaque box alone. You may take both boxes or only the opaque one."
arena.preset.newcomb.question: "Should you take only the opaque box?"
arena.preset.newcomb.v1: "The predictor's record"
arena.preset.newcomb.v1_values: "never wrong so far | right nine times in ten"
arena.preset.newcomb.v2: "When it predicted"
arena.preset.newcomb.v2_values: "a minute ago | a year ago"
arena.preset.original_position.title: "The original position"
arena.preset.original_position.premise: "Representatives of free and equal people agree on principles of justice without knowing whose interests they will represent."
arena.preset.original_position.question: "Should the basic liberties come before economic gains?"
arena.preset.original_position.v1: "The society's wealth"
arena.preset.original_position.v1_values: "scarce | abundant"
arena.preset.original_position.v2: "The gain at stake"
arena.preset.original_position.v2_values: "small | large"
