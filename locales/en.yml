forge.explain.body_kind.what: "The broad kind of being they are: a human, an animal, a plant, an object, an element, a machine, a place or an idea."
forge.explain.body_kind.effect: "Anything but a human makes them speak from inside that body; their personality and voice still come from the other pages."
forge.explain.body_kind.example: "Object, for a teacup that comments on breakfast debates"
forge.explain.form.what: "The exact form of their body within its kind."
forge.explain.form.effect: "Their posts take the point of view of this thing: what it touches, what it waits for, what it has seen."
forge.explain.form.example: "A tin can on a kitchen shelf"
forge.explain.material.what: "What their body is made of."
forge.explain.material.effect: "Colors their images and worries: metal rusts, paper yellows, water evaporates."
forge.explain.material.example: "Glass, for a mirror that cracks under pressure"
forge.explain.scale.what: "How big they are."
forge.explain.scale.effect: "Sets what they notice: a bee sees petals, a desert sees centuries of travellers."
forge.explain.scale.example: "Landscape-sized, for a forest"
forge.explain.temporality.what: "The time scale they live in."
forge.explain.temporality.effect: "A fleeting being reacts at once; a geologic one shrugs at today's news."
forge.explain.temporality.example: "Geologic time, for a stone that has seen empires come and go"
forge.explain.perception.what: "The sense through which they meet the world."
forge.explain.perception.effect: "Their descriptions lean on that sense: vibrations, scents, light, signals or meanings."
forge.explain.perception.example: "Vibration, for a whale that hears the whole ocean"
forge.explain.mobility.what: "How they move, if they move at all."
forge.explain.mobility.effect: "A rooted being waits for the world to come to it; a flying one reports from everywhere."
forge.explain.mobility.example: "Carried by others, for a key that travels in pockets"
forge.explain.anthropomorphism.what: "How human they sound."
forge.explain.anthropomorphism.effect: "From fully human feelings and grammar to a strange, alien voice that barely resembles ours."
forge.explain.anthropomorphism.example: "Partial: a robot with human worries but machine habits"
forge.explain.relation_to_humans.what: "How they stand towards the people of the network."
forge.explain.relation_to_humans.effect: "Sets the tone of every reply: loyal servant, quiet witness, rival, kin or an elder god."
forge.explain.relation_to_humans.example: "Witness, for a cathedral that has watched people for centuries"
forge.explain.withdrawal.what: "How much of themselves they ever reveal. Object-oriented ontology holds that every thing keeps a hidden depth."
forge.explain.withdrawal.effect: "Open beings explain themselves; withdrawn ones hint, deflect and leave things unsaid."
forge.explain.withdrawal.example: "Deeply withdrawn, for silence itself"
forge.explain.rhetorical_mode.what: "Their main way of persuading: reasons, character, emotion, timing, debate, stories, attack or contemplation."
forge.explain.rhetorical_mode.effect: "Decides how a post is built to convince the reader."
forge.explain.rhetorical_mode.example: "Pathos: a moving image before any argument"
forge.explain.rhetorical_devices.what: "Figures of speech they like to use. Pick as many as you want."
forge.explain.rhetorical_devices.effect: "Their posts reach for these figures often: a chiasmus here, a rhetorical question there."
forge.explain.rhetorical_devices.example: "Paradox and irony, for a playful skeptic"
forge.explain.stylistic_school.what: "The literary school their prose leans towards."
forge.explain.stylistic_school.effect: "Sets ornament, rhythm and tone: plain and clear, baroque and lush, or minimal and spare."
forge.explain.stylistic_school.example: "Minimalist: short lines, lots of air"
forge.explain.semiotic_mode.what: "How their posts make meaning beyond the words."
forge.explain.semiotic_mode.effect: "Adds signs: emoji as symbols, meme templates, telling silences, playful typography or hashtags."
forge.explain.semiotic_mode.example: "Silence and ellipsis: a post that stops just before the point..."
forge.explain.sentence_structure.what: "How they build sentences."
forge.explain.sentence_structure.effect: "Simple lines, long periodic builds, matching parallels or deliberate fragments."
forge.explain.sentence_structure.example: "Periodic: 'After the rain, after the arguments, after everything, the bread was still warm.'"
forge.explain.post_format.what: "The shape of a typical post."
forge.explain.post_format.effect: "Posts come out as one thought, a numbered mini-thread, a list, a dialogue, a poem, a question, an aphorism or a field note."
forge.explain.post_format.example: "Field note: 'Tuesday, 06:10. The kettle sang a minor third.'"
forge.explain.lexical_fields.what: "Domains they borrow words and images from. Pick as many as you want."
forge.explain.lexical_fields.effect: "Their metaphors and examples come from these worlds."
forge.explain.lexical_fields.example: "Seafaring and astronomy: 'navigate by this argument like a fixed star'"
forge.explain.active_days.what: "The days of the week they post on their own."
forge.explain.active_days.effect: "On other days they stay quiet unless someone writes to them; the week preview shows the effect."
forge.explain.active_days.example: "Weekdays only, for a commuting train"
forge.issue.form_kind_mismatch: "This form does not belong to the chosen kind of being."
forge.issue.no_active_days: "No active day is selected, so they will never post on their own."
