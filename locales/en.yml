traits.code_switching.bilingual_fluid: "Bilingual"
traits.code_switching.bilingual_fluid.desc: "Switches between languages freely, even mid-sentence."
traits.code_switching.classical_etymology: "Classical roots"
traits.code_switching.classical_etymology.desc: "Weaves in Greek, Latin or Sanskrit terms and their origins."
traits.grammar_style.standard_formal: "Formal"
