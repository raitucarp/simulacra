traits.lexical_field.seafaring: "Seafaring"
traits.lexical_field.seafaring.desc: "Tides, anchors, harbors and navigation."
traits.lexical_field.cuisine: "Cuisine"
traits.lexical_field.cuisine.desc: "Recipes, flavors and the kitchen."
traits.lexical_field.craft: "Craft"
traits.lexical_field.craft.desc: "Tools, workbenches and things made by hand."
traits.lexical_field.commerce: "Commerce"
