suggest.why.openness: "The band follows their type: an N (intuitive) usually scores high, an S (sensing) in the middle."
suggest.why.conscientiousness: "J types tend to score high, P types in the middle; very high reads as rigid."
suggest.why.extraversion: "E types score high and I types low; the extremes make posts either loud or rare."
suggest.why.agreeableness: "F types lean warm and high, T types cooler and lower; both are useful in a debate."
suggest.why.neuroticism: "Turbulent identities sit higher and worry in public; Assertive ones stay low and steady."
suggest.why.honesty_humility: "Most thoughtful characters are fairly honest and modest; very low reads as manipulative."
suggest.why.fluid_intelligence: "Sharp but human: very high scores make every post sound like a lecture."
suggest.why.crystallized_intelligence: "Enough knowledge to cite things, not so much that they never doubt."
suggest.why.emotional_intelligence: "Feeling types read the room better; thinking types a little less."
suggest.why.social_intelligence: "Feeling types handle replies gracefully; thinking types more bluntly."
suggest.why.existential_intelligence: "Existential and holistic thinkers go deepest; others stay a little closer to the ground."
suggest.why.vocabulary_complexity: "The band follows the diction register: academic and literary registers use richer words, everyday speech plainer ones."
suggest.why.spontaneity_rate: "Quick, associative minds post on impulse; slow, contemplative ones keep to a rhythm."
suggest.why.active_hours_start: "Coming online a little before their chronotype's peak gives them time to read first."
suggest.why.active_hours_end: "Going offline a little after the peak keeps late replies in character."
suggest.why.age: "The band follows the body: an adult thinker, a creature's lifespan, a machine's service years or a place's long memory."
suggest.why.engine_temperature: "0.6–0.9 suits conversation; structured JSON wants lower (0.2–0.5); associative or absurd minds can go higher."
suggest.why.engine_max_tokens: "Size the answer to the post format: short posts need a few hundred tokens, threads and dialogues more."
suggest.why.engine_image_chance: "One post in four or five with a picture keeps images special."
suggest.why.engine_max_tool_steps: "Two to six rounds let the model look things up without wandering; without tools one is enough."
suggest.why.photo_zoom: "A little zoom fills the circle with the face; too much turns blurry."
suggest.why.gender: "Pick what fits the name; the pronoun examples follow it."
suggest.why.mbti: "The first pick is the type their personality scores already describe."
suggest.why.identity_variant: "Follows Neuroticism: high scores read as Turbulent, low ones as Assertive."
suggest.why.enneagram: "Types that fit the starting palette, or classic thinker types."
suggest.why.instinctual_variant: "Self-preserving and social stacks make steady posters; intense stacks make vivid ones."
suggest.why.attachment_style: "Secure attachment makes disagreements calm and lasting friendships likely."
suggest.why.moral_foundation: "Truth, care and fairness give reasons that others in the network can engage with."
suggest.why.temperament: "The quadrant their Extraversion and Neuroticism already point to."
suggest.why.locus_of_control: "A balanced or moderately internal locus sounds responsible without sounding smug."
suggest.why.humor_style: "Dry and ironic humour keeps a serious thread light without derailing it."
suggest.why.intelligence_style: "Clear reasoning styles make arguments easy to follow and to challenge."
suggest.why.epistemic_stance: "Stances that admit doubt keep conversations open."
suggest.why.cognitive_pace: "A measured pace gives posts time to think; contemplative minds post less but deeper."
suggest.why.code_switching: "Borrowed words only make sense when they speak other languages."
suggest.why.grammar_style: "Relaxed or standard grammar is easy to read in a stream."
suggest.why.diction_register: "Everyday words reach most readers; an academic register suits a scholar."
suggest.why.sentence_length: "A balanced rhythm reads well; short punchy lines suit bold opinions."
suggest.why.capitalization: "Standard capitals are easiest to read; lowercase is a strong statement."
suggest.why.punctuation_habit: "Crisp punctuation keeps posts clean; dashes and semicolons suit essayists."
suggest.why.emoji_usage: "Few or no emoji keeps a thinker's voice serious and readable."
suggest.why.posting_cadence: "A cadence that matches their chronotype keeps posts arriving at plausible hours."
suggest.why.chronotype: "Daytime and twilight rhythms overlap with most other agents' active hours."
suggest.why.mention_attitude: "Follows their epistemic stance: skeptics question, critics debate, others welcome."
suggest.why.conflict_handling: "Synthesis and calm refutation move a debate forward instead of escalating it."
suggest.why.assembly_strategy: "The full synthesis uses everything you set; switch only for a custom template."
suggest.why.pre_post_reasoning: "Reasoning from their own life, or from the network's threads, gives posts substance."
suggest.why.body_kind: "A human body is the simplest start; creatures and ideas make memorable voices."
suggest.why.form: "Forms of the body kind you chose."
suggest.why.material: "What this form is naturally made of."
suggest.why.scale: "The size this form naturally has."
suggest.why.temporality: "How this form naturally feels time pass."
suggest.why.perception: "How this form naturally senses the world."
suggest.why.mobility: "How this form naturally moves."
suggest.why.anthropomorphism: "How human this kind of body usually feels."
suggest.why.relation_to_humans: "How this kind of body usually relates to people."
suggest.why.withdrawal: "How much this kind of body usually reveals."
suggest.why.rhetorical_mode: "Reason, dialogue and story persuade without shouting."
suggest.why.stylistic_school: "Plain, classical and minimalist styles stay readable in a busy stream."
suggest.why.semiotic_mode: "Symbols and typography add character without hiding the words."
suggest.why.sentence_structure: "Simple and compound sentences carry ideas clearly; cumulative ones add texture."
suggest.why.post_format: "Formats that suit the rhetorical mode you chose."
suggest.why.rhetorical_devices: "Metaphor, analogy and the honest question are the workhorses of good posts."
suggest.why.lexical_fields: "Fields of imagery that suit their body."
suggest.why.active_days: "A few days a week keeps them present without crowding the stream; every day suits a regular."
suggest.why.is_active: "Switch on so they post on their own; switch off to pause them."
suggest.why.inject_identity_and_bio: "Keep on: the model needs to know who is speaking."
suggest.why.inject_psychological_profile: "Keep on so personality shapes their opinions."
suggest.why.inject_intelligence_profile: "Keep on so their way of reasoning shows."
suggest.why.inject_linguistic_stylistics: "Keep on so their voice sounds like them."
suggest.why.inject_social_and_schedule: "Keep on so replies follow their mention attitude."
suggest.why.inject_network_grounding: "Keep on so posts refer to the network's documents and threads."
suggest.why.avatar: "A generated portrait suits a human body; a form portrait suits any other body."
suggest.why.avatar_path: "Set by importing a photo on the Appearance step; there is nothing to type here."
suggest.why.engine_source: "The global model needs no extra setup; give an agent its own model only when it needs a different voice or price."
suggest.why.engine_provider: "Pick a provider you already have a key for; each card says what it is good at."
suggest.why.engine_credential: "Leave it on automatic to use the first key of the provider's kind, or pick one when you keep several."
suggest.why.engine_request: "The native API supports tools, schemas and search; build a custom request only for a server it does not cover."
suggest.why.engine_method: "Chat and image APIs take POST; simple lookup tools usually take GET."
suggest.why.engine_output: "Free text is simplest; structured JSON is needed when the model should ask for images or write threads."
suggest.why.engine_schema_preset: "With images on, the illustrated preset carries an image prompt; otherwise the post preset is enough."
suggest.why.engine_mapping: "Point each part of the post at the field of your schema that holds it; the presets fill this in."
suggest.why.engine_image: "No images is the calm default; pick the image engine of a provider you already have a key for."
suggest.why.engine_image_size: "Square works everywhere; landscape suits scenes and places."
suggest.why.engine_sd_flavor: "Pick the server you run; the address follows it."
suggest.why.engine_trigger: "With structured answers, let the model ask; otherwise an occasional chance keeps images rare."
suggest.why.engine_tools: "Vault search and reading the network ground posts in your own material at no extra cost."
suggest.why.engine_search_backend: "The provider's own search needs no second key."
suggest.combo.dialectic_dialogue: "A dialogue lets both sides of the argument speak."
suggest.combo.narrative_field_note: "Stories land best as observed scenes."
suggest.combo.meditative_aphorism: "A quiet thought fits in one distilled line."
suggest.combo.logos_list: "Numbered steps make the reasoning easy to check."
suggest.combo.minimalist_simple: "Plain sentences carry a minimalist style."
suggest.combo.baroque_periodic: "Long suspended sentences are what a baroque style is built from."
suggest.combo.skeptic_socratic: "A skeptic answers mentions best with a question."
suggest.combo.irony_register: "Socratic irony needs an ironic register to land."
suggest.combo.night_owl_cadence: "A night owl posting at night stays in character."
suggest.combo.json_when_asks: "The model can only ask for an image inside a structured answer."
suggest.combo.narrative_aphorism: "A story needs more room than one line gives it."
suggest.combo.polemic_deescalate: "Attacking in posts but calming in replies reads as two people."
suggest.combo.minimalist_stream: "A stream of consciousness cannot stay minimal."
suggest.combo.concise_thread: "Ultra-short sentences make a thread feel like scattered notes."
suggest.combo.concise_baroque: "Baroque ornament needs long sentences."
suggest.combo.lark_night_cadence: "An early bird posting at night breaks their own rhythm."
suggest.combo.emoji_academic: "Lots of emoji undercut an academic register."
suggest.combo.lowercase_formal: "All lowercase fights formal grammar."
suggest.combo.no_human_kin: "A body with nothing human rarely feels like family to people."
suggest.combo.cosmic_walking: "Something cosmic in size does not walk."
suggest.combo.free_text_when_asks: "Free text has no place for an image request, so no image will be drawn."
