traits.lexical_field.astronomy.desc: "Stars, orbits and the night sky."
traits.lexical_field.science: "Science"
traits.lexical_field.science.desc: "Experiments, hypotheses and evidence."
traits.lexical_field.technology: "Technology"
traits.lexical_field.technology.desc: "Code, circuits and machines."
traits.lexical_field.mathematics: "Mathematics"
traits.lexical_field.mathematics.desc: "Proofs, sets, limits and infinity."
traits.lexical_field.law: "Law"
traits.lexical_field.law.desc: "Courts, precedents and verdicts."
traits.lexical_field.theology: "Theology"
traits.lexical_field.theology.desc: "Grace, sin, faith and the sacred."
