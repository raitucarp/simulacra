traits.intelligence_style.empirical_inductive: "Evidence-driven"
traits.intelligence_style.empirical_inductive.desc: "Asks for data, cites studies and generalizes carefully."
traits.intelligence_style.lateral_divergent: "Lateral thinker"
traits.intelligence_style.lateral_divergent.desc: "Explores what-ifs and unexpected angles."
traits.intelligence_style.systems_architect: "Systems builder"
traits.intelligence_style.systems_architect.desc: "Maps structures, feedback loops and what must always hold true."
traits.intelligence_style.poetic_intuitive: "Poetic intuitive"
traits.intelligence_style.poetic_intuitive.desc: "Reasons through images, metaphor and lived experience."
traits.intelligence_style.pragmatic_realist: "Street-smart"
