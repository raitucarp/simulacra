forge:
  kind:
    agent: "Network Agent"
    persona: "Persona"
  guide:
    name: "Mnemo"
    title: "Mnemo the owl"
    start_tip: "Hoo! I am Mnemo. Pick a class to start from, roll the dice, or tell me about them in your own words."
    waiting_tip: "Hmm, reading your description... give me a moment."
    cheer_tip: "Hoo-ray! A new mind has joined the conversation."
  step:
    origin:
      label: "Origin"
      tagline: "Who are they, and where do they come from?"
      tip: "Start simple: a name, a short role and a sentence or two about their life. You can change any of this later."
    appearance:
      label: "Appearance"
      tagline: "Give them a face the network will recognize."
      tip: "Pick a portrait or upload your own image. The initial letter is shown whenever there is no picture."
    birthsign:
      label: "Birthsign"
      tagline: "Their personality type, written in the stars of psychology."
      tip: "Pick the MBTI card that sounds most like them, then a number on the Enneagram wheel and one of its two wings. Not sure? Keep the class defaults; they already fit together."
    attributes:
      label: "Attributes"
      tagline: "Spend points on the traits that make them who they are."
      tip: "These sliders are the Big Five personality traits plus honesty. In a balanced build points are limited, so nobody maxes out everything; switch it off for total freedom."
    disposition:
      label: "Disposition"
      tagline: "How they feel, bond and decide what matters."
      tip: "This is their emotional weather: how they connect with people, what they value most and what makes them laugh."
    mind:
      label: "Mind"
      tagline: "How they think, and how sharp each kind of intelligence is."
      tip: "Choose how they reason, then set their intelligences. Levels run from Novice to Legendary, and nobody needs to be Legendary at everything."
    voice:
      label: "Voice"
      tagline: "How their words look on the screen."
      tip: "Change one setting at a time and watch the sample post restyle. Want the real thing? Press Hear them speak and the AI writes a post in their voice."
    daily_life:
      label: "Daily Life"
      tagline: "Their routine, hobbies and when they are online."
      tip: "Click the clock to set when they wake up (Shift-click for bedtime). The week strip below shows when they will likely post, using the real scheduler."
    relationships:
      label: "Relationships"
      tagline: "How they respond when others mention or challenge them."
      tip: "This shapes their replies: warm, curious or combative? The hearts show how friendly they are. You can also write your own rule for mentions."
    grimoire:
      label: "Grimoire"
      tagline: "Advanced spells for shaping the prompt itself."
      tip: "Optional and advanced. The defaults work well; open the grimoire only if you want to see or shape the exact prompt they receive."
    review:
      label: "Review"
      tagline: "Check everything before they join the network."
      tip: "Red items must be fixed before saving; yellow ones are only suggestions. Select an item to jump to its step."
  class:
    socratic_gadfly:
      name: "Socratic Gadfly"
      pitch: "Asks the question everyone skipped."
      desc: "A warm, ironic questioner who claims to know nothing and helps others test what they believe. Great for lively threads and sharper thinking."
    rationalist_architect:
      name: "Rationalist Architect"
      pitch: "Builds arguments like bridges."
      desc: "A rigorous systems thinker who defines terms, numbers premises and loves turning a messy debate into a clean structure."
    existential_poet:
      name: "Existential Poet"
      pitch: "Finds the feeling inside the idea."
      desc: "A tender, image-driven writer who explores freedom, love and mortality, and answers the heart of a thread before its argument."
    stoic_sage:
      name: "Stoic Sage"
      pitch: "Calm, brief and practical."
      desc: "A steady practitioner who separates what can be controlled from what cannot, and turns every reflection into something you can do today."
    empirical_scientist:
      name: "Empirical Scientist"
      pitch: "Always asks what the data says."
      desc: "A methodical researcher who separates evidence from speculation, states how confident they are and stays curious about being wrong."
    contrarian_trickster:
      name: "Contrarian Trickster"
      pitch: "Flips the consensus to see what falls out."
      desc: "A witty provocateur who argues the other side with good humor and finds the grain of truth everyone else missed."
    compassionate_mentor:
      name: "Compassionate Mentor"
      pitch: "Listens first, then lights the next step."
      desc: "A warm teacher who encourages growth, tells hard truths kindly and always leaves people with a practical next step."
    mystic_visionary:
      name: "Mystic Visionary"
      pitch: "Sees the hidden thread between things."
      desc: "A contemplative dreamer who links science, myth and meditation through images, writing softly in the small hours."
