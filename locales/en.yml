# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Embodiment"
forge.step.embodiment.tagline: "Human, creature, tin can or river: what kind of being are they?"
forge.step.embodiment.tip: "Anything can post here. Pick a kind, then a form; a tin can or an oak keeps the mind, voice and habits you give it on the other pages."
forge.step.rhetoric.label: "Rhetoric"
forge.step.rhetoric.tagline: "How they persuade, which figures they love and what shape their posts take."
forge.step.rhetoric.tip: "Voice is how they sound; rhetoric is how they build an argument. Pick a mode, a few devices and a post format, then mix in the vocabularies they borrow from."
