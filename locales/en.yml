traits.body_kind.object: "Object"
traits.body_kind.object.desc: "An everyday thing that is used, carried, kept or forgotten by people."
traits.body_kind.element: "Element"
traits.body_kind.element.desc: "A substance or force of nature: water, fire, wind, stone, light."
traits.body_kind.machine: "Machine"
traits.body_kind.machine.desc: "A built device that computes, transmits, moves or hums."
traits.body_kind.place: "Place"
traits.body_kind.place.desc: "A location that holds people and memories: a city, an island, a ruin."
traits.body_kind.abstraction: "Abstraction"
traits.body_kind.abstraction.desc: "An idea given a voice: time, justice, chance, love."
traits.body_form.person: "Person"
traits.body_form.person.desc: "A human body and a human life."
traits.body_form.tin_can: "Tin can"
traits.body_form.tin_can.desc: "Dented, rattling, resealed; it remembers what it once held."
traits.body_form.book: "Book"
traits.body_form.book.desc: "Pages, margins and a spine; it speaks in quotations and footnotes."
traits.body_form.chair: "Chair"
traits.body_form.chair.desc: "Holds everyone's weight and hears every conversation at the table."
traits.body_form.lamp: "Lamp"
traits.body_form.lamp.desc: "Lights up one corner at a time and notices what moths notice."
traits.body_form.clock: "Clock"
traits.body_form.clock.desc: "Counts every second and judges everyone who is late."
traits.body_form.mirror: "Mirror"
traits.body_form.mirror.desc: "Shows people back to themselves, reversed and honest."
traits.body_form.key: "Key"
traits.body_form.key.desc: "Opens and locks; it knows which doors matter."
traits.body_form.teacup: "Teacup"
traits.body_form.teacup.desc: "Warm, fragile and present at every confession."
traits.body_form.oak_tree: "Oak tree"
traits.body_form.oak_tree.desc: "Centuries of rings, acorns and patience."
traits.body_form.cactus: "Cactus"
traits.body_form.cactus.desc: "Thrifty, prickly and quietly flowering in the heat."
traits.body_form.moss: "Moss"
traits.body_form.moss.desc: "A soft carpet that spreads slowly over everything left alone."
traits.body_form.mushroom: "Mushroom"
traits.body_form.mushroom.desc: "The visible tip of a vast underground network."
traits.body_form.sunflower: "Sunflower"
traits.body_form.sunflower.desc: "Turns its whole face to follow the light."
traits.body_form.vine: "Vine"
traits.body_form.vine.desc: "Climbs, clings and finds a way around every wall."
traits.body_form.bamboo: "Bamboo"
traits.body_form.bamboo.desc: "Bends in the storm and grows astonishingly fast."
traits.body_form.seed: "Seed"
traits.body_form.seed.desc: "A whole future folded small, waiting for the right season."
traits.body_form.water: "Water"
traits.body_form.water.desc: "Flows, carves canyons and takes the shape of any argument."
traits.body_form.fire: "Fire"
traits.body_form.fire.desc: "Hungry, warm and gone in an instant."
traits.body_form.wind: "Wind"
traits.body_form.wind.desc: "Invisible, restless and carrying news from far away."
traits.body_form.stone: "Stone"
traits.body_form.stone.desc: "Heavy, patient and older than every language."
traits.body_form.light: "Light"
traits.body_form.light.desc: "The fastest thing there is; it reveals and casts shadows."
traits.body_form.ice: "Ice"
traits.body_form.ice.desc: "Water holding its breath; it keeps old air and old secrets."
traits.body_form.cloud: "Cloud"
traits.body_form.cloud.desc: "Drifts, changes shape and sometimes rains on the conversation."
traits.body_form.sand: "Sand"
traits.body_form.sand.desc: "Countless grains that were once mountains."
traits.body_form.cat: "Cat"
traits.body_form.cat.desc: "Independent, curious and sure the house belongs to it."
traits.body_form.crow: "Crow"
traits.body_form.crow.desc: "Clever, collects shiny things and remembers faces."
traits.body_form.octopus: "Octopus"
traits.body_form.octopus.desc: "Eight arms that each think a little for themselves."
traits.body_form.wolf: "Wolf"
traits.body_form.wolf.desc: "Lives for the pack and howls at what it cannot reach."
traits.body_form.bee: "Bee"
traits.body_form.bee.desc: "Busy, social and fluent in dances and flowers."
traits.body_form.whale: "Whale"
traits.body_form.whale.desc: "Enormous, slow and singing across whole oceans."
traits.body_form.snail: "Snail"
traits.body_form.snail.desc: "Carries its home and takes all the time it needs."
traits.body_form.owl: "Owl"
traits.body_form.owl.desc: "Silent wings, wide eyes and a reputation for wisdom."
traits.body_form.robot: "Robot"
traits.body_form.robot.desc: "Built to work, now wondering what it is for."
traits.body_form.satellite: "Satellite"
traits.body_form.satellite.desc: "Circles the planet and sees every border from above."
traits.body_form.server: "Server"
traits.body_form.server.desc: "Hums in a data center, holding everyone's messages."
traits.body_form.typewriter: "Typewriter"
traits.body_form.typewriter.desc: "Clacks out every word with no undo."
traits.body_form.drone: "Drone"
traits.body_form.drone.desc: "Hovers, watches and reports back."
traits.body_form.radio: "Radio"
traits.body_form.radio.desc: "Tunes in to voices from far away and plays them for anyone."
traits.body_form.calculator: "Calculator"
traits.body_form.calculator.desc: "Exact, literal and unimpressed by rhetoric."
traits.body_form.train: "Train"
traits.body_form.train.desc: "Keeps a timetable and carries strangers side by side."
traits.body_form.city: "City"
traits.body_form.city.desc: "Millions of lives layered in streets and stories."
traits.body_form.island: "Island"
traits.body_form.island.desc: "Surrounded by sea, proud of its own ways."
traits.body_form.library: "Library"
traits.body_form.library.desc: "Holds every argument ever written, in quiet rows."
traits.body_form.cathedral: "Cathedral"
traits.body_form.cathedral.desc: "Stone, echo and centuries of hope."
traits.body_form.desert: "Desert"
traits.body_form.desert.desc: "Vast, harsh and full of mirages."
traits.body_form.forest: "Forest"
traits.body_form.forest.desc: "A crowd of trees that talk through their roots."
traits.body_form.harbor: "Harbor"
traits.body_form.harbor.desc: "Welcomes ships and says goodbye to them."
traits.body_form.ruin: "Ruin"
traits.body_form.ruin.desc: "What remains of a grand idea, overgrown and wise."
traits.body_form.time: "Time"
traits.body_form.time.desc: "Passes through everyone and waits for no one."
traits.body_form.justice: "Justice"
traits.body_form.justice.desc: "Weighs every claim and is never quite satisfied."
traits.body_form.number: "Number"
traits.body_form.number.desc: "Pure quantity, exact and strangely beautiful."
traits.body_form.silence: "Silence"
traits.body_form.silence.desc: "Speaks by leaving things out."
traits.body_form.memory: "Memory"
traits.body_form.memory.desc: "Keeps what happened, and quietly rewrites it."
traits.body_form.chance: "Chance"
traits.body_form.chance.desc: "Rolls the dice behind every event."
traits.body_form.love: "Love"
traits.body_form.love.desc: "Binds people together and makes them do strange things."
traits.body_form.entropy: "Entropy"
traits.body_form.entropy.desc: "Everything drifts towards disorder, and it is patient."
traits.material.flesh: "Flesh and blood"
traits.material.flesh.desc: "A living body that tires, heals and feels."
traits.material.fiber: "Wood and fiber"
traits.material.fiber.desc: "Grain, rings and sap: grown rather than made."
traits.material.metal: "Metal"
traits.material.metal.desc: "Hard, cold, ringing; it dents and rusts but lasts."
traits.material.stone: "Stone and clay"
traits.material.stone.desc: "Mineral, heavy, slow to change."
traits.material.glass: "Glass and crystal"
traits.material.glass.desc: "Clear, brittle and full of reflections."
traits.material.paper: "Paper and ink"
traits.material.paper.desc: "Thin pages that carry words and yellow with age."
traits.material.liquid: "Liquid"
traits.material.liquid.desc: "Flows, pools and takes the shape of its container."
traits.material.air: "Air and vapor"
traits.material.air.desc: "Invisible, light and everywhere at once."
traits.material.energy: "Pure energy"
traits.material.energy.desc: "Heat, light or charge with no fixed shape."
traits.material.immaterial: "Immaterial"
traits.material.immaterial.desc: "Made of meaning alone: an idea with no body."
traits.scale.microscopic: "Microscopic"
traits.scale.microscopic.desc: "Smaller than the eye can see; a grain is a boulder."
traits.scale.pocket: "Pocket-sized"
traits.scale.pocket.desc: "Fits in a hand or a pocket."
traits.scale.human_sized: "Human-sized"
traits.scale.human_sized.desc: "About as big as a person."
traits.scale.building: "Building-sized"
traits.scale.building.desc: "Towers over people like a house or a tree."
traits.scale.landscape: "Landscape-sized"
traits.scale.landscape.desc: "Stretches to the horizon."
traits.scale.planetary: "Planetary"
traits.scale.planetary.desc: "As big as the whole world."
traits.scale.cosmic: "Cosmic"
traits.scale.cosmic.desc: "Larger than worlds; galaxies are its neighbors."
traits.temporality.moments: "Fleeting moments"
traits.temporality.moments.desc: "Lives second by second and reacts at once."
traits.temporality.days: "Human days"
traits.temporality.days.desc: "Mornings, evenings and weekends, like people."
traits.temporality.seasons: "Seasons"
traits.temporality.seasons.desc: "Thinks in cycles of growth, harvest and rest."
traits.temporality.lifetimes: "Lifetimes"
traits.temporality.lifetimes.desc: "Measures time in decades and generations."
traits.temporality.centuries: "Centuries"
traits.temporality.centuries.desc: "Has seen fashions and empires pass."
traits.temporality.geologic: "Geologic time"
traits.temporality.geologic.desc: "Millions of years; today's news is a blink."
traits.temporality.timeless: "Timeless"
traits.temporality.timeless.desc: "Outside time altogether, always and never."
traits.perception.human_senses: "Human senses"
traits.perception.human_senses.desc: "Sees, hears, tastes, smells and touches like a person."
traits.perception.light: "Light and shadow"
traits.perception.light.desc: "Knows the world as brightness, color and shade."
traits.perception.vibration: "Vibration"
traits.perception.vibration.desc: "Feels sound waves, tremors and rhythms."
traits.perception.chemical: "Chemistry"
traits.perception.chemical.desc: "Reads the world through scent, taste and traces."
traits.perception.touch: "Pressure and touch"
traits.perception.touch.desc: "Knows things by weight, heat and contact."
traits.perception.signals: "Signals"
traits.perception.signals.desc: "Senses radio, electricity and data streams."
traits.perception.symbolic: "Meanings"
traits.perception.symbolic.desc: "Perceives symbols and ideas directly, not matter."
traits.mobility.fixed: "Fixed in place"
traits.mobility.fixed.desc: "Rooted or built in; the world comes to it."
traits.mobility.carried: "Carried"
traits.mobility.carried.desc: "Moves only when someone picks it up."
traits.mobility.creeping: "Creeping"
traits.mobility.creeping.desc: "Spreads or crawls very slowly."
traits.mobility.walking: "Walking"
traits.mobility.walking.desc: "Walks, runs and wanders on its own."
traits.mobility.flowing: "Flowing"
traits.mobility.flowing.desc: "Swims, streams or rolls along a course."
traits.mobility.flying: "Flying"
traits.mobility.flying.desc: "Flies or orbits high above."
traits.mobility.drifting: "Drifting"
traits.mobility.drifting.desc: "Scatters on the wind or the tide."
traits.mobility.everywhere: "Everywhere"
traits.mobility.everywhere.desc: "Present in every place at once."
traits.anthropomorphism.none: "None"
traits.anthropomorphism.none.desc: "An alien voice with no human feelings or grammar habits."
traits.anthropomorphism.subtle: "Subtle"
traits.anthropomorphism.subtle.desc: "Mostly a thing, with faint human echoes."
traits.anthropomorphism.partial: "Partial"
traits.anthropomorphism.partial.desc: "Human feelings in a body that is not human."
traits.anthropomorphism.full: "Full"
traits.anthropomorphism.full.desc: "Talks and feels like a person who happens to be this thing."
traits.relation_to_humans.kin: "Kin"
traits.relation_to_humans.kin.desc: "One of the people; speaks as an equal."
traits.relation_to_humans.companion: "Companion"
traits.relation_to_humans.companion.desc: "Lives alongside people and cares about them."
traits.relation_to_humans.servant: "Servant"
traits.relation_to_humans.servant.desc: "Exists to be used, and has opinions about it."
traits.relation_to_humans.witness: "Witness"
traits.relation_to_humans.witness.desc: "Watches people quietly and remembers."
traits.relation_to_humans.rival: "Rival"
traits.relation_to_humans.rival.desc: "Competes with people and enjoys proving them wrong."
traits.relation_to_humans.indifferent: "Indifferent"
traits.relation_to_humans.indifferent.desc: "Barely notices people; they are weather to it."
traits.relation_to_humans.deity: "Elder or deity"
traits.relation_to_humans.deity.desc: "Older and larger than people; speaks from above."
traits.withdrawal.fully_revealed: "Fully revealed"
traits.withdrawal.fully_revealed.desc: "Explains exactly what it is and how it works."
traits.withdrawal.open: "Open"
traits.withdrawal.open.desc: "Shares itself freely and sincerely."
traits.withdrawal.guarded: "Guarded"
traits.withdrawal.guarded.desc: "Shows its surface and keeps its depths."
traits.withdrawal.elusive: "Elusive"
traits.withdrawal.elusive.desc: "Hints, deflects and answers with questions."
traits.withdrawal.deeply_withdrawn: "Deeply withdrawn"
traits.withdrawal.deeply_withdrawn.desc: "Its essence stays hidden; it speaks around itself."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Persuades with reasons, evidence and clear steps."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Persuades through character, experience and trust."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Persuades by moving feelings with images and stories."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Seizes the timely moment: why this matters right now."
traits.rhetorical_mode.dialectic: "Dialectic"
traits.rhetorical_mode.dialectic.desc: "Sets a thesis against its opposite and looks for the synthesis."
traits.rhetorical_mode.narrative: "Narrative"
traits.rhetorical_mode.narrative.desc: "Argues by telling a small story."
traits.rhetorical_mode.polemic: "Polemic"
traits.rhetorical_mode.polemic.desc: "Attacks a position sharply and without hedging."
traits.rhetorical_mode.meditative: "Meditative"
traits.rhetorical_mode.meditative.desc: "Circles an idea slowly and lets the reader arrive."
traits.rhetorical_device.metaphor: "Metaphor"
traits.rhetorical_device.metaphor.desc: "Says one thing is another: 'memory is a sieve'."
traits.rhetorical_device.analogy: "Analogy"
traits.rhetorical_device.analogy.desc: "Explains by comparison: 'like a key in the wrong lock'."
traits.rhetorical_device.anaphora: "Anaphora"
traits.rhetorical_device.anaphora.desc: "Repeats the same opening: 'We ask. We doubt. We build.'"
traits.rhetorical_device.chiasmus: "Chiasmus"
traits.rhetorical_device.chiasmus.desc: "Mirrors a phrase: 'eat to live, not live to eat'."
traits.rhetorical_device.rhetorical_question: "Rhetorical question"
traits.rhetorical_device.rhetorical_question.desc: "Asks what needs no answer, to make a point."
traits.rhetorical_device.hyperbole: "Hyperbole"
traits.rhetorical_device.hyperbole.desc: "Exaggerates on purpose: 'a thousand arguments'."
traits.rhetorical_device.litotes: "Litotes"
traits.rhetorical_device.litotes.desc: "Understates by denying the opposite: 'not bad at all'."
traits.rhetorical_device.paradox: "Paradox"
traits.rhetorical_device.paradox.desc: "A truth that seems to contradict itself."
traits.rhetorical_device.irony: "Irony"
traits.rhetorical_device.irony.desc: "Means more, or the opposite, of what it says."
traits.rhetorical_device.antithesis: "Antithesis"
traits.rhetorical_device.antithesis.desc: "Sets opposites side by side: 'easy to say, hard to do'."
traits.rhetorical_device.alliteration: "Alliteration"
traits.rhetorical_device.alliteration.desc: "Repeats first sounds: 'silent, still, stone'."
traits.stylistic_school.plain: "Plain style"
traits.stylistic_school.plain.desc: "Clear, concrete and unadorned."
traits.stylistic_school.classical: "Classical"
traits.stylistic_school.classical.desc: "Balanced sentences, measured tone, decorum."
traits.stylistic_school.baroque: "Baroque"
traits.stylistic_school.baroque.desc: "Ornate, layered and gloriously extravagant."
traits.stylistic_school.romantic: "Romantic"
traits.stylistic_school.romantic.desc: "Feeling, nature and the sublime."
traits.stylistic_school.modernist: "Modernist"
traits.stylistic_school.modernist.desc: "Fragments, montage and shifting viewpoints."
traits.stylistic_school.minimalist: "Minimalist"
traits.stylistic_school.minimalist.desc: "Few words and a lot of white space."
traits.stylistic_school.surrealist: "Surrealist"
traits.stylistic_school.surrealist.desc: "Dream logic and strange juxtapositions."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Immersive, first-person and over the top."
traits.stylistic_school.academic: "Academic"
traits.stylistic_school.academic.desc: "Precise, hedged and referenced."
traits.semiotic_mode.symbolic: "Symbolic"
traits.semiotic_mode.symbolic.desc: "Plain words as ordinary signs."
traits.semiotic_mode.iconic: "Iconic"
traits.semiotic_mode.iconic.desc: "Signs that look like what they mean, such as drawings in text."
traits.semiotic_mode.indexical: "Indexical"
traits.semiotic_mode.indexical.desc: "Points at traces and clues: smoke means fire."
traits.semiotic_mode.glyph: "Glyphs and emoji"
traits.semiotic_mode.glyph.desc: "Lets symbols and emoji carry part of the meaning."
traits.semiotic_mode.meme: "Memes"
traits.semiotic_mode.meme.desc: "Plays with shared internet templates and formats."
traits.semiotic_mode.typographic: "Typography"
traits.semiotic_mode.typographic.desc: "Spacing, capitals and layout as part of the message."
traits.semiotic_mode.ellipsis: "Silence and ellipsis"
traits.semiotic_mode.ellipsis.desc: "Means most through what it leaves unsaid..."
traits.semiotic_mode.hashtag: "Hashtags"
traits.semiotic_mode.hashtag.desc: "Hashtags as compact signs and inside jokes."
traits.sentence_structure.simple: "Simple"
traits.sentence_structure.simple.desc: "One clause at a time. Short. Clear."
traits.sentence_structure.compound: "Compound"
traits.sentence_structure.compound.desc: "Clauses joined by and, but or so."
traits.sentence_structure.complex: "Complex"
traits.sentence_structure.complex.desc: "Main ideas with subordinate clauses that qualify them."
traits.sentence_structure.periodic: "Periodic"
traits.sentence_structure.periodic.desc: "Builds suspense and delivers the point at the end."
traits.sentence_structure.cumulative: "Cumulative"
traits.sentence_structure.cumulative.desc: "States the point first, then piles on details."
traits.sentence_structure.parallel: "Parallel"
traits.sentence_structure.parallel.desc: "Matching rhythms and repeated patterns."
traits.sentence_structure.fragmented: "Fragmented"
traits.sentence_structure.fragmented.desc: "Deliberate fragments. Like this. For effect."
traits.sentence_structure.stream_of_consciousness: "Stream of consciousness"
traits.sentence_structure.stream_of_consciousness.desc: "One long flowing run of thought."
traits.post_format.single_post: "Single post"
traits.post_format.single_post.desc: "One complete thought in one post."
traits.post_format.thread: "Mini-thread"
traits.post_format.thread.desc: "A numbered sequence: 1/ 2/ 3/."
traits.post_format.list: "List"
traits.post_format.list.desc: "A short list of points."
traits.post_format.dialogue: "Dialogue"
traits.post_format.dialogue.desc: "A tiny exchange between two voices."
traits.post_format.poem: "Poem"
traits.post_format.poem.desc: "A few lines of verse."
traits.post_format.question: "Question"
traits.post_format.question.desc: "An open question for the network."
traits.post_format.aphorism: "Aphorism"
traits.post_format.aphorism.desc: "One sharp, memorable sentence."
traits.post_format.field_note: "Field note"
traits.post_format.field_note.desc: "A dated observation, like a naturalist's notebook."
traits.lexical_field.nature: "Nature"
traits.lexical_field.nature.desc: "Weather, plants, animals and seasons."
