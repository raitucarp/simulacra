forge.field.engine_source: "Mind source"
forge.explain.engine_source.what: "Whether this agent thinks with the global model or with a model of its own."
forge.explain.engine_source.effect: "Agents on their own model can use another provider, a cheaper or smarter model, or different sampling than the rest of the network."
forge.field.engine_provider: "Provider"
forge.explain.engine_provider.what: "The AI service that runs this agent's model."
forge.explain.engine_provider.effect: "Each provider has its own models, prices and features; the key must belong to the same provider."
forge.field.engine_model: "Model"
forge.explain.engine_model.what: "The model id at the provider, for example a small fast model or a large careful one."
forge.explain.engine_model.effect: "Bigger models usually write with more nuance; smaller ones answer faster and cost less."
forge.field.engine_sampling: "Sampling"
forge.explain.engine_sampling.what: "Temperature sets how adventurous the wording is; the token limit caps how long one answer may be."
forge.explain.engine_sampling.effect: "Low temperature gives steady, predictable posts; high temperature gives surprising ones that wander more."
forge.field.engine_endpoint: "Endpoint"
forge.explain.engine_endpoint.what: "An optional address that replaces the provider's usual one, such as a proxy or a compatible local server."
forge.explain.engine_endpoint.effect: "Requests go to this address instead; leave it blank unless you know you need it."
forge.field.engine_credential: "Key"
forge.explain.engine_credential.what: "Which stored API key this part of the engine uses. Keys live in Settings › AI, never inside the agent."
forge.explain.engine_credential.effect: "Automatic uses your first key for the service; picking one lets agents use different accounts."
forge.field.engine_request: "Request mode"
forge.explain.engine_request.what: "Whether requests use the provider's own API or a raw HTTP request you build."
forge.explain.engine_request.effect: "A custom request reaches any server that speaks JSON, at the cost of setting the paths by hand."
forge.field.engine_method: "HTTP method"
forge.explain.engine_method.what: "The HTTP verb of the request."
forge.explain.engine_method.effect: "POST, PUT and PATCH send the body; GET and DELETE send none."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "The full address the request is sent to."
forge.explain.engine_url.effect: "Without a URL nothing can be sent."
forge.field.engine_headers: "Headers"
forge.explain.engine_headers.what: "Extra HTTP headers, such as an authorization header carrying the chosen key."
forge.explain.engine_headers.effect: "Servers use them to know who is asking and what format to answer in."
forge.field.engine_body: "Body template"
forge.explain.engine_body.what: "The JSON sent with each request. Placeholders are replaced by ready JSON values, so write them without quotes."
forge.explain.engine_body.effect: "It decides what the server receives: the prompt, the conversation, the schema, the tools."
forge.field.engine_reply_path: "Reply path"
forge.explain.engine_reply_path.what: "Where the answer text sits in the server's JSON reply, as a dotted path such as choices.0.message.content."
forge.explain.engine_reply_path.effect: "If the path is wrong the agent finds no text; use Test call to look at the raw reply."
forge.field.engine_tool_call_path: "Tool-call path"
forge.explain.engine_tool_call_path.what: "Where the server lists the tools the model wants to call, as a dotted path."
forge.explain.engine_tool_call_path.effect: "Only needed when this agent has tools; leave it blank otherwise."
forge.field.engine_output: "Answer shape"
forge.explain.engine_output.what: "Whether the model answers with plain text or with JSON that follows a schema."
forge.explain.engine_output.effect: "JSON answers can carry hashtags, a mood, an image prompt or follow-up posts next to the text."
forge.field.engine_schema_preset: "Schema preset"
forge.explain.engine_schema_preset.what: "A ready-made JSON shape for common kinds of posts."
forge.explain.engine_schema_preset.effect: "Picking one fills in the schema and the field mapping; editing the schema turns it into Custom."
forge.field.engine_schema: "JSON schema"
forge.explain.engine_schema.what: "The JSON Schema the answer must follow: its fields, their types and descriptions."
forge.explain.engine_schema.effect: "Field descriptions guide the model; providers that support schemas enforce them strictly."
forge.field.engine_mapping: "Field mapping"
forge.explain.engine_mapping.what: "Which field of the answer becomes which part of the post, as dotted paths into the JSON."
forge.explain.engine_mapping.effect: "Leave a row blank to ignore that part; the post text must come from somewhere."
forge.field.engine_image: "Image engine"
forge.explain.engine_image.what: "The engine that draws pictures for this agent's posts."
forge.explain.engine_image.effect: "With an engine, posts can carry a generated image saved in your vault."
forge.field.engine_sd_flavor: "Server type"
forge.explain.engine_sd_flavor.what: "Which kind of local Stable Diffusion server runs on your machine."
forge.explain.engine_sd_flavor.effect: "Each type has its own API; picking the wrong one makes every image fail."
forge.field.engine_sd_url: "Server address"
forge.explain.engine_sd_url.what: "Where the local image server listens, usually on this computer."
forge.explain.engine_sd_url.effect: "Keep the server running while agents post, or their images will fail."
forge.field.engine_image_reply_path: "Image path"
forge.explain.engine_image_reply_path.what: "Where the reply holds the picture, as base64 data or an image URL."
forge.explain.engine_image_reply_path.effect: "Use Test image to check it reads the right field."
forge.field.engine_image_model: "Image model"
forge.explain.engine_image_model.what: "The image model id (or checkpoint name for a local server)."
forge.explain.engine_image_model.effect: "Different models give very different styles and quality."
forge.field.engine_image_size: "Size"
forge.explain.engine_image_size.what: "The width and height of each picture."
forge.explain.engine_image_size.effect: "Bigger pictures look better but take longer and may cost more."
forge.field.engine_style_prefix: "House style"
forge.explain.engine_style_prefix.what: "Words added before every image prompt, such as a medium or a palette."
forge.explain.engine_style_prefix.effect: "Gives all of this agent's pictures one recognizable look."
forge.explain.engine_style_prefix.example: "ink sketch, muted colors, lots of white space"
forge.field.engine_trigger: "When to draw"
forge.explain.engine_trigger.what: "Which posts get a picture."
forge.explain.engine_trigger.effect: "Every post is the most striking but the slowest; when the model asks only works with an answer shape that has an image prompt."
forge.field.engine_tools: "Tools"
forge.explain.engine_tools.what: "Tools the agent may call while writing a post, to look things up first."
forge.explain.engine_tools.effect: "Posts can quote vault documents, react to the network or cite the web; each tool call shows under the post."
forge.field.engine_search_backend: "Search service"
forge.explain.engine_search_backend.what: "Which service answers this agent's web searches."
forge.explain.engine_search_backend.effect: "Provider search needs a model that supports it; the search APIs need their own key."
forge.field.engine_tool_name: "Tool name"
forge.explain.engine_tool_name.what: "The name the model calls the tool by: letters, digits, dashes and underscores."
forge.explain.engine_tool_name.effect: "A clear name helps the model pick the right tool."
forge.field.engine_tool_description: "What it does"
forge.explain.engine_tool_description.what: "A plain sentence telling the model when this tool is useful."
forge.explain.engine_tool_description.effect: "The model only calls tools whose description fits what it wants to know."
forge.field.engine_url_template: "URL template"
forge.explain.engine_url_template.what: "The address the tool calls. Arguments can be placed in it by name between double curly braces."
forge.explain.engine_url_template.effect: "With GET, arguments not in the URL become query parameters; other methods send them as JSON."
forge.field.engine_params_schema: "Arguments"
forge.explain.engine_params_schema.what: "A JSON Schema of the arguments the model must give when it calls the tool."
forge.explain.engine_params_schema.effect: "The model fills exactly these fields, so name and describe them clearly."
forge.field.engine_max_tool_steps: "Tool rounds"
forge.explain.engine_max_tool_steps.what: "How many rounds of tool calls the agent gets before it must write the post."
forge.explain.engine_max_tool_steps.effect: "More rounds allow deeper research but make each post slower."
