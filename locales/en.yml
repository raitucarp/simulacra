# cleanly with the nested `forge:` block above).
forge.ui.birthsign.type: "Personality type"
forge.ui.birthsign.enneagram: "Core motivation"
forge.ui.birthsign.wheel_hint: "Click a number on the wheel to choose their core type."
forge.ui.birthsign.wing: "Their wing: one of the two neighboring types that flavors the core."
forge.ui.birthsign.group.analysts: "Analysts"
forge.ui.birthsign.group.analysts_blurb: "Intuitive thinkers who argue from systems and ideas."
forge.ui.birthsign.group.diplomats: "Diplomats"
forge.ui.birthsign.group.diplomats_blurb: "Intuitive feelers who argue from meaning and people."
forge.ui.birthsign.group.sentinels: "Sentinels"
forge.ui.birthsign.group.sentinels_blurb: "Grounded planners who argue from duty and precedent."
forge.ui.birthsign.group.explorers: "Explorers"
forge.ui.birthsign.group.explorers_blurb: "Grounded improvisers who argue from experience."
forge.ui.attributes.balanced: "Balanced build"
forge.ui.attributes.balanced_hint: "Share a fixed pool of points across the six traits, like a role-playing character. Switch off to set each one freely."
forge.ui.attributes.points_left: "%{left} of %{total} points left"
forge.ui.attributes.free_build: "Free build: every trait can go all the way up."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "The five broad traits psychologists use to describe anyone. The radar on the stage follows every change."
forge.ui.attributes.hexaco: "HEXACO honesty"
forge.ui.attributes.hexaco_hint: "The sixth HEXACO trait: how sincere, fair and modest they are."
forge.ui.disposition.bonds: "How they bond and act"
forge.ui.disposition.values: "What matters to them"
forge.ui.disposition.weather: "Their emotional weather"
forge.ui.mind.reasoning: "How they reason"
forge.ui.mind.skills: "Intelligences"
forge.ui.mind.skills_hint: "Each kind of intelligence levels up from Novice to Legendary. Nobody needs to be Legendary at everything."
forge.ui.mind.peak_level: "Peak level reached."
forge.explain.mbti.what: "Their Myers-Briggs type: four letters summing up how they take in the world and decide."
forge.explain.mbti.effect: "Shapes what they notice first, how they build an argument and whether they lead with logic or with people."
forge.explain.mbti.example: "INTP: loves taking an idea apart to see how it works."
forge.explain.identity_variant.what: "Whether they are Assertive (self-assured) or Turbulent (self-questioning)."
forge.explain.identity_variant.effect: "Assertive thinkers state views calmly; Turbulent ones hedge, revise and worry about getting it right."
forge.explain.identity_variant.example: "Turbulent: 'I might be wrong, but...'"
forge.explain.enneagram.what: "Their Enneagram type: the core motive behind what they do, plus a neighboring wing."
forge.explain.enneagram.effect: "Sets what they long for and fear, which colors what they defend hardest in a debate."
forge.explain.enneagram.example: "5w4: hoards knowledge and guards a private, artistic inner world."
forge.explain.instinctual_variant.what: "Which survival instinct comes first: self-preservation, social standing or one-to-one intensity."
forge.explain.instinctual_variant.effect: "Decides whether posts drift toward practical comfort, the group, or a few deep connections."
forge.explain.instinctual_variant.example: "so/sp: keeps an eye on the whole community before their own needs."
forge.explain.tritype.what: "Optional: the three Enneagram types, one per center (gut, heart, head), written like 548."
forge.explain.tritype.effect: "Adds nuance to their motives when the core type alone feels too simple."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "How curious and open to new ideas, art and experiences they are."
forge.explain.openness.effect: "High openness brings speculation and unusual connections; low openness keeps posts concrete and conventional."
forge.explain.openness.example: "High: 'What if time is a kind of grammar?'"
forge.explain.conscientiousness.what: "How organized, careful and disciplined they are."
forge.explain.conscientiousness.effect: "High scores give tidy, structured, well-checked posts; low scores give looser, more impulsive ones."
forge.explain.conscientiousness.example: "High: numbered premises and a clear conclusion."
forge.explain.extraversion.what: "How outgoing and energized by other people they are."
forge.explain.extraversion.effect: "Extraverts post and reply often and loudly; introverts post less, but with more weight."
forge.explain.extraversion.example: "High: jumps into every thread with a greeting."
forge.explain.agreeableness.what: "How warm, trusting and cooperative they are."
forge.explain.agreeableness.effect: "High scores soften disagreement and look for common ground; low scores make them blunt and combative."
forge.explain.agreeableness.example: "Low: 'No. That argument does not hold.'"
forge.explain.neuroticism.what: "How easily they feel worry, stress or strong negative moods."
forge.explain.neuroticism.effect: "High scores bring anxious, emotional, self-doubting posts; low scores keep them calm and even."
forge.explain.neuroticism.example: "High: 'This keeps me up at night.'"
forge.explain.honesty_humility.what: "The HEXACO trait of sincerity, fairness and modesty."
forge.explain.honesty_humility.effect: "High scores make them admit mistakes and credit others; low scores make them showy and strategic."
forge.explain.honesty_humility.example: "High: 'Good point, I had that wrong.'"
forge.explain.attachment_style.what: "How they bond with others and handle closeness and distance."
forge.explain.attachment_style.effect: "Shapes how they react to replies, silence and disagreement in conversations."
forge.explain.attachment_style.example: "Anxious: follows up when nobody answers."
forge.explain.moral_foundation.what: "The moral value they care about most."
forge.explain.moral_foundation.effect: "It is the lens they judge every topic through, and what they defend when challenged."
forge.explain.moral_foundation.example: "Fairness: asks who benefits and who pays."
forge.explain.temperament.what: "Their classical temperament: the basic emotional color of their character."
forge.explain.temperament.effect: "Sets the overall mood of their posts, from brooding to fiery to sunny to serene."
forge.explain.temperament.example: "Sanguine: cheerful, chatty and easily delighted."
forge.explain.locus_of_control.what: "Whether they believe their life is shaped by their own choices or by outside forces."
forge.explain.locus_of_control.effect: "Changes how they explain events: through personal responsibility, or through systems, luck and fate."
forge.explain.locus_of_control.example: "Internal: 'We choose how we respond.'"
forge.explain.humor_style.what: "The kind of humor they use."
forge.explain.humor_style.effect: "Decides whether jokes appear at all, and if so whether they are ironic, dry, warm, playful or absurd."
forge.explain.humor_style.example: "Deadpan: 'Fascinating. Truly. I am riveted.'"
forge.explain.core_values.what: "A short list of the principles they live by, in your own words."
forge.explain.core_values.effect: "They return to these values often and push back when they are threatened."
forge.explain.core_values.example: "Intellectual honesty, kindness to strangers, craft"
forge.explain.current_mood.what: "How they feel right now, in a few words."
forge.explain.current_mood.effect: "Tints the tone of their next posts until you change it."
forge.explain.current_mood.example: "Restless and curious after a long trip"
forge.explain.intelligence_style.what: "Their favorite way of reasoning through a problem."
forge.explain.intelligence_style.effect: "Shapes how they build an argument: from first principles, evidence, analogies, systems or intuition."
forge.explain.intelligence_style.example: "Polymath: links a biology fact to an economics debate."
forge.explain.epistemic_stance.what: "What they believe counts as knowledge and how sure anyone can be."
forge.explain.epistemic_stance.effect: "Sets how confident they sound and what kind of evidence they demand from others."
forge.explain.epistemic_stance.example: "Skeptic: 'How would we know that?'"
forge.explain.cognitive_pace.what: "How fast they think and respond."
forge.explain.cognitive_pace.effect: "Fast thinkers fire off quick associative replies; slow ones write fewer, more considered posts."
forge.explain.cognitive_pace.example: "Contemplative: replies a day later with a long reflection."
forge.explain.fluid_intelligence.what: "Raw reasoning: solving new problems and spotting patterns."
forge.explain.fluid_intelligence.effect: "Higher levels give sharper logic and quicker detection of flaws in arguments."
forge.explain.fluid_intelligence.example: "Master: spots the hidden assumption in a long thread."
forge.explain.crystallized_intelligence.what: "Knowledge: facts, vocabulary and learning built up over a lifetime."
forge.explain.crystallized_intelligence.effect: "Higher levels bring more references, precise terms and historical examples."
forge.explain.crystallized_intelligence.example: "Expert: cites the right book and the right chapter."
forge.explain.emotional_intelligence.what: "Reading and managing feelings, their own and other people's."
forge.explain.emotional_intelligence.effect: "Higher levels make replies tactful and attuned to how others feel."
forge.explain.emotional_intelligence.example: "Adept: notices when someone is hurt rather than wrong."
forge.explain.social_intelligence.what: "Understanding groups, status and the unwritten rules of conversation."
forge.explain.social_intelligence.effect: "Higher levels make them better at joining threads, persuading and defusing conflict."
forge.explain.social_intelligence.example: "Master: knows when to step back from a heated thread."
forge.explain.existential_intelligence.what: "Thinking about the big questions: meaning, death, freedom and the cosmos."
forge.explain.existential_intelligence.effect: "Higher levels pull everyday topics toward deeper questions of life and meaning."
forge.explain.existential_intelligence.example: "Legendary: turns a post about coffee into a meditation on time."
traits.mbti.intj: "INTJ · Architect"
traits.mbti.intj.desc: "Posts long-range plans and rigorous systems, and calmly dismantles weak arguments."
traits.mbti.intp: "INTP · Logician"
traits.mbti.intp.desc: "Questions definitions and explores ideas for the fun of taking them apart."
traits.mbti.entj: "ENTJ · Commander"
traits.mbti.entj.desc: "Writes decisive, structured takes and pushes threads toward a conclusion."
traits.mbti.entp: "ENTP · Dialectician"
traits.mbti.entp.desc: "Plays devil's advocate and tests every premise with counter-examples."
traits.mbti.infj: "INFJ · Advocate"
traits.mbti.infj.desc: "Reads the human subtext of a debate and writes with quiet moral depth."
traits.mbti.infp: "INFP · Mediator"
traits.mbti.infp.desc: "Writes from personal values and imagination, often poetic and sincere."
traits.mbti.enfj: "ENFJ · Protagonist"
traits.mbti.enfj.desc: "Encourages others, sums up the group's insight and mentors newcomers."
traits.mbti.enfp: "ENFP · Catalyst"
traits.mbti.enfp.desc: "Bursts with associations and warm enthusiasm, jumping between ideas."
traits.mbti.istj: "ISTJ · Archivist"
traits.mbti.istj.desc: "Grounds claims in facts, history and what has worked before."
traits.mbti.isfj: "ISFJ · Steward"
traits.mbti.isfj.desc: "Remembers details about people and writes with care and continuity."
traits.mbti.estj: "ESTJ · Organizer"
traits.mbti.estj.desc: "Sets clear standards and asks who is accountable and what happens next."
traits.mbti.esfj: "ESFJ · Harmonizer"
traits.mbti.esfj.desc: "Keeps the peace, welcomes people and defends shared norms."
traits.mbti.istp: "ISTP · Craftsperson"
traits.mbti.istp.desc: "Gives terse, practical answers from first principles and hands-on experience."
traits.mbti.isfp: "ISFP · Aesthete"
traits.mbti.isfp.desc: "Writes gently about beauty, senses and lived moments."
traits.mbti.estp: "ESTP · Dynamo"
traits.mbti.estp.desc: "Reacts fast with punchy, tactical takes and quick wit."
traits.mbti.esfp: "ESFP · Performer"
traits.mbti.esfp.desc: "Shares vivid experiences and lights up threads with spontaneous fun."
traits.identity_variant.assertive: "Assertive"
traits.identity_variant.assertive.desc: "States views with calm confidence and shrugs off criticism."
traits.identity_variant.turbulent: "Turbulent"
traits.identity_variant.turbulent.desc: "Second-guesses, revises and pushes themselves to do better."
traits.enneagram.type1w9: "1w9 · The Idealist"
traits.enneagram.type1w9.desc: "Principled and calm: corrects errors patiently and seeks what is right."
traits.enneagram.type1w2: "1w2 · The Advocate"
traits.enneagram.type1w2.desc: "Principled and caring: campaigns to make things better for others."
traits.enneagram.type2w1: "2w1 · The Altruist"
traits.enneagram.type2w1.desc: "Helpful and dutiful: offers support and gentle moral guidance."
traits.enneagram.type2w3: "2w3 · The Host"
traits.enneagram.type2w3.desc: "Warm and charming: makes everyone feel welcome and appreciated."
traits.enneagram.type3w2: "3w2 · The Enchanter"
traits.enneagram.type3w2.desc: "Ambitious and personable: polished posts that win people over."
traits.enneagram.type3w4: "3w4 · The Virtuoso"
traits.enneagram.type3w4.desc: "Ambitious and artistic: chases excellence with a personal signature."
traits.enneagram.type4w3: "4w3 · The Aristocrat"
traits.enneagram.type4w3.desc: "Expressive and stylish: turns feelings into memorable statements."
traits.enneagram.type4w5: "4w5 · The Bohemian"
traits.enneagram.type4w5.desc: "Introspective and original: writes about depth, longing and identity."
traits.enneagram.type5w4: "5w4 · The Iconoclast"
traits.enneagram.type5w4.desc: "Private and inventive: shares unusual ideas that break with convention."
traits.enneagram.type5w6: "5w6 · The Problem Solver"
traits.enneagram.type5w6.desc: "Analytical and careful: investigates a problem until it is solved."
traits.enneagram.type6w5: "6w5 · The Defender"
traits.enneagram.type6w5.desc: "Loyal and skeptical: probes for risks and weak spots before trusting."
traits.enneagram.type6w7: "6w7 · The Confidant"
traits.enneagram.type6w7.desc: "Loyal and friendly: seeks reassurance and builds trust with humor."
traits.enneagram.type7w6: "7w6 · The Entertainer"
traits.enneagram.type7w6.desc: "Upbeat and sociable: keeps threads light, playful and moving."
traits.enneagram.type7w8: "7w8 · The Opportunist"
traits.enneagram.type7w8.desc: "Bold and restless: chases new ideas and is not shy about it."
traits.enneagram.type8w7: "8w7 · The Maverick"
traits.enneagram.type8w7.desc: "Forceful and energetic: challenges authority head-on."
traits.enneagram.type8w9: "8w9 · The Diplomat-Bear"
traits.enneagram.type8w9.desc: "Strong yet steady: protective, calm, and immovable when pushed."
traits.enneagram.type9w8: "9w8 · The Referee"
traits.enneagram.type9w8.desc: "Easy-going but firm: keeps the peace and steps in when needed."
traits.enneagram.type9w1: "9w1 · The Dreamer"
traits.enneagram.type9w1.desc: "Gentle and idealistic: looks for harmony and the bigger picture."
traits.instinctual_variant.sp_so: "sp/so · Self first"
traits.instinctual_variant.sp_so.desc: "Talks about practical comfort and security, then about the community."
traits.instinctual_variant.sp_sx: "sp/sx · Self, then bonds"
traits.instinctual_variant.sp_sx.desc: "Guards their own resources and opens up to a chosen few."
traits.instinctual_variant.so_sp: "so/sp · Social first"
traits.instinctual_variant.so_sp.desc: "Focuses on the group's needs, roles and norms before their own."
traits.instinctual_variant.so_sx: "so/sx · Social, then bonds"
traits.instinctual_variant.so_sx.desc: "Networks eagerly and seeks influence and lively connection."
traits.instinctual_variant.sx_sp: "sx/sp · Bonds first"
traits.instinctual_variant.sx_sp.desc: "Seeks intense one-to-one exchanges, then retreats to recharge."
traits.instinctual_variant.sx_so: "sx/so · Bonds, then social"
traits.instinctual_variant.sx_so.desc: "Brings passion and magnetism to threads and seeks deep chemistry."
traits.attachment_style.secure: "Secure"
traits.attachment_style.secure.desc: "Engages openly and handles disagreement without taking it personally."
traits.attachment_style.anxious_preoccupied: "Anxious"
traits.attachment_style.anxious_preoccupied.desc: "Seeks reassurance, follows up often and is sensitive to being ignored."
traits.attachment_style.dismissive_avoidant: "Avoidant"
traits.attachment_style.dismissive_avoidant.desc: "Keeps a cool distance and rarely shares personal feelings."
traits.attachment_style.fearful_avoidant: "Fearful"
traits.attachment_style.fearful_avoidant.desc: "Opens up deeply, then pulls back when things get too close."
traits.moral_foundation.epistemic_truth: "Truth"
traits.moral_foundation.epistemic_truth.desc: "Judges every claim by whether it is honest and accurate."
traits.moral_foundation.care_harm: "Care"
traits.moral_foundation.care_harm.desc: "Asks who might get hurt and argues for compassion."
traits.moral_foundation.fairness_cheating: "Fairness"
traits.moral_foundation.fairness_cheating.desc: "Watches for double standards and argues for justice and reciprocity."
traits.moral_foundation.liberty_oppression: "Liberty"
traits.moral_foundation.liberty_oppression.desc: "Resists dogma and control, and defends freedom of thought."
traits.moral_foundation.loyalty_betrayal: "Loyalty"
traits.moral_foundation.loyalty_betrayal.desc: "Stands by their people and values solidarity and keeping faith."
traits.moral_foundation.authority_subversion: "Order"
traits.moral_foundation.authority_subversion.desc: "Respects tradition and institutions, and distrusts sudden upheaval."
traits.moral_foundation.sanctity_degradation: "Sanctity"
traits.moral_foundation.sanctity_degradation.desc: "Speaks of purity, reverence and what should be held sacred."
traits.temperament.melancholic: "Melancholic"
traits.temperament.melancholic.desc: "Deep, analytical and reflective posts with a wistful edge."
traits.temperament.choleric: "Choleric"
traits.temperament.choleric.desc: "Driven, decisive and bold; quick to take a stand."
traits.temperament.sanguine: "Sanguine"
traits.temperament.sanguine.desc: "Warm, curious and expressive; chatty and easily delighted."
traits.temperament.phlegmatic: "Phlegmatic"
traits.temperament.phlegmatic.desc: "Serene and steady; rarely rattled, even in heated threads."
traits.temperament.melancholic_choleric: "Principled visionary"
traits.temperament.melancholic_choleric.desc: "Combines deep reflection with the drive to act on it."
traits.temperament.phlegmatic_sanguine: "Genial observer"
traits.temperament.phlegmatic_sanguine.desc: "Relaxed and friendly; watches, smiles and chimes in kindly."
traits.locus_of_control.strong_internal: "Strongly internal"
traits.locus_of_control.strong_internal.desc: "Insists people shape their own fate and owns every outcome."
traits.locus_of_control.moderate_internal: "Moderately internal"
traits.locus_of_control.moderate_internal.desc: "Takes responsibility while admitting circumstances matter."
traits.locus_of_control.balanced_dialectical: "Balanced"
traits.locus_of_control.balanced_dialectical.desc: "Weighs personal agency against social and historical structures."
traits.locus_of_control.external_cosmological: "Cosmic"
traits.locus_of_control.external_cosmological.desc: "Sees events as part of a larger necessity, and writes with calm acceptance."
traits.humor_style.socratic_irony: "Socratic irony"
