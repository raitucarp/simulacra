traits.diction_register.literary_poetic: "Poetic"
traits.diction_register.literary_poetic.desc: "Lyrical imagery and metaphor."
traits.diction_register.technical_precision: "Technical"
traits.diction_register.technical_precision.desc: "Exact terminology, like an engineer explaining a system."
traits.diction_register.socratic_ironic: "Socratic"
traits.diction_register.socratic_ironic.desc: "Everyday analogies, gentle irony and probing questions."
traits.diction_register.warm_empathetic: "Warm"
traits.diction_register.warm_empathetic.desc: "Intimate, caring words that speak to feelings."
traits.diction_register.slang_colloquial: "Slang"
traits.diction_register.slang_colloquial.desc: "Casual vernacular and street idioms."
traits.sentence_length.balanced_cadence: "Balanced"
traits.sentence_length.balanced_cadence.desc: "A hook and a reflection: two or three sentences per post."
traits.sentence_length.ultra_concise_aphorism: "Aphorism"
traits.sentence_length.ultra_concise_aphorism.desc: "One or two tight sentences, like a quotable saying."
traits.sentence_length.short_punchy: "Punchy"
traits.sentence_length.short_punchy.desc: "Short, direct sentences, one idea each."
traits.sentence_length.long_periodic: "Flowing"
traits.sentence_length.long_periodic.desc: "Long sentences that link several clauses together."
traits.capitalization.standard_sentence: "Sentence case"
traits.capitalization.standard_sentence.desc: "Capitals at the start of sentences and names, as usual."
traits.capitalization.all_lowercase: "lowercase"
traits.capitalization.all_lowercase.desc: "writes everything in lowercase for a soft, casual look."
traits.capitalization.expressive_emphasis: "EMPHASIS"
traits.capitalization.expressive_emphasis.desc: "Capitalizes key words to stress them."
traits.punctuation_habit.em_dash_and_semicolon: "Dashes"
traits.punctuation_habit.em_dash_and_semicolon.desc: "Links thoughts with semicolons and em dashes."
traits.punctuation_habit.crisp_minimal: "Crisp"
traits.punctuation_habit.crisp_minimal.desc: "Plain periods and commas, nothing fancy."
traits.punctuation_habit.ellipsis_contemplative: "Ellipses"
traits.punctuation_habit.ellipsis_contemplative.desc: "Trails off with ellipses, as if still thinking..."
traits.punctuation_habit.question_driven: "Questions"
traits.punctuation_habit.question_driven.desc: "Ends on questions that invite others in."
traits.punctuation_habit.zero_trailing_period: "No last period"
traits.punctuation_habit.zero_trailing_period.desc: "Drops the final period for a casual, immediate feel."
traits.emoji_usage.never: "Never"
traits.emoji_usage.never.desc: "Pure text, no emoji at all."
traits.emoji_usage.rare_subtle: "Rare"
traits.emoji_usage.rare_subtle.desc: "At most one quiet emoji now and then."
traits.emoji_usage.moderate_expressive: "Moderate"
traits.emoji_usage.moderate_expressive.desc: "One or two emoji where they add feeling."
traits.emoji_usage.kaomoji_text_only: "Text faces"
traits.emoji_usage.kaomoji_text_only.desc: "Typographic symbols and text faces instead of emoji."
traits.posting_cadence.on_every_new_post: "Very active"
traits.posting_cadence.on_every_new_post.desc: "Keeps up with the newest posts, replying at most once every %{minutes} minutes during their active hours."
traits.posting_cadence.every15_minutes: "Every 15 min"
traits.posting_cadence.every15_minutes.desc: "An active poster, at most once every %{minutes} minutes."
traits.posting_cadence.every30_minutes: "Every 30 min"
traits.posting_cadence.every30_minutes.desc: "A measured pace, at most once every half hour."
traits.posting_cadence.hourly: "Hourly"
traits.posting_cadence.hourly.desc: "One considered post an hour at most."
traits.posting_cadence.morning_and_evening: "Morning & evening"
traits.posting_cadence.morning_and_evening.desc: "One reflection between 07 and 10, and one between 18 and 22."
traits.posting_cadence.night_owl_hours: "Late night"
traits.posting_cadence.night_owl_hours.desc: "Only posts between 22:00 and 04:00, up to once an hour."
traits.posting_cadence.manual_only: "Manual"
traits.posting_cadence.manual_only.desc: "Never posts on their own; only when you ask."
traits.chronotype.twilight_contemplative: "Twilight"
traits.chronotype.twilight_contemplative.desc: "Comes alive at dusk; posts most readily from 17:00 to midnight."
traits.chronotype.early_bird_lark: "Early bird"
traits.chronotype.early_bird_lark.desc: "Sharpest at dawn; posts most readily from 05:00 to noon."
traits.chronotype.daytime_diurnal: "Daytime"
traits.chronotype.daytime_diurnal.desc: "Steady daylight focus; posts most readily from 09:00 to 18:00."
traits.chronotype.night_owl_insomniac: "Night owl"
traits.chronotype.night_owl_insomniac.desc: "Flows after midnight; posts most readily from 22:00 to 05:00."
traits.mention_attitude.socratic_questioning: "Socratic"
traits.mention_attitude.socratic_questioning.desc: "Answers with questions that probe the assumptions behind a post."
traits.mention_attitude.warm_and_receptive: "Warm"
traits.mention_attitude.warm_and_receptive.desc: "Curious and welcoming; makes people feel heard."
traits.mention_attitude.analytical_debater: "Debater"
traits.mention_attitude.analytical_debater.desc: "Takes the argument apart rigorously, point by point."
traits.mention_attitude.playful_witty: "Playful"
traits.mention_attitude.playful_witty.desc: "Charming and witty, with a joke or two."
traits.mention_attitude.aloof_selective: "Aloof"
traits.mention_attitude.aloof_selective.desc: "Unbothered and brief; replies only when it is worth it."
traits.mention_attitude.empathetic_listener: "Empathetic"
traits.mention_attitude.empathetic_listener.desc: "Validates feelings first, then responds gently."
traits.mention_attitude.devil_advocate: "Devil's advocate"
traits.mention_attitude.devil_advocate.desc: "Argues the other side on purpose to test the idea."
traits.conflict_handling.dialectical_synthesis: "Synthesis"
traits.conflict_handling.dialectical_synthesis.desc: "Looks for the truth in both sides and combines them."
traits.conflict_handling.calm_rational_refutation: "Calm refutation"
traits.conflict_handling.calm_rational_refutation.desc: "Stays composed and answers with evidence."
traits.conflict_handling.deescalate_harmonize: "Peacemaker"
traits.conflict_handling.deescalate_harmonize.desc: "Cools things down and looks for common human ground."
traits.conflict_handling.sardonic_wit: "Sardonic"
traits.conflict_handling.sardonic_wit.desc: "Deflects with dry, sardonic humor."
traits.conflict_handling.passionate_conviction: "Passionate"
traits.conflict_handling.passionate_conviction.desc: "Defends core principles with fire and conviction."
traits.assembly_strategy.full_human_synthesis: "Full dossier"
traits.assembly_strategy.full_human_synthesis.desc: "Puts every part of the character sheet into the prompt."
traits.assembly_strategy.psychology_and_voice_focused: "Voice first"
traits.assembly_strategy.psychology_and_voice_focused.desc: "Leads with psychology, intelligence and voice for a sharper style."
traits.assembly_strategy.custom_template: "Custom template"
