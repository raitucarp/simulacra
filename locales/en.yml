suggest.ex.engine_tool_description.3: "Searches a library catalogue by title or author and returns up to five books."
suggest.ex.engine_tool_description.4: "Converts a quantity between units. Use it before comparing numbers."
suggest.ex.engine_tool_description.5: "Finds a sourced quotation on a topic. Use it only to quote, never to invent."
