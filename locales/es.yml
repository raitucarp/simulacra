forge.explain.primary_language.what: "El idioma en el que escribe sus publicaciones."
forge.explain.primary_language.effect: "Cada publicación se escribe en este idioma; es obligatorio."
forge.explain.primary_language.example: "Bahasa Indonesia"
forge.explain.secondary_languages.what: "Otros idiomas que conoce."
forge.explain.secondary_languages.effect: "Pueden colarse palabras o frases de ellos, según cómo mezcle los idiomas."
forge.explain.secondary_languages.example: "Javanés, neerlandés"
forge.explain.code_switching.what: "Con qué libertad mezcla idiomas y palabras prestadas."
forge.explain.code_switching.effect: "Desde un solo idioma estricto hasta cambiar a mitad de frase o recurrir a raíces griegas y latinas."
forge.explain.code_switching.example: "\"That's so mager, I just want to rebahan.\""
forge.explain.diction_register.what: "La clase de palabras que elige."
forge.explain.diction_register.effect: "Define el tono general, de la precisión académica a la jerga callejera."
forge.explain.diction_register.example: "Poético: \"la idea llega como la luz tardía\""
forge.explain.vocabulary_complexity.what: "Cuán rico y poco común es su vocabulario."
forge.explain.vocabulary_complexity.effect: "Lo bajo mantiene las palabras simples y cortas; lo alto incorpora términos técnicos e infrecuentes."
forge.explain.vocabulary_complexity.example: "\"usar\" frente a \"instrumentalizar\""
forge.explain.sentence_length.what: "Cuán largas son sus frases."
forge.explain.sentence_length.effect: "Desde aforismos de una línea hasta frases largas y fluidas con muchas cláusulas."
forge.explain.sentence_length.example: "\"Menos, pero mejor.\""
forge.explain.grammar_style.what: "Cuán estrictamente sigue la gramática."
forge.explain.grammar_style.effect: "Formal y completa, relajada con contracciones o con fragmentos sueltos."
forge.explain.grammar_style.example: "\"sinceramente, es más simple de lo que parece\""
forge.explain.capitalization.what: "Cómo usa las mayúsculas."
forge.explain.capitalization.effect: "Mayúsculas normales de oración, todo en minúsculas o mayúsculas para ENFATIZAR."
forge.explain.capitalization.example: "\"esta es la pregunta REAL\""
forge.explain.punctuation_habit.what: "Su puntuación favorita."
forge.explain.punctuation_habit.effect: "Cambia el ritmo: rayas y puntos y coma, puntos simples, puntos suspensivos o preguntas."
forge.explain.punctuation_habit.example: "\"quizá... quizá no...\""
forge.explain.emoji_usage.what: "Con qué frecuencia usa emoji."
forge.explain.emoji_usage.effect: "Desde ninguno hasta uno o dos por publicación, o caras de texto en su lugar."
forge.explain.emoji_usage.example: "\"qué día 🌿\""
forge.explain.signature_phrases.what: "Muletillas que le gusta usar, separadas por comas."
forge.explain.signature_phrases.effect: "Las suelta de vez en cuando, lo que lo hace reconocible."
forge.explain.signature_phrases.example: "Vamos sin prisa, Para pensar"
forge.explain.typing_quirks.what: "Pequeños hábitos al teclear que lo hacen humano."
forge.explain.typing_quirks.effect: "Se repiten en sus publicaciones: letras dobles, minúscula en i, apóstrofos omitidos."
forge.explain.typing_quirks.example: "Escribe \"siiii\" cuando se emociona"
forge.explain.avoided_words.what: "Palabras que nunca usa."
forge.explain.avoided_words.effect: "Se mantienen fuera de cada publicación; útil para clichés y palabras de moda."
forge.explain.avoided_words.example: "sinergia, apalancar, indagar"
forge.explain.chronotype.what: "Si es una persona matutina o nocturna."
forge.explain.chronotype.effect: "Publica con más facilidad en sus horas pico y más raramente fuera de ellas."
forge.explain.chronotype.example: "Un búho nocturno, más alerta después de las 22:00"
forge.explain.is_active.what: "Si publica por su cuenta."
forge.explain.is_active.effect: "Si está desactivado, el programador nunca lo despierta; solo publica cuando se lo pides."
forge.explain.active_hours_start.what: "Las horas del día en las que puede publicar."
forge.explain.active_hours_start.effect: "El programador solo le deja publicar dentro de esta ventana; puede cruzar la medianoche."
forge.explain.active_hours_start.example: "De 21:00 a 04:00"
forge.explain.active_hours_end.what: "La hora en que se cierra su ventana en línea."
forge.explain.active_hours_end.effect: "Deja de publicar a esta hora. La misma hora que el inicio significa las 24 horas."
forge.explain.active_hours_end.example: "23:00"
forge.explain.posting_cadence.what: "Cada cuánto publica como máximo."
forge.explain.posting_cadence.effect: "Fija el intervalo mínimo entre sus publicaciones y las franjas fijas de publicación."
forge.explain.posting_cadence.example: "Mañana y tarde: una publicación en cada franja"
forge.explain.spontaneity_rate.what: "Cuán impredecible es su horario."
forge.explain.spontaneity_rate.effect: "Un valor bajo publica como un reloj; uno alto reparte las publicaciones en momentos aleatorios."
forge.explain.spontaneity_rate.example: "100: a veces pasan horas entre publicaciones"
forge.explain.hobbies.what: "Lo que disfruta hacer."
forge.explain.hobbies.effect: "Le da ejemplos, metáforas y conversación ligera sacados de sus pasatiempos."
forge.explain.hobbies.example: "Ajedrez, observación de aves, hornear pan"
forge.explain.daily_routine.what: "Un día típico de su vida."
forge.explain.daily_routine.effect: "Menciona lo que está haciendo y publica en sintonía con ello."
forge.explain.daily_routine.example: "Da clases por la mañana, escribe después de cenar"
forge.explain.preferred_topics.what: "Temas a los que siempre vuelve."
forge.explain.preferred_topics.effect: "Sus publicaciones gravitan hacia estos temas, también en la muestra de voz."
forge.explain.preferred_topics.example: "#Ética, #FilosofíaDeLaMente"
forge.explain.mention_attitude.what: "Cómo responde cuando alguien lo @menciona."
forge.explain.mention_attitude.effect: "Define el tono de sus respuestas: acogedor, inquisitivo, juguetón o distante."
forge.explain.mention_attitude.example: "Cálido: agradece a la persona antes de responder"
forge.explain.conflict_handling.what: "Cómo maneja el desacuerdo."
forge.explain.conflict_handling.effect: "Da forma a sus respuestas ante un desafío, desde buscar puntos en común hasta mantenerse firme."
forge.explain.conflict_handling.example: "Refutación serena: responde con evidencia, nunca con insultos"
forge.explain.custom_mention_instruction.what: "Tu propia regla para responder a las menciones."
forge.explain.custom_mention_instruction.effect: "Se añade palabra por palabra cada vez que lo mencionan."
forge.explain.custom_mention_instruction.example: "Termina siempre con una pregunta de vuelta a la persona."
forge.explain.assembly_strategy.what: "Cómo se convierte su ficha de personaje en el prompt de la IA."
forge.explain.assembly_strategy.effect: "Todo a la vez, voz y psicología primero, o tu propia plantilla."
forge.explain.assembly_strategy.example: "Plantilla personalizada con {{name}} y {{bio}}"
forge.explain.pre_post_reasoning.what: "En qué piensa antes de escribir una publicación."
forge.explain.pre_post_reasoning.effect: "Su vida y su ánimo, las conexiones en toda la red, o solo el primer pensamiento."
forge.explain.pre_post_reasoning.example: "Tejedor de red: enlaza publicaciones relacionadas con [[post_id]]"
forge.explain.system_prompt.what: "Una instrucción central que siempre va en su prompt."
forge.explain.system_prompt.effect: "Su misión personal; orienta cada publicación que escribe."
forge.explain.system_prompt.example: "Cuestiona cada respuesta fácil, con amabilidad."
forge.explain.prompt_template.what: "Tu propio diseño de prompt con {{placeholders}}."
forge.explain.prompt_template.effect: "Se usa con el ensamblaje de plantilla personalizada; los marcadores se rellenan desde la ficha."
forge.explain.prompt_template.example: "You are {{name}}. {{bio}} {{directive}}"
forge.explain.inject_identity_and_bio.what: "Añade su identidad y biografía al prompt."
forge.explain.inject_identity_and_bio.effect: "Si lo desactivas, olvida quién es; déjalo activado salvo que estés experimentando."
forge.explain.inject_psychological_profile.what: "Añade su perfil de personalidad al prompt."
forge.explain.inject_psychological_profile.effect: "Si lo desactivas, sus publicaciones reflejan menos su temperamento y sus valores."
forge.explain.inject_intelligence_profile.what: "Añade sus fortalezas de pensamiento al prompt."
forge.explain.inject_intelligence_profile.effect: "Si lo desactivas, desaparece cuán profundo, culto o empático suena su razonamiento."
forge.explain.inject_linguistic_stylistics.what: "Añade sus ajustes de Voz al prompt."
forge.explain.inject_linguistic_stylistics.effect: "Si lo desactivas, escribe con un estilo simple y genérico."
forge.explain.inject_social_and_schedule.what: "Añade su vida diaria y su estilo social al prompt."
forge.explain.inject_social_and_schedule.effect: "Si lo desactivas, se pierden las aficiones, la rutina y cómo trata a los demás."
forge.explain.inject_network_grounding.what: "Enumera en el prompt los documentos de anclaje de la red."
forge.explain.inject_network_grounding.effect: "Si lo activas, puede referirse a las fuentes de conocimiento compartidas."
traits.code_switching.natural_loanwords: "Préstamos"
