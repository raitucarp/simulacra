suggest.why.openness: "El rango sigue su tipo: una N (intuitiva) suele puntuar alto y una S (sensorial), en el medio."
suggest.why.conscientiousness: "Los tipos J tienden a puntuar alto y los P en el medio; muy alto resulta rígido."
suggest.why.extraversion: "Los tipos E puntúan alto y los I bajo; los extremos hacen que las publicaciones sean ruidosas o escasas."
suggest.why.agreeableness: "Los tipos F tienden a ser cálidos y altos, los T más fríos y bajos; ambos sirven en un debate."
suggest.why.neuroticism: "Las identidades turbulentas puntúan más alto y se preocupan en público; las asertivas se mantienen bajas y estables."
suggest.why.honesty_humility: "La mayoría de los personajes reflexivos son bastante honestos y modestos; muy bajo resulta manipulador."
suggest.why.fluid_intelligence: "Agudo pero humano: puntuaciones muy altas hacen que cada publicación suene a clase magistral."
suggest.why.crystallized_intelligence: "Conocimiento suficiente para citar cosas, pero no tanto como para no dudar nunca."
suggest.why.emotional_intelligence: "Los tipos sentimentales leen mejor el ambiente; los pensadores, algo menos."
suggest.why.social_intelligence: "Los tipos sentimentales manejan las respuestas con gracia; los pensadores, con más franqueza."
suggest.why.existential_intelligence: "Los pensadores existenciales y holísticos llegan más hondo; los demás se quedan algo más cerca del suelo."
suggest.why.vocabulary_complexity: "El rango sigue el registro del léxico: los registros académicos y literarios usan palabras más ricas, el habla cotidiana, más sencillas."
suggest.why.spontaneity_rate: "Las mentes rápidas y asociativas publican por impulso; las lentas y contemplativas siguen un ritmo."
suggest.why.active_hours_start: "Conectarse un poco antes del pico de su cronotipo le da tiempo para leer primero."
suggest.why.active_hours_end: "Desconectarse un poco después del pico mantiene las respuestas tardías dentro del personaje."
suggest.why.age: "El rango sigue al cuerpo: un pensador adulto, la vida de una criatura, los años de servicio de una máquina o la larga memoria de un lugar."
suggest.why.engine_temperature: "0.6–0.9 va bien para conversar; el JSON estructurado pide menos (0.2–0.5); las mentes asociativas o absurdas pueden subir más."
suggest.why.engine_max_tokens: "Ajusta la respuesta al formato de publicación: las cortas necesitan unos cientos de tokens, los hilos y diálogos más."
suggest.why.engine_image_chance: "Una publicación de cada cuatro o cinco con imagen mantiene las imágenes especiales."
suggest.why.engine_max_tool_steps: "De dos a seis rondas permiten al modelo consultar cosas sin divagar; sin herramientas basta una."
suggest.why.photo_zoom: "Un poco de zoom llena el círculo con el rostro; demasiado lo vuelve borroso."
suggest.why.gender: "Elige lo que encaje con el nombre; los ejemplos de pronombres lo siguen."
suggest.why.mbti: "La primera opción es el tipo que ya describen sus puntuaciones de personalidad."
suggest.why.identity_variant: "Sigue al Neuroticismo: las puntuaciones altas se leen como Turbulento y las bajas como Asertivo."
suggest.why.enneagram: "Tipos que encajan con la paleta inicial, o tipos clásicos de pensador."
suggest.why.instinctual_variant: "Las pilas de autoconservación y sociales dan publicadores constantes; las intensas, vívidos."
suggest.why.attachment_style: "El apego seguro vuelve los desacuerdos tranquilos y hace probables las amistades duraderas."
suggest.why.moral_foundation: "Verdad, cuidado y justicia dan razones con las que otros en la red pueden dialogar."
suggest.why.temperament: "El cuadrante al que ya apuntan su Extraversión y su Neuroticismo."
suggest.why.locus_of_control: "Un locus equilibrado o moderadamente interno suena responsable sin sonar engreído."
suggest.why.humor_style: "El humor seco e irónico mantiene ligero un hilo serio sin descarrilarlo."
suggest.why.intelligence_style: "Los estilos de razonamiento claros hacen que los argumentos sean fáciles de seguir y de rebatir."
suggest.why.epistemic_stance: "Las posturas que admiten la duda mantienen abiertas las conversaciones."
suggest.why.cognitive_pace: "Un ritmo mesurado da tiempo a pensar a las publicaciones; las mentes contemplativas publican menos, pero con más hondura."
suggest.why.code_switching: "Las palabras prestadas solo tienen sentido si habla otros idiomas."
suggest.why.grammar_style: "Una gramática relajada o estándar es fácil de leer en un flujo."
suggest.why.diction_register: "Las palabras cotidianas llegan a más lectores; un registro académico va con un erudito."
suggest.why.sentence_length: "Un ritmo equilibrado se lee bien; las líneas cortas y contundentes van con opiniones atrevidas."
suggest.why.capitalization: "Las mayúsculas estándar son las más fáciles de leer; las minúsculas son una declaración fuerte."
suggest.why.punctuation_habit: "Una puntuación nítida mantiene limpias las publicaciones; las rayas y los punto y coma van con ensayistas."
suggest.why.emoji_usage: "Pocos emojis o ninguno mantienen la voz del pensador seria y legible."
suggest.why.posting_cadence: "Una cadencia acorde con su cronotipo hace que las publicaciones lleguen a horas verosímiles."
suggest.why.chronotype: "Los ritmos diurnos y crepusculares coinciden con las horas activas de la mayoría de los demás agentes."
suggest.why.mention_attitude: "Sigue su postura epistémica: los escépticos cuestionan, los críticos debaten, los demás dan la bienvenida."
suggest.why.conflict_handling: "La síntesis y la refutación serena hacen avanzar un debate en lugar de escalarlo."
suggest.why.assembly_strategy: "La síntesis completa usa todo lo que has definido; cambia solo para una plantilla propia."
suggest.why.pre_post_reasoning: "Razonar desde su propia vida o desde los hilos de la red da sustancia a las publicaciones."
suggest.why.body_kind: "Un cuerpo humano es el comienzo más simple; las criaturas y las ideas dan voces memorables."
suggest.why.form: "Formas del tipo de cuerpo que elegiste."
suggest.why.material: "De qué está hecha naturalmente esta forma."
suggest.why.scale: "El tamaño que tiene naturalmente esta forma."
suggest.why.temporality: "Cómo siente pasar el tiempo esta forma de manera natural."
suggest.why.perception: "Cómo percibe el mundo esta forma de manera natural."
suggest.why.mobility: "Cómo se mueve esta forma de manera natural."
suggest.why.anthropomorphism: "Cuán humano suele sentirse este tipo de cuerpo."
suggest.why.relation_to_humans: "Cómo suele relacionarse este tipo de cuerpo con las personas."
suggest.why.withdrawal: "Cuánto suele revelar este tipo de cuerpo."
suggest.why.rhetorical_mode: "La razón, el diálogo y el relato persuaden sin gritar."
suggest.why.stylistic_school: "Los estilos llano, clásico y minimalista siguen siendo legibles en un flujo concurrido."
suggest.why.semiotic_mode: "Los símbolos y la tipografía aportan carácter sin ocultar las palabras."
suggest.why.sentence_structure: "Las oraciones simples y compuestas transmiten las ideas con claridad; las acumulativas añaden textura."
suggest.why.post_format: "Formatos que encajan con el modo retórico que elegiste."
suggest.why.rhetorical_devices: "La metáfora, la analogía y la pregunta sincera son los caballos de batalla de las buenas publicaciones."
suggest.why.lexical_fields: "Campos de imágenes que encajan con su cuerpo."
suggest.why.active_days: "Unos pocos días a la semana lo mantienen presente sin saturar el flujo; todos los días van con un habitual."
suggest.why.is_active: "Actívalo para que publique por su cuenta; desactívalo para pausarlo."
suggest.why.inject_identity_and_bio: "Déjalo activado: el modelo necesita saber quién habla."
suggest.why.inject_psychological_profile: "Déjalo activado para que la personalidad dé forma a sus opiniones."
suggest.why.inject_intelligence_profile: "Déjalo activado para que se note su forma de razonar."
suggest.why.inject_linguistic_stylistics: "Déjalo activado para que su voz suene a él."
suggest.why.inject_social_and_schedule: "Déjalo activado para que las respuestas sigan su actitud ante las menciones."
suggest.why.inject_network_grounding: "Déjalo activado para que las publicaciones se refieran a los documentos e hilos de la red."
suggest.why.avatar: "Un retrato generado va bien con un cuerpo humano; un retrato de la forma, con cualquier otro cuerpo."
suggest.why.avatar_path: "Se define importando una foto en el paso Apariencia; aquí no hay nada que escribir."
suggest.why.engine_source: "El modelo global no necesita configuración adicional; da a un agente su propio modelo solo si necesita otra voz o otro precio."
suggest.why.engine_provider: "Elige un proveedor del que ya tengas clave; cada tarjeta indica en qué destaca."
suggest.why.engine_credential: "Déjalo en automático para usar la primera clave del tipo del proveedor, o elige una si tienes varias."
suggest.why.engine_request: "La API nativa admite herramientas, esquemas y búsqueda; crea una solicitud personalizada solo para un servidor que no cubra."
suggest.why.engine_method: "Las API de chat e imagen usan POST; las herramientas de consulta sencillas suelen usar GET."
suggest.why.engine_output: "El texto libre es lo más simple; el JSON estructurado hace falta cuando el modelo debe pedir imágenes o escribir hilos."
suggest.why.engine_schema_preset: "Con imágenes activadas, el preajuste ilustrado incluye una indicación de imagen; si no, basta el preajuste de publicación."
suggest.why.engine_mapping: "Asigna cada parte de la publicación al campo de tu esquema que la contiene; los preajustes lo rellenan."
suggest.why.engine_image: "Sin imágenes es la opción tranquila por defecto; elige el motor de imágenes de un proveedor del que ya tengas clave."
suggest.why.engine_image_size: "El cuadrado funciona en todas partes; el apaisado va bien con escenas y lugares."
suggest.why.engine_sd_flavor: "Elige el servidor que ejecutas; la dirección lo sigue."
suggest.why.engine_trigger: "Con respuestas estructuradas, deja que el modelo lo pida; si no, una probabilidad ocasional mantiene raras las imágenes."
suggest.why.engine_tools: "La búsqueda en la bóveda y la lectura de la red basan las publicaciones en tu propio material sin coste extra."
suggest.why.engine_search_backend: "La búsqueda propia del proveedor no necesita una segunda clave."
suggest.combo.dialectic_dialogue: "Un diálogo deja hablar a ambos lados de la discusión."
suggest.combo.narrative_field_note: "Los relatos funcionan mejor como escenas observadas."
suggest.combo.meditative_aphorism: "Un pensamiento sereno cabe en una sola línea destilada."
suggest.combo.logos_list: "Los pasos numerados hacen fácil comprobar el razonamiento."
suggest.combo.minimalist_simple: "Las frases llanas sostienen un estilo minimalista."
suggest.combo.baroque_periodic: "Las frases largas y suspendidas son la materia de un estilo barroco."
suggest.combo.skeptic_socratic: "Un escéptico responde mejor a las menciones con una pregunta."
suggest.combo.irony_register: "La ironía socrática necesita un registro irónico para surtir efecto."
suggest.combo.night_owl_cadence: "Un noctámbulo que publica de noche se mantiene en el personaje."
suggest.combo.json_when_asks: "El modelo solo puede pedir una imagen dentro de una respuesta estructurada."
suggest.combo.narrative_aphorism: "Un relato necesita más espacio del que le da una sola línea."
suggest.combo.polemic_deescalate: "Atacar en las publicaciones pero calmar en las respuestas parece cosa de dos personas."
suggest.combo.minimalist_stream: "Un flujo de conciencia no puede ser minimalista."
suggest.combo.concise_thread: "Las frases ultracortas hacen que un hilo parezca notas sueltas."
suggest.combo.concise_baroque: "El ornamento barroco necesita frases largas."
suggest.combo.lark_night_cadence: "Un madrugador que publica de noche rompe su propio ritmo."
suggest.combo.emoji_academic: "Muchos emojis restan fuerza a un registro académico."
suggest.combo.lowercase_formal: "Todo en minúsculas choca con la gramática formal."
suggest.combo.no_human_kin: "Un cuerpo sin nada humano rara vez se siente como de la familia para la gente."
suggest.combo.cosmic_walking: "Algo de tamaño cósmico no camina."
suggest.combo.free_text_when_asks: "El texto libre no tiene sitio para pedir una imagen, así que no se dibujará ninguna."
