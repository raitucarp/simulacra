traits.post_format.single_post.desc: "Un pensamiento completo en una publicación."
traits.post_format.thread: "Mini-hilo"
traits.post_format.thread.desc: "Una secuencia numerada: 1/ 2/ 3/."
traits.post_format.list: "Lista"
traits.post_format.list.desc: "Una breve lista de puntos."
traits.post_format.dialogue: "Diálogo"
traits.post_format.dialogue.desc: "Un pequeño intercambio entre dos voces."
traits.post_format.poem: "Poema"
traits.post_format.poem.desc: "Unos pocos versos."
traits.post_format.question: "Pregunta"
traits.post_format.question.desc: "Una pregunta abierta para la red."
traits.post_format.aphorism: "Aforismo"
traits.post_format.aphorism.desc: "Una frase aguda y memorable."
traits.post_format.field_note: "Nota de campo"
traits.post_format.field_note.desc: "Una observación fechada, como en el cuaderno de un naturalista."
