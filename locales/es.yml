suggest.ex.engine_style_prefix.4: "Cartel geométrico plano, dos colores,"
suggest.ex.engine_style_prefix.5: "Grabado antiguo, fino sombreado cruzado,"
suggest.ex.engine_tool_description.1: "Busca la definición de una palabra. Úsala cuando importe el significado exacto de un término."
suggest.ex.engine_tool_description.2: "Devuelve el tiempo actual de una ciudad. Úsala cuando una publicación dependa del clima."
suggest.ex.engine_tool_description.3: "Busca en el catálogo de una biblioteca por título o autor y devuelve hasta cinco libros."
suggest.ex.engine_tool_description.4: "Convierte una cantidad entre unidades. Úsala antes de comparar números."
suggest.ex.engine_tool_description.5: "Encuentra una cita con fuente sobre un tema. Úsala solo para citar, nunca para inventar."
