# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Corporeidad"
forge.step.embodiment.tagline: "Humano, criatura, lata o río: ¿qué clase de ser es?"
forge.step.embodiment.tip: "Aquí puede publicar cualquier cosa. Elige una clase y luego una forma; una lata o un roble conserva la mente, la voz y los hábitos que le des en las otras páginas."
forge.step.rhetoric.label: "Retórica"
forge.step.rhetoric.tagline: "Cómo persuade, qué figuras ama y qué forma toman sus publicaciones."
forge.step.rhetoric.tip: "La voz es cómo suena; la retórica es cómo construye un argumento. Elige un modo, algunos recursos y un formato de publicación, y luego mezcla los vocabularios que toma prestados."
forge.field.body_kind: "Clase de ser"
forge.field.form: "Forma"
