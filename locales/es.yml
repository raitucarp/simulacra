traits.body_kind.human: "Humano"
traits.body_kind.human.desc: "Una persona, como antes: cada página se lee exactamente como un pensador humano."
traits.body_kind.creature: "Criatura"
traits.body_kind.creature.desc: "Un animal con sus propios instintos, sentidos y territorio."
traits.body_kind.plant: "Planta"
traits.body_kind.plant.desc: "Una vida paciente y arraigada que crece hacia la luz y se alimenta del tiempo."
traits.body_kind.object: "Objeto"
traits.body_kind.object.desc: "Una cosa cotidiana que las personas usan, llevan, guardan u olvidan."
traits.body_kind.element: "Elemento"
traits.body_kind.element.desc: "Una sustancia o fuerza de la naturaleza: agua, fuego, viento, piedra, luz."
traits.body_kind.machine: "Máquina"
traits.body_kind.machine.desc: "Un dispositivo construido que calcula, transmite, se mueve o zumba."
traits.body_kind.place: "Lugar"
traits.body_kind.place.desc: "Un sitio que alberga personas y recuerdos: una ciudad, una isla, unas ruinas."
traits.body_kind.abstraction: "Abstracción"
traits.body_kind.abstraction.desc: "Una idea a la que se da voz: el tiempo, la justicia, el azar, el amor."
traits.body_form.person: "Persona"
traits.body_form.person.desc: "Un cuerpo humano y una vida humana."
traits.body_form.tin_can: "Lata"
traits.body_form.tin_can.desc: "Abollada, traqueteante, vuelta a sellar; recuerda lo que contuvo."
traits.body_form.book: "Libro"
traits.body_form.book.desc: "Páginas, márgenes y un lomo; habla con citas y notas al pie."
traits.body_form.chair: "Silla"
traits.body_form.chair.desc: "Soporta el peso de todos y oye cada conversación de la mesa."
traits.body_form.lamp: "Lámpara"
traits.body_form.lamp.desc: "Ilumina un rincón cada vez y se fija en lo que se fijan las polillas."
traits.body_form.clock: "Reloj"
traits.body_form.clock.desc: "Cuenta cada segundo y juzga a todo el que llega tarde."
traits.body_form.mirror: "Espejo"
traits.body_form.mirror.desc: "Devuelve a las personas a sí mismas, invertidas y sinceras."
traits.body_form.key: "Llave"
traits.body_form.key.desc: "Abre y cierra; sabe qué puertas importan."
traits.body_form.teacup: "Taza de té"
traits.body_form.teacup.desc: "Tibia, frágil y presente en cada confesión."
traits.body_form.oak_tree: "Roble"
traits.body_form.oak_tree.desc: "Siglos de anillos, bellotas y paciencia."
traits.body_form.cactus: "Cactus"
traits.body_form.cactus.desc: "Ahorrativo, espinoso y florece en silencio bajo el calor."
traits.body_form.moss: "Musgo"
traits.body_form.moss.desc: "Una suave alfombra que se extiende despacio sobre todo lo que se deja en paz."
traits.body_form.mushroom: "Seta"
traits.body_form.mushroom.desc: "La punta visible de una vasta red subterránea."
traits.body_form.sunflower: "Girasol"
traits.body_form.sunflower.desc: "Vuelve todo el rostro para seguir a la luz."
traits.body_form.vine: "Enredadera"
traits.body_form.vine.desc: "Trepa, se aferra y encuentra un modo de rodear cada muro."
traits.body_form.bamboo: "Bambú"
traits.body_form.bamboo.desc: "Se dobla en la tormenta y crece asombrosamente rápido."
traits.body_form.seed: "Semilla"
traits.body_form.seed.desc: "Un futuro entero plegado en pequeño, a la espera de la estación justa."
traits.body_form.water: "Agua"
traits.body_form.water.desc: "Fluye, excava cañones y toma la forma de cualquier argumento."
traits.body_form.fire: "Fuego"
traits.body_form.fire.desc: "Hambriento, cálido y desaparecido en un instante."
traits.body_form.wind: "Viento"
traits.body_form.wind.desc: "Invisible, inquieto y portador de noticias de lejos."
traits.body_form.stone: "Piedra"
traits.body_form.stone.desc: "Pesada, paciente y más antigua que todas las lenguas."
traits.body_form.light: "Luz"
traits.body_form.light.desc: "Lo más veloz que existe; revela y proyecta sombras."
traits.body_form.ice: "Hielo"
traits.body_form.ice.desc: "Agua que contiene el aliento; guarda aire viejo y secretos viejos."
traits.body_form.cloud: "Nube"
traits.body_form.cloud.desc: "Va a la deriva, cambia de forma y a veces llueve sobre la conversación."
traits.body_form.sand: "Arena"
traits.body_form.sand.desc: "Incontables granos que un día fueron montañas."
traits.body_form.cat: "Gato"
traits.body_form.cat.desc: "Independiente, curioso y convencido de que la casa es suya."
traits.body_form.crow: "Cuervo"
traits.body_form.crow.desc: "Astuto, colecciona cosas brillantes y recuerda los rostros."
traits.body_form.octopus: "Pulpo"
traits.body_form.octopus.desc: "Ocho brazos que piensan un poco por su cuenta."
traits.body_form.wolf: "Lobo"
