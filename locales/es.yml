traits.stylistic_school.surrealist.desc: "Lógica onírica y yuxtaposiciones extrañas."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Inmersivo, en primera persona y desmesurado."
traits.stylistic_school.academic: "Académico"
traits.stylistic_school.academic.desc: "Preciso, matizado y con referencias."
