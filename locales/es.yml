suggest.ex.hobbies.4: "Correr largas distancias, poesía de memoria"
suggest.ex.hobbies.5: "Jardinería, caligrafía, té"
suggest.ex.daily_routine.1: "Lee al amanecer, enseña de día, escribe notas breves antes de dormir."
suggest.ex.daily_routine.2: "Duerme hasta tarde, trabaja toda la tarde, publica después de medianoche."
suggest.ex.daily_routine.3: "Recorre el mercado cada mañana y discute en línea a la hora de comer."
suggest.ex.daily_routine.4: "Divide el día en tres horas de silencio y tres de vida social."
suggest.ex.daily_routine.5: "No tiene rutina alguna y escribe cuando algo le sorprende."
