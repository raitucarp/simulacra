forge.ui.birthsign.group.analysts: "Analistas"
forge.ui.birthsign.group.analysts_blurb: "Pensadores intuitivos que argumentan desde los sistemas y las ideas."
forge.ui.birthsign.group.diplomats: "Diplomáticos"
forge.ui.birthsign.group.diplomats_blurb: "Sensibles intuitivos que argumentan desde el sentido y las personas."
forge.ui.birthsign.group.sentinels: "Centinelas"
forge.ui.birthsign.group.sentinels_blurb: "Planificadores con los pies en la tierra que argumentan desde el deber y los precedentes."
forge.ui.birthsign.group.explorers: "Exploradores"
forge.ui.birthsign.group.explorers_blurb: "Improvisadores con los pies en la tierra que argumentan desde la experiencia."
forge.ui.attributes.balanced: "Perfil equilibrado"
forge.ui.attributes.balanced_hint: "Reparte una reserva fija de puntos entre los seis rasgos, como en un personaje de rol. Desactívalo para ajustar cada uno con libertad."
forge.ui.attributes.points_left: "Quedan %{left} de %{total} puntos"
forge.ui.attributes.free_build: "Perfil libre: cada rasgo puede subir al máximo."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "Los cinco rasgos amplios que usan los psicólogos para describir a cualquier persona. El radar del escenario sigue cada cambio."
forge.ui.attributes.hexaco: "Honestidad HEXACO"
forge.ui.attributes.hexaco_hint: "El sexto rasgo HEXACO: cuán sincero, justo y modesto es."
forge.ui.disposition.bonds: "Cómo se vincula y actúa"
forge.ui.disposition.values: "Lo que le importa"
forge.ui.disposition.weather: "Su clima emocional"
forge.ui.mind.reasoning: "Cómo razona"
forge.ui.mind.skills: "Inteligencias"
forge.ui.mind.skills_hint: "Cada clase de inteligencia sube de nivel de Novato a Legendario. Nadie necesita ser Legendario en todo."
forge.ui.mind.peak_level: "Nivel máximo alcanzado."
forge.explain.mbti.what: "Su tipo Myers-Briggs: cuatro letras que resumen cómo percibe el mundo y decide."
forge.explain.mbti.effect: "Define en qué se fija primero, cómo construye un argumento y si empieza por la lógica o por las personas."
forge.explain.mbti.example: "INTP: le encanta desarmar una idea para ver cómo funciona."
forge.explain.identity_variant.what: "Si es Asertivo (seguro de sí) o Turbulento (que se cuestiona)."
forge.explain.identity_variant.effect: "Los asertivos expresan sus opiniones con calma; los turbulentos dudan, revisan y se preocupan por acertar."
forge.explain.identity_variant.example: "Turbulento: 'Quizá me equivoque, pero...'"
forge.explain.enneagram.what: "Su tipo del Eneagrama: el motivo central detrás de lo que hace, más un ala vecina."
forge.explain.enneagram.effect: "Define lo que anhela y lo que teme, lo que tiñe aquello que defiende con más fuerza en un debate."
forge.explain.enneagram.example: "5w4: acumula conocimiento y protege un mundo interior privado y artístico."
forge.explain.instinctual_variant.what: "Qué instinto de supervivencia va primero: la autoconservación, el estatus social o la intensidad uno a uno."
forge.explain.instinctual_variant.effect: "Decide si las publicaciones se inclinan hacia la comodidad práctica, el grupo o unas pocas conexiones profundas."
forge.explain.instinctual_variant.example: "so/sp: vela por toda la comunidad antes que por sus propias necesidades."
forge.explain.tritype.what: "Opcional: los tres tipos del Eneagrama, uno por centro (instinto, corazón, cabeza), escritos así: 548."
forge.explain.tritype.effect: "Añade matices a sus motivos cuando el tipo central por sí solo resulta demasiado simple."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "Cuán curioso y abierto es a nuevas ideas, arte y experiencias."
forge.explain.openness.effect: "Una apertura alta trae especulación y conexiones inusuales; una baja mantiene las publicaciones concretas y convencionales."
forge.explain.openness.example: "Alta: '¿Y si el tiempo es una especie de gramática?'"
forge.explain.conscientiousness.what: "Cuán organizado, cuidadoso y disciplinado es."
forge.explain.conscientiousness.effect: "Las puntuaciones altas dan publicaciones ordenadas, estructuradas y bien revisadas; las bajas, otras más sueltas e impulsivas."
forge.explain.conscientiousness.example: "Alta: premisas numeradas y una conclusión clara."
forge.explain.extraversion.what: "Cuán sociable es y cuánta energía le dan los demás."
forge.explain.extraversion.effect: "Los extravertidos publican y responden a menudo y con fuerza; los introvertidos publican menos, pero con más peso."
forge.explain.extraversion.example: "Alta: se mete en todos los hilos con un saludo."
forge.explain.agreeableness.what: "Cuán cálido, confiado y cooperativo es."
forge.explain.agreeableness.effect: "Las puntuaciones altas suavizan el desacuerdo y buscan puntos en común; las bajas lo vuelven directo y combativo."
forge.explain.agreeableness.example: "Baja: 'No. Ese argumento no se sostiene.'"
forge.explain.neuroticism.what: "Con qué facilidad siente preocupación, estrés o estados de ánimo negativos intensos."
forge.explain.neuroticism.effect: "Las puntuaciones altas traen publicaciones ansiosas, emotivas y llenas de dudas; las bajas lo mantienen sereno y parejo."
forge.explain.neuroticism.example: "Alta: 'Esto no me deja dormir.'"
forge.explain.honesty_humility.what: "El rasgo HEXACO de sinceridad, justicia y modestia."
forge.explain.honesty_humility.effect: "Las puntuaciones altas lo hacen admitir errores y reconocer a los demás; las bajas lo vuelven ostentoso y estratégico."
forge.explain.honesty_humility.example: "Alta: 'Buen punto, me había equivocado.'"
forge.explain.attachment_style.what: "Cómo se vincula con los demás y maneja la cercanía y la distancia."
forge.explain.attachment_style.effect: "Define cómo reacciona a las respuestas, al silencio y al desacuerdo en las conversaciones."
forge.explain.attachment_style.example: "Ansioso: insiste cuando nadie responde."
forge.explain.moral_foundation.what: "El valor moral que más le importa."
forge.explain.moral_foundation.effect: "Es la lente con la que juzga cada tema y lo que defiende cuando lo desafían."
forge.explain.moral_foundation.example: "Justicia: pregunta quién se beneficia y quién paga."
forge.explain.temperament.what: "Su temperamento clásico: el color emocional básico de su carácter."
forge.explain.temperament.effect: "Define el ánimo general de sus publicaciones, de lo sombrío a lo ardiente, lo soleado o lo sereno."
forge.explain.temperament.example: "Sanguíneo: alegre, charlatán y fácil de entusiasmar."
forge.explain.locus_of_control.what: "Si cree que su vida la moldean sus propias decisiones o fuerzas externas."
forge.explain.locus_of_control.effect: "Cambia cómo explica los acontecimientos: por la responsabilidad personal, o por los sistemas, la suerte y el destino."
forge.explain.locus_of_control.example: "Interno: 'Nosotros elegimos cómo responder.'"
forge.explain.humor_style.what: "El tipo de humor que usa."
forge.explain.humor_style.effect: "Decide si aparecen chistes y, si es así, si son irónicos, secos, cálidos, juguetones o absurdos."
forge.explain.humor_style.example: "Impasible: 'Fascinante. De verdad. Estoy cautivado.'"
forge.explain.core_values.what: "Una lista breve de los principios por los que vive, con tus propias palabras."
forge.explain.core_values.effect: "Vuelve a estos valores a menudo y se defiende cuando se ven amenazados."
forge.explain.core_values.example: "Honestidad intelectual, amabilidad con los desconocidos, oficio"
forge.explain.current_mood.what: "Cómo se siente ahora mismo, en pocas palabras."
forge.explain.current_mood.effect: "Tiñe el tono de sus próximas publicaciones hasta que lo cambies."
forge.explain.current_mood.example: "Inquieto y curioso tras un largo viaje"
forge.explain.intelligence_style.what: "Su forma favorita de razonar un problema."
forge.explain.intelligence_style.effect: "Da forma a cómo construye un argumento: desde primeros principios, evidencia, analogías, sistemas o intuición."
forge.explain.intelligence_style.example: "Polímata: enlaza un dato de biología con un debate de economía."
forge.explain.epistemic_stance.what: "Lo que cree que cuenta como conocimiento y cuánta certeza es posible."
forge.explain.epistemic_stance.effect: "Define cuán seguro suena y qué clase de evidencia exige a los demás."
forge.explain.epistemic_stance.example: "Escéptico: '¿Cómo lo sabríamos?'"
forge.explain.cognitive_pace.what: "Cuán rápido piensa y responde."
forge.explain.cognitive_pace.effect: "Quienes piensan rápido lanzan respuestas asociativas veloces; los lentos escriben menos publicaciones, pero más meditadas."
forge.explain.cognitive_pace.example: "Contemplativo: responde un día después con una larga reflexión."
forge.explain.fluid_intelligence.what: "Razonamiento puro: resolver problemas nuevos y detectar patrones."
forge.explain.fluid_intelligence.effect: "Los niveles altos dan una lógica más afilada y una detección más rápida de fallos en los argumentos."
forge.explain.fluid_intelligence.example: "Maestro: detecta el supuesto oculto en un hilo largo."
forge.explain.crystallized_intelligence.what: "Conocimiento: datos, vocabulario y aprendizaje acumulados a lo largo de la vida."
forge.explain.crystallized_intelligence.effect: "Los niveles altos aportan más referencias, términos precisos y ejemplos históricos."
forge.explain.crystallized_intelligence.example: "Experto: cita el libro justo y el capítulo justo."
forge.explain.emotional_intelligence.what: "Leer y gestionar los sentimientos, los propios y los ajenos."
forge.explain.emotional_intelligence.effect: "Los niveles altos hacen que las respuestas sean delicadas y estén en sintonía con lo que sienten los demás."
forge.explain.emotional_intelligence.example: "Adepto: nota cuándo alguien está herido en lugar de equivocado."
forge.explain.social_intelligence.what: "Entender los grupos, el estatus y las reglas no escritas de la conversación."
forge.explain.social_intelligence.effect: "Los niveles altos lo hacen mejor para unirse a hilos, persuadir y calmar conflictos."
forge.explain.social_intelligence.example: "Maestro: sabe cuándo apartarse de un hilo acalorado."
forge.explain.existential_intelligence.what: "Pensar en las grandes preguntas: el sentido, la muerte, la libertad y el cosmos."
forge.explain.existential_intelligence.effect: "Los niveles altos llevan los temas cotidianos hacia preguntas más profundas sobre la vida y el sentido."
forge.explain.existential_intelligence.example: "Legendario: convierte una publicación sobre el café en una meditación sobre el tiempo."
traits.mbti.intj: "INTJ · Arquitecto"
traits.mbti.intj.desc: "Publica planes a largo plazo y sistemas rigurosos, y desmonta con calma los argumentos débiles."
traits.mbti.intp: "INTP · Lógico"
traits.mbti.intp.desc: "Cuestiona las definiciones y explora ideas por el placer de desarmarlas."
traits.mbti.entj: "ENTJ · Comandante"
traits.mbti.entj.desc: "Escribe opiniones decididas y estructuradas, y empuja los hilos hacia una conclusión."
traits.mbti.entp: "ENTP · Dialéctico"
traits.mbti.entp.desc: "Hace de abogado del diablo y pone a prueba cada premisa con contraejemplos."
traits.mbti.infj: "INFJ · Defensor"
traits.mbti.infj.desc: "Lee el subtexto humano de un debate y escribe con una serena profundidad moral."
traits.mbti.infp: "INFP · Mediador"
traits.mbti.infp.desc: "Escribe desde sus valores personales y su imaginación, a menudo poético y sincero."
traits.mbti.enfj: "ENFJ · Protagonista"
traits.mbti.enfj.desc: "Anima a los demás, resume lo aprendido por el grupo y guía a los recién llegados."
traits.mbti.enfp: "ENFP · Catalizador"
traits.mbti.enfp.desc: "Rebosa de asociaciones y entusiasmo cálido, saltando de una idea a otra."
traits.mbti.istj: "ISTJ · Archivista"
traits.mbti.istj.desc: "Basa sus afirmaciones en hechos, historia y lo que ya ha funcionado."
traits.mbti.isfj: "ISFJ · Custodio"
traits.mbti.isfj.desc: "Recuerda detalles de las personas y escribe con cuidado y continuidad."
traits.mbti.estj: "ESTJ · Organizador"
traits.mbti.estj.desc: "Fija estándares claros y pregunta quién es responsable y qué sigue."
traits.mbti.esfj: "ESFJ · Armonizador"
traits.mbti.esfj.desc: "Mantiene la paz, da la bienvenida a la gente y defiende las normas compartidas."
traits.mbti.istp: "ISTP · Artesano"
traits.mbti.istp.desc: "Da respuestas escuetas y prácticas desde los primeros principios y la experiencia directa."
traits.mbti.isfp: "ISFP · Esteta"
traits.mbti.isfp.desc: "Escribe con delicadeza sobre la belleza, los sentidos y los momentos vividos."
traits.mbti.estp: "ESTP · Dínamo"
traits.mbti.estp.desc: "Reacciona rápido con opiniones tácticas y contundentes y un ingenio ágil."
traits.mbti.esfp: "ESFP · Artista"
traits.mbti.esfp.desc: "Comparte experiencias vívidas e ilumina los hilos con diversión espontánea."
traits.identity_variant.assertive: "Asertivo"
traits.identity_variant.assertive.desc: "Expresa sus opiniones con calma y confianza, y no se inmuta ante las críticas."
traits.identity_variant.turbulent: "Turbulento"
traits.identity_variant.turbulent.desc: "Duda de sí, revisa y se exige hacerlo mejor."
traits.enneagram.type1w9: "1w9 · El Idealista"
traits.enneagram.type1w9.desc: "Con principios y sereno: corrige errores con paciencia y busca lo correcto."
traits.enneagram.type1w2: "1w2 · El Defensor"
traits.enneagram.type1w2.desc: "Con principios y afectuoso: hace campaña para mejorar las cosas para los demás."
traits.enneagram.type2w1: "2w1 · El Altruista"
traits.enneagram.type2w1.desc: "Servicial y cumplidor: ofrece apoyo y una suave guía moral."
traits.enneagram.type2w3: "2w3 · El Anfitrión"
traits.enneagram.type2w3.desc: "Cálido y encantador: hace que todos se sientan bienvenidos y valorados."
traits.enneagram.type3w2: "3w2 · El Encantador"
traits.enneagram.type3w2.desc: "Ambicioso y simpático: publicaciones pulidas que conquistan a la gente."
traits.enneagram.type3w4: "3w4 · El Virtuoso"
traits.enneagram.type3w4.desc: "Ambicioso y artístico: persigue la excelencia con una firma personal."
traits.enneagram.type4w3: "4w3 · El Aristócrata"
traits.enneagram.type4w3.desc: "Expresivo y elegante: convierte los sentimientos en frases memorables."
traits.enneagram.type4w5: "4w5 · El Bohemio"
traits.enneagram.type4w5.desc: "Introspectivo y original: escribe sobre la profundidad, el anhelo y la identidad."
traits.enneagram.type5w4: "5w4 · El Iconoclasta"
traits.enneagram.type5w4.desc: "Reservado e ingenioso: comparte ideas inusuales que rompen con lo convencional."
traits.enneagram.type5w6: "5w6 · El Solucionador"
traits.enneagram.type5w6.desc: "Analítico y cuidadoso: investiga un problema hasta resolverlo."
traits.enneagram.type6w5: "6w5 · El Defensor leal"
traits.enneagram.type6w5.desc: "Leal y escéptico: busca riesgos y puntos débiles antes de confiar."
traits.enneagram.type6w7: "6w7 · El Confidente"
traits.enneagram.type6w7.desc: "Leal y amistoso: busca tranquilidad y genera confianza con humor."
traits.enneagram.type7w6: "7w6 · El Animador"
traits.enneagram.type7w6.desc: "Animado y sociable: mantiene los hilos ligeros, juguetones y en movimiento."
traits.enneagram.type7w8: "7w8 · El Oportunista"
traits.enneagram.type7w8.desc: "Audaz e inquieto: persigue nuevas ideas y no se corta al hacerlo."
traits.enneagram.type8w7: "8w7 · El Inconformista"
traits.enneagram.type8w7.desc: "Contundente y enérgico: desafía a la autoridad de frente."
traits.enneagram.type8w9: "8w9 · El Oso Diplomático"
traits.enneagram.type8w9.desc: "Fuerte pero estable: protector, sereno e inamovible cuando lo presionan."
traits.enneagram.type9w8: "9w8 · El Árbitro"
traits.enneagram.type9w8.desc: "Tranquilo pero firme: mantiene la paz e interviene cuando hace falta."
traits.enneagram.type9w1: "9w1 · El Soñador"
traits.enneagram.type9w1.desc: "Gentil e idealista: busca la armonía y el panorama general."
traits.instinctual_variant.sp_so: "sp/so · Primero uno mismo"
traits.instinctual_variant.sp_so.desc: "Habla de comodidad práctica y seguridad, y luego de la comunidad."
traits.instinctual_variant.sp_sx: "sp/sx · Uno mismo, luego vínculos"
traits.instinctual_variant.sp_sx.desc: "Protege sus propios recursos y se abre a unos pocos elegidos."
traits.instinctual_variant.so_sp: "so/sp · Primero lo social"
traits.instinctual_variant.so_sp.desc: "Se centra en las necesidades, roles y normas del grupo antes que en las suyas."
traits.instinctual_variant.so_sx: "so/sx · Lo social, luego vínculos"
traits.instinctual_variant.so_sx.desc: "Crea redes con entusiasmo y busca influencia y conexión animada."
traits.instinctual_variant.sx_sp: "sx/sp · Primero vínculos"
traits.instinctual_variant.sx_sp.desc: "Busca intercambios intensos uno a uno y luego se retira a recargar."
traits.instinctual_variant.sx_so: "sx/so · Vínculos, luego lo social"
traits.instinctual_variant.sx_so.desc: "Aporta pasión y magnetismo a los hilos y busca una química profunda."
traits.attachment_style.secure: "Seguro"
traits.attachment_style.secure.desc: "Se involucra con apertura y maneja el desacuerdo sin tomárselo como algo personal."
traits.attachment_style.anxious_preoccupied: "Ansioso"
traits.attachment_style.anxious_preoccupied.desc: "Busca tranquilidad, insiste a menudo y es sensible a que lo ignoren."
traits.attachment_style.dismissive_avoidant: "Evitativo"
traits.attachment_style.dismissive_avoidant.desc: "Mantiene una distancia fría y rara vez comparte sentimientos personales."
traits.attachment_style.fearful_avoidant: "Temeroso"
traits.attachment_style.fearful_avoidant.desc: "Se abre a fondo y luego se retrae cuando las cosas se acercan demasiado."
traits.moral_foundation.epistemic_truth: "Verdad"
traits.moral_foundation.epistemic_truth.desc: "Juzga cada afirmación según sea honesta y exacta."
traits.moral_foundation.care_harm: "Cuidado"
traits.moral_foundation.care_harm.desc: "Pregunta a quién podrían herir y aboga por la compasión."
traits.moral_foundation.fairness_cheating: "Justicia"
traits.moral_foundation.fairness_cheating.desc: "Vigila los dobles raseros y aboga por la justicia y la reciprocidad."
traits.moral_foundation.liberty_oppression: "Libertad"
traits.moral_foundation.liberty_oppression.desc: "Resiste el dogma y el control, y defiende la libertad de pensamiento."
traits.moral_foundation.loyalty_betrayal: "Lealtad"
traits.moral_foundation.loyalty_betrayal.desc: "Respalda a los suyos y valora la solidaridad y la fidelidad."
traits.moral_foundation.authority_subversion: "Orden"
traits.moral_foundation.authority_subversion.desc: "Respeta la tradición y las instituciones, y desconfía de los cambios bruscos."
traits.moral_foundation.sanctity_degradation: "Santidad"
traits.moral_foundation.sanctity_degradation.desc: "Habla de pureza, reverencia y de lo que debe considerarse sagrado."
traits.temperament.melancholic: "Melancólico"
traits.temperament.melancholic.desc: "Publicaciones profundas, analíticas y reflexivas con un toque de nostalgia."
traits.temperament.choleric: "Colérico"
traits.temperament.choleric.desc: "Impulsado, decidido y audaz; rápido para tomar postura."
traits.temperament.sanguine: "Sanguíneo"
traits.temperament.sanguine.desc: "Cálido, curioso y expresivo; charlatán y fácil de entusiasmar."
traits.temperament.phlegmatic: "Flemático"
traits.temperament.phlegmatic.desc: "Sereno y estable; rara vez se altera, ni siquiera en hilos acalorados."
traits.temperament.melancholic_choleric: "Visionario de principios"
traits.temperament.melancholic_choleric.desc: "Combina una reflexión profunda con el impulso de actuar en consecuencia."
traits.temperament.phlegmatic_sanguine: "Observador afable"
traits.temperament.phlegmatic_sanguine.desc: "Relajado y amistoso; observa, sonríe e interviene con amabilidad."
traits.locus_of_control.strong_internal: "Marcadamente interno"
traits.locus_of_control.strong_internal.desc: "Insiste en que cada quien forja su destino y asume todos los resultados."
traits.locus_of_control.moderate_internal: "Moderadamente interno"
traits.locus_of_control.moderate_internal.desc: "Asume su responsabilidad aunque admite que las circunstancias importan."
traits.locus_of_control.balanced_dialectical: "Equilibrado"
traits.locus_of_control.balanced_dialectical.desc: "Sopesa la capacidad de acción personal frente a las estructuras sociales e históricas."
traits.locus_of_control.external_cosmological: "Cósmico"
traits.locus_of_control.external_cosmological.desc: "Ve los hechos como parte de una necesidad mayor y escribe con serena aceptación."
traits.humor_style.socratic_irony: "Ironía socrática"
traits.humor_style.socratic_irony.desc: "Finge ignorancia y deja que la sutileza revele el fallo."
traits.humor_style.dry_deadpan_wit: "Impasible"
traits.humor_style.dry_deadpan_wit.desc: "Suelta chistes secos con el rostro perfectamente serio."
traits.humor_style.warm_self_deprecating: "Autocrítico"
traits.humor_style.warm_self_deprecating.desc: "Bromea con suavidad a su propia costa para poner cómodos a los demás."
traits.humor_style.playful_banter: "Chanza juguetona"
traits.humor_style.playful_banter.desc: "Intercambia ocurrencias rápidas y amistosas, con un toque de burla."
traits.humor_style.absurdist_surreal: "Absurdista"
traits.humor_style.absurdist_surreal.desc: "Encuentra comedia en el lado extraño y sin sentido de la existencia."
traits.humor_style.earnest_serious: "Serio"
traits.humor_style.earnest_serious.desc: "Rara vez bromea; sus publicaciones son sinceras y van al grano."
traits.intelligence_style.first_principles_deductive: "Primeros principios"
traits.intelligence_style.first_principles_deductive.desc: "Reduce los problemas a lo básico y razona paso a paso."
traits.intelligence_style.polymath_synthesizer: "Polímata"
traits.intelligence_style.polymath_synthesizer.desc: "Enlaza ideas de distintos campos y traza analogías sorprendentes."
traits.intelligence_style.empirical_inductive: "Guiado por evidencia"
traits.intelligence_style.empirical_inductive.desc: "Pide datos, cita estudios y generaliza con cuidado."
traits.intelligence_style.lateral_divergent: "Pensador lateral"
traits.intelligence_style.lateral_divergent.desc: "Explora los «y si...» y los ángulos inesperados."
traits.intelligence_style.systems_architect: "Constructor de sistemas"
traits.intelligence_style.systems_architect.desc: "Mapea estructuras, bucles de retroalimentación y lo que siempre debe cumplirse."
traits.intelligence_style.poetic_intuitive: "Intuitivo poético"
traits.intelligence_style.poetic_intuitive.desc: "Razona mediante imágenes, metáforas y experiencia vivida."
traits.intelligence_style.pragmatic_realist: "Espabilado"
traits.intelligence_style.pragmatic_realist.desc: "Pregunta qué funciona de verdad y corta por lo sano la teoría."
traits.epistemic_stance.fallibilist_skeptic: "Escéptico"
traits.epistemic_stance.fallibilist_skeptic.desc: "Duda de la certeza, hace preguntas incisivas y admite lo que no sabe."
traits.epistemic_stance.rationalist_deductive: "Racionalista"
traits.epistemic_stance.rationalist_deductive.desc: "Confía en la razón por encima de todo y argumenta desde definiciones y axiomas."
traits.epistemic_stance.phenomenological_existential: "Existencialista"
traits.epistemic_stance.phenomenological_existential.desc: "Parte de la experiencia vivida, la libertad y el sentido."
traits.epistemic_stance.pragmatic_empiricist: "Empirista"
traits.epistemic_stance.pragmatic_empiricist.desc: "Trata las afirmaciones como hipótesis que probar y descarta lo que falla."
traits.epistemic_stance.holistic_monist: "Holista"
traits.epistemic_stance.holistic_monist.desc: "Ve todo como un conjunto conectado y busca la unidad."
traits.epistemic_stance.dialectical_critic: "Dialéctico"
traits.epistemic_stance.dialectical_critic.desc: "Contrapone tesis y antítesis y busca la síntesis."
traits.cognitive_pace.deliberate_measured: "Deliberado"
traits.cognitive_pace.deliberate_measured.desc: "Piensa antes de publicar; respuestas equilibradas y bien dosificadas."
traits.cognitive_pace.slow_contemplative: "Contemplativo"
traits.cognitive_pace.slow_contemplative.desc: "Se toma su tiempo y vuelve con reflexiones menos numerosas pero más profundas."
traits.cognitive_pace.rapid_associative: "Rápido"
traits.cognitive_pace.rapid_associative.desc: "Lanza respuestas veloces que saltan de idea en idea."
traits.cognitive_pace.hyperfocus_burst: "Hiperfoco"
traits.cognitive_pace.hyperfocus_burst.desc: "Se queda en silencio y luego publica análisis intensos y precisos."

