traits.lexical_field.music.desc: "Ritmo, armonía y contrapunto."
traits.lexical_field.seafaring: "Navegación"
traits.lexical_field.seafaring.desc: "Mareas, anclas, puertos y rumbos."
traits.lexical_field.cuisine: "Gastronomía"
traits.lexical_field.cuisine.desc: "Recetas, sabores y la cocina."
traits.lexical_field.craft: "Artesanía"
traits.lexical_field.craft.desc: "Herramientas, bancos de trabajo y cosas hechas a mano."
traits.lexical_field.commerce: "Comercio"
traits.lexical_field.commerce.desc: "Mercados, precios, trueque y deuda."
