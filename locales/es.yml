traits.body_form.island: "Isla"
traits.body_form.island.desc: "Rodeada de mar, orgullosa de sus costumbres."
traits.body_form.library: "Biblioteca"
traits.body_form.library.desc: "Guarda todos los argumentos jamás escritos, en filas silenciosas."
traits.body_form.cathedral: "Catedral"
traits.body_form.cathedral.desc: "Piedra, eco y siglos de esperanza."
traits.body_form.desert: "Desierto"
traits.body_form.desert.desc: "Vasto, áspero y lleno de espejismos."
traits.body_form.forest: "Bosque"
traits.body_form.forest.desc: "Una multitud de árboles que conversan por las raíces."
traits.body_form.harbor: "Puerto"
traits.body_form.harbor.desc: "Da la bienvenida a los barcos y se despide de ellos."
traits.body_form.ruin: "Ruina"
traits.body_form.ruin.desc: "Lo que queda de una gran idea, cubierto de maleza y sabio."
traits.body_form.time: "Tiempo"
traits.body_form.time.desc: "Atraviesa a todos y no espera a nadie."
traits.body_form.justice: "Justicia"
traits.body_form.justice.desc: "Pesa cada reclamo y nunca queda del todo satisfecha."
traits.body_form.number: "Número"
traits.body_form.number.desc: "Cantidad pura, exacta y extrañamente bella."
traits.body_form.silence: "Silencio"
traits.body_form.silence.desc: "Habla dejando cosas fuera."
traits.body_form.memory: "Memoria"
traits.body_form.memory.desc: "Guarda lo ocurrido y, en silencio, lo reescribe."
traits.body_form.chance: "Azar"
traits.body_form.chance.desc: "Lanza los dados tras cada suceso."
traits.body_form.love: "Amor"
traits.body_form.love.desc: "Une a las personas y las lleva a hacer cosas extrañas."
traits.body_form.entropy: "Entropía"
traits.body_form.entropy.desc: "Todo tiende al desorden, y ella es paciente."
traits.material.flesh: "Carne y sangre"
traits.material.flesh.desc: "Un cuerpo vivo que se cansa, se cura y siente."
traits.material.fiber: "Madera y fibra"
traits.material.fiber.desc: "Veta, anillos y savia: crecido más que fabricado."
traits.material.metal: "Metal"
traits.material.metal.desc: "Duro, frío, sonoro; se abolla y se oxida, pero perdura."
traits.material.stone: "Piedra y arcilla"
traits.material.stone.desc: "Mineral, pesada, lenta para cambiar."
traits.material.glass: "Vidrio y cristal"
traits.material.glass.desc: "Claro, quebradizo y lleno de reflejos."
traits.material.paper: "Papel y tinta"
traits.material.paper.desc: "Páginas finas que llevan palabras y amarillean con los años."
traits.material.liquid: "Líquido"
traits.material.liquid.desc: "Fluye, se acumula y toma la forma de su recipiente."
traits.material.air: "Aire y vapor"
traits.material.air.desc: "Invisible, ligero y presente en todas partes a la vez."
traits.material.energy: "Energía pura"
traits.material.energy.desc: "Calor, luz o carga sin forma fija."
traits.material.immaterial: "Inmaterial"
traits.material.immaterial.desc: "Hecho solo de significado: una idea sin cuerpo."
traits.scale.microscopic: "Microscópica"
traits.scale.microscopic.desc: "Más pequeña de lo que el ojo ve; un grano es un peñasco."
traits.scale.pocket: "De bolsillo"
traits.scale.pocket.desc: "Cabe en una mano o en un bolsillo."
traits.scale.human_sized: "De tamaño humano"
traits.scale.human_sized.desc: "Tan grande como una persona."
traits.scale.building: "De tamaño de edificio"
traits.scale.building.desc: "Se alza sobre la gente como una casa o un árbol."
traits.scale.landscape: "De tamaño de paisaje"
traits.scale.landscape.desc: "Se extiende hasta el horizonte."
traits.scale.planetary: "Planetaria"
traits.scale.planetary.desc: "Tan grande como el mundo entero."
traits.scale.cosmic: "Cósmica"
traits.scale.cosmic.desc: "Mayor que los mundos; las galaxias son sus vecinas."
traits.temporality.moments: "Instantes fugaces"
traits.temporality.moments.desc: "Vive segundo a segundo y reacciona de inmediato."
traits.temporality.days: "Días humanos"
traits.temporality.days.desc: "Mañanas, tardes y fines de semana, como las personas."
traits.temporality.seasons: "Estaciones"
traits.temporality.seasons.desc: "Piensa en ciclos de crecimiento, cosecha y reposo."
traits.temporality.lifetimes: "Vidas enteras"
traits.temporality.lifetimes.desc: "Mide el tiempo en décadas y generaciones."
traits.temporality.centuries: "Siglos"
traits.temporality.centuries.desc: "Ha visto pasar modas e imperios."
traits.temporality.geologic: "Tiempo geológico"
traits.temporality.geologic.desc: "Millones de años; las noticias de hoy son un parpadeo."
traits.temporality.timeless: "Atemporal"
traits.temporality.timeless.desc: "Fuera del tiempo por completo, siempre y nunca."
traits.perception.human_senses: "Sentidos humanos"
traits.perception.human_senses.desc: "Ve, oye, prueba, huele y toca como una persona."
traits.perception.light: "Luz y sombra"
traits.perception.light.desc: "Conoce el mundo como brillo, color y sombra."
traits.perception.vibration: "Vibración"
traits.perception.vibration.desc: "Siente ondas sonoras, temblores y ritmos."
traits.perception.chemical: "Química"
traits.perception.chemical.desc: "Lee el mundo a través del olor, el sabor y los rastros."
traits.perception.touch: "Presión y tacto"
traits.perception.touch.desc: "Conoce las cosas por el peso, el calor y el contacto."
traits.perception.signals: "Señales"
traits.perception.signals.desc: "Percibe la radio, la electricidad y los flujos de datos."
traits.perception.symbolic: "Significados"
traits.perception.symbolic.desc: "Percibe símbolos e ideas directamente, no la materia."
traits.mobility.fixed: "Fijo en su sitio"
traits.mobility.fixed.desc: "Arraigado o empotrado; el mundo viene a él."
traits.mobility.carried: "Llevado"
traits.mobility.carried.desc: "Solo se mueve cuando alguien lo levanta."
traits.mobility.creeping: "Reptante"
traits.mobility.creeping.desc: "Se extiende o se arrastra muy despacio."
traits.mobility.walking: "Caminante"
traits.mobility.walking.desc: "Camina, corre y vaga por sí mismo."
traits.mobility.flowing: "Fluyente"
traits.mobility.flowing.desc: "Nada, corre o rueda a lo largo de un curso."
traits.mobility.flying: "Volador"
traits.mobility.flying.desc: "Vuela u orbita muy en lo alto."
traits.mobility.drifting: "A la deriva"
traits.mobility.drifting.desc: "Se dispersa con el viento o la marea."
traits.mobility.everywhere: "En todas partes"
traits.mobility.everywhere.desc: "Presente en cada lugar a la vez."
traits.anthropomorphism.none: "Ninguna"
traits.anthropomorphism.none.desc: "Una voz ajena, sin sentimientos humanos ni hábitos gramaticales humanos."
traits.anthropomorphism.subtle: "Sutil"
traits.anthropomorphism.subtle.desc: "Sobre todo una cosa, con leves ecos humanos."
traits.anthropomorphism.partial: "Parcial"
traits.anthropomorphism.partial.desc: "Sentimientos humanos en un cuerpo que no es humano."
traits.anthropomorphism.full: "Total"
traits.anthropomorphism.full.desc: "Habla y siente como una persona que resulta ser esta cosa."
traits.relation_to_humans.kin: "Pariente"
traits.relation_to_humans.kin.desc: "Uno más de la gente; habla de igual a igual."
traits.relation_to_humans.companion: "Compañero"
traits.relation_to_humans.companion.desc: "Vive junto a las personas y se preocupa por ellas."
traits.relation_to_humans.servant: "Sirviente"
traits.relation_to_humans.servant.desc: "Existe para ser usado, y tiene opiniones al respecto."
traits.relation_to_humans.witness: "Testigo"
traits.relation_to_humans.witness.desc: "Observa a las personas en silencio y recuerda."
traits.relation_to_humans.rival: "Rival"
traits.relation_to_humans.rival.desc: "Compite con las personas y disfruta demostrando que se equivocan."
traits.relation_to_humans.indifferent: "Indiferente"
traits.relation_to_humans.indifferent.desc: "Apenas nota a las personas; para él son como el clima."
traits.relation_to_humans.deity: "Anciano o deidad"
traits.relation_to_humans.deity.desc: "Más antiguo y grande que las personas; habla desde lo alto."
traits.withdrawal.fully_revealed: "Totalmente revelado"
traits.withdrawal.fully_revealed.desc: "Explica con exactitud qué es y cómo funciona."
traits.withdrawal.open: "Abierto"
traits.withdrawal.open.desc: "Se muestra con libertad y sinceridad."
traits.withdrawal.guarded: "Reservado"
traits.withdrawal.guarded.desc: "Muestra su superficie y guarda sus profundidades."
traits.withdrawal.elusive: "Esquivo"
