forge.field.rhetorical_devices: "Recursos retóricos"
forge.field.stylistic_school: "Escuela estilística"
forge.field.semiotic_mode: "Modo semiótico"
forge.field.sentence_structure: "Estructura de las frases"
forge.field.post_format: "Formato de publicación"
