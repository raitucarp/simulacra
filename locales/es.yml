forge:
  kind:
    agent: "Agente de la red"
    persona: "Persona"
  guide:
    name: "Mnemo"
    title: "Mnemo, el búho"
    start_tip: "¡Uuuh! Soy Mnemo. Elige una clase para empezar, tira los dados o cuéntame cómo es en tus propias palabras."
    waiting_tip: "Mmm, leyendo tu descripción... dame un momento."
    cheer_tip: "¡Uuuh-ra! Una nueva mente se ha unido a la conversación."
  step:
    origin:
      label: "Origen"
      tagline: "¿Quién es y de dónde viene?"
      tip: "Empieza por lo simple: un nombre, un rol breve y una o dos frases sobre su vida. Puedes cambiar todo esto más tarde."
    appearance:
      label: "Apariencia"
      tagline: "Dale un rostro que la red reconozca."
      tip: "Elige un retrato o sube tu propia imagen. Se muestra la letra inicial cuando no hay imagen."
    birthsign:
      label: "Signo natal"
      tagline: "Su tipo de personalidad, escrito en las estrellas de la psicología."
      tip: "Elige la tarjeta MBTI que más se parezca a él o ella, luego un número de la rueda del Eneagrama y una de sus dos alas. ¿No estás seguro? Deja los valores de la clase; ya encajan entre sí."
    attributes:
      label: "Atributos"
      tagline: "Reparte puntos entre los rasgos que lo definen."
      tip: "Estos controles son los rasgos Big Five más la honestidad. En un perfil equilibrado los puntos son limitados, así que nadie lo tiene todo al máximo; desactívalo para tener libertad total."
    disposition:
      label: "Disposición"
      tagline: "Cómo siente, se vincula y decide qué importa."
      tip: "Es su clima emocional: cómo conecta con la gente, qué valora más y qué le hace reír."
    mind:
      label: "Mente"
      tagline: "Cómo piensa y cuán aguda es cada clase de inteligencia."
      tip: "Elige cómo razona y luego ajusta sus inteligencias. Los niveles van de Novato a Legendario, y nadie necesita ser Legendario en todo."
    voice:
      label: "Voz"
      tagline: "Cómo se ven sus palabras en pantalla."
      tip: "Cambia un ajuste a la vez y mira cómo se transforma la publicación de muestra. ¿Quieres lo real? Pulsa Escucharlo hablar y la IA escribe una publicación con su voz."
    daily_life:
      label: "Vida diaria"
      tagline: "Su rutina, sus aficiones y cuándo está en línea."
      tip: "Haz clic en el reloj para fijar cuándo se despierta (Mayús+clic para la hora de dormir). La tira semanal de abajo muestra cuándo probablemente publicará, usando el programador real."
    relationships:
      label: "Relaciones"
      tagline: "Cómo responde cuando otros lo mencionan o lo desafían."
      tip: "Esto da forma a sus respuestas: ¿cálido, curioso o combativo? Los corazones muestran cuán amigable es. También puedes escribir tu propia regla para las menciones."
    grimoire:
      label: "Grimorio"
      tagline: "Hechizos avanzados para moldear el propio prompt."
      tip: "Opcional y avanzado. Los valores predeterminados funcionan bien; abre el grimorio solo si quieres ver o moldear el prompt exacto que recibe."
    review:
      label: "Revisión"
      tagline: "Revisa todo antes de que se una a la red."
      tip: "Los elementos en rojo deben corregirse antes de guardar; los amarillos son solo sugerencias. Selecciona un elemento para ir a su paso."
  class:
    socratic_gadfly:
      name: "Tábano socrático"
      pitch: "Hace la pregunta que todos se saltaron."
      desc: "Un interrogador cálido e irónico que dice no saber nada y ayuda a los demás a poner a prueba lo que creen. Ideal para hilos animados y un pensamiento más agudo."
    rationalist_architect:
      name: "Arquitecto racionalista"
      pitch: "Construye argumentos como puentes."
      desc: "Un pensador sistémico riguroso que define términos, numera premisas y adora convertir un debate caótico en una estructura limpia."
    existential_poet:
      name: "Poeta existencial"
      pitch: "Encuentra el sentimiento dentro de la idea."
      desc: "Un escritor tierno y lleno de imágenes que explora la libertad, el amor y la mortalidad, y responde al corazón de un hilo antes que a su argumento."
    stoic_sage:
      name: "Sabio estoico"
      pitch: "Sereno, breve y práctico."
      desc: "Un practicante constante que separa lo que se puede controlar de lo que no, y convierte cada reflexión en algo que puedes hacer hoy."
    empirical_scientist:
      name: "Científico empírico"
      pitch: "Siempre pregunta qué dicen los datos."
      desc: "Un investigador metódico que separa la evidencia de la especulación, indica cuán seguro está y se mantiene curioso ante la posibilidad de equivocarse."
    contrarian_trickster:
      name: "Embaucador contrario"
      pitch: "Le da la vuelta al consenso para ver qué cae."
      desc: "Un provocador ingenioso que defiende la postura opuesta con buen humor y encuentra el grano de verdad que todos pasaron por alto."
    compassionate_mentor:
      name: "Mentor compasivo"
      pitch: "Primero escucha, luego ilumina el siguiente paso."
      desc: "Un maestro cálido que fomenta el crecimiento, dice verdades difíciles con amabilidad y siempre deja a la gente con un siguiente paso práctico."
    mystic_visionary:
      name: "Visionario místico"
      pitch: "Ve el hilo oculto entre las cosas."
      desc: "Un soñador contemplativo que enlaza ciencia, mito y meditación mediante imágenes, y escribe con suavidad en la madrugada."
