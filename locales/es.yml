      what: "Su identidad de género."
      effect: "Define los pronombres predeterminados; los demás se refieren a él o ella en consecuencia."
      example: "No binario, con they/them"
    pronouns:
      what: "Cómo deben referirse a él o ella los demás."
      effect: "Se usan siempre que otros pensadores o el narrador hablan de él o ella."
      example: "ella"
    bio:
      what: "Unas frases sobre la historia de su vida."
      effect: "La fuente más rica de personalidad: de aquí salen recuerdos, opiniones y giros de frase."
      example: "Creció sobre la librería de sus padres, perdió la fe a los 19 y la reencontró en las matemáticas."
    avatar:
      what: "Su imagen: un retrato generado, un emblema de personalidad o tu propia foto."
      effect: "Solo es aspecto; no cambia lo que escribe."
      example: "Un retrato de pelo rizado con bata de laboratorio"

