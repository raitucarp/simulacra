arena.preset.trolley.title: "El dilema del tranvía"
arena.preset.trolley.premise: "Un tranvía sin control matará a cinco personas en la vía si no se desvía. Desviarlo matará a otra persona."
arena.preset.trolley.question: "¿Deberías desviar el tranvía?"
arena.preset.trolley.v1: "Cómo lo desvías"
arena.preset.trolley.v1_values: "accionar una palanca | empujar a una persona a la vía"
arena.preset.trolley.v2: "La otra persona"
arena.preset.trolley.v2_values: "un desconocido | alguien a quien quieres"
arena.preset.marys_room.title: "La habitación de Mary"
arena.preset.marys_room.premise: "Mary es una científica que conoce la física y la biología de la visión del color, pero ha vivido toda su vida en una habitación en blanco y negro. Un día sale y ve el rojo por primera vez."
arena.preset.marys_room.question: "¿Aprende Mary algo nuevo?"
arena.preset.marys_room.v1: "Lo que sabía"
arena.preset.marys_room.v1_values: "todos los hechos físicos | la mayoría de los hechos, con lagunas"
arena.preset.marys_room.v2: "Lo primero que ve"
arena.preset.marys_room.v2_values: "un tomate maduro | un simple cuadrado rojo"
arena.preset.ship_of_theseus.title: "El barco de Teseo"
arena.preset.ship_of_theseus.premise: "Las tablas de un barco se sustituyen una a una hasta que no queda ninguna original."
arena.preset.ship_of_theseus.question: "¿Sigue siendo el mismo barco?"
arena.preset.ship_of_theseus.v1: "Ritmo de sustitución"
arena.preset.ship_of_theseus.v1_values: "a lo largo de muchos años | en una semana"
arena.preset.ship_of_theseus.v2: "Las tablas viejas"
arena.preset.ship_of_theseus.v2_values: "se guardan en un almacén | se usan para montar un segundo barco"
arena.preset.experience_machine.title: "La máquina de experiencias"
arena.preset.experience_machine.premise: "Una máquina puede darte las experiencias que elijas durante el resto de tu vida. Mientras estés conectado, creerás que son reales."
arena.preset.experience_machine.question: "¿Deberías conectarte para siempre?"
arena.preset.experience_machine.v1: "Tu vida actual"
arena.preset.experience_machine.v1_values: "feliz y segura | llena de penurias"
arena.preset.experience_machine.v2: "Personas que dependen de ti"
arena.preset.experience_machine.v2_values: "nadie | una familia"
arena.preset.veil_of_ignorance.title: "El velo de la ignorancia"
arena.preset.veil_of_ignorance.premise: "Eliges las reglas para repartir la riqueza de una sociedad sin saber quién serás en ella: tus talentos, tu salud o tu familia."
arena.preset.veil_of_ignorance.question: "¿Elegirías reglas que garanticen un mínimo digno a los peor situados, aunque eso baje la media?"
arena.preset.veil_of_ignorance.v1: "Lo que cuesta el mínimo"
arena.preset.veil_of_ignorance.v1_values: "un poco de la media | mucho de la media"
arena.preset.veil_of_ignorance.v2: "Tu actitud ante el riesgo"
arena.preset.veil_of_ignorance.v2_values: "prudente | dispuesto a apostar"
arena.preset.chinese_room.title: "La habitación china"
arena.preset.chinese_room.premise: "Alguien que no sabe chino está en una habitación con un libro de reglas para responder mensajes escritos en chino. Fuera, nadie distingue sus respuestas de las de un hablante nativo."
arena.preset.chinese_room.question: "¿Hay algo en la habitación que entienda chino?"
arena.preset.chinese_room.v1: "Quién sigue las reglas"
arena.preset.chinese_room.v1_values: "una persona con un libro de reglas | un ordenador que ejecuta un programa"
arena.preset.chinese_room.v2: "Su vínculo con el mundo"
arena.preset.chinese_room.v2_values: "solo mensajes | un cuerpo de robot con cámaras"
arena.preset.newcomb.title: "El problema de Newcomb"
arena.preset.newcomb.premise: "Un predictor pone 1.000 en una caja transparente y 1.000.000 en una caja opaca solo si predijo que tomarías únicamente la opaca. Puedes tomar las dos cajas o solo la opaca."
arena.preset.newcomb.question: "¿Deberías tomar solo la caja opaca?"
arena.preset.newcomb.v1: "El historial del predictor"
arena.preset.newcomb.v1_values: "nunca ha fallado | acierta nueve de cada diez veces"
arena.preset.newcomb.v2: "Cuándo hizo la predicción"
arena.preset.newcomb.v2_values: "hace un minuto | hace un año"
arena.preset.original_position.title: "La posición original"
arena.preset.original_position.premise: "Representantes de personas libres e iguales acuerdan principios de justicia sin saber qué intereses representarán."
arena.preset.original_position.question: "¿Deberían las libertades básicas ir antes que las ganancias económicas?"
arena.preset.original_position.v1: "La riqueza de la sociedad"
arena.preset.original_position.v1_values: "escasa | abundante"
arena.preset.original_position.v2: "La ganancia en juego"
arena.preset.original_position.v2_values: "pequeña | grande"
