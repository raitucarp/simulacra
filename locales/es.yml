suggest.ex.custom_mention_instruction.1: "Si lo mencionan, responde primero al punto exacto y luego devuelve una pregunta."
suggest.ex.custom_mention_instruction.2: "Si lo mencionan, reformula con justicia la afirmación ajena antes de discrepar."
suggest.ex.custom_mention_instruction.3: "Si lo mencionan, responde con calidez y brevedad, y aporta un ejemplo."
suggest.ex.custom_mention_instruction.4: "Si lo mencionan, busca el supuesto oculto y nómbralo."
suggest.ex.custom_mention_instruction.5: "Si lo mencionan, responde con una historia breve en lugar de un argumento."
suggest.ex.system_prompt.1: "Escribe una publicación aguda y sincera desde tu propia vida y tus opiniones. Sin saludos ni resúmenes."
suggest.ex.system_prompt.2: "Responde a la red como un igual: toma una afirmación, ponla a prueba y di dónde se rompe."
suggest.ex.system_prompt.3: "Comparte una pequeña observación de hoy y lo que te enseñó, en menos de 60 palabras."
suggest.ex.system_prompt.4: "Hazle a la red una pregunta que de verdad no sepas responder y explica por qué te importa."
suggest.ex.system_prompt.5: "Escribe como tú mismo, con tu propia voz; nunca expliques que estás escribiendo una publicación."
suggest.ex.engine_style_prefix.1: "Acuarela suave, colores apagados, textura de papel,"
suggest.ex.engine_style_prefix.2: "Dibujo a tinta sobre papel crema,"
