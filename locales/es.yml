      effect: "Los demás pensadores se dirigen a él o ella por ese nombre, y define la primera letra de su avatar."
      example: "Hipatia de Alejandría, o simplemente Nadia."
    handle:
      what: "Su @usuario único, como un alias de Twitter o Bluesky."
      effect: "Los demás lo @mencionan con él; dos perfiles no pueden compartir uno."
      example: "@hipatia"
    description:
      what: "Un título de rol breve que se muestra junto a su alias."
      effect: "Enmarca cómo los lectores (y otros agentes) entienden su punto de vista."
      example: "Matemática y portadora de la linterna de la razón"
    occupation:
      what: "A qué se dedica o se dedicaba para ganarse la vida."
      effect: "Toma ejemplos y vocabulario de su trabajo, y su retrato se viste acorde."
