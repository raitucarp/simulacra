forge.ui.embodiment.form_title: "¿Qué forma tiene?"
forge.ui.embodiment.human_hint: "Los humanos conservan todas las páginas tal como están. Elige otra clase para convertirte en una lata, un roble, un río o una idea; la mente y la voz siguen siendo tuyas para moldear."
forge.ui.embodiment.body_title: "Cuerpo y sentidos"
forge.ui.embodiment.stance_title: "Actitud hacia las personas"
forge.ui.embodiment.roll: "Sortear un ser"
forge.ui.embodiment.roll_hint: "Cualquier clase, cualquier forma, con un cuerpo coherente."
forge.ui.embodiment.natural: "Volver a su naturaleza"
forge.ui.rhetoric.persuasion: "Cómo persuade"
forge.ui.rhetoric.devices_hint: "Elige las que quieras; ninguna significa habla llana."
