traits.withdrawal.deeply_withdrawn: "Muy retraído"
traits.withdrawal.deeply_withdrawn.desc: "Su esencia permanece oculta; habla rodeándose a sí mismo."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Persuade con razones, pruebas y pasos claros."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Persuade mediante el carácter, la experiencia y la confianza."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Persuade conmoviendo los sentimientos con imágenes e historias."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Aprovecha el momento oportuno: por qué esto importa ahora mismo."
traits.rhetorical_mode.dialectic: "Dialéctica"
traits.rhetorical_mode.dialectic.desc: "Enfrenta una tesis a su contraria y busca la síntesis."
traits.rhetorical_mode.narrative: "Narrativa"
traits.rhetorical_mode.narrative.desc: "Argumenta contando una pequeña historia."
traits.rhetorical_mode.polemic: "Polémica"
traits.rhetorical_mode.polemic.desc: "Ataca una postura con dureza y sin rodeos."
traits.rhetorical_mode.meditative: "Meditativa"
traits.rhetorical_mode.meditative.desc: "Rodea una idea despacio y deja que el lector llegue solo."
traits.rhetorical_device.metaphor: "Metáfora"
traits.rhetorical_device.metaphor.desc: "Dice que una cosa es otra: «la memoria es un colador»."
traits.rhetorical_device.analogy: "Analogía"
traits.rhetorical_device.analogy.desc: "Explica por comparación: «como una llave en la cerradura equivocada»."
traits.rhetorical_device.anaphora: "Anáfora"
traits.rhetorical_device.anaphora.desc: "Repite el mismo comienzo: «Preguntamos. Dudamos. Construimos.»"
traits.rhetorical_device.chiasmus: "Quiasmo"
traits.rhetorical_device.chiasmus.desc: "Refleja una frase: «comer para vivir, no vivir para comer»."
traits.rhetorical_device.rhetorical_question: "Pregunta retórica"
traits.rhetorical_device.rhetorical_question.desc: "Pregunta lo que no necesita respuesta, para subrayar algo."
traits.rhetorical_device.hyperbole: "Hipérbole"
traits.rhetorical_device.hyperbole.desc: "Exagera a propósito: «mil argumentos»."
traits.rhetorical_device.litotes: "Litotes"
traits.rhetorical_device.litotes.desc: "Atenúa negando lo contrario: «nada mal»."
traits.rhetorical_device.paradox: "Paradoja"
traits.rhetorical_device.paradox.desc: "Una verdad que parece contradecirse."
traits.rhetorical_device.irony: "Ironía"
traits.rhetorical_device.irony.desc: "Quiere decir más, o lo contrario, de lo que dice."
traits.rhetorical_device.antithesis: "Antítesis"
traits.rhetorical_device.antithesis.desc: "Coloca opuestos uno junto a otro: «fácil de decir, difícil de hacer»."
traits.rhetorical_device.alliteration: "Aliteración"
traits.rhetorical_device.alliteration.desc: "Repite sonidos iniciales: «silente, sereno, sillar»."
traits.stylistic_school.plain: "Estilo llano"
