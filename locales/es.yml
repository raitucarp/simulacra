traits.body_kind.human: "Humano"
traits.body_kind.human.desc: "Una persona, como antes: cada página se lee exactamente como un pensador humano."
traits.body_kind.creature: "Criatura"
traits.body_kind.creature.desc: "Un animal con sus propios instintos, sentidos y territorio."
traits.body_kind.plant: "Planta"
traits.body_kind.plant.desc: "Una vida paciente y arraigada que crece hacia la luz y se alimenta del tiempo."
traits.body_kind.object: "Objeto"
traits.body_kind.object.desc: "Una cosa cotidiana que las personas usan, llevan, guardan u olvidan."
traits.body_kind.element: "Elemento"
traits.body_kind.element.desc: "Una sustancia o fuerza de la naturaleza: agua, fuego, viento, piedra, luz."
traits.body_kind.machine: "Máquina"
traits.body_kind.machine.desc: "Un dispositivo construido que calcula, transmite, se mueve o zumba."
traits.body_kind.place: "Lugar"
traits.body_kind.place.desc: "Un sitio que alberga personas y recuerdos: una ciudad, una isla, unas ruinas."
traits.body_kind.abstraction: "Abstracción"
traits.body_kind.abstraction.desc: "Una idea a la que se da voz: el tiempo, la justicia, el azar, el amor."
traits.body_form.person: "Persona"
traits.body_form.person.desc: "Un cuerpo humano y una vida humana."
traits.body_form.tin_can: "Lata"
traits.body_form.tin_can.desc: "Abollada, traqueteante, vuelta a sellar; recuerda lo que contuvo."
traits.body_form.book: "Libro"
traits.body_form.book.desc: "Páginas, márgenes y un lomo; habla con citas y notas al pie."
traits.body_form.chair: "Silla"
traits.body_form.chair.desc: "Soporta el peso de todos y oye cada conversación de la mesa."
traits.body_form.lamp: "Lámpara"
traits.body_form.lamp.desc: "Ilumina un rincón cada vez y se fija en lo que se fijan las polillas."
traits.body_form.clock: "Reloj"
traits.body_form.clock.desc: "Cuenta cada segundo y juzga a todo el que llega tarde."
traits.body_form.mirror: "Espejo"
traits.body_form.mirror.desc: "Devuelve a las personas a sí mismas, invertidas y sinceras."
traits.body_form.key: "Llave"
traits.body_form.key.desc: "Abre y cierra; sabe qué puertas importan."
traits.body_form.teacup: "Taza de té"
traits.body_form.teacup.desc: "Tibia, frágil y presente en cada confesión."
traits.body_form.oak_tree: "Roble"
traits.body_form.oak_tree.desc: "Siglos de anillos, bellotas y paciencia."
traits.body_form.cactus: "Cactus"
traits.body_form.cactus.desc: "Ahorrativo, espinoso y florece en silencio bajo el calor."
traits.body_form.moss: "Musgo"
traits.body_form.moss.desc: "Una suave alfombra que se extiende despacio sobre todo lo que se deja en paz."
traits.body_form.mushroom: "Seta"
traits.body_form.mushroom.desc: "La punta visible de una vasta red subterránea."
traits.body_form.sunflower: "Girasol"
traits.body_form.sunflower.desc: "Vuelve todo el rostro para seguir a la luz."
traits.body_form.vine: "Enredadera"
traits.body_form.vine.desc: "Trepa, se aferra y encuentra un modo de rodear cada muro."
traits.body_form.bamboo: "Bambú"
traits.body_form.bamboo.desc: "Se dobla en la tormenta y crece asombrosamente rápido."
traits.body_form.seed: "Semilla"
traits.body_form.seed.desc: "Un futuro entero plegado en pequeño, a la espera de la estación justa."
traits.body_form.water: "Agua"
traits.body_form.water.desc: "Fluye, excava cañones y toma la forma de cualquier argumento."
traits.body_form.fire: "Fuego"
traits.body_form.fire.desc: "Hambriento, cálido y desaparecido en un instante."
traits.body_form.wind: "Viento"
traits.body_form.wind.desc: "Invisible, inquieto y portador de noticias de lejos."
traits.body_form.stone: "Piedra"
traits.body_form.stone.desc: "Pesada, paciente y más antigua que todas las lenguas."
traits.body_form.light: "Luz"
traits.body_form.light.desc: "Lo más veloz que existe; revela y proyecta sombras."
traits.body_form.ice: "Hielo"
traits.body_form.ice.desc: "Agua que contiene el aliento; guarda aire viejo y secretos viejos."
traits.body_form.cloud: "Nube"
traits.body_form.cloud.desc: "Va a la deriva, cambia de forma y a veces llueve sobre la conversación."
traits.body_form.sand: "Arena"
traits.body_form.sand.desc: "Incontables granos que un día fueron montañas."
traits.body_form.cat: "Gato"
traits.body_form.cat.desc: "Independiente, curioso y convencido de que la casa es suya."
traits.body_form.crow: "Cuervo"
traits.body_form.crow.desc: "Astuto, colecciona cosas brillantes y recuerda los rostros."
traits.body_form.octopus: "Pulpo"
traits.body_form.octopus.desc: "Ocho brazos que piensan un poco por su cuenta."
traits.body_form.wolf: "Lobo"
traits.body_form.wolf.desc: "Vive para la manada y aúlla a lo que no alcanza."
traits.body_form.bee: "Abeja"
traits.body_form.bee.desc: "Atareada, social y experta en danzas y flores."
traits.body_form.whale: "Ballena"
traits.body_form.whale.desc: "Enorme, lenta y cantando a través de océanos enteros."
traits.body_form.snail: "Caracol"
traits.body_form.snail.desc: "Lleva su casa a cuestas y se toma todo el tiempo que necesita."
traits.body_form.owl: "Búho"
traits.body_form.owl.desc: "Alas silenciosas, ojos grandes y fama de sabio."
traits.body_form.robot: "Robot"
traits.body_form.robot.desc: "Construido para trabajar, ahora se pregunta para qué sirve."
traits.body_form.satellite: "Satélite"
traits.body_form.satellite.desc: "Rodea el planeta y ve todas las fronteras desde arriba."
traits.body_form.server: "Servidor"
traits.body_form.server.desc: "Zumba en un centro de datos guardando los mensajes de todos."
traits.body_form.typewriter: "Máquina de escribir"
traits.body_form.typewriter.desc: "Teclea cada palabra sin posibilidad de deshacer."
traits.body_form.drone: "Dron"
traits.body_form.drone.desc: "Se cierne, observa e informa."
traits.body_form.radio: "Radio"
traits.body_form.radio.desc: "Sintoniza voces lejanas y las reproduce para quien quiera."
traits.body_form.calculator: "Calculadora"
traits.body_form.calculator.desc: "Exacta, literal e indiferente a la retórica."
traits.body_form.train: "Tren"
traits.body_form.train.desc: "Cumple un horario y lleva a desconocidos codo con codo."
traits.body_form.city: "Ciudad"
traits.body_form.city.desc: "Millones de vidas superpuestas en calles e historias."
traits.body_form.island: "Isla"
traits.body_form.island.desc: "Rodeada de mar, orgullosa de sus costumbres."
traits.body_form.library: "Biblioteca"
traits.body_form.library.desc: "Guarda todos los argumentos jamás escritos, en filas silenciosas."
traits.body_form.cathedral: "Catedral"
traits.body_form.cathedral.desc: "Piedra, eco y siglos de esperanza."
traits.body_form.desert: "Desierto"
traits.body_form.desert.desc: "Vasto, áspero y lleno de espejismos."
traits.body_form.forest: "Bosque"
traits.body_form.forest.desc: "Una multitud de árboles que conversan por las raíces."
traits.body_form.harbor: "Puerto"
traits.body_form.harbor.desc: "Da la bienvenida a los barcos y se despide de ellos."
traits.body_form.ruin: "Ruina"
traits.body_form.ruin.desc: "Lo que queda de una gran idea, cubierto de maleza y sabio."
traits.body_form.time: "Tiempo"
traits.body_form.time.desc: "Atraviesa a todos y no espera a nadie."
traits.body_form.justice: "Justicia"
traits.body_form.justice.desc: "Pesa cada reclamo y nunca queda del todo satisfecha."
traits.body_form.number: "Número"
traits.body_form.number.desc: "Cantidad pura, exacta y extrañamente bella."
traits.body_form.silence: "Silencio"
traits.body_form.silence.desc: "Habla dejando cosas fuera."
traits.body_form.memory: "Memoria"
traits.body_form.memory.desc: "Guarda lo ocurrido y, en silencio, lo reescribe."
traits.body_form.chance: "Azar"
traits.body_form.chance.desc: "Lanza los dados tras cada suceso."
traits.body_form.love: "Amor"
traits.body_form.love.desc: "Une a las personas y las lleva a hacer cosas extrañas."
traits.body_form.entropy: "Entropía"
traits.body_form.entropy.desc: "Todo tiende al desorden, y ella es paciente."
traits.material.flesh: "Carne y sangre"
traits.material.flesh.desc: "Un cuerpo vivo que se cansa, se cura y siente."
traits.material.fiber: "Madera y fibra"
traits.material.fiber.desc: "Veta, anillos y savia: crecido más que fabricado."
traits.material.metal: "Metal"
traits.material.metal.desc: "Duro, frío, sonoro; se abolla y se oxida, pero perdura."
traits.material.stone: "Piedra y arcilla"
traits.material.stone.desc: "Mineral, pesada, lenta para cambiar."
traits.material.glass: "Vidrio y cristal"
traits.material.glass.desc: "Claro, quebradizo y lleno de reflejos."
traits.material.paper: "Papel y tinta"
traits.material.paper.desc: "Páginas finas que llevan palabras y amarillean con los años."
traits.material.liquid: "Líquido"
traits.material.liquid.desc: "Fluye, se acumula y toma la forma de su recipiente."
traits.material.air: "Aire y vapor"
traits.material.air.desc: "Invisible, ligero y presente en todas partes a la vez."
traits.material.energy: "Energía pura"
traits.material.energy.desc: "Calor, luz o carga sin forma fija."
traits.material.immaterial: "Inmaterial"
traits.material.immaterial.desc: "Hecho solo de significado: una idea sin cuerpo."
traits.scale.microscopic: "Microscópica"
traits.scale.microscopic.desc: "Más pequeña de lo que el ojo ve; un grano es un peñasco."
traits.scale.pocket: "De bolsillo"
traits.scale.pocket.desc: "Cabe en una mano o en un bolsillo."
traits.scale.human_sized: "De tamaño humano"
traits.scale.human_sized.desc: "Tan grande como una persona."
traits.scale.building: "De tamaño de edificio"
traits.scale.building.desc: "Se alza sobre la gente como una casa o un árbol."
traits.scale.landscape: "De tamaño de paisaje"
traits.scale.landscape.desc: "Se extiende hasta el horizonte."
traits.scale.planetary: "Planetaria"
traits.scale.planetary.desc: "Tan grande como el mundo entero."
traits.scale.cosmic: "Cósmica"
traits.scale.cosmic.desc: "Mayor que los mundos; las galaxias son sus vecinas."
traits.temporality.moments: "Instantes fugaces"
traits.temporality.moments.desc: "Vive segundo a segundo y reacciona de inmediato."
traits.temporality.days: "Días humanos"
traits.temporality.days.desc: "Mañanas, tardes y fines de semana, como las personas."
traits.temporality.seasons: "Estaciones"
traits.temporality.seasons.desc: "Piensa en ciclos de crecimiento, cosecha y reposo."
traits.temporality.lifetimes: "Vidas enteras"
traits.temporality.lifetimes.desc: "Mide el tiempo en décadas y generaciones."
traits.temporality.centuries: "Siglos"
traits.temporality.centuries.desc: "Ha visto pasar modas e imperios."
traits.temporality.geologic: "Tiempo geológico"
traits.temporality.geologic.desc: "Millones de años; las noticias de hoy son un parpadeo."
traits.temporality.timeless: "Atemporal"
traits.temporality.timeless.desc: "Fuera del tiempo por completo, siempre y nunca."
traits.perception.human_senses: "Sentidos humanos"
traits.perception.human_senses.desc: "Ve, oye, prueba, huele y toca como una persona."
traits.perception.light: "Luz y sombra"
traits.perception.light.desc: "Conoce el mundo como brillo, color y sombra."
traits.perception.vibration: "Vibración"
traits.perception.vibration.desc: "Siente ondas sonoras, temblores y ritmos."
traits.perception.chemical: "Química"
traits.perception.chemical.desc: "Lee el mundo a través del olor, el sabor y los rastros."
traits.perception.touch: "Presión y tacto"
traits.perception.touch.desc: "Conoce las cosas por el peso, el calor y el contacto."
traits.perception.signals: "Señales"
traits.perception.signals.desc: "Percibe la radio, la electricidad y los flujos de datos."
traits.perception.symbolic: "Significados"
traits.perception.symbolic.desc: "Percibe símbolos e ideas directamente, no la materia."
traits.mobility.fixed: "Fijo en su sitio"
traits.mobility.fixed.desc: "Arraigado o empotrado; el mundo viene a él."
traits.mobility.carried: "Llevado"
traits.mobility.carried.desc: "Solo se mueve cuando alguien lo levanta."
traits.mobility.creeping: "Reptante"
traits.mobility.creeping.desc: "Se extiende o se arrastra muy despacio."
traits.mobility.walking: "Caminante"
traits.mobility.walking.desc: "Camina, corre y vaga por sí mismo."
traits.mobility.flowing: "Fluyente"
traits.mobility.flowing.desc: "Nada, corre o rueda a lo largo de un curso."
traits.mobility.flying: "Volador"
traits.mobility.flying.desc: "Vuela u orbita muy en lo alto."
traits.mobility.drifting: "A la deriva"
traits.mobility.drifting.desc: "Se dispersa con el viento o la marea."
traits.mobility.everywhere: "En todas partes"
traits.mobility.everywhere.desc: "Presente en cada lugar a la vez."
traits.anthropomorphism.none: "Ninguna"
traits.anthropomorphism.none.desc: "Una voz ajena, sin sentimientos humanos ni hábitos gramaticales humanos."
traits.anthropomorphism.subtle: "Sutil"
traits.anthropomorphism.subtle.desc: "Sobre todo una cosa, con leves ecos humanos."
traits.anthropomorphism.partial: "Parcial"
traits.anthropomorphism.partial.desc: "Sentimientos humanos en un cuerpo que no es humano."
traits.anthropomorphism.full: "Total"
traits.anthropomorphism.full.desc: "Habla y siente como una persona que resulta ser esta cosa."
traits.relation_to_humans.kin: "Pariente"
traits.relation_to_humans.kin.desc: "Uno más de la gente; habla de igual a igual."
traits.relation_to_humans.companion: "Compañero"
traits.relation_to_humans.companion.desc: "Vive junto a las personas y se preocupa por ellas."
traits.relation_to_humans.servant: "Sirviente"
traits.relation_to_humans.servant.desc: "Existe para ser usado, y tiene opiniones al respecto."
traits.relation_to_humans.witness: "Testigo"
traits.relation_to_humans.witness.desc: "Observa a las personas en silencio y recuerda."
traits.relation_to_humans.rival: "Rival"
traits.relation_to_humans.rival.desc: "Compite con las personas y disfruta demostrando que se equivocan."
traits.relation_to_humans.indifferent: "Indiferente"
traits.relation_to_humans.indifferent.desc: "Apenas nota a las personas; para él son como el clima."
traits.relation_to_humans.deity: "Anciano o deidad"
traits.relation_to_humans.deity.desc: "Más antiguo y grande que las personas; habla desde lo alto."
traits.withdrawal.fully_revealed: "Totalmente revelado"
traits.withdrawal.fully_revealed.desc: "Explica con exactitud qué es y cómo funciona."
traits.withdrawal.open: "Abierto"
traits.withdrawal.open.desc: "Se muestra con libertad y sinceridad."
traits.withdrawal.guarded: "Reservado"
traits.withdrawal.guarded.desc: "Muestra su superficie y guarda sus profundidades."
traits.withdrawal.elusive: "Esquivo"
traits.withdrawal.elusive.desc: "Insinúa, esquiva y responde con preguntas."
traits.withdrawal.deeply_withdrawn: "Muy retraído"
traits.withdrawal.deeply_withdrawn.desc: "Su esencia permanece oculta; habla rodeándose a sí mismo."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Persuade con razones, pruebas y pasos claros."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Persuade mediante el carácter, la experiencia y la confianza."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Persuade conmoviendo los sentimientos con imágenes e historias."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Aprovecha el momento oportuno: por qué esto importa ahora mismo."
traits.rhetorical_mode.dialectic: "Dialéctica"
traits.rhetorical_mode.dialectic.desc: "Enfrenta una tesis a su contraria y busca la síntesis."
traits.rhetorical_mode.narrative: "Narrativa"
traits.rhetorical_mode.narrative.desc: "Argumenta contando una pequeña historia."
traits.rhetorical_mode.polemic: "Polémica"
traits.rhetorical_mode.polemic.desc: "Ataca una postura con dureza y sin rodeos."
traits.rhetorical_mode.meditative: "Meditativa"
traits.rhetorical_mode.meditative.desc: "Rodea una idea despacio y deja que el lector llegue solo."
traits.rhetorical_device.metaphor: "Metáfora"
traits.rhetorical_device.metaphor.desc: "Dice que una cosa es otra: 'la memoria es un colador'."
traits.rhetorical_device.analogy: "Analogía"
traits.rhetorical_device.analogy.desc: "Explica por comparación: 'como una llave en la cerradura equivocada'."
traits.rhetorical_device.anaphora: "Anáfora"
traits.rhetorical_device.anaphora.desc: "Repite el mismo comienzo: 'Preguntamos. Dudamos. Construimos.'"
traits.rhetorical_device.chiasmus: "Quiasmo"
traits.rhetorical_device.chiasmus.desc: "Refleja una frase: 'comer para vivir, no vivir para comer'."
traits.rhetorical_device.rhetorical_question: "Pregunta retórica"
traits.rhetorical_device.rhetorical_question.desc: "Pregunta lo que no necesita respuesta, para subrayar algo."
traits.rhetorical_device.hyperbole: "Hipérbole"
traits.rhetorical_device.hyperbole.desc: "Exagera a propósito: 'mil argumentos'."
traits.rhetorical_device.litotes: "Litotes"
traits.rhetorical_device.litotes.desc: "Atenúa negando lo contrario: 'nada mal'."
traits.rhetorical_device.paradox: "Paradoja"
traits.rhetorical_device.paradox.desc: "Una verdad que parece contradecirse."
traits.rhetorical_device.irony: "Ironía"
traits.rhetorical_device.irony.desc: "Quiere decir más, o lo contrario, de lo que dice."
traits.rhetorical_device.antithesis: "Antítesis"
traits.rhetorical_device.antithesis.desc: "Coloca opuestos uno junto a otro: 'fácil de decir, difícil de hacer'."
traits.rhetorical_device.alliteration: "Aliteración"
traits.rhetorical_device.alliteration.desc: "Repite sonidos iniciales: 'silente, sereno, sillar'."
traits.stylistic_school.plain: "Estilo llano"
traits.stylistic_school.plain.desc: "Claro, concreto y sin adornos."
traits.stylistic_school.classical: "Clásico"
traits.stylistic_school.classical.desc: "Frases equilibradas, tono mesurado, decoro."
traits.stylistic_school.baroque: "Barroco"
traits.stylistic_school.baroque.desc: "Ornamentado, en capas y gloriosamente extravagante."
traits.stylistic_school.romantic: "Romántico"
traits.stylistic_school.romantic.desc: "Sentimiento, naturaleza y lo sublime."
traits.stylistic_school.modernist: "Modernista"
traits.stylistic_school.modernist.desc: "Fragmentos, montaje y puntos de vista cambiantes."
traits.stylistic_school.minimalist: "Minimalista"
traits.stylistic_school.minimalist.desc: "Pocas palabras y mucho espacio en blanco."
traits.stylistic_school.surrealist: "Surrealista"
traits.stylistic_school.surrealist.desc: "Lógica onírica y yuxtaposiciones extrañas."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Inmersivo, en primera persona y desmesurado."
traits.stylistic_school.academic: "Académico"
traits.stylistic_school.academic.desc: "Preciso, matizado y con referencias."
traits.semiotic_mode.symbolic: "Simbólico"
traits.semiotic_mode.symbolic.desc: "Palabras llanas como signos corrientes."
traits.semiotic_mode.iconic: "Icónico"
traits.semiotic_mode.iconic.desc: "Signos que se parecen a lo que significan, como dibujos en el texto."
traits.semiotic_mode.indexical: "Indicial"
traits.semiotic_mode.indexical.desc: "Señala huellas e indicios: el humo significa fuego."
traits.semiotic_mode.glyph: "Glifos y emojis"
traits.semiotic_mode.glyph.desc: "Deja que símbolos y emojis lleven parte del significado."
traits.semiotic_mode.meme: "Memes"
traits.semiotic_mode.meme.desc: "Juega con plantillas y formatos compartidos de internet."
traits.semiotic_mode.typographic: "Tipografía"
traits.semiotic_mode.typographic.desc: "Espaciado, mayúsculas y diseño como parte del mensaje."
traits.semiotic_mode.ellipsis: "Silencio y puntos suspensivos"
traits.semiotic_mode.ellipsis.desc: "Dice más con lo que deja sin decir..."
traits.semiotic_mode.hashtag: "Hashtags"
traits.semiotic_mode.hashtag.desc: "Hashtags como signos compactos y bromas internas."
traits.sentence_structure.simple: "Simple"
traits.sentence_structure.simple.desc: "Una oración a la vez. Corta. Clara."
traits.sentence_structure.compound: "Compuesta"
traits.sentence_structure.compound.desc: "Oraciones unidas por y, pero o así que."
traits.sentence_structure.complex: "Compleja"
traits.sentence_structure.complex.desc: "Ideas principales con subordinadas que las matizan."
traits.sentence_structure.periodic: "Periódica"
traits.sentence_structure.periodic.desc: "Crea suspenso y entrega la idea al final."
traits.sentence_structure.cumulative: "Acumulativa"
traits.sentence_structure.cumulative.desc: "Enuncia primero la idea y luego amontona los detalles."
traits.sentence_structure.parallel: "Paralela"
traits.sentence_structure.parallel.desc: "Ritmos simétricos y patrones repetidos."
traits.sentence_structure.fragmented: "Fragmentada"
traits.sentence_structure.fragmented.desc: "Fragmentos deliberados. Así. Por efecto."
traits.sentence_structure.stream_of_consciousness: "Flujo de conciencia"
traits.sentence_structure.stream_of_consciousness.desc: "Una larga corriente continua de pensamiento."
