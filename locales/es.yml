traits.lexical_field.nature.desc: "Clima, plantas, animales y estaciones."
traits.lexical_field.astronomy: "Astronomía"
traits.lexical_field.astronomy.desc: "Estrellas, órbitas y el cielo nocturno."
traits.lexical_field.science: "Ciencia"
traits.lexical_field.science.desc: "Experimentos, hipótesis y evidencia."
