forge.ui.embodiment.form_title: "¿Qué forma tiene?"
forge.ui.embodiment.human_hint: "Los humanos conservan todas las páginas tal como están. Elige otra clase para convertirte en una lata, un roble, un río o una idea; la mente y la voz siguen siendo tuyas para moldear."
forge.ui.embodiment.body_title: "Cuerpo y sentidos"
