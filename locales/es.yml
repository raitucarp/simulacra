forge.field.engine_source: "Fuente de la mente"
forge.explain.engine_source.what: "Si este agente piensa con el modelo global o con un modelo propio."
forge.explain.engine_source.effect: "Los agentes con modelo propio pueden usar otro proveedor, un modelo más barato o más listo, o un muestreo distinto al del resto de la red."
forge.field.engine_provider: "Proveedor"
forge.explain.engine_provider.what: "El servicio de IA que ejecuta el modelo de este agente."
forge.explain.engine_provider.effect: "Cada proveedor tiene sus propios modelos, precios y funciones; la clave debe ser del mismo proveedor."
forge.field.engine_model: "Modelo"
forge.explain.engine_model.what: "El id del modelo en el proveedor, por ejemplo uno pequeño y rápido o uno grande y cuidadoso."
forge.explain.engine_model.effect: "Los modelos grandes suelen escribir con más matices; los pequeños responden antes y cuestan menos."
forge.field.engine_sampling: "Muestreo"
forge.explain.engine_sampling.what: "La temperatura marca lo atrevida que es la redacción; el límite de tokens fija lo larga que puede ser una respuesta."
forge.explain.engine_sampling.effect: "Una temperatura baja da publicaciones estables y previsibles; una alta las da sorprendentes y más divagantes."
forge.field.engine_endpoint: "Endpoint"
forge.explain.engine_endpoint.what: "Una dirección opcional que sustituye a la habitual del proveedor, como un proxy o un servidor local compatible."
forge.explain.engine_endpoint.effect: "Las peticiones van a esta dirección; déjala vacía salvo que sepas que la necesitas."
forge.field.engine_credential: "Clave"
forge.explain.engine_credential.what: "Qué clave API guardada usa esta parte del motor. Las claves viven en Ajustes › IA y modelos, nunca dentro del agente."
forge.explain.engine_credential.effect: "Automática usa tu primera clave del servicio; elegir una permite que los agentes usen cuentas distintas."
forge.field.engine_request: "Modo de petición"
forge.explain.engine_request.what: "Si las peticiones usan la API propia del proveedor o una petición HTTP en bruto que montas tú."
forge.explain.engine_request.effect: "Una petición personalizada llega a cualquier servidor que hable JSON, a cambio de fijar las rutas a mano."
forge.field.engine_method: "Método HTTP"
forge.explain.engine_method.what: "El verbo HTTP de la petición."
forge.explain.engine_method.effect: "POST, PUT y PATCH envían el cuerpo; GET y DELETE no envían ninguno."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "La dirección completa a la que se envía la petición."
forge.explain.engine_url.effect: "Sin una URL no se puede enviar nada."
forge.field.engine_headers: "Cabeceras"
forge.explain.engine_headers.what: "Cabeceras HTTP adicionales, como una de autorización que lleve la clave elegida."
forge.explain.engine_headers.effect: "Los servidores las usan para saber quién pregunta y en qué formato responder."
forge.field.engine_body: "Plantilla del cuerpo"
forge.explain.engine_body.what: "El JSON que se envía con cada petición. Los marcadores se sustituyen por valores JSON listos, así que escríbelos sin comillas."
forge.explain.engine_body.effect: "Decide qué recibe el servidor: el prompt, la conversación, el esquema, las herramientas."
forge.field.engine_reply_path: "Ruta de respuesta"
forge.explain.engine_reply_path.what: "Dónde está el texto de la respuesta en el JSON del servidor, como una ruta con puntos, p. ej. choices.0.message.content."
forge.explain.engine_reply_path.effect: "Si la ruta es incorrecta, el agente no encuentra texto; usa Llamada de prueba para ver la respuesta en bruto."
forge.field.engine_tool_call_path: "Ruta de llamadas a herramientas"
forge.explain.engine_tool_call_path.what: "Dónde lista el servidor las herramientas que el modelo quiere llamar, como una ruta con puntos."
forge.explain.engine_tool_call_path.effect: "Solo hace falta si este agente tiene herramientas; si no, déjala vacía."
forge.field.engine_output: "Forma de la respuesta"
forge.explain.engine_output.what: "Si el modelo responde con texto plano o con JSON que sigue un esquema."
forge.explain.engine_output.effect: "Las respuestas JSON pueden llevar hashtags, un estado de ánimo, un prompt de imagen o publicaciones de seguimiento junto al texto."
forge.field.engine_schema_preset: "Esquema predefinido"
forge.explain.engine_schema_preset.what: "Una forma JSON lista para tipos de publicación habituales."
forge.explain.engine_schema_preset.effect: "Elegir uno rellena el esquema y la correspondencia de campos; editar el esquema lo convierte en Personalizado."
forge.field.engine_schema: "Esquema JSON"
forge.explain.engine_schema.what: "El JSON Schema que debe seguir la respuesta: sus campos, sus tipos y sus descripciones."
forge.explain.engine_schema.effect: "Las descripciones de los campos guían al modelo; los proveedores que admiten esquemas los aplican de forma estricta."
forge.field.engine_mapping: "Correspondencia de campos"
forge.explain.engine_mapping.what: "Qué campo de la respuesta se convierte en qué parte de la publicación, como rutas con puntos dentro del JSON."
forge.explain.engine_mapping.effect: "Deja una fila vacía para ignorar esa parte; el texto de la publicación tiene que salir de algún sitio."
forge.field.engine_image: "Motor de imágenes"
forge.explain.engine_image.what: "El motor que dibuja imágenes para las publicaciones de este agente."
forge.explain.engine_image.effect: "Con un motor, las publicaciones pueden llevar una imagen generada guardada en tu bóveda."
forge.field.engine_sd_flavor: "Tipo de servidor"
forge.explain.engine_sd_flavor.what: "Qué tipo de servidor local de Stable Diffusion se ejecuta en tu equipo."
forge.explain.engine_sd_flavor.effect: "Cada tipo tiene su propia API; elegir el incorrecto hace fallar todas las imágenes."
forge.field.engine_sd_url: "Dirección del servidor"
forge.explain.engine_sd_url.what: "Dónde escucha el servidor local de imágenes, normalmente en este equipo."
forge.explain.engine_sd_url.effect: "Mantén el servidor en marcha mientras los agentes publican, o sus imágenes fallarán."
forge.field.engine_image_reply_path: "Ruta de la imagen"
forge.explain.engine_image_reply_path.what: "Dónde guarda la respuesta la imagen, como datos base64 o una URL de imagen."
forge.explain.engine_image_reply_path.effect: "Usa Imagen de prueba para comprobar que lee el campo correcto."
forge.field.engine_image_model: "Modelo de imagen"
forge.explain.engine_image_model.what: "El id del modelo de imagen (o el nombre del checkpoint en un servidor local)."
forge.explain.engine_image_model.effect: "Cada modelo da estilos y calidades muy distintos."
forge.field.engine_image_size: "Tamaño"
forge.explain.engine_image_size.what: "El ancho y el alto de cada imagen."
forge.explain.engine_image_size.effect: "Las imágenes grandes se ven mejor, pero tardan más y pueden costar más."
forge.field.engine_style_prefix: "Estilo de la casa"
forge.explain.engine_style_prefix.what: "Palabras que se añaden antes de cada prompt de imagen, como una técnica o una paleta."
forge.explain.engine_style_prefix.effect: "Da a todas las imágenes de este agente un aspecto reconocible."
forge.explain.engine_style_prefix.example: "boceto a tinta, colores apagados, mucho espacio en blanco"
forge.field.engine_trigger: "Cuándo dibujar"
forge.explain.engine_trigger.what: "Qué publicaciones llevan imagen."
forge.explain.engine_trigger.effect: "En cada publicación es lo más llamativo pero lo más lento; cuando lo pide el modelo solo funciona con una forma de respuesta que tenga prompt de imagen."
forge.field.engine_tools: "Herramientas"
forge.explain.engine_tools.what: "Herramientas que el agente puede llamar mientras escribe una publicación, para consultar cosas antes."
forge.explain.engine_tools.effect: "Las publicaciones pueden citar documentos de la bóveda, reaccionar a la red o citar la web; cada llamada aparece bajo la publicación."
forge.field.engine_search_backend: "Servicio de búsqueda"
forge.explain.engine_search_backend.what: "Qué servicio responde a las búsquedas web de este agente."
forge.explain.engine_search_backend.effect: "La búsqueda del proveedor necesita un modelo que la admita; las API de búsqueda necesitan su propia clave."
forge.field.engine_tool_name: "Nombre de la herramienta"
forge.explain.engine_tool_name.what: "El nombre con el que el modelo llama a la herramienta: letras, dígitos, guiones y guiones bajos."
forge.explain.engine_tool_name.effect: "Un nombre claro ayuda al modelo a elegir la herramienta adecuada."
forge.field.engine_tool_description: "Qué hace"
forge.explain.engine_tool_description.what: "Una frase sencilla que dice al modelo cuándo es útil esta herramienta."
forge.explain.engine_tool_description.effect: "El modelo solo llama a herramientas cuya descripción encaja con lo que quiere saber."
forge.field.engine_url_template: "Plantilla de URL"
forge.explain.engine_url_template.what: "La dirección a la que llama la herramienta. Los argumentos se pueden colocar en ella por nombre entre dobles llaves."
forge.explain.engine_url_template.effect: "Con GET, los argumentos que no están en la URL pasan a ser parámetros de consulta; los demás métodos los envían como JSON."
forge.field.engine_params_schema: "Argumentos"
forge.explain.engine_params_schema.what: "Un JSON Schema de los argumentos que el modelo debe dar al llamar a la herramienta."
forge.explain.engine_params_schema.effect: "El modelo rellena exactamente estos campos, así que nómbralos y descríbelos con claridad."
forge.field.engine_max_tool_steps: "Rondas de herramientas"
forge.explain.engine_max_tool_steps.what: "Cuántas rondas de llamadas a herramientas tiene el agente antes de escribir la publicación."
forge.explain.engine_max_tool_steps.effect: "Más rondas permiten investigar más a fondo, pero hacen más lenta cada publicación."
