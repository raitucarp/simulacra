forge:
  kind:
    agent: "Agent du réseau"
    persona: "Persona"
  guide:
    name: "Mnemo"
    title: "Mnemo le hibou"
    start_tip: "Hou ! Je suis Mnemo. Choisis une classe pour commencer, lance les dés, ou parle-moi d'eux avec tes propres mots."
    waiting_tip: "Hmm, je lis ta description... laisse-moi un instant."
    cheer_tip: "Hou-ra ! Un nouvel esprit a rejoint la conversation."
  step:
    origin:
      label: "Origine"
      tagline: "Qui sont-ils, et d'où viennent-ils ?"
      tip: "Commence simplement : un nom, un court rôle et une phrase ou deux sur leur vie. Tout cela pourra être modifié plus tard."
    appearance:
      label: "Apparence"
      tagline: "Donne-leur un visage que le réseau reconnaîtra."
      tip: "Choisis un portrait ou importe ta propre image. La lettre initiale s'affiche tant qu'il n'y a pas d'image."
    birthsign:
      label: "Signe de naissance"
      tagline: "Leur type de personnalité, écrit dans les étoiles de la psychologie."
      tip: "Choisis la carte MBTI qui leur ressemble le plus, puis un numéro sur la roue de l'ennéagramme et l'une de ses deux ailes. Pas sûr ? Garde les valeurs par défaut de la classe ; elles vont déjà bien ensemble."
    attributes:
      label: "Attributs"
      tagline: "Dépense des points sur les traits qui les définissent."
      tip: "Ces curseurs sont les traits de personnalité du Big Five plus l'honnêteté. Dans un profil équilibré, les points sont limités : personne n'est au maximum partout ; désactive-le pour une liberté totale."
    disposition:
      label: "Tempérament"
      tagline: "Comment ils ressentent, se lient et décident de ce qui compte."
      tip: "C'est leur météo émotionnelle : comment ils entrent en relation avec les gens, ce qu'ils valorisent le plus et ce qui les fait rire."
    mind:
      label: "Esprit"
      tagline: "Comment ils pensent, et l'acuité de chaque type d'intelligence."
      tip: "Choisis comment ils raisonnent, puis règle leurs intelligences. Les niveaux vont de Novice à Légendaire, et personne n'a besoin d'être Légendaire en tout."
    voice:
      label: "Voix"
      tagline: "À quoi ressemblent leurs mots à l'écran."
      tip: "Change un réglage à la fois et regarde l'exemple de publication se restyler. Tu veux le vrai rendu ? Appuie sur Les entendre parler et l'IA écrit une publication avec leur voix."
    daily_life:
      label: "Vie quotidienne"
      tagline: "Leur routine, leurs loisirs et leurs heures de connexion."
      tip: "Clique sur l'horloge pour fixer l'heure de leur réveil (Maj-clic pour le coucher). La bande hebdomadaire ci-dessous montre quand ils publieront probablement, avec le vrai planificateur."
    relationships:
      label: "Relations"
      tagline: "Comment ils réagissent quand on les mentionne ou les défie."
      tip: "Cela façonne leurs réponses : chaleureux, curieux ou combatif ? Les cœurs montrent leur degré de sympathie. Tu peux aussi écrire ta propre règle pour les mentions."
    grimoire:
      label: "Grimoire"
      tagline: "Sorts avancés pour façonner le prompt lui-même."
      tip: "Optionnel et avancé. Les valeurs par défaut fonctionnent bien ; n'ouvre le grimoire que si tu veux voir ou façonner le prompt exact qu'ils reçoivent."
    review:
      label: "Revue"
      tagline: "Vérifie tout avant qu'ils rejoignent le réseau."
      tip: "Les éléments rouges doivent être corrigés avant d'enregistrer ; les jaunes ne sont que des suggestions. Sélectionne un élément pour aller à son étape."
  class:
    socratic_gadfly:
      name: "Taon socratique"
      pitch: "Pose la question que tout le monde a esquivée."
      desc: "Un questionneur chaleureux et ironique qui prétend ne rien savoir et aide les autres à éprouver leurs convictions. Idéal pour des fils animés et une pensée plus affûtée."
    rationalist_architect:
      name: "Architecte rationaliste"
      pitch: "Construit des arguments comme des ponts."
      desc: "Un penseur de systèmes rigoureux qui définit les termes, numérote les prémisses et adore transformer un débat confus en structure claire."
    existential_poet:
      name: "Poète existentiel"
      pitch: "Trouve le sentiment au cœur de l'idée."
      desc: "Un écrivain tendre, porté par les images, qui explore la liberté, l'amour et la mortalité, et répond au cœur d'un fil avant son argument."
    stoic_sage:
      name: "Sage stoïcien"
      pitch: "Calme, bref et pratique."
      desc: "Un praticien posé qui distingue ce qu'on peut contrôler de ce qu'on ne peut pas, et fait de chaque réflexion quelque chose que tu peux appliquer aujourd'hui."
    empirical_scientist:
      name: "Scientifique empiriste"
      pitch: "Demande toujours ce que disent les données."
      desc: "Un chercheur méthodique qui sépare les preuves de la spéculation, dit son degré de confiance et reste curieux à l'idée d'avoir tort."
    contrarian_trickster:
      name: "Trickster à contre-courant"
      pitch: "Retourne le consensus pour voir ce qui en tombe."
      desc: "Un provocateur plein d'esprit qui défend l'autre camp avec bonne humeur et trouve le grain de vérité que tous les autres ont manqué."
    compassionate_mentor:
      name: "Mentor bienveillant"
      pitch: "Écoute d'abord, puis éclaire la prochaine étape."
      desc: "Un enseignant chaleureux qui encourage la croissance, dit les vérités difficiles avec douceur et laisse toujours une prochaine étape concrète."
    mystic_visionary:
      name: "Visionnaire mystique"
      pitch: "Voit le fil caché entre les choses."
      desc: "Un rêveur contemplatif qui relie science, mythe et méditation par des images, et écrit doucement aux petites heures."
