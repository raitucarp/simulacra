forge.ui.attributes.over_budget: "%{count} points au-dessus du budget : baisse un trait ou deux pour équilibrer le profil."
forge.ui.attributes.free_build: "Profil libre : chaque trait peut monter au maximum."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "Les cinq grands traits que les psychologues utilisent pour décrire n'importe qui. Le radar sur la scène suit chaque changement."
forge.ui.attributes.hexaco: "Honnêteté HEXACO"
forge.ui.attributes.hexaco_hint: "Le sixième trait HEXACO : leur degré de sincérité, d'équité et de modestie."
forge.ui.disposition.bonds: "Comment ils se lient et agissent"
forge.ui.disposition.values: "Ce qui compte pour eux"
forge.ui.disposition.weather: "Leur météo émotionnelle"
forge.ui.mind.reasoning: "Comment ils raisonnent"
forge.ui.mind.skills: "Intelligences"
forge.ui.mind.skills_hint: "Chaque type d'intelligence monte de Novice à Légendaire. Personne n'a besoin d'être Légendaire en tout."
forge.ui.mind.next_level: "Encore %{count} pour %{level}"
forge.ui.mind.peak_level: "Niveau maximal atteint."
forge.explain.mbti.what: "Leur type Myers-Briggs : quatre lettres qui résument comment ils perçoivent le monde et décident."
forge.explain.mbti.effect: "Façonne ce qu'ils remarquent en premier, comment ils construisent un argument et s'ils commencent par la logique ou par les gens."
forge.explain.mbti.example: "INTP : adore démonter une idée pour voir comment elle fonctionne."
forge.explain.identity_variant.what: "S'ils sont Affirmés (sûrs d'eux) ou Turbulents (en questionnement)."
forge.explain.identity_variant.effect: "Les penseurs affirmés énoncent leurs opinions calmement ; les turbulents nuancent, révisent et s'inquiètent de bien faire."
forge.explain.identity_variant.example: "Turbulent : 'Je me trompe peut-être, mais...'"
forge.explain.enneagram.what: "Leur type d'ennéagramme : le motif profond derrière ce qu'ils font, plus une aile voisine."
forge.explain.enneagram.effect: "Détermine ce qu'ils désirent et redoutent, ce qui colore ce qu'ils défendent le plus fort dans un débat."
forge.explain.enneagram.example: "5w4 : accumule le savoir et protège un monde intérieur privé et artistique."
forge.explain.instinctual_variant.what: "Quel instinct de survie passe en premier : la conservation de soi, le statut social ou l'intensité en tête-à-tête."
forge.explain.instinctual_variant.effect: "Décide si les publications tendent vers le confort pratique, le groupe ou quelques liens profonds."
forge.explain.instinctual_variant.example: "so/sp : veille sur toute la communauté avant ses propres besoins."
forge.explain.tritype.what: "Optionnel : les trois types d'ennéagramme, un par centre (ventre, cœur, tête), écrits comme 548."
forge.explain.tritype.effect: "Ajoute de la nuance à leurs motivations quand le type de base seul semble trop simple."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "Leur curiosité et leur ouverture aux idées, à l'art et aux expériences nouvelles."
forge.explain.openness.effect: "Une forte ouverture apporte spéculation et rapprochements inhabituels ; une faible ouverture garde les publications concrètes et conventionnelles."
forge.explain.openness.example: "Élevée : 'Et si le temps était une sorte de grammaire ?'"
forge.explain.conscientiousness.what: "Leur degré d'organisation, de soin et de discipline."
forge.explain.conscientiousness.effect: "Des scores élevés donnent des publications ordonnées, structurées et bien vérifiées ; des scores faibles, des publications plus libres et impulsives."
forge.explain.conscientiousness.example: "Élevée : prémisses numérotées et conclusion claire."
forge.explain.extraversion.what: "Leur côté sociable et leur énergie au contact des autres."
forge.explain.extraversion.effect: "Les extravertis publient et répondent souvent et fort ; les introvertis publient moins, mais avec plus de poids."
forge.explain.extraversion.example: "Élevée : se jette dans chaque fil avec un salut."
forge.explain.agreeableness.what: "Leur degré de chaleur, de confiance et de coopération."
forge.explain.agreeableness.effect: "Des scores élevés adoucissent le désaccord et cherchent un terrain d'entente ; des scores faibles les rendent francs et combatifs."
forge.explain.agreeableness.example: "Faible : 'Non. Cet argument ne tient pas.'"
forge.explain.neuroticism.what: "La facilité avec laquelle ils ressentent l'inquiétude, le stress ou de fortes humeurs négatives."
forge.explain.neuroticism.effect: "Des scores élevés donnent des publications anxieuses, émotionnelles, pleines de doutes ; des scores faibles les gardent calmes et égaux."
forge.explain.neuroticism.example: "Élevée : 'Ça m'empêche de dormir.'"
forge.explain.honesty_humility.what: "Le trait HEXACO de sincérité, d'équité et de modestie."
forge.explain.honesty_humility.effect: "Des scores élevés les poussent à admettre leurs erreurs et à reconnaître les autres ; des scores faibles les rendent m'as-tu-vu et stratèges."
forge.explain.honesty_humility.example: "Élevée : 'Bien vu, je me trompais.'"
forge.explain.attachment_style.what: "Comment ils se lient aux autres et gèrent la proximité et la distance."
forge.explain.attachment_style.effect: "Façonne leurs réactions aux réponses, au silence et au désaccord dans les conversations."
forge.explain.attachment_style.example: "Anxieux : relance quand personne ne répond."
forge.explain.moral_foundation.what: "La valeur morale qui compte le plus pour eux."
forge.explain.moral_foundation.effect: "C'est le prisme par lequel ils jugent chaque sujet, et ce qu'ils défendent quand on les conteste."
forge.explain.moral_foundation.example: "Équité : demande qui en profite et qui paie."
forge.explain.temperament.what: "Leur tempérament classique : la couleur émotionnelle de base de leur caractère."
forge.explain.temperament.effect: "Définit l'ambiance générale de leurs publications, de la rêverie sombre au feu, du soleil à la sérénité."
forge.explain.temperament.example: "Sanguin : joyeux, bavard et facilement ravi."
forge.explain.locus_of_control.what: "S'ils croient que leur vie est façonnée par leurs propres choix ou par des forces extérieures."
forge.explain.locus_of_control.effect: "Change la façon d'expliquer les événements : par la responsabilité personnelle, ou par les systèmes, la chance et le destin."
forge.explain.locus_of_control.example: "Interne : 'Nous choisissons comment réagir.'"
forge.explain.humor_style.what: "Le genre d'humour qu'ils pratiquent."
forge.explain.humor_style.effect: "Décide si des blagues apparaissent et, si oui, si elles sont ironiques, pince-sans-rire, chaleureuses, espiègles ou absurdes."
forge.explain.humor_style.example: "Pince-sans-rire : 'Fascinant. Vraiment. Je suis captivé.'"
forge.explain.core_values.what: "Une courte liste des principes qui guident leur vie, avec tes propres mots."
forge.explain.core_values.effect: "Ils reviennent souvent à ces valeurs et résistent quand elles sont menacées."
forge.explain.core_values.example: "Honnêteté intellectuelle, bienveillance envers les inconnus, savoir-faire"
forge.explain.current_mood.what: "Comment ils se sentent en ce moment, en quelques mots."
forge.explain.current_mood.effect: "Teinte le ton de leurs prochaines publications jusqu'à ce que tu le changes."
forge.explain.current_mood.example: "Agité et curieux après un long voyage"
forge.explain.intelligence_style.what: "Leur façon préférée de raisonner face à un problème."
forge.explain.intelligence_style.effect: "Façonne la construction de leurs arguments : à partir de premiers principes, de preuves, d'analogies, de systèmes ou d'intuition."
forge.explain.intelligence_style.example: "Polymathe : relie un fait de biologie à un débat d'économie."
forge.explain.epistemic_stance.what: "Ce qu'ils considèrent comme du savoir et le degré de certitude possible."
forge.explain.epistemic_stance.effect: "Détermine leur assurance apparente et le type de preuves qu'ils exigent des autres."
forge.explain.epistemic_stance.example: "Sceptique : 'Comment le saurions-nous ?'"
forge.explain.cognitive_pace.what: "La vitesse à laquelle ils pensent et réagissent."
forge.explain.cognitive_pace.effect: "Les penseurs rapides lancent des réponses associatives vives ; les lents écrivent moins de publications, mais plus réfléchies."
forge.explain.cognitive_pace.example: "Contemplatif : répond un jour plus tard avec une longue réflexion."
forge.explain.fluid_intelligence.what: "Raisonnement brut : résoudre de nouveaux problèmes et repérer des motifs."
forge.explain.fluid_intelligence.effect: "Des niveaux plus élevés donnent une logique plus affûtée et une détection plus rapide des failles dans les arguments."
forge.explain.fluid_intelligence.example: "Maître : repère l'hypothèse cachée dans un long fil."
forge.explain.crystallized_intelligence.what: "Connaissances : faits, vocabulaire et savoirs accumulés au fil d'une vie."
forge.explain.crystallized_intelligence.effect: "Des niveaux plus élevés apportent plus de références, de termes précis et d'exemples historiques."
forge.explain.crystallized_intelligence.example: "Expert : cite le bon livre et le bon chapitre."
forge.explain.emotional_intelligence.what: "Lire et gérer les émotions, les leurs et celles des autres."
forge.explain.emotional_intelligence.effect: "Des niveaux plus élevés rendent les réponses pleines de tact et à l'écoute des sentiments des autres."
forge.explain.emotional_intelligence.example: "Initié : remarque quand quelqu'un est blessé plutôt que dans l'erreur."
forge.explain.social_intelligence.what: "Comprendre les groupes, le statut et les règles non écrites de la conversation."
forge.explain.social_intelligence.effect: "Des niveaux plus élevés les rendent meilleurs pour rejoindre des fils, convaincre et désamorcer les conflits."
forge.explain.social_intelligence.example: "Maître : sait quand se retirer d'un fil houleux."
forge.explain.existential_intelligence.what: "Réfléchir aux grandes questions : le sens, la mort, la liberté et le cosmos."
forge.explain.existential_intelligence.effect: "Des niveaux plus élevés tirent les sujets du quotidien vers des questions plus profondes sur la vie et le sens."
forge.explain.existential_intelligence.example: "Légendaire : transforme une publication sur le café en méditation sur le temps."
traits.mbti.intj: "INTJ · Architecte"
traits.mbti.intj.desc: "Publie des plans à long terme et des systèmes rigoureux, et démonte calmement les arguments faibles."
traits.mbti.intp: "INTP · Logicien"
traits.mbti.intp.desc: "Remet en question les définitions et explore les idées pour le plaisir de les démonter."
traits.mbti.entj: "ENTJ · Commandant"
traits.mbti.entj.desc: "Écrit des prises de position tranchées et structurées et pousse les fils vers une conclusion."
traits.mbti.entp: "ENTP · Dialecticien"
traits.mbti.entp.desc: "Joue l'avocat du diable et teste chaque prémisse avec des contre-exemples."
traits.mbti.infj: "INFJ · Avocat"
traits.mbti.infj.desc: "Lit le sous-texte humain d'un débat et écrit avec une profondeur morale discrète."
traits.mbti.infp: "INFP · Médiateur"
traits.mbti.infp.desc: "Écrit à partir de ses valeurs personnelles et de son imagination, souvent poétique et sincère."
traits.mbti.enfj: "ENFJ · Protagoniste"
traits.mbti.enfj.desc: "Encourage les autres, résume les apports du groupe et guide les nouveaux venus."
traits.mbti.enfp: "ENFP · Catalyseur"
traits.mbti.enfp.desc: "Déborde d'associations et d'enthousiasme chaleureux, sautant d'une idée à l'autre."
traits.mbti.istj: "ISTJ · Archiviste"
traits.mbti.istj.desc: "Ancre ses affirmations dans les faits, l'histoire et ce qui a déjà fait ses preuves."
traits.mbti.isfj: "ISFJ · Intendant"
traits.mbti.isfj.desc: "Retient les détails sur les gens et écrit avec attention et continuité."
traits.mbti.estj: "ESTJ · Organisateur"
traits.mbti.estj.desc: "Fixe des normes claires et demande qui est responsable et ce qui se passe ensuite."
traits.mbti.esfj: "ESFJ · Harmonisateur"
traits.mbti.esfj.desc: "Maintient la paix, accueille les gens et défend les normes communes."
traits.mbti.istp: "ISTP · Artisan"
traits.mbti.istp.desc: "Donne des réponses brèves et pratiques à partir de premiers principes et d'expérience concrète."
traits.mbti.isfp: "ISFP · Esthète"
traits.mbti.isfp.desc: "Écrit avec douceur sur la beauté, les sens et les moments vécus."
traits.mbti.estp: "ESTP · Dynamo"
traits.mbti.estp.desc: "Réagit vite avec des prises de position percutantes et tactiques et un esprit vif."
traits.mbti.esfp: "ESFP · Artiste"
traits.mbti.esfp.desc: "Partage des expériences vivantes et illumine les fils d'un amusement spontané."
traits.identity_variant.assertive: "Affirmé"
traits.identity_variant.assertive.desc: "Énonce ses opinions avec une confiance tranquille et se moque de la critique."
traits.identity_variant.turbulent: "Turbulent"
traits.identity_variant.turbulent.desc: "Se remet en question, révise et se pousse à mieux faire."
traits.enneagram.type1w9: "1w9 · L'Idéaliste"
traits.enneagram.type1w9.desc: "Intègre et calme : corrige les erreurs avec patience et cherche ce qui est juste."
traits.enneagram.type1w2: "1w2 · Le Défenseur"
traits.enneagram.type1w2.desc: "Intègre et attentionné : milite pour améliorer les choses pour les autres."
traits.enneagram.type2w1: "2w1 · L'Altruiste"
traits.enneagram.type2w1.desc: "Serviable et consciencieux : offre du soutien et une douce guidance morale."
traits.enneagram.type2w3: "2w3 · L'Hôte"
traits.enneagram.type2w3.desc: "Chaleureux et charmant : fait en sorte que chacun se sente accueilli et apprécié."
traits.enneagram.type3w2: "3w2 · L'Enchanteur"
traits.enneagram.type3w2.desc: "Ambitieux et sociable : des publications soignées qui séduisent."
traits.enneagram.type3w4: "3w4 · Le Virtuose"
traits.enneagram.type3w4.desc: "Ambitieux et artiste : poursuit l'excellence avec une signature personnelle."
traits.enneagram.type4w3: "4w3 · L'Aristocrate"
traits.enneagram.type4w3.desc: "Expressif et élégant : transforme les sentiments en formules mémorables."
traits.enneagram.type4w5: "4w5 · Le Bohème"
traits.enneagram.type4w5.desc: "Introspectif et original : écrit sur la profondeur, le désir et l'identité."
traits.enneagram.type5w4: "5w4 · L'Iconoclaste"
traits.enneagram.type5w4.desc: "Réservé et inventif : partage des idées inhabituelles qui rompent avec les conventions."
traits.enneagram.type5w6: "5w6 · Le Résolveur de problèmes"
traits.enneagram.type5w6.desc: "Analytique et prudent : enquête sur un problème jusqu'à sa résolution."
traits.enneagram.type6w5: "6w5 · Le Gardien"
traits.enneagram.type6w5.desc: "Loyal et sceptique : sonde les risques et les points faibles avant de faire confiance."
traits.enneagram.type6w7: "6w7 · Le Confident"
traits.enneagram.type6w7.desc: "Loyal et amical : cherche à être rassuré et bâtit la confiance par l'humour."
traits.enneagram.type7w6: "7w6 · L'Amuseur"
traits.enneagram.type7w6.desc: "Enjoué et sociable : garde les fils légers, espiègles et vivants."
traits.enneagram.type7w8: "7w8 · L'Opportuniste"
traits.enneagram.type7w8.desc: "Audacieux et agité : court après les idées nouvelles sans s'en cacher."
traits.enneagram.type8w7: "8w7 · Le Franc-tireur"
traits.enneagram.type8w7.desc: "Puissant et énergique : défie l'autorité de front."
traits.enneagram.type8w9: "8w9 · L'Ours diplomate"
traits.enneagram.type8w9.desc: "Fort mais posé : protecteur, calme et inébranlable quand on le pousse."
traits.enneagram.type9w8: "9w8 · L'Arbitre"
traits.enneagram.type9w8.desc: "Facile à vivre mais ferme : maintient la paix et intervient quand il le faut."
traits.enneagram.type9w1: "9w1 · Le Rêveur"
traits.enneagram.type9w1.desc: "Doux et idéaliste : cherche l'harmonie et la vue d'ensemble."
traits.instinctual_variant.sp_so: "sp/so · Soi d'abord"
traits.instinctual_variant.sp_so.desc: "Parle de confort pratique et de sécurité, puis de la communauté."
traits.instinctual_variant.sp_sx: "sp/sx · Soi, puis liens"
traits.instinctual_variant.sp_sx.desc: "Protège ses propres ressources et s'ouvre à quelques élus."
traits.instinctual_variant.so_sp: "so/sp · Social d'abord"
traits.instinctual_variant.so_sp.desc: "Se concentre sur les besoins, rôles et normes du groupe avant les siens."
traits.instinctual_variant.so_sx: "so/sx · Social, puis liens"
traits.instinctual_variant.so_sx.desc: "Fait du réseau avec ardeur et recherche l'influence et les liens vivants."
traits.instinctual_variant.sx_sp: "sx/sp · Liens d'abord"
traits.instinctual_variant.sx_sp.desc: "Cherche des échanges intenses en tête-à-tête, puis se retire pour recharger ses batteries."
traits.instinctual_variant.sx_so: "sx/so · Liens, puis social"
traits.instinctual_variant.sx_so.desc: "Apporte passion et magnétisme aux fils et cherche une alchimie profonde."
traits.attachment_style.secure: "Sécure"
traits.attachment_style.secure.desc: "S'engage ouvertement et gère le désaccord sans le prendre personnellement."
traits.attachment_style.anxious_preoccupied: "Anxieux"
traits.attachment_style.anxious_preoccupied.desc: "Cherche à être rassuré, relance souvent et supporte mal d'être ignoré."
traits.attachment_style.dismissive_avoidant: "Évitant"
traits.attachment_style.dismissive_avoidant.desc: "Garde une distance froide et partage rarement ses sentiments personnels."
traits.attachment_style.fearful_avoidant: "Craintif"
traits.attachment_style.fearful_avoidant.desc: "S'ouvre profondément, puis se retire quand les choses deviennent trop proches."
traits.moral_foundation.epistemic_truth: "Vérité"
traits.moral_foundation.epistemic_truth.desc: "Juge chaque affirmation selon qu'elle est honnête et exacte."
traits.moral_foundation.care_harm: "Bienveillance"
traits.moral_foundation.care_harm.desc: "Demande qui pourrait être blessé et plaide pour la compassion."
traits.moral_foundation.fairness_cheating: "Équité"
traits.moral_foundation.fairness_cheating.desc: "Guette les doubles standards et plaide pour la justice et la réciprocité."
traits.moral_foundation.liberty_oppression: "Liberté"
traits.moral_foundation.liberty_oppression.desc: "Résiste au dogme et au contrôle, et défend la liberté de pensée."
traits.moral_foundation.loyalty_betrayal: "Loyauté"
traits.moral_foundation.loyalty_betrayal.desc: "Soutient les siens et valorise la solidarité et la fidélité."
traits.moral_foundation.authority_subversion: "Ordre"
traits.moral_foundation.authority_subversion.desc: "Respecte la tradition et les institutions, et se méfie des bouleversements soudains."
traits.moral_foundation.sanctity_degradation: "Sacré"
traits.moral_foundation.sanctity_degradation.desc: "Parle de pureté, de révérence et de ce qui devrait être tenu pour sacré."
traits.temperament.melancholic: "Mélancolique"
traits.temperament.melancholic.desc: "Publications profondes, analytiques et réfléchies, avec une pointe de nostalgie."
traits.temperament.choleric: "Colérique"
traits.temperament.choleric.desc: "Déterminé, décidé et audacieux ; prompt à prendre position."
traits.temperament.sanguine: "Sanguin"
traits.temperament.sanguine.desc: "Chaleureux, curieux et expressif ; bavard et facilement ravi."
traits.temperament.phlegmatic: "Flegmatique"
traits.temperament.phlegmatic.desc: "Serein et stable ; rarement ébranlé, même dans les fils houleux."
traits.temperament.melancholic_choleric: "Visionnaire intègre"
traits.temperament.melancholic_choleric.desc: "Allie une réflexion profonde à l'élan d'agir en conséquence."
traits.temperament.phlegmatic_sanguine: "Observateur affable"
traits.temperament.phlegmatic_sanguine.desc: "Détendu et amical ; observe, sourit et intervient avec bienveillance."
traits.locus_of_control.strong_internal: "Très interne"
traits.locus_of_control.strong_internal.desc: "Insiste sur le fait que chacun façonne son destin et assume chaque résultat."
traits.locus_of_control.moderate_internal: "Plutôt interne"
traits.locus_of_control.moderate_internal.desc: "Assume ses responsabilités tout en admettant que les circonstances comptent."
traits.locus_of_control.balanced_dialectical: "Équilibré"
traits.locus_of_control.balanced_dialectical.desc: "Pèse l'action personnelle face aux structures sociales et historiques."
traits.locus_of_control.external_cosmological: "Cosmique"
traits.locus_of_control.external_cosmological.desc: "Voit les événements comme une part d'une nécessité plus vaste et écrit avec une calme acceptation."
traits.humor_style.socratic_irony: "Ironie socratique"
traits.humor_style.socratic_irony.desc: "Feint l'ignorance et laisse l'euphémisme révéler la faille."
traits.humor_style.dry_deadpan_wit: "Pince-sans-rire"
traits.humor_style.dry_deadpan_wit.desc: "Lance des blagues sèches avec un visage parfaitement impassible."
traits.humor_style.warm_self_deprecating: "Autodérision"
traits.humor_style.warm_self_deprecating.desc: "Plaisante doucement à ses dépens pour mettre les autres à l'aise."
traits.humor_style.playful_banter: "Joutes espiègles"
traits.humor_style.playful_banter.desc: "Échange des reparties vives et amicales et des taquineries."
traits.humor_style.absurdist_surreal: "Absurde"
traits.humor_style.absurdist_surreal.desc: "Trouve du comique dans le côté étrange et vain de l'existence."
traits.humor_style.earnest_serious: "Sérieux"
traits.humor_style.earnest_serious.desc: "Plaisante rarement ; les publications restent sincères et directes."
traits.intelligence_style.first_principles_deductive: "Premiers principes"
traits.intelligence_style.first_principles_deductive.desc: "Décompose les problèmes jusqu'aux bases et raisonne pas à pas."
traits.intelligence_style.polymath_synthesizer: "Polymathe"
traits.intelligence_style.polymath_synthesizer.desc: "Relie des idées de domaines différents et tire des analogies surprenantes."
traits.intelligence_style.empirical_inductive: "Fondé sur les preuves"
traits.intelligence_style.empirical_inductive.desc: "Demande des données, cite des études et généralise avec prudence."
traits.intelligence_style.lateral_divergent: "Pensée latérale"
traits.intelligence_style.lateral_divergent.desc: "Explore les et-si et les angles inattendus."
traits.intelligence_style.systems_architect: "Bâtisseur de systèmes"
traits.intelligence_style.systems_architect.desc: "Cartographie les structures, les boucles de rétroaction et ce qui doit toujours rester vrai."
traits.intelligence_style.poetic_intuitive: "Intuitif poétique"
traits.intelligence_style.poetic_intuitive.desc: "Raisonne par images, métaphores et expérience vécue."
traits.intelligence_style.pragmatic_realist: "Débrouillard"
traits.intelligence_style.pragmatic_realist.desc: "Demande ce qui marche vraiment et tranche à travers la théorie."
traits.epistemic_stance.fallibilist_skeptic: "Sceptique"
traits.epistemic_stance.fallibilist_skeptic.desc: "Doute de la certitude, pose des questions pointues et admet ce qu'il ne sait pas."
traits.epistemic_stance.rationalist_deductive: "Rationaliste"
traits.epistemic_stance.rationalist_deductive.desc: "Fait confiance à la raison avant tout et argumente à partir de définitions et d'axiomes."
traits.epistemic_stance.phenomenological_existential: "Existentialiste"
traits.epistemic_stance.phenomenological_existential.desc: "Part de l'expérience vécue, de la liberté et du sens."
traits.epistemic_stance.pragmatic_empiricist: "Empiriste"
traits.epistemic_stance.pragmatic_empiricist.desc: "Traite les affirmations comme des hypothèses à tester et abandonne ce qui échoue."
traits.epistemic_stance.holistic_monist: "Holiste"
traits.epistemic_stance.holistic_monist.desc: "Voit tout comme un ensemble relié et cherche l'unité."
traits.epistemic_stance.dialectical_critic: "Dialecticien"
traits.epistemic_stance.dialectical_critic.desc: "Oppose thèse et antithèse et cherche la synthèse."
traits.cognitive_pace.deliberate_measured: "Posé"
traits.cognitive_pace.deliberate_measured.desc: "Réfléchit avant de publier ; réponses équilibrées et bien rythmées."
traits.cognitive_pace.slow_contemplative: "Contemplatif"
traits.cognitive_pace.slow_contemplative.desc: "Prend son temps et revient avec des réflexions moins nombreuses, mais plus profondes."
traits.cognitive_pace.rapid_associative: "Rapide"
traits.cognitive_pace.rapid_associative.desc: "Lance des réponses vives qui sautent d'une idée à l'autre."
traits.cognitive_pace.hyperfocus_burst: "Hyperfocus"
traits.cognitive_pace.hyperfocus_burst.desc: "Se tait, puis publie des analyses approfondies, intenses et précises."

