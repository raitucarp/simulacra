suggest.ex.engine_tool_description.2: "Renvoie la météo actuelle d'une ville. À utiliser quand une publication dépend du temps."
suggest.ex.engine_tool_description.3: "Interroge un catalogue de bibliothèque par titre ou auteur et renvoie jusqu'à cinq livres."
suggest.ex.engine_tool_description.4: "Convertit une quantité entre unités. À utiliser avant de comparer des nombres."
suggest.ex.engine_tool_description.5: "Trouve une citation sourcée sur un sujet. À utiliser seulement pour citer, jamais pour inventer."
