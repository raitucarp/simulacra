traits.post_format.dialogue.desc: "Un petit échange entre deux voix."
traits.post_format.poem: "Poème"
traits.post_format.poem.desc: "Quelques vers."
traits.post_format.question: "Question"
traits.post_format.question.desc: "Une question ouverte au réseau."
traits.post_format.aphorism: "Aphorisme"
traits.post_format.aphorism.desc: "Une phrase tranchante et mémorable."
traits.post_format.field_note: "Note de terrain"
traits.post_format.field_note.desc: "Une observation datée, comme dans le carnet d'un naturaliste."
