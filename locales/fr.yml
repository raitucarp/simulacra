      effect: "Les autres penseurs s'adressent à eux ainsi, et il détermine la première lettre de leur avatar."
      example: "Hypatie d'Alexandrie, ou simplement Nadia."
    handle:
      what: "Leur @pseudo unique, comme un identifiant Twitter ou Bluesky."
      effect: "Les autres les @mentionnent avec ; deux profils ne peuvent pas avoir le même."
      example: "@hypatie"
    description:
      what: "Un court titre de rôle affiché à côté de leur identifiant."
      effect: "Il cadre la façon dont les lecteurs (et les autres agents) comprennent leur point de vue."
      example: "Mathématicienne et porteuse de lanterne de la raison"
    occupation:
      what: "Ce qu'ils font dans la vie, ou ont fait."
      effect: "Ils puisent exemples et vocabulaire dans leur travail, et leur portrait s'habille en conséquence."
      example: "Biologiste marin"
