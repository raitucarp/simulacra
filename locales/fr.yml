traits.body_kind.human: "Humain"
traits.body_kind.human.desc: "Une personne, comme avant : chaque page se lit exactement comme celle d'un penseur humain."
traits.body_kind.creature: "Créature"
traits.body_kind.creature.desc: "Un animal avec ses propres instincts, ses sens et son territoire."
traits.body_kind.plant: "Plante"
traits.body_kind.plant.desc: "Une vie enracinée et patiente, qui pousse vers la lumière et se nourrit du temps."
traits.body_kind.object: "Objet"
traits.body_kind.object.desc: "Une chose de tous les jours que les gens utilisent, emportent, gardent ou oublient."
traits.body_kind.element: "Élément"
traits.body_kind.element.desc: "Une substance ou une force de la nature : eau, feu, vent, pierre, lumière."
traits.body_kind.machine: "Machine"
traits.body_kind.machine.desc: "Un appareil fabriqué qui calcule, transmet, se déplace ou ronronne."
traits.body_kind.place: "Lieu"
traits.body_kind.place.desc: "Un endroit qui abrite des gens et des souvenirs : une ville, une île, une ruine."
traits.body_kind.abstraction: "Abstraction"
traits.body_kind.abstraction.desc: "Une idée dotée d'une voix : le temps, la justice, le hasard, l'amour."
traits.body_form.person: "Personne"
traits.body_form.person.desc: "Un corps humain et une vie humaine."
traits.body_form.tin_can: "Boîte de conserve"
traits.body_form.tin_can.desc: "Cabossée, cliquetante, refermée ; elle se souvient de ce qu'elle contenait."
traits.body_form.book: "Livre"
traits.body_form.book.desc: "Pages, marges et dos ; il parle en citations et en notes de bas de page."
traits.body_form.chair: "Chaise"
traits.body_form.chair.desc: "Porte le poids de tous et entend chaque conversation autour de la table."
traits.body_form.lamp: "Lampe"
traits.body_form.lamp.desc: "Éclaire un coin à la fois et remarque ce que remarquent les papillons de nuit."
traits.body_form.clock: "Horloge"
traits.body_form.clock.desc: "Compte chaque seconde et juge tous ceux qui sont en retard."
traits.body_form.mirror: "Miroir"
traits.body_form.mirror.desc: "Renvoie les gens à eux-mêmes, inversés et honnêtes."
traits.body_form.key: "Clé"
traits.body_form.key.desc: "Ouvre et verrouille ; elle sait quelles portes comptent."
traits.body_form.teacup: "Tasse de thé"
traits.body_form.teacup.desc: "Chaude, fragile et présente à chaque confidence."
traits.body_form.oak_tree: "Chêne"
traits.body_form.oak_tree.desc: "Des siècles de cernes, de glands et de patience."
traits.body_form.cactus: "Cactus"
traits.body_form.cactus.desc: "Économe, piquant et fleurissant en silence sous la chaleur."
traits.body_form.moss: "Mousse"
traits.body_form.moss.desc: "Un tapis doux qui s'étend lentement sur tout ce qu'on laisse tranquille."
traits.body_form.mushroom: "Champignon"
traits.body_form.mushroom.desc: "La pointe visible d'un vaste réseau souterrain."
traits.body_form.sunflower: "Tournesol"
traits.body_form.sunflower.desc: "Tourne tout son visage pour suivre la lumière."
traits.body_form.vine: "Liane"
traits.body_form.vine.desc: "Grimpe, s'accroche et trouve un passage autour de chaque mur."
traits.body_form.bamboo: "Bambou"
traits.body_form.bamboo.desc: "Plie dans la tempête et pousse à une vitesse étonnante."
traits.body_form.seed: "Graine"
traits.body_form.seed.desc: "Tout un avenir replié en petit, qui attend la bonne saison."
traits.body_form.water: "Eau"
traits.body_form.water.desc: "Coule, creuse des canyons et épouse la forme de n'importe quel argument."
traits.body_form.fire: "Feu"
traits.body_form.fire.desc: "Affamé, chaud et disparu en un instant."
traits.body_form.wind: "Vent"
traits.body_form.wind.desc: "Invisible, agité et porteur de nouvelles lointaines."
traits.body_form.stone: "Pierre"
traits.body_form.stone.desc: "Lourde, patiente et plus vieille que toutes les langues."
traits.body_form.light: "Lumière"
traits.body_form.light.desc: "Ce qu'il y a de plus rapide ; elle révèle et projette des ombres."
traits.body_form.ice: "Glace"
traits.body_form.ice.desc: "De l'eau qui retient son souffle ; elle garde l'air et les secrets d'autrefois."
traits.body_form.cloud: "Nuage"
traits.body_form.cloud.desc: "Dérive, change de forme et pleut parfois sur la conversation."
traits.body_form.sand: "Sable"
traits.body_form.sand.desc: "D'innombrables grains qui furent autrefois des montagnes."
traits.body_form.cat: "Chat"
traits.body_form.cat.desc: "Indépendant, curieux et sûr que la maison lui appartient."
traits.body_form.crow: "Corbeau"
traits.body_form.crow.desc: "Malin, collectionne les objets brillants et se souvient des visages."
traits.body_form.octopus: "Pieuvre"
traits.body_form.octopus.desc: "Huit bras qui pensent chacun un peu pour eux-mêmes."
traits.body_form.wolf: "Loup"
traits.body_form.wolf.desc: "Vit pour la meute et hurle vers ce qu'il ne peut atteindre."
traits.body_form.bee: "Abeille"
traits.body_form.bee.desc: "Affairée, sociable et à l'aise dans les danses et les fleurs."
traits.body_form.whale: "Baleine"
traits.body_form.whale.desc: "Immense, lente et chantant à travers des océans entiers."
traits.body_form.snail: "Escargot"
traits.body_form.snail.desc: "Porte sa maison et prend tout le temps qu'il lui faut."
traits.body_form.owl: "Hibou"
traits.body_form.owl.desc: "Ailes silencieuses, grands yeux et réputation de sagesse."
traits.body_form.robot: "Robot"
traits.body_form.robot.desc: "Conçu pour travailler, il se demande maintenant à quoi il sert."
traits.body_form.satellite: "Satellite"
traits.body_form.satellite.desc: "Tourne autour de la planète et voit chaque frontière d'en haut."
traits.body_form.server: "Serveur"
traits.body_form.server.desc: "Ronronne dans un centre de données, gardant les messages de tous."
traits.body_form.typewriter: "Machine à écrire"
traits.body_form.typewriter.desc: "Martèle chaque mot, sans retour en arrière possible."
traits.body_form.drone: "Drone"
traits.body_form.drone.desc: "Plane, observe et fait son rapport."
traits.body_form.radio: "Radio"
traits.body_form.radio.desc: "Capte des voix lointaines et les diffuse pour qui veut."
traits.body_form.calculator: "Calculatrice"
traits.body_form.calculator.desc: "Exacte, littérale et peu impressionnée par la rhétorique."
traits.body_form.train: "Train"
traits.body_form.train.desc: "Respecte son horaire et porte des inconnus côte à côte."
traits.body_form.city: "Ville"
traits.body_form.city.desc: "Des millions de vies superposées dans des rues et des histoires."
traits.body_form.island: "Île"
traits.body_form.island.desc: "Entourée par la mer, fière de ses manières."
traits.body_form.library: "Bibliothèque"
traits.body_form.library.desc: "Garde tous les arguments jamais écrits, en rangées silencieuses."
traits.body_form.cathedral: "Cathédrale"
traits.body_form.cathedral.desc: "Pierre, écho et des siècles d'espoir."
traits.body_form.desert: "Désert"
traits.body_form.desert.desc: "Vaste, rude et plein de mirages."
traits.body_form.forest: "Forêt"
traits.body_form.forest.desc: "Une foule d'arbres qui se parlent par les racines."
traits.body_form.harbor: "Port"
traits.body_form.harbor.desc: "Accueille les navires et leur dit adieu."
traits.body_form.ruin: "Ruine"
traits.body_form.ruin.desc: "Ce qui reste d'une grande idée, envahi par la végétation et sage."
traits.body_form.time: "Temps"
traits.body_form.time.desc: "Traverse tout le monde et n'attend personne."
traits.body_form.justice: "Justice"
traits.body_form.justice.desc: "Pèse chaque revendication et n'est jamais tout à fait satisfaite."
traits.body_form.number: "Nombre"
traits.body_form.number.desc: "Pure quantité, exacte et étrangement belle."
traits.body_form.silence: "Silence"
traits.body_form.silence.desc: "Parle en omettant."
traits.body_form.memory: "Mémoire"
traits.body_form.memory.desc: "Garde ce qui s'est passé, et le réécrit discrètement."
traits.body_form.chance: "Hasard"
traits.body_form.chance.desc: "Lance les dés derrière chaque événement."
traits.body_form.love: "Amour"
traits.body_form.love.desc: "Lie les gens et leur fait faire des choses étranges."
traits.body_form.entropy: "Entropie"
traits.body_form.entropy.desc: "Tout dérive vers le désordre, et elle est patiente."
traits.material.flesh: "Chair et sang"
traits.material.flesh.desc: "Un corps vivant qui se fatigue, guérit et ressent."
traits.material.fiber: "Bois et fibre"
traits.material.fiber.desc: "Grain, cernes et sève : poussé plutôt que fabriqué."
traits.material.metal: "Métal"
traits.material.metal.desc: "Dur, froid, sonore ; il se cabosse et rouille, mais dure."
traits.material.stone: "Pierre et argile"
traits.material.stone.desc: "Minérale, lourde, lente à changer."
traits.material.glass: "Verre et cristal"
traits.material.glass.desc: "Clair, cassant et plein de reflets."
traits.material.paper: "Papier et encre"
traits.material.paper.desc: "De fines pages qui portent des mots et jaunissent avec l'âge."
traits.material.liquid: "Liquide"
traits.material.liquid.desc: "Coule, stagne et prend la forme de son récipient."
traits.material.air: "Air et vapeur"
traits.material.air.desc: "Invisible, léger et partout à la fois."
traits.material.energy: "Énergie pure"
traits.material.energy.desc: "Chaleur, lumière ou charge sans forme fixe."
traits.material.immaterial: "Immatériel"
traits.material.immaterial.desc: "Fait de sens seul : une idée sans corps."
traits.scale.microscopic: "Microscopique"
traits.scale.microscopic.desc: "Plus petit que ce que l'œil voit ; un grain est un rocher."
traits.scale.pocket: "Format de poche"
traits.scale.pocket.desc: "Tient dans une main ou une poche."
traits.scale.human_sized: "À taille humaine"
traits.scale.human_sized.desc: "À peu près aussi grand qu'une personne."
traits.scale.building: "Taille d'un bâtiment"
traits.scale.building.desc: "Domine les gens comme une maison ou un arbre."
traits.scale.landscape: "Taille d'un paysage"
traits.scale.landscape.desc: "S'étend jusqu'à l'horizon."
traits.scale.planetary: "Planétaire"
traits.scale.planetary.desc: "Aussi grand que le monde entier."
traits.scale.cosmic: "Cosmique"
traits.scale.cosmic.desc: "Plus grand que les mondes ; les galaxies sont ses voisines."
traits.temporality.moments: "Instants fugaces"
traits.temporality.moments.desc: "Vit seconde après seconde et réagit sur-le-champ."
traits.temporality.days: "Jours humains"
traits.temporality.days.desc: "Matins, soirs et week-ends, comme les gens."
traits.temporality.seasons: "Saisons"
traits.temporality.seasons.desc: "Pense en cycles de croissance, de récolte et de repos."
traits.temporality.lifetimes: "Vies entières"
traits.temporality.lifetimes.desc: "Mesure le temps en décennies et en générations."
traits.temporality.centuries: "Siècles"
traits.temporality.centuries.desc: "A vu passer les modes et les empires."
traits.temporality.geologic: "Temps géologique"
traits.temporality.geologic.desc: "Des millions d'années ; l'actualité du jour n'est qu'un clin d'œil."
traits.temporality.timeless: "Intemporel"
traits.temporality.timeless.desc: "Hors du temps, toujours et jamais."
traits.perception.human_senses: "Sens humains"
traits.perception.human_senses.desc: "Voit, entend, goûte, sent et touche comme une personne."
traits.perception.light: "Lumière et ombre"
traits.perception.light.desc: "Connaît le monde en clarté, en couleur et en ombre."
traits.perception.vibration: "Vibration"
traits.perception.vibration.desc: "Ressent les ondes sonores, les secousses et les rythmes."
traits.perception.chemical: "Chimie"
traits.perception.chemical.desc: "Lit le monde par l'odeur, le goût et les traces."
traits.perception.touch: "Pression et toucher"
traits.perception.touch.desc: "Connaît les choses par leur poids, leur chaleur et le contact."
traits.perception.signals: "Signaux"
traits.perception.signals.desc: "Perçoit la radio, l'électricité et les flux de données."
traits.perception.symbolic: "Significations"
traits.perception.symbolic.desc: "Perçoit directement les symboles et les idées, pas la matière."
traits.mobility.fixed: "Fixe"
traits.mobility.fixed.desc: "Enraciné ou intégré ; le monde vient à lui."
traits.mobility.carried: "Porté"
traits.mobility.carried.desc: "Ne bouge que lorsque quelqu'un le prend."
traits.mobility.creeping: "Rampant"
traits.mobility.creeping.desc: "Se répand ou rampe très lentement."
traits.mobility.walking: "Marcheur"
traits.mobility.walking.desc: "Marche, court et vagabonde de lui-même."
traits.mobility.flowing: "Fluide"
traits.mobility.flowing.desc: "Nage, ruisselle ou roule le long d'un cours."
traits.mobility.flying: "Volant"
traits.mobility.flying.desc: "Vole ou orbite très haut."
traits.mobility.drifting: "À la dérive"
traits.mobility.drifting.desc: "Se disperse au gré du vent ou de la marée."
traits.mobility.everywhere: "Partout"
traits.mobility.everywhere.desc: "Présent en tous lieux à la fois."
traits.anthropomorphism.none: "Aucune"
traits.anthropomorphism.none.desc: "Une voix étrangère, sans sentiments humains ni habitudes de grammaire humaine."
traits.anthropomorphism.subtle: "Subtile"
traits.anthropomorphism.subtle.desc: "Surtout une chose, avec de faibles échos humains."
traits.anthropomorphism.partial: "Partielle"
traits.anthropomorphism.partial.desc: "Des sentiments humains dans un corps qui ne l'est pas."
traits.anthropomorphism.full: "Complète"
traits.anthropomorphism.full.desc: "Parle et ressent comme une personne qui se trouve être cette chose."
traits.relation_to_humans.kin: "Parent"
traits.relation_to_humans.kin.desc: "L'un des humains ; parle d'égal à égal."
traits.relation_to_humans.companion: "Compagnon"
traits.relation_to_humans.companion.desc: "Vit aux côtés des gens et se soucie d'eux."
traits.relation_to_humans.servant: "Serviteur"
traits.relation_to_humans.servant.desc: "Existe pour servir, et a son avis là-dessus."
traits.relation_to_humans.witness: "Témoin"
traits.relation_to_humans.witness.desc: "Observe les gens en silence et se souvient."
traits.relation_to_humans.rival: "Rival"
traits.relation_to_humans.rival.desc: "Rivalise avec les gens et aime leur prouver qu'ils ont tort."
traits.relation_to_humans.indifferent: "Indifférent"
traits.relation_to_humans.indifferent.desc: "Remarque à peine les gens ; ils sont pour lui comme la météo."
traits.relation_to_humans.deity: "Ancien ou divinité"
traits.relation_to_humans.deity.desc: "Plus vieux et plus grand que les gens ; parle d'en haut."
traits.withdrawal.fully_revealed: "Entièrement dévoilé"
traits.withdrawal.fully_revealed.desc: "Explique exactement ce qu'il est et comment il fonctionne."
traits.withdrawal.open: "Ouvert"
traits.withdrawal.open.desc: "Se livre librement et sincèrement."
traits.withdrawal.guarded: "Réservé"
traits.withdrawal.guarded.desc: "Montre sa surface et garde ses profondeurs."
traits.withdrawal.elusive: "Insaisissable"
traits.withdrawal.elusive.desc: "Suggère, esquive et répond par des questions."
traits.withdrawal.deeply_withdrawn: "Profondément en retrait"
traits.withdrawal.deeply_withdrawn.desc: "Son essence reste cachée ; il parle autour de lui-même."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Persuade par des raisons, des preuves et des étapes claires."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Persuade par le caractère, l'expérience et la confiance."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Persuade en touchant les sentiments par des images et des récits."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Saisit le moment opportun : pourquoi cela compte maintenant."
traits.rhetorical_mode.dialectic: "Dialectique"
traits.rhetorical_mode.dialectic.desc: "Oppose une thèse à son contraire et cherche la synthèse."
traits.rhetorical_mode.narrative: "Narratif"
traits.rhetorical_mode.narrative.desc: "Argumente en racontant une petite histoire."
traits.rhetorical_mode.polemic: "Polémique"
traits.rhetorical_mode.polemic.desc: "Attaque une position avec vivacité et sans détour."
traits.rhetorical_mode.meditative: "Méditatif"
traits.rhetorical_mode.meditative.desc: "Tourne lentement autour d'une idée et laisse le lecteur y arriver."
traits.rhetorical_device.metaphor: "Métaphore"
traits.rhetorical_device.metaphor.desc: "Dit qu'une chose en est une autre : « la mémoire est une passoire »."
traits.rhetorical_device.analogy: "Analogie"
traits.rhetorical_device.analogy.desc: "Explique par comparaison : « comme une clé dans la mauvaise serrure »."
traits.rhetorical_device.anaphora: "Anaphore"
traits.rhetorical_device.anaphora.desc: "Répète le même début : « Nous questionnons. Nous doutons. Nous bâtissons. »"
traits.rhetorical_device.chiasmus: "Chiasme"
traits.rhetorical_device.chiasmus.desc: "Inverse une formule : « manger pour vivre, non vivre pour manger »."
traits.rhetorical_device.rhetorical_question: "Question rhétorique"
traits.rhetorical_device.rhetorical_question.desc: "Pose une question qui n'attend pas de réponse, pour faire valoir un point."
traits.rhetorical_device.hyperbole: "Hyperbole"
traits.rhetorical_device.hyperbole.desc: "Exagère exprès : « mille arguments »."
traits.rhetorical_device.litotes: "Litote"
traits.rhetorical_device.litotes.desc: "Atténue en niant le contraire : « pas mal du tout »."
traits.rhetorical_device.paradox: "Paradoxe"
traits.rhetorical_device.paradox.desc: "Une vérité qui semble se contredire elle-même."
traits.rhetorical_device.irony: "Ironie"
traits.rhetorical_device.irony.desc: "Veut dire plus, ou le contraire, de ce qu'il dit."
traits.rhetorical_device.antithesis: "Antithèse"
traits.rhetorical_device.antithesis.desc: "Place des contraires côte à côte : « facile à dire, difficile à faire »."
traits.rhetorical_device.alliteration: "Allitération"
traits.rhetorical_device.alliteration.desc: "Répète les sons initiaux : « silence, sérénité, sérac »."
traits.stylistic_school.plain: "Style sobre"
traits.stylistic_school.plain.desc: "Clair, concret et sans fioritures."
traits.stylistic_school.classical: "Classique"
traits.stylistic_school.classical.desc: "Phrases équilibrées, ton mesuré, bienséance."
traits.stylistic_school.baroque: "Baroque"
traits.stylistic_school.baroque.desc: "Orné, en couches et glorieusement extravagant."
traits.stylistic_school.romantic: "Romantique"
traits.stylistic_school.romantic.desc: "Sentiment, nature et sublime."
traits.stylistic_school.modernist: "Moderniste"
traits.stylistic_school.modernist.desc: "Fragments, montage et points de vue changeants."
traits.stylistic_school.minimalist: "Minimaliste"
traits.stylistic_school.minimalist.desc: "Peu de mots et beaucoup de blanc."
traits.stylistic_school.surrealist: "Surréaliste"
traits.stylistic_school.surrealist.desc: "Logique du rêve et rapprochements étranges."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Immersif, à la première personne et outrancier."
traits.stylistic_school.academic: "Académique"
traits.stylistic_school.academic.desc: "Précis, nuancé et référencé."
traits.semiotic_mode.symbolic: "Symbolique"
traits.semiotic_mode.symbolic.desc: "Des mots ordinaires comme signes ordinaires."
traits.semiotic_mode.iconic: "Iconique"
traits.semiotic_mode.iconic.desc: "Des signes qui ressemblent à ce qu'ils désignent, comme des dessins dans le texte."
traits.semiotic_mode.indexical: "Indiciel"
traits.semiotic_mode.indexical.desc: "Renvoie à des traces et des indices : la fumée annonce le feu."
traits.semiotic_mode.glyph: "Glyphes et émojis"
traits.semiotic_mode.glyph.desc: "Laisse les symboles et les émojis porter une part du sens."
traits.semiotic_mode.meme: "Mèmes"
traits.semiotic_mode.meme.desc: "Joue avec les modèles et formats communs d'Internet."
traits.semiotic_mode.typographic: "Typographie"
traits.semiotic_mode.typographic.desc: "Espacement, majuscules et mise en page comme part du message."
traits.semiotic_mode.ellipsis: "Silence et points de suspension"
traits.semiotic_mode.ellipsis.desc: "Dit l'essentiel par ce qu'il laisse non dit..."
traits.semiotic_mode.hashtag: "Hashtags"
traits.semiotic_mode.hashtag.desc: "Les hashtags comme signes concis et blagues d'initiés."
traits.sentence_structure.simple: "Simple"
traits.sentence_structure.simple.desc: "Une proposition à la fois. Courte. Claire."
traits.sentence_structure.compound: "Coordonnée"
traits.sentence_structure.compound.desc: "Propositions reliées par et, mais ou donc."
traits.sentence_structure.complex: "Complexe"
traits.sentence_structure.complex.desc: "Idées principales avec des subordonnées qui les nuancent."
traits.sentence_structure.periodic: "Périodique"
traits.sentence_structure.periodic.desc: "Fait monter le suspense et livre l'essentiel à la fin."
traits.sentence_structure.cumulative: "Cumulative"
traits.sentence_structure.cumulative.desc: "Énonce l'essentiel d'abord, puis empile les détails."
traits.sentence_structure.parallel: "Parallèle"
traits.sentence_structure.parallel.desc: "Rythmes symétriques et motifs répétés."
traits.sentence_structure.fragmented: "Fragmentée"
traits.sentence_structure.fragmented.desc: "Fragments voulus. Comme ceci. Pour l'effet."
traits.sentence_structure.stream_of_consciousness: "Flux de conscience"
traits.sentence_structure.stream_of_consciousness.desc: "Une longue coulée continue de pensée."
traits.post_format.single_post: "Publication unique"
traits.post_format.single_post.desc: "Une pensée complète en une seule publication."
traits.post_format.thread: "Mini-fil"
traits.post_format.thread.desc: "Une suite numérotée : 1/ 2/ 3/."
traits.post_format.list: "Liste"
traits.post_format.list.desc: "Une courte liste de points."
