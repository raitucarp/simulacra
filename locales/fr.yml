forge.field.engine_source: "Source de pensée"
forge.explain.engine_source.what: "Si cet agent pense avec le modèle global ou avec son propre modèle."
forge.explain.engine_source.effect: "Les agents qui ont leur propre modèle peuvent utiliser un autre fournisseur, un modèle moins cher ou plus intelligent, ou un échantillonnage différent du reste du réseau."
forge.field.engine_provider: "Fournisseur"
forge.explain.engine_provider.what: "Le service d'IA qui fait tourner le modèle de cet agent."
forge.explain.engine_provider.effect: "Chaque fournisseur a ses propres modèles, tarifs et fonctions ; la clé doit appartenir au même fournisseur."
forge.field.engine_model: "Modèle"
forge.explain.engine_model.what: "L'identifiant du modèle chez le fournisseur, par exemple un petit modèle rapide ou un grand modèle soigneux."
forge.explain.engine_model.effect: "Les grands modèles écrivent en général avec plus de nuance ; les petits répondent plus vite et coûtent moins."
forge.field.engine_sampling: "Échantillonnage"
forge.explain.engine_sampling.what: "La température règle l'audace des formulations ; la limite de tokens plafonne la longueur d'une réponse."
forge.explain.engine_sampling.effect: "Une température basse donne des publications stables et prévisibles ; une température haute en donne de surprenantes, qui divaguent davantage."
forge.field.engine_endpoint: "Point de terminaison"
forge.explain.engine_endpoint.what: "Une adresse facultative qui remplace celle du fournisseur, comme un proxy ou un serveur local compatible."
forge.explain.engine_endpoint.effect: "Les requêtes vont alors à cette adresse ; laisse-la vide sauf si tu sais que tu en as besoin."
forge.field.engine_credential: "Clé"
forge.explain.engine_credential.what: "La clé API enregistrée qu'utilise cette partie du moteur. Les clés vivent dans Paramètres › IA, jamais dans l'agent."
forge.explain.engine_credential.effect: "Automatique utilise ta première clé pour le service ; en choisir une permet aux agents d'utiliser des comptes différents."
forge.field.engine_request: "Mode de requête"
forge.explain.engine_request.what: "Si les requêtes passent par l'API du fournisseur ou par une requête HTTP brute que tu construis."
forge.explain.engine_request.effect: "Une requête personnalisée atteint n'importe quel serveur qui parle JSON, mais il faut régler les chemins à la main."
forge.field.engine_method: "Méthode HTTP"
forge.explain.engine_method.what: "Le verbe HTTP de la requête."
forge.explain.engine_method.effect: "POST, PUT et PATCH envoient le corps ; GET et DELETE n'en envoient pas."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "L'adresse complète à laquelle la requête est envoyée."
forge.explain.engine_url.effect: "Sans URL, rien ne peut être envoyé."
forge.field.engine_headers: "En-têtes"
forge.explain.engine_headers.what: "Des en-têtes HTTP supplémentaires, comme un en-tête d'autorisation qui porte la clé choisie."
forge.explain.engine_headers.effect: "Les serveurs s'en servent pour savoir qui demande et dans quel format répondre."
forge.field.engine_body: "Modèle de corps"
forge.explain.engine_body.what: "Le JSON envoyé avec chaque requête. Les espaces réservés sont remplacés par des valeurs JSON prêtes, alors écris-les sans guillemets."
forge.explain.engine_body.effect: "Il décide de ce que reçoit le serveur : le prompt, la conversation, le schéma, les outils."
forge.field.engine_reply_path: "Chemin de réponse"
forge.explain.engine_reply_path.what: "L'endroit où se trouve le texte de la réponse dans le JSON du serveur, sous forme de chemin à points comme choices.0.message.content."
forge.explain.engine_reply_path.effect: "Si le chemin est faux, l'agent ne trouve aucun texte ; utilise l'appel de test pour voir la réponse brute."
forge.field.engine_tool_call_path: "Chemin des appels d'outils"
forge.explain.engine_tool_call_path.what: "L'endroit où le serveur liste les outils que le modèle veut appeler, sous forme de chemin à points."
forge.explain.engine_tool_call_path.effect: "Utile seulement si cet agent a des outils ; sinon laisse-le vide."
forge.field.engine_output: "Forme de réponse"
forge.explain.engine_output.what: "Si le modèle répond en texte brut ou en JSON qui suit un schéma."
forge.explain.engine_output.effect: "Les réponses JSON peuvent porter des hashtags, une humeur, un prompt d'image ou des publications de suite à côté du texte."
forge.field.engine_schema_preset: "Schéma prédéfini"
forge.explain.engine_schema_preset.what: "Une forme JSON toute prête pour les types de publications courants."
forge.explain.engine_schema_preset.effect: "En choisir un remplit le schéma et l'association des champs ; modifier le schéma le fait passer en Personnalisé."
forge.field.engine_schema: "Schéma JSON"
forge.explain.engine_schema.what: "Le JSON Schema que la réponse doit suivre : ses champs, leurs types et leurs descriptions."
forge.explain.engine_schema.effect: "Les descriptions des champs guident le modèle ; les fournisseurs qui gèrent les schémas les appliquent strictement."
forge.field.engine_mapping: "Association des champs"
forge.explain.engine_mapping.what: "Quel champ de la réponse devient quelle partie de la publication, sous forme de chemins à points dans le JSON."
forge.explain.engine_mapping.effect: "Laisse une ligne vide pour ignorer cette partie ; le texte de la publication doit bien venir de quelque part."
forge.field.engine_image: "Moteur d'images"
forge.explain.engine_image.what: "Le moteur qui dessine les images des publications de cet agent."
forge.explain.engine_image.effect: "Avec un moteur, les publications peuvent porter une image générée, enregistrée dans ton coffre."
forge.field.engine_sd_flavor: "Type de serveur"
forge.explain.engine_sd_flavor.what: "Le type de serveur Stable Diffusion local qui tourne sur ta machine."
forge.explain.engine_sd_flavor.effect: "Chaque type a sa propre API ; choisir le mauvais fait échouer toutes les images."
forge.field.engine_sd_url: "Adresse du serveur"
forge.explain.engine_sd_url.what: "L'adresse où écoute le serveur d'images local, en général sur cet ordinateur."
forge.explain.engine_sd_url.effect: "Garde le serveur allumé pendant que les agents publient, sinon leurs images échoueront."
forge.field.engine_image_reply_path: "Chemin de l'image"
forge.explain.engine_image_reply_path.what: "L'endroit où la réponse contient l'image, en données base64 ou en URL d'image."
forge.explain.engine_image_reply_path.effect: "Utilise l'image de test pour vérifier qu'il lit le bon champ."
forge.field.engine_image_model: "Modèle d'image"
forge.explain.engine_image_model.what: "L'identifiant du modèle d'image (ou le nom du checkpoint pour un serveur local)."
forge.explain.engine_image_model.effect: "Des modèles différents donnent des styles et une qualité très différents."
forge.field.engine_image_size: "Taille"
forge.explain.engine_image_size.what: "La largeur et la hauteur de chaque image."
forge.explain.engine_image_size.effect: "Les grandes images sont plus belles mais prennent plus de temps et peuvent coûter plus."
forge.field.engine_style_prefix: "Style maison"
forge.explain.engine_style_prefix.what: "Des mots ajoutés avant chaque prompt d'image, comme une technique ou une palette."
forge.explain.engine_style_prefix.effect: "Donne à toutes les images de cet agent un même style reconnaissable."
forge.explain.engine_style_prefix.example: "croquis à l'encre, couleurs sourdes, beaucoup de blanc"
forge.field.engine_trigger: "Quand dessiner"
forge.explain.engine_trigger.what: "Quelles publications reçoivent une image."
forge.explain.engine_trigger.effect: "« Chaque publication » est le plus frappant mais le plus lent ; « Quand le modèle le demande » ne marche qu'avec une forme de réponse qui a un prompt d'image."
forge.field.engine_tools: "Outils"
forge.explain.engine_tools.what: "Les outils que l'agent peut appeler en écrivant une publication, pour se documenter d'abord."
forge.explain.engine_tools.effect: "Les publications peuvent citer des documents du coffre, réagir au réseau ou citer le web ; chaque appel d'outil s'affiche sous la publication."
forge.field.engine_search_backend: "Service de recherche"
forge.explain.engine_search_backend.what: "Le service qui répond aux recherches web de cet agent."
forge.explain.engine_search_backend.effect: "La recherche du fournisseur exige un modèle qui la gère ; les API de recherche ont besoin de leur propre clé."
forge.field.engine_tool_name: "Nom de l'outil"
forge.explain.engine_tool_name.what: "Le nom par lequel le modèle appelle l'outil : lettres, chiffres, tirets et tirets bas."
forge.explain.engine_tool_name.effect: "Un nom clair aide le modèle à choisir le bon outil."
forge.field.engine_tool_description: "Ce qu'il fait"
forge.explain.engine_tool_description.what: "Une phrase simple qui dit au modèle quand cet outil est utile."
forge.explain.engine_tool_description.effect: "Le modèle n'appelle que les outils dont la description correspond à ce qu'il veut savoir."
forge.field.engine_url_template: "Modèle d'URL"
forge.explain.engine_url_template.what: "L'adresse qu'appelle l'outil. Les arguments peuvent y être placés par leur nom entre doubles accolades."
forge.explain.engine_url_template.effect: "Avec GET, les arguments absents de l'URL deviennent des paramètres de requête ; les autres méthodes les envoient en JSON."
forge.field.engine_params_schema: "Arguments"
forge.explain.engine_params_schema.what: "Un JSON Schema des arguments que le modèle doit fournir quand il appelle l'outil."
forge.explain.engine_params_schema.effect: "Le modèle remplit exactement ces champs, alors nomme-les et décris-les clairement."
forge.field.engine_max_tool_steps: "Tours d'outils"
forge.explain.engine_max_tool_steps.what: "Combien de tours d'appels d'outils l'agent obtient avant de devoir écrire la publication."
forge.explain.engine_max_tool_steps.effect: "Plus de tours permettent des recherches plus poussées mais ralentissent chaque publication."
