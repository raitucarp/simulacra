arena.preset.trolley.title: "Le dilemme du tramway"
arena.preset.trolley.premise: "Un tramway fou va tuer cinq personnes sur la voie s'il n'est pas dévié. Le dévier tuera une autre personne."
arena.preset.trolley.question: "Faut-il dévier le tramway ?"
arena.preset.trolley.v1: "Comment le dévier"
arena.preset.trolley.v1_values: "actionner un levier | pousser une personne sur la voie"
arena.preset.trolley.v2: "La personne seule"
arena.preset.trolley.v2_values: "un inconnu | quelqu'un que vous aimez"
arena.preset.marys_room.title: "La chambre de Mary"
arena.preset.marys_room.premise: "Mary est une scientifique qui connaît la physique et la biologie de la vision des couleurs, mais elle a toujours vécu dans une chambre en noir et blanc. Un jour, elle en sort et voit du rouge pour la première fois."
arena.preset.marys_room.question: "Mary apprend-elle quelque chose de nouveau ?"
arena.preset.marys_room.v1: "Ce qu'elle savait"
arena.preset.marys_room.v1_values: "tous les faits physiques | la plupart des faits, avec des lacunes"
arena.preset.marys_room.v2: "Ce qu'elle voit d'abord"
arena.preset.marys_room.v2_values: "une tomate mûre | un simple carré rouge"
arena.preset.ship_of_theseus.title: "Le navire de Thésée"
arena.preset.ship_of_theseus.premise: "Les planches d'un navire sont remplacées une à une jusqu'à ce qu'il ne reste aucune planche d'origine."
arena.preset.ship_of_theseus.question: "Est-ce encore le même navire ?"
arena.preset.ship_of_theseus.v1: "Rythme du remplacement"
arena.preset.ship_of_theseus.v1_values: "sur de nombreuses années | en une semaine"
arena.preset.ship_of_theseus.v2: "Les anciennes planches"
arena.preset.ship_of_theseus.v2_values: "restent en réserve | servent à reconstruire un second navire"
arena.preset.experience_machine.title: "La machine à expériences"
arena.preset.experience_machine.premise: "Une machine peut vous faire vivre toutes les expériences de votre choix pour le reste de votre vie. Tant que vous êtes branché, vous les croyez réelles."
arena.preset.experience_machine.question: "Faut-il vous brancher pour la vie ?"
arena.preset.experience_machine.v1: "Votre vie actuelle"
arena.preset.experience_machine.v1_values: "heureuse et sûre | pleine d'épreuves"
arena.preset.experience_machine.v2: "Les personnes qui dépendent de vous"
arena.preset.experience_machine.v2_values: "personne | une famille"
arena.preset.veil_of_ignorance.title: "Le voile d'ignorance"
arena.preset.veil_of_ignorance.premise: "Vous choisissez les règles de partage des richesses d'une société sans savoir qui vous y serez : vos talents, votre santé ou votre famille."
arena.preset.veil_of_ignorance.question: "Choisiriez-vous des règles qui garantissent aux plus défavorisés un minimum décent, même si cela fait baisser la moyenne ?"
arena.preset.veil_of_ignorance.v1: "Ce que coûte le minimum"
arena.preset.veil_of_ignorance.v1_values: "un peu de la moyenne | beaucoup de la moyenne"
arena.preset.veil_of_ignorance.v2: "Votre rapport au risque"
arena.preset.veil_of_ignorance.v2_values: "prudent | prêt à parier"
arena.preset.chinese_room.title: "La chambre chinoise"
arena.preset.chinese_room.premise: "Une personne qui ne connaît pas le chinois est assise dans une pièce avec un manuel de règles pour répondre à des messages écrits en chinois. Dehors, personne ne distingue ses réponses de celles d'un locuteur natif."
arena.preset.chinese_room.question: "Quelque chose dans la pièce comprend-il le chinois ?"
arena.preset.chinese_room.v1: "Qui suit les règles"
arena.preset.chinese_room.v1_values: "une personne avec un manuel | un ordinateur qui exécute un programme"
arena.preset.chinese_room.v2: "Son lien au monde"
arena.preset.chinese_room.v2_values: "des messages seulement | un corps de robot avec caméras"
arena.preset.newcomb.title: "Le paradoxe de Newcomb"
arena.preset.newcomb.premise: "Un prédicteur met 1 000 dans une boîte transparente, et 1 000 000 dans une boîte opaque seulement s'il a prédit que vous ne prendriez que la boîte opaque. Vous pouvez prendre les deux boîtes ou seulement l'opaque."
arena.preset.newcomb.question: "Faut-il ne prendre que la boîte opaque ?"
arena.preset.newcomb.v1: "Le bilan du prédicteur"
arena.preset.newcomb.v1_values: "jamais pris en défaut | juste neuf fois sur dix"
arena.preset.newcomb.v2: "Quand il a prédit"
arena.preset.newcomb.v2_values: "il y a une minute | il y a un an"
arena.preset.original_position.title: "La position originelle"
arena.preset.original_position.premise: "Des représentants de personnes libres et égales s'accordent sur des principes de justice sans savoir quels intérêts ils représenteront."
arena.preset.original_position.question: "Les libertés de base doivent-elles passer avant les gains économiques ?"
arena.preset.original_position.v1: "La richesse de la société"
arena.preset.original_position.v1_values: "rare | abondante"
arena.preset.original_position.v2: "Le gain en jeu"
arena.preset.original_position.v2_values: "faible | important"
