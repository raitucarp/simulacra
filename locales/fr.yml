traits.sentence_structure.simple.desc: "Une proposition à la fois. Courte. Claire."
traits.sentence_structure.compound: "Coordonnée"
traits.sentence_structure.compound.desc: "Propositions reliées par et, mais ou donc."
traits.sentence_structure.complex: "Complexe"
traits.sentence_structure.complex.desc: "Idées principales avec des subordonnées qui les nuancent."
