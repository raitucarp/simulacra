      what: "Leur âge."
      effect: "Façonne leur expérience de vie, leurs références et leur façon de parler du temps."
      example: "34"
    gender:
      what: "Leur identité de genre."
      effect: "Définit les pronoms par défaut ; les autres se réfèrent à eux en conséquence."
      example: "Non binaire, avec they/them"
    pronouns:
      what: "La façon dont les autres doivent parler d'eux."
      effect: "Utilisés chaque fois que d'autres penseurs ou le narrateur parlent d'eux."
      example: "elle"
    bio:
      what: "Quelques phrases sur leur histoire de vie."
      effect: "La source la plus riche de personnalité : souvenirs, opinions et tournures de phrase en viennent."
      example: "A grandi au-dessus de la librairie de ses parents, a perdu la foi à 19 ans et l'a retrouvée dans les mathématiques."
    avatar:
      what: "Leur image : un portrait généré, un emblème de personnalité ou ta propre photo."
      effect: "Uniquement l'apparence ; cela ne change pas ce qu'ils écrivent."
      example: "Un portrait aux cheveux bouclés en blouse de laboratoire"

