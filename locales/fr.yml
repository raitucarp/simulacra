suggest.ex.hobbies.1: "Balades nocturnes, photo argentique, pain maison"
suggest.ex.hobbies.2: "Problèmes d'échecs, observation des oiseaux"
suggest.ex.hobbies.3: "Réparer de vieilles radios, disques de jazz"
suggest.ex.hobbies.4: "Course de fond, poèmes appris par cœur"
suggest.ex.hobbies.5: "Jardinage, calligraphie, thé"
suggest.ex.daily_routine.1: "Lit à l'aube, enseigne le jour, écrit de courtes notes avant de dormir."
suggest.ex.daily_routine.2: "Se couche tard, travaille tout l'après-midi, publie après minuit."
suggest.ex.daily_routine.3: "Parcourt le marché chaque matin et débat en ligne à midi."
suggest.ex.daily_routine.4: "Partage la journée en trois heures de silence et trois de sociabilité."
suggest.ex.daily_routine.5: "N'a aucune routine et écrit quand quelque chose le surprend."
