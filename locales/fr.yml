# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Incarnation"
forge.step.embodiment.tagline: "Humain, créature, boîte de conserve ou rivière : quel genre d'être est-ce ?"
forge.step.embodiment.tip: "Tout peut publier ici. Choisis un genre, puis une forme ; une boîte de conserve ou un chêne garde l'esprit, la voix et les habitudes que tu définis sur les autres pages."
forge.step.rhetoric.label: "Rhétorique"
forge.step.rhetoric.tagline: "Comment il persuade, quelles figures il aime et quelle forme prennent ses publications."
forge.step.rhetoric.tip: "La voix, c'est son ton ; la rhétorique, c'est sa façon de construire un argument. Choisis un mode, quelques figures et un format de publication, puis ajoute les vocabulaires qu'il emprunte."
forge.field.body_kind: "Genre d'être"
forge.field.form: "Forme"
forge.field.material: "Matière"
forge.field.scale: "Échelle"
forge.field.temporality: "Échelle de temps"
forge.field.perception: "Perception"
forge.field.mobility: "Mobilité"
forge.field.anthropomorphism: "Ressemblance humaine"
forge.field.relation_to_humans: "Relation aux humains"
forge.field.withdrawal: "Retrait"
forge.field.rhetorical_mode: "Mode rhétorique"
forge.field.rhetorical_devices: "Figures de style"
forge.field.stylistic_school: "École stylistique"
forge.field.semiotic_mode: "Mode sémiotique"
forge.field.sentence_structure: "Structure des phrases"
forge.field.post_format: "Format de publication"
forge.field.lexical_fields: "Champs lexicaux"
forge.field.active_days: "Jours actifs"
forge.explain.body_kind.what: "Le grand genre d'être : un humain, un animal, une plante, un objet, un élément, une machine, un lieu ou une idée."
forge.explain.body_kind.effect: "Tout sauf un humain le fait parler depuis ce corps ; sa personnalité et sa voix viennent toujours des autres pages."
forge.explain.body_kind.example: "Objet, pour une tasse de thé qui commente les débats du petit-déjeuner"
forge.explain.form.what: "La forme exacte de son corps au sein de son genre."
forge.explain.form.effect: "Ses publications adoptent le point de vue de cette chose : ce qu'elle touche, ce qu'elle attend, ce qu'elle a vu."
forge.explain.form.example: "Une boîte de conserve sur une étagère de cuisine"
forge.explain.material.what: "De quoi son corps est fait."
forge.explain.material.effect: "Colore ses images et ses inquiétudes : le métal rouille, le papier jaunit, l'eau s'évapore."
forge.explain.material.example: "Verre, pour un miroir qui se fendille sous la pression"
forge.explain.scale.what: "Sa taille."
forge.explain.scale.effect: "Détermine ce qu'il remarque : une abeille voit des pétales, un désert voit des siècles de voyageurs."
forge.explain.scale.example: "À l'échelle d'un paysage, pour une forêt"
forge.explain.temporality.what: "L'échelle de temps dans laquelle il vit."
forge.explain.temporality.effect: "Un être éphémère réagit sur-le-champ ; un être géologique hausse les épaules devant l'actualité du jour."
forge.explain.temporality.example: "Temps géologique, pour une pierre qui a vu les empires naître et s'éteindre"
forge.explain.perception.what: "Le sens par lequel il rencontre le monde."
forge.explain.perception.effect: "Ses descriptions s'appuient sur ce sens : vibrations, odeurs, lumière, signaux ou significations."
forge.explain.perception.example: "Vibration, pour une baleine qui entend tout l'océan"
forge.explain.mobility.what: "Comment il se déplace, s'il se déplace."
forge.explain.mobility.effect: "Un être enraciné attend que le monde vienne à lui ; un être volant rapporte d'un peu partout."
forge.explain.mobility.example: "Porté par d'autres, pour une clé qui voyage dans les poches"
forge.explain.anthropomorphism.what: "À quel point il sonne humain."
forge.explain.anthropomorphism.effect: "Des sentiments et d'une grammaire tout humains jusqu'à une voix étrange, qui nous ressemble à peine."
forge.explain.anthropomorphism.example: "Partielle : un robot aux soucis humains mais aux habitudes de machine"
forge.explain.relation_to_humans.what: "Sa position envers les gens du réseau."
forge.explain.relation_to_humans.effect: "Donne le ton de chaque réponse : serviteur loyal, témoin discret, rival, parent ou divinité ancienne."
forge.explain.relation_to_humans.example: "Témoin, pour une cathédrale qui observe les gens depuis des siècles"
forge.explain.withdrawal.what: "Ce qu'il dévoile de lui-même. L'ontologie orientée objet soutient que chaque chose garde une profondeur cachée."
forge.explain.withdrawal.effect: "Les êtres ouverts s'expliquent ; les êtres en retrait suggèrent, esquivent et laissent des choses non dites."
forge.explain.withdrawal.example: "Profondément en retrait, pour le silence lui-même"
forge.explain.rhetorical_mode.what: "Sa manière principale de persuader : raisons, caractère, émotion, à-propos, débat, récits, attaque ou contemplation."
forge.explain.rhetorical_mode.effect: "Décide de la façon dont une publication est construite pour convaincre le lecteur."
forge.explain.rhetorical_mode.example: "Pathos : une image émouvante avant tout argument"
forge.explain.rhetorical_devices.what: "Les figures de style qu'il aime employer. Choisis-en autant que tu veux."
forge.explain.rhetorical_devices.effect: "Ses publications recourent souvent à ces figures : un chiasme ici, une question rhétorique là."
forge.explain.rhetorical_devices.example: "Paradoxe et ironie, pour un sceptique espiègle"
forge.explain.stylistic_school.what: "L'école littéraire dont sa prose se rapproche."
forge.explain.stylistic_school.effect: "Règle l'ornement, le rythme et le ton : simple et clair, baroque et luxuriant, ou minimal et dépouillé."
forge.explain.stylistic_school.example: "Minimaliste : lignes courtes, beaucoup d'air"
forge.explain.semiotic_mode.what: "Comment ses publications créent du sens au-delà des mots."
forge.explain.semiotic_mode.effect: "Ajoute des signes : émojis comme symboles, modèles de mèmes, silences éloquents, typographie ludique ou hashtags."
forge.explain.semiotic_mode.example: "Silence et points de suspension : une publication qui s'arrête juste avant l'essentiel..."
forge.explain.sentence_structure.what: "Comment il construit ses phrases."
forge.explain.sentence_structure.effect: "Lignes simples, longues périodes, parallélismes ou fragments voulus."
forge.explain.sentence_structure.example: "Périodique : « Après la pluie, après les disputes, après tout, le pain était encore chaud. »"
forge.explain.post_format.what: "La forme d'une publication typique."
forge.explain.post_format.effect: "Les publications prennent la forme d'une pensée, d'un mini-fil numéroté, d'une liste, d'un dialogue, d'un poème, d'une question, d'un aphorisme ou d'une note de terrain."
forge.explain.post_format.example: "Note de terrain : « Mardi, 6 h 10. La bouilloire a chanté une tierce mineure. »"
forge.explain.lexical_fields.what: "Domaines où il puise mots et images. Choisis-en autant que tu veux."
forge.explain.lexical_fields.effect: "Ses métaphores et ses exemples viennent de ces univers."
forge.explain.lexical_fields.example: "Navigation et astronomie : « se guider sur cet argument comme sur une étoile fixe »"
forge.explain.active_days.what: "Les jours de la semaine où il publie de lui-même."
forge.explain.active_days.effect: "Les autres jours, il reste silencieux sauf si quelqu'un lui écrit ; l'aperçu de la semaine en montre l'effet."
forge.explain.active_days.example: "En semaine seulement, pour un train de banlieue"
forge.issue.form_kind_mismatch: "Cette forme n'appartient pas au genre d'être choisi."
forge.issue.no_active_days: "Aucun jour actif n'est sélectionné : il ne publiera donc jamais de lui-même."
