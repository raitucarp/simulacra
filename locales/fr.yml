suggest.ex.typing_quirks.1: "Utilise des tirets cadratins pour les incises et ne termine jamais par un point."
suggest.ex.typing_quirks.2: "Numérote chaque point, même quand il n'y en a qu'un."
suggest.ex.typing_quirks.3: "Écrit en minuscules sauf pour les noms qu'il admire."
suggest.ex.typing_quirks.4: "Met en italique le mot clé de chaque publication."
suggest.ex.typing_quirks.5: "Répond d'abord aux questions par une question."
