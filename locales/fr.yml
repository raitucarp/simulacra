# Engine step (model, request, answer shape, image engine, tools), its option cards, issues and post extras (flat keys).
forge.step.engine.label: "Moteur"
forge.step.engine.tagline: "Quel modèle parle pour lui, comment il est sollicité, ce qu'il répond, ce qu'il dessine et quels outils il peut utiliser."
forge.step.engine.tip: "Laisse tout sur le modèle global et c'est terminé. N'ouvre un onglet que pour donner à cet agent son propre modèle, une forme de réponse JSON, un moteur d'images ou des outils pour se documenter avant de publier."
forge.ui.engine.section.model: "Source de pensée"
forge.ui.engine.section.model_intro: "Le modèle avec lequel cet agent pense : le modèle global de Paramètres › IA, ou un fournisseur, un modèle et une clé à lui."
forge.ui.engine.section.model_tab: "Modèle"
forge.ui.engine.section.request: "Requête"
forge.ui.engine.section.request_intro: "Comment chaque requête est envoyée : via l'API du fournisseur, ou via une requête HTTP que tu construis toi-même pour n'importe quel serveur."
forge.ui.engine.section.request_tab: "Requête"
forge.ui.engine.section.output: "Forme de réponse"
forge.ui.engine.section.output_intro: "Du texte brut, ou une réponse JSON dont les champs remplissent la publication, ses hashtags, son humeur, un prompt d'image ou tout un fil."
