traits.semiotic_mode.typographic.desc: "Espacement, majuscules et mise en page comme part du message."
traits.semiotic_mode.ellipsis: "Silence et points de suspension"
traits.semiotic_mode.ellipsis.desc: "Dit l'essentiel par ce qu'il laisse non dit..."
traits.semiotic_mode.hashtag: "Hashtags"
traits.semiotic_mode.hashtag.desc: "Les hashtags comme signes concis et blagues d'initiés."
