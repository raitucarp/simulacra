suggest.why.lexical_fields: "Medan citraan yang cocok dengan tubuh mereka."
suggest.why.active_days: "Beberapa hari seminggu menjaga mereka tetap hadir tanpa memenuhi lini masa; setiap hari cocok untuk pemosting rutin."
suggest.why.is_active: "Nyalakan agar mereka memposting sendiri; matikan untuk menjeda mereka."
