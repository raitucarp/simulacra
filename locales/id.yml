forge.field.engine_source: "Sumber pikiran"
forge.explain.engine_source.what: "Apakah agen ini berpikir dengan model global atau dengan model miliknya sendiri."
forge.explain.engine_source.effect: "Agen dengan model sendiri bisa memakai penyedia lain, model yang lebih murah atau lebih cerdas, atau sampling yang berbeda dari jaringan lainnya."
forge.field.engine_provider: "Penyedia"
forge.explain.engine_provider.what: "Layanan AI yang menjalankan model agen ini."
forge.explain.engine_provider.effect: "Setiap penyedia punya model, harga, dan fitur sendiri; kuncinya harus dari penyedia yang sama."
forge.field.engine_model: "Model"
forge.explain.engine_model.what: "ID model di penyedia, misalnya model kecil yang cepat atau model besar yang cermat."
forge.explain.engine_model.effect: "Model besar biasanya menulis dengan lebih bernuansa; model kecil menjawab lebih cepat dan lebih murah."
forge.field.engine_sampling: "Sampling"
forge.explain.engine_sampling.what: "Temperatur mengatur seberapa berani pilihan katanya; batas token membatasi panjang satu jawaban."
forge.explain.engine_sampling.effect: "Temperatur rendah menghasilkan postingan yang stabil dan mudah ditebak; temperatur tinggi menghasilkan yang mengejutkan dan lebih melantur."
forge.field.engine_endpoint: "Endpoint"
forge.explain.engine_endpoint.what: "Alamat opsional pengganti alamat bawaan penyedia, misalnya proxy atau server lokal yang kompatibel."
forge.explain.engine_endpoint.effect: "Permintaan dikirim ke alamat ini; kosongkan kecuali kamu yakin membutuhkannya."
forge.field.engine_credential: "Kunci"
forge.explain.engine_credential.what: "Kunci API tersimpan yang dipakai bagian mesin ini. Kunci disimpan di Pengaturan › AI, tidak pernah di dalam agen."
forge.explain.engine_credential.effect: "Otomatis memakai kunci pertamamu untuk layanan itu; memilih kunci memungkinkan agen memakai akun berbeda."
forge.field.engine_request: "Mode permintaan"
forge.explain.engine_request.what: "Apakah permintaan memakai API milik penyedia atau permintaan HTTP mentah yang kamu susun."
forge.explain.engine_request.effect: "Permintaan kustom bisa menjangkau server mana pun yang berbahasa JSON, tetapi jalurnya harus diatur manual."
forge.field.engine_method: "Metode HTTP"
forge.explain.engine_method.what: "Kata kerja HTTP untuk permintaan ini."
forge.explain.engine_method.effect: "POST, PUT, dan PATCH mengirim body; GET dan DELETE tidak."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "Alamat lengkap tujuan permintaan."
forge.explain.engine_url.effect: "Tanpa URL, tidak ada yang bisa dikirim."
forge.field.engine_headers: "Header"
forge.explain.engine_headers.what: "Header HTTP tambahan, misalnya header otorisasi yang membawa kunci terpilih."
forge.explain.engine_headers.effect: "Server memakainya untuk tahu siapa yang bertanya dan format jawaban yang diminta."
forge.field.engine_body: "Templat body"
forge.explain.engine_body.what: "JSON yang dikirim bersama setiap permintaan. Placeholder diganti nilai JSON siap pakai, jadi tulis tanpa tanda kutip."
forge.explain.engine_body.effect: "Ini menentukan apa yang diterima server: prompt, percakapan, skema, dan alat."
forge.field.engine_reply_path: "Jalur balasan"
forge.explain.engine_reply_path.what: "Letak teks jawaban di balasan JSON server, sebagai jalur bertitik seperti choices.0.message.content."
forge.explain.engine_reply_path.effect: "Jika jalurnya salah, agen tidak menemukan teks; pakai Panggilan uji untuk melihat balasan mentah."
forge.field.engine_tool_call_path: "Jalur panggilan alat"
forge.explain.engine_tool_call_path.what: "Letak daftar alat yang ingin dipanggil model di balasan server, sebagai jalur bertitik."
forge.explain.engine_tool_call_path.effect: "Hanya perlu jika agen ini punya alat; selain itu kosongkan."
forge.field.engine_output: "Bentuk jawaban"
forge.explain.engine_output.what: "Apakah model menjawab dengan teks biasa atau dengan JSON yang mengikuti skema."
forge.explain.engine_output.effect: "Jawaban JSON bisa membawa tagar, suasana hati, prompt gambar, atau postingan lanjutan di samping teksnya."
forge.field.engine_schema_preset: "Preset skema"
forge.explain.engine_schema_preset.what: "Bentuk JSON siap pakai untuk jenis postingan yang umum."
forge.explain.engine_schema_preset.effect: "Memilih satu akan mengisi skema dan pemetaan kolom; mengubah skema menjadikannya Kustom."
forge.field.engine_schema: "Skema JSON"
forge.explain.engine_schema.what: "JSON Schema yang harus diikuti jawaban: kolom, tipe, dan deskripsinya."
forge.explain.engine_schema.effect: "Deskripsi kolom memandu model; penyedia yang mendukung skema menegakkannya dengan ketat."
forge.field.engine_mapping: "Pemetaan kolom"
forge.explain.engine_mapping.what: "Kolom jawaban mana yang menjadi bagian postingan mana, sebagai jalur bertitik ke dalam JSON."
forge.explain.engine_mapping.effect: "Kosongkan baris untuk mengabaikan bagian itu; teks postingan harus berasal dari suatu kolom."
forge.field.engine_image: "Mesin gambar"
forge.explain.engine_image.what: "Mesin yang menggambar untuk postingan agen ini."
forge.explain.engine_image.effect: "Dengan mesin, postingan bisa membawa gambar buatan yang disimpan di brankasmu."
forge.field.engine_sd_flavor: "Jenis server"
forge.explain.engine_sd_flavor.what: "Jenis server Stable Diffusion lokal yang berjalan di komputermu."
forge.explain.engine_sd_flavor.effect: "Setiap jenis punya API sendiri; salah pilih membuat semua gambar gagal."
forge.field.engine_sd_url: "Alamat server"
forge.explain.engine_sd_url.what: "Tempat server gambar lokal mendengarkan, biasanya di komputer ini."
forge.explain.engine_sd_url.effect: "Biarkan server tetap berjalan selama agen memposting, atau gambarnya akan gagal."
forge.field.engine_image_reply_path: "Jalur gambar"
forge.explain.engine_image_reply_path.what: "Letak gambar di balasan, sebagai data base64 atau URL gambar."
forge.explain.engine_image_reply_path.effect: "Pakai Gambar uji untuk memastikan kolom yang dibaca benar."
forge.field.engine_image_model: "Model gambar"
forge.explain.engine_image_model.what: "ID model gambar (atau nama checkpoint untuk server lokal)."
forge.explain.engine_image_model.effect: "Model yang berbeda menghasilkan gaya dan kualitas yang sangat berbeda."
forge.field.engine_image_size: "Ukuran"
forge.explain.engine_image_size.what: "Lebar dan tinggi setiap gambar."
forge.explain.engine_image_size.effect: "Gambar besar tampak lebih bagus tetapi lebih lama dan bisa lebih mahal."
forge.field.engine_style_prefix: "Gaya khas"
forge.explain.engine_style_prefix.what: "Kata-kata yang ditambahkan sebelum setiap prompt gambar, misalnya medium atau palet warna."
forge.explain.engine_style_prefix.effect: "Memberi semua gambar agen ini satu tampilan yang mudah dikenali."
forge.explain.engine_style_prefix.example: "sketsa tinta, warna redup, banyak ruang kosong"
forge.field.engine_trigger: "Kapan menggambar"
forge.explain.engine_trigger.what: "Postingan mana yang mendapat gambar."
forge.explain.engine_trigger.effect: "“Setiap postingan” paling mencolok tetapi paling lambat; “Saat model meminta” hanya bekerja dengan bentuk jawaban yang punya prompt gambar."
forge.field.engine_tools: "Alat"
forge.explain.engine_tools.what: "Alat yang boleh dipanggil agen saat menulis postingan, untuk mencari informasi dulu."
forge.explain.engine_tools.effect: "Postingan bisa mengutip dokumen brankas, menanggapi jaringan, atau merujuk web; setiap panggilan alat tampil di bawah postingan."
forge.field.engine_search_backend: "Layanan pencarian"
forge.explain.engine_search_backend.what: "Layanan yang menjawab pencarian web agen ini."
forge.explain.engine_search_backend.effect: "Pencarian penyedia butuh model yang mendukungnya; API pencarian butuh kunci sendiri."
forge.field.engine_tool_name: "Nama alat"
forge.explain.engine_tool_name.what: "Nama yang dipakai model untuk memanggil alat: huruf, angka, tanda hubung, dan garis bawah."
forge.explain.engine_tool_name.effect: "Nama yang jelas membantu model memilih alat yang tepat."
forge.field.engine_tool_description: "Fungsinya"
forge.explain.engine_tool_description.what: "Satu kalimat sederhana yang memberi tahu model kapan alat ini berguna."
forge.explain.engine_tool_description.effect: "Model hanya memanggil alat yang deskripsinya cocok dengan yang ingin diketahuinya."
forge.field.engine_url_template: "Templat URL"
forge.explain.engine_url_template.what: "Alamat yang dipanggil alat. Argumen bisa diletakkan di dalamnya berdasarkan nama, di antara kurung kurawal ganda."
forge.explain.engine_url_template.effect: "Dengan GET, argumen yang tidak ada di URL menjadi parameter query; metode lain mengirimnya sebagai JSON."
forge.field.engine_params_schema: "Argumen"
forge.explain.engine_params_schema.what: "JSON Schema untuk argumen yang harus diberikan model saat memanggil alat."
forge.explain.engine_params_schema.effect: "Model mengisi tepat kolom-kolom ini, jadi beri nama dan deskripsi yang jelas."
forge.field.engine_max_tool_steps: "Putaran alat"
forge.explain.engine_max_tool_steps.what: "Berapa putaran panggilan alat yang didapat agen sebelum harus menulis postingan."
forge.explain.engine_max_tool_steps.effect: "Lebih banyak putaran memungkinkan riset lebih dalam, tetapi setiap postingan jadi lebih lambat."
