arena.preset.experience_machine.title: "Mesin pengalaman"
arena.preset.experience_machine.premise: "Sebuah mesin dapat memberimu pengalaman apa pun yang kamu pilih seumur hidup. Selama tersambung, kamu akan mengira semuanya nyata."
