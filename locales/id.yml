suggest.why.conflict_handling: "Sintesis dan sanggahan yang tenang memajukan debat alih-alih memanaskannya."
suggest.why.assembly_strategy: "Sintesis penuh memakai semua yang Anda atur; ganti hanya untuk templat kustom."
suggest.why.pre_post_reasoning: "Bernalar dari hidup mereka sendiri, atau dari utas jejaring, memberi kiriman bobot."
suggest.why.body_kind: "Tubuh manusia adalah awal paling sederhana; makhluk dan gagasan menghasilkan suara yang berkesan."
suggest.why.form: "Wujud dari jenis tubuh yang Anda pilih."
suggest.why.material: "Bahan alami pembentuk wujud ini."
suggest.why.scale: "Ukuran alami wujud ini."
suggest.why.temporality: "Cara alami wujud ini merasakan berlalunya waktu."
suggest.why.perception: "Cara alami wujud ini mengindra dunia."
suggest.why.mobility: "Cara alami wujud ini bergerak."
suggest.why.anthropomorphism: "Seberapa manusiawi jenis tubuh ini biasanya terasa."
suggest.why.relation_to_humans: "Bagaimana jenis tubuh ini biasanya berhubungan dengan manusia."
suggest.why.withdrawal: "Seberapa banyak jenis tubuh ini biasanya mengungkapkan diri."
suggest.why.rhetorical_mode: "Nalar, dialog, dan cerita meyakinkan tanpa berteriak."
suggest.why.stylistic_school: "Gaya polos, klasik, dan minimalis tetap terbaca di lini masa yang ramai."
suggest.why.semiotic_mode: "Simbol dan tipografi menambah karakter tanpa menyembunyikan kata-katanya."
suggest.why.sentence_structure: "Kalimat tunggal dan majemuk menyampaikan gagasan dengan jelas; yang kumulatif menambah tekstur."
suggest.why.post_format: "Format yang cocok dengan mode retorika pilihan Anda."
