arena.preset.marys_room.title: "Kamar Mary"
arena.preset.marys_room.premise: "Mary adalah ilmuwan yang memahami fisika dan biologi penglihatan warna, tetapi seumur hidupnya tinggal di kamar hitam-putih. Suatu hari ia keluar dan melihat warna merah untuk pertama kalinya."
