arena.preset.experience_machine.v2_values: "tidak ada | sebuah keluarga"
arena.preset.veil_of_ignorance.title: "Selubung ketidaktahuan"
arena.preset.veil_of_ignorance.premise: "Kamu memilih aturan pembagian kekayaan dalam suatu masyarakat tanpa tahu akan menjadi siapa di dalamnya: bakatmu, kesehatanmu, atau keluargamu."
arena.preset.veil_of_ignorance.question: "Apakah kamu akan memilih aturan yang menjamin batas minimum yang layak bagi yang paling tidak beruntung, walau itu menurunkan rata-rata?"
