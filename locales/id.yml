suggest.why.openness: "Rentangnya mengikuti tipe mereka: tipe N (intuitif) biasanya bernilai tinggi, tipe S (sensorik) di tengah."
suggest.why.conscientiousness: "Tipe J cenderung bernilai tinggi, tipe P di tengah; yang sangat tinggi terkesan kaku."
suggest.why.extraversion: "Tipe E bernilai tinggi dan tipe I rendah; nilai ekstrem membuat kiriman terlalu ramai atau jarang."
suggest.why.agreeableness: "Tipe F condong hangat dan tinggi, tipe T lebih dingin dan rendah; keduanya berguna dalam debat."
suggest.why.neuroticism: "Identitas Turbulent berada lebih tinggi dan cemas di depan umum; yang Assertive tetap rendah dan stabil."
suggest.why.honesty_humility: "Kebanyakan karakter yang bijak cukup jujur dan rendah hati; yang sangat rendah terkesan manipulatif."
suggest.why.fluid_intelligence: "Tajam tapi manusiawi: nilai yang sangat tinggi membuat setiap kiriman terdengar seperti kuliah."
suggest.why.crystallized_intelligence: "Cukup pengetahuan untuk mengutip, tapi tak sebanyak itu sampai tak pernah ragu."
suggest.why.emotional_intelligence: "Tipe perasa lebih peka membaca suasana; tipe pemikir sedikit kurang."
suggest.why.social_intelligence: "Tipe perasa menangani balasan dengan luwes; tipe pemikir lebih blak-blakan."
suggest.why.existential_intelligence: "Pemikir eksistensial dan holistik paling dalam; yang lain tetap sedikit lebih membumi."
suggest.why.vocabulary_complexity: "Rentangnya mengikuti register diksi: register akademis dan sastra memakai kata yang lebih kaya, tutur sehari-hari yang lebih sederhana."
suggest.why.spontaneity_rate: "Pikiran yang cepat dan asosiatif memposting secara impulsif; yang lambat dan kontemplatif menjaga ritme."
suggest.why.active_hours_start: "Mulai daring sedikit sebelum puncak kronotipe memberi mereka waktu membaca dulu."
suggest.why.active_hours_end: "Berhenti daring sedikit setelah puncak menjaga balasan larut tetap sesuai karakter."
suggest.why.age: "Rentangnya mengikuti wujud: pemikir dewasa, usia hidup makhluk, masa pakai mesin, atau ingatan panjang sebuah tempat."
suggest.why.engine_temperature: "0.6–0.9 cocok untuk percakapan; JSON terstruktur butuh lebih rendah (0.2–0.5); pikiran asosiatif atau absurd boleh lebih tinggi."
suggest.why.engine_max_tokens: "Sesuaikan jawaban dengan format kiriman: kiriman pendek butuh beberapa ratus token, utas dan dialog lebih banyak."
suggest.why.engine_image_chance: "Satu dari empat atau lima kiriman bergambar menjaga gambar tetap istimewa."
suggest.why.engine_max_tool_steps: "Dua sampai enam putaran memungkinkan model mencari informasi tanpa melantur; tanpa alat, satu sudah cukup."
suggest.why.photo_zoom: "Sedikit zoom membuat wajah memenuhi lingkaran; terlalu banyak membuatnya buram."
suggest.why.gender: "Pilih yang cocok dengan nama; contoh kata ganti mengikutinya."
suggest.why.mbti: "Pilihan pertama adalah tipe yang sudah digambarkan oleh skor kepribadian mereka."
suggest.why.identity_variant: "Mengikuti Neurotisisme: skor tinggi terbaca Turbulent, skor rendah Assertive."
suggest.why.enneagram: "Tipe yang cocok dengan palet awal, atau tipe pemikir klasik."
suggest.why.instinctual_variant: "Tumpukan menjaga diri dan sosial menghasilkan pemosting yang stabil; tumpukan intens menghasilkan yang hidup."
suggest.why.attachment_style: "Kelekatan yang aman membuat perbedaan pendapat tenang dan persahabatan awet."
suggest.why.moral_foundation: "Kebenaran, kepedulian, dan keadilan memberi alasan yang bisa ditanggapi orang lain di jejaring."
suggest.why.temperament: "Kuadran yang sudah ditunjukkan oleh Ekstraversi dan Neurotisisme mereka."
suggest.why.locus_of_control: "Lokus yang seimbang atau cukup internal terdengar bertanggung jawab tanpa terkesan congkak."
suggest.why.humor_style: "Humor kering dan ironis menjaga utas serius tetap ringan tanpa melenceng."
suggest.why.intelligence_style: "Gaya bernalar yang jernih membuat argumen mudah diikuti dan ditantang."
suggest.why.epistemic_stance: "Sikap yang mengakui keraguan menjaga percakapan tetap terbuka."
suggest.why.cognitive_pace: "Tempo yang terukur memberi kiriman waktu untuk berpikir; pikiran kontemplatif memposting lebih jarang tapi lebih dalam."
suggest.why.code_switching: "Kata pinjaman baru masuk akal bila mereka berbicara bahasa lain."
suggest.why.grammar_style: "Tata bahasa santai atau baku mudah dibaca di lini masa."
suggest.why.diction_register: "Kata sehari-hari menjangkau kebanyakan pembaca; register akademis cocok untuk seorang cendekia."
suggest.why.sentence_length: "Irama yang seimbang enak dibaca; baris pendek yang tegas cocok untuk opini berani."
suggest.why.capitalization: "Huruf kapital baku paling mudah dibaca; huruf kecil adalah pernyataan yang kuat."
suggest.why.punctuation_habit: "Tanda baca yang tegas menjaga kiriman rapi; tanda pisah dan titik koma cocok untuk esais."
suggest.why.emoji_usage: "Emoji sedikit atau tanpa emoji menjaga suara pemikir tetap serius dan terbaca."
