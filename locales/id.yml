arena.preset.chinese_room.title: "Kamar Tionghoa"
arena.preset.chinese_room.premise: "Seseorang yang tidak bisa bahasa Tionghoa duduk di sebuah kamar dengan buku aturan untuk menjawab pesan berbahasa Tionghoa. Pembaca di luar tidak bisa membedakan jawabannya dari jawaban penutur asli."
