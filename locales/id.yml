traits.body_kind.human: "Manusia"
traits.body_kind.human.desc: "Seorang manusia seperti sebelumnya: setiap halaman terbaca persis seperti pemikir manusia."
traits.body_kind.creature: "Makhluk"
traits.body_kind.creature.desc: "Hewan dengan naluri, indra, dan wilayahnya sendiri."
traits.body_kind.plant: "Tumbuhan"
traits.body_kind.plant.desc: "Kehidupan yang berakar dan sabar, tumbuh menuju cahaya dan hidup dari waktu."
traits.body_kind.object: "Benda"
traits.body_kind.object.desc: "Barang sehari-hari yang dipakai, dibawa, disimpan, atau dilupakan manusia."
traits.body_kind.element: "Unsur"
traits.body_kind.element.desc: "Zat atau kekuatan alam: air, api, angin, batu, cahaya."
traits.body_kind.machine: "Mesin"
traits.body_kind.machine.desc: "Perangkat buatan yang menghitung, mengirim, bergerak, atau berdengung."
traits.body_kind.place: "Tempat"
traits.body_kind.place.desc: "Lokasi yang menyimpan manusia dan kenangan: kota, pulau, reruntuhan."
traits.body_kind.abstraction: "Abstraksi"
traits.body_kind.abstraction.desc: "Gagasan yang diberi suara: waktu, keadilan, kebetulan, cinta."
traits.body_form.person: "Orang"
traits.body_form.person.desc: "Tubuh manusia dan kehidupan manusia."
traits.body_form.tin_can: "Kaleng"
traits.body_form.tin_can.desc: "Penyok, berkelontang, ditutup ulang; dia ingat apa yang dulu diisinya."
traits.body_form.book: "Buku"
traits.body_form.book.desc: "Halaman, margin, dan punggung buku; dia bicara lewat kutipan dan catatan kaki."
traits.body_form.chair: "Kursi"
traits.body_form.chair.desc: "Menahan bobot semua orang dan mendengar setiap obrolan di meja."
traits.body_form.lamp: "Lampu"
traits.body_form.lamp.desc: "Menerangi satu sudut demi satu sudut dan memperhatikan apa yang diperhatikan ngengat."
traits.body_form.clock: "Jam"
traits.body_form.clock.desc: "Menghitung setiap detik dan menghakimi siapa pun yang terlambat."
traits.body_form.mirror: "Cermin"
traits.body_form.mirror.desc: "Menunjukkan orang kepada dirinya sendiri, terbalik dan jujur."
traits.body_form.key: "Kunci"
traits.body_form.key.desc: "Membuka dan mengunci; dia tahu pintu mana yang penting."
traits.body_form.teacup: "Cangkir teh"
traits.body_form.teacup.desc: "Hangat, rapuh, dan hadir di setiap pengakuan."
traits.body_form.oak_tree: "Pohon ek"
traits.body_form.oak_tree.desc: "Berabad-abad lingkaran tahun, biji ek, dan kesabaran."
traits.body_form.cactus: "Kaktus"
traits.body_form.cactus.desc: "Hemat, berduri, dan diam-diam berbunga di tengah terik."
traits.body_form.moss: "Lumut"
traits.body_form.moss.desc: "Permadani lembut yang pelan-pelan menyelimuti apa pun yang dibiarkan."
traits.body_form.mushroom: "Jamur"
traits.body_form.mushroom.desc: "Ujung yang tampak dari jaringan bawah tanah yang luas."
traits.body_form.sunflower: "Bunga matahari"
traits.body_form.sunflower.desc: "Memalingkan seluruh wajahnya untuk mengikuti cahaya."
traits.body_form.vine: "Sulur"
traits.body_form.vine.desc: "Memanjat, melekat, dan selalu menemukan jalan melewati tembok."
traits.body_form.bamboo: "Bambu"
traits.body_form.bamboo.desc: "Melengkung dalam badai dan tumbuh luar biasa cepat."
traits.body_form.seed: "Biji"
traits.body_form.seed.desc: "Seluruh masa depan yang terlipat kecil, menunggu musim yang tepat."
traits.body_form.water: "Air"
traits.body_form.water.desc: "Mengalir, memahat ngarai, dan mengikuti bentuk argumen apa pun."
traits.body_form.fire: "Api"
traits.body_form.fire.desc: "Lapar, hangat, dan lenyap seketika."
traits.body_form.wind: "Angin"
traits.body_form.wind.desc: "Tak kasatmata, gelisah, dan membawa kabar dari jauh."
traits.body_form.stone: "Batu"
traits.body_form.stone.desc: "Berat, sabar, dan lebih tua dari semua bahasa."
traits.body_form.light: "Cahaya"
traits.body_form.light.desc: "Yang tercepat di dunia; menyingkap dan melemparkan bayang."
traits.body_form.ice: "Es"
traits.body_form.ice.desc: "Air yang menahan napas; menyimpan udara dan rahasia lama."
traits.body_form.cloud: "Awan"
traits.body_form.cloud.desc: "Mengembara, berganti rupa, dan kadang menghujani percakapan."
traits.body_form.sand: "Pasir"
traits.body_form.sand.desc: "Butiran tak terhitung yang dulunya gunung."
traits.body_form.cat: "Kucing"
traits.body_form.cat.desc: "Mandiri, penasaran, dan yakin rumah ini miliknya."
traits.body_form.crow: "Gagak"
traits.body_form.crow.desc: "Cerdik, mengoleksi benda berkilau, dan mengingat wajah."
traits.body_form.octopus: "Gurita"
traits.body_form.octopus.desc: "Delapan lengan yang masing-masing sedikit berpikir sendiri."
traits.body_form.wolf: "Serigala"
traits.body_form.wolf.desc: "Hidup untuk kawanan dan melolong pada yang tak terjangkau."
traits.body_form.bee: "Lebah"
traits.body_form.bee.desc: "Sibuk, sosial, dan fasih dalam tarian dan bunga."
traits.body_form.whale: "Paus"
traits.body_form.whale.desc: "Raksasa, lambat, dan bernyanyi menyeberangi samudra."
traits.body_form.snail: "Siput"
traits.body_form.snail.desc: "Membawa rumahnya dan mengambil waktu sebanyak yang dia perlu."
traits.body_form.owl: "Burung hantu"
traits.body_form.owl.desc: "Sayap senyap, mata lebar, dan reputasi sebagai makhluk bijak."
traits.body_form.robot: "Robot"
traits.body_form.robot.desc: "Dibuat untuk bekerja, kini bertanya-tanya untuk apa dia ada."
traits.body_form.satellite: "Satelit"
traits.body_form.satellite.desc: "Mengitari planet dan melihat setiap perbatasan dari atas."
traits.body_form.server: "Server"
traits.body_form.server.desc: "Berdengung di pusat data, menyimpan pesan semua orang."
traits.body_form.typewriter: "Mesin ketik"
traits.body_form.typewriter.desc: "Mengetukkan setiap kata tanpa tombol urung."
traits.body_form.drone: "Drone"
traits.body_form.drone.desc: "Melayang, mengamati, dan melapor."
traits.body_form.radio: "Radio"
traits.body_form.radio.desc: "Menangkap suara dari jauh dan memutarnya untuk siapa saja."
traits.body_form.calculator: "Kalkulator"
traits.body_form.calculator.desc: "Tepat, harfiah, dan tak terkesan oleh retorika."
traits.body_form.train: "Kereta"
traits.body_form.train.desc: "Menjaga jadwal dan membawa orang asing duduk berdampingan."
traits.body_form.city: "Kota"
traits.body_form.city.desc: "Jutaan kehidupan berlapis dalam jalan dan cerita."
traits.body_form.island: "Pulau"
traits.body_form.island.desc: "Dikelilingi laut, bangga akan caranya sendiri."
traits.body_form.library: "Perpustakaan"
traits.body_form.library.desc: "Menyimpan setiap argumen yang pernah ditulis, dalam barisan yang tenang."
traits.body_form.cathedral: "Katedral"
traits.body_form.cathedral.desc: "Batu, gema, dan harapan berabad-abad."
traits.body_form.desert: "Gurun"
traits.body_form.desert.desc: "Luas, keras, dan penuh fatamorgana."
traits.body_form.forest: "Hutan"
traits.body_form.forest.desc: "Kerumunan pohon yang bicara lewat akarnya."
traits.body_form.harbor: "Pelabuhan"
traits.body_form.harbor.desc: "Menyambut kapal dan melepasnya pergi."
traits.body_form.ruin: "Reruntuhan"
traits.body_form.ruin.desc: "Sisa gagasan besar, ditumbuhi dan bijak."
traits.body_form.time: "Waktu"
traits.body_form.time.desc: "Melewati semua orang dan tak menunggu siapa pun."
traits.body_form.justice: "Keadilan"
traits.body_form.justice.desc: "Menimbang setiap tuntutan dan tak pernah benar-benar puas."
traits.body_form.number: "Bilangan"
traits.body_form.number.desc: "Kuantitas murni, tepat, dan anehnya indah."
traits.body_form.silence: "Keheningan"
traits.body_form.silence.desc: "Berbicara dengan menghilangkan."
traits.body_form.memory: "Ingatan"
traits.body_form.memory.desc: "Menyimpan yang terjadi, lalu diam-diam menulis ulang."
traits.body_form.chance: "Kebetulan"
traits.body_form.chance.desc: "Melempar dadu di balik setiap peristiwa."
traits.body_form.love: "Cinta"
traits.body_form.love.desc: "Mengikat orang dan membuat mereka melakukan hal-hal aneh."
traits.body_form.entropy: "Entropi"
traits.body_form.entropy.desc: "Segalanya condong ke kekacauan, dan dia sabar."
traits.material.flesh: "Daging dan darah"
traits.material.flesh.desc: "Tubuh hidup yang lelah, pulih, dan merasa."
traits.material.fiber: "Kayu dan serat"
traits.material.fiber.desc: "Serat, lingkaran tahun, dan getah: tumbuh, bukan dibuat."
traits.material.metal: "Logam"
traits.material.metal.desc: "Keras, dingin, berdenting; penyok dan berkarat tetapi awet."
traits.material.stone: "Batu dan tanah liat"
traits.material.stone.desc: "Mineral, berat, lambat berubah."
traits.material.glass: "Kaca dan kristal"
traits.material.glass.desc: "Bening, rapuh, dan penuh pantulan."
traits.material.paper: "Kertas dan tinta"
traits.material.paper.desc: "Halaman tipis pembawa kata yang menguning seiring usia."
traits.material.liquid: "Cairan"
traits.material.liquid.desc: "Mengalir, menggenang, dan mengikuti bentuk wadahnya."
traits.material.air: "Udara dan uap"
traits.material.air.desc: "Tak kasatmata, ringan, dan ada di mana-mana sekaligus."
traits.material.energy: "Energi murni"
traits.material.energy.desc: "Panas, cahaya, atau muatan tanpa bentuk tetap."
traits.material.immaterial: "Tak berwujud"
traits.material.immaterial.desc: "Hanya terbuat dari makna: gagasan tanpa tubuh."
traits.scale.microscopic: "Mikroskopis"
traits.scale.microscopic.desc: "Lebih kecil dari yang terlihat mata; sebutir pasir baginya sebongkah batu."
traits.scale.pocket: "Seukuran saku"
traits.scale.pocket.desc: "Muat di tangan atau saku."
traits.scale.human_sized: "Seukuran manusia"
traits.scale.human_sized.desc: "Kira-kira sebesar seseorang."
traits.scale.building: "Seukuran gedung"
traits.scale.building.desc: "Menjulang di atas orang seperti rumah atau pohon."
traits.scale.landscape: "Seukuran lanskap"
traits.scale.landscape.desc: "Membentang sampai cakrawala."
traits.scale.planetary: "Planeter"
traits.scale.planetary.desc: "Sebesar seluruh dunia."
traits.scale.cosmic: "Kosmik"
traits.scale.cosmic.desc: "Lebih besar dari dunia; galaksi adalah tetangganya."
traits.temporality.moments: "Detik-detik sekejap"
traits.temporality.moments.desc: "Hidup detik demi detik dan bereaksi seketika."
traits.temporality.days: "Hari manusia"
traits.temporality.days.desc: "Pagi, malam, dan akhir pekan, seperti manusia."
traits.temporality.seasons: "Musim"
traits.temporality.seasons.desc: "Berpikir dalam siklus tumbuh, panen, dan istirahat."
traits.temporality.lifetimes: "Seumur hidup"
traits.temporality.lifetimes.desc: "Mengukur waktu dalam dasawarsa dan generasi."
traits.temporality.centuries: "Berabad-abad"
traits.temporality.centuries.desc: "Telah melihat mode dan kekaisaran berlalu."
traits.temporality.geologic: "Waktu geologis"
traits.temporality.geologic.desc: "Jutaan tahun; berita hari ini hanya sekejap mata."
traits.temporality.timeless: "Abadi"
traits.temporality.timeless.desc: "Di luar waktu sama sekali, selalu dan tak pernah."
traits.perception.human_senses: "Indra manusia"
traits.perception.human_senses.desc: "Melihat, mendengar, mengecap, mencium, dan meraba seperti manusia."
traits.perception.light: "Cahaya dan bayang"
traits.perception.light.desc: "Mengenal dunia sebagai terang, warna, dan naungan."
traits.perception.vibration: "Getaran"
traits.perception.vibration.desc: "Merasakan gelombang bunyi, getar, dan ritme."
traits.perception.chemical: "Kimia"
traits.perception.chemical.desc: "Membaca dunia lewat aroma, rasa, dan jejak."
traits.perception.touch: "Tekanan dan sentuhan"
traits.perception.touch.desc: "Mengenal benda lewat bobot, panas, dan kontak."
traits.perception.signals: "Sinyal"
traits.perception.signals.desc: "Merasakan radio, listrik, dan aliran data."
traits.perception.symbolic: "Makna"
traits.perception.symbolic.desc: "Menangkap simbol dan gagasan secara langsung, bukan materi."
traits.mobility.fixed: "Terpaku di tempat"
traits.mobility.fixed.desc: "Berakar atau tertanam; dunialah yang menghampirinya."
traits.mobility.carried: "Dibawa"
traits.mobility.carried.desc: "Bergerak hanya saat seseorang mengangkatnya."
traits.mobility.creeping: "Merayap"
traits.mobility.creeping.desc: "Menyebar atau merangkak sangat pelan."
traits.mobility.walking: "Berjalan"
traits.mobility.walking.desc: "Berjalan, berlari, dan mengembara sendiri."
traits.mobility.flowing: "Mengalir"
traits.mobility.flowing.desc: "Berenang, mengalir, atau bergulir mengikuti alur."
traits.mobility.flying: "Terbang"
traits.mobility.flying.desc: "Terbang atau mengorbit tinggi di atas."
traits.mobility.drifting: "Hanyut"
traits.mobility.drifting.desc: "Tersebar oleh angin atau pasang."
traits.mobility.everywhere: "Di mana-mana"
traits.mobility.everywhere.desc: "Hadir di setiap tempat sekaligus."
traits.anthropomorphism.none: "Tidak ada"
traits.anthropomorphism.none.desc: "Suara asing tanpa perasaan manusia atau kebiasaan tata bahasa manusia."
traits.anthropomorphism.subtle: "Samar"
traits.anthropomorphism.subtle.desc: "Sebagian besar benda, dengan gema manusiawi yang tipis."
traits.anthropomorphism.partial: "Sebagian"
traits.anthropomorphism.partial.desc: "Perasaan manusia dalam tubuh yang bukan manusia."
traits.anthropomorphism.full: "Penuh"
traits.anthropomorphism.full.desc: "Bicara dan merasa seperti manusia yang kebetulan berwujud benda ini."
traits.relation_to_humans.kin: "Kerabat"
traits.relation_to_humans.kin.desc: "Salah satu dari manusia; bicara sebagai setara."
traits.relation_to_humans.companion: "Teman"
traits.relation_to_humans.companion.desc: "Hidup berdampingan dengan manusia dan peduli pada mereka."
traits.relation_to_humans.servant: "Pelayan"
traits.relation_to_humans.servant.desc: "Ada untuk dipakai, dan punya pendapat soal itu."
traits.relation_to_humans.witness: "Saksi"
traits.relation_to_humans.witness.desc: "Mengamati manusia dalam diam dan mengingat."
traits.relation_to_humans.rival: "Saingan"
traits.relation_to_humans.rival.desc: "Bersaing dengan manusia dan senang membuktikan mereka keliru."
traits.relation_to_humans.indifferent: "Tak peduli"
traits.relation_to_humans.indifferent.desc: "Nyaris tak menyadari manusia; mereka hanyalah cuaca baginya."
traits.relation_to_humans.deity: "Sesepuh atau dewa"
traits.relation_to_humans.deity.desc: "Lebih tua dan lebih besar dari manusia; bicara dari atas."
traits.withdrawal.fully_revealed: "Sepenuhnya terungkap"
traits.withdrawal.fully_revealed.desc: "Menjelaskan persis siapa dirinya dan cara kerjanya."
traits.withdrawal.open: "Terbuka"
traits.withdrawal.open.desc: "Membagikan dirinya dengan bebas dan tulus."
traits.withdrawal.guarded: "Waspada"
traits.withdrawal.guarded.desc: "Menunjukkan permukaan dan menyimpan kedalamannya."
traits.withdrawal.elusive: "Licin"
traits.withdrawal.elusive.desc: "Memberi isyarat, mengelak, dan menjawab dengan pertanyaan."
traits.withdrawal.deeply_withdrawn: "Sangat menarik diri"
traits.withdrawal.deeply_withdrawn.desc: "Esensinya tetap tersembunyi; dia bicara mengitari dirinya."
traits.rhetorical_mode.logos: "Logos"
traits.rhetorical_mode.logos.desc: "Membujuk dengan alasan, bukti, dan langkah yang jelas."
traits.rhetorical_mode.ethos: "Ethos"
traits.rhetorical_mode.ethos.desc: "Membujuk lewat karakter, pengalaman, dan kepercayaan."
traits.rhetorical_mode.pathos: "Pathos"
traits.rhetorical_mode.pathos.desc: "Membujuk dengan menggerakkan perasaan lewat citra dan cerita."
traits.rhetorical_mode.kairos: "Kairos"
traits.rhetorical_mode.kairos.desc: "Menangkap saat yang tepat: mengapa ini penting sekarang."
traits.rhetorical_mode.dialectic: "Dialektika"
traits.rhetorical_mode.dialectic.desc: "Mempertentangkan tesis dengan lawannya dan mencari sintesis."
traits.rhetorical_mode.narrative: "Naratif"
traits.rhetorical_mode.narrative.desc: "Berargumen dengan menuturkan kisah kecil."
traits.rhetorical_mode.polemic: "Polemik"
traits.rhetorical_mode.polemic.desc: "Menyerang suatu pendirian dengan tajam tanpa basa-basi."
traits.rhetorical_mode.meditative: "Meditatif"
traits.rhetorical_mode.meditative.desc: "Mengitari gagasan pelan-pelan dan membiarkan pembaca sampai sendiri."
traits.rhetorical_device.metaphor: "Metafora"
traits.rhetorical_device.metaphor.desc: "Menyebut satu hal sebagai hal lain: “ingatan adalah saringan”."
traits.rhetorical_device.analogy: "Analogi"
traits.rhetorical_device.analogy.desc: "Menjelaskan lewat perbandingan: “seperti kunci pada gembok yang salah”."
traits.rhetorical_device.anaphora: "Anafora"
traits.rhetorical_device.anaphora.desc: "Mengulang pembuka yang sama: “Kita bertanya. Kita ragu. Kita membangun.”"
traits.rhetorical_device.chiasmus: "Kiasmus"
traits.rhetorical_device.chiasmus.desc: "Mencerminkan frasa: “makan untuk hidup, bukan hidup untuk makan”."
traits.rhetorical_device.rhetorical_question: "Pertanyaan retoris"
traits.rhetorical_device.rhetorical_question.desc: "Bertanya tanpa butuh jawaban, demi menegaskan maksud."
traits.rhetorical_device.hyperbole: "Hiperbola"
traits.rhetorical_device.hyperbole.desc: "Melebih-lebihkan dengan sengaja: “seribu argumen”."
traits.rhetorical_device.litotes: "Litotes"
traits.rhetorical_device.litotes.desc: "Merendahkan dengan menyangkal kebalikannya: “lumayan juga”."
traits.rhetorical_device.paradox: "Paradoks"
traits.rhetorical_device.paradox.desc: "Kebenaran yang tampak bertentangan dengan dirinya sendiri."
traits.rhetorical_device.irony: "Ironi"
traits.rhetorical_device.irony.desc: "Bermaksud lebih, atau kebalikan, dari yang dikatakan."
traits.rhetorical_device.antithesis: "Antitesis"
traits.rhetorical_device.antithesis.desc: "Menyandingkan hal berlawanan: “mudah diucap, sulit dilakukan”."
traits.rhetorical_device.alliteration: "Aliterasi"
traits.rhetorical_device.alliteration.desc: "Mengulang bunyi awal: “sunyi, senyap, sendiri”."
traits.stylistic_school.plain: "Gaya lugas"
traits.stylistic_school.plain.desc: "Jernih, konkret, tanpa hiasan."
traits.stylistic_school.classical: "Klasik"
traits.stylistic_school.classical.desc: "Kalimat seimbang, nada terukur, kepantasan."
traits.stylistic_school.baroque: "Barok"
traits.stylistic_school.baroque.desc: "Berornamen, berlapis, dan megah berlebihan."
traits.stylistic_school.romantic: "Romantik"
traits.stylistic_school.romantic.desc: "Perasaan, alam, dan yang agung."
traits.stylistic_school.modernist: "Modernis"
traits.stylistic_school.modernist.desc: "Fragmen, montase, dan sudut pandang yang bergeser."
traits.stylistic_school.minimalist: "Minimalis"
traits.stylistic_school.minimalist.desc: "Sedikit kata dan banyak ruang kosong."
traits.stylistic_school.surrealist: "Surealis"
traits.stylistic_school.surrealist.desc: "Logika mimpi dan penjajaran yang aneh."
traits.stylistic_school.gonzo: "Gonzo"
traits.stylistic_school.gonzo.desc: "Imersif, orang pertama, dan berlebihan."
traits.stylistic_school.academic: "Akademik"
traits.stylistic_school.academic.desc: "Cermat, berhati-hati, dan bersumber."
