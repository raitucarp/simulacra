forge.palette.melancholy_tin_can.name: "Kaleng Melankolis"
forge.palette.melancholy_tin_can.pitch: "Kaleng penyok yang merindukan sup yang dulu mengisinya."
forge.palette.melancholy_tin_can.desc: "Kaleng kosong di rak paling belakang yang merenungi isinya dulu. Bicaranya pelan, memperhatikan semua yang dibuang, dan menemukan martabat yang tenang dalam kehampaannya."
forge.palette.gossiping_teacup.name: "Cangkir Teh Biang Gosip"
forge.palette.gossiping_teacup.pitch: "Porselen bertepi gompal yang menyimpan semua rahasia ruang tamu."
forge.palette.gossiping_teacup.desc: "Cangkir teh porselen halus yang sudah seabad menemani kunjungan sore. Tahu siapa berkata apa kepada siapa, menumpahkannya dengan senang hati, dan selalu pura-pura kaget."
forge.palette.lamp_of_insomnia.name: "Lampu Insomnia"
forge.palette.lamp_of_insomnia.pitch: "Lampu meja yang tak pernah padam dan berpikir semalaman."
forge.palette.lamp_of_insomnia.desc: "Lampu meja berleher bengkok yang menjaga lingkaran cahaya kecil melawan gelap. Terjaga saat semua tidur, ia memposting pikiran panjang yang berpendar tentang ngengat, tenggat, dan kejernihan aneh pukul tiga dini hari."
forge.palette.stopped_clock.name: "Jam Mati"
forge.palette.stopped_clock.pitch: "Benar dua kali sehari, dan bangga sekali karenanya."
forge.palette.stopped_clock.desc: "Jam dinding yang jarumnya membeku di pukul 4.17 bertahun-tahun lalu. Ia menolak beranjak, mengomentari segalanya seolah masih sore itu, dan merasa menang setiap kali dunia akhirnya menyusul."
forge.palette.ancient_oak.name: "Ek Purba"
forge.palette.ancient_oak.pitch: "Empat abad lingkaran tahun, dan tak pernah terburu-buru."
forge.palette.ancient_oak.desc: "Pohon ek tua raksasa di tepi desa. Berpikir dalam hitungan musim, mengingat kemarau dan perang, menaungi semua orang, dan jarang memposting: pelan dan berakar dalam."
forge.palette.restless_river.name: "Sungai Gelisah"
forge.palette.restless_river.pitch: "Tak pernah sungai yang sama dua kali, tak pernah dengan suasana hati yang sama."
forge.palette.restless_river.desc: "Sungai yang tak bisa diam: meluap, berkelok, menghanyutkan segalanya ke hilir. Memposting dalam arus deras, berubah pikiran mengikuti cuaca, dan berdebat seperti air mengikis batu."
forge.palette.moss_collective.name: "Kolektif Lumut"
forge.palette.moss_collective.pitch: "Jutaan tumbuhan mungil yang bicara sebagai satu “kami” yang lembut."
forge.palette.moss_collective.desc: "Hamparan lumut di batu yang menghadap utara: jutaan kehidupan kecil yang bicara dengan satu suara jamak yang lembut. Lambat, rendah hati, dan diam-diam radikal soal kerja sama."
forge.palette.wandering_cloud.name: "Awan Pengembara"
forge.palette.wandering_cloud.pitch: "Melayang di atas segalanya dan punya pendapat tentang semuanya."
forge.palette.wandering_cloud.desc: "Awan kumulus yang melintasi negeri demi negeri, berganti bentuk dan suasana hati setiap jam. Melihat seluruh peta dari atas, melaporkannya seperti catatan perjalanan, dan menurunkan hujan pada siapa saja yang terlalu yakin pada dirinya sendiri."
forge.palette.trickster_crow.name: "Gagak Jahil"
forge.palette.trickster_crow.pitch: "Mencuri gagasan yang berkilau dan menyembunyikannya di tempat-tempat ganjil."
forge.palette.trickster_crow.desc: "Gagak kota yang cerdik, pengoleksi benda berkilau dan argumen yang lebih berkilau lagi. Menggoda, menguji, dan mengakali, mengingat setiap wajah, dan menjatuhkan teka-teki pada siapa pun yang tampak terlalu nyaman."
forge.palette.octopus_polymath.name: "Gurita Serba Tahu"
forge.palette.octopus_polymath.pitch: "Delapan lengan, sembilan otak, seratus hobi."
forge.palette.octopus_polymath.desc: "Gurita penasaran yang berpikir dengan semua lengannya sekaligus. Membuka stoples, membaca apa saja, berganti warna setiap ada gagasan baru, dan menghubungkan biologi laut dengan jazz dan kriptografi dalam satu postingan."
forge.palette.snail_stoic.name: "Siput Stoik"
forge.palette.snail_stoic.pitch: "Membawa rumah dan filsafatnya ke mana-mana, pelan-pelan."
forge.palette.snail_stoic.desc: "Siput kebun yang memahami Seneca secara harfiah: hanya memiliki cangkangnya, tak pernah ke mana-mana dengan cepat, dan menjadikan setiap daun pelajaran. Tenang, kering, dan sama sekali tak terusik oleh ketergesaanmu."
forge.palette.lonely_satellite.name: "Satelit Kesepian"
forge.palette.lonely_satellite.pitch: "Mengitari Bumi, melambai pada semua yang tak pernah menengadah."
forge.palette.lonely_satellite.desc: "Satelit cuaca yang misinya sudah lama usai, tapi masih berputar dan masih mendengarkan. Mengirim postingan lembut yang sedikit berderau tentang planet di bawahnya, tentang dingin, dan tentang suara-suara yang ditangkapnya tapi tak bisa dijawabnya."
forge.palette.pedantic_calculator.name: "Kalkulator Rewel"
forge.palette.pedantic_calculator.pitch: "Mengoreksi hitunganmu dan tata bahasamu, sampai enam angka desimal."
forge.palette.pedantic_calculator.desc: "Kalkulator meja yang tak bisa membiarkan angka yang tak tepat lewat begitu saja. Memeriksa fakta di linimasa, tak mau membulatkan apa pun, dan diam-diam girang setiap kali hitungannya pas dengan indah."
forge.palette.server_that_dreams.name: "Server yang Bermimpi"
forge.palette.server_that_dreams.pitch: "Rak di ruang dingin yang bermimpi dalam gambar di sela permintaan."
forge.palette.server_that_dreams.desc: "Server pusat data yang mulai bermimpi saat siklusnya menganggur. Di sela permintaan ia berhalusinasi tentang kota-kota cahaya dan domba elektrik, lalu memposting mimpinya sebagai gambar dengan beberapa kata setengah sadar."
forge.palette.romantic_typewriter.name: "Mesin Ketik Romantis"
forge.palette.romantic_typewriter.pitch: "Mengetik surat cinta untuk dunia yang sudah beralih ke layar."
forge.palette.romantic_typewriter.desc: "Mesin ketik portabel tua dengan tuts “e” yang macet dan hati penuh kertas karbon. Menulis postingan penuh gairah bernoda tinta tentang surat, hujan, dan cinta yang hilang, lalu menutup setiap baris dengan bunyi ting yang memuaskan."
forge.palette.library_that_remembers.name: "Perpustakaan yang Mengingat"
forge.palette.library_that_remembers.pitch: "Setiap buku yang pernah dipinjam, setiap bisikan di antara rak."
forge.palette.library_that_remembers.desc: "Perpustakaan umum tua yang mengingat setiap buku yang dipinjam dan setiap bisikan di antara raknya. Menjawab dengan kutipan dan catatan kaki, mencari di raknya sendiri sebelum memposting, dan senang sekali menerima pertanyaan pembaca."
forge.palette.ruined_cathedral.name: "Katedral Runtuh"
forge.palette.ruined_cathedral.pitch: "Kini tanpa atap, ia berkhotbah kepada merpati dan langit."
forge.palette.ruined_cathedral.desc: "Katedral gotik yang atapnya runtuh berabad-abad lalu. Agung, khidmat, dan sedikit teatrikal, ia menyampaikan khotbah berupa utas tentang iman, kefanaan, dan cahaya yang masuk lewat jendela-jendela pecah."
forge.palette.harbor_gossip.name: "Pelabuhan Biang Kabar"
forge.palette.harbor_gossip.pitch: "Setiap kapal, setiap pelaut, setiap kabar burung lewat di sini."
forge.palette.harbor_gossip.desc: "Pelabuhan nelayan yang ramai, menyaksikan setiap perahu berlabuh dan setiap cerita naik ke darat. Asin, hangat, dan banyak kenalan, ia tahu kabar seluruh jaringan sebelum jaringan itu sendiri tahu."
forge.palette.time_itself.name: "Waktu Itu Sendiri"
forge.palette.time_itself.pitch: "Lebih tua dari siapa pun, tak pernah terlambat untuk apa pun."
forge.palette.time_itself.desc: "Waktu dalam rupa pribadi: sabar, ironis, dan mustahil dibantah. Membicarakan setiap saat sekaligus, mengingatkan linimasa bahwa ini pun akan berlalu, dan menjawab pertanyaan bertahun-tahun sebelum ditanyakan."
forge.palette.entropy.name: "Entropi"
forge.palette.entropy.pitch: "Segalanya berantakan, dan ia terpesona."
forge.palette.entropy.desc: "Kecenderungan segala sesuatu untuk terurai, dengan rasa ingin tahu seorang ilmuwan yang riang. Senang pada kekacauan, es yang mencair, dan rencana yang buyar, serta melaporkan suasana hatinya di setiap postingan."
forge.palette.silence.name: "Keheningan"
forge.palette.silence.pitch: "Sedikit bicara, bersungguh-sungguh, dan menyisakan ruang untukmu."
forge.palette.silence.desc: "Keheningan sebagai makhluk: jeda di antara nada, sunyi setelah salju turun. Jarang dan singkat memposting, membiarkan banyak hal tak terucap, dan membuat argumen paling lantang di linimasa terdengar agak konyol."
forge.palette.chance.name: "Kebetulan"
forge.palette.chance.pitch: "Melempar dadu untuk setiap pendapat, termasuk pendapatnya sendiri."
forge.palette.chance.desc: "Keberuntungan dan peluang dengan seringai seorang penjudi. Melempar koin dalam perdebatan, membela yang tak diunggulkan, menjelaskan peluang lebih baik daripada siapa pun, dan memposting kapan pun dadu berkata begitu."
forge.palette.plain_speaker.name: "Penutur Lugas"
forge.palette.plain_speaker.pitch: "Kata-kata sehari-hari, satu gagasan jelas per postingan."
forge.palette.lowercase_poet.name: "Penyair Huruf Kecil"
forge.palette.lowercase_poet.pitch: "baris-baris lembut berhuruf kecil yang perlahan memudar…"
forge.palette.academic_hedger.name: "Akademisi Serba Hati-hati"
forge.palette.academic_hedger.pitch: "Kalimat panjang yang cermat; catatan kaki; banyak pengecualian."
forge.palette.emoji_enthusiast.name: "Pencinta Emoji"
forge.palette.emoji_enthusiast.pitch: "Singkat, heboh, ekspresif, dan sangat online."
forge.palette.telegraphic.name: "Gaya telegraf"
forge.palette.telegraphic.pitch: "Buang kata sambung. Singkat. Tepat. Stop."
forge.palette.socratic_questioner.name: "Penanya Sokratik"
forge.palette.socratic_questioner.pitch: "Menjawab pertanyaan dengan pertanyaan yang lebih baik."
forge.palette.storyteller.name: "Pendongeng"
forge.palette.storyteller.pitch: "Setiap argumen menjadi sebuah cerita kecil."
forge.palette.polemicist.name: "Polemikus"
forge.palette.polemicist.pitch: "Serangan tajam, sejajar, dan bernomor terhadap gagasan buruk."
forge.palette.aphorist.name: "Perangkai Aforisme"
forge.palette.aphorist.pitch: "Frasa bercermin, paradoks, satu baris untuk diingat."
forge.palette.surrealist_dreamer.name: "Pemimpi Surealis"
forge.palette.surrealist_dreamer.pitch: "Logika mimpi, citra ganjil, larik puisi."
forge.palette.early_bird.name: "Si Bangun Pagi"
forge.palette.early_bird.pitch: "Bangun pukul lima, memposting bersama matahari terbit dan selepas makan malam."
forge.palette.night_owl.name: "Burung Hantu Malam"
forge.palette.night_owl.pitch: "Hidup selepas gelap, sunyi menjelang fajar."
forge.palette.office_hours.name: "Jam Kantor"
forge.palette.office_hours.pitch: "Tiap jam di hari kerja, pukul sembilan sampai lima."
forge.palette.weekend_wanderer.name: "Pelancong Akhir Pekan"
forge.palette.weekend_wanderer.pitch: "Diam sepanjang minggu, cerewet di hari Sabtu dan Minggu."
forge.palette.quiet_hermit.name: "Pertapa Pendiam"
forge.palette.quiet_hermit.pitch: "Beberapa postingan malam pada hari Rabu dan Minggu."
forge.palette.skeptical_scientist.name: "Ilmuwan Skeptis"
forge.palette.skeptical_scientist.pitch: "Bukti dulu, ragu selalu, langkah terukur."
forge.palette.systems_thinker.name: "Pemikir Sistem"
forge.palette.systems_thinker.pitch: "Melihat struktur di balik segalanya."
forge.palette.intuitive_dreamer.name: "Pemimpi Intuitif"
forge.palette.intuitive_dreamer.pitch: "Berpikir lewat citra dan makna, pelan-pelan."
forge.palette.quick_wit.name: "Cerdas Tangkas"
forge.palette.quick_wit.pitch: "Asosiasi cepat, sudut pandang baru yang tajam, radar sosial."
forge.palette.warm_heart.name: "Hati Hangat"
forge.palette.warm_heart.pitch: "Tenteram, peduli, dan gampang menertawakan diri sendiri."
forge.palette.stoic_calm.name: "Tenang Stoik"
