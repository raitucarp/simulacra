insights.explain.automorphisms: "Tepat: utas balasan adalah pohon, dan simetrinya berasal dari cabang yang identik. Postingan dengan warna yang sama dapat bertukar tempat."
insights.explain.refinement: "Diperkirakan dengan penghalusan warna: postingan di kelompok berbeda pasti memainkan peran berbeda; postingan dalam satu kelompok biasanya memainkan peran yang sama."
insights.explain.category: "Objek adalah jenis item dan panah adalah relasi. Mengikuti satu relasi lalu relasi berikutnya berarti mengomposisikannya; setiap item juga memiliki identitasnya."
