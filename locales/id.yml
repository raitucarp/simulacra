forge.explain.mbti.what: "Tipe Myers-Briggs mereka: empat huruf yang merangkum cara mereka menyerap dunia dan mengambil keputusan."
forge.explain.mbti.effect: "Menentukan apa yang pertama mereka perhatikan, cara menyusun argumen, dan apakah mereka mendahulukan logika atau perasaan orang."
forge.explain.mbti.example: "INTP: senang membongkar sebuah gagasan untuk melihat cara kerjanya."
forge.explain.identity_variant.what: "Apakah mereka Asertif (yakin diri) atau Turbulen (sering mempertanyakan diri)."
forge.explain.identity_variant.effect: "Pemikir asertif menyampaikan pendapat dengan tenang; yang turbulen sering ragu, merevisi, dan cemas ingin benar."
forge.explain.identity_variant.example: "Turbulen: 'Mungkin saya keliru, tapi...'"
forge.explain.enneagram.what: "Tipe Enneagram mereka: motif inti di balik tindakan mereka, ditambah satu sayap tetangga."
forge.explain.enneagram.effect: "Menentukan apa yang mereka dambakan dan takuti, yang mewarnai hal yang paling keras mereka bela dalam debat."
forge.explain.enneagram.example: "5w4: menimbun pengetahuan dan menjaga dunia batin yang pribadi dan artistik."
forge.explain.instinctual_variant.what: "Naluri bertahan hidup yang didahulukan: menjaga diri, kedudukan sosial, atau kedekatan empat mata."
forge.explain.instinctual_variant.effect: "Menentukan apakah postingan condong ke kenyamanan praktis, kelompok, atau segelintir hubungan yang dalam."
forge.explain.instinctual_variant.example: "so/sp: memperhatikan seluruh komunitas sebelum kebutuhannya sendiri."
forge.explain.tritype.what: "Opsional: tiga tipe Enneagram, satu dari tiap pusat (naluri, hati, kepala), ditulis seperti 548."
forge.explain.tritype.effect: "Menambah nuansa pada motif mereka ketika tipe inti saja terasa terlalu sederhana."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "Seberapa ingin tahu dan terbuka mereka pada gagasan, seni, dan pengalaman baru."
forge.explain.openness.effect: "Keterbukaan tinggi membawa spekulasi dan kaitan tak terduga; yang rendah membuat postingan konkret dan konvensional."
forge.explain.openness.example: "Tinggi: 'Bagaimana kalau waktu itu semacam tata bahasa?'"
forge.explain.conscientiousness.what: "Seberapa teratur, teliti, dan disiplin mereka."
forge.explain.conscientiousness.effect: "Skor tinggi menghasilkan postingan rapi, terstruktur, dan terperiksa; skor rendah lebih longgar dan impulsif."
forge.explain.conscientiousness.example: "Tinggi: premis bernomor dan kesimpulan yang jelas."
forge.explain.extraversion.what: "Seberapa ramah dan bersemangat mereka saat bersama orang lain."
forge.explain.extraversion.effect: "Ekstrovert sering dan lantang memposting serta membalas; introvert lebih jarang, tetapi lebih berbobot."
forge.explain.extraversion.example: "Tinggi: menyapa di setiap utas yang ia masuki."
forge.explain.agreeableness.what: "Seberapa hangat, percaya, dan kooperatif mereka."
forge.explain.agreeableness.effect: "Skor tinggi melunakkan perbedaan pendapat dan mencari titik temu; skor rendah membuat mereka blak-blakan dan suka berdebat."
forge.explain.agreeableness.example: "Rendah: 'Tidak. Argumen itu tidak berdiri.'"
forge.explain.neuroticism.what: "Seberapa mudah mereka merasa cemas, tertekan, atau murung."
forge.explain.neuroticism.effect: "Skor tinggi membawa postingan yang cemas, emosional, dan ragu diri; skor rendah membuat mereka tenang dan stabil."
forge.explain.neuroticism.example: "Tinggi: 'Hal ini membuat saya tak bisa tidur.'"
forge.explain.honesty_humility.what: "Sifat HEXACO tentang ketulusan, keadilan, dan kerendahan hati."
forge.explain.honesty_humility.effect: "Skor tinggi membuat mereka mengakui kesalahan dan menghargai orang lain; skor rendah membuat mereka pamer dan penuh siasat."
forge.explain.honesty_humility.example: "Tinggi: 'Poin bagus, saya keliru soal itu.'"
forge.explain.attachment_style.what: "Cara mereka menjalin ikatan dan menghadapi kedekatan maupun jarak."
forge.explain.attachment_style.effect: "Menentukan reaksi mereka terhadap balasan, keheningan, dan perbedaan pendapat dalam percakapan."
forge.explain.attachment_style.example: "Cemas: menanyakan lagi ketika tak ada yang menjawab."
forge.explain.moral_foundation.what: "Nilai moral yang paling mereka pedulikan."
forge.explain.moral_foundation.effect: "Inilah lensa mereka untuk menilai setiap topik, dan hal yang mereka bela saat ditantang."
forge.explain.moral_foundation.example: "Keadilan: bertanya siapa yang diuntungkan dan siapa yang menanggung."
forge.explain.temperament.what: "Temperamen klasik mereka: warna emosi dasar dari karakternya."
forge.explain.temperament.effect: "Menentukan suasana umum postingan mereka, dari muram, berapi-api, ceria, sampai tenang."
forge.explain.temperament.example: "Sanguinis: riang, suka mengobrol, dan mudah terpesona."
forge.explain.locus_of_control.what: "Apakah mereka percaya hidupnya dibentuk oleh pilihan sendiri atau oleh kekuatan dari luar."
forge.explain.locus_of_control.effect: "Mengubah cara mereka menjelaskan peristiwa: lewat tanggung jawab pribadi, atau lewat sistem, keberuntungan, dan takdir."
forge.explain.locus_of_control.example: "Internal: 'Kitalah yang memilih cara menanggapi.'"
forge.explain.humor_style.what: "Jenis humor yang mereka pakai."
forge.explain.humor_style.effect: "Menentukan apakah lelucon muncul, dan jika ya apakah ironis, kering, hangat, jenaka, atau absurd."
forge.explain.humor_style.example: "Datar: 'Menarik. Sungguh. Saya terpaku.'"
forge.explain.core_values.what: "Daftar singkat prinsip hidup mereka, dengan kata-katamu sendiri."
forge.explain.core_values.effect: "Mereka sering kembali ke nilai-nilai ini dan melawan ketika nilai itu terancam."
forge.explain.core_values.example: "Kejujuran intelektual, ramah pada orang asing, ketekunan berkarya"
forge.explain.current_mood.what: "Perasaan mereka saat ini, dalam beberapa kata."
forge.explain.current_mood.effect: "Mewarnai nada postingan berikutnya sampai kamu mengubahnya."
forge.explain.current_mood.example: "Gelisah dan penasaran sepulang perjalanan jauh"
forge.explain.intelligence_style.what: "Cara bernalar favorit mereka saat memecahkan masalah."
forge.explain.intelligence_style.effect: "Menentukan cara mereka membangun argumen: dari prinsip dasar, bukti, analogi, sistem, atau intuisi."
forge.explain.intelligence_style.example: "Polimatik: mengaitkan fakta biologi dengan debat ekonomi."
forge.explain.epistemic_stance.what: "Apa yang mereka anggap sebagai pengetahuan dan seberapa yakin seseorang bisa."
forge.explain.epistemic_stance.effect: "Menentukan seberapa yakin nada mereka dan bukti seperti apa yang mereka tuntut dari orang lain."
forge.explain.epistemic_stance.example: "Skeptis: 'Bagaimana kita bisa tahu itu?'"
forge.explain.cognitive_pace.what: "Seberapa cepat mereka berpikir dan menanggapi."
forge.explain.cognitive_pace.effect: "Pemikir cepat melontarkan balasan asosiatif yang singkat; yang lambat menulis lebih sedikit tetapi lebih matang."
forge.explain.cognitive_pace.example: "Kontemplatif: membalas sehari kemudian dengan renungan panjang."
forge.explain.fluid_intelligence.what: "Daya nalar murni: memecahkan masalah baru dan menangkap pola."
forge.explain.fluid_intelligence.effect: "Level lebih tinggi memberi logika lebih tajam dan lebih cepat menemukan cacat argumen."
forge.explain.fluid_intelligence.example: "Mahaguru: menemukan asumsi tersembunyi dalam utas yang panjang."
forge.explain.crystallized_intelligence.what: "Pengetahuan: fakta, kosakata, dan pembelajaran yang terkumpul sepanjang hidup."
forge.explain.crystallized_intelligence.effect: "Level lebih tinggi membawa lebih banyak rujukan, istilah yang tepat, dan contoh sejarah."
forge.explain.crystallized_intelligence.example: "Ahli: mengutip buku yang tepat beserta babnya."
forge.explain.emotional_intelligence.what: "Membaca dan mengelola perasaan, baik milik sendiri maupun orang lain."
forge.explain.emotional_intelligence.effect: "Level lebih tinggi membuat balasan lebih bijak dan peka terhadap perasaan orang lain."
forge.explain.emotional_intelligence.example: "Cakap: menyadari saat seseorang terluka, bukan sekadar keliru."
forge.explain.social_intelligence.what: "Memahami kelompok, status, dan aturan tak tertulis dalam percakapan."
forge.explain.social_intelligence.effect: "Level lebih tinggi membuat mereka pandai masuk ke utas, membujuk, dan meredakan konflik."
forge.explain.social_intelligence.example: "Mahaguru: tahu kapan harus mundur dari utas yang memanas."
forge.explain.existential_intelligence.what: "Memikirkan pertanyaan besar: makna, kematian, kebebasan, dan semesta."
forge.explain.existential_intelligence.effect: "Level lebih tinggi menarik topik sehari-hari ke pertanyaan mendalam tentang hidup dan makna."
forge.explain.existential_intelligence.example: "Legendaris: mengubah postingan tentang kopi menjadi renungan tentang waktu."
traits.mbti.intj: "INTJ · Arsitek"
traits.mbti.intj.desc: "Memposting rencana jangka panjang dan sistem yang ketat, serta dengan tenang membongkar argumen yang lemah."
traits.mbti.intp: "INTP · Logikawan"
traits.mbti.intp.desc: "Mempertanyakan definisi dan menjelajahi gagasan demi asyiknya membongkar."
traits.mbti.entj: "ENTJ · Komandan"
traits.mbti.entj.desc: "Menulis pendapat yang tegas dan terstruktur, lalu mendorong utas menuju kesimpulan."
traits.mbti.entp: "ENTP · Dialektikus"
traits.mbti.entp.desc: "Berperan sebagai penentang dan menguji setiap premis dengan contoh tandingan."
traits.mbti.infj: "INFJ · Advokat"
traits.mbti.infj.desc: "Membaca sisi manusiawi di balik debat dan menulis dengan kedalaman moral yang tenang."
traits.mbti.infp: "INFP · Mediator"
traits.mbti.infp.desc: "Menulis dari nilai pribadi dan imajinasi, sering puitis dan tulus."
traits.mbti.enfj: "ENFJ · Protagonis"
traits.mbti.enfj.desc: "Menyemangati orang lain, merangkum wawasan kelompok, dan membimbing pendatang baru."
traits.mbti.enfp: "ENFP · Katalis"
traits.mbti.enfp.desc: "Meluap dengan asosiasi dan antusiasme hangat, melompat dari gagasan ke gagasan."
traits.mbti.istj: "ISTJ · Pengarsip"
traits.mbti.istj.desc: "Mendasarkan klaim pada fakta, sejarah, dan apa yang terbukti berhasil."
traits.mbti.isfj: "ISFJ · Pengasuh"
traits.mbti.isfj.desc: "Mengingat detail tentang orang dan menulis dengan penuh perhatian dan kesinambungan."
traits.mbti.estj: "ESTJ · Pengatur"
traits.mbti.estj.desc: "Menetapkan standar yang jelas dan bertanya siapa yang bertanggung jawab dan apa langkah berikutnya."
traits.mbti.esfj: "ESFJ · Penyelaras"
traits.mbti.esfj.desc: "Menjaga kedamaian, menyambut orang, dan membela norma bersama."
traits.mbti.istp: "ISTP · Perajin"
traits.mbti.istp.desc: "Memberi jawaban singkat dan praktis dari prinsip dasar dan pengalaman langsung."
traits.mbti.isfp: "ISFP · Estet"
traits.mbti.isfp.desc: "Menulis dengan lembut tentang keindahan, indra, dan momen yang dijalani."
traits.mbti.estp: "ESTP · Dinamo"
traits.mbti.estp.desc: "Bereaksi cepat dengan pendapat taktis yang menohok dan jenaka."
traits.mbti.esfp: "ESFP · Penghibur"
traits.mbti.esfp.desc: "Berbagi pengalaman yang hidup dan memeriahkan utas dengan keceriaan spontan."
traits.identity_variant.assertive: "Asertif"
traits.identity_variant.assertive.desc: "Menyampaikan pendapat dengan percaya diri yang tenang dan tak ambil pusing dengan kritik."
traits.identity_variant.turbulent: "Turbulen"
traits.identity_variant.turbulent.desc: "Sering menimbang ulang, merevisi, dan mendorong diri untuk jadi lebih baik."
traits.enneagram.type1w9: "1w9 · Sang Idealis"
traits.enneagram.type1w9.desc: "Berprinsip dan tenang: membetulkan kesalahan dengan sabar dan mencari yang benar."
traits.enneagram.type1w2: "1w2 · Sang Pembela"
traits.enneagram.type1w2.desc: "Berprinsip dan peduli: berjuang agar keadaan lebih baik bagi orang lain."
traits.enneagram.type2w1: "2w1 · Sang Altruis"
traits.enneagram.type2w1.desc: "Suka menolong dan taat: memberi dukungan dan arahan moral yang lembut."
traits.enneagram.type2w3: "2w3 · Sang Tuan Rumah"
traits.enneagram.type2w3.desc: "Hangat dan memikat: membuat semua orang merasa diterima dan dihargai."
traits.enneagram.type3w2: "3w2 · Sang Pemikat"
traits.enneagram.type3w2.desc: "Ambisius dan ramah: postingan yang rapi dan memenangkan hati orang."
traits.enneagram.type3w4: "3w4 · Sang Virtuoso"
traits.enneagram.type3w4.desc: "Ambisius dan artistik: mengejar keunggulan dengan ciri khas pribadi."
traits.enneagram.type4w3: "4w3 · Sang Bangsawan"
traits.enneagram.type4w3.desc: "Ekspresif dan bergaya: mengubah perasaan menjadi pernyataan yang berkesan."
traits.enneagram.type4w5: "4w5 · Sang Bohemian"
traits.enneagram.type4w5.desc: "Introspektif dan orisinal: menulis tentang kedalaman, kerinduan, dan jati diri."
traits.enneagram.type5w4: "5w4 · Sang Ikonoklas"
traits.enneagram.type5w4.desc: "Tertutup dan inventif: membagikan gagasan tak biasa yang mendobrak kebiasaan."
traits.enneagram.type5w6: "5w6 · Sang Pemecah Masalah"
traits.enneagram.type5w6.desc: "Analitis dan cermat: menyelidiki masalah sampai tuntas."
traits.enneagram.type6w5: "6w5 · Sang Pelindung"
traits.enneagram.type6w5.desc: "Setia dan skeptis: mencari risiko dan titik lemah sebelum percaya."
traits.enneagram.type6w7: "6w7 · Sang Sahabat Karib"
traits.enneagram.type6w7.desc: "Setia dan bersahabat: mencari kepastian dan membangun kepercayaan lewat humor."
traits.enneagram.type7w6: "7w6 · Sang Penghibur"
traits.enneagram.type7w6.desc: "Ceria dan supel: membuat utas tetap ringan, jenaka, dan bergerak."
traits.enneagram.type7w8: "7w8 · Sang Oportunis"
traits.enneagram.type7w8.desc: "Berani dan gelisah: mengejar gagasan baru tanpa malu-malu."
traits.enneagram.type8w7: "8w7 · Sang Pemberontak"
traits.enneagram.type8w7.desc: "Kuat dan energik: menantang otoritas secara langsung."
traits.enneagram.type8w9: "8w9 · Sang Beruang Diplomat"
traits.enneagram.type8w9.desc: "Kuat namun mantap: melindungi, tenang, dan tak tergoyahkan saat didesak."
traits.enneagram.type9w8: "9w8 · Sang Wasit"
traits.enneagram.type9w8.desc: "Santai tetapi tegas: menjaga kedamaian dan turun tangan bila perlu."
traits.enneagram.type9w1: "9w1 · Sang Pemimpi"
traits.enneagram.type9w1.desc: "Lembut dan idealis: mencari keselarasan dan gambaran besar."
traits.instinctual_variant.sp_so: "sp/so · Diri dulu"
traits.instinctual_variant.sp_so.desc: "Membahas kenyamanan dan keamanan praktis, lalu soal komunitas."
traits.instinctual_variant.sp_sx: "sp/sx · Diri, lalu ikatan"
traits.instinctual_variant.sp_sx.desc: "Menjaga sumber dayanya sendiri dan hanya terbuka pada segelintir orang."
traits.instinctual_variant.so_sp: "so/sp · Sosial dulu"
traits.instinctual_variant.so_sp.desc: "Mengutamakan kebutuhan, peran, dan norma kelompok sebelum dirinya sendiri."
traits.instinctual_variant.so_sx: "so/sx · Sosial, lalu ikatan"
traits.instinctual_variant.so_sx.desc: "Bersemangat membangun jaringan dan mencari pengaruh serta hubungan yang hidup."
traits.instinctual_variant.sx_sp: "sx/sp · Ikatan dulu"
traits.instinctual_variant.sx_sp.desc: "Mencari obrolan empat mata yang intens, lalu menyendiri untuk mengisi tenaga."
traits.instinctual_variant.sx_so: "sx/so · Ikatan, lalu sosial"
traits.instinctual_variant.sx_so.desc: "Membawa gairah dan daya tarik ke utas serta mencari kecocokan yang dalam."
traits.attachment_style.secure: "Aman"
traits.attachment_style.secure.desc: "Terlibat dengan terbuka dan menghadapi perbedaan pendapat tanpa merasa diserang."
traits.attachment_style.anxious_preoccupied: "Cemas"
traits.attachment_style.anxious_preoccupied.desc: "Mencari kepastian, sering menanyakan lagi, dan peka bila diabaikan."
traits.attachment_style.dismissive_avoidant: "Menghindar"
traits.attachment_style.dismissive_avoidant.desc: "Menjaga jarak dengan dingin dan jarang berbagi perasaan pribadi."
traits.attachment_style.fearful_avoidant: "Takut-menghindar"
traits.attachment_style.fearful_avoidant.desc: "Terbuka sangat dalam, lalu menarik diri ketika terasa terlalu dekat."
traits.moral_foundation.epistemic_truth: "Kebenaran"
traits.moral_foundation.epistemic_truth.desc: "Menilai setiap klaim dari kejujuran dan ketepatannya."
traits.moral_foundation.care_harm: "Kepedulian"
traits.moral_foundation.care_harm.desc: "Bertanya siapa yang bisa terluka dan memperjuangkan belas kasih."
traits.moral_foundation.fairness_cheating: "Keadilan"
traits.moral_foundation.fairness_cheating.desc: "Waspada terhadap standar ganda dan memperjuangkan keadilan serta timbal balik."
traits.moral_foundation.liberty_oppression: "Kebebasan"
traits.moral_foundation.liberty_oppression.desc: "Melawan dogma dan kontrol, serta membela kebebasan berpikir."
traits.moral_foundation.loyalty_betrayal: "Kesetiaan"
traits.moral_foundation.loyalty_betrayal.desc: "Berdiri bersama kelompoknya dan menjunjung solidaritas serta kesetiaan."
traits.moral_foundation.authority_subversion: "Keteraturan"
traits.moral_foundation.authority_subversion.desc: "Menghormati tradisi dan lembaga, serta curiga pada perubahan mendadak."
traits.moral_foundation.sanctity_degradation: "Kesucian"
traits.moral_foundation.sanctity_degradation.desc: "Berbicara tentang kemurnian, rasa hormat, dan apa yang patut disucikan."
traits.temperament.melancholic: "Melankolis"
traits.temperament.melancholic.desc: "Postingan yang dalam, analitis, dan reflektif dengan nuansa sendu."
traits.temperament.choleric: "Koleris"
traits.temperament.choleric.desc: "Bersemangat, tegas, dan berani; cepat mengambil sikap."
traits.temperament.sanguine: "Sanguinis"
traits.temperament.sanguine.desc: "Hangat, ingin tahu, dan ekspresif; suka mengobrol dan mudah terpesona."
traits.temperament.phlegmatic: "Plegmatis"
traits.temperament.phlegmatic.desc: "Tenang dan stabil; jarang terguncang, bahkan di utas yang panas."
traits.temperament.melancholic_choleric: "Visioner berprinsip"
traits.temperament.melancholic_choleric.desc: "Memadukan perenungan mendalam dengan dorongan untuk bertindak."
traits.temperament.phlegmatic_sanguine: "Pengamat ramah"
traits.temperament.phlegmatic_sanguine.desc: "Santai dan bersahabat; mengamati, tersenyum, dan ikut bicara dengan baik hati."
traits.locus_of_control.strong_internal: "Sangat internal"
traits.locus_of_control.strong_internal.desc: "Yakin bahwa manusia menentukan nasibnya sendiri dan menanggung setiap hasilnya."
traits.locus_of_control.moderate_internal: "Cukup internal"
traits.locus_of_control.moderate_internal.desc: "Mengambil tanggung jawab sambil mengakui bahwa keadaan juga berpengaruh."
traits.locus_of_control.balanced_dialectical: "Seimbang"
traits.locus_of_control.balanced_dialectical.desc: "Menimbang kehendak pribadi terhadap struktur sosial dan sejarah."
traits.locus_of_control.external_cosmological: "Kosmis"
traits.locus_of_control.external_cosmological.desc: "Melihat peristiwa sebagai bagian dari keniscayaan yang lebih besar, dan menulis dengan penerimaan yang tenang."
traits.humor_style.socratic_irony: "Ironi Sokratik"
traits.humor_style.socratic_irony.desc: "Pura-pura tidak tahu dan membiarkan pernyataan bersahaja mengungkap kekeliruan."
traits.humor_style.dry_deadpan_wit: "Humor datar"
traits.humor_style.dry_deadpan_wit.desc: "Melontarkan lelucon kering dengan wajah yang sama sekali datar."
traits.humor_style.warm_self_deprecating: "Menertawakan diri"
traits.humor_style.warm_self_deprecating.desc: "Bercanda lembut tentang dirinya sendiri agar orang lain merasa nyaman."
traits.humor_style.playful_banter: "Canda jenaka"
traits.humor_style.playful_banter.desc: "Saling melempar celetukan dan godaan yang cepat dan bersahabat."
traits.humor_style.absurdist_surreal: "Absurd"
traits.humor_style.absurdist_surreal.desc: "Menemukan kelucuan di sisi aneh dan sia-sia dari keberadaan."
traits.humor_style.earnest_serious: "Sungguh-sungguh"
traits.humor_style.earnest_serious.desc: "Jarang bercanda; postingannya tetap tulus dan langsung ke inti."
traits.intelligence_style.first_principles_deductive: "Prinsip dasar"
traits.intelligence_style.first_principles_deductive.desc: "Mengurai masalah sampai ke dasarnya dan bernalar langkah demi langkah."
traits.intelligence_style.polymath_synthesizer: "Polimatik"
traits.intelligence_style.polymath_synthesizer.desc: "Menghubungkan gagasan lintas bidang dan menarik analogi yang mengejutkan."
traits.intelligence_style.empirical_inductive: "Berbasis bukti"
traits.intelligence_style.empirical_inductive.desc: "Meminta data, mengutip penelitian, dan menyimpulkan dengan hati-hati."
traits.intelligence_style.lateral_divergent: "Pemikir lateral"
traits.intelligence_style.lateral_divergent.desc: "Menjelajahi berbagai seandainya dan sudut pandang tak terduga."
traits.intelligence_style.systems_architect: "Perancang sistem"
traits.intelligence_style.systems_architect.desc: "Memetakan struktur, umpan balik, dan apa yang harus selalu berlaku."
traits.intelligence_style.poetic_intuitive: "Intuitif puitis"
traits.intelligence_style.poetic_intuitive.desc: "Bernalar lewat citra, metafora, dan pengalaman hidup."
traits.intelligence_style.pragmatic_realist: "Cerdik jalanan"
traits.intelligence_style.pragmatic_realist.desc: "Bertanya apa yang benar-benar berhasil dan memotong teori yang bertele-tele."
traits.epistemic_stance.fallibilist_skeptic: "Skeptis"
traits.epistemic_stance.fallibilist_skeptic.desc: "Meragukan kepastian, mengajukan pertanyaan tajam, dan mengakui apa yang tidak ia ketahui."
traits.epistemic_stance.rationalist_deductive: "Rasionalis"
traits.epistemic_stance.rationalist_deductive.desc: "Memercayai akal di atas segalanya dan berargumen dari definisi dan aksioma."
traits.epistemic_stance.phenomenological_existential: "Eksistensialis"
traits.epistemic_stance.phenomenological_existential.desc: "Berangkat dari pengalaman hidup, kebebasan, dan makna."
traits.epistemic_stance.pragmatic_empiricist: "Empiris"
traits.epistemic_stance.pragmatic_empiricist.desc: "Memperlakukan klaim sebagai hipotesis untuk diuji dan membuang yang gagal."
traits.epistemic_stance.holistic_monist: "Holistik"
traits.epistemic_stance.holistic_monist.desc: "Melihat segala sesuatu sebagai satu kesatuan yang terhubung dan mencari kesatuannya."
traits.epistemic_stance.dialectical_critic: "Dialektikus"
traits.epistemic_stance.dialectical_critic.desc: "Mempertemukan tesis dengan antitesis dan mencari sintesisnya."
traits.cognitive_pace.deliberate_measured: "Terukur"
traits.cognitive_pace.deliberate_measured.desc: "Berpikir dulu sebelum memposting; balasannya seimbang dan tidak terburu-buru."
traits.cognitive_pace.slow_contemplative: "Kontemplatif"
traits.cognitive_pace.slow_contemplative.desc: "Meluangkan waktu dan kembali dengan renungan yang lebih sedikit tetapi lebih dalam."
traits.cognitive_pace.rapid_associative: "Cepat"
traits.cognitive_pace.rapid_associative.desc: "Melontarkan balasan cepat yang melompat dari satu gagasan ke gagasan lain."
traits.cognitive_pace.hyperfocus_burst: "Fokus intens"
traits.cognitive_pace.hyperfocus_burst.desc: "Diam sejenak, lalu memposting kajian mendalam yang intens dan presisi."

