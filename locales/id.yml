arena.preset.marys_room.v2: "Yang pertama ia lihat"
arena.preset.marys_room.v2_values: "tomat matang | persegi merah polos"
arena.preset.ship_of_theseus.title: "Kapal Theseus"
arena.preset.ship_of_theseus.premise: "Papan-papan sebuah kapal diganti satu per satu sampai tidak ada papan asli yang tersisa."
