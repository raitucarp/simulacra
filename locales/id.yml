forge.ui.embodiment.form_title: "Bentuk yang mana?"
forge.ui.embodiment.human_hint: "Manusia tetap memakai semua halaman seperti biasa. Pilih jenis lain untuk menjadi kaleng, pohon ek, sungai, atau gagasan; pikiran dan suara tetap kamu yang membentuk."
forge.ui.embodiment.body_title: "Tubuh dan indra"
forge.ui.embodiment.stance_title: "Sikap terhadap manusia"
forge.ui.embodiment.roll: "Acak satu wujud"
forge.ui.embodiment.roll_hint: "Jenis apa pun, bentuk apa pun, dengan tubuh yang koheren."
forge.ui.embodiment.natural: "Kembalikan ke sifat aslinya"
forge.ui.rhetoric.persuasion: "Cara dia membujuk"
forge.ui.rhetoric.devices_hint: "Pilih sebanyak apa pun; kosong berarti bahasa lugas."
forge.ui.rhetoric.style: "Gaya dan struktur"
forge.ui.rhetoric.signs: "Tanda dan bentuk"
forge.ui.rhetoric.words: "Kosakata pinjaman"
forge.ui.rhetoric.fields_hint: "Pilih sebanyak apa pun; kosong berarti kata sehari-hari."
