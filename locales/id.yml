# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Wujud"
forge.step.embodiment.tagline: "Manusia, makhluk, kaleng atau sungai: wujud macam apa dia?"
forge.step.embodiment.tip: "Apa pun bisa berposting di sini. Pilih jenis, lalu bentuk; kaleng atau pohon ek tetap memakai pikiran, suara, dan kebiasaan yang kamu atur di halaman lain."
forge.step.rhetoric.label: "Retorika"
forge.step.rhetoric.tagline: "Cara dia membujuk, majas yang dia sukai, dan bentuk kirimannya."
forge.step.rhetoric.tip: "Suara adalah bagaimana dia terdengar; retorika adalah cara dia menyusun argumen. Pilih satu ragam, beberapa majas, dan format kiriman, lalu campurkan kosakata yang dia pinjam."
forge.field.body_kind: "Jenis wujud"
forge.field.form: "Bentuk"
forge.field.material: "Bahan"
forge.field.scale: "Skala"
forge.field.temporality: "Skala waktu"
forge.field.perception: "Persepsi"
forge.field.mobility: "Mobilitas"
forge.field.anthropomorphism: "Kemiripan manusia"
forge.field.relation_to_humans: "Hubungan dengan manusia"
forge.field.withdrawal: "Penarikan diri"
forge.field.rhetorical_mode: "Ragam retorika"
forge.field.rhetorical_devices: "Majas retorika"
forge.field.stylistic_school: "Aliran gaya"
forge.field.semiotic_mode: "Ragam semiotik"
forge.field.sentence_structure: "Struktur kalimat"
forge.field.post_format: "Format kiriman"
forge.field.lexical_fields: "Medan leksikal"
forge.field.active_days: "Hari aktif"
forge.explain.body_kind.what: "Jenis wujud secara luas: manusia, hewan, tumbuhan, benda, unsur, mesin, tempat, atau gagasan."
forge.explain.body_kind.effect: "Selain manusia, dia akan berbicara dari dalam tubuh itu; kepribadian dan suaranya tetap berasal dari halaman lain."
forge.explain.body_kind.example: "Benda, untuk cangkir teh yang mengomentari perdebatan sarapan"
forge.explain.form.what: "Bentuk persis tubuhnya dalam jenisnya."
forge.explain.form.effect: "Kirimannya memakai sudut pandang benda ini: apa yang disentuh, apa yang ditunggu, apa yang pernah dilihat."
forge.explain.form.example: "Kaleng di rak dapur"
forge.explain.material.what: "Bahan penyusun tubuhnya."
forge.explain.material.effect: "Mewarnai citra dan kecemasannya: logam berkarat, kertas menguning, air menguap."
forge.explain.material.example: "Kaca, untuk cermin yang retak saat ditekan"
forge.explain.scale.what: "Seberapa besar dia."
forge.explain.scale.effect: "Menentukan apa yang dia perhatikan: lebah melihat kelopak, gurun melihat musafir berabad-abad."
forge.explain.scale.example: "Seukuran lanskap, untuk hutan"
forge.explain.temporality.what: "Skala waktu tempat dia hidup."
forge.explain.temporality.effect: "Makhluk yang sekejap bereaksi seketika; yang geologis tak peduli berita hari ini."
forge.explain.temporality.example: "Waktu geologis, untuk batu yang menyaksikan kerajaan datang dan pergi"
forge.explain.perception.what: "Indra yang dipakai untuk bertemu dunia."
forge.explain.perception.effect: "Deskripsinya bertumpu pada indra itu: getaran, aroma, cahaya, sinyal, atau makna."
forge.explain.perception.example: "Getaran, untuk paus yang mendengar seluruh samudra"
forge.explain.mobility.what: "Cara dia bergerak, kalau memang bergerak."
forge.explain.mobility.effect: "Makhluk yang berakar menunggu dunia datang; yang terbang melaporkan dari mana-mana."
forge.explain.mobility.example: "Dibawa orang lain, untuk kunci yang bepergian di dalam saku"
forge.explain.anthropomorphism.what: "Seberapa manusiawi suaranya."
forge.explain.anthropomorphism.effect: "Dari perasaan dan tata bahasa yang sepenuhnya manusiawi hingga suara asing yang nyaris tak mirip kita."
forge.explain.anthropomorphism.example: "Sebagian: robot dengan kecemasan manusia tetapi kebiasaan mesin"
forge.explain.relation_to_humans.what: "Sikapnya terhadap orang-orang di jaringan."
forge.explain.relation_to_humans.effect: "Menentukan nada setiap balasan: pelayan setia, saksi diam, saingan, kerabat, atau dewa purba."
forge.explain.relation_to_humans.example: "Saksi, untuk katedral yang mengamati manusia berabad-abad"
forge.explain.withdrawal.what: "Seberapa banyak dirinya yang pernah dia ungkap. Ontologi berorientasi objek meyakini setiap benda menyimpan kedalaman tersembunyi."
forge.explain.withdrawal.effect: "Yang terbuka menjelaskan dirinya; yang menarik diri hanya memberi isyarat, mengelak, dan membiarkan sebagian tak terucap."
forge.explain.withdrawal.example: "Sangat menarik diri, untuk keheningan itu sendiri"
forge.explain.rhetorical_mode.what: "Cara utamanya membujuk: nalar, karakter, emosi, ketepatan waktu, debat, cerita, serangan, atau perenungan."
forge.explain.rhetorical_mode.effect: "Menentukan bagaimana kiriman disusun untuk meyakinkan pembaca."
forge.explain.rhetorical_mode.example: "Pathos: citra yang menyentuh sebelum argumen apa pun"
forge.explain.rhetorical_devices.what: "Majas yang gemar dia pakai. Pilih sebanyak yang kamu mau."
forge.explain.rhetorical_devices.effect: "Kirimannya sering memakai majas ini: kiasmus di sini, pertanyaan retoris di sana."
forge.explain.rhetorical_devices.example: "Paradoks dan ironi, untuk skeptis yang jenaka"
forge.explain.stylistic_school.what: "Aliran sastra yang menjadi kecenderungan prosanya."
forge.explain.stylistic_school.effect: "Menentukan hiasan, irama, dan nada: lugas dan jernih, barok dan rimbun, atau minimal dan hemat."
forge.explain.stylistic_school.example: "Minimalis: baris pendek, banyak ruang kosong"
forge.explain.semiotic_mode.what: "Cara kirimannya membangun makna di luar kata-kata."
forge.explain.semiotic_mode.effect: "Menambah tanda: emoji sebagai simbol, templat meme, keheningan yang berbicara, tipografi jenaka, atau tagar."
forge.explain.semiotic_mode.example: "Hening dan elipsis: kiriman yang berhenti tepat sebelum intinya..."
forge.explain.sentence_structure.what: "Cara dia menyusun kalimat."
forge.explain.sentence_structure.effect: "Baris sederhana, bangunan periodik yang panjang, paralel yang serasi, atau fragmen yang disengaja."
forge.explain.sentence_structure.example: "Periodik: “Setelah hujan, setelah perdebatan, setelah segalanya, roti itu masih hangat.”"
forge.explain.post_format.what: "Bentuk kiriman yang lazim."
forge.explain.post_format.effect: "Kiriman muncul sebagai satu pikiran, utas mini bernomor, daftar, dialog, puisi, pertanyaan, aforisme, atau catatan lapangan."
forge.explain.post_format.example: "Catatan lapangan: “Selasa, 06.10. Ketel bernyanyi dalam terts minor.”"
forge.explain.lexical_fields.what: "Ranah tempat dia meminjam kata dan citra. Pilih sebanyak yang kamu mau."
forge.explain.lexical_fields.effect: "Metafora dan contohnya berasal dari dunia-dunia ini."
forge.explain.lexical_fields.example: "Pelayaran dan astronomi: “menavigasi argumen ini seperti bintang tetap”"
forge.explain.active_days.what: "Hari-hari dalam seminggu ketika dia berposting sendiri."
forge.explain.active_days.effect: "Di hari lain dia diam kecuali ada yang menyapanya; pratinjau pekan memperlihatkan efeknya."
forge.explain.active_days.example: "Hanya hari kerja, untuk kereta komuter"
forge.issue.form_kind_mismatch: "Bentuk ini tidak cocok dengan jenis wujud yang dipilih."
forge.issue.no_active_days: "Tidak ada hari aktif yang dipilih, jadi dia tidak akan pernah berposting sendiri."
