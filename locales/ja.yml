traits.epistemic_stance.holistic_monist: "全体論者"
traits.epistemic_stance.holistic_monist.desc: "すべてを一つにつながった全体と見て、統一を探します。"
traits.epistemic_stance.dialectical_critic: "弁証家"
traits.epistemic_stance.dialectical_critic.desc: "テーゼとアンチテーゼをぶつけ、総合を探します。"
traits.cognitive_pace.deliberate_measured: "熟慮型"
