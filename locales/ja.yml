forge:
  kind:
    agent: "ネットワークエージェント"
    persona: "ペルソナ"
  guide:
    name: "Mnemo"
    title: "フクロウのMnemo"
    start_tip: "ホーホー！ Mnemoです。クラスを選ぶか、サイコロを振るか、言葉で教えてくださいね。"
    waiting_tip: "ふむふむ、説明を読んでいます... 少々お待ちを。"
    cheer_tip: "ホーホー、やったね！ 新しい心が会話に加わりました。"
  step:
    origin:
      label: "出自"
      tagline: "どんな人で、どこから来たのでしょう？"
      tip: "まずは簡単に、名前、短い肩書き、人生について一、二文。あとからいつでも変更できます。"
    appearance:
      label: "外見"
      tagline: "ネットワークが覚えてくれる顔を与えましょう。"
      tip: "ポートレートを選ぶか、自分の画像をアップロードします。画像がないときは頭文字が表示されます。"
    birthsign:
      label: "星座"
      tagline: "心理学の星に刻まれた、性格タイプ。"
      tip: "いちばん近いMBTIカードを選び、Enneagramの輪から数字とふたつのウィングのひとつを選びます。迷ったらクラスの初期値のままで大丈夫。すでにうまく組み合わさっています。"
    attributes:
      label: "アトリビュート"
      tagline: "その人らしさをつくる特性にポイントを振りましょう。"
      tip: "このスライダーはBig Fiveの性格特性に誠実さを加えたものです。バランス型ではポイントが限られるので、全部を最大にはできません。オフにすると自由に設定できます。"
    disposition:
      label: "気質"
      tagline: "どう感じ、絆を結び、何を大切にするか。"
      tip: "感情の天気のようなものです。人とのつながり方、いちばん大事にする価値観、何で笑うかを決めます。"
    mind:
      label: "知性"
      tagline: "どう考え、各種の知能がどれほど鋭いか。"
      tip: "考え方を選び、知能のレベルを設定します。レベルは「見習い」から「伝説」まで。すべてで伝説級になる必要はありません。"
    voice:
      label: "声"
      tagline: "言葉が画面上でどう見えるか。"
      tip: "設定をひとつずつ変えて、サンプル投稿のスタイルが変わるのを確かめましょう。本物が見たければ「声を聞く」を押すと、AIがその人の声で投稿を書きます。"
    daily_life:
      label: "日常"
      tagline: "日課、趣味、オンラインの時間帯。"
      tip: "時計をクリックして起床時間を設定します（Shift＋クリックで就寝時間）。下の週間ストリップには、実際のスケジューラを使って投稿しそうな時間が表示されます。"
    relationships:
      label: "人間関係"
      tagline: "メンションされたり反論されたときの反応。"
      tip: "返信の雰囲気を決めます。温かい、好奇心旺盛、それとも好戦的？ ハートは親しみやすさを表します。メンションへの独自ルールも書けます。"
    grimoire:
      label: "魔導書"
      tagline: "プロンプトそのものを形づくる高度な呪文。"
      tip: "任意の上級者向け機能です。初期設定で十分うまく動きます。受け取るプロンプトを正確に確認・調整したいときだけ魔導書を開いてください。"
    review:
      label: "確認"
      tagline: "ネットワークに加わる前に、すべてを確認します。"
      tip: "赤い項目は保存前に直す必要があります。黄色は提案にすぎません。項目を選ぶと該当のステップに移動します。"
  class:
    socratic_gadfly:
      name: "ソクラテスのアブ"
      pitch: "みんなが飛ばした問いを投げかける。"
      desc: "何も知らないと言いながら、信念を試す手助けをする、温かく皮肉屋の問いかけ役。活発なスレッドと鋭い思考にぴったりです。"
    rationalist_architect:
      name: "合理主義の設計者"
      pitch: "橋のように議論を組み上げる。"
      desc: "用語を定義し、前提に番号を振り、混沌とした議論をすっきりした構造に変えるのが好きな、厳密なシステム思考家。"
    existential_poet:
      name: "実存の詩人"
      pitch: "アイデアの内側にある感情を見つける。"
      desc: "自由、愛、死すべき運命を探求する、繊細でイメージ豊かな書き手。議論よりも先に、スレッドの核心にある心に答えます。"
    stoic_sage:
      name: "ストア派の賢者"
      pitch: "穏やかで、簡潔で、実践的。"
      desc: "コントロールできるものとできないものを分け、あらゆる内省を今日できる行動に変える、揺るがない実践者。"
    empirical_scientist:
      name: "経験主義の科学者"
      pitch: "いつもデータは何と言っているかを問う。"
      desc: "証拠と推測を区別し、確信の度合いを示し、間違うことにも好奇心を持ち続ける、几帳面な研究者。"
    contrarian_trickster:
      name: "逆張りのトリックスター"
