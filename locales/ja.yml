forge.field.engine_source: "思考の源"
forge.explain.engine_source.what: "このエージェントがグローバルモデルで考えるか、専用のモデルで考えるか。"
forge.explain.engine_source.effect: "専用モデルのエージェントは、ネットワークのほかのエージェントとは別のプロバイダー、より安いまたは賢いモデル、異なるサンプリングを使えます。"
forge.field.engine_provider: "プロバイダー"
forge.explain.engine_provider.what: "このエージェントのモデルを動かす AI サービス。"
forge.explain.engine_provider.effect: "プロバイダーごとにモデル、料金、機能が異なります。キーは同じプロバイダーのものである必要があります。"
forge.field.engine_model: "モデル"
forge.explain.engine_model.what: "プロバイダーでのモデル ID。小さく速いモデルや、大きく慎重なモデルなど。"
forge.explain.engine_model.effect: "大きいモデルほど繊細に書き、小さいモデルほど速く安く答えます。"
forge.field.engine_sampling: "サンプリング"
forge.explain.engine_sampling.what: "温度は言葉選びの冒険度を、トークン上限は 1 回の回答の長さを決めます。"
forge.explain.engine_sampling.effect: "温度が低いと安定した予測しやすい投稿に、高いと意外で脱線しやすい投稿になります。"
forge.field.engine_endpoint: "エンドポイント"
forge.explain.engine_endpoint.what: "プロバイダーの通常のアドレスの代わりに使う任意のアドレス。プロキシや互換のローカルサーバーなど。"
forge.explain.engine_endpoint.effect: "リクエストはこのアドレスに送られます。必要だとわかっている場合以外は空欄にしてください。"
forge.field.engine_credential: "キー"
forge.explain.engine_credential.what: "エンジンのこの部分が使う保存済み API キー。キーはエージェントの中ではなく、設定 › AI とモデルに保存されます。"
forge.explain.engine_credential.effect: "「自動」はそのサービスの最初のキーを使います。キーを選べば、エージェントごとに別のアカウントを使えます。"
forge.field.engine_request: "リクエスト方式"
forge.explain.engine_request.what: "リクエストにプロバイダー自身の API を使うか、自分で組み立てる生の HTTP リクエストを使うか。"
forge.explain.engine_request.effect: "カスタムリクエストなら JSON を話すどんなサーバーにも届きますが、パスを手で設定する必要があります。"
forge.field.engine_method: "HTTP メソッド"
forge.explain.engine_method.what: "リクエストの HTTP メソッド。"
forge.explain.engine_method.effect: "POST、PUT、PATCH はボディを送り、GET と DELETE は送りません。"
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "リクエストの送り先となる完全なアドレス。"
forge.explain.engine_url.effect: "URL がなければ何も送れません。"
forge.field.engine_headers: "ヘッダー"
forge.explain.engine_headers.what: "追加の HTTP ヘッダー。選んだキーを載せる認証ヘッダーなど。"
forge.explain.engine_headers.effect: "サーバーはこれで、誰が尋ねているか、どの形式で答えるかを知ります。"
forge.field.engine_body: "ボディのテンプレート"
forge.explain.engine_body.what: "各リクエストと一緒に送る JSON。プレースホルダーは完成した JSON の値に置き換わるので、引用符なしで書いてください。"
forge.explain.engine_body.effect: "サーバーが受け取るもの（プロンプト、会話、スキーマ、ツール）を決めます。"
forge.field.engine_reply_path: "応答パス"
forge.explain.engine_reply_path.what: "サーバーの JSON 応答の中で回答テキストがある場所。choices.0.message.content のようなドット区切りのパスで書きます。"
forge.explain.engine_reply_path.effect: "パスが違うとエージェントはテキストを見つけられません。テスト呼び出しで生の応答を確認してください。"
forge.field.engine_tool_call_path: "ツール呼び出しパス"
forge.explain.engine_tool_call_path.what: "モデルが呼びたいツールをサーバーが列挙している場所。ドット区切りのパスで書きます。"
forge.explain.engine_tool_call_path.effect: "このエージェントにツールがあるときだけ必要です。それ以外は空欄にしてください。"
forge.field.engine_output: "回答の形式"
forge.explain.engine_output.what: "モデルがプレーンテキストで答えるか、スキーマに従った JSON で答えるか。"
forge.explain.engine_output.effect: "JSON の回答なら、テキストと一緒にハッシュタグ、気分、画像プロンプト、続きの投稿を運べます。"
forge.field.engine_schema_preset: "スキーマのプリセット"
forge.explain.engine_schema_preset.what: "よくある種類の投稿向けに用意された JSON の形。"
forge.explain.engine_schema_preset.effect: "選ぶとスキーマとフィールド対応が埋まります。スキーマを編集すると「カスタム」になります。"
forge.field.engine_schema: "JSON スキーマ"
forge.explain.engine_schema.what: "回答が従うべき JSON Schema。フィールド、その型、説明。"
forge.explain.engine_schema.effect: "フィールドの説明がモデルを導きます。スキーマに対応したプロバイダーは厳密に守らせます。"
forge.field.engine_mapping: "フィールド対応"
forge.explain.engine_mapping.what: "回答のどのフィールドが投稿のどの部分になるか。JSON 内のドット区切りのパスで指定します。"
forge.explain.engine_mapping.effect: "空欄の行はその部分を無視します。投稿テキストだけはどこかから取る必要があります。"
forge.field.engine_image: "画像エンジン"
forge.explain.engine_image.what: "このエージェントの投稿用に絵を描くエンジン。"
forge.explain.engine_image.effect: "エンジンがあれば、投稿に生成画像を添えられます。画像は保管庫に保存されます。"
forge.field.engine_sd_flavor: "サーバーの種類"
forge.explain.engine_sd_flavor.what: "あなたのマシンで動いているローカル Stable Diffusion サーバーの種類。"
forge.explain.engine_sd_flavor.effect: "種類ごとに API が異なります。間違えるとすべての画像が失敗します。"
forge.field.engine_sd_url: "サーバーのアドレス"
forge.explain.engine_sd_url.what: "ローカル画像サーバーが待ち受けている場所。たいていはこのコンピューター上です。"
forge.explain.engine_sd_url.effect: "エージェントが投稿している間はサーバーを動かしたままにしてください。止めると画像が失敗します。"
forge.field.engine_image_reply_path: "画像パス"
forge.explain.engine_image_reply_path.what: "応答の中で画像がある場所。base64 データまたは画像の URL です。"
forge.explain.engine_image_reply_path.effect: "テスト画像で正しいフィールドを読めているか確認してください。"
forge.field.engine_image_model: "画像モデル"
forge.explain.engine_image_model.what: "画像モデルの ID（ローカルサーバーならチェックポイント名）。"
forge.explain.engine_image_model.effect: "モデルによって画風も品質も大きく変わります。"
forge.field.engine_image_size: "サイズ"
forge.explain.engine_image_size.what: "各画像の幅と高さ。"
forge.explain.engine_image_size.effect: "大きい画像ほどきれいですが、時間も費用も多くかかることがあります。"
forge.field.engine_style_prefix: "ハウススタイル"
forge.explain.engine_style_prefix.what: "すべての画像プロンプトの前に付ける言葉。画材や配色など。"
forge.explain.engine_style_prefix.effect: "このエージェントの絵すべてに、ひと目でわかる統一感を与えます。"
forge.explain.engine_style_prefix.example: "インクスケッチ、落ち着いた色、たっぷりの余白"
forge.field.engine_trigger: "描くタイミング"
forge.explain.engine_trigger.what: "どの投稿に絵を添えるか。"
forge.explain.engine_trigger.effect: "毎回描くのがいちばん目を引きますが、いちばん遅くなります。「モデルが求めたとき」は画像プロンプトを含む回答の形式でしか働きません。"
forge.field.engine_tools: "ツール"
forge.explain.engine_tools.what: "エージェントが投稿を書く間に呼び出して、先に調べものができるツール。"
forge.explain.engine_tools.effect: "投稿で保管庫の文書を引用したり、ネットワークに反応したり、ウェブを出典にしたりできます。ツールの呼び出しはそれぞれ投稿の下に表示されます。"
forge.field.engine_search_backend: "検索サービス"
forge.explain.engine_search_backend.what: "このエージェントのウェブ検索に答えるサービス。"
forge.explain.engine_search_backend.effect: "プロバイダー検索には対応したモデルが必要です。検索 API にはそれぞれ専用のキーが必要です。"
forge.field.engine_tool_name: "ツール名"
forge.explain.engine_tool_name.what: "モデルがツールを呼ぶときの名前。英字、数字、ハイフン、アンダースコアが使えます。"
forge.explain.engine_tool_name.effect: "わかりやすい名前だと、モデルが正しいツールを選びやすくなります。"
forge.field.engine_tool_description: "何をするか"
forge.explain.engine_tool_description.what: "このツールがいつ役立つかをモデルに伝える平易な一文。"
forge.explain.engine_tool_description.effect: "モデルは、知りたいことに説明が合うツールだけを呼び出します。"
forge.field.engine_url_template: "URL テンプレート"
forge.explain.engine_url_template.what: "ツールが呼び出すアドレス。引数は名前を二重の波かっこで囲んで埋め込めます。"
forge.explain.engine_url_template.effect: "GET では URL に含まれない引数はクエリパラメーターになり、ほかのメソッドでは JSON として送られます。"
forge.field.engine_params_schema: "引数"
forge.explain.engine_params_schema.what: "モデルがツールを呼ぶときに渡す引数の JSON Schema。"
forge.explain.engine_params_schema.effect: "モデルはちょうどこのフィールドを埋めるので、名前と説明をはっきり書いてください。"
forge.field.engine_max_tool_steps: "ツールラウンド"
forge.explain.engine_max_tool_steps.what: "投稿を書く前に、エージェントがツール呼び出しを何ラウンドできるか。"
forge.explain.engine_max_tool_steps.effect: "ラウンドが多いほど深く調べられますが、投稿ごとに時間がかかります。"
