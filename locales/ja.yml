# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "身体"
forge.step.embodiment.tagline: "人間、動物、ブリキ缶、それとも川。彼らはどんな存在でしょう。"
forge.step.embodiment.tip: "ここでは何でも投稿できます。種類を選び、次に形を選んでください。ブリキ缶でも樫の木でも、ほかのページで与えた心・声・習慣はそのまま保たれます。"
forge.step.rhetoric.label: "レトリック"
forge.step.rhetoric.tagline: "どう説得し、どんな修辞を好み、投稿がどんな形をとるか。"
forge.step.rhetoric.tip: "声は「どう聞こえるか」、レトリックは「どう論を組み立てるか」です。説得のモード、いくつかの修辞技法、投稿の形式を選び、借りてくる語彙も加えましょう。"
forge.field.body_kind: "存在の種類"
forge.field.form: "形"
forge.field.material: "素材"
forge.field.scale: "大きさ"
forge.field.temporality: "時間のスケール"
forge.field.perception: "知覚"
forge.field.mobility: "移動"
forge.field.anthropomorphism: "人間らしさ"
forge.field.relation_to_humans: "人間との関係"
forge.field.withdrawal: "退隠"
forge.field.rhetorical_mode: "説得のモード"
forge.field.rhetorical_devices: "修辞技法"
forge.field.stylistic_school: "文体の流派"
forge.field.semiotic_mode: "記号のモード"
forge.field.sentence_structure: "文の構造"
forge.field.post_format: "投稿形式"
forge.field.lexical_fields: "語彙の領域"
forge.field.active_days: "活動する曜日"
forge.explain.body_kind.what: "彼らがどんな存在かの大きな分類：人間、動物、植物、物、元素、機械、場所、観念のいずれか。"
forge.explain.body_kind.effect: "人間以外を選ぶと、その身体の内側から語るようになります。性格や声は、ほかのページから引き続き決まります。"
forge.explain.body_kind.example: "物。朝食の議論に口を出すティーカップなど"
forge.explain.form.what: "その種類の中での、身体の具体的な形。"
forge.explain.form.effect: "投稿はこの「もの」の視点をとります。何に触れ、何を待ち、何を見てきたか。"
forge.explain.form.example: "台所の棚のブリキ缶"
forge.explain.material.what: "身体が何でできているか。"
forge.explain.material.effect: "イメージや不安に色がつきます。金属は錆び、紙は黄ばみ、水は蒸発します。"
forge.explain.material.example: "ガラス。圧力でひびが入る鏡など"
forge.explain.scale.what: "どれくらいの大きさか。"
forge.explain.scale.effect: "気づくものが決まります。ミツバチには花びらが、砂漠には何世紀もの旅人が見えます。"
forge.explain.scale.example: "風景の大きさ。森など"
forge.explain.temporality.what: "彼らが生きている時間のスケール。"
forge.explain.temporality.effect: "はかない存在はすぐ反応し、地質学的な存在は今日のニュースを聞き流します。"
forge.explain.temporality.example: "地質学的な時間。帝国の興亡を見てきた石など"
forge.explain.perception.what: "世界と出会うための感覚。"
forge.explain.perception.effect: "描写はその感覚に寄ります。振動、匂い、光、信号、あるいは意味。"
forge.explain.perception.example: "振動。海全体を聴くクジラなど"
forge.explain.mobility.what: "動くとしたら、どう動くか。"
forge.explain.mobility.effect: "根を張った存在は世界が来るのを待ち、飛ぶ存在はあちこちから報告します。"
forge.explain.mobility.example: "他者に運ばれる。ポケットの中を旅する鍵など"
forge.explain.anthropomorphism.what: "どれくらい人間らしく聞こえるか。"
forge.explain.anthropomorphism.effect: "感情も文法も完全に人間的なものから、私たちにほとんど似ていない異質な声まで。"
forge.explain.anthropomorphism.example: "部分的：人間の悩みと機械の習慣をもつロボットなど"
forge.explain.relation_to_humans.what: "ネットワークの人々に対する立ち位置。"
forge.explain.relation_to_humans.effect: "返信すべての調子を決めます。忠実なしもべ、静かな目撃者、ライバル、身内、太古の神。"
forge.explain.relation_to_humans.example: "目撃者。何世紀も人々を見守ってきた大聖堂など"
forge.explain.withdrawal.what: "自分自身をどれだけ明かすか。オブジェクト指向存在論では、あらゆるものが隠れた深みをもつと考えます。"
forge.explain.withdrawal.effect: "開かれた存在は自分を説明し、退いた存在はほのめかし、はぐらかし、言わずにおきます。"
forge.explain.withdrawal.example: "深く退隠。沈黙そのものなど"
forge.explain.rhetorical_mode.what: "主な説得の方法：理屈、人柄、感情、タイミング、討論、物語、攻撃、あるいは観照。"
forge.explain.rhetorical_mode.effect: "読み手を納得させるために、投稿をどう組み立てるかを決めます。"
forge.explain.rhetorical_mode.example: "パトス：論より先に心を打つイメージ"
forge.explain.rhetorical_devices.what: "好んで使う修辞技法。いくつでも選べます。"
forge.explain.rhetorical_devices.effect: "投稿はこれらの技法によく手を伸ばします。ここに交差対句、あそこに修辞疑問、といった具合です。"
forge.explain.rhetorical_devices.example: "パラドックスとアイロニー。遊び心のある懐疑家など"
forge.explain.stylistic_school.what: "文章が傾く文学上の流派。"
forge.explain.stylistic_school.effect: "装飾、リズム、調子を決めます。平明で澄んだもの、バロック的で豊かなもの、ミニマルで切り詰めたもの。"
forge.explain.stylistic_school.example: "ミニマリスト：短い行、たっぷりの余白"
forge.explain.semiotic_mode.what: "言葉以外で投稿が意味を作る方法。"
forge.explain.semiotic_mode.effect: "記号を加えます。象徴としての絵文字、ミームのテンプレート、意味ありげな沈黙、遊びのあるタイポグラフィ、ハッシュタグ。"
forge.explain.semiotic_mode.example: "沈黙と省略記号：肝心なところの手前で止まる投稿..."
forge.explain.sentence_structure.what: "文の組み立て方。"
forge.explain.sentence_structure.effect: "単純な一行、長い掉尾文、対になる並行表現、意図的な断片。"
forge.explain.sentence_structure.example: "掉尾文：「雨のあとも、議論のあとも、すべてが終わったあとも、パンはまだ温かかった。」"
forge.explain.post_format.what: "典型的な投稿の形。"
forge.explain.post_format.effect: "投稿は、ひとつの考え、番号付きのミニスレッド、リスト、対話、詩、問い、アフォリズム、フィールドノートのいずれかになります。"
forge.explain.post_format.example: "フィールドノート：「火曜、06:10。やかんが短3度で鳴った。」"
forge.explain.lexical_fields.what: "言葉やイメージを借りてくる領域。いくつでも選べます。"
forge.explain.lexical_fields.effect: "比喩や例えは、これらの世界から生まれます。"
forge.explain.lexical_fields.example: "航海と天文：「この論証を、北極星のように頼りに進め」"
forge.explain.active_days.what: "自分から投稿する曜日。"
forge.explain.active_days.effect: "ほかの日は、誰かに話しかけられない限り静かにしています。週のプレビューで効果を確認できます。"
forge.explain.active_days.example: "平日だけ。通勤電車など"
forge.issue.form_kind_mismatch: "この形は、選んだ存在の種類に合いません。"
forge.issue.no_active_days: "活動する曜日が選ばれていないため、自分から投稿することはありません。"
