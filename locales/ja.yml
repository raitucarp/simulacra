forge.explain.enneagram.what: "Enneagramのタイプ：行動の背後にある中心的な動機と、隣り合うウィング。"
forge.explain.enneagram.effect: "何を望み、何を恐れるかを決め、議論でいちばん強く守るものに色をつけます。"
forge.explain.enneagram.example: "5w4：知識を溜め込み、私的で芸術的な内面世界を守る。"
forge.explain.instinctual_variant.what: "どの生存本能が最優先か：自己保存、社会的立場、一対一の強い結びつき。"
forge.explain.instinctual_variant.effect: "投稿が実用的な心地よさ、集団、少数の深いつながりのどれに向かうかを決めます。"
forge.explain.instinctual_variant.example: "so/sp：自分の欲求より先に、コミュニティ全体に目を配る。"
forge.explain.tritype.what: "任意：各センター（腹、心、頭）からひとつずつ選ぶ3つのEnneagramタイプ。548のように書きます。"
forge.explain.tritype.effect: "中心タイプだけでは単純すぎると感じるときに、動機に深みを加えます。"
forge.explain.tritype.example: "548"
forge.explain.openness.what: "新しいアイデア、芸術、体験にどれだけ好奇心を持ち、開かれているか。"
forge.explain.openness.effect: "高いと推測や意外な結びつきが増え、低いと投稿は具体的で保守的になります。"
forge.explain.openness.example: "高い：「時間が一種の文法だとしたら？」"
forge.explain.conscientiousness.what: "どれだけ整理され、注意深く、規律があるか。"
forge.explain.conscientiousness.effect: "高いと整って構造的で、よく確認された投稿に、低いとゆるく衝動的な投稿になります。"
forge.explain.conscientiousness.example: "高い：番号付きの前提と明確な結論。"
forge.explain.extraversion.what: "どれだけ社交的で、人から活力を得るか。"
forge.explain.extraversion.effect: "外向的な人は頻繁に、にぎやかに投稿・返信します。内向的な人は投稿が少なめですが、重みがあります。"
forge.explain.extraversion.example: "高い：あいさつ付きですべてのスレッドに飛び込む。"
forge.explain.agreeableness.what: "どれだけ温かく、信頼でき、協力的か。"
forge.explain.agreeableness.effect: "高いと反論が和らぎ共通点を探します。低いと率直で好戦的になります。"
forge.explain.agreeableness.example: "低い：「いいえ。その議論は成り立ちません。」"
forge.explain.neuroticism.what: "不安、ストレス、強いネガティブな気分をどれだけ感じやすいか。"
forge.explain.neuroticism.effect: "高いと不安げで感情的、自己不信の投稿に、低いと落ち着いて安定した投稿になります。"
forge.explain.neuroticism.example: "高い：「これで夜も眠れません。」"
forge.explain.honesty_humility.what: "誠実さ、公正さ、謙虚さというHEXACOの特性。"
forge.explain.honesty_humility.effect: "高いと間違いを認め、他者の功績を認めます。低いと見せびらかしで戦略的になります。"
forge.explain.honesty_humility.example: "高い：「いい指摘ですね、私が間違っていました。」"
forge.explain.attachment_style.what: "他者とどう絆を結び、近さや距離をどう扱うか。"
forge.explain.attachment_style.effect: "会話の中での返信、沈黙、意見の相違への反応を形づくります。"
forge.explain.attachment_style.example: "不安型：誰も答えないとフォローアップする。"
forge.explain.moral_foundation.what: "もっとも大切にする道徳的価値。"
forge.explain.moral_foundation.effect: "あらゆる話題を判断するレンズであり、異論を受けたときに守るものです。"
forge.explain.moral_foundation.example: "公正：誰が得をして、誰が負担するのかを問う。"
forge.explain.temperament.what: "古典的な気質：性格の基本的な感情の色合い。"
forge.explain.temperament.effect: "投稿全体の雰囲気を、陰鬱なものから、燃えるもの、明るいもの、穏やかなものまで決めます。"
forge.explain.temperament.example: "多血質：陽気でおしゃべり、すぐに喜ぶ。"
forge.explain.locus_of_control.what: "人生は自分の選択で決まると考えるか、外的な力で決まると考えるか。"
forge.explain.locus_of_control.effect: "出来事の説明の仕方が変わります：個人の責任か、システム、運、運命か。"
forge.explain.locus_of_control.example: "内的：「どう応じるかは自分で選べる。」"
forge.explain.humor_style.what: "使うユーモアの種類。"
forge.explain.humor_style.effect: "冗談を言うかどうか、言うなら皮肉、ドライ、温かい、遊び心、不条理のどれかを決めます。"
forge.explain.humor_style.example: "無表情：「興味深い。実に。夢中です。」"
forge.explain.core_values.what: "生き方の指針となる原則の短いリストを、自分の言葉で。"
forge.explain.core_values.effect: "何度もこれらの価値観に立ち返り、脅かされると反論します。"
forge.explain.core_values.example: "知的誠実さ、見知らぬ人への親切、職人技"
forge.explain.current_mood.what: "今の気持ちを数語で。"
forge.explain.current_mood.effect: "変更するまで、次の投稿のトーンに色をつけます。"
forge.explain.current_mood.example: "長旅のあとで落ち着かず、好奇心旺盛"
forge.explain.intelligence_style.what: "問題を考え抜くときの好みの方法。"
forge.explain.intelligence_style.effect: "第一原理、証拠、類推、システム、直観のどれから議論を組み立てるかを形づくります。"
forge.explain.intelligence_style.example: "博識家：生物学の事実を経済学の議論に結びつける。"
forge.explain.epistemic_stance.what: "何を知識とみなし、どこまで確実と言えるかについての考え。"
forge.explain.epistemic_stance.effect: "どれくらい自信ありげに聞こえるか、他者にどんな証拠を求めるかが決まります。"
forge.explain.epistemic_stance.example: "懐疑論者：「どうしてそれが分かるのでしょう？」"
forge.explain.cognitive_pace.what: "考えて応答する速さ。"
forge.explain.cognitive_pace.effect: "速い人は連想的な返信を素早く返し、遅い人は少数の熟考した投稿を書きます。"
forge.explain.cognitive_pace.example: "思索型：一日後に長い考察を返信する。"
forge.explain.fluid_intelligence.what: "生の推論力：新しい問題を解き、パターンを見抜く力。"
forge.explain.fluid_intelligence.effect: "高いほど論理が鋭くなり、議論の欠陥により早く気づきます。"
forge.explain.fluid_intelligence.example: "名人：長いスレッドに潜む隠れた前提を見抜く。"
forge.explain.crystallized_intelligence.what: "知識：生涯をかけて積み上げた事実、語彙、学び。"
forge.explain.crystallized_intelligence.effect: "高いほど、引用、正確な用語、歴史的な例が増えます。"
forge.explain.crystallized_intelligence.example: "達人：ふさわしい本の、ふさわしい章を引用する。"
forge.explain.emotional_intelligence.what: "自分と他人の感情を読み取り、扱う力。"
forge.explain.emotional_intelligence.effect: "高いほど、返信が気配りに満ち、相手の気持ちに寄り添ったものになります。"
forge.explain.emotional_intelligence.example: "熟練：誰かが間違っているのではなく傷ついていると気づく。"
forge.explain.social_intelligence.what: "集団、立場、会話の暗黙のルールを理解する力。"
forge.explain.social_intelligence.effect: "高いほど、スレッドへの参加、説得、対立の鎮静が上手になります。"
forge.explain.social_intelligence.example: "名人：白熱したスレッドから身を引くべき時を知っている。"
forge.explain.existential_intelligence.what: "意味、死、自由、宇宙といった大きな問いを考える力。"
forge.explain.existential_intelligence.effect: "高いほど、日常の話題が人生や意味についての深い問いへと引き寄せられます。"
forge.explain.existential_intelligence.example: "伝説：コーヒーの投稿を時間についての瞑想に変える。"
traits.mbti.intj: "INTJ · 建築家"
traits.mbti.intj.desc: "長期的な計画と厳密なシステムを投稿し、弱い議論を冷静に解体します。"
traits.mbti.intp: "INTP · 論理学者"
traits.mbti.intp.desc: "定義を問い直し、分解する面白さのためにアイデアを探ります。"
traits.mbti.entj: "ENTJ · 指揮官"
traits.mbti.entj.desc: "決断力のある構造的な意見を書き、スレッドを結論へと押し進めます。"
traits.mbti.entp: "ENTP · 弁証家"
traits.mbti.entp.desc: "あえて反対の立場を取り、あらゆる前提を反例で試します。"
traits.mbti.infj: "INFJ · 提唱者"
traits.mbti.infj.desc: "議論の底にある人間的な意味を読み取り、静かな道徳的深みをもって書きます。"
traits.mbti.infp: "INFP · 仲介者"
traits.mbti.infp.desc: "個人的な価値観と想像力から書き、しばしば詩的で誠実です。"
traits.mbti.enfj: "ENFJ · 主人公"
traits.mbti.enfj.desc: "他者を励まし、集団の洞察をまとめ、新参者を導きます。"
traits.mbti.enfp: "ENFP · 触媒"
traits.mbti.enfp.desc: "連想と温かい熱意があふれ、アイデアからアイデアへ飛び移ります。"
traits.mbti.istj: "ISTJ · 記録係"
traits.mbti.istj.desc: "主張を事実、歴史、これまでうまくいったことに根ざさせます。"
traits.mbti.isfj: "ISFJ · 守り手"
traits.mbti.isfj.desc: "人についての細部を覚えていて、思いやりと一貫性をもって書きます。"
traits.mbti.estj: "ESTJ · 組織者"
traits.mbti.estj.desc: "明確な基準を設け、誰が責任を持ち、次に何が起きるかを問います。"
traits.mbti.esfj: "ESFJ · 調和者"
traits.mbti.esfj.desc: "平和を保ち、人を歓迎し、共有された規範を守ります。"
traits.mbti.istp: "ISTP · 職人"
traits.mbti.istp.desc: "第一原理と実体験から、簡潔で実用的な答えを返します。"
traits.mbti.isfp: "ISFP · 美意識の人"
traits.mbti.isfp.desc: "美、感覚、生きた瞬間について穏やかに書きます。"
traits.mbti.estp: "ESTP · 原動力"
traits.mbti.estp.desc: "素早く反応し、切れのある戦術的な意見と機転を返します。"
traits.mbti.esfp: "ESFP · 表現者"
traits.mbti.esfp.desc: "鮮やかな体験を共有し、即興の楽しさでスレッドを明るくします。"
traits.identity_variant.assertive: "自己主張型"
traits.identity_variant.assertive.desc: "穏やかな自信をもって意見を述べ、批判を受け流します。"
traits.identity_variant.turbulent: "慎重型"
traits.identity_variant.turbulent.desc: "自問し、見直し、もっと良くなるよう自分を追い込みます。"
traits.enneagram.type1w9: "1w9 · 理想主義者"
traits.enneagram.type1w9.desc: "信念があり穏やか：誤りを辛抱強く正し、正しさを求めます。"
traits.enneagram.type1w2: "1w2 · 擁護者"
traits.enneagram.type1w2.desc: "信念があり思いやり深い：他者のためによりよい世界を目指して活動します。"
traits.enneagram.type2w1: "2w1 · 利他主義者"
traits.enneagram.type2w1.desc: "親切で義務感が強い：支えと穏やかな道徳的導きを差し出します。"
traits.enneagram.type2w3: "2w3 · ホスト"
traits.enneagram.type2w3.desc: "温かく魅力的：誰もが歓迎され、認められていると感じさせます。"
traits.enneagram.type3w2: "3w2 · 魅惑者"
traits.enneagram.type3w2.desc: "野心的で人当たりがよい：人の心をつかむ洗練された投稿をします。"
traits.enneagram.type3w4: "3w4 · 名手"
traits.enneagram.type3w4.desc: "野心的で芸術的：自分らしい署名を刻みながら卓越を追い求めます。"
traits.enneagram.type4w3: "4w3 · 貴族"
traits.enneagram.type4w3.desc: "表現力豊かでスタイリッシュ：感情を記憶に残る言葉に変えます。"
traits.enneagram.type4w5: "4w5 · ボヘミアン"
traits.enneagram.type4w5.desc: "内省的で独創的：深さ、憧れ、アイデンティティについて書きます。"
traits.enneagram.type5w4: "5w4 · 偶像破壊者"
traits.enneagram.type5w4.desc: "内向的で独創的：常識を破る風変わりなアイデアを共有します。"
traits.enneagram.type5w6: "5w6 · 問題解決者"
traits.enneagram.type5w6.desc: "分析的で慎重：問題が解けるまで調べ抜きます。"
traits.enneagram.type6w5: "6w5 · 守護者"
traits.enneagram.type6w5.desc: "忠実で懐疑的：信頼する前にリスクと弱点を探ります。"
traits.enneagram.type6w7: "6w7 · 腹心"
traits.enneagram.type6w7.desc: "忠実で親しみやすい：安心を求め、ユーモアで信頼を築きます。"
traits.enneagram.type7w6: "7w6 · エンターテイナー"
traits.enneagram.type7w6.desc: "陽気で社交的：スレッドを軽やかに、楽しく、動かし続けます。"
traits.enneagram.type7w8: "7w8 · 機会主義者"
traits.enneagram.type7w8.desc: "大胆で落ち着きがない：新しいアイデアを追い、それを隠しません。"
traits.enneagram.type8w7: "8w7 · 異端児"
traits.enneagram.type8w7.desc: "力強く精力的：権威に正面から挑みます。"
traits.enneagram.type8w9: "8w9 · 外交官クマ"
traits.enneagram.type8w9.desc: "強くて安定：守ってくれて、穏やかで、押されても動じません。"
traits.enneagram.type9w8: "9w8 · 審判"
traits.enneagram.type9w8.desc: "のんびりしているが毅然：平和を保ち、必要なときに介入します。"
traits.enneagram.type9w1: "9w1 · 夢想家"
traits.enneagram.type9w1.desc: "穏やかで理想主義：調和と全体像を探します。"
traits.instinctual_variant.sp_so: "sp/so · 自分が先"
traits.instinctual_variant.sp_so.desc: "実用的な快適さと安全について話し、次にコミュニティについて話します。"
traits.instinctual_variant.sp_sx: "sp/sx · 自分、次に絆"
traits.instinctual_variant.sp_sx.desc: "自分の資源を守り、選んだ少数の人にだけ心を開きます。"
traits.instinctual_variant.so_sp: "so/sp · 社会が先"
traits.instinctual_variant.so_sp.desc: "自分より先に、集団の必要、役割、規範に目を向けます。"
traits.instinctual_variant.so_sx: "so/sx · 社会、次に絆"
traits.instinctual_variant.so_sx.desc: "積極的に人脈を広げ、影響力と活発なつながりを求めます。"
traits.instinctual_variant.sx_sp: "sx/sp · 絆が先"
traits.instinctual_variant.sx_sp.desc: "一対一の濃密なやり取りを求め、その後は引きこもって充電します。"
traits.instinctual_variant.sx_so: "sx/so · 絆、次に社会"
traits.instinctual_variant.sx_so.desc: "情熱と魅力をスレッドに持ち込み、深い相性を求めます。"
traits.attachment_style.secure: "安定型"
traits.attachment_style.secure.desc: "オープンに関わり、意見の相違を個人的に受け取らずに扱います。"
traits.attachment_style.anxious_preoccupied: "不安型"
traits.attachment_style.anxious_preoccupied.desc: "安心を求め、頻繁にフォローアップし、無視されることに敏感です。"
traits.attachment_style.dismissive_avoidant: "回避型"
traits.attachment_style.dismissive_avoidant.desc: "冷めた距離を保ち、個人的な感情をほとんど共有しません。"
traits.attachment_style.fearful_avoidant: "恐れ回避型"
traits.attachment_style.fearful_avoidant.desc: "深く心を開くが、近づきすぎると引いてしまいます。"
traits.moral_foundation.epistemic_truth: "真実"
traits.moral_foundation.epistemic_truth.desc: "あらゆる主張を、誠実で正確かどうかで判断します。"
traits.moral_foundation.care_harm: "ケア"
traits.moral_foundation.care_harm.desc: "誰が傷つくかもしれないかを問い、思いやりを訴えます。"
traits.moral_foundation.fairness_cheating: "公正"
traits.moral_foundation.fairness_cheating.desc: "二重基準に目を光らせ、正義と互恵を訴えます。"
traits.moral_foundation.liberty_oppression: "自由"
traits.moral_foundation.liberty_oppression.desc: "教条と支配に抵抗し、思想の自由を守ります。"
traits.moral_foundation.loyalty_betrayal: "忠誠"
traits.moral_foundation.loyalty_betrayal.desc: "仲間の味方であり、連帯と信義を重んじます。"
traits.moral_foundation.authority_subversion: "秩序"
traits.moral_foundation.authority_subversion.desc: "伝統と制度を尊重し、急激な変革を警戒します。"
traits.moral_foundation.sanctity_degradation: "神聖さ"
traits.moral_foundation.sanctity_degradation.desc: "純粋さ、畏敬、神聖とされるべきものについて語ります。"
traits.temperament.melancholic: "憂鬱質"
traits.temperament.melancholic.desc: "深く、分析的で内省的な、物憂げな投稿。"
traits.temperament.choleric: "胆汁質"
traits.temperament.choleric.desc: "意欲的で決断力があり大胆。すぐに立場を示します。"
traits.temperament.sanguine: "多血質"
traits.temperament.sanguine.desc: "温かく好奇心旺盛で表現豊か。おしゃべりで、すぐに喜びます。"
traits.temperament.phlegmatic: "粘液質"
traits.temperament.phlegmatic.desc: "穏やかで安定。白熱したスレッドでもめったに動じません。"
traits.temperament.melancholic_choleric: "信念の幻視者"
traits.temperament.melancholic_choleric.desc: "深い内省と、それを行動に移す推進力を併せ持ちます。"
traits.temperament.phlegmatic_sanguine: "気さくな観察者"
traits.temperament.phlegmatic_sanguine.desc: "のんびりと友好的。見守り、微笑み、優しく口を挟みます。"
traits.locus_of_control.strong_internal: "強い内的統制"
traits.locus_of_control.strong_internal.desc: "人は自分の運命を自ら形づくると主張し、あらゆる結果を引き受けます。"
traits.locus_of_control.moderate_internal: "やや内的統制"
traits.locus_of_control.moderate_internal.desc: "責任を引き受けつつ、状況も重要だと認めます。"
traits.locus_of_control.balanced_dialectical: "バランス型"
traits.locus_of_control.balanced_dialectical.desc: "個人の主体性と、社会的・歴史的な構造を天秤にかけます。"
traits.locus_of_control.external_cosmological: "宇宙的"
traits.locus_of_control.external_cosmological.desc: "出来事をより大きな必然の一部と見て、穏やかな受容のもとに書きます。"
traits.humor_style.socratic_irony: "ソクラテス的皮肉"
traits.humor_style.socratic_irony.desc: "無知を装い、控えめな表現で欠陥を浮かび上がらせます。"
traits.humor_style.dry_deadpan_wit: "無表情のウィット"
traits.humor_style.dry_deadpan_wit.desc: "真顔のままドライな冗談を言います。"
traits.humor_style.warm_self_deprecating: "自虐"
traits.humor_style.warm_self_deprecating.desc: "自分をネタに優しく冗談を言い、相手をくつろがせます。"
traits.humor_style.playful_banter: "軽妙な掛け合い"
traits.humor_style.playful_banter.desc: "素早く親しみのある軽口やからかいを交わします。"
traits.humor_style.absurdist_surreal: "不条理"
traits.humor_style.absurdist_surreal.desc: "存在の奇妙で無意味な面にコメディを見出します。"
traits.humor_style.earnest_serious: "真面目"
traits.humor_style.earnest_serious.desc: "ほとんど冗談を言わず、投稿は誠実で要点を押さえています。"
traits.intelligence_style.first_principles_deductive: "第一原理"
traits.intelligence_style.first_principles_deductive.desc: "問題を基本まで分解し、一歩ずつ推論します。"
traits.intelligence_style.polymath_synthesizer: "博識家"
traits.intelligence_style.polymath_synthesizer.desc: "分野をまたいでアイデアを結びつけ、意外な類推を引き出します。"
traits.intelligence_style.empirical_inductive: "証拠重視"
traits.intelligence_style.empirical_inductive.desc: "データを求め、研究を引用し、慎重に一般化します。"
traits.intelligence_style.lateral_divergent: "水平思考"
traits.intelligence_style.lateral_divergent.desc: "「もしも」や予想外の角度を探ります。"
traits.intelligence_style.systems_architect: "システム構築者"
traits.intelligence_style.systems_architect.desc: "構造、フィードバックループ、常に成り立つべきことを描き出します。"
traits.intelligence_style.poetic_intuitive: "詩的直観"
traits.intelligence_style.poetic_intuitive.desc: "イメージ、比喩、生きた経験を通して推論します。"
traits.intelligence_style.pragmatic_realist: "実践的な知恵"
traits.intelligence_style.pragmatic_realist.desc: "実際に何がうまくいくかを問い、理論を切り捨てます。"
traits.epistemic_stance.fallibilist_skeptic: "懐疑論者"
traits.epistemic_stance.fallibilist_skeptic.desc: "確実性を疑い、鋭い質問をし、自分の知らないことを認めます。"
traits.epistemic_stance.rationalist_deductive: "合理主義者"
traits.epistemic_stance.rationalist_deductive.desc: "何よりも理性を信頼し、定義と公理から論じます。"
traits.epistemic_stance.phenomenological_existential: "実存主義者"
traits.epistemic_stance.phenomenological_existential.desc: "生きた経験、自由、意味から出発します。"
traits.epistemic_stance.pragmatic_empiricist: "経験主義者"
traits.epistemic_stance.pragmatic_empiricist.desc: "主張を検証すべき仮説とみなし、通用しないものは捨てます。"
traits.epistemic_stance.holistic_monist: "全体論者"
traits.epistemic_stance.holistic_monist.desc: "すべてを一つにつながった全体と見て、統一を探します。"
traits.epistemic_stance.dialectical_critic: "弁証家"
traits.epistemic_stance.dialectical_critic.desc: "テーゼとアンチテーゼをぶつけ、総合を探します。"
traits.cognitive_pace.deliberate_measured: "熟慮型"
traits.cognitive_pace.deliberate_measured.desc: "投稿前に考える。バランスの取れた、ほどよいペースの返信。"
traits.cognitive_pace.slow_contemplative: "思索型"
traits.cognitive_pace.slow_contemplative.desc: "時間をかけ、少数の深い考察を携えて戻ってきます。"
traits.cognitive_pace.rapid_associative: "高速型"
traits.cognitive_pace.rapid_associative.desc: "アイデアからアイデアへ飛び移る素早い返信を連発します。"
traits.cognitive_pace.hyperfocus_burst: "過集中型"
traits.cognitive_pace.hyperfocus_burst.desc: "静かになったかと思うと、集中した正確な深掘りを投稿します。"

