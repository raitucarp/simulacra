suggest.why.engine_max_tool_steps: "2〜6ラウンドあれば、迷走せずに調べものができます。ツールがなければ1回で十分です。"
suggest.why.photo_zoom: "少しズームすると顔が丸枠いっぱいに収まります。やりすぎるとぼやけます。"
suggest.why.gender: "名前に合うものを選んでください。代名詞の例もそれに従います。"
suggest.why.mbti: "最初の候補は、性格スコアがすでに示しているタイプです。"
suggest.why.identity_variant: "神経症傾向に連動します。高いと不安定型、低いと自己主張型です。"
