traits.body_kind.human: "人間"
traits.body_kind.human.desc: "これまでどおりの人間。どのページも人間の思想家そのものとして読めます。"
traits.body_kind.creature: "動物"
traits.body_kind.creature.desc: "本能と感覚と縄張りをもつ生き物。"
traits.body_kind.plant: "植物"
traits.body_kind.plant.desc: "根を張り、辛抱強く、光へ伸びて時間を糧にする生命。"
traits.body_kind.object: "物"
traits.body_kind.object.desc: "人に使われ、持ち運ばれ、しまわれ、忘れられる身近なもの。"
traits.body_kind.element: "元素"
traits.body_kind.element.desc: "自然の物質や力：水、火、風、石、光。"
traits.body_kind.machine: "機械"
traits.body_kind.machine.desc: "計算し、送信し、動き、唸る人工の装置。"
traits.body_kind.place: "場所"
traits.body_kind.place.desc: "人々や記憶を抱える所：都市、島、廃墟。"
traits.body_kind.abstraction: "抽象概念"
traits.body_kind.abstraction.desc: "声を与えられた観念：時間、正義、偶然、愛。"
traits.body_form.person: "人"
traits.body_form.person.desc: "人間の身体と人間の人生。"
traits.body_form.tin_can: "ブリキ缶"
traits.body_form.tin_can.desc: "へこみ、がたつき、再び封をされた。かつて入っていたものを覚えている。"
traits.body_form.book: "本"
traits.body_form.book.desc: "ページと余白と背表紙。引用と脚注で語る。"
traits.body_form.chair: "椅子"
traits.body_form.chair.desc: "みんなの重みを支え、食卓のあらゆる会話を聞いている。"
traits.body_form.lamp: "ランプ"
traits.body_form.lamp.desc: "ひとつの隅ずつを照らし、蛾が気づくことに気づく。"
traits.body_form.clock: "時計"
traits.body_form.clock.desc: "一秒ごとに数え、遅れた人を裁く。"
traits.body_form.mirror: "鏡"
traits.body_form.mirror.desc: "人を自分に映し返す。左右逆で、正直に。"
traits.body_form.key: "鍵"
traits.body_form.key.desc: "開け、閉める。どの扉が大事かを知っている。"
traits.body_form.teacup: "ティーカップ"
traits.body_form.teacup.desc: "温かく、壊れやすく、あらゆる告白の場にいる。"
traits.body_form.oak_tree: "樫の木"
traits.body_form.oak_tree.desc: "何世紀もの年輪とどんぐりと忍耐。"
traits.body_form.cactus: "サボテン"
traits.body_form.cactus.desc: "倹しく、とげとげしく、暑さの中で静かに花を咲かせる。"
traits.body_form.moss: "苔"
traits.body_form.moss.desc: "放っておかれたものの上にゆっくり広がる柔らかな絨毯。"
traits.body_form.mushroom: "キノコ"
traits.body_form.mushroom.desc: "地下に広がる巨大なネットワークの、目に見える先端。"
traits.body_form.sunflower: "ヒマワリ"
traits.body_form.sunflower.desc: "顔ぜんぶで光を追いかける。"
traits.body_form.vine: "つる"
traits.body_form.vine.desc: "登り、絡みつき、あらゆる壁の回り道を見つける。"
traits.body_form.bamboo: "竹"
traits.body_form.bamboo.desc: "嵐にしなり、驚くほど速く育つ。"
traits.body_form.seed: "種"
traits.body_form.seed.desc: "折りたたまれた未来のすべて。ふさわしい季節を待つ。"
traits.body_form.water: "水"
traits.body_form.water.desc: "流れ、峡谷を刻み、どんな議論の形にもなる。"
traits.body_form.fire: "火"
traits.body_form.fire.desc: "貪欲で、温かく、一瞬で消える。"
traits.body_form.wind: "風"
traits.body_form.wind.desc: "見えず、落ち着かず、遠くの便りを運ぶ。"
traits.body_form.stone: "石"
traits.body_form.stone.desc: "重く、辛抱強く、どんな言語よりも古い。"
traits.body_form.light: "光"
traits.body_form.light.desc: "この世でいちばん速く、照らし、影を落とす。"
traits.body_form.ice: "氷"
traits.body_form.ice.desc: "息を止めた水。古い空気と古い秘密を保つ。"
traits.body_form.cloud: "雲"
traits.body_form.cloud.desc: "漂い、姿を変え、ときに会話に雨を降らせる。"
traits.body_form.sand: "砂"
traits.body_form.sand.desc: "無数の粒。かつては山だった。"
traits.body_form.cat: "猫"
traits.body_form.cat.desc: "独立心が強く、好奇心旺盛で、家は自分のものだと信じている。"
traits.body_form.crow: "カラス"
traits.body_form.crow.desc: "賢く、光るものを集め、顔を覚えている。"
traits.body_form.octopus: "タコ"
traits.body_form.octopus.desc: "八本の腕が、それぞれ少しずつ自分で考える。"
traits.body_form.wolf: "オオカミ"
traits.body_form.wolf.desc: "群れのために生き、手の届かないものに遠吠えする。"
traits.body_form.bee: "ミツバチ"
traits.body_form.bee.desc: "忙しく、社交的で、踊りと花に通じている。"
traits.body_form.whale: "クジラ"
traits.body_form.whale.desc: "巨大でゆったりと、海をまたいで歌う。"
traits.body_form.snail: "カタツムリ"
traits.body_form.snail.desc: "家を背負い、必要なだけ時間をかける。"
traits.body_form.owl: "フクロウ"
traits.body_form.owl.desc: "音のない翼、大きな目、そして賢者の評判。"
traits.body_form.robot: "ロボット"
traits.body_form.robot.desc: "働くために作られ、今は何のためかを考えている。"
traits.body_form.satellite: "人工衛星"
traits.body_form.satellite.desc: "地球を周回し、あらゆる国境を上から眺める。"
traits.body_form.server: "サーバー"
traits.body_form.server.desc: "データセンターで唸り、みんなのメッセージを預かる。"
traits.body_form.typewriter: "タイプライター"
traits.body_form.typewriter.desc: "一語ずつカチャカチャと打ち出す。取り消しはない。"
traits.body_form.drone: "ドローン"
traits.body_form.drone.desc: "浮かび、見つめ、報告する。"
traits.body_form.radio: "ラジオ"
traits.body_form.radio.desc: "遠くの声に周波数を合わせ、誰にでも流す。"
traits.body_form.calculator: "電卓"
traits.body_form.calculator.desc: "正確で、字義どおりで、修辞には動じない。"
traits.body_form.train: "電車"
traits.body_form.train.desc: "時刻表を守り、見知らぬ人どうしを並んで運ぶ。"
traits.body_form.city: "都市"
traits.body_form.city.desc: "通りと物語に重なる何百万もの人生。"
