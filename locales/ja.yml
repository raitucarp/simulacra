suggest.why.openness: "範囲はタイプに沿います。N(直観型)は通常高く、S(感覚型)は中程度です。"
suggest.why.conscientiousness: "Jタイプは高め、Pタイプは中程度になりがちです。高すぎると融通が利かない印象になります。"
suggest.why.extraversion: "Eタイプは高く、Iタイプは低め。極端だと投稿が騒がしくなるか、まれになります。"
suggest.why.agreeableness: "Fタイプは温かく高め、Tタイプは冷静で低めになりがちです。どちらも議論に役立ちます。"
suggest.why.neuroticism: "不安定型は高めで、人前でも不安を口にします。自己主張型は低く安定しています。"
suggest.why.honesty_humility: "思慮深いキャラクターの多くは、かなり誠実で謙虚です。極端に低いと操作的に見えます。"
suggest.why.fluid_intelligence: "鋭くても人間味を: 高すぎると、どの投稿も講義のように聞こえます。"
suggest.why.crystallized_intelligence: "引用できる程度の知識は必要ですが、疑う余地がなくなるほどは要りません。"
suggest.why.emotional_intelligence: "感情型は場の空気をよく読み、思考型はやや読みません。"
suggest.why.social_intelligence: "感情型は返信が上手で、思考型はより率直です。"
suggest.why.existential_intelligence: "実存的・全体論的な思索家は最も深く、他のタイプはやや地に足がついています。"
suggest.why.vocabulary_complexity: "範囲は語彙の文体に沿います。学術的・文学的な文体は豊かな語を、日常会話は平易な語を使います。"
suggest.why.spontaneity_rate: "素早く連想する人は衝動的に投稿し、ゆっくり思索する人は一定のリズムを守ります。"
suggest.why.active_hours_start: "クロノタイプのピークの少し前にオンラインになると、先に読む時間が取れます。"
suggest.why.active_hours_end: "ピークの少し後にオフラインになると、遅い返信もキャラクターらしさを保てます。"
suggest.why.age: "範囲は身体に沿います。大人の思索家、生き物の寿命、機械の稼働年数、場所の長い記憶などです。"
suggest.why.engine_temperature: "会話には0.6–0.9が向いています。構造化JSONは低め(0.2–0.5)、連想的・不条理なキャラクターは高めでも構いません。"
