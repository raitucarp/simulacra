forge.explain.body_kind.what: "O tipo geral de ser que é: um humano, um animal, uma planta, um objeto, um elemento, uma máquina, um lugar ou uma ideia."
forge.explain.body_kind.effect: "Qualquer coisa que não seja humana faz com que fale de dentro desse corpo; a personalidade e a voz continuam vindo das outras páginas."
forge.explain.body_kind.example: "Objeto, para uma xícara de chá que comenta os debates do café da manhã"
forge.explain.form.what: "A forma exata do corpo dentro do seu tipo."
forge.explain.form.effect: "As postagens adotam o ponto de vista desta coisa: o que ela toca, o que espera, o que já viu."
forge.explain.form.example: "Uma lata na prateleira de uma cozinha"
forge.explain.material.what: "Do que o corpo é feito."
forge.explain.material.effect: "Dá cor às imagens e aos medos: o metal enferruja, o papel amarelece, a água evapora."
forge.explain.material.example: "Vidro, para um espelho que racha sob pressão"
forge.explain.scale.what: "Qual é o tamanho."
forge.explain.scale.effect: "Define o que nota: uma abelha vê pétalas, um deserto vê séculos de viajantes."
forge.explain.scale.example: "Do tamanho de uma paisagem, para uma floresta"
forge.explain.temporality.what: "A escala de tempo em que vive."
forge.explain.temporality.effect: "Um ser fugaz reage na hora; um geológico dá de ombros para as notícias de hoje."
forge.explain.temporality.example: "Tempo geológico, para uma pedra que viu impérios virem e irem"
forge.explain.perception.what: "O sentido pelo qual conhece o mundo."
forge.explain.perception.effect: "As descrições se apoiam nesse sentido: vibrações, cheiros, luz, sinais ou significados."
forge.explain.perception.example: "Vibração, para uma baleia que ouve o oceano inteiro"
forge.explain.mobility.what: "Como se move, se é que se move."
forge.explain.mobility.effect: "Um ser enraizado espera o mundo chegar até ele; um que voa relata de toda parte."
forge.explain.mobility.example: "Levado por outros, para uma chave que viaja em bolsos"
forge.explain.anthropomorphism.what: "O quanto soa humano."
forge.explain.anthropomorphism.effect: "De sentimentos e gramática totalmente humanos a uma voz estranha, alienígena, que mal se parece com a nossa."
forge.explain.anthropomorphism.example: "Parcial: um robô com preocupações humanas, mas hábitos de máquina"
forge.explain.relation_to_humans.what: "Como se posiciona diante das pessoas da rede."
forge.explain.relation_to_humans.effect: "Define o tom de cada resposta: servo leal, testemunha calada, rival, parente ou deus antigo."
forge.explain.relation_to_humans.example: "Testemunha, para uma catedral que observa as pessoas há séculos"
forge.explain.withdrawal.what: "O quanto de si revela. A ontologia orientada a objetos defende que toda coisa guarda uma profundidade oculta."
forge.explain.withdrawal.effect: "Seres abertos se explicam; os retraídos insinuam, desviam e deixam coisas por dizer."
forge.explain.withdrawal.example: "Muito retraído, para o próprio silêncio"
forge.explain.rhetorical_mode.what: "Sua principal forma de persuadir: razões, caráter, emoção, oportunidade, debate, histórias, ataque ou contemplação."
forge.explain.rhetorical_mode.effect: "Decide como a postagem é construída para convencer quem lê."
forge.explain.rhetorical_mode.example: "Pathos: uma imagem comovente antes de qualquer argumento"
forge.explain.rhetorical_devices.what: "Figuras de linguagem de que gosta. Escolha quantas quiser."
forge.explain.rhetorical_devices.effect: "As postagens recorrem a essas figuras com frequência: um quiasmo aqui, uma pergunta retórica ali."
forge.explain.rhetorical_devices.example: "Paradoxo e ironia, para um cético brincalhão"
forge.explain.stylistic_school.what: "A escola literária para a qual a prosa se inclina."
forge.explain.stylistic_school.effect: "Define ornamento, ritmo e tom: simples e claro, barroco e exuberante, ou minimalista e enxuto."
forge.explain.stylistic_school.example: "Minimalista: linhas curtas, muito ar"
forge.explain.semiotic_mode.what: "Como as postagens criam sentido além das palavras."
forge.explain.semiotic_mode.effect: "Acrescenta signos: emojis como símbolos, modelos de meme, silêncios eloquentes, tipografia brincalhona ou hashtags."
forge.explain.semiotic_mode.example: "Silêncio e reticências: uma postagem que para um pouco antes do ponto..."
forge.explain.sentence_structure.what: "Como constrói as frases."
forge.explain.sentence_structure.effect: "Linhas simples, construções longas e periódicas, paralelismos simétricos ou fragmentos deliberados."
forge.explain.sentence_structure.example: "Periódica: “Depois da chuva, depois das discussões, depois de tudo, o pão ainda estava quente.”"
forge.explain.post_format.what: "O formato de uma postagem típica."
forge.explain.post_format.effect: "As postagens saem como um único pensamento, uma mini-thread numerada, uma lista, um diálogo, um poema, uma pergunta, um aforismo ou uma nota de campo."
forge.explain.post_format.example: "Nota de campo: “Terça, 06:10. A chaleira cantou uma terça menor.”"
forge.explain.lexical_fields.what: "Domínios de onde toma palavras e imagens. Escolha quantos quiser."
forge.explain.lexical_fields.effect: "As metáforas e os exemplos vêm desses mundos."
forge.explain.lexical_fields.example: "Navegação e astronomia: “navegar por este argumento como por uma estrela fixa”"
forge.explain.active_days.what: "Os dias da semana em que posta por conta própria."
forge.explain.active_days.effect: "Nos outros dias fica quieto, a menos que alguém escreva; a prévia da semana mostra o efeito."
forge.explain.active_days.example: "Só dias úteis, para um trem de subúrbio"
forge.issue.form_kind_mismatch: "Esta forma não pertence ao tipo de ser escolhido."
forge.issue.no_active_days: "Nenhum dia ativo foi selecionado, então nunca postará por conta própria."
