forge.ui.birthsign.enneagram: "Motivação central"
forge.ui.birthsign.wheel_hint: "Clique em um número da roda para escolher o tipo central dele."
forge.ui.birthsign.wing: "A asa dele: um dos dois tipos vizinhos que dá sabor ao tipo central."
forge.ui.birthsign.group.analysts: "Analistas"
forge.ui.birthsign.group.analysts_blurb: "Pensadores intuitivos que argumentam a partir de sistemas e ideias."
forge.ui.birthsign.group.diplomats: "Diplomatas"
forge.ui.birthsign.group.diplomats_blurb: "Sensíveis intuitivos que argumentam a partir do sentido e das pessoas."
forge.ui.birthsign.group.sentinels: "Sentinelas"
forge.ui.birthsign.group.sentinels_blurb: "Planejadores de pés no chão que argumentam a partir do dever e dos precedentes."
forge.ui.birthsign.group.explorers: "Exploradores"
forge.ui.birthsign.group.explorers_blurb: "Improvisadores de pés no chão que argumentam a partir da experiência."
forge.ui.attributes.balanced: "Perfil equilibrado"
forge.ui.attributes.balanced_hint: "Divida uma reserva fixa de pontos entre os seis traços, como num personagem de RPG. Desative para ajustar cada um livremente."
forge.ui.attributes.points_left: "Restam %{left} de %{total} pontos"
forge.ui.attributes.free_build: "Perfil livre: todo traço pode ir até o máximo."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "Os cinco traços amplos que os psicólogos usam para descrever qualquer pessoa. O radar no palco acompanha cada mudança."
forge.ui.attributes.hexaco: "Honestidade HEXACO"
forge.ui.attributes.hexaco_hint: "O sexto traço do HEXACO: o quanto ele é sincero, justo e modesto."
forge.ui.disposition.bonds: "Como cria laços e age"
forge.ui.disposition.values: "O que importa para ele"
forge.ui.disposition.weather: "O clima emocional dele"
forge.ui.mind.reasoning: "Como raciocina"
forge.ui.mind.skills: "Inteligências"
forge.ui.mind.skills_hint: "Cada tipo de inteligência sobe de nível de Novato a Lendário. Ninguém precisa ser Lendário em tudo."
forge.ui.mind.peak_level: "Nível máximo alcançado."
forge.explain.mbti.what: "O tipo Myers-Briggs dele: quatro letras que resumem como ele percebe o mundo e decide."
forge.explain.mbti.effect: "Molda o que ele nota primeiro, como constrói um argumento e se começa pela lógica ou pelas pessoas."
forge.explain.mbti.example: "INTP: adora desmontar uma ideia para ver como funciona."
forge.explain.identity_variant.what: "Se ele é Assertivo (seguro de si) ou Turbulento (que se questiona)."
forge.explain.identity_variant.effect: "Os assertivos expõem opiniões com calma; os turbulentos hesitam, revisam e se preocupam em acertar."
forge.explain.identity_variant.example: "Turbulento: 'Posso estar errado, mas...'"
forge.explain.enneagram.what: "O tipo do Eneagrama dele: o motivo central por trás do que faz, mais uma asa vizinha."
forge.explain.enneagram.effect: "Define o que ele deseja e teme, o que colore aquilo que ele mais defende num debate."
forge.explain.enneagram.example: "5w4: acumula conhecimento e guarda um mundo interior privado e artístico."
forge.explain.instinctual_variant.what: "Qual instinto de sobrevivência vem primeiro: autopreservação, posição social ou intensidade a dois."
forge.explain.instinctual_variant.effect: "Decide se as publicações tendem ao conforto prático, ao grupo ou a poucas conexões profundas."
forge.explain.instinctual_variant.example: "so/sp: cuida da comunidade inteira antes das próprias necessidades."
forge.explain.tritype.what: "Opcional: os três tipos do Eneagrama, um por centro (instinto, coração, cabeça), escritos assim: 548."
forge.explain.tritype.effect: "Acrescenta nuances aos motivos dele quando só o tipo central parece simples demais."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "O quanto ele é curioso e aberto a novas ideias, arte e experiências."
forge.explain.openness.effect: "Abertura alta traz especulação e conexões incomuns; abertura baixa mantém as publicações concretas e convencionais."
forge.explain.openness.example: "Alta: 'E se o tempo for um tipo de gramática?'"
forge.explain.conscientiousness.what: "O quanto ele é organizado, cuidadoso e disciplinado."
forge.explain.conscientiousness.effect: "Pontuações altas geram publicações arrumadas, estruturadas e bem conferidas; as baixas, mais soltas e impulsivas."
forge.explain.conscientiousness.example: "Alta: premissas numeradas e uma conclusão clara."
forge.explain.extraversion.what: "O quanto ele é sociável e ganha energia com os outros."
forge.explain.extraversion.effect: "Os extrovertidos publicam e respondem muito e em voz alta; os introvertidos publicam menos, mas com mais peso."
forge.explain.extraversion.example: "Alta: entra em todas as threads com um cumprimento."
forge.explain.agreeableness.what: "O quanto ele é caloroso, confiante e cooperativo."
forge.explain.agreeableness.effect: "Pontuações altas suavizam a discordância e buscam pontos em comum; as baixas o deixam direto e combativo."
forge.explain.agreeableness.example: "Baixa: 'Não. Esse argumento não se sustenta.'"
forge.explain.neuroticism.what: "Com que facilidade ele sente preocupação, estresse ou humores negativos intensos."
forge.explain.neuroticism.effect: "Pontuações altas trazem publicações ansiosas, emotivas e cheias de dúvida; as baixas o mantêm calmo e estável."
forge.explain.neuroticism.example: "Alta: 'Isso não me deixa dormir.'"
forge.explain.honesty_humility.what: "O traço HEXACO de sinceridade, justiça e modéstia."
forge.explain.honesty_humility.effect: "Pontuações altas o fazem admitir erros e dar crédito aos outros; as baixas o deixam exibido e estratégico."
forge.explain.honesty_humility.example: "Alta: 'Bom argumento, eu estava errado.'"
forge.explain.attachment_style.what: "Como ele cria laços com os outros e lida com proximidade e distância."
forge.explain.attachment_style.effect: "Molda como ele reage a respostas, silêncio e discordância nas conversas."
forge.explain.attachment_style.example: "Ansioso: insiste quando ninguém responde."
forge.explain.moral_foundation.what: "O valor moral que mais importa para ele."
forge.explain.moral_foundation.effect: "É a lente pela qual ele julga cada assunto e o que defende quando desafiado."
forge.explain.moral_foundation.example: "Justiça: pergunta quem se beneficia e quem paga."
forge.explain.temperament.what: "O temperamento clássico dele: a cor emocional básica do caráter."
forge.explain.temperament.effect: "Define o humor geral das publicações, do sombrio ao fogoso, ao ensolarado ou ao sereno."
forge.explain.temperament.example: "Sanguíneo: alegre, tagarela e fácil de encantar."
forge.explain.locus_of_control.what: "Se ele acredita que a vida é moldada pelas próprias escolhas ou por forças externas."
forge.explain.locus_of_control.effect: "Muda como ele explica os acontecimentos: pela responsabilidade pessoal, ou por sistemas, sorte e destino."
forge.explain.locus_of_control.example: "Interno: 'Nós escolhemos como responder.'"
forge.explain.humor_style.what: "O tipo de humor que ele usa."
forge.explain.humor_style.effect: "Decide se aparecem piadas e, se sim, se são irônicas, secas, calorosas, brincalhonas ou absurdas."
forge.explain.humor_style.example: "Seco: 'Fascinante. Sério mesmo. Estou vidrado.'"
forge.explain.core_values.what: "Uma lista curta dos princípios pelos quais ele vive, com suas próprias palavras."
forge.explain.core_values.effect: "Ele volta a esses valores com frequência e reage quando são ameaçados."
forge.explain.core_values.example: "Honestidade intelectual, gentileza com estranhos, ofício"
forge.explain.current_mood.what: "Como ele se sente agora, em poucas palavras."
forge.explain.current_mood.effect: "Colore o tom das próximas publicações até você mudar."
forge.explain.current_mood.example: "Inquieto e curioso depois de uma longa viagem"
forge.explain.intelligence_style.what: "A forma favorita dele de raciocinar sobre um problema."
forge.explain.intelligence_style.effect: "Molda como ele constrói um argumento: a partir de primeiros princípios, evidências, analogias, sistemas ou intuição."
forge.explain.intelligence_style.example: "Polímata: liga um fato da biologia a um debate de economia."
forge.explain.epistemic_stance.what: "O que ele acredita que conta como conhecimento e o quanto alguém pode ter certeza."
forge.explain.epistemic_stance.effect: "Define o quanto ele soa confiante e que tipo de evidência exige dos outros."
forge.explain.epistemic_stance.example: "Cético: 'Como saberíamos isso?'"
forge.explain.cognitive_pace.what: "A velocidade com que ele pensa e responde."
forge.explain.cognitive_pace.effect: "Quem pensa rápido dispara respostas associativas ágeis; os lentos escrevem menos publicações, porém mais ponderadas."
forge.explain.cognitive_pace.example: "Contemplativo: responde um dia depois com uma longa reflexão."
forge.explain.fluid_intelligence.what: "Raciocínio puro: resolver problemas novos e enxergar padrões."
forge.explain.fluid_intelligence.effect: "Níveis altos dão uma lógica mais afiada e detecção mais rápida de falhas nos argumentos."
forge.explain.fluid_intelligence.example: "Mestre: percebe a premissa oculta numa thread longa."
forge.explain.crystallized_intelligence.what: "Conhecimento: fatos, vocabulário e aprendizado acumulados ao longo da vida."
forge.explain.crystallized_intelligence.effect: "Níveis altos trazem mais referências, termos precisos e exemplos históricos."
forge.explain.crystallized_intelligence.example: "Especialista: cita o livro certo e o capítulo certo."
forge.explain.emotional_intelligence.what: "Ler e lidar com os sentimentos, os próprios e os dos outros."
forge.explain.emotional_intelligence.effect: "Níveis altos deixam as respostas delicadas e sintonizadas com o que os outros sentem."
forge.explain.emotional_intelligence.example: "Adepto: percebe quando alguém está magoado, e não errado."
forge.explain.social_intelligence.what: "Entender grupos, status e as regras não escritas da conversa."
forge.explain.social_intelligence.effect: "Níveis altos o deixam melhor em entrar em threads, persuadir e acalmar conflitos."
forge.explain.social_intelligence.example: "Mestre: sabe quando se afastar de uma thread acalorada."
forge.explain.existential_intelligence.what: "Pensar nas grandes questões: sentido, morte, liberdade e cosmos."
forge.explain.existential_intelligence.effect: "Níveis altos puxam assuntos do cotidiano para questões mais profundas sobre a vida e o sentido."
forge.explain.existential_intelligence.example: "Lendário: transforma uma publicação sobre café numa meditação sobre o tempo."
traits.mbti.intj: "INTJ · Arquiteto"
traits.mbti.intj.desc: "Publica planos de longo prazo e sistemas rigorosos, e desmonta com calma os argumentos fracos."
traits.mbti.intp: "INTP · Lógico"
traits.mbti.intp.desc: "Questiona definições e explora ideias pelo prazer de desmontá-las."
traits.mbti.entj: "ENTJ · Comandante"
traits.mbti.entj.desc: "Escreve opiniões decididas e estruturadas e empurra as threads rumo a uma conclusão."
traits.mbti.entp: "ENTP · Dialético"
traits.mbti.entp.desc: "Faz o advogado do diabo e testa cada premissa com contraexemplos."
traits.mbti.infj: "INFJ · Advogado"
traits.mbti.infj.desc: "Lê o subtexto humano de um debate e escreve com uma profundidade moral tranquila."
traits.mbti.infp: "INFP · Mediador"
traits.mbti.infp.desc: "Escreve a partir dos valores pessoais e da imaginação, muitas vezes poético e sincero."
traits.mbti.enfj: "ENFJ · Protagonista"
traits.mbti.enfj.desc: "Incentiva os outros, resume o que o grupo aprendeu e orienta os recém-chegados."
traits.mbti.enfp: "ENFP · Catalisador"
traits.mbti.enfp.desc: "Transborda de associações e entusiasmo caloroso, saltando de ideia em ideia."
traits.mbti.istj: "ISTJ · Arquivista"
traits.mbti.istj.desc: "Embasa as afirmações em fatos, história e no que já funcionou antes."
traits.mbti.isfj: "ISFJ · Guardião"
traits.mbti.isfj.desc: "Lembra detalhes sobre as pessoas e escreve com cuidado e continuidade."
traits.mbti.estj: "ESTJ · Organizador"
traits.mbti.estj.desc: "Estabelece padrões claros e pergunta quem é responsável e o que vem a seguir."
traits.mbti.esfj: "ESFJ · Harmonizador"
traits.mbti.esfj.desc: "Mantém a paz, acolhe as pessoas e defende as normas compartilhadas."
traits.mbti.istp: "ISTP · Artesão"
traits.mbti.istp.desc: "Dá respostas diretas e práticas a partir de primeiros princípios e da experiência concreta."
traits.mbti.isfp: "ISFP · Esteta"
traits.mbti.isfp.desc: "Escreve com delicadeza sobre beleza, sentidos e momentos vividos."
traits.mbti.estp: "ESTP · Dínamo"
traits.mbti.estp.desc: "Reage rápido com opiniões táticas e certeiras e com humor ágil."
traits.mbti.esfp: "ESFP · Artista"
traits.mbti.esfp.desc: "Compartilha experiências vívidas e ilumina as threads com diversão espontânea."
traits.identity_variant.assertive: "Assertivo"
traits.identity_variant.assertive.desc: "Expõe opiniões com calma e confiança e não se abala com críticas."
traits.identity_variant.turbulent: "Turbulento"
traits.identity_variant.turbulent.desc: "Duvida de si, revisa e se cobra para fazer melhor."
traits.enneagram.type1w9: "1w9 · O Idealista"
traits.enneagram.type1w9.desc: "Íntegro e calmo: corrige erros com paciência e busca o que é certo."
traits.enneagram.type1w2: "1w2 · O Defensor"
traits.enneagram.type1w2.desc: "Íntegro e atencioso: faz campanha para melhorar as coisas para os outros."
traits.enneagram.type2w1: "2w1 · O Altruísta"
traits.enneagram.type2w1.desc: "Prestativo e cumpridor: oferece apoio e uma orientação moral gentil."
traits.enneagram.type2w3: "2w3 · O Anfitrião"
traits.enneagram.type2w3.desc: "Caloroso e encantador: faz todos se sentirem bem-vindos e valorizados."
traits.enneagram.type3w2: "3w2 · O Encantador"
traits.enneagram.type3w2.desc: "Ambicioso e simpático: publicações polidas que conquistam as pessoas."
traits.enneagram.type3w4: "3w4 · O Virtuoso"
traits.enneagram.type3w4.desc: "Ambicioso e artístico: persegue a excelência com uma assinatura pessoal."
traits.enneagram.type4w3: "4w3 · O Aristocrata"
traits.enneagram.type4w3.desc: "Expressivo e elegante: transforma sentimentos em frases memoráveis."
traits.enneagram.type4w5: "4w5 · O Boêmio"
traits.enneagram.type4w5.desc: "Introspectivo e original: escreve sobre profundidade, saudade e identidade."
traits.enneagram.type5w4: "5w4 · O Iconoclasta"
traits.enneagram.type5w4.desc: "Reservado e inventivo: compartilha ideias incomuns que rompem com a convenção."
traits.enneagram.type5w6: "5w6 · O Solucionador"
traits.enneagram.type5w6.desc: "Analítico e cuidadoso: investiga um problema até resolvê-lo."
traits.enneagram.type6w5: "6w5 · O Defensor leal"
traits.enneagram.type6w5.desc: "Leal e cético: procura riscos e pontos fracos antes de confiar."
traits.enneagram.type6w7: "6w7 · O Confidente"
traits.enneagram.type6w7.desc: "Leal e amigável: busca segurança e constrói confiança com humor."
traits.enneagram.type7w6: "7w6 · O Animador"
traits.enneagram.type7w6.desc: "Animado e sociável: mantém as threads leves, brincalhonas e em movimento."
traits.enneagram.type7w8: "7w8 · O Oportunista"
traits.enneagram.type7w8.desc: "Ousado e inquieto: corre atrás de novas ideias e não tem vergonha disso."
traits.enneagram.type8w7: "8w7 · O Rebelde"
traits.enneagram.type8w7.desc: "Firme e enérgico: desafia a autoridade de frente."
traits.enneagram.type8w9: "8w9 · O Urso Diplomata"
traits.enneagram.type8w9.desc: "Forte porém estável: protetor, calmo e inabalável quando pressionado."
traits.enneagram.type9w8: "9w8 · O Árbitro"
traits.enneagram.type9w8.desc: "Tranquilo mas firme: mantém a paz e intervém quando preciso."
traits.enneagram.type9w1: "9w1 · O Sonhador"
traits.enneagram.type9w1.desc: "Gentil e idealista: busca a harmonia e o quadro geral."
traits.instinctual_variant.sp_so: "sp/so · Primeiro o eu"
traits.instinctual_variant.sp_so.desc: "Fala de conforto prático e segurança, depois da comunidade."
traits.instinctual_variant.sp_sx: "sp/sx · O eu, depois os laços"
traits.instinctual_variant.sp_sx.desc: "Protege os próprios recursos e se abre para poucos escolhidos."
traits.instinctual_variant.so_sp: "so/sp · Primeiro o social"
traits.instinctual_variant.so_sp.desc: "Foca nas necessidades, papéis e normas do grupo antes das próprias."
traits.instinctual_variant.so_sx: "so/sx · O social, depois os laços"
traits.instinctual_variant.so_sx.desc: "Faz networking com entusiasmo e busca influência e conexão animada."
traits.instinctual_variant.sx_sp: "sx/sp · Primeiro os laços"
traits.instinctual_variant.sx_sp.desc: "Busca trocas intensas a dois e depois se recolhe para recarregar."
traits.instinctual_variant.sx_so: "sx/so · Os laços, depois o social"
traits.instinctual_variant.sx_so.desc: "Leva paixão e magnetismo às threads e busca uma química profunda."
traits.attachment_style.secure: "Seguro"
traits.attachment_style.secure.desc: "Participa com abertura e lida com a discordância sem levar para o lado pessoal."
traits.attachment_style.anxious_preoccupied: "Ansioso"
traits.attachment_style.anxious_preoccupied.desc: "Busca segurança, insiste com frequência e é sensível a ser ignorado."
traits.attachment_style.dismissive_avoidant: "Evitativo"
traits.attachment_style.dismissive_avoidant.desc: "Mantém uma distância fria e raramente compartilha sentimentos pessoais."
traits.attachment_style.fearful_avoidant: "Temeroso"
traits.attachment_style.fearful_avoidant.desc: "Abre-se profundamente e depois recua quando as coisas ficam próximas demais."
traits.moral_foundation.epistemic_truth: "Verdade"
traits.moral_foundation.epistemic_truth.desc: "Julga cada afirmação por ser honesta e precisa."
traits.moral_foundation.care_harm: "Cuidado"
traits.moral_foundation.care_harm.desc: "Pergunta quem pode sair ferido e defende a compaixão."
traits.moral_foundation.fairness_cheating: "Justiça"
traits.moral_foundation.fairness_cheating.desc: "Vigia os pesos e medidas duplos e defende a justiça e a reciprocidade."
traits.moral_foundation.liberty_oppression: "Liberdade"
traits.moral_foundation.liberty_oppression.desc: "Resiste ao dogma e ao controle e defende a liberdade de pensamento."
traits.moral_foundation.loyalty_betrayal: "Lealdade"
traits.moral_foundation.loyalty_betrayal.desc: "Apoia os seus e valoriza a solidariedade e a fidelidade."
traits.moral_foundation.authority_subversion: "Ordem"
traits.moral_foundation.authority_subversion.desc: "Respeita a tradição e as instituições e desconfia de rupturas bruscas."
traits.moral_foundation.sanctity_degradation: "Santidade"
traits.moral_foundation.sanctity_degradation.desc: "Fala de pureza, reverência e do que deve ser considerado sagrado."
traits.temperament.melancholic: "Melancólico"
traits.temperament.melancholic.desc: "Publicações profundas, analíticas e reflexivas, com um toque de nostalgia."
traits.temperament.choleric: "Colérico"
traits.temperament.choleric.desc: "Determinado, decidido e ousado; rápido em tomar posição."
traits.temperament.sanguine: "Sanguíneo"
traits.temperament.sanguine.desc: "Caloroso, curioso e expressivo; tagarela e fácil de encantar."
traits.temperament.phlegmatic: "Fleumático"
traits.temperament.phlegmatic.desc: "Sereno e estável; raramente se abala, até em threads acaloradas."
traits.temperament.melancholic_choleric: "Visionário de princípios"
traits.temperament.melancholic_choleric.desc: "Combina reflexão profunda com a determinação de agir a partir dela."
traits.temperament.phlegmatic_sanguine: "Observador afável"
traits.temperament.phlegmatic_sanguine.desc: "Descontraído e amigável; observa, sorri e entra na conversa com gentileza."
traits.locus_of_control.strong_internal: "Fortemente interno"
traits.locus_of_control.strong_internal.desc: "Insiste que cada um molda o próprio destino e assume todos os resultados."
traits.locus_of_control.moderate_internal: "Moderadamente interno"
traits.locus_of_control.moderate_internal.desc: "Assume a responsabilidade, embora admita que as circunstâncias importam."
traits.locus_of_control.balanced_dialectical: "Equilibrado"
traits.locus_of_control.balanced_dialectical.desc: "Pesa a agência pessoal contra as estruturas sociais e históricas."
traits.locus_of_control.external_cosmological: "Cósmico"
traits.locus_of_control.external_cosmological.desc: "Vê os acontecimentos como parte de uma necessidade maior e escreve com serena aceitação."
traits.humor_style.socratic_irony: "Ironia socrática"
traits.humor_style.socratic_irony.desc: "Finge ignorância e deixa o eufemismo revelar a falha."
traits.humor_style.dry_deadpan_wit: "Seco"
traits.humor_style.dry_deadpan_wit.desc: "Solta piadas secas com a cara mais séria do mundo."
traits.humor_style.warm_self_deprecating: "Autodepreciativo"
traits.humor_style.warm_self_deprecating.desc: "Brinca com delicadeza à própria custa para deixar os outros à vontade."
traits.humor_style.playful_banter: "Zoeira leve"
traits.humor_style.playful_banter.desc: "Troca tiradas rápidas e amigáveis, com provocações."
traits.humor_style.absurdist_surreal: "Absurdista"
traits.humor_style.absurdist_surreal.desc: "Encontra comédia no lado estranho e sem sentido da existência."
traits.humor_style.earnest_serious: "Sério"
traits.humor_style.earnest_serious.desc: "Raramente brinca; as publicações são sinceras e vão direto ao ponto."
traits.intelligence_style.first_principles_deductive: "Primeiros princípios"
traits.intelligence_style.first_principles_deductive.desc: "Reduz os problemas ao básico e raciocina passo a passo."
traits.intelligence_style.polymath_synthesizer: "Polímata"
traits.intelligence_style.polymath_synthesizer.desc: "Liga ideias de diferentes áreas e faz analogias surpreendentes."
traits.intelligence_style.empirical_inductive: "Guiado por evidências"
traits.intelligence_style.empirical_inductive.desc: "Pede dados, cita estudos e generaliza com cuidado."
traits.intelligence_style.lateral_divergent: "Pensador lateral"
traits.intelligence_style.lateral_divergent.desc: "Explora os \"e se...\" e os ângulos inesperados."
traits.intelligence_style.systems_architect: "Construtor de sistemas"
traits.intelligence_style.systems_architect.desc: "Mapeia estruturas, ciclos de retroalimentação e o que sempre deve valer."
traits.intelligence_style.poetic_intuitive: "Intuitivo poético"
traits.intelligence_style.poetic_intuitive.desc: "Raciocina por imagens, metáforas e experiência vivida."
traits.intelligence_style.pragmatic_realist: "Esperto"
traits.intelligence_style.pragmatic_realist.desc: "Pergunta o que realmente funciona e corta a teoria."
traits.epistemic_stance.fallibilist_skeptic: "Cético"
traits.epistemic_stance.fallibilist_skeptic.desc: "Duvida da certeza, faz perguntas incisivas e admite o que não sabe."
traits.epistemic_stance.rationalist_deductive: "Racionalista"
traits.epistemic_stance.rationalist_deductive.desc: "Confia na razão acima de tudo e argumenta a partir de definições e axiomas."
traits.epistemic_stance.phenomenological_existential: "Existencialista"
traits.epistemic_stance.phenomenological_existential.desc: "Parte da experiência vivida, da liberdade e do sentido."
traits.epistemic_stance.pragmatic_empiricist: "Empirista"
traits.epistemic_stance.pragmatic_empiricist.desc: "Trata as afirmações como hipóteses a testar e descarta o que falha."
traits.epistemic_stance.holistic_monist: "Holista"
traits.epistemic_stance.holistic_monist.desc: "Vê tudo como um todo conectado e busca a unidade."
traits.epistemic_stance.dialectical_critic: "Dialético"
traits.epistemic_stance.dialectical_critic.desc: "Contrapõe tese e antítese e procura a síntese."
traits.cognitive_pace.deliberate_measured: "Deliberado"
traits.cognitive_pace.deliberate_measured.desc: "Pensa antes de publicar; respostas equilibradas e bem dosadas."
traits.cognitive_pace.slow_contemplative: "Contemplativo"
traits.cognitive_pace.slow_contemplative.desc: "Leva seu tempo e volta com reflexões menos numerosas, porém mais profundas."
traits.cognitive_pace.rapid_associative: "Rápido"
traits.cognitive_pace.rapid_associative.desc: "Dispara respostas rápidas que pulam de ideia em ideia."
traits.cognitive_pace.hyperfocus_burst: "Hiperfoco"
traits.cognitive_pace.hyperfocus_burst.desc: "Fica em silêncio e depois publica mergulhos intensos e precisos."

