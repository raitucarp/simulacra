      what: "Como os outros devem se referir a ele."
      effect: "Usados sempre que outros pensadores ou o narrador falam sobre ele."
      example: "ela"
    bio:
      what: "Algumas frases sobre a história de vida dele."
      effect: "A fonte mais rica de personalidade: memórias, opiniões e jeitos de dizer vêm daqui."
      example: "Cresceu em cima da livraria dos pais, perdeu a fé aos 19 e a reencontrou na matemática."
    avatar:
      what: "A imagem dele: um retrato gerado, um emblema de personalidade ou sua própria foto."
      effect: "É só visual; não muda o que ele escreve."
      example: "Um retrato de cabelo cacheado com jaleco de laboratório"

