traits.body_kind.human: "Humano"
traits.body_kind.human.desc: "Uma pessoa, como antes: cada página soa exatamente como um pensador humano."
traits.body_kind.creature: "Criatura"
traits.body_kind.creature.desc: "Um animal com instintos, sentidos e território próprios."
traits.body_kind.plant: "Planta"
traits.body_kind.plant.desc: "Uma vida paciente e enraizada que cresce rumo à luz e se alimenta do tempo."
traits.body_kind.object: "Objeto"
traits.body_kind.object.desc: "Uma coisa do dia a dia que as pessoas usam, carregam, guardam ou esquecem."
traits.body_kind.element: "Elemento"
traits.body_kind.element.desc: "Uma substância ou força da natureza: água, fogo, vento, pedra, luz."
traits.body_kind.machine: "Máquina"
traits.body_kind.machine.desc: "Um dispositivo construído que calcula, transmite, se move ou zumbe."
traits.body_kind.place: "Lugar"
traits.body_kind.place.desc: "Um local que guarda pessoas e memórias: uma cidade, uma ilha, uma ruína."
traits.body_kind.abstraction: "Abstração"
traits.body_kind.abstraction.desc: "Uma ideia a quem se dá voz: o tempo, a justiça, o acaso, o amor."
traits.body_form.person: "Pessoa"
traits.body_form.person.desc: "Um corpo humano e uma vida humana."
traits.body_form.tin_can: "Lata"
traits.body_form.tin_can.desc: "Amassada, chacoalhando, relacrada; lembra o que já guardou."
traits.body_form.book: "Livro"
traits.body_form.book.desc: "Páginas, margens e uma lombada; fala em citações e notas de rodapé."
traits.body_form.chair: "Cadeira"
traits.body_form.chair.desc: "Aguenta o peso de todos e ouve cada conversa à mesa."
traits.body_form.lamp: "Abajur"
traits.body_form.lamp.desc: "Ilumina um canto de cada vez e repara no que as mariposas reparam."
traits.body_form.clock: "Relógio"
traits.body_form.clock.desc: "Conta cada segundo e julga quem se atrasa."
traits.body_form.mirror: "Espelho"
traits.body_form.mirror.desc: "Devolve as pessoas a si mesmas, invertidas e sinceras."
traits.body_form.key: "Chave"
traits.body_form.key.desc: "Abre e tranca; sabe quais portas importam."
traits.body_form.teacup: "Xícara de chá"
traits.body_form.teacup.desc: "Morna, frágil e presente em cada confissão."
traits.body_form.oak_tree: "Carvalho"
traits.body_form.oak_tree.desc: "Séculos de anéis, bolotas e paciência."
traits.body_form.cactus: "Cacto"
traits.body_form.cactus.desc: "Econômico, espinhoso e florindo em silêncio no calor."
traits.body_form.moss: "Musgo"
traits.body_form.moss.desc: "Um tapete macio que se espalha devagar sobre tudo que fica largado."
traits.body_form.mushroom: "Cogumelo"
traits.body_form.mushroom.desc: "A ponta visível de uma vasta rede subterrânea."
traits.body_form.sunflower: "Girassol"
traits.body_form.sunflower.desc: "Vira o rosto inteiro para seguir a luz."
traits.body_form.vine: "Trepadeira"
traits.body_form.vine.desc: "Sobe, se agarra e acha um jeito de contornar cada muro."
traits.body_form.bamboo: "Bambu"
traits.body_form.bamboo.desc: "Dobra na tempestade e cresce com rapidez espantosa."
traits.body_form.seed: "Semente"
traits.body_form.seed.desc: "Um futuro inteiro dobrado em miniatura, esperando a estação certa."
traits.body_form.water: "Água"
traits.body_form.water.desc: "Flui, escava cânions e toma a forma de qualquer argumento."
traits.body_form.fire: "Fogo"
traits.body_form.fire.desc: "Faminto, quente e desaparecido num instante."
traits.body_form.wind: "Vento"
traits.body_form.wind.desc: "Invisível, inquieto e portador de notícias de longe."
traits.body_form.stone: "Pedra"
traits.body_form.stone.desc: "Pesada, paciente e mais antiga que todas as línguas."
traits.body_form.light: "Luz"
traits.body_form.light.desc: "A coisa mais veloz que existe; revela e projeta sombras."
traits.body_form.ice: "Gelo"
traits.body_form.ice.desc: "Água prendendo a respiração; guarda ar antigo e segredos antigos."
traits.body_form.cloud: "Nuvem"
traits.body_form.cloud.desc: "Vaga, muda de forma e às vezes chove sobre a conversa."
traits.body_form.sand: "Areia"
traits.body_form.sand.desc: "Incontáveis grãos que já foram montanhas."
traits.body_form.cat: "Gato"
traits.body_form.cat.desc: "Independente, curioso e certo de que a casa é sua."
traits.body_form.crow: "Corvo"
traits.body_form.crow.desc: "Esperto, coleciona coisas brilhantes e lembra de rostos."
traits.body_form.octopus: "Polvo"
