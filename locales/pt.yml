arena.preset.trolley.title: "O dilema do bonde"
arena.preset.trolley.premise: "Um bonde desgovernado vai matar cinco pessoas nos trilhos se não for desviado. Desviá-lo vai matar outra pessoa."
arena.preset.trolley.question: "Você deveria desviar o bonde?"
arena.preset.trolley.v1: "Como você o desvia"
arena.preset.trolley.v1_values: "puxar uma alavanca | empurrar uma pessoa nos trilhos"
arena.preset.trolley.v2: "A outra pessoa"
arena.preset.trolley.v2_values: "um desconhecido | alguém que você ama"
arena.preset.marys_room.title: "O quarto de Mary"
arena.preset.marys_room.premise: "Mary é uma cientista que conhece a física e a biologia da visão das cores, mas viveu a vida inteira em um quarto preto e branco. Um dia ela sai e vê o vermelho pela primeira vez."
arena.preset.marys_room.question: "Mary aprende algo novo?"
arena.preset.marys_room.v1: "O que ela sabia"
arena.preset.marys_room.v1_values: "todos os fatos físicos | a maioria dos fatos, com lacunas"
arena.preset.marys_room.v2: "O que ela vê primeiro"
arena.preset.marys_room.v2_values: "um tomate maduro | um simples quadrado vermelho"
arena.preset.ship_of_theseus.title: "O navio de Teseu"
arena.preset.ship_of_theseus.premise: "As tábuas de um navio são trocadas uma a uma até não restar nenhuma original."
arena.preset.ship_of_theseus.question: "Ainda é o mesmo navio?"
arena.preset.ship_of_theseus.v1: "Ritmo da troca"
arena.preset.ship_of_theseus.v1_values: "ao longo de muitos anos | em uma semana"
arena.preset.ship_of_theseus.v2: "As tábuas antigas"
arena.preset.ship_of_theseus.v2_values: "ficam guardadas | são usadas para montar um segundo navio"
arena.preset.experience_machine.title: "A máquina de experiências"
arena.preset.experience_machine.premise: "Uma máquina pode lhe dar as experiências que você escolher pelo resto da vida. Enquanto estiver conectado, você acreditará que são reais."
arena.preset.experience_machine.question: "Você deveria se conectar para sempre?"
arena.preset.experience_machine.v1: "Sua vida agora"
arena.preset.experience_machine.v1_values: "feliz e segura | cheia de dificuldades"
arena.preset.experience_machine.v2: "Pessoas que dependem de você"
arena.preset.experience_machine.v2_values: "ninguém | uma família"
arena.preset.veil_of_ignorance.title: "O véu da ignorância"
arena.preset.veil_of_ignorance.premise: "Você escolhe as regras de divisão da riqueza de uma sociedade sem saber quem será nela: seus talentos, sua saúde ou sua família."
arena.preset.veil_of_ignorance.question: "Você escolheria regras que garantem um mínimo digno aos que estão em pior situação, mesmo que isso baixe a média?"
arena.preset.veil_of_ignorance.v1: "Quanto custa o mínimo"
arena.preset.veil_of_ignorance.v1_values: "um pouco da média | muito da média"
arena.preset.veil_of_ignorance.v2: "Sua atitude diante do risco"
arena.preset.veil_of_ignorance.v2_values: "cauteloso | disposto a arriscar"
arena.preset.chinese_room.title: "O quarto chinês"
arena.preset.chinese_room.premise: "Alguém que não sabe chinês está em um quarto com um livro de regras para responder mensagens escritas em chinês. Do lado de fora, ninguém distingue as respostas das de um falante nativo."
arena.preset.chinese_room.question: "Algo no quarto entende chinês?"
arena.preset.chinese_room.v1: "Quem segue as regras"
arena.preset.chinese_room.v1_values: "uma pessoa com um livro de regras | um computador executando um programa"
arena.preset.chinese_room.v2: "Sua ligação com o mundo"
arena.preset.chinese_room.v2_values: "só mensagens | um corpo de robô com câmeras"
arena.preset.newcomb.title: "O problema de Newcomb"
arena.preset.newcomb.premise: "Um previsor coloca 1.000 em uma caixa transparente e 1.000.000 em uma caixa opaca apenas se previu que você pegaria só a opaca. Você pode pegar as duas caixas ou só a opaca."
arena.preset.newcomb.question: "Você deveria pegar só a caixa opaca?"
arena.preset.newcomb.v1: "O histórico do previsor"
arena.preset.newcomb.v1_values: "nunca errou até agora | acerta nove em cada dez vezes"
arena.preset.newcomb.v2: "Quando ele previu"
arena.preset.newcomb.v2_values: "há um minuto | há um ano"
arena.preset.original_position.title: "A posição original"
arena.preset.original_position.premise: "Representantes de pessoas livres e iguais concordam com princípios de justiça sem saber de quem serão os interesses que vão representar."
arena.preset.original_position.question: "As liberdades básicas devem vir antes dos ganhos econômicos?"
arena.preset.original_position.v1: "A riqueza da sociedade"
arena.preset.original_position.v1_values: "escassa | abundante"
arena.preset.original_position.v2: "O ganho em jogo"
arena.preset.original_position.v2_values: "pequeno | grande"
