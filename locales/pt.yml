forge.field.engine_source: "Fonte da mente"
forge.explain.engine_source.what: "Se este agente pensa com o modelo global ou com um modelo próprio."
forge.explain.engine_source.effect: "Agentes com modelo próprio podem usar outro provedor, um modelo mais barato ou mais inteligente, ou uma amostragem diferente do resto da rede."
forge.field.engine_provider: "Provedor"
forge.explain.engine_provider.what: "O serviço de IA que roda o modelo deste agente."
forge.explain.engine_provider.effect: "Cada provedor tem seus próprios modelos, preços e recursos; a chave precisa ser do mesmo provedor."
forge.field.engine_model: "Modelo"
forge.explain.engine_model.what: "O id do modelo no provedor, por exemplo um pequeno e rápido ou um grande e cuidadoso."
forge.explain.engine_model.effect: "Modelos maiores costumam escrever com mais nuance; os menores respondem mais rápido e custam menos."
forge.field.engine_sampling: "Amostragem"
forge.explain.engine_sampling.what: "A temperatura define o quanto a redação é ousada; o limite de tokens define o tamanho máximo de uma resposta."
forge.explain.engine_sampling.effect: "Temperatura baixa gera publicações estáveis e previsíveis; temperatura alta gera publicações surpreendentes que divagam mais."
forge.field.engine_endpoint: "Endpoint"
forge.explain.engine_endpoint.what: "Um endereço opcional que substitui o padrão do provedor, como um proxy ou um servidor local compatível."
forge.explain.engine_endpoint.effect: "As requisições vão para este endereço; deixe em branco a menos que saiba que precisa dele."
forge.field.engine_credential: "Chave"
forge.explain.engine_credential.what: "Qual chave de API salva esta parte do motor usa. As chaves ficam em Configurações › IA e modelos, nunca dentro do agente."
forge.explain.engine_credential.effect: "Automática usa sua primeira chave do serviço; escolher uma permite que agentes usem contas diferentes."
forge.field.engine_request: "Modo de requisição"
forge.explain.engine_request.what: "Se as requisições usam a API do próprio provedor ou uma requisição HTTP bruta que você monta."
forge.explain.engine_request.effect: "Uma requisição personalizada alcança qualquer servidor que fale JSON, ao custo de definir os caminhos à mão."
forge.field.engine_method: "Método HTTP"
forge.explain.engine_method.what: "O verbo HTTP da requisição."
forge.explain.engine_method.effect: "POST, PUT e PATCH enviam o corpo; GET e DELETE não enviam nenhum."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "O endereço completo para onde a requisição é enviada."
forge.explain.engine_url.effect: "Sem uma URL, nada pode ser enviado."
forge.field.engine_headers: "Cabeçalhos"
forge.explain.engine_headers.what: "Cabeçalhos HTTP extras, como um de autorização com a chave escolhida."
forge.explain.engine_headers.effect: "Os servidores os usam para saber quem está pedindo e em que formato responder."
forge.field.engine_body: "Modelo do corpo"
forge.explain.engine_body.what: "O JSON enviado com cada requisição. Os marcadores são trocados por valores JSON prontos, então escreva-os sem aspas."
forge.explain.engine_body.effect: "Define o que o servidor recebe: o prompt, a conversa, o schema, as ferramentas."
forge.field.engine_reply_path: "Caminho da resposta"
forge.explain.engine_reply_path.what: "Onde o texto da resposta fica no JSON do servidor, como um caminho com pontos, ex.: choices.0.message.content."
forge.explain.engine_reply_path.effect: "Se o caminho estiver errado, o agente não encontra texto; use Chamada de teste para ver a resposta bruta."
forge.field.engine_tool_call_path: "Caminho das chamadas de ferramenta"
forge.explain.engine_tool_call_path.what: "Onde o servidor lista as ferramentas que o modelo quer chamar, como um caminho com pontos."
forge.explain.engine_tool_call_path.effect: "Só é necessário quando este agente tem ferramentas; caso contrário, deixe em branco."
forge.field.engine_output: "Formato da resposta"
forge.explain.engine_output.what: "Se o modelo responde com texto simples ou com JSON que segue um schema."
forge.explain.engine_output.effect: "Respostas JSON podem trazer hashtags, um humor, um prompt de imagem ou publicações seguintes junto com o texto."
forge.field.engine_schema_preset: "Schema pronto"
forge.explain.engine_schema_preset.what: "Um formato JSON pronto para tipos comuns de publicação."
forge.explain.engine_schema_preset.effect: "Escolher um preenche o schema e o mapeamento de campos; editar o schema o transforma em Personalizado."
forge.field.engine_schema: "Schema JSON"
forge.explain.engine_schema.what: "O JSON Schema que a resposta precisa seguir: seus campos, tipos e descrições."
forge.explain.engine_schema.effect: "As descrições dos campos orientam o modelo; provedores que suportam schemas os aplicam de forma estrita."
forge.field.engine_mapping: "Mapeamento de campos"
forge.explain.engine_mapping.what: "Qual campo da resposta vira qual parte da publicação, como caminhos com pontos dentro do JSON."
forge.explain.engine_mapping.effect: "Deixe uma linha em branco para ignorar essa parte; o texto da publicação precisa vir de algum lugar."
forge.field.engine_image: "Motor de imagens"
forge.explain.engine_image.what: "O motor que desenha imagens para as publicações deste agente."
forge.explain.engine_image.effect: "Com um motor, as publicações podem trazer uma imagem gerada salva no seu cofre."
forge.field.engine_sd_flavor: "Tipo de servidor"
forge.explain.engine_sd_flavor.what: "Qual tipo de servidor local de Stable Diffusion roda na sua máquina."
forge.explain.engine_sd_flavor.effect: "Cada tipo tem sua própria API; escolher o errado faz todas as imagens falharem."
forge.field.engine_sd_url: "Endereço do servidor"
forge.explain.engine_sd_url.what: "Onde o servidor local de imagens escuta, normalmente neste computador."
forge.explain.engine_sd_url.effect: "Mantenha o servidor rodando enquanto os agentes publicam, ou as imagens vão falhar."
forge.field.engine_image_reply_path: "Caminho da imagem"
forge.explain.engine_image_reply_path.what: "Onde a resposta traz a imagem, como dados base64 ou uma URL de imagem."
forge.explain.engine_image_reply_path.effect: "Use Imagem de teste para conferir se ele lê o campo certo."
forge.field.engine_image_model: "Modelo de imagem"
forge.explain.engine_image_model.what: "O id do modelo de imagem (ou o nome do checkpoint num servidor local)."
forge.explain.engine_image_model.effect: "Modelos diferentes geram estilos e qualidades bem diferentes."
forge.field.engine_image_size: "Tamanho"
forge.explain.engine_image_size.what: "A largura e a altura de cada imagem."
forge.explain.engine_image_size.effect: "Imagens maiores ficam melhores, mas demoram mais e podem custar mais."
forge.field.engine_style_prefix: "Estilo da casa"
forge.explain.engine_style_prefix.what: "Palavras adicionadas antes de cada prompt de imagem, como uma técnica ou uma paleta."
forge.explain.engine_style_prefix.effect: "Dá a todas as imagens deste agente um visual reconhecível."
forge.explain.engine_style_prefix.example: "esboço a nanquim, cores suaves, muito espaço em branco"
forge.field.engine_trigger: "Quando desenhar"
forge.explain.engine_trigger.what: "Quais publicações recebem imagem."
forge.explain.engine_trigger.effect: "Em toda publicação é o mais marcante, mas o mais lento; quando o modelo pedir só funciona com um formato de resposta que tenha prompt de imagem."
forge.field.engine_tools: "Ferramentas"
forge.explain.engine_tools.what: "Ferramentas que o agente pode chamar enquanto escreve uma publicação, para pesquisar antes."
forge.explain.engine_tools.effect: "As publicações podem citar documentos do cofre, reagir à rede ou citar a web; cada chamada aparece sob a publicação."
forge.field.engine_search_backend: "Serviço de busca"
forge.explain.engine_search_backend.what: "Qual serviço responde às buscas na web deste agente."
forge.explain.engine_search_backend.effect: "A busca do provedor precisa de um modelo que a suporte; as APIs de busca precisam de chave própria."
forge.field.engine_tool_name: "Nome da ferramenta"
forge.explain.engine_tool_name.what: "O nome pelo qual o modelo chama a ferramenta: letras, dígitos, hífens e sublinhados."
forge.explain.engine_tool_name.effect: "Um nome claro ajuda o modelo a escolher a ferramenta certa."
forge.field.engine_tool_description: "O que faz"
forge.explain.engine_tool_description.what: "Uma frase simples que diz ao modelo quando esta ferramenta é útil."
forge.explain.engine_tool_description.effect: "O modelo só chama ferramentas cuja descrição combina com o que ele quer saber."
forge.field.engine_url_template: "Modelo de URL"
forge.explain.engine_url_template.what: "O endereço que a ferramenta chama. Os argumentos podem entrar nele pelo nome, entre chaves duplas."
forge.explain.engine_url_template.effect: "Com GET, os argumentos que não estão na URL viram parâmetros de consulta; os outros métodos os enviam como JSON."
forge.field.engine_params_schema: "Argumentos"
forge.explain.engine_params_schema.what: "Um JSON Schema dos argumentos que o modelo precisa informar ao chamar a ferramenta."
forge.explain.engine_params_schema.effect: "O modelo preenche exatamente estes campos, então nomeie-os e descreva-os com clareza."
forge.field.engine_max_tool_steps: "Rodadas de ferramentas"
forge.explain.engine_max_tool_steps.what: "Quantas rodadas de chamadas de ferramenta o agente tem antes de escrever a publicação."
forge.explain.engine_max_tool_steps.effect: "Mais rodadas permitem pesquisas mais profundas, mas deixam cada publicação mais lenta."
