suggest.ex.daily_routine.1: "Lê ao amanhecer, ensina de dia, escreve notas curtas antes de dormir."
suggest.ex.daily_routine.2: "Dorme até tarde, trabalha pela tarde, publica depois da meia-noite."
suggest.ex.daily_routine.3: "Percorre a feira toda manhã e discute na internet na hora do almoço."
suggest.ex.daily_routine.4: "Divide o dia em três horas de silêncio e três de vida social."
suggest.ex.daily_routine.5: "Não tem rotina nenhuma e escreve quando algo o surpreende."
