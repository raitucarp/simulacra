arena.preset.ship_of_theseus.v2_values: "лежат на складе | собраны во второй корабль"
arena.preset.experience_machine.title: "Машина опыта"
arena.preset.experience_machine.premise: "Машина может до конца жизни дарить вам любые переживания по вашему выбору. Пока вы подключены, вы считаете их реальными."
arena.preset.experience_machine.question: "Стоит ли подключиться навсегда?"
arena.preset.experience_machine.v1: "Ваша жизнь сейчас"
arena.preset.experience_machine.v1_values: "счастливая и надёжная | полная лишений"
