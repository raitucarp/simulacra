arena.preset.marys_room.v2_values: "спелый помидор | простой красный квадрат"
arena.preset.ship_of_theseus.title: "Корабль Тесея"
arena.preset.ship_of_theseus.premise: "Доски корабля заменяют одну за другой, пока не остаётся ни одной исходной."
