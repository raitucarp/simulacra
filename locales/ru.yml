forge.ui.embodiment.body_title: "Тело и чувства"
forge.ui.embodiment.stance_title: "Отношение к людям"
forge.ui.embodiment.roll: "Выпало существо"
forge.ui.embodiment.roll_hint: "Любой вид, любая форма, с цельным телом."
