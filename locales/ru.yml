# p7 ontology
# Flat ontology (Embodiment step), rhetoric (Rhetoric step), active weekdays (flat keys).
forge.step.embodiment.label: "Воплощение"
forge.step.embodiment.tagline: "Человек, зверь, консервная банка или река: что это за существо?"
forge.step.embodiment.tip: "Здесь может писать что угодно. Выберите вид, затем форму; банка или дуб сохраняет разум, голос и привычки, которые вы зададите на других страницах."
forge.step.rhetoric.label: "Риторика"
forge.step.rhetoric.tagline: "Как они убеждают, какие фигуры любят и какую форму принимают их посты."
forge.step.rhetoric.tip: "Голос определяет, как они звучат; риторика определяет, как они строят аргумент. Выберите приём убеждения, несколько фигур и формат поста, затем добавьте словари, которые они заимствуют."
forge.field.body_kind: "Вид существа"
forge.field.form: "Форма"
forge.field.material: "Материал"
forge.field.scale: "Масштаб"
forge.field.temporality: "Масштаб времени"
