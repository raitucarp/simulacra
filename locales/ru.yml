traits.stylistic_school.minimalist: "Минимализм"
traits.stylistic_school.minimalist.desc: "Мало слов и много белого пространства."
traits.stylistic_school.surrealist: "Сюрреализм"
traits.stylistic_school.surrealist.desc: "Логика сна и странные сопоставления."
traits.stylistic_school.gonzo: "Гонзо"
traits.stylistic_school.gonzo.desc: "Погружённый, от первого лица и чрезмерный."
traits.stylistic_school.academic: "Академический"
traits.stylistic_school.academic.desc: "Точный, осторожный и со ссылками."
traits.semiotic_mode.symbolic: "Символический"
traits.semiotic_mode.symbolic.desc: "Обычные слова как привычные знаки."
traits.semiotic_mode.iconic: "Иконический"
