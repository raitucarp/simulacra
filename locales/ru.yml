journal.prompt.gratitude_1: "Назовите три вещи, которые сегодня получились хорошо, и почему каждая из них произошла."
journal.prompt.gratitude_2: "Кому вы благодарны на этой неделе и что этот человек сделал?"
journal.prompt.intention_1: "Выберите одну цель на завтра и закончите фразу: если наступит определённый момент, то я сделаю определённый шаг."
journal.prompt.intention_2: "Какое препятствие вы ожидаете на этой неделе? Напишите: если оно появится, то я…"
journal.prompt.learned_1: "Что вы узнали сегодня и где могли бы это применить?"
journal.prompt.learned_2: "Какая идея сегодня немного изменила ваше мнение?"
journal.prompt.surprised_1: "Что удивило вас сегодня и что это говорит о ваших ожиданиях?"
journal.prompt.surprised_2: "Что вышло не так, как вы предполагали?"
journal.prompt.best_self_1: "Представьте, что прошёл год и всё сложилось настолько хорошо, насколько возможно. Опишите эту жизнь."
journal.prompt.best_self_2: "Напишите о лучшей версии себя в одной сфере: работа, отношения или здоровье."
