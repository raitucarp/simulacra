arena.preset.newcomb.title: "Парадокс Ньюкома"
arena.preset.newcomb.premise: "Предсказатель кладёт 1000 в прозрачную коробку, а 1 000 000 в непрозрачную — только если предсказал, что вы возьмёте одну непрозрачную. Можно взять обе коробки или только непрозрачную."
arena.preset.newcomb.question: "Стоит ли брать только непрозрачную коробку?"
arena.preset.newcomb.v1: "Репутация предсказателя"
arena.preset.newcomb.v1_values: "пока ни разу не ошибся | прав девять раз из десяти"
