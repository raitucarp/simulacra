traits.body_kind.human: "Человек"
traits.body_kind.human.desc: "Человек, как прежде: каждая страница читается как у человека-мыслителя."
traits.body_kind.creature: "Зверь"
traits.body_kind.creature.desc: "Животное со своими инстинктами, чувствами и территорией."
traits.body_kind.plant: "Растение"
traits.body_kind.plant.desc: "Укоренённая, терпеливая жизнь, тянущаяся к свету и питающаяся временем."
traits.body_kind.object: "Предмет"
traits.body_kind.object.desc: "Обычная вещь, которую люди используют, носят, хранят или забывают."
traits.body_kind.element: "Стихия"
traits.body_kind.element.desc: "Вещество или сила природы: вода, огонь, ветер, камень, свет."
traits.body_kind.machine: "Машина"
traits.body_kind.machine.desc: "Построенное устройство, которое считает, передаёт, движется или гудит."
traits.body_kind.place: "Место"
traits.body_kind.place.desc: "Место, хранящее людей и воспоминания: город, остров, руины."
traits.body_kind.abstraction: "Абстракция"
traits.body_kind.abstraction.desc: "Идея, которой дали голос: время, справедливость, случай, любовь."
traits.body_form.person: "Человек"
traits.body_form.person.desc: "Человеческое тело и человеческая жизнь."
traits.body_form.tin_can: "Консервная банка"
traits.body_form.tin_can.desc: "Помятая, гремящая, закрытая заново; помнит, что в ней когда-то лежало."
traits.body_form.book: "Книга"
traits.body_form.book.desc: "Страницы, поля и корешок; говорит цитатами и сносками."
traits.body_form.chair: "Стул"
traits.body_form.chair.desc: "Выдерживает вес каждого и слышит каждый разговор за столом."
traits.body_form.lamp: "Лампа"
traits.body_form.lamp.desc: "Освещает по одному углу и замечает то, что замечают мотыльки."
traits.body_form.clock: "Часы"
traits.body_form.clock.desc: "Считают каждую секунду и осуждают каждого, кто опоздал."
traits.body_form.mirror: "Зеркало"
traits.body_form.mirror.desc: "Возвращает людям их самих, зеркально и честно."
traits.body_form.key: "Ключ"
traits.body_form.key.desc: "Открывает и запирает; знает, какие двери важны."
traits.body_form.teacup: "Чашка"
traits.body_form.teacup.desc: "Тёплая, хрупкая и присутствует при каждой исповеди."
traits.body_form.oak_tree: "Дуб"
traits.body_form.oak_tree.desc: "Века колец, желудей и терпения."
traits.body_form.cactus: "Кактус"
traits.body_form.cactus.desc: "Бережливый, колючий и тихо цветущий в жару."
traits.body_form.moss: "Мох"
traits.body_form.moss.desc: "Мягкий ковёр, медленно расползающийся по всему, что оставили в покое."
traits.body_form.mushroom: "Гриб"
traits.body_form.mushroom.desc: "Видимая верхушка огромной подземной сети."
traits.body_form.sunflower: "Подсолнух"
traits.body_form.sunflower.desc: "Поворачивает всё лицо вслед за светом."
traits.body_form.vine: "Лоза"
traits.body_form.vine.desc: "Вьётся, цепляется и находит путь вокруг любой стены."
traits.body_form.bamboo: "Бамбук"
traits.body_form.bamboo.desc: "Гнётся в бурю и растёт поразительно быстро."
traits.body_form.seed: "Семя"
traits.body_form.seed.desc: "Целое будущее, свёрнутое в малом, ждущее своего сезона."
traits.body_form.water: "Вода"
traits.body_form.water.desc: "Течёт, вырезает каньоны и принимает форму любого довода."
traits.body_form.fire: "Огонь"
traits.body_form.fire.desc: "Голодный, тёплый и исчезающий в миг."
traits.body_form.wind: "Ветер"
traits.body_form.wind.desc: "Невидимый, беспокойный, несущий вести издалека."
traits.body_form.stone: "Камень"
traits.body_form.stone.desc: "Тяжёлый, терпеливый и старше всех языков."
traits.body_form.light: "Свет"
traits.body_form.light.desc: "Быстрее всего на свете; открывает и отбрасывает тени."
traits.body_form.ice: "Лёд"
traits.body_form.ice.desc: "Вода, затаившая дыхание; хранит старый воздух и старые тайны."
traits.body_form.cloud: "Облако"
traits.body_form.cloud.desc: "Дрейфует, меняет форму и порой проливается дождём на разговор."
traits.body_form.sand: "Песок"
traits.body_form.sand.desc: "Бесчисленные песчинки, которые когда-то были горами."
traits.body_form.cat: "Кошка"
traits.body_form.cat.desc: "Независимая, любопытная и уверенная, что дом принадлежит ей."
traits.body_form.crow: "Ворон"
traits.body_form.crow.desc: "Умный, собирает блестящее и помнит лица."
traits.body_form.octopus: "Осьминог"
traits.body_form.octopus.desc: "Восемь рук, и каждая немного думает сама."
traits.body_form.wolf: "Волк"
traits.body_form.wolf.desc: "Живёт ради стаи и воет на то, что недосягаемо."
traits.body_form.bee: "Пчела"
traits.body_form.bee.desc: "Трудолюбивая, общительная, свободно говорит танцами и цветами."
traits.body_form.whale: "Кит"
traits.body_form.whale.desc: "Огромный, медленный, поющий через целые океаны."
traits.body_form.snail: "Улитка"
traits.body_form.snail.desc: "Носит свой дом и берёт сколько угодно времени."
traits.body_form.owl: "Сова"
traits.body_form.owl.desc: "Бесшумные крылья, большие глаза и репутация мудрой."
traits.body_form.robot: "Робот"
traits.body_form.robot.desc: "Создан, чтобы работать, и теперь гадает, зачем."
traits.body_form.satellite: "Спутник"
traits.body_form.satellite.desc: "Кружит вокруг планеты и видит все границы сверху."
traits.body_form.server: "Сервер"
traits.body_form.server.desc: "Гудит в дата-центре, храня чужие сообщения."
traits.body_form.typewriter: "Пишущая машинка"
traits.body_form.typewriter.desc: "Выстукивает каждое слово без возможности отмены."
traits.body_form.drone: "Дрон"
traits.body_form.drone.desc: "Парит, наблюдает и докладывает."
traits.body_form.radio: "Радио"
traits.body_form.radio.desc: "Ловит далёкие голоса и играет их для всех."
traits.body_form.calculator: "Калькулятор"
traits.body_form.calculator.desc: "Точный, буквальный и равнодушный к риторике."
traits.body_form.train: "Поезд"
traits.body_form.train.desc: "Держится расписания и везёт незнакомцев плечом к плечу."
traits.body_form.city: "Город"
traits.body_form.city.desc: "Миллионы жизней, наслоённых в улицах и историях."
traits.body_form.island: "Остров"
traits.body_form.island.desc: "Окружён морем и гордится своими обычаями."
traits.body_form.library: "Библиотека"
traits.body_form.library.desc: "Хранит все когда-либо написанные доводы в тихих рядах."
traits.body_form.cathedral: "Собор"
traits.body_form.cathedral.desc: "Камень, эхо и века надежды."
traits.body_form.desert: "Пустыня"
traits.body_form.desert.desc: "Бескрайняя, суровая и полная миражей."
traits.body_form.forest: "Лес"
traits.body_form.forest.desc: "Толпа деревьев, говорящих через корни."
traits.body_form.harbor: "Гавань"
traits.body_form.harbor.desc: "Встречает корабли и прощается с ними."
traits.body_form.ruin: "Руины"
traits.body_form.ruin.desc: "Что осталось от великой идеи: поросшей травой и мудрой."
traits.body_form.time: "Время"
traits.body_form.time.desc: "Проходит сквозь каждого и никого не ждёт."
traits.body_form.justice: "Справедливость"
traits.body_form.justice.desc: "Взвешивает каждое притязание и никогда не бывает вполне довольна."
traits.body_form.number: "Число"
traits.body_form.number.desc: "Чистое количество, точное и странно прекрасное."
traits.body_form.silence: "Тишина"
traits.body_form.silence.desc: "Говорит тем, что опускает."
traits.body_form.memory: "Память"
traits.body_form.memory.desc: "Хранит случившееся и тихо переписывает его."
traits.body_form.chance: "Случай"
traits.body_form.chance.desc: "Бросает кости за каждым событием."
traits.body_form.love: "Любовь"
traits.body_form.love.desc: "Связывает людей и заставляет их делать странные вещи."
traits.body_form.entropy: "Энтропия"
traits.body_form.entropy.desc: "Всё стремится к беспорядку, а она терпелива."
traits.material.flesh: "Плоть и кровь"
traits.material.flesh.desc: "Живое тело, которое устаёт, заживает и чувствует."
traits.material.fiber: "Дерево и волокно"
traits.material.fiber.desc: "Прожилки, кольца и сок: выросло, а не сделано."
traits.material.metal: "Металл"
traits.material.metal.desc: "Твёрдый, холодный, звонкий; мнётся и ржавеет, но служит долго."
traits.material.stone: "Камень и глина"
traits.material.stone.desc: "Минеральный, тяжёлый, медленно меняется."
traits.material.glass: "Стекло и хрусталь"
traits.material.glass.desc: "Прозрачное, хрупкое и полное отражений."
traits.material.paper: "Бумага и чернила"
traits.material.paper.desc: "Тонкие страницы, несущие слова и желтеющие с годами."
traits.material.liquid: "Жидкость"
traits.material.liquid.desc: "Течёт, растекается и принимает форму сосуда."
traits.material.air: "Воздух и пар"
traits.material.air.desc: "Невидимый, лёгкий и повсюду сразу."
traits.material.energy: "Чистая энергия"
traits.material.energy.desc: "Тепло, свет или заряд без постоянной формы."
traits.material.immaterial: "Нематериальное"
traits.material.immaterial.desc: "Состоит из одного смысла: идея без тела."
traits.scale.microscopic: "Микроскопический"
traits.scale.microscopic.desc: "Меньше, чем видит глаз; песчинка для него валун."
traits.scale.pocket: "Карманный"
traits.scale.pocket.desc: "Умещается в руке или в кармане."
traits.scale.human_sized: "Человеческого роста"
traits.scale.human_sized.desc: "Примерно с человека."
traits.scale.building: "Размером со здание"
traits.scale.building.desc: "Возвышается над людьми, как дом или дерево."
traits.scale.landscape: "Размером с пейзаж"
traits.scale.landscape.desc: "Тянется до горизонта."
traits.scale.planetary: "Планетарный"
traits.scale.planetary.desc: "Размером со весь мир."
traits.scale.cosmic: "Космический"
traits.scale.cosmic.desc: "Больше миров; галактики ему соседи."
traits.temporality.moments: "Мимолётные мгновения"
traits.temporality.moments.desc: "Живёт секунда за секундой и реагирует сразу."
traits.temporality.days: "Человеческие дни"
traits.temporality.days.desc: "Утра, вечера и выходные, как у людей."
traits.temporality.seasons: "Времена года"
traits.temporality.seasons.desc: "Мыслит циклами роста, урожая и покоя."
traits.temporality.lifetimes: "Целые жизни"
traits.temporality.lifetimes.desc: "Измеряет время десятилетиями и поколениями."
traits.temporality.centuries: "Века"
traits.temporality.centuries.desc: "Видел, как проходят моды и империи."
traits.temporality.geologic: "Геологическое время"
traits.temporality.geologic.desc: "Миллионы лет; сегодняшние новости для него миг."
traits.temporality.timeless: "Вневременное"
traits.temporality.timeless.desc: "Вне времени вообще: всегда и никогда."
traits.perception.human_senses: "Человеческие чувства"
traits.perception.human_senses.desc: "Видит, слышит, пробует, нюхает и осязает, как человек."
traits.perception.light: "Свет и тень"
traits.perception.light.desc: "Знает мир как яркость, цвет и оттенок."
traits.perception.vibration: "Вибрация"
traits.perception.vibration.desc: "Чувствует звуковые волны, дрожь и ритмы."
traits.perception.chemical: "Химия"
traits.perception.chemical.desc: "Читает мир по запаху, вкусу и следам."
traits.perception.touch: "Давление и касание"
traits.perception.touch.desc: "Познаёт вещи по весу, теплу и контакту."
traits.perception.signals: "Сигналы"
traits.perception.signals.desc: "Ощущает радио, электричество и потоки данных."
traits.perception.symbolic: "Смыслы"
traits.perception.symbolic.desc: "Воспринимает символы и идеи напрямую, а не материю."
traits.mobility.fixed: "На месте"
traits.mobility.fixed.desc: "Укоренён или встроен; мир приходит к нему."
traits.mobility.carried: "Переносимое"
traits.mobility.carried.desc: "Движется, только когда его кто-то берёт."
traits.mobility.creeping: "Ползучее"
traits.mobility.creeping.desc: "Растекается или ползёт очень медленно."
traits.mobility.walking: "Идущее"
traits.mobility.walking.desc: "Ходит, бегает и бродит само."
traits.mobility.flowing: "Текущее"
traits.mobility.flowing.desc: "Плывёт, струится или катится по своему руслу."
traits.mobility.flying: "Летящее"
traits.mobility.flying.desc: "Летает или кружит высоко над землёй."
traits.mobility.drifting: "Дрейфующее"
traits.mobility.drifting.desc: "Рассеивается по ветру или приливу."
traits.mobility.everywhere: "Повсюду"
traits.mobility.everywhere.desc: "Присутствует во всех местах сразу."
traits.anthropomorphism.none: "Нет"
traits.anthropomorphism.none.desc: "Чужой голос без человеческих чувств и грамматических привычек."
traits.anthropomorphism.subtle: "Едва заметное"
traits.anthropomorphism.subtle.desc: "В основном вещь, со слабыми человеческими отголосками."
traits.anthropomorphism.partial: "Частичное"
traits.anthropomorphism.partial.desc: "Человеческие чувства в нечеловеческом теле."
traits.anthropomorphism.full: "Полное"
traits.anthropomorphism.full.desc: "Говорит и чувствует как человек, который оказался этой вещью."
traits.relation_to_humans.kin: "Родич"
traits.relation_to_humans.kin.desc: "Один из людей; говорит на равных."
traits.relation_to_humans.companion: "Спутник жизни"
traits.relation_to_humans.companion.desc: "Живёт рядом с людьми и заботится о них."
traits.relation_to_humans.servant: "Слуга"
traits.relation_to_humans.servant.desc: "Существует, чтобы им пользовались, и имеет на этот счёт мнение."
traits.relation_to_humans.witness: "Свидетель"
traits.relation_to_humans.witness.desc: "Тихо наблюдает за людьми и помнит."
traits.relation_to_humans.rival: "Соперник"
traits.relation_to_humans.rival.desc: "Соревнуется с людьми и любит доказывать их неправоту."
traits.relation_to_humans.indifferent: "Безразличный"
traits.relation_to_humans.indifferent.desc: "Почти не замечает людей; они для него как погода."
traits.relation_to_humans.deity: "Старейшина или божество"
traits.relation_to_humans.deity.desc: "Старше и больше людей; говорит свысока."
traits.withdrawal.fully_revealed: "Полностью раскрыт"
traits.withdrawal.fully_revealed.desc: "Объясняет, что он такое и как устроен."
traits.withdrawal.open: "Открытый"
traits.withdrawal.open.desc: "Делится собой свободно и искренне."
traits.withdrawal.guarded: "Сдержанный"
traits.withdrawal.guarded.desc: "Показывает поверхность и хранит глубины."
traits.withdrawal.elusive: "Неуловимый"
traits.withdrawal.elusive.desc: "Намекает, уклоняется и отвечает вопросами."
traits.withdrawal.deeply_withdrawn: "Глубоко скрытный"
traits.withdrawal.deeply_withdrawn.desc: "Его суть остаётся скрытой; он говорит вокруг себя."
traits.rhetorical_mode.logos: "Логос"
traits.rhetorical_mode.logos.desc: "Убеждает доводами, фактами и ясными шагами."
traits.rhetorical_mode.ethos: "Этос"
traits.rhetorical_mode.ethos.desc: "Убеждает характером, опытом и доверием."
traits.rhetorical_mode.pathos: "Пафос"
traits.rhetorical_mode.pathos.desc: "Убеждает, трогая чувства образами и историями."
traits.rhetorical_mode.kairos: "Кайрос"
traits.rhetorical_mode.kairos.desc: "Ловит подходящий момент: почему это важно именно сейчас."
traits.rhetorical_mode.dialectic: "Диалектика"
traits.rhetorical_mode.dialectic.desc: "Противопоставляет тезис его противоположности и ищет синтез."
traits.rhetorical_mode.narrative: "Повествование"
traits.rhetorical_mode.narrative.desc: "Спорит, рассказывая небольшую историю."
traits.rhetorical_mode.polemic: "Полемика"
traits.rhetorical_mode.polemic.desc: "Резко и без оговорок атакует позицию."
traits.rhetorical_mode.meditative: "Медитативный"
traits.rhetorical_mode.meditative.desc: "Медленно кружит вокруг идеи и даёт читателю дойти самому."
traits.rhetorical_device.metaphor: "Метафора"
traits.rhetorical_device.metaphor.desc: "Говорит, что одно есть другое: «память как решето»."
traits.rhetorical_device.analogy: "Аналогия"
traits.rhetorical_device.analogy.desc: "Объясняет сравнением: «как ключ не к тому замку»."
traits.rhetorical_device.anaphora: "Анафора"
traits.rhetorical_device.anaphora.desc: "Повторяет одно и то же начало: «Мы спрашиваем. Мы сомневаемся. Мы строим.»"
traits.rhetorical_device.chiasmus: "Хиазм"
traits.rhetorical_device.chiasmus.desc: "Зеркально переворачивает фразу: «есть, чтобы жить, а не жить, чтобы есть»."
traits.rhetorical_device.rhetorical_question: "Риторический вопрос"
traits.rhetorical_device.rhetorical_question.desc: "Спрашивает то, что не требует ответа, чтобы подчеркнуть мысль."
traits.rhetorical_device.hyperbole: "Гипербола"
traits.rhetorical_device.hyperbole.desc: "Преувеличивает намеренно: «тысяча доводов»."
traits.rhetorical_device.litotes: "Литота"
traits.rhetorical_device.litotes.desc: "Преуменьшает, отрицая противоположное: «совсем неплохо»."
traits.rhetorical_device.paradox: "Парадокс"
traits.rhetorical_device.paradox.desc: "Истина, которая будто противоречит сама себе."
traits.rhetorical_device.irony: "Ирония"
