arena.preset.marys_room.title: "Комната Мэри"
arena.preset.marys_room.premise: "Мэри — учёная, знающая физику и биологию цветового зрения, но всю жизнь прожившая в чёрно-белой комнате. Однажды она выходит и впервые видит красный цвет."
arena.preset.marys_room.question: "Узнаёт ли Мэри что-то новое?"
arena.preset.marys_room.v1: "Что она знала"
arena.preset.marys_room.v1_values: "все физические факты | большинство фактов, с пробелами"
