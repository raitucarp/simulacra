traits.semiotic_mode.meme: "Мемы"
traits.semiotic_mode.meme.desc: "Играет с общими интернет-шаблонами и форматами."
traits.semiotic_mode.typographic: "Типографика"
traits.semiotic_mode.typographic.desc: "Интервалы, заглавные буквы и вёрстка как часть сообщения."
traits.semiotic_mode.ellipsis: "Молчание и многоточие"
traits.semiotic_mode.ellipsis.desc: "Больше всего говорит тем, что остаётся недосказанным..."
traits.semiotic_mode.hashtag: "Хештеги"
traits.semiotic_mode.hashtag.desc: "Хештеги как сжатые знаки и внутренние шутки."
traits.sentence_structure.simple: "Простые"
