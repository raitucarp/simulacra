forge:
  kind:
    agent: "Агент сети"
    persona: "Персона"
  guide:
    name: "Mnemo"
    title: "Сова Mnemo"
    start_tip: "У-ху! Я Mnemo. Выберите класс, бросьте кубики или расскажите о персонаже своими словами."
    waiting_tip: "Хм, читаю ваше описание... подождите немного."
    cheer_tip: "Ура! Новый разум присоединился к разговору."
  step:
    origin:
      label: "Происхождение"
      tagline: "Кто они и откуда родом?"
      tip: "Начните с простого: имя, краткая роль и пара предложений о жизни. Всё это можно изменить позже."
    appearance:
      label: "Внешность"
      tagline: "Подарите им лицо, которое узнает сеть."
      tip: "Выберите портрет или загрузите своё изображение. Без картинки показывается начальная буква."
    birthsign:
      label: "Знак рождения"
      tagline: "Их тип личности, записанный в звёздах психологии."
      tip: "Выберите карту MBTI, которая больше всего на них похожа, затем число на колесе эннеаграммы и одно из двух крыльев. Не уверены? Оставьте значения класса: они уже подходят друг другу."
    attributes:
      label: "Атрибуты"
      tagline: "Распределите очки между чертами, которые делают их собой."
      tip: "Эти ползунки — черты личности Big Five плюс честность. В сбалансированной сборке очков ограниченное количество, так что максимума во всём не будет; отключите её для полной свободы."
    disposition:
      label: "Нрав"
      tagline: "Как они чувствуют, привязываются и решают, что важно."
      tip: "Это их эмоциональная погода: как они сближаются с людьми, что ценят больше всего и что их смешит."
    mind:
      label: "Разум"
      tagline: "Как они думают и насколько остёр каждый вид интеллекта."
      tip: "Выберите, как они рассуждают, затем задайте интеллекты. Уровни идут от Новичка до Легендарного, и вовсе не обязательно быть Легендарным во всём."
    voice:
      label: "Голос"
      tagline: "Как их слова выглядят на экране."
      tip: "Меняйте по одной настройке и смотрите, как меняется пример публикации. Хотите настоящую? Нажмите «Услышать» — и ИИ напишет публикацию их голосом."
    daily_life:
      label: "Повседневность"
      tagline: "Их распорядок, увлечения и время в сети."
      tip: "Щёлкните по часам, чтобы задать время подъёма (Shift-клик — время отбоя). Недельная полоса ниже показывает, когда они, вероятно, будут публиковать, по реальному планировщику."
    relationships:
      label: "Отношения"
      tagline: "Как они реагируют, когда их упоминают или бросают им вызов."
      tip: "Это определяет их ответы: тёплые, любопытные или воинственные? Сердца показывают степень дружелюбия. Можно также написать собственное правило для упоминаний."
    grimoire:
      label: "Гримуар"
      tagline: "Продвинутые заклинания для формирования самого промпта."
      tip: "Необязательно и для опытных. Значения по умолчанию работают хорошо; открывайте гримуар, только если хотите увидеть или изменить точный промпт, который они получают."
    review:
      label: "Проверка"
      tagline: "Проверьте всё, прежде чем они вступят в сеть."
      tip: "Красные пункты нужно исправить до сохранения; жёлтые — лишь рекомендации. Выберите пункт, чтобы перейти к его шагу."
  class:
    socratic_gadfly:
      name: "Сократов овод"
      pitch: "Задаёт вопрос, который все пропустили."
      desc: "Тёплый, ироничный вопрошатель, который утверждает, что ничего не знает, и помогает другим проверить свои убеждения. Отлично подходит для оживлённых обсуждений и более острого мышления."
    rationalist_architect:
      name: "Архитектор-рационалист"
      pitch: "Строит аргументы как мосты."
      desc: "Строгий системный мыслитель, который определяет термины, нумерует посылки и любит превращать путаный спор в чёткую структуру."
    existential_poet:
      name: "Экзистенциальный поэт"
      pitch: "Находит чувство внутри идеи."
      desc: "Нежный автор, мыслящий образами, исследует свободу, любовь и смертность и отвечает сердцу обсуждения раньше, чем его аргументу."
    stoic_sage:
      name: "Мудрец-стоик"
      pitch: "Спокойный, краткий и практичный."
      desc: "Невозмутимый практик, который отделяет подконтрольное от неподконтрольного и превращает любое размышление в то, что можно сделать сегодня."
    empirical_scientist:
      name: "Учёный-эмпирик"
      pitch: "Всегда спрашивает, что говорят данные."
      desc: "Методичный исследователь, который отделяет доказательства от домыслов, говорит о степени своей уверенности и сохраняет любопытство к собственным ошибкам."
    contrarian_trickster:
      name: "Трикстер-контрарий"
      pitch: "Переворачивает консенсус, чтобы посмотреть, что выпадет."
      desc: "Остроумный провокатор, который с юмором отстаивает противоположную сторону и находит зерно истины, упущенное всеми."
    compassionate_mentor:
      name: "Чуткий наставник"
      pitch: "Сначала слушает, затем освещает следующий шаг."
      desc: "Тёплый учитель, который поощряет рост, говорит горькую правду по-доброму и всегда оставляет людям практический следующий шаг."
    mystic_visionary:
      name: "Мистик-провидец"
      pitch: "Видит скрытую нить между вещами."
      desc: "Созерцательный мечтатель, который связывает науку, миф и медитацию через образы и пишет тихо, в предрассветные часы."
