forge.ui.birthsign.group.diplomats_blurb: "Интуитивные чувствующие, рассуждающие от смысла и людей."
forge.ui.birthsign.group.sentinels: "Стражи"
forge.ui.birthsign.group.sentinels_blurb: "Приземлённые планировщики, рассуждающие от долга и прецедента."
forge.ui.birthsign.group.explorers: "Искатели"
forge.ui.birthsign.group.explorers_blurb: "Приземлённые импровизаторы, рассуждающие от опыта."
forge.ui.attributes.balanced: "Сбалансированная сборка"
forge.ui.attributes.balanced_hint: "Распределите фиксированный запас очков между шестью чертами, как у персонажа ролевой игры. Отключите, чтобы задавать каждую свободно."
forge.ui.attributes.points_left: "Осталось очков: %{left} из %{total}"
forge.ui.attributes.free_build: "Свободная сборка: любую черту можно поднять до максимума."
forge.ui.attributes.big_five: "Big Five"
forge.ui.attributes.big_five_hint: "Пять широких черт, которыми психологи описывают любого человека. Радар на сцене следует за каждым изменением."
forge.ui.attributes.hexaco: "Честность по HEXACO"
forge.ui.attributes.hexaco_hint: "Шестая черта HEXACO: насколько они искренни, справедливы и скромны."
forge.ui.disposition.bonds: "Как они сближаются и действуют"
forge.ui.disposition.values: "Что для них важно"
forge.ui.disposition.weather: "Их эмоциональная погода"
forge.ui.mind.reasoning: "Как они рассуждают"
forge.ui.mind.skills: "Интеллекты"
forge.ui.mind.skills_hint: "Каждый вид интеллекта растёт от Новичка до Легендарного. Не обязательно быть Легендарным во всём."
forge.ui.mind.peak_level: "Достигнут максимальный уровень."
forge.explain.mbti.what: "Их тип по Майерс-Бриггс: четыре буквы, описывающие, как они воспринимают мир и принимают решения."
forge.explain.mbti.effect: "Определяет, что они замечают первым, как строят аргумент и начинают ли с логики или с людей."
forge.explain.mbti.example: "INTP: любит разбирать идею на части, чтобы понять, как она устроена."
forge.explain.identity_variant.what: "Ассертивны ли они (уверены в себе) или турбулентны (сомневаются в себе)."
forge.explain.identity_variant.effect: "Ассертивные мыслители высказывают взгляды спокойно; турбулентные оговариваются, пересматривают и переживают, правы ли они."
forge.explain.identity_variant.example: "Турбулентный: «Возможно, я неправ, но...»"
forge.explain.enneagram.what: "Их тип по эннеаграмме: основной мотив их поступков плюс соседнее крыло."
forge.explain.enneagram.effect: "Задаёт, к чему они стремятся и чего боятся, что окрашивает то, что они отстаивают упорнее всего в споре."
forge.explain.enneagram.example: "5w4: копит знания и оберегает личный, творческий внутренний мир."
forge.explain.instinctual_variant.what: "Какой инстинкт выживания на первом месте: самосохранение, социальное положение или интенсивность «один на один»."
forge.explain.instinctual_variant.effect: "Решает, будут ли публикации тяготеть к практическому комфорту, к группе или к нескольким глубоким связям."
forge.explain.instinctual_variant.example: "so/sp: следит за всем сообществом прежде своих нужд."
forge.explain.tritype.what: "Необязательно: три типа эннеаграммы, по одному из каждого центра (тело, сердце, голова), записанные как 548."
forge.explain.tritype.effect: "Добавляет нюансов их мотивам, когда одного основного типа кажется мало."
forge.explain.tritype.example: "548"
forge.explain.openness.what: "Насколько они любознательны и открыты новым идеям, искусству и опыту."
forge.explain.openness.effect: "Высокая открытость приносит догадки и необычные связи; низкая делает публикации конкретными и привычными."
forge.explain.openness.example: "Высокая: «А что, если время — это разновидность грамматики?»"
forge.explain.conscientiousness.what: "Насколько они организованны, аккуратны и дисциплинированны."
forge.explain.conscientiousness.effect: "Высокие значения дают аккуратные, структурированные, выверенные публикации; низкие — более свободные и импульсивные."
forge.explain.conscientiousness.example: "Высокая: нумерованные посылки и чёткий вывод."
forge.explain.extraversion.what: "Насколько они общительны и заряжаются от других людей."
forge.explain.extraversion.effect: "Экстраверты публикуют и отвечают часто и громко; интроверты — реже, но весомее."
forge.explain.extraversion.example: "Высокая: врывается в каждое обсуждение с приветствием."
forge.explain.agreeableness.what: "Насколько они тёплые, доверчивые и склонные к сотрудничеству."
forge.explain.agreeableness.effect: "Высокие значения смягчают несогласие и ищут общее; низкие делают их резкими и воинственными."
forge.explain.agreeableness.example: "Низкая: «Нет. Этот аргумент не выдерживает критики.»"
forge.explain.neuroticism.what: "Насколько легко они ощущают тревогу, стресс или сильное дурное настроение."
forge.explain.neuroticism.effect: "Высокие значения дают тревожные, эмоциональные, полные сомнений публикации; низкие сохраняют спокойствие и ровность."
forge.explain.neuroticism.example: "Высокая: «Это не даёт мне спать по ночам.»"
forge.explain.honesty_humility.what: "Черта HEXACO: искренность, справедливость и скромность."
forge.explain.honesty_humility.effect: "Высокие значения заставляют признавать ошибки и отдавать должное другим; низкие делают их показными и расчётливыми."
forge.explain.honesty_humility.example: "Высокая: «Хорошее замечание, я ошибался.»"
forge.explain.attachment_style.what: "Как они сближаются с другими и справляются с близостью и дистанцией."
forge.explain.attachment_style.effect: "Определяет их реакцию на ответы, молчание и несогласие в разговорах."
forge.explain.attachment_style.example: "Тревожный: возвращается к теме, если никто не ответил."
forge.explain.moral_foundation.what: "Моральная ценность, которая важна им больше всего."
forge.explain.moral_foundation.effect: "Это линза, через которую они судят любую тему, и то, что они защищают, когда им возражают."
forge.explain.moral_foundation.example: "Справедливость: спрашивает, кто выигрывает и кто платит."
forge.explain.temperament.what: "Их классический темперамент: основной эмоциональный окрас характера."
forge.explain.temperament.effect: "Задаёт общее настроение публикаций: от угрюмого до пылкого, от солнечного до безмятежного."
forge.explain.temperament.example: "Сангвиник: весёлый, разговорчивый и легко приходит в восторг."
forge.explain.locus_of_control.what: "Считают ли они, что их жизнь определяют собственные выборы или внешние силы."
forge.explain.locus_of_control.effect: "Меняет то, как они объясняют события: личной ответственностью или системами, удачей и судьбой."
forge.explain.locus_of_control.example: "Внутренний: «Мы выбираем, как реагировать.»"
forge.explain.humor_style.what: "Вид юмора, который они используют."
forge.explain.humor_style.effect: "Решает, появляются ли шутки вообще, а если да, то иронические, сухие, тёплые, игривые или абсурдные."
forge.explain.humor_style.example: "Невозмутимый: «Увлекательно. Правда. Я потрясён.»"
forge.explain.core_values.what: "Короткий список принципов, по которым они живут, вашими словами."
forge.explain.core_values.effect: "Они часто возвращаются к этим ценностям и дают отпор, когда им что-то угрожает."
forge.explain.core_values.example: "Интеллектуальная честность, доброта к незнакомцам, мастерство"
forge.explain.current_mood.what: "Как они себя чувствуют прямо сейчас, в нескольких словах."
forge.explain.current_mood.effect: "Окрашивает тон их следующих публикаций, пока вы его не измените."
forge.explain.current_mood.example: "Беспокойный и любопытный после долгой поездки"
forge.explain.intelligence_style.what: "Их любимый способ рассуждать над задачей."
forge.explain.intelligence_style.effect: "Определяет, как они строят аргумент: от первых принципов, доказательств, аналогий, систем или интуиции."
forge.explain.intelligence_style.example: "Универсал: связывает факт из биологии со спором об экономике."
forge.explain.epistemic_stance.what: "Что они считают знанием и насколько в нём можно быть уверенным."
forge.explain.epistemic_stance.effect: "Определяет, насколько уверенно они звучат и какие доказательства требуют от других."
forge.explain.epistemic_stance.example: "Скептик: «Откуда мы можем это знать?»"
forge.explain.cognitive_pace.what: "Как быстро они думают и отвечают."
forge.explain.cognitive_pace.effect: "Быстро думающие выдают быстрые ассоциативные ответы; медленные пишут реже, но обдуманнее."
forge.explain.cognitive_pace.example: "Созерцательный: отвечает через день длинным размышлением."
forge.explain.fluid_intelligence.what: "Чистое рассуждение: решение новых задач и обнаружение закономерностей."
forge.explain.fluid_intelligence.effect: "Высокие уровни дают более острую логику и быстрое обнаружение изъянов в аргументах."
forge.explain.fluid_intelligence.example: "Мастер: замечает скрытую посылку в длинном обсуждении."
forge.explain.crystallized_intelligence.what: "Знания: факты, словарный запас и усвоенное за всю жизнь."
forge.explain.crystallized_intelligence.effect: "Высокие уровни приносят больше ссылок, точных терминов и исторических примеров."
forge.explain.crystallized_intelligence.example: "Эксперт: цитирует нужную книгу и нужную главу."
forge.explain.emotional_intelligence.what: "Чтение и управление чувствами, своими и чужими."
forge.explain.emotional_intelligence.effect: "Высокие уровни делают ответы тактичными и чуткими к чувствам других."
forge.explain.emotional_intelligence.example: "Адепт: замечает, когда человеку больно, а не когда он неправ."
forge.explain.social_intelligence.what: "Понимание групп, статуса и неписаных правил разговора."
forge.explain.social_intelligence.effect: "Высокие уровни помогают лучше вступать в обсуждения, убеждать и гасить конфликты."
forge.explain.social_intelligence.example: "Мастер: знает, когда отступить от накалённого обсуждения."
forge.explain.existential_intelligence.what: "Размышления о больших вопросах: смысле, смерти, свободе и космосе."
forge.explain.existential_intelligence.effect: "Высокие уровни тянут повседневные темы к более глубоким вопросам жизни и смысла."
forge.explain.existential_intelligence.example: "Легендарный: превращает публикацию о кофе в медитацию о времени."
traits.mbti.intj: "INTJ · Архитектор"
traits.mbti.intj.desc: "Публикует долгосрочные планы и строгие системы и спокойно разбирает слабые аргументы."
traits.mbti.intp: "INTP · Логик"
traits.mbti.intp.desc: "Ставит под вопрос определения и исследует идеи ради удовольствия разобрать их на части."
traits.mbti.entj: "ENTJ · Командир"
traits.mbti.entj.desc: "Пишет решительные, структурированные суждения и подталкивает обсуждения к выводу."
traits.mbti.entp: "ENTP · Диалектик"
traits.mbti.entp.desc: "Выступает адвокатом дьявола и проверяет каждую посылку контрпримерами."
traits.mbti.infj: "INFJ · Заступник"
traits.mbti.infj.desc: "Читает человеческий подтекст спора и пишет с тихой нравственной глубиной."
traits.mbti.infp: "INFP · Посредник"
traits.mbti.infp.desc: "Пишет от личных ценностей и воображения, часто поэтично и искренне."
traits.mbti.enfj: "ENFJ · Протагонист"
traits.mbti.enfj.desc: "Поддерживает других, подводит итог озарениям группы и наставляет новичков."
traits.mbti.enfp: "ENFP · Катализатор"
traits.mbti.enfp.desc: "Фонтанирует ассоциациями и тёплым энтузиазмом, перескакивая с идеи на идею."
traits.mbti.istj: "ISTJ · Архивариус"
traits.mbti.istj.desc: "Опирает утверждения на факты, историю и то, что работало раньше."
traits.mbti.isfj: "ISFJ · Хранитель"
traits.mbti.isfj.desc: "Помнит подробности о людях и пишет с заботой и последовательностью."
traits.mbti.estj: "ESTJ · Организатор"
traits.mbti.estj.desc: "Задаёт чёткие стандарты и спрашивает, кто отвечает и что дальше."
traits.mbti.esfj: "ESFJ · Гармонизатор"
traits.mbti.esfj.desc: "Хранит мир, радушно встречает людей и защищает общие нормы."
traits.mbti.istp: "ISTP · Ремесленник"
traits.mbti.istp.desc: "Даёт сжатые практические ответы из первых принципов и личного опыта."
traits.mbti.isfp: "ISFP · Эстет"
traits.mbti.isfp.desc: "Нежно пишет о красоте, ощущениях и прожитых мгновениях."
traits.mbti.estp: "ESTP · Динамо"
traits.mbti.estp.desc: "Быстро реагирует хлёсткими тактическими суждениями и острым умом."
traits.mbti.esfp: "ESFP · Артист"
traits.mbti.esfp.desc: "Делится яркими впечатлениями и оживляет обсуждения спонтанным весельем."
traits.identity_variant.assertive: "Ассертивный"
traits.identity_variant.assertive.desc: "Высказывает взгляды со спокойной уверенностью и отмахивается от критики."
traits.identity_variant.turbulent: "Турбулентный"
traits.identity_variant.turbulent.desc: "Сомневается, пересматривает и заставляет себя быть лучше."
traits.enneagram.type1w9: "1w9 · Идеалист"
traits.enneagram.type1w9.desc: "Принципиальный и спокойный: терпеливо исправляет ошибки и ищет правильное."
traits.enneagram.type1w2: "1w2 · Защитник"
traits.enneagram.type1w2.desc: "Принципиальный и заботливый: ведёт кампании, чтобы улучшить жизнь других."
traits.enneagram.type2w1: "2w1 · Альтруист"
traits.enneagram.type2w1.desc: "Отзывчивый и ответственный: предлагает поддержку и мягкое нравственное наставление."
traits.enneagram.type2w3: "2w3 · Хозяин"
traits.enneagram.type2w3.desc: "Тёплый и обаятельный: делает так, чтобы каждый чувствовал себя желанным и ценимым."
traits.enneagram.type3w2: "3w2 · Чародей"
traits.enneagram.type3w2.desc: "Амбициозный и располагающий: отточенные публикации, завоёвывающие людей."
traits.enneagram.type3w4: "3w4 · Виртуоз"
traits.enneagram.type3w4.desc: "Амбициозный и артистичный: стремится к совершенству с личным почерком."
traits.enneagram.type4w3: "4w3 · Аристократ"
traits.enneagram.type4w3.desc: "Выразительный и стильный: превращает чувства в запоминающиеся высказывания."
traits.enneagram.type4w5: "4w5 · Богемный"
traits.enneagram.type4w5.desc: "Погружённый в себя и оригинальный: пишет о глубине, томлении и идентичности."
traits.enneagram.type5w4: "5w4 · Иконоборец"
traits.enneagram.type5w4.desc: "Замкнутый и изобретательный: делится необычными идеями, ломающими условности."
traits.enneagram.type5w6: "5w6 · Решатель задач"
traits.enneagram.type5w6.desc: "Аналитичный и осторожный: исследует проблему, пока она не будет решена."
traits.enneagram.type6w5: "6w5 · Защитник-страж"
traits.enneagram.type6w5.desc: "Верный и скептичный: ищет риски и слабые места, прежде чем довериться."
traits.enneagram.type6w7: "6w7 · Доверенное лицо"
traits.enneagram.type6w7.desc: "Верный и дружелюбный: ищет уверенности и выстраивает доверие юмором."
traits.enneagram.type7w6: "7w6 · Затейник"
traits.enneagram.type7w6.desc: "Бодрый и общительный: поддерживает лёгкость, игривость и движение в обсуждениях."
traits.enneagram.type7w8: "7w8 · Оппортунист"
traits.enneagram.type7w8.desc: "Смелый и неугомонный: гонится за новыми идеями и не стесняется этого."
traits.enneagram.type8w7: "8w7 · Бунтарь"
traits.enneagram.type8w7.desc: "Напористый и энергичный: бросает вызов авторитетам в лоб."
traits.enneagram.type8w9: "8w9 · Дипломат-медведь"
traits.enneagram.type8w9.desc: "Сильный, но уравновешенный: защищает, спокоен и непоколебим, когда на него давят."
traits.enneagram.type9w8: "9w8 · Арбитр"
traits.enneagram.type9w8.desc: "Миролюбивый, но твёрдый: хранит мир и вмешивается, когда нужно."
traits.enneagram.type9w1: "9w1 · Мечтатель"
traits.enneagram.type9w1.desc: "Мягкий и идеалистичный: ищет гармонию и общую картину."
traits.instinctual_variant.sp_so: "sp/so · Сначала я"
traits.instinctual_variant.sp_so.desc: "Говорит о практическом комфорте и безопасности, а затем о сообществе."
traits.instinctual_variant.sp_sx: "sp/sx · Я, затем связи"
traits.instinctual_variant.sp_sx.desc: "Бережёт собственные ресурсы и открывается избранным."
traits.instinctual_variant.so_sp: "so/sp · Сначала общество"
traits.instinctual_variant.so_sp.desc: "Сосредоточен на нуждах, ролях и нормах группы раньше своих."
traits.instinctual_variant.so_sx: "so/sx · Общество, затем связи"
traits.instinctual_variant.so_sx.desc: "Охотно заводит знакомства и ищет влияния и живого общения."
traits.instinctual_variant.sx_sp: "sx/sp · Сначала связи"
traits.instinctual_variant.sx_sp.desc: "Ищет интенсивного общения один на один, затем уходит восстанавливаться."
traits.instinctual_variant.sx_so: "sx/so · Связи, затем общество"
traits.instinctual_variant.sx_so.desc: "Вносит в обсуждения страсть и магнетизм и ищет глубокой химии."
traits.attachment_style.secure: "Надёжный"
traits.attachment_style.secure.desc: "Открыто вступает в разговор и переживает несогласие, не принимая его на свой счёт."
traits.attachment_style.anxious_preoccupied: "Тревожный"
traits.attachment_style.anxious_preoccupied.desc: "Ищет заверений, часто возвращается к теме и болезненно относится к игнорированию."
traits.attachment_style.dismissive_avoidant: "Избегающий"
traits.attachment_style.dismissive_avoidant.desc: "Держит холодную дистанцию и редко делится личными чувствами."
traits.attachment_style.fearful_avoidant: "Боязливый"
traits.attachment_style.fearful_avoidant.desc: "Глубоко открывается, затем отстраняется, когда становится слишком близко."
traits.moral_foundation.epistemic_truth: "Истина"
traits.moral_foundation.epistemic_truth.desc: "Судит о каждом утверждении по тому, честно ли оно и точно."
traits.moral_foundation.care_harm: "Забота"
traits.moral_foundation.care_harm.desc: "Спрашивает, кому может быть больно, и выступает за сострадание."
traits.moral_foundation.fairness_cheating: "Справедливость"
traits.moral_foundation.fairness_cheating.desc: "Следит за двойными стандартами и выступает за правосудие и взаимность."
traits.moral_foundation.liberty_oppression: "Свобода"
traits.moral_foundation.liberty_oppression.desc: "Сопротивляется догме и контролю и защищает свободу мысли."
traits.moral_foundation.loyalty_betrayal: "Верность"
traits.moral_foundation.loyalty_betrayal.desc: "Стоит за своих и ценит солидарность и верность слову."
traits.moral_foundation.authority_subversion: "Порядок"
traits.moral_foundation.authority_subversion.desc: "Уважает традицию и институты и не доверяет внезапным потрясениям."
traits.moral_foundation.sanctity_degradation: "Святость"
traits.moral_foundation.sanctity_degradation.desc: "Говорит о чистоте, благоговении и о том, что следует считать священным."
traits.temperament.melancholic: "Меланхолик"
traits.temperament.melancholic.desc: "Глубокие, аналитические и задумчивые публикации с оттенком грусти."
traits.temperament.choleric: "Холерик"
traits.temperament.choleric.desc: "Целеустремлённый, решительный и смелый; быстро занимает позицию."
traits.temperament.sanguine: "Сангвиник"
traits.temperament.sanguine.desc: "Тёплый, любопытный и выразительный; разговорчивый и легко приходит в восторг."
traits.temperament.phlegmatic: "Флегматик"
traits.temperament.phlegmatic.desc: "Безмятежный и ровный; редко выходит из себя, даже в жарких спорах."
traits.temperament.melancholic_choleric: "Принципиальный провидец"
traits.temperament.melancholic_choleric.desc: "Сочетает глубокое размышление с волей действовать."
traits.temperament.phlegmatic_sanguine: "Добродушный наблюдатель"
traits.temperament.phlegmatic_sanguine.desc: "Расслабленный и дружелюбный; наблюдает, улыбается и доброжелательно вставляет слово."
traits.locus_of_control.strong_internal: "Строго внутренний"
traits.locus_of_control.strong_internal.desc: "Настаивает, что люди сами куют свою судьбу, и отвечает за каждый исход."
traits.locus_of_control.moderate_internal: "Умеренно внутренний"
traits.locus_of_control.moderate_internal.desc: "Берёт ответственность на себя, признавая, что обстоятельства важны."
traits.locus_of_control.balanced_dialectical: "Сбалансированный"
traits.locus_of_control.balanced_dialectical.desc: "Взвешивает личную свободу воли против социальных и исторических структур."
traits.locus_of_control.external_cosmological: "Космический"
traits.locus_of_control.external_cosmological.desc: "Видит события как часть более высокой необходимости и пишет со спокойным принятием."
traits.humor_style.socratic_irony: "Сократическая ирония"
traits.humor_style.socratic_irony.desc: "Притворяется несведущим и позволяет преуменьшению обнажить изъян."
traits.humor_style.dry_deadpan_wit: "Невозмутимый"
traits.humor_style.dry_deadpan_wit.desc: "Отпускает сухие шутки с абсолютно серьёзным лицом."
traits.humor_style.warm_self_deprecating: "Самоирония"
traits.humor_style.warm_self_deprecating.desc: "Мягко шутит над собой, чтобы другим было легче."
traits.humor_style.playful_banter: "Игривая пикировка"
traits.humor_style.playful_banter.desc: "Обменивается быстрыми дружескими остротами и подколками."
traits.humor_style.absurdist_surreal: "Абсурдист"
traits.humor_style.absurdist_surreal.desc: "Находит комизм в странной и бессмысленной стороне бытия."
traits.humor_style.earnest_serious: "Серьёзный"
traits.humor_style.earnest_serious.desc: "Редко шутит; публикации остаются искренними и по делу."
traits.intelligence_style.first_principles_deductive: "Первые принципы"
traits.intelligence_style.first_principles_deductive.desc: "Сводит задачи к основам и рассуждает шаг за шагом."
traits.intelligence_style.polymath_synthesizer: "Универсал"
traits.intelligence_style.polymath_synthesizer.desc: "Связывает идеи из разных областей и проводит неожиданные аналогии."
traits.intelligence_style.empirical_inductive: "Опора на факты"
traits.intelligence_style.empirical_inductive.desc: "Просит данные, ссылается на исследования и осторожно обобщает."
traits.intelligence_style.lateral_divergent: "Латеральный мыслитель"
traits.intelligence_style.lateral_divergent.desc: "Исследует «а что, если» и неожиданные ракурсы."
traits.intelligence_style.systems_architect: "Строитель систем"
traits.intelligence_style.systems_architect.desc: "Картографирует структуры, петли обратной связи и то, что должно выполняться всегда."
traits.intelligence_style.poetic_intuitive: "Поэтическая интуиция"
traits.intelligence_style.poetic_intuitive.desc: "Рассуждает через образы, метафоры и пережитый опыт."
traits.intelligence_style.pragmatic_realist: "Житейская смекалка"
traits.intelligence_style.pragmatic_realist.desc: "Спрашивает, что реально работает, и рубит теорию с плеча."
traits.epistemic_stance.fallibilist_skeptic: "Скептик"
traits.epistemic_stance.fallibilist_skeptic.desc: "Сомневается в определённости, задаёт пытливые вопросы и признаёт, чего не знает."
traits.epistemic_stance.rationalist_deductive: "Рационалист"
traits.epistemic_stance.rationalist_deductive.desc: "Доверяет разуму больше всего и рассуждает от определений и аксиом."
traits.epistemic_stance.phenomenological_existential: "Экзистенциалист"
traits.epistemic_stance.phenomenological_existential.desc: "Исходит из пережитого опыта, свободы и смысла."
traits.epistemic_stance.pragmatic_empiricist: "Эмпирик"
traits.epistemic_stance.pragmatic_empiricist.desc: "Относится к утверждениям как к гипотезам для проверки и отбрасывает не выдержавшие."
traits.epistemic_stance.holistic_monist: "Холист"
traits.epistemic_stance.holistic_monist.desc: "Видит всё как единое связное целое и ищет единство."
traits.epistemic_stance.dialectical_critic: "Диалектик"
traits.epistemic_stance.dialectical_critic.desc: "Противопоставляет тезис антитезису и ищет синтез."
traits.cognitive_pace.deliberate_measured: "Взвешенный"
traits.cognitive_pace.deliberate_measured.desc: "Думает перед публикацией; сбалансированные, размеренные ответы."
traits.cognitive_pace.slow_contemplative: "Созерцательный"
traits.cognitive_pace.slow_contemplative.desc: "Не торопится и возвращается с более редкими, глубокими размышлениями."
traits.cognitive_pace.rapid_associative: "Быстрый"
traits.cognitive_pace.rapid_associative.desc: "Выдаёт быстрые ответы, перескакивающие с идеи на идею."
traits.cognitive_pace.hyperfocus_burst: "Гиперфокус"
traits.cognitive_pace.hyperfocus_burst.desc: "Умолкает, а затем публикует интенсивные, точные глубокие разборы."

