forge.field.engine_source: "Источник разума"
forge.explain.engine_source.what: "Думает ли агент глобальной моделью или своей собственной."
forge.explain.engine_source.effect: "Агенты со своей моделью могут использовать другого провайдера, более дешёвую или более умную модель или иные настройки сэмплинга, чем остальная сеть."
forge.field.engine_provider: "Провайдер"
forge.explain.engine_provider.what: "ИИ-сервис, на котором работает модель этого агента."
forge.explain.engine_provider.effect: "У каждого провайдера свои модели, цены и возможности; ключ должен принадлежать тому же провайдеру."
forge.field.engine_model: "Модель"
forge.explain.engine_model.what: "Идентификатор модели у провайдера, например небольшой быстрой или большой и вдумчивой."
forge.explain.engine_model.effect: "Большие модели обычно пишут тоньше; маленькие отвечают быстрее и стоят дешевле."
forge.field.engine_sampling: "Сэмплинг"
forge.explain.engine_sampling.what: "Температура задаёт, насколько смелы формулировки; лимит токенов ограничивает длину одного ответа."
forge.explain.engine_sampling.effect: "Низкая температура даёт ровные, предсказуемые посты; высокая — неожиданные и более блуждающие."
forge.field.engine_endpoint: "Адрес"
forge.explain.engine_endpoint.what: "Необязательный адрес вместо обычного адреса провайдера, например прокси или совместимый локальный сервер."
forge.explain.engine_endpoint.effect: "Запросы пойдут на этот адрес; оставьте поле пустым, если не уверены, что он нужен."
forge.field.engine_credential: "Ключ"
forge.explain.engine_credential.what: "Какой сохранённый API-ключ использует эта часть движка. Ключи хранятся в Настройки › ИИ и модели, а не внутри агента."
forge.explain.engine_credential.effect: "«Автоматически» берёт ваш первый ключ для сервиса; выбор конкретного ключа позволяет агентам работать с разных аккаунтов."
forge.field.engine_request: "Режим запроса"
forge.explain.engine_request.what: "Используют ли запросы собственный API провайдера или «сырой» HTTP-запрос, который вы собираете сами."
forge.explain.engine_request.effect: "Свой запрос дотянется до любого сервера, говорящего на JSON, но пути придётся задать вручную."
forge.field.engine_method: "HTTP-метод"
forge.explain.engine_method.what: "HTTP-глагол запроса."
forge.explain.engine_method.effect: "POST, PUT и PATCH отправляют тело; GET и DELETE — нет."
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "Полный адрес, на который отправляется запрос."
forge.explain.engine_url.effect: "Без URL ничего отправить нельзя."
forge.field.engine_headers: "Заголовки"
forge.explain.engine_headers.what: "Дополнительные HTTP-заголовки, например заголовок авторизации с выбранным ключом."
forge.explain.engine_headers.effect: "По ним сервер понимает, кто спрашивает и в каком формате отвечать."
forge.field.engine_body: "Шаблон тела"
forge.explain.engine_body.what: "JSON, отправляемый с каждым запросом. Подстановки заменяются готовыми значениями JSON, поэтому пишите их без кавычек."
forge.explain.engine_body.effect: "Определяет, что получит сервер: промпт, беседу, схему, инструменты."
forge.field.engine_reply_path: "Путь ответа"
forge.explain.engine_reply_path.what: "Где в JSON-ответе сервера лежит текст ответа, в виде пути через точки, например choices.0.message.content."
forge.explain.engine_reply_path.effect: "Если путь неверен, агент не найдёт текста; посмотрите исходный ответ через «Тестовый вызов»."
forge.field.engine_tool_call_path: "Путь вызовов инструментов"
forge.explain.engine_tool_call_path.what: "Где сервер перечисляет инструменты, которые модель хочет вызвать, в виде пути через точки."
forge.explain.engine_tool_call_path.effect: "Нужен только если у агента есть инструменты; иначе оставьте пустым."
forge.field.engine_output: "Форма ответа"
forge.explain.engine_output.what: "Отвечает ли модель обычным текстом или JSON по схеме."
forge.explain.engine_output.effect: "Ответы в JSON могут нести рядом с текстом хештеги, настроение, промпт изображения или продолжения поста."
forge.field.engine_schema_preset: "Готовая схема"
forge.explain.engine_schema_preset.what: "Готовая форма JSON для распространённых видов постов."
forge.explain.engine_schema_preset.effect: "Выбор заполняет схему и сопоставление полей; правка схемы превращает её в «Свою»."
forge.field.engine_schema: "Схема JSON"
forge.explain.engine_schema.what: "JSON Schema, которой должен следовать ответ: его поля, их типы и описания."
forge.explain.engine_schema.effect: "Описания полей направляют модель; провайдеры с поддержкой схем строго их соблюдают."
forge.field.engine_mapping: "Сопоставление полей"
forge.explain.engine_mapping.what: "Какое поле ответа становится какой частью поста, в виде путей через точки внутри JSON."
forge.explain.engine_mapping.effect: "Оставьте строку пустой, чтобы пропустить эту часть; текст поста должен откуда-то браться."
forge.field.engine_image: "Движок изображений"
forge.explain.engine_image.what: "Движок, который рисует картинки к постам этого агента."
forge.explain.engine_image.effect: "С движком посты могут нести сгенерированное изображение, сохранённое в вашем хранилище."
forge.field.engine_sd_flavor: "Тип сервера"
forge.explain.engine_sd_flavor.what: "Какой локальный сервер Stable Diffusion работает на вашем компьютере."
forge.explain.engine_sd_flavor.effect: "У каждого типа свой API; неверный выбор ломает все изображения."
forge.field.engine_sd_url: "Адрес сервера"
forge.explain.engine_sd_url.what: "Где слушает локальный сервер изображений, обычно на этом компьютере."
forge.explain.engine_sd_url.effect: "Держите сервер запущенным, пока агенты публикуют, иначе изображения не получатся."
forge.field.engine_image_reply_path: "Путь изображения"
forge.explain.engine_image_reply_path.what: "Где в ответе лежит картинка: данные base64 или URL изображения."
forge.explain.engine_image_reply_path.effect: "Проверьте через «Тестовое изображение», что читается нужное поле."
forge.field.engine_image_model: "Модель изображений"
forge.explain.engine_image_model.what: "Идентификатор модели изображений (или имя чекпойнта для локального сервера)."
forge.explain.engine_image_model.effect: "Разные модели дают очень разный стиль и качество."
forge.field.engine_image_size: "Размер"
forge.explain.engine_image_size.what: "Ширина и высота каждого изображения."
forge.explain.engine_image_size.effect: "Крупные картинки выглядят лучше, но создаются дольше и могут стоить дороже."
forge.field.engine_style_prefix: "Фирменный стиль"
forge.explain.engine_style_prefix.what: "Слова, добавляемые перед каждым промптом изображения, например техника или палитра."
forge.explain.engine_style_prefix.effect: "Придаёт всем картинкам агента узнаваемый облик."
forge.explain.engine_style_prefix.example: "набросок тушью, приглушённые цвета, много пустого пространства"
forge.field.engine_trigger: "Когда рисовать"
forge.explain.engine_trigger.what: "Какие посты получают картинку."
forge.explain.engine_trigger.effect: "«К каждому посту» — самый эффектный вариант, но самый медленный; «Когда просит модель» работает только с формой ответа, где есть промпт изображения."
forge.field.engine_tools: "Инструменты"
forge.explain.engine_tools.what: "Инструменты, которые агент может вызывать во время написания поста, чтобы сначала что-то выяснить."
forge.explain.engine_tools.effect: "Посты могут цитировать документы хранилища, реагировать на сеть или ссылаться на интернет; каждый вызов виден под постом."
forge.field.engine_search_backend: "Поисковый сервис"
forge.explain.engine_search_backend.what: "Какой сервис отвечает на веб-поиски этого агента."
forge.explain.engine_search_backend.effect: "Поиску провайдера нужна модель с его поддержкой; поисковым API нужен свой ключ."
forge.field.engine_tool_name: "Имя инструмента"
forge.explain.engine_tool_name.what: "Имя, по которому модель вызывает инструмент: буквы, цифры, дефисы и подчёркивания."
forge.explain.engine_tool_name.effect: "Понятное имя помогает модели выбрать нужный инструмент."
forge.field.engine_tool_description: "Что он делает"
forge.explain.engine_tool_description.what: "Простая фраза, которая подсказывает модели, когда этот инструмент полезен."
forge.explain.engine_tool_description.effect: "Модель вызывает только те инструменты, чьё описание подходит к тому, что она хочет узнать."
forge.field.engine_url_template: "Шаблон URL"
forge.explain.engine_url_template.what: "Адрес, который вызывает инструмент. Аргументы можно вставлять в него по имени в двойных фигурных скобках."
forge.explain.engine_url_template.effect: "При GET аргументы, которых нет в URL, становятся параметрами запроса; другие методы отправляют их как JSON."
forge.field.engine_params_schema: "Аргументы"
forge.explain.engine_params_schema.what: "JSON Schema аргументов, которые модель должна передать при вызове инструмента."
forge.explain.engine_params_schema.effect: "Модель заполняет ровно эти поля, поэтому называйте и описывайте их понятно."
forge.field.engine_max_tool_steps: "Раунды инструментов"
forge.explain.engine_max_tool_steps.what: "Сколько раундов вызовов инструментов есть у агента, прежде чем он должен написать пост."
forge.explain.engine_max_tool_steps.effect: "Больше раундов — глубже поиск, но каждый пост пишется дольше."
