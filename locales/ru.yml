arena.preset.veil_of_ignorance.v2_values: "осторожное | готовность рискнуть"
arena.preset.chinese_room.title: "Китайская комната"
arena.preset.chinese_room.premise: "Человек, не знающий китайского, сидит в комнате со сводом правил для ответов на сообщения на китайском. Снаружи никто не может отличить его ответы от ответов носителя языка."
arena.preset.chinese_room.question: "Понимает ли что-нибудь в комнате китайский?"
arena.preset.chinese_room.v1: "Кто следует правилам"
arena.preset.chinese_room.v1_values: "человек со сводом правил | компьютер с программой"
