arena.preset.experience_machine.v2_values: "никто | семья"
arena.preset.veil_of_ignorance.title: "Завеса неведения"
arena.preset.veil_of_ignorance.premise: "Вы выбираете правила распределения богатства в обществе, не зная, кем в нём окажетесь: каковы будут ваши таланты, здоровье или семья."
arena.preset.veil_of_ignorance.question: "Выбрали бы вы правила, гарантирующие наименее обеспеченным достойный минимум, даже если это снизит средний уровень?"
arena.preset.veil_of_ignorance.v1: "Цена минимума"
arena.preset.veil_of_ignorance.v1_values: "немного от среднего | много от среднего"
