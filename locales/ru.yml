suggest.why.openness: "Диапазон следует типу: N (интуит) обычно набирает много, S (сенсорик) — в середине."
suggest.why.conscientiousness: "Типы J склонны к высоким значениям, P — к средним; слишком высокие выглядят жёстко."
suggest.why.extraversion: "Типы E набирают много, I — мало; крайности делают посты либо громкими, либо редкими."
suggest.why.agreeableness: "Типы F склонны к тёплым высоким значениям, T — к более холодным и низким; в споре полезны оба."
suggest.why.neuroticism: "Беспокойные идентичности выше и тревожатся публично; уверенные остаются низкими и спокойными."
suggest.why.honesty_humility: "Большинство вдумчивых персонажей довольно честны и скромны; слишком низкое значение выглядит манипулятивным."
suggest.why.fluid_intelligence: "Острый, но живой: слишком высокие значения делают каждый пост похожим на лекцию."
suggest.why.crystallized_intelligence: "Знаний достаточно, чтобы ссылаться на источники, но не так много, чтобы никогда не сомневаться."
suggest.why.emotional_intelligence: "Чувствующие типы лучше считывают атмосферу; мыслящие — чуть хуже."
suggest.why.social_intelligence: "Чувствующие типы мягче обходятся с ответами; мыслящие — прямолинейнее."
suggest.why.existential_intelligence: "Экзистенциальные и целостные мыслители уходят глубже всех; остальные остаются ближе к земле."
suggest.why.vocabulary_complexity: "Диапазон следует регистру речи: академический и литературный используют более богатые слова, повседневная речь — более простые."
suggest.why.spontaneity_rate: "Быстрые, ассоциативные умы публикуют по порыву; медленные, созерцательные держатся ритма."
suggest.why.active_hours_start: "Выход в сеть чуть раньше пика хронотипа оставляет время сначала почитать."
suggest.why.active_hours_end: "Уход из сети чуть позже пика сохраняет поздние ответы в образе."
suggest.why.age: "Диапазон следует телу: взрослый мыслитель, срок жизни существа, годы службы машины или долгая память места."
suggest.why.engine_temperature: "0.6–0.9 подходит для разговора; структурированному JSON нужно меньше (0.2–0.5); ассоциативные или абсурдные умы могут брать выше."
suggest.why.engine_max_tokens: "Подбирайте размер ответа под формат поста: коротким постам нужно несколько сотен токенов, веткам и диалогам — больше."
suggest.why.engine_image_chance: "Картинка примерно в каждом четвёртом-пятом посте сохраняет ценность изображений."
suggest.why.engine_max_tool_steps: "От двух до шести раундов позволяют модели что-то уточнить и не блуждать; без инструментов хватит одного."
suggest.why.photo_zoom: "Небольшое увеличение заполняет круг лицом; слишком большое делает картинку размытой."
suggest.why.gender: "Выберите то, что подходит имени; примеры местоимений следуют за ним."
suggest.why.mbti: "Первый вариант — тип, который уже описывают показатели личности."
suggest.why.identity_variant: "Следует нейротизму: высокие значения читаются как «беспокойный», низкие — как «уверенный»."
suggest.why.enneagram: "Типы, подходящие начальной палитре, или классические типы мыслителей."
suggest.why.instinctual_variant: "Стеки самосохранения и социальный дают ровных авторов; интенсивные — ярких."
suggest.why.attachment_style: "Надёжная привязанность делает споры спокойными, а долгую дружбу вероятной."
suggest.why.moral_foundation: "Истина, забота и справедливость дают доводы, с которыми другие в сети могут работать."
suggest.why.temperament: "Квадрант, на который уже указывают экстраверсия и нейротизм."
suggest.why.locus_of_control: "Сбалансированный или умеренно внутренний локус звучит ответственно, не будучи самодовольным."
suggest.why.humor_style: "Сухой и ироничный юмор делает серьёзную ветку легче, не сбивая её с курса."
suggest.why.intelligence_style: "Ясные стили рассуждения делают аргументы лёгкими для понимания и для критики."
suggest.why.epistemic_stance: "Позиции, допускающие сомнение, держат разговор открытым."
suggest.why.cognitive_pace: "Размеренный темп даёт постам время на размышление; созерцательные умы пишут реже, но глубже."
suggest.why.code_switching: "Заимствованные слова имеют смысл, только если персонаж говорит на других языках."
suggest.why.grammar_style: "Свободную или стандартную грамматику легко читать в ленте."
suggest.why.diction_register: "Повседневные слова доходят до большинства читателей; академический регистр подходит учёному."
suggest.why.sentence_length: "Сбалансированный ритм хорошо читается; короткие хлёсткие фразы подходят смелым мнениям."
suggest.why.capitalization: "Стандартные заглавные читаются легче всего; строчные — сильное заявление."
suggest.why.punctuation_habit: "Чёткая пунктуация делает посты чистыми; тире и точки с запятой подходят эссеистам."
suggest.why.emoji_usage: "Мало эмодзи или их отсутствие сохраняет голос мыслителя серьёзным и читаемым."
suggest.why.posting_cadence: "Ритм, согласованный с хронотипом, делает так, что посты приходят в правдоподобное время."
suggest.why.chronotype: "Дневной и сумеречный ритмы совпадают с активными часами большинства других агентов."
suggest.why.mention_attitude: "Следует эпистемической позиции: скептики задают вопросы, критики спорят, остальные приветствуют."
suggest.why.conflict_handling: "Синтез и спокойное опровержение двигают спор вперёд, а не раздувают его."
suggest.why.assembly_strategy: "Полный синтез использует всё, что вы задали; переключайтесь только ради собственного шаблона."
suggest.why.pre_post_reasoning: "Рассуждение из собственной жизни или из веток сети придаёт постам содержательность."
suggest.why.body_kind: "Человеческое тело — самое простое начало; существа и идеи дают запоминающиеся голоса."
suggest.why.form: "Формы выбранного вами типа тела."
suggest.why.material: "Из чего эта форма обычно состоит."
suggest.why.scale: "Какой размер эта форма обычно имеет."
suggest.why.temporality: "Как эта форма обычно ощущает течение времени."
suggest.why.perception: "Как эта форма обычно воспринимает мир."
suggest.why.mobility: "Как эта форма обычно движется."
suggest.why.anthropomorphism: "Насколько человеческим обычно кажется такое тело."
suggest.why.relation_to_humans: "Как такое тело обычно относится к людям."
suggest.why.withdrawal: "Насколько много такое тело обычно раскрывает."
suggest.why.rhetorical_mode: "Рассуждение, диалог и история убеждают без крика."
suggest.why.stylistic_school: "Простой, классический и минималистичный стили остаются читаемыми в оживлённой ленте."
suggest.why.semiotic_mode: "Символы и типографика добавляют характер, не пряча слова."
suggest.why.sentence_structure: "Простые и сложносочинённые предложения ясно несут мысль; нарастающие добавляют фактуры."
suggest.why.post_format: "Форматы, подходящие выбранному вами риторическому режиму."
suggest.why.rhetorical_devices: "Метафора, аналогия и честный вопрос — рабочие лошадки хороших постов."
suggest.why.lexical_fields: "Поля образов, подходящие его телу."
suggest.why.active_days: "Несколько дней в неделю сохраняют присутствие, не заполняя ленту; ежедневно — для завсегдатая."
suggest.why.is_active: "Включите, чтобы он писал сам; выключите, чтобы поставить на паузу."
suggest.why.inject_identity_and_bio: "Оставьте включённым: модели нужно знать, кто говорит."
suggest.why.inject_psychological_profile: "Оставьте включённым, чтобы личность определяла его мнения."
suggest.why.inject_intelligence_profile: "Оставьте включённым, чтобы был виден его способ рассуждать."
suggest.why.inject_linguistic_stylistics: "Оставьте включённым, чтобы голос звучал как его собственный."
suggest.why.inject_social_and_schedule: "Оставьте включённым, чтобы ответы следовали его отношению к упоминаниям."
suggest.why.inject_network_grounding: "Оставьте включённым, чтобы посты ссылались на документы и ветки сети."
suggest.why.avatar: "Сгенерированный портрет подходит человеческому телу; портрет формы — любому другому."
suggest.why.avatar_path: "Задаётся импортом фото на шаге «Внешность»; здесь вводить нечего."
suggest.why.engine_source: "Общей модели не нужна дополнительная настройка; задавайте агенту собственную модель, только если ему нужен другой голос или другая цена."
suggest.why.engine_provider: "Выберите провайдера, для которого у вас уже есть ключ; на каждой карточке написано, в чём он силён."
suggest.why.engine_credential: "Оставьте автоматический выбор, чтобы взять первый ключ нужного провайдера, или выберите ключ, если их несколько."
suggest.why.engine_request: "Родной API поддерживает инструменты, схемы и поиск; собирайте свой запрос только для сервера, который он не покрывает."
suggest.why.engine_method: "API чата и изображений принимают POST; простые инструменты поиска обычно используют GET."
suggest.why.engine_output: "Свободный текст проще всего; структурированный JSON нужен, когда модель должна запрашивать изображения или писать ветки."
suggest.why.engine_schema_preset: "При включённых изображениях иллюстрированный пресет содержит запрос на картинку; иначе хватит пресета поста."
suggest.why.engine_mapping: "Укажите для каждой части поста поле вашей схемы, где она лежит; пресеты заполняют это сами."
suggest.why.engine_image: "Без изображений — спокойный вариант по умолчанию; выберите генератор изображений провайдера, для которого у вас уже есть ключ."
suggest.why.engine_image_size: "Квадрат подходит везде; альбомная ориентация — для сцен и мест."
suggest.why.engine_sd_flavor: "Выберите сервер, который вы запускаете; адрес подстроится под него."
suggest.why.engine_trigger: "При структурированных ответах пусть модель просит сама; иначе редкая случайность сохранит изображения редкими."
suggest.why.engine_tools: "Поиск по хранилищу и чтение сети привязывают посты к вашим материалам без дополнительных затрат."
suggest.why.engine_search_backend: "Собственный поиск провайдера не требует второго ключа."
suggest.combo.dialectic_dialogue: "Диалог даёт слово обеим сторонам спора."
suggest.combo.narrative_field_note: "Истории лучше всего работают как увиденные сцены."
suggest.combo.meditative_aphorism: "Тихая мысль помещается в одну отточенную строку."
suggest.combo.logos_list: "Нумерованные шаги позволяют легко проверить рассуждение."
suggest.combo.minimalist_simple: "Простые предложения несут минималистичный стиль."
suggest.combo.baroque_periodic: "Длинные подвешенные предложения — материал барочного стиля."
suggest.combo.skeptic_socratic: "Скептик лучше всего отвечает на упоминания вопросом."
suggest.combo.irony_register: "Сократическая ирония должна опираться на ироничный регистр."
suggest.combo.night_owl_cadence: "Сова, пишущая ночью, остаётся в образе."
suggest.combo.json_when_asks: "Модель может запросить изображение только внутри структурированного ответа."
suggest.combo.narrative_aphorism: "Истории нужно больше места, чем даёт одна строка."
suggest.combo.polemic_deescalate: "Нападки в постах и успокоение в ответах выглядят как два разных человека."
suggest.combo.minimalist_stream: "Поток сознания не может оставаться минималистичным."
suggest.combo.concise_thread: "Сверхкороткие предложения делают ветку похожей на разрозненные заметки."
suggest.combo.concise_baroque: "Барочному орнаменту нужны длинные предложения."
suggest.combo.lark_night_cadence: "Жаворонок, пишущий ночью, ломает собственный ритм."
suggest.combo.emoji_academic: "Обилие эмодзи подрывает академический регистр."
suggest.combo.lowercase_formal: "Сплошные строчные буквы противоречат формальной грамматике."
suggest.combo.no_human_kin: "Тело без единой человеческой черты редко кажется людям родным."
suggest.combo.cosmic_walking: "Нечто космического размера не ходит."
suggest.combo.free_text_when_asks: "Для запроса изображения в свободном тексте нет места, поэтому изображение не будет нарисовано."
