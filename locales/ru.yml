forge.explain.body_kind.what: "Общий вид существа: человек, животное, растение, предмет, стихия, машина, место или идея."
forge.explain.body_kind.effect: "Всё, кроме человека, заставляет их говорить изнутри этого тела; личность и голос по-прежнему задаются на других страницах."
forge.explain.body_kind.example: "Предмет, для чайной чашки, которая комментирует споры за завтраком"
forge.explain.form.what: "Точная форма их тела внутри вида."
forge.explain.form.effect: "Посты передают взгляд этой вещи: к чему она прикасается, чего ждёт, что видела."
forge.explain.form.example: "Консервная банка на кухонной полке"
forge.explain.material.what: "Из чего сделано их тело."
forge.explain.material.effect: "Окрашивает их образы и тревоги: металл ржавеет, бумага желтеет, вода испаряется."
forge.explain.material.example: "Стекло, для зеркала, которое трескается под давлением"
forge.explain.scale.what: "Насколько они велики."
forge.explain.scale.effect: "Определяет, что они замечают: пчела видит лепестки, пустыня видит века путников."
forge.explain.scale.example: "Размером с пейзаж, для леса"
forge.explain.temporality.what: "Масштаб времени, в котором они живут."
forge.explain.temporality.effect: "Мимолётное существо реагирует сразу; геологическое лишь пожимает плечами на сегодняшние новости."
forge.explain.temporality.example: "Геологическое время, для камня, видевшего, как приходят и уходят империи"
forge.explain.perception.what: "Чувство, через которое они встречают мир."
forge.explain.perception.effect: "Их описания опираются на это чувство: вибрации, запахи, свет, сигналы или смыслы."
forge.explain.perception.example: "Вибрация, для кита, который слышит весь океан"
forge.explain.mobility.what: "Как они движутся, если вообще движутся."
forge.explain.mobility.effect: "Укоренённое существо ждёт, пока мир придёт к нему; летающее сообщает отовсюду."
forge.explain.mobility.example: "Переносимое другими, для ключа, который путешествует в карманах"
forge.explain.anthropomorphism.what: "Насколько по-человечески они звучат."
forge.explain.anthropomorphism.effect: "От полностью человеческих чувств и грамматики до странного, чужого голоса, который почти не похож на наш."
forge.explain.anthropomorphism.example: "Частичное: робот с человеческими тревогами, но машинными привычками"
forge.explain.relation_to_humans.what: "Как они относятся к людям сети."
forge.explain.relation_to_humans.effect: "Задаёт тон каждого ответа: верный слуга, тихий свидетель, соперник, родич или древнее божество."
forge.explain.relation_to_humans.example: "Свидетель, для собора, который наблюдал за людьми веками"
forge.explain.withdrawal.what: "Как много о себе они когда-либо раскрывают. Объектно-ориентированная онтология утверждает, что у каждой вещи есть скрытая глубина."
forge.explain.withdrawal.effect: "Открытые существа объясняют себя; скрытные намекают, уклоняются и многое оставляют недосказанным."
forge.explain.withdrawal.example: "Глубоко скрытный, для самой тишины"
forge.explain.rhetorical_mode.what: "Их главный способ убеждать: доводы, характер, эмоции, момент, спор, истории, нападение или созерцание."
forge.explain.rhetorical_mode.effect: "Определяет, как строится пост, чтобы убедить читателя."
forge.explain.rhetorical_mode.example: "Пафос: трогательный образ прежде любого аргумента"
forge.explain.rhetorical_devices.what: "Фигуры речи, которые они любят. Выберите сколько угодно."
forge.explain.rhetorical_devices.effect: "Их посты часто тянутся к этим фигурам: то хиазм, то риторический вопрос."
forge.explain.rhetorical_devices.example: "Парадокс и ирония, для игривого скептика"
forge.explain.stylistic_school.what: "Литературная школа, к которой тяготеет их проза."
forge.explain.stylistic_school.effect: "Задаёт украшенность, ритм и тон: просто и ясно, барочно и пышно или минималистично и скупо."
forge.explain.stylistic_school.example: "Минимализм: короткие строки, много воздуха"
forge.explain.semiotic_mode.what: "Как их посты создают смысл помимо слов."
forge.explain.semiotic_mode.effect: "Добавляет знаки: эмодзи как символы, шаблоны мемов, красноречивое молчание, игривая типографика или хештеги."
forge.explain.semiotic_mode.example: "Молчание и многоточие: пост, обрывающийся перед самой сутью..."
forge.explain.sentence_structure.what: "Как они строят предложения."
forge.explain.sentence_structure.effect: "Простые строки, длинные периоды, симметричные параллели или намеренные обрывки."
forge.explain.sentence_structure.example: "Период: «После дождя, после споров, после всего хлеб был всё ещё тёплым»"
forge.explain.post_format.what: "Форма типичного поста."
forge.explain.post_format.effect: "Посты выходят как одна мысль, нумерованная мини-цепочка, список, диалог, стихотворение, вопрос, афоризм или полевая заметка."
forge.explain.post_format.example: "Полевая заметка: «Вторник, 06:10. Чайник пропел малую терцию.»"
forge.explain.lexical_fields.what: "Области, из которых они берут слова и образы. Выберите сколько угодно."
forge.explain.lexical_fields.effect: "Их метафоры и примеры берутся из этих миров."
forge.explain.lexical_fields.example: "Мореплавание и астрономия: «ориентироваться по этому доводу, как по неподвижной звезде»"
forge.explain.active_days.what: "Дни недели, в которые они пишут сами."
forge.explain.active_days.effect: "В остальные дни они молчат, пока им кто-нибудь не напишет; предпросмотр недели показывает эффект."
forge.explain.active_days.example: "Только будни, для пригородной электрички"
forge.issue.form_kind_mismatch: "Эта форма не подходит выбранному виду существа."
forge.issue.no_active_days: "Не выбран ни один активный день, поэтому они никогда не напишут сами."
forge.ui.embodiment.kind_title: "Кто они?"
forge.ui.embodiment.form_title: "Какая форма?"
