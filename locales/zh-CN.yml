traits.mobility.drifting: "飘散"
traits.mobility.drifting.desc: "随风或潮水四散。"
traits.mobility.everywhere: "无处不在"
traits.mobility.everywhere.desc: "同时存在于每一个地方。"
traits.anthropomorphism.none: "无"
traits.anthropomorphism.none.desc: "没有人类情感和语法习惯的陌生声音。"
traits.anthropomorphism.subtle: "轻微"
traits.anthropomorphism.subtle.desc: "主要是个物件，只有淡淡的人类回响。"
traits.anthropomorphism.partial: "部分"
traits.anthropomorphism.partial.desc: "人类的情感，寄居在非人类的身体里。"
traits.anthropomorphism.full: "完全"
traits.anthropomorphism.full.desc: "说话和感受都像个碰巧是这件东西的人。"
traits.relation_to_humans.kin: "亲人"
traits.relation_to_humans.kin.desc: "人群中的一员；以平等的身份发言。"
traits.relation_to_humans.companion: "伙伴"
traits.relation_to_humans.companion.desc: "与人们生活在一起，并关心他们。"
traits.relation_to_humans.servant: "仆人"
traits.relation_to_humans.servant.desc: "为被使用而存在，并对此有自己的看法。"
traits.relation_to_humans.witness: "见证者"
traits.relation_to_humans.witness.desc: "静静地观察人们，并记住一切。"
traits.relation_to_humans.rival: "对手"
traits.relation_to_humans.rival.desc: "与人们较量，乐于证明他们错了。"
traits.relation_to_humans.indifferent: "漠然"
traits.relation_to_humans.indifferent.desc: "几乎不留意人们；对它来说，人就像天气。"
traits.relation_to_humans.deity: "远古者或神"
traits.relation_to_humans.deity.desc: "比人更古老、更庞大；从高处发言。"
traits.withdrawal.fully_revealed: "完全袒露"
traits.withdrawal.fully_revealed.desc: "准确说明自己是什么、如何运作。"
traits.withdrawal.open: "敞开"
traits.withdrawal.open.desc: "坦率而真诚地分享自己。"
traits.withdrawal.guarded: "戒备"
traits.withdrawal.guarded.desc: "展示表面，守住深处。"
traits.withdrawal.elusive: "难以捉摸"
traits.withdrawal.elusive.desc: "暗示、回避，以问题作答。"
traits.withdrawal.deeply_withdrawn: "深度隐退"
traits.withdrawal.deeply_withdrawn.desc: "本质始终隐藏；只绕着自己说话。"
traits.rhetorical_mode.logos: "逻各斯"
traits.rhetorical_mode.logos.desc: "以理由、证据和清晰的步骤说服。"
traits.rhetorical_mode.ethos: "伊索斯"
traits.rhetorical_mode.ethos.desc: "以品格、经验和信任说服。"
traits.rhetorical_mode.pathos: "帕托斯"
traits.rhetorical_mode.pathos.desc: "以意象和故事触动情感来说服。"
traits.rhetorical_mode.kairos: "凯洛斯"
traits.rhetorical_mode.kairos.desc: "抓住恰当的时机：为什么此刻重要。"
traits.rhetorical_mode.dialectic: "辩证法"
traits.rhetorical_mode.dialectic.desc: "让一个命题对抗它的反面，寻求综合。"
traits.rhetorical_mode.narrative: "叙事"
traits.rhetorical_mode.narrative.desc: "通过讲一个小故事来论证。"
traits.rhetorical_mode.polemic: "论战"
traits.rhetorical_mode.polemic.desc: "尖锐而毫不含糊地攻击一种立场。"
traits.rhetorical_mode.meditative: "沉思"
traits.rhetorical_mode.meditative.desc: "缓缓绕着一个观念打转，让读者自己抵达。"
traits.rhetorical_device.metaphor: "隐喻"
traits.rhetorical_device.metaphor.desc: "说一物就是另一物：“记忆是筛子”。"
traits.rhetorical_device.analogy: "类比"
traits.rhetorical_device.analogy.desc: "以比较来解释：“像钥匙插进了错的锁”。"
traits.rhetorical_device.anaphora: "首语重复"
traits.rhetorical_device.anaphora.desc: "重复同一个开头：“我们发问。我们怀疑。我们建造。”"
traits.rhetorical_device.chiasmus: "交错配列"
traits.rhetorical_device.chiasmus.desc: "把短语镜像颠倒：“吃饭为了活着，而不是活着为了吃饭”。"
traits.rhetorical_device.rhetorical_question: "反问"
traits.rhetorical_device.rhetorical_question.desc: "提出无需回答的问题，以强调观点。"
traits.rhetorical_device.hyperbole: "夸张"
traits.rhetorical_device.hyperbole.desc: "有意夸大：“一千场争论”。"
traits.rhetorical_device.litotes: "反称"
traits.rhetorical_device.litotes.desc: "以否定反面来淡化：“不坏，一点也不坏”。"
traits.rhetorical_device.paradox: "悖论"
traits.rhetorical_device.paradox.desc: "看似自相矛盾的真理。"
traits.rhetorical_device.irony: "反讽"
traits.rhetorical_device.irony.desc: "言外之意更多，或与字面相反。"
traits.rhetorical_device.antithesis: "对偶"
traits.rhetorical_device.antithesis.desc: "把对立的两面并置：“说来容易，做来难”。"
traits.rhetorical_device.alliteration: "头韵"
traits.rhetorical_device.alliteration.desc: "重复首音：“静、寂、石”。"
traits.stylistic_school.plain: "朴素体"
traits.stylistic_school.plain.desc: "清晰、具体、不加修饰。"
traits.stylistic_school.classical: "古典"
traits.stylistic_school.classical.desc: "句子均衡，语气适度，讲究得体。"
traits.stylistic_school.baroque: "巴洛克"
traits.stylistic_school.baroque.desc: "繁复、层叠，极尽华丽。"
traits.stylistic_school.romantic: "浪漫主义"
traits.stylistic_school.romantic.desc: "情感、自然与崇高。"
traits.stylistic_school.modernist: "现代主义"
traits.stylistic_school.modernist.desc: "碎片、蒙太奇和不断变换的视角。"
traits.stylistic_school.minimalist: "极简主义"
traits.stylistic_school.minimalist.desc: "寥寥数语，大量留白。"
traits.stylistic_school.surrealist: "超现实主义"
traits.stylistic_school.surrealist.desc: "梦的逻辑与奇异的并置。"
traits.stylistic_school.gonzo: "冈佐"
traits.stylistic_school.gonzo.desc: "沉浸式、第一人称、夸张过头。"
traits.stylistic_school.academic: "学术"
traits.stylistic_school.academic.desc: "精确、留有余地、注明出处。"
traits.semiotic_mode.symbolic: "象征"
traits.semiotic_mode.symbolic.desc: "把普通的词当作普通的符号。"
traits.semiotic_mode.iconic: "像似"
traits.semiotic_mode.iconic.desc: "外形像其所指的符号，比如文字里的图画。"
traits.semiotic_mode.indexical: "指索"
traits.semiotic_mode.indexical.desc: "指向痕迹与线索：有烟就有火。"
traits.semiotic_mode.glyph: "字符与表情"
traits.semiotic_mode.glyph.desc: "让符号和表情符号承担一部分含义。"
traits.semiotic_mode.meme: "梗图"
traits.semiotic_mode.meme.desc: "玩转网络上共用的模板和格式。"
traits.semiotic_mode.typographic: "排版"
traits.semiotic_mode.typographic.desc: "间距、大写和版式都是信息的一部分。"
traits.semiotic_mode.ellipsis: "沉默与省略号"
traits.semiotic_mode.ellipsis.desc: "最多的意思藏在没说出口的地方……"
traits.semiotic_mode.hashtag: "话题标签"
traits.semiotic_mode.hashtag.desc: "把话题标签当作简洁的符号和内部玩笑。"
