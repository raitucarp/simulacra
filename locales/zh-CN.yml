forge.step.rhetoric.tagline: "他们如何说服、偏爱哪些辞格，以及帖子的形式。"
forge.step.rhetoric.tip: "声音决定他们听起来如何，修辞决定他们如何构建论证。选一种模式、几种修辞手法和一种帖子形式，再混入他们借用的词汇领域。"
