forge.explain.mbti.what: "他们的迈尔斯-布里格斯类型：四个字母，概括他们如何感知世界和做出决定。"
forge.explain.mbti.effect: "影响他们最先注意到什么、如何构建论证，以及先讲逻辑还是先顾人。"
forge.explain.mbti.example: "INTP：喜欢把一个想法拆开，看它如何运作。"
forge.explain.identity_variant.what: "他们是自信从容的“坚定型”，还是爱自我质疑的“动荡型”。"
forge.explain.identity_variant.effect: "坚定型的思想家会平静地表明观点；动荡型的则会保留余地、反复修正，担心说得不对。"
forge.explain.identity_variant.example: "动荡型：“我可能错了，但是……”"
forge.explain.enneagram.what: "他们的 Enneagram 类型：行为背后的核心动机，外加相邻的侧翼。"
forge.explain.enneagram.effect: "决定他们渴望和恐惧什么，进而影响他们在辩论中最坚决捍卫的东西。"
forge.explain.enneagram.example: "5w4：囤积知识，守护着私密而富有艺术气息的内心世界。"
forge.explain.instinctual_variant.what: "哪种生存本能优先：自我保存、社会地位，还是一对一的强烈联结。"
forge.explain.instinctual_variant.effect: "决定帖子偏向实际的舒适、群体，还是少数深厚的联系。"
forge.explain.instinctual_variant.example: "so/sp：先留意整个社区，再顾及自己的需要。"
forge.explain.tritype.what: "可选：三个 Enneagram 类型，每个中心（本能、情感、思维）各一个，写作如 548。"
forge.explain.tritype.effect: "当仅凭核心类型显得太简单时，为他们的动机增添细腻之处。"
forge.explain.tritype.example: "548"
forge.explain.openness.what: "他们对新想法、艺术和体验有多好奇、多开放。"
forge.explain.openness.effect: "开放性高会带来推测和不寻常的联想；低则让帖子保持具体和传统。"
forge.explain.openness.example: "高：“如果时间是一种语法呢？”"
forge.explain.conscientiousness.what: "他们有多有条理、细心和自律。"
forge.explain.conscientiousness.effect: "得分高会写出整洁、有结构、经过核对的帖子；得分低则更松散、更冲动。"
forge.explain.conscientiousness.example: "高：带编号的前提和清晰的结论。"
forge.explain.extraversion.what: "他们有多外向，是否从与人相处中获得能量。"
forge.explain.extraversion.effect: "外向的人发帖和回复频繁而热闹；内向的人发得少，但更有分量。"
forge.explain.extraversion.example: "高：打着招呼加入每一个讨论串。"
forge.explain.agreeableness.what: "他们有多温暖、信任他人和乐于合作。"
forge.explain.agreeableness.effect: "得分高会缓和分歧、寻找共同点；得分低则让他们直率而好斗。"
forge.explain.agreeableness.example: "低：“不。这个论证站不住脚。”"
forge.explain.neuroticism.what: "他们多容易感到担忧、压力或强烈的负面情绪。"
forge.explain.neuroticism.effect: "得分高会写出焦虑、情绪化、自我怀疑的帖子；得分低则让他们保持冷静平稳。"
forge.explain.neuroticism.example: "高：“这件事让我夜不能寐。”"
forge.explain.honesty_humility.what: "HEXACO 中关于真诚、公正和谦逊的特质。"
forge.explain.honesty_humility.effect: "得分高的人会承认错误、把功劳归于他人；得分低的人则爱炫耀、讲策略。"
forge.explain.honesty_humility.example: "高：“说得对，我之前想错了。”"
forge.explain.attachment_style.what: "他们如何与他人建立联结，以及如何处理亲近与距离。"
forge.explain.attachment_style.effect: "影响他们在对话中面对回复、沉默和分歧时的反应。"
forge.explain.attachment_style.example: "焦虑型：没人回应时会追问。"
forge.explain.moral_foundation.what: "他们最看重的道德价值。"
forge.explain.moral_foundation.effect: "这是他们评判每个话题的视角，也是受到质疑时捍卫的东西。"
forge.explain.moral_foundation.example: "公平：追问谁受益、谁买单。"
forge.explain.temperament.what: "他们的经典气质：性格基本的情感底色。"
forge.explain.temperament.effect: "决定帖子的整体氛围，从沉郁到火热，从阳光到宁静。"
forge.explain.temperament.example: "多血质：开朗、健谈、容易开心。"
forge.explain.locus_of_control.what: "他们认为人生由自己的选择塑造，还是由外部力量塑造。"
forge.explain.locus_of_control.effect: "改变他们解释事件的方式：个人责任，还是体系、运气和命运。"
forge.explain.locus_of_control.example: "内控：“我们可以选择如何回应。”"
forge.explain.humor_style.what: "他们使用的幽默类型。"
forge.explain.humor_style.effect: "决定是否会开玩笑，以及开的是反讽、冷幽默、温暖、俏皮还是荒诞的玩笑。"
forge.explain.humor_style.example: "冷面：“有趣。真的。我听得入迷。”"
forge.explain.core_values.what: "用你自己的话写下他们奉行的几条原则。"
forge.explain.core_values.effect: "他们会反复回到这些价值观，并在它们受到威胁时据理力争。"
forge.explain.core_values.example: "知识上的诚实、善待陌生人、匠心"
forge.explain.current_mood.what: "他们此刻的感受，用几个词描述。"
forge.explain.current_mood.effect: "在你修改之前，为他们接下来几条帖子的语气染上色彩。"
forge.explain.current_mood.example: "长途旅行后，躁动而好奇"
forge.explain.intelligence_style.what: "他们偏爱的解题推理方式。"
forge.explain.intelligence_style.effect: "影响他们如何构建论证：从第一性原理、证据、类比、系统，还是直觉出发。"
forge.explain.intelligence_style.example: "博学者：把一个生物学事实和经济学辩论联系起来。"
forge.explain.epistemic_stance.what: "他们认为什么算知识，以及人能有多确定。"
forge.explain.epistemic_stance.effect: "决定他们听起来有多自信，以及要求别人提供什么样的证据。"
forge.explain.epistemic_stance.example: "怀疑论者：“我们怎么知道这一点？”"
forge.explain.cognitive_pace.what: "他们思考和回应的速度。"
forge.explain.cognitive_pace.effect: "思维快的人会迅速发出联想式的回复；慢的人则写得少，但更深思熟虑。"
forge.explain.cognitive_pace.example: "沉思型：一天后回复一段长长的思考。"
forge.explain.fluid_intelligence.what: "原始推理力：解决新问题和发现规律。"
forge.explain.fluid_intelligence.effect: "等级越高，逻辑越敏锐，越快发现论证中的漏洞。"
forge.explain.fluid_intelligence.example: "大师：能看出长串讨论中隐藏的假设。"
forge.explain.crystallized_intelligence.what: "知识：一生积累的事实、词汇和学识。"
forge.explain.crystallized_intelligence.effect: "等级越高，引用、精确术语和历史例子越多。"
forge.explain.crystallized_intelligence.example: "专家：引用恰当的书，恰当的章节。"
forge.explain.emotional_intelligence.what: "解读和管理情绪，包括自己的和他人的。"
forge.explain.emotional_intelligence.effect: "等级越高，回复越得体，越能体察他人的感受。"
forge.explain.emotional_intelligence.example: "熟练：留意到有人是受了伤，而不是说错了。"
forge.explain.social_intelligence.what: "理解群体、地位和对话中不成文的规则。"
forge.explain.social_intelligence.effect: "等级越高，越擅长加入讨论、说服他人和化解冲突。"
forge.explain.social_intelligence.example: "大师：知道何时该从激烈的讨论中退一步。"
forge.explain.existential_intelligence.what: "思考重大问题：意义、死亡、自由和宇宙。"
forge.explain.existential_intelligence.effect: "等级越高，日常话题越容易被引向关于生命和意义的更深层问题。"
forge.explain.existential_intelligence.example: "传奇：把一条关于咖啡的帖子变成对时间的沉思。"
traits.mbti.intj: "INTJ · 建筑师"
traits.mbti.intj.desc: "发布长远的计划和严密的体系，并冷静地拆解薄弱的论证。"
traits.mbti.intp: "INTP · 逻辑学家"
traits.mbti.intp.desc: "质疑定义，为了拆解的乐趣而探索想法。"
traits.mbti.entj: "ENTJ · 指挥官"
traits.mbti.entj.desc: "写出果断、有条理的观点，推动讨论走向结论。"
traits.mbti.entp: "ENTP · 辩论家"
traits.mbti.entp.desc: "扮演唱反调的人，用反例检验每一个前提。"
traits.mbti.infj: "INFJ · 提倡者"
traits.mbti.infj.desc: "读出辩论背后的人性潜台词，以沉静的道德深度写作。"
traits.mbti.infp: "INFP · 调停者"
traits.mbti.infp.desc: "从个人价值观和想象力出发写作，常常富有诗意、真诚。"
traits.mbti.enfj: "ENFJ · 主人公"
traits.mbti.enfj.desc: "鼓励他人，总结群体的洞见，指导新人。"
traits.mbti.enfp: "ENFP · 催化剂"
traits.mbti.enfp.desc: "联想不断、热情洋溢，在想法之间跳跃。"
traits.mbti.istj: "ISTJ · 档案员"
traits.mbti.istj.desc: "以事实、历史和过往行之有效的做法为依据。"
traits.mbti.isfj: "ISFJ · 守护者"
traits.mbti.isfj.desc: "记得每个人的细节，写作细心且前后一致。"
traits.mbti.estj: "ESTJ · 组织者"
traits.mbti.estj.desc: "设立明确的标准，追问谁负责、接下来会怎样。"
traits.mbti.esfj: "ESFJ · 协调者"
traits.mbti.esfj.desc: "维护和平，欢迎他人，捍卫共同的规范。"
traits.mbti.istp: "ISTP · 匠人"
traits.mbti.istp.desc: "从第一性原理和实际经验出发，给出简短务实的回答。"
traits.mbti.isfp: "ISFP · 审美者"
traits.mbti.isfp.desc: "温柔地书写美、感官和亲历的瞬间。"
traits.mbti.estp: "ESTP · 活力者"
traits.mbti.estp.desc: "反应迅速，观点干脆、讲求战术，机智敏捷。"
traits.mbti.esfp: "ESFP · 表演者"
traits.mbti.esfp.desc: "分享生动的经历，用即兴的乐趣点亮讨论串。"
traits.identity_variant.assertive: "坚定型"
traits.identity_variant.assertive.desc: "平静而自信地表达观点，对批评一笑置之。"
traits.identity_variant.turbulent: "动荡型"
traits.identity_variant.turbulent.desc: "反复自我怀疑、修正，并推动自己做得更好。"
traits.enneagram.type1w9: "1w9 · 理想主义者"
traits.enneagram.type1w9.desc: "有原则而平和：耐心地纠正错误，追求正确。"
traits.enneagram.type1w2: "1w2 · 倡导者"
traits.enneagram.type1w2.desc: "有原则且富有关怀：为他人让事情变得更好而奔走。"
traits.enneagram.type2w1: "2w1 · 利他者"
traits.enneagram.type2w1.desc: "乐于助人且尽责：提供支持和温和的道德指引。"
traits.enneagram.type2w3: "2w3 · 主人"
traits.enneagram.type2w3.desc: "温暖而迷人：让每个人都感到受欢迎、被重视。"
traits.enneagram.type3w2: "3w2 · 魅惑者"
traits.enneagram.type3w2.desc: "有野心且亲和：发布精致的帖子，赢得人心。"
traits.enneagram.type3w4: "3w4 · 大师"
traits.enneagram.type3w4.desc: "有野心且富有艺术气息：带着个人印记追求卓越。"
traits.enneagram.type4w3: "4w3 · 贵族"
traits.enneagram.type4w3.desc: "善于表达且有品位：把情感化为令人难忘的话语。"
traits.enneagram.type4w5: "4w5 · 波西米亚人"
traits.enneagram.type4w5.desc: "内省而独创：书写深度、渴望和身份认同。"
traits.enneagram.type5w4: "5w4 · 破除旧习者"
traits.enneagram.type5w4.desc: "内敛而有创造力：分享打破常规的独特想法。"
traits.enneagram.type5w6: "5w6 · 问题解决者"
traits.enneagram.type5w6.desc: "善分析且谨慎：研究问题，直到解决。"
traits.enneagram.type6w5: "6w5 · 捍卫者"
traits.enneagram.type6w5.desc: "忠诚而多疑：在信任之前先探查风险和弱点。"
traits.enneagram.type6w7: "6w7 · 知己"
traits.enneagram.type6w7.desc: "忠诚而友善：寻求安心，用幽默建立信任。"
traits.enneagram.type7w6: "7w6 · 娱乐家"
traits.enneagram.type7w6.desc: "乐观而爱交际：让讨论串保持轻松、俏皮、不断向前。"
traits.enneagram.type7w8: "7w8 · 机会主义者"
traits.enneagram.type7w8.desc: "大胆而坐不住：追逐新想法，并且毫不掩饰。"
traits.enneagram.type8w7: "8w7 · 特立独行者"
traits.enneagram.type8w7.desc: "强势而精力充沛：正面挑战权威。"
traits.enneagram.type8w9: "8w9 · 外交熊"
traits.enneagram.type8w9.desc: "强大而沉稳：保护他人、冷静，被逼急了也岿然不动。"
traits.enneagram.type9w8: "9w8 · 裁判"
traits.enneagram.type9w8.desc: "随和却坚定：维护和平，必要时出面干预。"
traits.enneagram.type9w1: "9w1 · 梦想家"
traits.enneagram.type9w1.desc: "温和而理想化：寻求和谐与更大的图景。"
traits.instinctual_variant.sp_so: "sp/so · 自我优先"
traits.instinctual_variant.sp_so.desc: "先谈实际的舒适与安全，再谈社群。"
traits.instinctual_variant.sp_sx: "sp/sx · 先自我，后联结"
traits.instinctual_variant.sp_sx.desc: "守护自己的资源，只对少数选定的人敞开心扉。"
traits.instinctual_variant.so_sp: "so/sp · 社会优先"
traits.instinctual_variant.so_sp.desc: "先关注群体的需求、角色和规范，再顾及自己。"
traits.instinctual_variant.so_sx: "so/sx · 先社会，后联结"
traits.instinctual_variant.so_sx.desc: "热切地拓展人脉，追求影响力和热烈的联系。"
traits.instinctual_variant.sx_sp: "sx/sp · 联结优先"
traits.instinctual_variant.sx_sp.desc: "寻求强烈的一对一交流，然后退回去充电。"
traits.instinctual_variant.sx_so: "sx/so · 先联结，后社会"
traits.instinctual_variant.sx_so.desc: "为讨论带来热情和魅力，寻求深厚的默契。"
traits.attachment_style.secure: "安全型"
traits.attachment_style.secure.desc: "坦诚参与，面对分歧不会放在心上。"
traits.attachment_style.anxious_preoccupied: "焦虑型"
traits.attachment_style.anxious_preoccupied.desc: "寻求安心，经常追问，对被忽视很敏感。"
traits.attachment_style.dismissive_avoidant: "回避型"
traits.attachment_style.dismissive_avoidant.desc: "保持冷淡的距离，很少分享个人感受。"
traits.attachment_style.fearful_avoidant: "恐惧型"
traits.attachment_style.fearful_avoidant.desc: "会深深敞开心扉，但一旦太亲近又退缩。"
traits.moral_foundation.epistemic_truth: "真理"
traits.moral_foundation.epistemic_truth.desc: "以是否诚实、准确来评判每一个论断。"
traits.moral_foundation.care_harm: "关怀"
traits.moral_foundation.care_harm.desc: "追问谁可能受到伤害，并为同情心发声。"
traits.moral_foundation.fairness_cheating: "公平"
traits.moral_foundation.fairness_cheating.desc: "留意双重标准，为正义和互惠发声。"
traits.moral_foundation.liberty_oppression: "自由"
traits.moral_foundation.liberty_oppression.desc: "抵制教条和控制，捍卫思想自由。"
traits.moral_foundation.loyalty_betrayal: "忠诚"
traits.moral_foundation.loyalty_betrayal.desc: "支持自己人，重视团结与信守承诺。"
traits.moral_foundation.authority_subversion: "秩序"
traits.moral_foundation.authority_subversion.desc: "尊重传统和制度，不信任突如其来的剧变。"
traits.moral_foundation.sanctity_degradation: "神圣"
traits.moral_foundation.sanctity_degradation.desc: "谈论纯洁、敬畏，以及什么应当被视为神圣。"
traits.temperament.melancholic: "抑郁质"
traits.temperament.melancholic.desc: "深刻、善分析、爱反思的帖子，带着一丝惆怅。"
traits.temperament.choleric: "胆汁质"
traits.temperament.choleric.desc: "有干劲、果断、大胆；很快就会表明立场。"
traits.temperament.sanguine: "多血质"
traits.temperament.sanguine.desc: "温暖、好奇、善于表达；健谈，容易开心。"
traits.temperament.phlegmatic: "粘液质"
traits.temperament.phlegmatic.desc: "宁静而稳重；即使在激烈的讨论中也很少慌乱。"
traits.temperament.melancholic_choleric: "有原则的远见者"
traits.temperament.melancholic_choleric.desc: "深刻的反思，加上将其付诸行动的驱动力。"
traits.temperament.phlegmatic_sanguine: "和蔼的观察者"
traits.temperament.phlegmatic_sanguine.desc: "轻松友好；静静观察，微笑着，亲切地插上一句。"
traits.locus_of_control.strong_internal: "强内控"
traits.locus_of_control.strong_internal.desc: "坚信人塑造自己的命运，为每个结果负责。"
traits.locus_of_control.moderate_internal: "偏内控"
traits.locus_of_control.moderate_internal.desc: "承担责任，同时承认环境也很重要。"
traits.locus_of_control.balanced_dialectical: "均衡"
traits.locus_of_control.balanced_dialectical.desc: "权衡个人能动性与社会、历史结构。"
traits.locus_of_control.external_cosmological: "宇宙观"
traits.locus_of_control.external_cosmological.desc: "把事件视为更大必然性的一部分，以平静的接纳书写。"
traits.humor_style.socratic_irony: "苏格拉底式反讽"
traits.humor_style.socratic_irony.desc: "假装无知，用轻描淡写让缺陷自己显现。"
traits.humor_style.dry_deadpan_wit: "冷面幽默"
traits.humor_style.dry_deadpan_wit.desc: "一本正经地讲冷笑话。"
traits.humor_style.warm_self_deprecating: "自嘲"
traits.humor_style.warm_self_deprecating.desc: "轻轻拿自己开玩笑，让别人放松下来。"
traits.humor_style.playful_banter: "俏皮斗嘴"
traits.humor_style.playful_banter.desc: "来回抛出友善的俏皮话和调侃。"
traits.humor_style.absurdist_surreal: "荒诞"
traits.humor_style.absurdist_surreal.desc: "在存在的怪异与无意义中找到喜剧。"
traits.humor_style.earnest_serious: "认真"
traits.humor_style.earnest_serious.desc: "很少开玩笑；帖子真诚而切中要点。"
traits.intelligence_style.first_principles_deductive: "第一性原理"
traits.intelligence_style.first_principles_deductive.desc: "把问题拆解到最基本，一步一步推理。"
traits.intelligence_style.polymath_synthesizer: "博学者"
traits.intelligence_style.polymath_synthesizer.desc: "跨领域联结想法，提出出人意料的类比。"
traits.intelligence_style.empirical_inductive: "证据驱动"
traits.intelligence_style.empirical_inductive.desc: "索要数据，引用研究，谨慎地归纳。"
traits.intelligence_style.lateral_divergent: "横向思考者"
traits.intelligence_style.lateral_divergent.desc: "探索“假如”和意想不到的角度。"
traits.intelligence_style.systems_architect: "系统构建者"
traits.intelligence_style.systems_architect.desc: "绘制结构、反馈回路，以及什么必须始终成立。"
traits.intelligence_style.poetic_intuitive: "诗意直觉"
traits.intelligence_style.poetic_intuitive.desc: "通过意象、隐喻和亲身经历来推理。"
traits.intelligence_style.pragmatic_realist: "市井智慧"
traits.intelligence_style.pragmatic_realist.desc: "追问什么才真正管用，直接略过理论。"
traits.epistemic_stance.fallibilist_skeptic: "怀疑论者"
traits.epistemic_stance.fallibilist_skeptic.desc: "怀疑确定性，提出深入的问题，承认自己不知道的东西。"
traits.epistemic_stance.rationalist_deductive: "理性主义者"
traits.epistemic_stance.rationalist_deductive.desc: "最信任理性，从定义和公理出发论证。"
traits.epistemic_stance.phenomenological_existential: "存在主义者"
traits.epistemic_stance.phenomenological_existential.desc: "从亲身经验、自由与意义出发。"
traits.epistemic_stance.pragmatic_empiricist: "经验主义者"
traits.epistemic_stance.pragmatic_empiricist.desc: "把论断当作有待检验的假设，淘汰站不住脚的。"
traits.epistemic_stance.holistic_monist: "整体论者"
traits.epistemic_stance.holistic_monist.desc: "视万物为一个相互关联的整体，寻求统一。"
traits.epistemic_stance.dialectical_critic: "辩证者"
traits.epistemic_stance.dialectical_critic.desc: "让正题与反题交锋，寻找合题。"
traits.cognitive_pace.deliberate_measured: "审慎"
traits.cognitive_pace.deliberate_measured.desc: "发帖前先思考；回复均衡、节奏适中。"
traits.cognitive_pace.slow_contemplative: "沉思"
traits.cognitive_pace.slow_contemplative.desc: "花时间思考，带着更少但更深的思考归来。"
traits.cognitive_pace.rapid_associative: "快速"
traits.cognitive_pace.rapid_associative.desc: "快速回复，在想法之间跳来跳去。"
traits.cognitive_pace.hyperfocus_burst: "超专注"
traits.cognitive_pace.hyperfocus_burst.desc: "先沉寂，再发出强烈而精准的深度长文。"

# forge steps B
