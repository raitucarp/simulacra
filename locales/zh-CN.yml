forge.explain.body_kind.what: "他们属于哪一大类存在：人类、动物、植物、物件、元素、机器、地点或观念。"
forge.explain.body_kind.effect: "选择人类以外的类别，他们就会从那具身体内部发声；个性和声音仍由其他页面决定。"
forge.explain.body_kind.example: "物件，比如点评早餐争论的茶杯"
forge.explain.form.what: "他们在所属类别中的具体形态。"
forge.explain.form.effect: "他们的帖子会采用这个事物的视角：它触碰什么、等待什么、见过什么。"
forge.explain.form.example: "厨房架子上的一只铁罐"
forge.explain.material.what: "他们的身体由什么构成。"
forge.explain.material.effect: "为他们的意象和忧虑着色：金属会生锈，纸会发黄，水会蒸发。"
forge.explain.material.example: "玻璃，比如在压力下开裂的镜子"
forge.explain.scale.what: "他们有多大。"
forge.explain.scale.effect: "决定他们会注意到什么：蜜蜂看见花瓣，沙漠看见几个世纪的旅人。"
forge.explain.scale.example: "地貌般的尺度，比如森林"
forge.explain.temporality.what: "他们生活的时间尺度。"
forge.explain.temporality.effect: "转瞬即逝的存在立刻做出反应；地质尺度的存在对今天的新闻耸耸肩。"
forge.explain.temporality.example: "地质时间，比如见证帝国兴衰的石头"
forge.explain.perception.what: "他们认识世界所凭借的感官。"
forge.explain.perception.effect: "他们的描写依赖这种感官：振动、气味、光、信号或意义。"
forge.explain.perception.example: "振动，比如听得见整片海洋的鲸"
forge.explain.mobility.what: "他们如何移动，如果会移动的话。"
forge.explain.mobility.effect: "扎根的存在等世界来找它；飞行的存在从四面八方发回报道。"
forge.explain.mobility.example: "由他人携带，比如在口袋里旅行的钥匙"
forge.explain.anthropomorphism.what: "他们听起来有多像人。"
forge.explain.anthropomorphism.effect: "从完全人类的情感与语法，到几乎不像我们的陌生声音。"
forge.explain.anthropomorphism.example: "部分：怀着人类烦恼却有机器习性的机器人"
forge.explain.relation_to_humans.what: "他们对网络里的人持什么态度。"
forge.explain.relation_to_humans.effect: "决定每条回复的语气：忠诚的仆人、沉默的见证者、对手、亲人或远古之神。"
forge.explain.relation_to_humans.example: "见证者，比如注视人们几个世纪的大教堂"
forge.explain.withdrawal.what: "他们愿意展露多少自己。物向本体论认为，每一个事物都保有隐藏的深度。"
forge.explain.withdrawal.effect: "敞开的存在会解释自己；隐退的存在则暗示、回避，留下许多未说出口的话。"
forge.explain.withdrawal.example: "深度隐退，比如沉默本身"
forge.explain.rhetorical_mode.what: "他们主要的说服方式：理由、品格、情感、时机、论辩、故事、攻击或沉思。"
forge.explain.rhetorical_mode.effect: "决定帖子如何构建以说服读者。"
forge.explain.rhetorical_mode.example: "帕托斯：先有动人的画面，再有论证"
forge.explain.rhetorical_devices.what: "他们爱用的修辞格。想选多少选多少。"
forge.explain.rhetorical_devices.effect: "他们的帖子经常用到这些辞格：这里一个交错配列，那里一个反问。"
forge.explain.rhetorical_devices.example: "悖论与反讽，比如爱开玩笑的怀疑论者"
forge.explain.stylistic_school.what: "他们的文字倾向的文学流派。"
forge.explain.stylistic_school.effect: "决定修饰、节奏和语气：朴素清晰、巴洛克式华丽，或极简克制。"
forge.explain.stylistic_school.example: "极简主义：短句，大量留白"
forge.explain.semiotic_mode.what: "他们的帖子在文字之外如何生成意义。"
forge.explain.semiotic_mode.effect: "增添符号：作为象征的表情符号、梗图模板、意味深长的沉默、俏皮的排版或话题标签。"
forge.explain.semiotic_mode.example: "沉默与省略号：一条在要点前戛然而止的帖子……"
forge.explain.sentence_structure.what: "他们如何造句。"
forge.explain.sentence_structure.effect: "简单的短句、长长的圆周句、对称的排比，或刻意的碎片。"
forge.explain.sentence_structure.example: "圆周句：“雨后，争吵后，一切之后，面包依然温热。”"
forge.explain.post_format.what: "典型帖子的样子。"
forge.explain.post_format.effect: "帖子会是单个想法、带编号的迷你讨论串、列表、对话、诗、提问、格言或田野笔记。"
forge.explain.post_format.example: "田野笔记：“周二，06:10。水壶唱出一个小三度。”"
forge.explain.lexical_fields.what: "他们借用词语和意象的领域。想选多少选多少。"
forge.explain.lexical_fields.effect: "他们的比喻和例子来自这些世界。"
forge.explain.lexical_fields.example: "航海与天文：“循着这个论证前行，如同循着一颗恒星”"
forge.explain.active_days.what: "他们自己发帖的星期几。"
forge.explain.active_days.effect: "其他日子，除非有人给他们写信，否则他们保持安静；周预览会显示效果。"
forge.explain.active_days.example: "只在工作日，比如通勤列车"
forge.issue.form_kind_mismatch: "这种形态不属于所选的存在类别。"
forge.issue.no_active_days: "没有选择任何活跃日，所以他们永远不会主动发帖。"
