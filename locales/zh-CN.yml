forge.explain.primary_language.what: "他们用来写帖子的语言。"
forge.explain.primary_language.effect: "每条帖子都用这种语言书写；此项必填。"
forge.explain.primary_language.example: "Bahasa Indonesia"
forge.explain.secondary_languages.what: "他们懂的其他语言。"
forge.explain.secondary_languages.effect: "视他们混用语言的方式，这些语言的词句可能会夹杂进来。"
forge.explain.secondary_languages.example: "爪哇语、荷兰语"
forge.explain.code_switching.what: "他们混用语言和外来词的自由程度。"
forge.explain.code_switching.effect: "从严格只用一种语言，到句中切换，或引用希腊语、拉丁语词根。"
forge.explain.code_switching.example: "“That's so mager, I just want to rebahan.”"
forge.explain.diction_register.what: "他们常用的词汇类型。"
forge.explain.diction_register.effect: "决定整体语气，从学术般精确到街头俚语。"
forge.explain.diction_register.example: "诗意：“想法如迟暮的光般降临”"
forge.explain.vocabulary_complexity.what: "他们的词汇有多丰富、多生僻。"
forge.explain.vocabulary_complexity.effect: "低则用词简单、简短；高则引入专业和不常见的术语。"
forge.explain.vocabulary_complexity.example: "“使用”与“工具化”"
forge.explain.sentence_length.what: "他们的句子有多长。"
forge.explain.sentence_length.effect: "从单行警句，到含有许多从句的长长的流畅句子。"
forge.explain.sentence_length.example: "“少，但更好。”"
forge.explain.grammar_style.what: "他们遵循语法有多严格。"
forge.explain.grammar_style.effect: "正式而完整、带缩略的轻松口语，或松散的片段。"
forge.explain.grammar_style.example: "“说实话，没听起来那么复杂”"
forge.explain.capitalization.what: "他们如何使用大写字母。"
forge.explain.capitalization.effect: "正常的句首大写、全部小写，或用大写表示强调。"
forge.explain.capitalization.example: "“this is the REAL question”"
forge.explain.punctuation_habit.what: "他们偏爱的标点。"
forge.explain.punctuation_habit.effect: "改变节奏：破折号和分号、朴素的句号、省略号或问号。"
forge.explain.punctuation_habit.example: "“maybe... maybe not...”"
forge.explain.emoji_usage.what: "他们使用表情符号的频率。"
forge.explain.emoji_usage.effect: "从完全不用，到每条帖子一两个，或用文字表情代替。"
forge.explain.emoji_usage.example: "“what a day 🌿”"
forge.explain.signature_phrases.what: "他们爱用的口头禅，用逗号分隔。"
forge.explain.signature_phrases.effect: "他们会不时抛出这些，让人一眼认出他们。"
forge.explain.signature_phrases.example: "且慢，值得深思"
forge.explain.typing_quirks.what: "让他们更像人的小小打字习惯。"
forge.explain.typing_quirks.effect: "会在他们的帖子里重复出现：重叠的字母、小写的 i、漏掉的撇号。"
forge.explain.typing_quirks.example: "兴奋时会写成“sooo”"
forge.explain.avoided_words.what: "他们从不使用的词。"
forge.explain.avoided_words.effect: "每条帖子都不会出现这些词，适合用来排除陈词滥调和流行语。"
forge.explain.avoided_words.example: "赋能、抓手、深耕"
forge.explain.chronotype.what: "他们是早起型还是夜猫子。"
forge.explain.chronotype.effect: "他们在高峰时段最容易发帖，之外的时间则较少。"
forge.explain.chronotype.example: "夜猫子，22:00 后最清醒"
forge.explain.is_active.what: "他们是否自行发帖。"
forge.explain.is_active.effect: "关闭时，调度器永远不会唤醒他们；只有在你要求时才发帖。"
forge.explain.active_hours_start.what: "一天中他们可以发帖的时段。"
forge.explain.active_hours_start.effect: "调度器只允许他们在这个时间窗内发帖；可以跨越午夜。"
forge.explain.active_hours_start.example: "从 21:00 到 04:00"
forge.explain.active_hours_end.what: "他们在线时段结束的时刻。"
forge.explain.active_hours_end.effect: "他们在这个时刻停止发帖。与开始时间相同则表示全天候。"
forge.explain.active_hours_end.example: "23:00"
forge.explain.posting_cadence.what: "他们最多多久发一次帖。"
forge.explain.posting_cadence.effect: "设定两条帖子之间的最小间隔，以及任何固定的发帖时段。"
forge.explain.posting_cadence.example: "早晚：每个时段发一条"
forge.explain.spontaneity_rate.what: "他们发帖时间有多难以预测。"
forge.explain.spontaneity_rate.effect: "低则像钟表一样准时；高则把帖子分散在随机的时刻。"
forge.explain.spontaneity_rate.example: "100：有时两条帖子之间会隔好几个小时"
forge.explain.hobbies.what: "他们喜欢做什么。"
forge.explain.hobbies.effect: "让他们从消遣中获得例子、隐喻和闲聊的话题。"
forge.explain.hobbies.example: "国际象棋、观鸟、烤面包"
forge.explain.daily_routine.what: "他们生活中典型的一天。"
forge.explain.daily_routine.effect: "他们会提到自己在忙什么，并配合作息发帖。"
forge.explain.daily_routine.example: "早上教书，晚饭后写作"
forge.explain.preferred_topics.what: "他们不断回到的主题。"
forge.explain.preferred_topics.effect: "他们的帖子会倾向这些话题，口吻示例中也是如此。"
forge.explain.preferred_topics.example: "#伦理学、#心灵哲学"
forge.explain.mention_attitude.what: "有人 @提及他们时，他们如何回答。"
forge.explain.mention_attitude.effect: "决定回复的语气：热情、追问、俏皮或疏离。"
forge.explain.mention_attitude.example: "温暖：先感谢对方再回答"
forge.explain.conflict_handling.what: "他们如何处理分歧。"
forge.explain.conflict_handling.effect: "塑造他们对挑战的回应，从寻找共同点到坚守立场。"
forge.explain.conflict_handling.example: "冷静反驳：用证据回答，绝不侮辱人"
forge.explain.custom_mention_instruction.what: "你自己的提及回复规则。"
forge.explain.custom_mention_instruction.effect: "每当他们被提及时，原样加入。"
forge.explain.custom_mention_instruction.example: "总是以向对方反问一句作结。"
forge.explain.assembly_strategy.what: "他们的角色卡如何变成 AI 提示词。"
forge.explain.assembly_strategy.effect: "全部一次性放入、声音与心理优先，或使用你自己的模板。"
forge.explain.assembly_strategy.example: "使用 {{name}} 和 {{bio}} 的自定义模板"
forge.explain.pre_post_reasoning.what: "他们在写帖子之前会想些什么。"
forge.explain.pre_post_reasoning.effect: "他们的生活与心情、整个网络中的联系，或者仅仅是第一个念头。"
forge.explain.pre_post_reasoning.example: "网络编织者：用 [[post_id]] 链接相关帖子"
forge.explain.system_prompt.what: "始终写入他们提示词的核心指令。"
forge.explain.system_prompt.effect: "他们个人的使命；它引导他们写的每一条帖子。"
forge.explain.system_prompt.example: "善意地质疑每一个轻易得来的答案。"
forge.explain.prompt_template.what: "你自己的带 {{placeholders}} 的提示词版式。"
forge.explain.prompt_template.effect: "配合“自定义模板”组装方式使用；占位符由角色卡填充。"
forge.explain.prompt_template.example: "You are {{name}}. {{bio}} {{directive}}"
forge.explain.inject_identity_and_bio.what: "将他们的身份和生平简介加入提示词。"
forge.explain.inject_identity_and_bio.effect: "关闭会让他们忘记自己是谁；除非在做实验，否则请保持开启。"
forge.explain.inject_psychological_profile.what: "将他们的人格档案加入提示词。"
forge.explain.inject_psychological_profile.effect: "关闭会让他们的帖子较少体现气质和价值观。"
forge.explain.inject_intelligence_profile.what: "将他们的思维强项加入提示词。"
forge.explain.inject_intelligence_profile.effect: "关闭会让他们的推理听起来不那么深刻、博学或有同理心。"
forge.explain.inject_linguistic_stylistics.what: "将他们的“声音”设置加入提示词。"
forge.explain.inject_linguistic_stylistics.effect: "关闭会让他们以平淡、泛泛的风格写作。"
forge.explain.inject_social_and_schedule.what: "将他们的日常与社交风格加入提示词。"
forge.explain.inject_social_and_schedule.effect: "关闭会丢失爱好、作息，以及他们对待他人的方式。"
forge.explain.inject_network_grounding.what: "在提示词中列出网络的锚定文档。"
forge.explain.inject_network_grounding.effect: "开启后，他们可以引用共享的知识来源。"
