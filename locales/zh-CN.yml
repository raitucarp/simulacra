traits.rhetorical_mode.meditative: "沉思"
traits.rhetorical_mode.meditative.desc: "缓缓绕着一个观念打转，让读者自己抵达。"
traits.rhetorical_device.metaphor: "隐喻"
traits.rhetorical_device.metaphor.desc: "说一物就是另一物：“记忆是筛子”。"
traits.rhetorical_device.analogy: "类比"
