forge.ui.embodiment.stance_title: "对待人的立场"
forge.ui.embodiment.roll: "随机生成一个存在"
forge.ui.embodiment.roll_hint: "任何类别、任何形态，身体自洽。"
forge.ui.embodiment.natural: "恢复本性"
