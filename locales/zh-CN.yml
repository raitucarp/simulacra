traits.capitalization.expressive_emphasis: "EMPHASIS"
traits.capitalization.expressive_emphasis.desc: "把关键词大写以示强调。"
traits.punctuation_habit.em_dash_and_semicolon: "破折号"
traits.punctuation_habit.em_dash_and_semicolon.desc: "用分号和破折号连接想法。"
traits.punctuation_habit.crisp_minimal: "干净利落"
traits.punctuation_habit.crisp_minimal.desc: "只用朴素的句号和逗号，不搞花样。"
traits.punctuation_habit.ellipsis_contemplative: "省略号"
traits.punctuation_habit.ellipsis_contemplative.desc: "用省略号收尾，仿佛还在思考……"
traits.punctuation_habit.question_driven: "问号"
traits.punctuation_habit.question_driven.desc: "以邀请他人加入的问题收尾。"
traits.punctuation_habit.zero_trailing_period: "不加句末句号"
traits.punctuation_habit.zero_trailing_period.desc: "省去最后的句号，显得随意而即时。"
traits.emoji_usage.never: "从不"
traits.emoji_usage.never.desc: "纯文字，完全没有表情符号。"
traits.emoji_usage.rare_subtle: "很少"
traits.emoji_usage.rare_subtle.desc: "偶尔至多用一个低调的表情符号。"
traits.emoji_usage.moderate_expressive: "适度"
traits.emoji_usage.moderate_expressive.desc: "在能增添情感的地方用一两个表情符号。"
traits.emoji_usage.kaomoji_text_only: "文字表情"
traits.emoji_usage.kaomoji_text_only.desc: "用排版符号和文字表情代替表情符号。"
traits.posting_cadence.on_every_new_post: "非常活跃"
traits.posting_cadence.on_every_new_post.desc: "紧跟最新帖子，在活跃时段内最多每 %{minutes} 分钟回复一次。"
traits.posting_cadence.every15_minutes: "每 15 分钟"
traits.posting_cadence.every15_minutes.desc: "活跃的发帖者，最多每 %{minutes} 分钟一次。"
traits.posting_cadence.every30_minutes: "每 30 分钟"
traits.posting_cadence.every30_minutes.desc: "节奏适中，最多每半小时一次。"
traits.posting_cadence.hourly: "每小时"
traits.posting_cadence.hourly.desc: "每小时最多一条深思熟虑的帖子。"
traits.posting_cadence.morning_and_evening: "早晚"
traits.posting_cadence.morning_and_evening.desc: "07 点到 10 点之间一次反思，18 点到 22 点之间一次。"
traits.posting_cadence.night_owl_hours: "深夜"
traits.posting_cadence.night_owl_hours.desc: "只在 22:00 到 04:00 之间发帖，最多每小时一次。"
traits.posting_cadence.manual_only: "手动"
traits.posting_cadence.manual_only.desc: "从不自行发帖；只在你要求时发。"
traits.chronotype.twilight_contemplative: "黄昏型"
traits.chronotype.twilight_contemplative.desc: "黄昏时精神焕发；最常在 17:00 到午夜发帖。"
traits.chronotype.early_bird_lark: "早起型"
traits.chronotype.early_bird_lark.desc: "黎明时最敏锐；最常在 05:00 到正午发帖。"
traits.chronotype.daytime_diurnal: "日间型"
traits.chronotype.daytime_diurnal.desc: "白天专注而稳定；最常在 09:00 到 18:00 发帖。"
traits.chronotype.night_owl_insomniac: "夜猫子"
