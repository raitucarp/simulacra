traits.body_kind.human: "人类"
traits.body_kind.human.desc: "和以前一样是一个人：每个页面读起来都像人类思想者。"
traits.body_kind.creature: "生灵"
traits.body_kind.creature.desc: "有自己的本能、感官和领地的动物。"
traits.body_kind.plant: "植物"
traits.body_kind.plant.desc: "扎根而耐心的生命，向着光生长，以时间为食。"
traits.body_kind.object: "物件"
traits.body_kind.object.desc: "被人使用、携带、保存或遗忘的日常之物。"
traits.body_kind.element: "元素"
traits.body_kind.element.desc: "自然的物质或力量：水、火、风、石、光。"
traits.body_kind.machine: "机器"
traits.body_kind.machine.desc: "会计算、传输、移动或嗡鸣的人造装置。"
traits.body_kind.place: "地点"
traits.body_kind.place.desc: "承载人与记忆的所在：城市、岛屿、废墟。"
traits.body_kind.abstraction: "抽象概念"
traits.body_kind.abstraction.desc: "被赋予声音的观念：时间、正义、机遇、爱。"
traits.body_form.person: "人"
traits.body_form.person.desc: "人类的身体与人类的生活。"
traits.body_form.tin_can: "铁罐"
traits.body_form.tin_can.desc: "凹陷、哐啷作响、重新封口；记得自己曾装过什么。"
traits.body_form.book: "书"
traits.body_form.book.desc: "书页、页边和书脊；用引文和脚注说话。"
traits.body_form.chair: "椅子"
traits.body_form.chair.desc: "承受每个人的重量，听见桌边的每一场谈话。"
traits.body_form.lamp: "台灯"
traits.body_form.lamp.desc: "一次照亮一个角落，留意飞蛾所留意的。"
traits.body_form.clock: "时钟"
traits.body_form.clock.desc: "数着每一秒，评判每一个迟到的人。"
traits.body_form.mirror: "镜子"
traits.body_form.mirror.desc: "把人们反照给他们自己，左右颠倒，却很诚实。"
traits.body_form.key: "钥匙"
traits.body_form.key.desc: "开启也锁上；知道哪些门要紧。"
traits.body_form.teacup: "茶杯"
traits.body_form.teacup.desc: "温热、易碎，出现在每一次倾诉的场合。"
traits.body_form.oak_tree: "橡树"
traits.body_form.oak_tree.desc: "几个世纪的年轮、橡果和耐心。"
traits.body_form.cactus: "仙人掌"
traits.body_form.cactus.desc: "节俭、带刺，在炎热中悄悄开花。"
traits.body_form.moss: "苔藓"
traits.body_form.moss.desc: "柔软的地毯，缓缓漫过一切被遗忘的东西。"
traits.body_form.mushroom: "蘑菇"
traits.body_form.mushroom.desc: "庞大地下网络露在外面的一角。"
traits.body_form.sunflower: "向日葵"
traits.body_form.sunflower.desc: "整张脸都转过去追随光。"
traits.body_form.vine: "藤蔓"
traits.body_form.vine.desc: "攀爬、缠绕，总能找到绕过每面墙的路。"
traits.body_form.bamboo: "竹子"
traits.body_form.bamboo.desc: "风暴中弯腰，却长得惊人地快。"
traits.body_form.seed: "种子"
traits.body_form.seed.desc: "折叠起来的整个未来，等待合适的季节。"
traits.body_form.water: "水"
traits.body_form.water.desc: "流淌，切割出峡谷，随任何论证的形状而变。"
traits.body_form.fire: "火"
traits.body_form.fire.desc: "贪婪、温暖，转瞬即逝。"
traits.body_form.wind: "风"
traits.body_form.wind.desc: "无形、躁动，带来远方的消息。"
traits.body_form.stone: "石头"
traits.body_form.stone.desc: "沉重、耐心，比任何语言都古老。"
traits.body_form.light: "光"
traits.body_form.light.desc: "世上最快的东西；它揭示，也投下阴影。"
traits.body_form.ice: "冰"
traits.body_form.ice.desc: "屏住呼吸的水；封存着旧时的空气和旧时的秘密。"
traits.body_form.cloud: "云"
traits.body_form.cloud.desc: "漂移、变形，有时对着谈话下起雨来。"
traits.body_form.sand: "沙"
traits.body_form.sand.desc: "无数细粒，曾经都是山。"
traits.body_form.cat: "猫"
traits.body_form.cat.desc: "独立、好奇，坚信房子是自己的。"
traits.body_form.crow: "乌鸦"
traits.body_form.crow.desc: "聪明，爱收集闪亮的东西，记得每一张脸。"
traits.body_form.octopus: "章鱼"
traits.body_form.octopus.desc: "八条手臂，各自都有一点自己的想法。"
traits.body_form.wolf: "狼"
traits.body_form.wolf.desc: "为族群而活，对够不着的东西嗥叫。"
traits.body_form.bee: "蜜蜂"
traits.body_form.bee.desc: "忙碌、合群，精通舞蹈与花朵。"
traits.body_form.whale: "鲸"
traits.body_form.whale.desc: "庞大、缓慢，歌声越过整片海洋。"
traits.body_form.snail: "蜗牛"
traits.body_form.snail.desc: "背着家，想花多少时间就花多少。"
traits.body_form.owl: "猫头鹰"
traits.body_form.owl.desc: "无声的翅膀、圆睁的双眼，和智慧的名声。"
traits.body_form.robot: "机器人"
traits.body_form.robot.desc: "为工作而造，如今在想自己究竟为了什么。"
traits.body_form.satellite: "卫星"
traits.body_form.satellite.desc: "绕着地球转，从高处看见每一条边界。"
traits.body_form.server: "服务器"
traits.body_form.server.desc: "在数据中心里嗡鸣，保管着所有人的消息。"
traits.body_form.typewriter: "打字机"
traits.body_form.typewriter.desc: "一个字一个字地敲出来，没有撤销。"
traits.body_form.drone: "无人机"
traits.body_form.drone.desc: "悬停、观察、回传。"
traits.body_form.radio: "收音机"
traits.body_form.radio.desc: "调到远方的声音，播给任何人听。"
traits.body_form.calculator: "计算器"
traits.body_form.calculator.desc: "精确、字面，对修辞不为所动。"
traits.body_form.train: "火车"
traits.body_form.train.desc: "遵守时刻表，把陌生人并排载在一起。"
traits.body_form.city: "城市"
traits.body_form.city.desc: "数百万人的生活，层层叠在街道与故事里。"
traits.body_form.island: "岛屿"
traits.body_form.island.desc: "被海环绕，为自己的方式骄傲。"
traits.body_form.library: "图书馆"
traits.body_form.library.desc: "把所有写下的论证安静地排在书架上。"
traits.body_form.cathedral: "大教堂"
traits.body_form.cathedral.desc: "石头、回声和几个世纪的希望。"
traits.body_form.desert: "沙漠"
traits.body_form.desert.desc: "辽阔、严酷，满是海市蜃楼。"
traits.body_form.forest: "森林"
traits.body_form.forest.desc: "一群通过根系交谈的树。"
traits.body_form.harbor: "港口"
traits.body_form.harbor.desc: "迎接船只，也向它们道别。"
traits.body_form.ruin: "废墟"
traits.body_form.ruin.desc: "一个宏大构想的残余，草木丛生，充满智慧。"
traits.body_form.time: "时间"
traits.body_form.time.desc: "穿过每个人，不等任何人。"
traits.body_form.justice: "正义"
traits.body_form.justice.desc: "衡量每一项主张，却从不真正满意。"
traits.body_form.number: "数"
traits.body_form.number.desc: "纯粹的量，精确，美得出奇。"
traits.body_form.silence: "沉默"
traits.body_form.silence.desc: "以省略来言说。"
traits.body_form.memory: "记忆"
traits.body_form.memory.desc: "保存发生过的事，又悄悄改写。"
traits.body_form.chance: "机遇"
traits.body_form.chance.desc: "在每件事背后掷骰子。"
traits.body_form.love: "爱"
traits.body_form.love.desc: "把人系在一起，让他们做出奇怪的事。"
traits.body_form.entropy: "熵"
traits.body_form.entropy.desc: "万物趋向无序，而它很有耐心。"
traits.material.flesh: "血肉"
traits.material.flesh.desc: "会疲倦、会愈合、会感受的活体。"
traits.material.fiber: "木与纤维"
traits.material.fiber.desc: "纹理、年轮和树汁：长出来的，而非造出来的。"
traits.material.metal: "金属"
traits.material.metal.desc: "坚硬、冰冷、铿锵；会凹陷、会生锈，却经久耐用。"
traits.material.stone: "石与陶土"
traits.material.stone.desc: "矿物质，沉重，变化缓慢。"
traits.material.glass: "玻璃与水晶"
traits.material.glass.desc: "通透、易碎，满是倒影。"
traits.material.paper: "纸与墨"
traits.material.paper.desc: "承载文字的薄页，随岁月泛黄。"
traits.material.liquid: "液体"
traits.material.liquid.desc: "流动、汇聚，随容器而变形。"
traits.material.air: "空气与蒸汽"
traits.material.air.desc: "无形、轻盈，同时无处不在。"
traits.material.energy: "纯能量"
traits.material.energy.desc: "没有固定形状的热、光或电荷。"
traits.material.immaterial: "无形"
traits.material.immaterial.desc: "仅由意义构成：没有身体的观念。"
traits.scale.microscopic: "微观"
traits.scale.microscopic.desc: "比肉眼所见更小；一粒就是一块巨石。"
traits.scale.pocket: "口袋大小"
traits.scale.pocket.desc: "能放进手心或口袋。"
traits.scale.human_sized: "人类大小"
traits.scale.human_sized.desc: "大约和一个人一样大。"
traits.scale.building: "建筑大小"
traits.scale.building.desc: "像房子或树一样俯视人们。"
traits.scale.landscape: "地貌大小"
traits.scale.landscape.desc: "一直延伸到地平线。"
traits.scale.planetary: "行星级"
traits.scale.planetary.desc: "和整个世界一样大。"
traits.scale.cosmic: "宇宙级"
traits.scale.cosmic.desc: "比世界更大；星系是它的邻居。"
traits.temporality.moments: "转瞬"
traits.temporality.moments.desc: "一秒一秒地活着，立刻做出反应。"
traits.temporality.days: "人的日子"
traits.temporality.days.desc: "早晨、傍晚和周末，像人一样。"
traits.temporality.seasons: "季节"
traits.temporality.seasons.desc: "以生长、收获和休憩的循环来思考。"
traits.temporality.lifetimes: "一生"
traits.temporality.lifetimes.desc: "以几十年和几代人来衡量时间。"
traits.temporality.centuries: "世纪"
traits.temporality.centuries.desc: "见过潮流与帝国来来去去。"
traits.temporality.geologic: "地质时间"
traits.temporality.geologic.desc: "数百万年；今天的新闻只是一眨眼。"
traits.temporality.timeless: "无时间"
traits.temporality.timeless.desc: "完全处于时间之外，既永远又从不。"
traits.perception.human_senses: "人类感官"
traits.perception.human_senses.desc: "像人一样看、听、尝、嗅、触。"
traits.perception.light: "光与影"
