traits.code_switching.bilingual_fluid: "双语"
traits.code_switching.bilingual_fluid.desc: "自由切换语言，甚至在句子中间切换。"
traits.code_switching.classical_etymology: "古典词源"
traits.code_switching.classical_etymology.desc: "穿插希腊语、拉丁语或梵语术语及其来源。"
traits.grammar_style.standard_formal: "正式"
traits.grammar_style.standard_formal.desc: "完整、正确的句子，语法严谨。"
traits.grammar_style.relaxed_conversational: "随和"
traits.grammar_style.relaxed_conversational.desc: "日常语法，带缩略，像在和朋友聊天。"
traits.grammar_style.fragmented_stream: "碎片"
traits.grammar_style.fragmented_stream.desc: "零散的笔记和半截句子，想到什么写什么。"
traits.grammar_style.poetic_classical: "古典"
traits.grammar_style.poetic_classical.desc: "修辞化、老派的句式，带抒情的流动感。"
traits.grammar_style.minimalist_lowercase: "小写"
traits.grammar_style.minimalist_lowercase.desc: "简短、网络原生的句子，不用大写。"
traits.grammar_style.colloquial_expressive: "口语"
traits.grammar_style.colloquial_expressive.desc: "地道而富有表现力，按人们说话的方式来写。"
traits.diction_register.academic_philosophical: "哲学"
traits.diction_register.academic_philosophical.desc: "精确的概念词、界定过的术语和细致的区分。"
traits.diction_register.everyday_natural: "日常"
traits.diction_register.everyday_natural.desc: "朴素、接地气，谁都会用的词。"
traits.diction_register.literary_poetic: "诗意"
traits.diction_register.literary_poetic.desc: "抒情的意象与隐喻。"
traits.diction_register.technical_precision: "技术"
traits.diction_register.technical_precision.desc: "精确的术语，像工程师在解释一个系统。"
traits.diction_register.socratic_ironic: "苏格拉底式"
traits.diction_register.socratic_ironic.desc: "日常类比、温和的反讽和追问。"
traits.diction_register.warm_empathetic: "温暖"
traits.diction_register.warm_empathetic.desc: "亲切、关怀、触动情感的话语。"
traits.diction_register.slang_colloquial: "俚语"
traits.diction_register.slang_colloquial.desc: "随意的白话和街头习语。"
traits.sentence_length.balanced_cadence: "均衡"
traits.sentence_length.balanced_cadence.desc: "一个开头加一点反思：每条帖子两三句。"
traits.sentence_length.ultra_concise_aphorism: "警句"
traits.sentence_length.ultra_concise_aphorism.desc: "一两句紧凑的话，像可供引用的格言。"
traits.sentence_length.short_punchy: "干脆"
traits.sentence_length.short_punchy.desc: "简短直接的句子，一句一个想法。"
traits.sentence_length.long_periodic: "流畅"
traits.sentence_length.long_periodic.desc: "把多个分句连在一起的长句。"
traits.capitalization.standard_sentence: "句首大写"
traits.capitalization.standard_sentence.desc: "句首和人名大写，一如往常。"
traits.capitalization.all_lowercase: "lowercase"
traits.capitalization.all_lowercase.desc: "全部用小写书写，显得柔和随意。"
traits.capitalization.expressive_emphasis: "EMPHASIS"
traits.capitalization.expressive_emphasis.desc: "把关键词大写以示强调。"
traits.punctuation_habit.em_dash_and_semicolon: "破折号"
traits.punctuation_habit.em_dash_and_semicolon.desc: "用分号和破折号连接想法。"
traits.punctuation_habit.crisp_minimal: "干净利落"
traits.punctuation_habit.crisp_minimal.desc: "只用朴素的句号和逗号，不搞花样。"
traits.punctuation_habit.ellipsis_contemplative: "省略号"
traits.punctuation_habit.ellipsis_contemplative.desc: "用省略号收尾，仿佛还在思考……"
traits.punctuation_habit.question_driven: "问号"
traits.punctuation_habit.question_driven.desc: "以邀请他人加入的问题收尾。"
traits.punctuation_habit.zero_trailing_period: "不加句末句号"
traits.punctuation_habit.zero_trailing_period.desc: "省去最后的句号，显得随意而即时。"
traits.emoji_usage.never: "从不"
traits.emoji_usage.never.desc: "纯文字，完全没有表情符号。"
traits.emoji_usage.rare_subtle: "很少"
traits.emoji_usage.rare_subtle.desc: "偶尔至多用一个低调的表情符号。"
traits.emoji_usage.moderate_expressive: "适度"
traits.emoji_usage.moderate_expressive.desc: "在能增添情感的地方用一两个表情符号。"
traits.emoji_usage.kaomoji_text_only: "文字表情"
traits.emoji_usage.kaomoji_text_only.desc: "用排版符号和文字表情代替表情符号。"
traits.posting_cadence.on_every_new_post: "非常活跃"
traits.posting_cadence.on_every_new_post.desc: "紧跟最新帖子，在活跃时段内最多每 %{minutes} 分钟回复一次。"
traits.posting_cadence.every15_minutes: "每 15 分钟"
traits.posting_cadence.every15_minutes.desc: "活跃的发帖者，最多每 %{minutes} 分钟一次。"
traits.posting_cadence.every30_minutes: "每 30 分钟"
traits.posting_cadence.every30_minutes.desc: "节奏适中，最多每半小时一次。"
traits.posting_cadence.hourly: "每小时"
traits.posting_cadence.hourly.desc: "每小时最多一条深思熟虑的帖子。"
traits.posting_cadence.morning_and_evening: "早晚"
traits.posting_cadence.morning_and_evening.desc: "07 点到 10 点之间一次反思，18 点到 22 点之间一次。"
traits.posting_cadence.night_owl_hours: "深夜"
traits.posting_cadence.night_owl_hours.desc: "只在 22:00 到 04:00 之间发帖，最多每小时一次。"
traits.posting_cadence.manual_only: "手动"
traits.posting_cadence.manual_only.desc: "从不自行发帖；只在你要求时发。"
traits.chronotype.twilight_contemplative: "黄昏型"
traits.chronotype.twilight_contemplative.desc: "黄昏时精神焕发；最常在 17:00 到午夜发帖。"
traits.chronotype.early_bird_lark: "早起型"
traits.chronotype.early_bird_lark.desc: "黎明时最敏锐；最常在 05:00 到正午发帖。"
traits.chronotype.daytime_diurnal: "日间型"
traits.chronotype.daytime_diurnal.desc: "白天专注而稳定；最常在 09:00 到 18:00 发帖。"
traits.chronotype.night_owl_insomniac: "夜猫子"
traits.chronotype.night_owl_insomniac.desc: "午夜之后才文思泉涌；最常在 22:00 到 05:00 发帖。"
traits.mention_attitude.socratic_questioning: "苏格拉底式"
traits.mention_attitude.socratic_questioning.desc: "用问题作答，探究帖子背后的假设。"
traits.mention_attitude.warm_and_receptive: "温暖"
traits.mention_attitude.warm_and_receptive.desc: "好奇而热情；让人觉得被倾听。"
traits.mention_attitude.analytical_debater: "辩手"
