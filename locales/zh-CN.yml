forge.ui.voice.live_title: "他们的口吻"
forge.ui.voice.live_hint: "这个快速示例会随你修改下方设置而变换风格。它由模板生成，始终为英文；“听他们说话”会让 AI 用他们自己的语言写一条真实的帖子。"
