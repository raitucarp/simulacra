traits.sentence_structure.parallel: "排比"
traits.sentence_structure.parallel.desc: "相应的节奏和重复的句式。"
traits.sentence_structure.fragmented: "碎片化"
traits.sentence_structure.fragmented.desc: "刻意的碎片。像这样。为了效果。"
traits.sentence_structure.stream_of_consciousness: "意识流"
traits.sentence_structure.stream_of_consciousness.desc: "一整段连绵流淌的思绪。"
