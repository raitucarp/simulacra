forge.field.engine_sampling: "采样"
forge.explain.engine_sampling.what: "温度决定用词有多大胆；token 上限决定一次回答最长多少。"
forge.explain.engine_sampling.effect: "低温度带来稳定、可预期的帖子；高温度带来更出人意料、也更容易跑题的帖子。"
forge.field.engine_endpoint: "端点"
forge.explain.engine_endpoint.what: "可选的地址，用来替代提供商的默认地址，例如代理或兼容的本地服务器。"
forge.explain.engine_endpoint.effect: "请求会改发到这个地址；除非确定需要，否则请留空。"
forge.field.engine_credential: "密钥"
forge.explain.engine_credential.what: "引擎这一部分使用哪个已存储的 API 密钥。密钥保存在设置 › AI 智能中，从不放在智能体里。"
forge.explain.engine_credential.effect: "“自动”会使用该服务的第一个密钥；手动选择则可以让不同智能体使用不同账户。"
forge.field.engine_request: "请求方式"
forge.explain.engine_request.what: "请求使用提供商自己的 API，还是你构建的原始 HTTP 请求。"
forge.explain.engine_request.effect: "自定义请求可以连接任何使用 JSON 的服务器，代价是要手动设置路径。"
forge.field.engine_method: "HTTP 方法"
forge.explain.engine_method.what: "请求所用的 HTTP 动词。"
forge.explain.engine_method.effect: "POST、PUT 和 PATCH 会发送请求体；GET 和 DELETE 不发送。"
forge.field.engine_url: "URL"
forge.explain.engine_url.what: "请求发送到的完整地址。"
forge.explain.engine_url.effect: "没有 URL 就什么也发不出去。"
forge.field.engine_headers: "请求头"
forge.explain.engine_headers.what: "额外的 HTTP 请求头，例如携带所选密钥的授权请求头。"
forge.explain.engine_headers.effect: "服务器靠它们得知是谁在请求，以及该用什么格式回答。"
forge.field.engine_body: "请求体模板"
forge.explain.engine_body.what: "每次请求随附发送的 JSON。占位符会被替换为现成的 JSON 值，所以写的时候不要加引号。"
forge.explain.engine_body.effect: "它决定服务器收到什么：提示词、对话、模式和工具。"
forge.field.engine_reply_path: "回复路径"
forge.explain.engine_reply_path.what: "回答文本在服务器 JSON 回复中的位置，用点分路径表示，例如 choices.0.message.content。"
forge.explain.engine_reply_path.effect: "路径错误时智能体找不到文本；可用测试调用查看原始回复。"
forge.field.engine_tool_call_path: "工具调用路径"
forge.explain.engine_tool_call_path.what: "服务器列出模型想调用的工具的位置，用点分路径表示。"
forge.explain.engine_tool_call_path.effect: "只有这个智能体有工具时才需要；否则留空即可。"
forge.field.engine_output: "回答格式"
forge.explain.engine_output.what: "模型用纯文本回答，还是用遵循模式的 JSON 回答。"
forge.explain.engine_output.effect: "JSON 回答除正文外，还能附带话题标签、情绪、图像提示词或后续帖子。"
forge.field.engine_schema_preset: "模式预设"
forge.explain.engine_schema_preset.what: "为常见帖子类型准备好的 JSON 结构。"
forge.explain.engine_schema_preset.effect: "选择后会填好模式和字段映射；编辑模式后会变为“自定义”。"
forge.field.engine_schema: "JSON 模式"
forge.explain.engine_schema.what: "回答必须遵循的 JSON Schema：字段、类型和描述。"
forge.explain.engine_schema.effect: "字段描述会引导模型；支持模式的提供商会严格执行。"
forge.field.engine_mapping: "字段映射"
forge.explain.engine_mapping.what: "回答中的哪个字段变成帖子的哪一部分，用指向 JSON 的点分路径表示。"
forge.explain.engine_mapping.effect: "某行留空即忽略该部分；帖子正文必须有来源。"
forge.field.engine_image: "图像引擎"
forge.explain.engine_image.what: "为这个智能体的帖子作画的引擎。"
forge.explain.engine_image.effect: "有了引擎，帖子就能附带生成的图片，并保存在你的知识库中。"
forge.field.engine_sd_flavor: "服务器类型"
forge.explain.engine_sd_flavor.what: "你电脑上运行的本地 Stable Diffusion 服务器类型。"
forge.explain.engine_sd_flavor.effect: "每种类型的 API 都不同；选错会导致所有图片生成失败。"
forge.field.engine_sd_url: "服务器地址"
forge.explain.engine_sd_url.what: "本地图像服务器监听的位置，通常在这台电脑上。"
forge.explain.engine_sd_url.effect: "智能体发帖期间请保持服务器运行，否则图片会生成失败。"
forge.field.engine_image_reply_path: "图像路径"
forge.explain.engine_image_reply_path.what: "回复中图片所在的位置，可以是 base64 数据或图片 URL。"
forge.explain.engine_image_reply_path.effect: "用测试图像检查它是否读取了正确的字段。"
forge.field.engine_image_model: "图像模型"
forge.explain.engine_image_model.what: "图像模型 ID（本地服务器则为检查点名称）。"
forge.explain.engine_image_model.effect: "不同模型的风格和质量差别很大。"
forge.field.engine_image_size: "尺寸"
forge.explain.engine_image_size.what: "每张图片的宽度和高度。"
forge.explain.engine_image_size.effect: "图片越大越好看，但耗时更长，费用也可能更高。"
forge.field.engine_style_prefix: "统一画风"
forge.explain.engine_style_prefix.what: "加在每条图像提示词前面的词语，例如画材或配色。"
forge.explain.engine_style_prefix.effect: "让这个智能体的所有图片拥有一眼可辨的统一风格。"
forge.explain.engine_style_prefix.example: "墨水速写，柔和色调，大量留白"
forge.field.engine_trigger: "何时作画"
forge.explain.engine_trigger.what: "哪些帖子会配图。"
forge.explain.engine_trigger.effect: "每帖配图最醒目但最慢；“模型请求时”只适用于含图像提示词的回答格式。"
forge.field.engine_tools: "工具"
forge.explain.engine_tools.what: "智能体写帖子时可调用的工具，用来先查资料。"
forge.explain.engine_tools.effect: "帖子可以引用知识库文档、回应网络动态或引用网页；每次工具调用都会显示在帖子下方。"
forge.field.engine_search_backend: "搜索服务"
forge.explain.engine_search_backend.what: "由哪个服务响应这个智能体的网页搜索。"
forge.explain.engine_search_backend.effect: "提供商搜索需要支持该功能的模型；搜索 API 需要各自的密钥。"
forge.field.engine_tool_name: "工具名称"
forge.explain.engine_tool_name.what: "模型调用该工具时使用的名称：字母、数字、短横线和下划线。"
forge.explain.engine_tool_name.effect: "清楚的名称有助于模型选对工具。"
forge.field.engine_tool_description: "功能说明"
forge.explain.engine_tool_description.what: "用一句平实的话告诉模型这个工具在什么时候有用。"
forge.explain.engine_tool_description.effect: "模型只会调用描述与它想了解的内容相符的工具。"
forge.field.engine_url_template: "URL 模板"
forge.explain.engine_url_template.what: "工具调用的地址。参数可以用双花括号括住名称后放入其中。"
forge.explain.engine_url_template.effect: "使用 GET 时，不在 URL 中的参数会成为查询参数；其他方法则以 JSON 发送。"
forge.field.engine_params_schema: "参数"
forge.explain.engine_params_schema.what: "模型调用工具时必须提供的参数的 JSON Schema。"
forge.explain.engine_params_schema.effect: "模型会准确填写这些字段，所以请清楚地命名和描述它们。"
forge.field.engine_max_tool_steps: "工具轮数"
forge.explain.engine_max_tool_steps.what: "智能体在必须写帖子之前可以进行几轮工具调用。"
forge.explain.engine_max_tool_steps.effect: "轮数越多，研究越深入，但每条帖子也越慢。"
forge.issue.engine_credential_missing: "尚未为此引擎存储 %{service} 密钥。"
forge.issue.engine_credential_gone: "此引擎使用的某个密钥已被删除。"
forge.issue.engine_url_empty: "某个自定义请求、图像服务器或工具没有 URL。"
